(function() {
  function withFreshParam(href) {

<script>
(function() {
  var storageKey = "help_theme";
  function preferredTheme() {
    try {
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    } catch (e) {
      return "light";
    }
  }
  function applyTheme(t) {
    if (t === "dark" || t === "light") {
      document.documentElement.setAttribute("data-theme", t);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }
  function getSaved() {
    try { return localStorage.getItem(storageKey) || ""; } catch (e) { return ""; }
  }
  function setSaved(t) {
    try { localStorage.setItem(storageKey, t); } catch (e) {}
  }
  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") || preferredTheme();
  }
  function updateLabels() {
    var cur = currentTheme();
    var label = (cur === "dark") ? "Light mode" : "Dark mode";
    document.querySelectorAll(".theme-toggle").forEach(function(btn) {
      btn.textContent = label;
    });
  }
  function toggleTheme() {
    var cur = currentTheme();
    var next = (cur === "dark") ? "light" : "dark";
    applyTheme(next);
    setSaved(next);
    updateLabels();
  }
  function bind() {
    document.querySelectorAll(".theme-toggle").forEach(function(btn) {
      btn.addEventListener("click", function() {
        toggleTheme();
      });
    });
    updateLabels();
  }
  var saved = getSaved();
  applyTheme(saved || preferredTheme());
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bind);
  } else {
    bind();
  }
})();
</script>

<script id="help-hilite">
(function() {
  function getParam(name) {
    try {
      var u = new URL(window.location.href);
      return u.searchParams.get(name) || "";
    } catch (e) {
      return "";
    }
  }

  function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function highlight(root, term) {
    if (!term || term.length < 2) return;
    var rx = new RegExp(escapeRegExp(term), "gi");
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function(node) {
        if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        var p = node.parentNode;
        if (!p) return NodeFilter.FILTER_REJECT;
        var tag = (p.tagName || "").toUpperCase();
        if (tag === "SCRIPT" || tag === "STYLE" || tag === "MARK") return NodeFilter.FILTER_REJECT;
        if (p.closest && p.closest("mark")) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    }, false);

    var nodes = [];
    var n, count = 0;
    while ((n = walker.nextNode()) && count < 2000) {
      nodes.push(n); count++;
    }

    nodes.forEach(function(textNode) {
      var text = textNode.nodeValue;
      if (!rx.test(text)) return;
      rx.lastIndex = 0;

      var frag = document.createDocumentFragment();
      var last = 0;
      var m;
      while ((m = rx.exec(text)) !== null) {
        var start = m.index;
        var end = start + m[0].length;
        if (start > last) frag.appendChild(document.createTextNode(text.slice(last, start)));
        var mark = document.createElement("mark");
        mark.textContent = text.slice(start, end);
        frag.appendChild(mark);
        last = end;
        if (frag.childNodes.length > 200) break;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      if (frag.childNodes.length) textNode.parentNode.replaceChild(frag, textNode);
    });
  }

  function apply() {
    var q = getParam("q");
    if (!q) return;
    q = q.trim();
    if (!q) return;

    var parts = q.split(/\s+/).filter(function(x) { return x.length >= 3; }).slice(0, 5);
    if (!parts.length) return;

    parts.forEach(function(p) {
      highlight(document.body, p);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", apply);
  } else {
    apply();
  }
})();
</script>
