 \n6.3. \nInstall Report Packs .................................................................................................................. 8 \n6.4. \nDeploy the Installed Report Packs ............................................................................................... 8 \n6.5. \nRun SQL Update Scripts ............................................................................................................. 8 \n6.6. \nCreate a Report Suite Desktop Shortcut ....................................................................................... 8 \n6.7. \nOpen Report Suite .................................................................................................................... 8 \n7. \nStart Reporting ................................................................................................................................ 9 \n7.1. \nReport Suite Icon ..................................................................................................................... 9 \n7.2. \nReport Suite Switchboards ......................................................................................................... 9 \n8. \nReport Navigation ..........................................................................................................................10 \n8.1. \nReport Selection ..................................................................................................................... 10 \n8.2. \nReport Layout & Navigation...................................................................................................... 11 \n9. \nRunning Reports .............................................................................................................................12 \n9.1. \nView Report Button ................................................................................................................. 12 \n9.2. \nSelecting Report Parameters .................................................................................................... 12 \n9.2.1. \nDate Time Parameters .......................................................................................................................... 12 \n9.2.2. \nMultiple Select Parameters ..................................................................................................................... 13 \n9.3. \nSelect Export Format ............................................................................................................... 13 \n10. \nTechnical Support ...........................................................................................................................14\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - User Manual \n \n \n \n \n \n \n \nP a g e | 3 \n1. Introduction \nThe Adroit Report Suite is a value-add information system based on specific Adroit agent data logged to \nan OLE DB database. Information is presented in the form of web based reporting through the Microsoft \nSQL Server Reporting Services platform. The technology is distributed as a free add-on solution to Adroit \nSCADA. \n \nThe suite consists of report packs and a Report Deployment Utility. Each report pack includes a set of \nreports specifically designed to report relevant and accurate information on the Adroit system and \nspecific Adroit agents. \n \nThis document provides a basic introduction to Adroit Technologies and the Adroit Report Suite value-\nadd system, with a brief overview of the Adroit SCADA software package for the purpose of convenience \nand reference. \n \n1.1. \nAdroit Technologies \nSince 1992 Adroit Technologies, a company based in South Africa, have been developing SCADA/HMI \nsoftware solutions for the industrial automation and process control industries. With over 20,000 \nsuccessful installations, in over 16 countries in the world, Adroit is one of the world’s top selling \nSCADA/HMI products. \n \nAdroit Technologies are a Microsoft Certified Gold Partner Company. This allows Adroit Technologies to \nstay in regular contact with Microsoft and remain up to date with the latest advancements in software \ndevelopment. All this ensures that Adroit remains one of the leading SCADA packages, both now and \nin the future. \n \n1.2. \nAdroit SCADA \nA.D.R.O.I.T means skilful, or dexterous, it is also an acronym for “Advanced Distributed Real-time \nObject-oriented Intelligent Toolkit”. \n \nAdroit is a Windows based SCADA/HMI software product that has been developed over a period of more \nthan ten years by dedicated professionals. Robust and flexible enough for the toughest industrial \napplication, Adroit is the ideal platform from which to meet the information needs of a modern control \nsolution. \n \nAdroit is a technologically advanced SCADA (Supervisory Control & Data Acquisition) system designed \nfor process control, manufacturing systems and open automation applications. \n \nDeveloped specifically for Windows operating systems, Adroit has a flexible object-oriented client server \narchitecture that supports from a standalone implementation to an installation spanning multiple sites.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - User Manual \n \n \n \n \n \n \n \nP a g e | 4 \n2. Report Suite Features \n• \nOff The Shelf Reporting – All reports have been pre-configured. Simply enable the required Adroit \nlogging mechanism or Adroit SCADA intelligence. \n• \nWeb Based Reporting – no front-end software required; just double click on your Adroit Report \nSuite shortcut or type in the path \n• \nFlexible Analysis – analyse on different hierarchy levels with dynamic filter sets \n• \nDrill Through Reports – drill through from summary reports into more detailed reports at the click \nof a button \n• \nPrinter Friendly Reports – generated reports can be printed fully with all relevant details, including \npage breaks \n• \nExport Report Data – all reports can be easily exported to Excel, Word, MHTML (web archive) or \nPDF format \n• \nUser-Defined Reports Schedule – reporting parameters and settings can be defined by each \nindividual user based on their reporting requirements (only with SQL standard edition and above) \n• \nWindows Authenticated Security – IT administrators can give each individual user or groups \naccess and user rights on any report or report folder \n• \nEasy Report Deployment – managing report deployment and SQL update scripts made simple with \nthe Report Suite Deployment Utility \n• \nOpen Technology – built-in standard Microsoft SQL Reporting Services allowing users to customise \nand create new reports on Adroit data \n• \nDemo Data – Some sample data is included for each report pack to offer a quick reference of what \nto expect of each available report in the report pack.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - User Manual \n \n \n \n \n \n \n \nP a g e | 5 \n3. Adroit Report Suite Components \n \n3.1. Database Platform \nThe Adroit Report Suite is built on the Microsoft SQL Server 2008 R2 database platform with SQL Server \nReporting Services (SSRS). Adroit is now shipped with SQL Server 2014 Express with Advanced Services \n(SSRS) and with the Adroit Report Suite. The Adroit Report Suite is a free add-on, although some of the \nreport packs are based on data from licensed Adroit agents. \n \n3.2. Report User Interface is Internet Explorer \nThe Report Suite front end is essentially a set of switchboard reports (built-in SSRS) used to navigate \nbetween report sets and to select which reports to view. Each set of reports are based on a standard \nAdroit logging mechanism such as the Alarm Management agent, the DB Log agent and also the Adroit \nAgent Server auditing. \n \n3.3. Report Packs \nThe report sets are developed and distributed as report packs, which require installation and deployment \nto the SQL Reporting Server. \n \nA report pack is a combination of Reporting Services Reports, Data Sources, Components and Resources \nall in one manageable “pack” which is made available as installation files for easy installation. \n \nWhen a new version of a report set is made available it will be distributed as a new report pack which \nwill include the updated reports as well as the scripts required to update existing databases if needed. \n \n3.4. Adroit Report Deployment Utility \nThe Report Deployment Utility is shipped with the Adroit Report Suite and has been developed to assist \nwith report pack deployment and also with running of the latest updates’ scripts should this be required. \n \n3.5. Data Sources \nEach set of reports has a SQL Data Source. This data source is the actual database that the reports will \nextract data from to present to the end-user. It is possible to change the data source to another valid \ndatabase at any point (i.e. alarm management reports must be linked to an alarm management \ndatabase), including connecting to the demonstration dataset installed with the Report Suite. The data \nsources can be managed through the Adroit Report Deployment Utility.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - User Manual \n \n \n \n \n \n \n \nP a g e | 6 \n4. The Technology Platform\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - User Manual \n \n \n \n \n \n \n \nP a g e | 7 \n5. Report Deployment Utility \n \nThe Adroit Report Deployment Utility function is to help you create and deploy Report Packs. These \nreport packs consists of Reporting Services’ reports, data sources and components. The utility interfaces \nwith SQL Reporting Services’ web service. \n \n \n \nThe Adroit Report Deployment Utility will help you with the more complex tasks of managing your SQL \nServer Reporting Services. \n \n \n \n \nFor more detailed information, please consult the user manual document for this utility available to \ndownload from our website. (www.adroit.co.za)\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - User Manual \n \n \n \n \n \n \n \nP a g e | 8 \n6. Getting Started \n \n6.1. Install SQL Server 2008 R2 Reporting Services \nAdroit is shipped with SQL Server 2008 R2 Express with Advanced Services (Reporting). Please refer to \nthe “SQL Server 2008 R2 Express Installation Guide” document before installing. \n \nIt is possible to use an existing SQL database (SQL 2005 and above) for the Report Suite database and \nfor the Adroit data. It is also possible to use an existing Reporting Services server, but it must be version \n2008 R2. \n \n6.2. Install the Adroit Report Deployment Utility \nThe Adroit Report Deployment Utility was created to help you create and deploy report packs. The report \npacks consist of Reporting Services’ reports, data sources and components. The Utility interacts with \nSQL Server Reporting Services’ web service. \n \n6.3. Install Report Packs \nEach report pack is a combination of Reporting Services reports, data sources, components and \nresources all in a manageable set of XML files. Installing a report packs simply copies these files to the \ncorrect location in Program Files. Once installed, these packs are available for the Report Deployment \nUtility. \n \n6.4. Deploy the Installed Report Packs \nThe Adroit Report Deployment Utility can now be used to deploy the installed report packs to the \nReporting Services server. During the deployment process the data source for each report pack must be \nconnected. The data source is the database where the appropriate Adroit data has been logged, i.e. the \nAlarm Management reports must be connected to a valid Alarm Management database. \n \n6.5. Run SQL Update Scripts \nThe latest SQL update scripts should be run against the Adroit database using the Adroit Report \nDeployment Utility (see user’s manual). This ensures that the database has all the required functionality \nto support the Report Suite reports. \n \n6.6. Create a Report Suite Desktop Shortcut \nA desktop shortcut can be added through the Adroit Report Deployment Utility (see user’s manual). The \nAdroit Report Suite basically opens Internet Explorer to the correct SQL Report Server web page. \n \n6.7. Open Report Suite \nTo start reporting, click on the Report Suite desktop shortcut. This shortcut will open the default web \nbrowser to the Adroit Report Suite navigation switchboard. \nNOTE: the Adroit Report Suite must be run in Internet Explorer 9 or later as the default browser.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - User Manual \n \n \n \n \n \n \n \nP a g e | 9 \n7. Start Reporting \n \n7.1. Report Suite Icon \nA desktop shortcut can be added through the Adroit Report Deployment Utility (see user’s manual). Click \non the desktop shortcut Icon to start reporting. \n \n7.2. Report Suite Switchboards \nThe Report Suite navigation is essentially done through a set of switchboard reports. These are accessed \nby the user through Internet Explorer web browser. Each tab on the switchboard opens up the \nswitchboard for the selected set of reports.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - User Manual \n \n \n \n \n \n \n \nP a g e | 10 \n8. Report Navigation \n \n8.1. Report Selection \nIn order to run a report, the correct report set switchboard needs to be opened. This can be done by \nsimply clicking on the correct report set tab. The available reports are listed on the switchboard report. \nTo open a report, click on the report name. Most reports have default parameters (filters), which allow \nthe report to run immediately when opened. \n \n \n \n \nClick on the report name \nto open the report \nClick on the report set to \nopen the switchboard\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - User Manual \n \n \n \n \n \n \n \nP a g e | 11 \n8.2. Report Layout & Navigation \nIn order to run a report, the correct set switchboard needs to be opened. This can be done by simply \nclicking on the correct report set tab. \n \nThe available reports are listed on the switchboard report. To open a report, click on the report name. \nThe Internet Explorer back button can be used to navigate back to the previous report. \n \nThe report header for most reports is the same with information such as report title and summary, the \nreporting period and the date the report is actually executed. \n \nNavigation options within the report can be used to go back to the main or current switchboard, open \nthe manage report window or open the associated help document. \n \n \n \n \nUse \nthe \nback \narrow to go to the \nprevious report \nReport \ntitle \nand \ndescription \nReport help \nReport generation \ndate \nReport period\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - User Manual \n \n \n \n \n \n \n \nP a g e | 12 \n9. Running Reports \n \n9.1. View Report Button \nBefore a report will run, it must have at least one value for each of the report parameters. If a report \nhas valid default report parameters it will run immediately when the report is opened. \n \nIn order to run a report manually, the View Report button must be pressed. This button is available in \nthe report parameters window which can be opened by clicking on the Show/hide Parameters button \n(shown below). If report parameters are changed the report can be re-run by clicking on the View \nReport button. \n \n \n \n \n9.2. Selecting Report Parameters \nReport parameters constrain the data set retuned in the report. Often a parameter itself is constrained \nby a previously selected parameter, but it is important to select parameters in the correct order. \nParameters should be selected from left to right and top to bottom to ensure that constrained parameters \nare properly constrained. \n \n9.2.1. Date Time Parameters \nThe date time parameters determine the reporting period for the report. When the parameters are \nselected using the date picker the default time will be midnight (00:00 AM). It is possible to type in the \nhour if a specific date time range is required. \n \n \nDate Picker for date \nselection – single \nselection \nDrop box – Multiple \nselection option \nView report button\nShow/Hide \nRefresh Report and \nPrint Report \nPage selection – \nmultiple pages\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - User Manual \n \n \n \n \n \n \n \nP a g e | 13 \n9.2.2. Multiple Select Parameters \nThe multiple selection parameter allows for the selection of one or many parameter values. All values \ncan be selected or deselected by checking or unchecking the “(Select All)” option. The multiple select \ndropdown can be expanded by dragging the corner of the drop down list down and to the right. \n \n9.3. Select Export Format \nOnce a report has been generated, it is possible to export the report in various formats. \nFor SQL Express the formats are: \n• \nPDF \n• \nMHTML (web archive) \n• \nExcel \n• \nWord \nA licensed SQL can also export to: \n• \nCSV \n• \nXML \n• \nTIFF (image) \nOn the report options ribbon, click on the save to disc icon to open the export options drop-down list. \nSelect the desired export format and follow the prompts to either open the export immediately or to \nsave to disc. \n \n \n \n \n \nClick to open the \nexport dropdown \nSelect Export\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - User Manual \n \n \n \n \n \n \n \nP a g e | 14 \n10. Technical Support \nFor further support, contact our Technical Support Desk on 011-658-8100 or email support@adroit.co.za. \n \nYou can also visit our website, follow us on Twitter, find us on Facebook or connect with us on LinkedIn.\n\n[Page 4]\nP a g e | 3\n1. Introduction\nThe Adroit Report Suite is a value-add information system based on specific Adroit agent data logged to\nan OLE DB database. Information is presented in the form of web based reporting through the Microsoft\nSQL Server Reporting Services platform. The technology is distributed as a free add-on solution to Adroit\nSCADA.\nThe suite consists of report packs and a Report Deployment Utility. Each report pack includes a set of\nreports specifically designed to report relevant and accurate information on the Adroit system and\nThis document provides a basic introduction to Adroit Technologies and the Adroit Report Suite valueadd system, with a brief overview of the Adroit SCADA software package for the purpose of convenience\nand reference.\n1.1.\nSince 1992 Adroit Technologies, a company based in South Africa, have been developing SCADA/HMI\nsoftware solutions for the industrial automation and process control industries. With over 20,000\nsuccessful installations, in over 16 countries in the world, Adroit is one of the world's   selling\nSCADA/HMI products.\nAdroit Technologies are a Microsoft Certified Gold Partner Company. This allows Adroit Technologies to\nstay in regular contact with Microsoft and remain up to date with the latest advancements in software\ndevelopment. All this ensures that Adroit remains one of the leading SCADA packages, both now and\nin the future.\n1.2.\nA.D.R.O.I.T means skilful, or dexterous, it is also an acronym for \"Advanced Distributed Real-time\nObject-oriented Intelligent Toolkit\".\nAdroit is a Windows based SCADA/HMI software product that has been developed over a period of more\nthan ten years by dedicated professionals. Robust and flexible enough for the toughest industrial\napplication, Adroit is the ideal platform from which to meet the information needs of a modern control\nsolution.\nAdroit is a technologically advanced SCADA (Supervisory Control & Data Acquisition) system designed\nfor process control, manufacturing systems and open automation applications.\nDeveloped specifically for Windows operating systems, Adroit has a flexible object-oriented client server\narchitecture that supports from a standalone implementation to an installation spanning multiple sites.\n\n[Page 5]\nP a g e | 4\n2. Report Suite Features\nOff The Shelf Reporting - All reports have been pre-configured. Simply enable the required Adroit\nWeb Based Reporting - no front-end software required; just double click on your Adroit Report\nSuite shortcut or type in the path\nFlexible Analysis - analyse on different hierarchy levels with dynamic filter sets\nDrill Through Reports - drill through from summary reports into more detailed reports at the click\nof a button\nPrinter Friendly Reports - generated reports can be printed fully with all relevant details, including\npage breaks\nExport Report Data - all reports can be easily exported to Excel, Word, MHTML (web archive) or\nPDF format\nUser-Defined Reports Schedule - reporting parameters and settings can be defined by each\nindividual user based on their reporting requirements (only with SQL standard edition and above)\nWindows Authenticated Security - IT administrators can give each individual user or groups\naccess and user rights on any report or report folder\nEasy Report Deployment - managing report deployment and SQL update scripts made simple with\nthe Report Suite Deployment Utility\nOpen Technology - built-in standard Microsoft SQL Reporting Services allowing users to customise\nand create new reports on Adroit data\nDemo Data - Some sample data is included for each report pack to offer a quick reference of what\nto expect of each available report in the report pack.\n\n[Page 6]\nP a g e | 5\n3.1. Database Platform\nThe Adroit Report Suite is built on the Microsoft SQL Server 2008 R2 database platform with SQL Server\nReporting Services (SSRS). Adroit is now shipped with SQL Server 2014 Express with Advanced Services\n(SSRS) and with the Adroit Report Suite. The Adroit Report Suite is a free add-on, although some of the\nreport packs are based on data from licensed Adroit agents.\n3.2. Report User Interface is Internet Explorer\nThe Report Suite front end is essentially a set of switchboard reports (built-in SSRS) used to navigate\nbetween report sets and to select which reports to view. Each set of reports are based on a standard\nAdroit logging mechanism such as the Alarm Management agent, the DB Log agent and also the Adroit\nAgent Server auditing.\n3.3. Report Packs\nThe report sets are developed and distributed as report packs, which require installation and deployment\nto the SQL Reporting Server.\nA report pack is a combination of Reporting Services Reports, Data Sources, Components and Resources\nall in one manageable \"pack\" which is made available as installation files for easy installation.\nWhen a new version of a report set is made available it will be distributed as a new report pack which\nwill include the updated reports as well as the scripts required to update existing databases if needed.\nThe Report Deployment Utility is shipped with the Adroit Report Suite and has been developed to assist\nwith report pack deployment and also with running of the latest updates' scripts should this be required.\n3.5. Data Sources\nEach set of reports has a SQL Data Source. This data source is the actual database that the reports will\nextract data from to present to the end-user. It is possible to change the data source to another valid\ndatabase at any point (i.e. alarm management reports must be linked to an alarm management\ndatabase), including connecting to the demonstration dataset installed with the Report Suite. The data\nsources can be managed through the Adroit Report Deployment Utility.\n\n[Page 9]\nP a g e | 8\n6. Getting Started\n6.1. Install SQL Server 2008 R2 Reporting Services\nAdroit is shipped with SQL Server 2008 R2 Express with Advanced Services (Reporting). Please refer to\nthe \"SQL Server 2008 R2 Express Installation Guide\" document before installing.\nIt is possible to use an existing SQL database (SQL 2005 and above) for the Report Suite database and\nfor the Adroit data. It is also possible to use an existing Reporting Services server, but it must be version\n2008 R2.\n6.2. Install the Adroit Report Deployment Utility\nThe Adroit Report Deployment Utility was created to help you create and deploy report packs. The report\npacks consist of Reporting Services' reports, data sources and components. The Utility interacts with\nSQL Server Reporting Services' web service.\n6.3. Install Report Packs\nEach report pack is a combination of Reporting Services reports, data sources, components and\nresources all in a manageable set of XML files. Installing a report packs simply copies these files to the\ncorrect location in Program Files. Once installed, these packs are available for the Report Deployment\nUtility.\n6.4. Deploy the Installed Report Packs\nThe Adroit Report Deployment Utility can now be used to deploy the installed report packs to the\nReporting Services server. During the deployment process the data source for each report pack must be\nconnected. The data source is the database where the appropriate Adroit data has been logged, i.e. the\nAlarm Management reports must be connected to a valid Alarm Management database.\n6.5. Run SQL Update Scripts\nThe latest SQL update scripts should be run against the Adroit database using the Adroit Report\nDeployment Utility (see user's manual). This ensures that the database has all the required functionality\nto support the Report Suite reports.\n6.6. Create a Report Suite Desktop Shortcut\nA desktop shortcut can be added through the Adroit Report Deployment Utility (see user's manual). The\nAdroit Report Suite basically opens Internet Explorer to the correct SQL Report Server web page.\n6.7. Open Report Suite\nTo start reporting, click on the Report Suite desktop shortcut. This shortcut will open the default web\nbrowser to the Adroit Report Suite navigation switchboard.\nNOTE: the Adroit Report Suite must be run in Internet Explorer 9 or later as the default browser.\n\n[Page 13]\nP a g e | 12\n9. Running Reports\n9.1. View Report Button\nBefore a report will run, it must have at least one value for each of the report parameters. If a report\nhas valid default report parameters it will run immediately when the report is opened.\nIn order to run a report manually, the View Report button must be pressed. This button is available in\nthe report parameters window which can be opened by clicking on the Show/hide Parameters button\n(shown below). If report parameters are changed the report can be re-run by clicking on the View\nReport button.\n9.2. Selecting Report Parameters\nReport parameters constrain the data set retuned in the report. Often a parameter itself is constrained\nby a previously selected parameter, but it is important to select parameters in the correct order.\nParameters should be selected from left to right and   to bottom to ensure that constrained parameters\nare properly constrained.\n9.2.1. Date Time Parameters\nThe date time parameters determine the reporting period for the report. When the parameters are\nselected using the date picker the default time will be midnight (00:00 AM). It is possible to type in the\nhour if a specific date time range is required.\nDate Picker for date\nselection - single\nselection\nDrop box - Multiple\nselection option\nView report button\nShow/Hide\nRefresh Report and\nPrint Report\nPage selection -\nmultiple pages\n\n[Page 14]\nP a g e | 13\n9.2.2. Multiple Select Parameters\nThe multiple selection parameter allows for the selection of one or many parameter values. All values\ncan be selected or deselected by checking or unchecking the \"(Select All)\" option. The multiple select\ndropdown can be expanded by dragging the corner of the drop down list down and to the right.\n9.3. Select Export Format\nOnce a report has been generated, it is possible to export the report in various formats.\nFor SQL Express the formats are:\nPDF\nMHTML (web archive)\nExcel\nWord\nA licensed SQL can also export to:\nCSV\nXML\nOn the report options ribbon, click on the save to disc icon to open the export options drop-down list.\nSelect the desired export format and follow the prompts to either open the export immediately or to\nsave to disc.\nClick to open the\nexport dropdown\nSelect Export"}, {"title": "ATQMS-MKTG-DOC-EMS-Brochure_2023_07", "href": "manual_chapters/ATQMS-MKTG-DOC-EMS-Brochure_2023_07/index.html", "category": "Product Manuals", "rel": "manual_chapters/ATQMS-MKTG-DOC-EMS-Brochure_2023_07/index.html", "kind": "Manual", "text": "EMS\nAn Environmental Management System is a set of measurements,\nprocesses and practices that enable an organisation to reduce its\nenvironmental impacts and increase its operating safety and efficiency.\nEnvironmental Management System\n\nIntroduction\nMonitor - Manage - Control\nAn Environmental Management System (EMS) is a set of measurements, processes, and practices that\nenable an organisation to reduce its environmental impacts and increase its operating safety and efficiency.\nThis proactive approach can help reduce the risk of non-compliance and improve workplace health and safety\npractices for employees and the public. Monitoring strategies and programs are designed to establish,\nmonitor, and manage the status of an environment and to establish trends or identify risk.\nThe results of monitoring are reviewed, analysed statistically and reported or documented, and utilised to\nestablish successful and dynamic monitoring and management system.\nEarly Warning\nModular\nCross Platform\nSingle Management\nPlatform\nStandard Templates\nAccountability\nCentralised View\nModules and\nComponents\nEnvironmental Management System\nKey features and benefits\nEMS has both a Safety/Environment and Fire Detection component that includes the easy deployment and\nmanagement of sensors, visualisation built on the fly, early detection of fire, and various report sets as\nrequired for regulatory bodies.\nThe EMS module seamlessly plug-in to the Adroit platform, proving specific off the shelf functionality around\nearly fire detection and environmental monitoring.\nThe platform has been developed to allow OEM suppliers’ plug-ins to work seamlessly within the framework.\nThese include most of the leading sensor and PLC suppliers. Multiple sensor vendor support in a single\nscalable platform.\nReliable, rapid deployment of online real time configuration, no downtime.\nBoth predefined and customisable interfaces enforce standard visualisation, alarming, and control across\nsystems.\nTraceability across the system and users provide for auditing, data logging, and comprehensive reporting..\n\nViews can be localised or Centralised across the enterprise in real-time or information-driven dashboard.\nModules and Components consists of the following:\nEnvironmental Management System\nIoT Enabled\nAutomated Reports\nAdroit Product\nSuite\nReport and Analytics\nMobile Platform\nModules\nAdroit has been certified for commercial use as an IIoT platform by Sigfox, which enables users to rapidly\ndeploy and integrate IoT devices.\nAdroit Air is a dedicated mobile application that manages and communicates alerts via push notifications.\nHosting a full SCADA / EMS system on any web browser-enabled device through our mobile gateway\ntechnology. Performance Anywhere is our dedicated mobile SCADA platform.\nComplete Business Intelligence for the automation industry. The platform complements the entire Microsoft BI\ntechnology stack. Off the shelf, report packs analyse and assist in effective monitoring and management.\nExtending the full complement of the Adroit product suite to deliver an off-the-shelf solution.\nException report subscriptions.\nModules available: Early Warning/Fire Detection, Ventilation Management, Environmental Health and\nSafety (EHS) Management, Occupational Health and Safety (OHS) Management.\nEnvironmental Management System\nEarly Warning / Fire Detection\nVentilation Managament\nEnvironmental Health and Safety\nOccupational Health and Safety\nMonitor - Manage - Control\n\nATQMS-MKTG-DOC-EMS - Brochure_2023_07\nEarly Warning / Fire Detection\nVentilation Management\nEHS\nOHS\nClick and Deploy\nThrough the management hierarchy,\nMultiple vendors sensors can be\ncreated and deployed\nSecured and Audited\nAccess and maintenance control is\napplied through Windows security\nlayer, while a detailed audit trail is\ncaptured\nFire Detection Algorithm\nMonitor rate of change with slope\nand trigger mode configuration\nBackup Head Monitoring\nConfigure airflow direction to\ntrack smoke and co gasses\nIncident Management\nAll incidents are automatically\ncaptured and tracked in a database\nAccessibility\nVentilation and Safety officers\nhave access to real-time sensors\nand environmental monitoring\nIntegration\nWith mine and ventilation planning\nsoftware for shared data and\nanalysis\nDedicated Reports\nSensor and system management\nreports facilitate the maintenance\nand engineering process\nMonitor\nManage your EHS exposure with\nreal-time management solution and\nimprove operational performance,\nreducing risk and cost\nIntegration\nExtend with the value-added EHS\nmanagement solution that\nseamlessly combines different\nenvironment, health, and safety\nprocesses, giving you a single,\ncomprehensive, integrated\nmanagement solution\nIntegration\nManage employee health with the\nvalue-added occupational health\nmanagement solution and increase\nproductivity while reducing risk\nDedicated Reports\nOff the shelf OHS management\nreports, to boost safety and hygiene\nin the workplace\nAdvanced Analysis\nUse a single dashboard to monitor\nongoing exposure information on\nall your employees, enabling you\nto quickly identify risk exposure\nand take precautionary action that\ncan lead to reduced risk\nAccountability\nTraceability across the\nsystem and users\nprovide for auditing,\ndata logging and\ncomprehensive reporting\nManagement\nReliable, rapid\ndeployment of online\nreal-time configuration,\nno downtime\nPlatform\nMultiple sensor vendor\nsupport in a single\nscalable platform\nStandard Templates\nBoth predefined and\ncustomisable interfaces\nenforces standard\nvisualisation, alarming\nand control across\nsystem\nTalk To Us\nWebsite:\nSales Enquires:\nTechnical Support:\nContact Tel No:\nwww.adroittech.co.za\nsales@adroit.co.za\nsupport@adroit.co.za\n+27 11 658 8100\nCopyright © 2022 Advanced Worx 112 (Pty) Ltd. All rights reserved.\n\n[Page 1]\nEMS\nAn Environmental Management System is a set of measurements,\nprocesses and practices that enable an organisation to reduce its\nenvironmental impacts and increase its operating safety and efficiency.\nEnvironmental Management System\n\n[Page 2]\nIntroduction\nMonitor - Manage - Control\nAn Environmental Management System (EMS) is a set of measurements, processes, and practices that\nenable an organisation to reduce its environmental impacts and increase its operating safety and efficiency.\nThis proactive approach can help reduce the risk of non-compliance and improve workplace health and safety\npractices for employees and the public. Monitoring strategies and programs are designed to establish,\nmonitor, and manage the status of an environment and to establish trends or identify risk.\nThe results of monitoring are reviewed, analysed statistically and reported or documented, and utilised to\nestablish successful and dynamic monitoring and management system.\nEarly Warning\nModular\nEnvironmental Management System\nKey features and benefits\nEMS has both a Safety/Environment and Fire Detection component that includes the easy deployment and\nmanagement of sensors, visualisation built on the fly, early detection of fire, and various report sets as\nrequired for regulatory bodies.\nThe EMS module seamlessly plug-in to the Adroit platform, proving specific off the shelf functionality around\nearly fire detection and environmental monitoring.\nThe platform has been developed to allow OEM suppliers' plug-ins to work seamlessly within the framework.\nThese include most of the leading sensor and PLC suppliers. Multiple sensor vendor support in a single\nscalable platform.\nReliable, rapid deployment of online real time configuration, no downtime.\nBoth predefined and customisable interfaces enforce standard visualisation, alarming, and control across\nsystems.\nTraceability across the system and users provide for auditing, data logging, and comprehensive reporting..\n\n[Page 3]\nViews can be localised or Centralised across the enterprise in real-time or information-driven dashboard.\nModules and Components consists of the following:\nEnvironmental Management System\nIoT Enabled\nAutomated Reports\nReport and Analytics\nMobile Platform\nModules\nAdroit has been certified for commercial use as an IIoT platform by Sigfox, which enables users to rapidly\ndeploy and integrate IoT devices.\nAdroit Air is a dedicated mobile application that manages and communicates alerts via push notifications.\nHosting a full SCADA / EMS system on any web browser-enabled device through our mobile gateway\ntechnology. Performance Anywhere is our dedicated mobile SCADA platform.\nComplete Business Intelligence for the automation industry. The platform complements the entire Microsoft BI\ntechnology stack. Off the shelf, report packs analyse and assist in effective monitoring and management.\nExtending the full complement of the Adroit product suite to deliver an off-the-shelf solution.\nException report subscriptions.\nModules available: Early Warning/Fire Detection, Ventilation Management, Environmental Health and\nSafety (EHS) Management, Occupational Health and Safety (OHS) Management.\nEnvironmental Management System\nEarly Warning / Fire Detection\nVentilation Managament\nEnvironmental Health and Safety\nOccupational Health and Safety\nMonitor - Manage - Control\n\n[Page 4]\nATQMS-MKTG-DOC-EMS - Brochure_2023_07\nEarly Warning / Fire Detection\nVentilation Management\nEHS\nClick and Deploy\nThrough the management hierarchy,\nMultiple vendors sensors can be\ncreated and deployed\nSecured and Audited\nAccess and maintenance control is\napplied through Windows security\nlayer, while a detailed audit trail is\ncaptured\nFire Detection Algorithm\nMonitor rate of change with slope\nand trigger mode configuration\nBackup Head Monitoring\nConfigure airflow direction to\ntrack smoke and co gasses\nIncident Management\nAll incidents are automatically\ncaptured and tracked in a database\nAccessibility\nVentilation and Safety officers\nhave access to real-time sensors\nand environmental monitoring\nIntegration\nWith mine and ventilation planning\nsoftware for shared data and\nanalysis\nDedicated Reports\nSensor and system management\nreports facilitate the maintenance\nand engineering process\nMonitor\nManage your EHS exposure with\nreal-time management solution and\nimprove operational performance,\nreducing risk and cost\nIntegration\nExtend with the value-added EHS\nmanagement solution that\nseamlessly combines different\nenvironment, health, and safety\nprocesses, giving you a single,\ncomprehensive, integrated\nmanagement solution\nManage employee health with the\nvalue-added occupational health\nmanagement solution and increase\nproductivity while reducing risk\nDedicated Reports\nOff the shelf OHS management\nreports, to boost safety and hygiene\nin the workplace\nAdvanced Analysis\nUse a single dashboard to monitor\nongoing exposure information on\nall your employees, enabling you\nto quickly identify risk exposure\nand take precautionary action that\ncan lead to reduced risk\nAccountability\nTraceability across the\nsystem and users\nprovide for auditing,\ndata logging and\ncomprehensive reporting\nManagement\ndeployment of online\nreal-time configuration,\nno downtime\nMultiple sensor vendor\nsupport in a single\nscalable platform\nStandard Templates\nBoth predefined and\ncustomisable interfaces\nenforces standard\nand control across\nsystem\nTalk To Us\nWebsite:\nSales Enquires:\nContact Tel No:\nwww.adroittech.co.za\n+27 11 658 8100"}, {"title": "ATQMS-MKTG-DOC-GIS-Quick-Start-Guide", "href": "manual_chapters/ATQMS-MKTG-DOC-GIS-Quick-Start-Guide/index.html", "category": "Product Manuals", "rel": "manual_chapters/ATQMS-MKTG-DOC-GIS-Quick-Start-Guide/index.html", "kind": "Manual", "text": "____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-GIS - Quick Start Guide.docx \n \n \n \n \n \n \n \n \nP a g e | 1 \nCOPYRIGHT \n \nCopyright © 2020 Advanced Worx 112 (Pty) Ltd. All rights reserved. \nInformation in this document is subject to change without notice. The software described in this document is furnished under \na license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of \nthose agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or \nany means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal \nuse without the written permission of Advanced Worx 112 (Pty) Ltd. \nAdvanced Worx 112 (Pty) Ltd \n20 Waterford Office Park \n189 Witkoppen Road (c/o Waterford Drive) \nFourways \nSouth Africa \n \nwww.adroittech.co.za \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nVersion \nDate \nAuthor \nComment \nApproval \n1.0 \n12.09.2019 \nG Joyce \nOriginal \nD. Wibberley \n2.0 \n22.05.2020 \nJ. Duncan \nUpdate Cover and formatting \n \n3.0 \n23.07.2020 \nW. Rösemann \nMinor content \n \n4.0 \n30.09.2021 \nJ. Duncan \nQMS\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-GIS - Quick Start Guide.docx \n \n \n \n \n \n \n \n \nP a g e | 2 \nContents \n1. \nSummary ............................................................................................................................................... 3 \n2. \nHow to configure the GIS Add-on ........................................................................................................ 3 \n2.1. \nAdd the GIS datasource ................................................................................................................ 3 \n2.2. \nBuild the Hierarchy ....................................................................................................................... 4 \n2.2.1. \nUsing the configuration dialogs to add and configure items ...........................................................................5 \n2.2.2. \nUsing an Excel spreadsheet to bulk configure the required items ...................................................................7 \n3. \nAdd and Configure a MappingControl ................................................................................................... 8 \n3.1. \nAlarming ..................................................................................................................................... 9 \n3.1.1. \nDefine additional colors indicating specific states for your items ....................................................................9 \n3.1.2. \nFiltering ................................................................................................................................................9 \n3.1.3. \nPin History ............................................................................................................................................9 \n3.1.4. \nUser Layers ......................................................................................................................................... 10 \n4. \nAppendix A .......................................................................................................................................... 11 \n4.1. \nCore Changes ............................................................................................................................. 11 \n4.2. \nAdditional Changes ...................................................................................................................... 11 \n4.2.1. \nAlternate Coordinate Systems................................................................................................................. 11\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-GIS - Quick Start Guide.docx \n \n \n \n \n \n \n \n \nP a g e | 3 \n1. Summary \n \nA geographic information system (GIS) is simply a way of displaying data related to specific positions on \nthe Earth’s surface to allow one to more easily understand their patterns and relationships. GIS relates \nto SCADA because most often the starting point of navigation in geographically dispersed projects is a \nmap overview, since this is a natural and logical reference point to centralize information on, and control \ntasks from. By using the Geographic Information System (GIS) Add-on, you can add intelligence to these \nmap overviews by providing icons that represent the actual positions of your items, such as your plant \nor equipment locations. \n \nThis Smart UI GIS add-on consists of the following three main components: \n• \nThe GIS datasource, which stores the defined items and their hierarchy in the SmartUI server, along \nwith their icons and other configuration. \n• \nThe GIS Mapping Control, which maps the defined items of a specific GIS datasource on a map and \nprovides navigation abilities, so that users can view and/or interact with these items. \n• \nThe Coordinate Agent, which is used to drive and manage the location property of a map item \ndynamically. The agent can obtain location updates from a field device provided the driver exposes \nthe location in either Decimal Degrees (DD) or Degree Minute Second (DMS) format. The agent can \nalso raise alarms when the location falls outside of certain areas (geofences). \n \n2. How to configure the GIS Add-on \n \n2.1. \nAdd the GIS datasource \n1. Ensure that you have installed the Geographic Information System (GIS) Add-on on the \nrequired Smart UI Server computer. \n2. Open the Smart UI Designer and login to this Server. \n3. In the Enterprise Manager, right click the Datasources node and select the Add Datasource \noption. \n4. Double click GIS in the list of the available datasources. \n5. Provide the required name of your GIS datasource and optionally select the desired \ncoordinate system. Click the Finish button. The newly created GIS datasource will be \navailable under the Datasources node. \n6. Right click the Server and select the Save Server Data option to save this datasource. \n7. Additional datasource can be added in the same way\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-GIS - Quick Start Guide.docx \n \n \n \n \n \n \n \n \nP a g e | 4 \n2.2. \nBuild the Hierarchy \n \nEach GIS node potentially represents both a hierarchy item and an actual asset. This means a GIS node \ncan simply be a logical grouping for child nodes, an actual asset in the field, or both. There are two ways \nof configuring the GIS datasource to add hierarchy and asset nodes. \n \n• \nUse the configuration dialogs provided by the GIS datasource Smart UI Designer to manually build \nthe required hierarchy and add asset nodes \n \nAdvantages: \no Being an interactive wizard (series of dialogs), each step of the project performs its own \nerror checking, so any mistakes that you make are immediately picked up and need to be \naddressed before you can continue. \no This provides a structured “first principal” approach of creating the GIS database of items. \n \nDisadvantage: \no Once you are familiar with the process of creating items and particularly if you have a large \nnumber of items to add, this method becomes unwieldy to use. Tip: We recommend that you \nuse the configuration dialogs first to create your first site, area and items to get the hang of \nwhat data each field requires before bulk configuring your items using the Excel spreadsheet. \n• \nUse an Excel spreadsheet to bulk configure the required sites, areas and their items. In this case edit \nthe GISTemplate.xlsx that is installed into the is installed in the Smart UI installation folder, which is \ntypically: C:\\Program Files\\Adroit Technologies\\Adroit\\SmartUI) to create your sites, their areas and \nitems, which already contains the necessary columns and provides further assistance regarding the \nrequired syntax and information required by each column. \n \nAdvantage: \no Being an Excel spreadsheet, it is easier to add the required items in bulk. \n \nDisadvantages: \no Since the project is created by importing an Excel spreadsheet, limited error-checking is \navailable. \no Requires that you have Microsoft Excel (version 2007 and above) installed to edit this \nspreadsheet.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-GIS - Quick Start Guide.docx \n \n \n \n \n \n \n \n \nP a g e | 5 \n2.2.1. Using the configuration dialogs to add and configure items \n1. \nEnsure that you have added a GIS datasource to the Enterprise Manager. \n2. \nRight click the GIS datasource and select Add. \n \n \n \n3. \nGeneral Information: \na. Type in the name that will identify this site, in the navigational hierarchy. \nb. Add an optional descriptor. This is a text field that can be used for filtering or identifying the \nasset by a codified naming convention. \nc. Set the location of the node \ni. If the location of this node should be derived from an agent, check the DE checkbox. \nBrowse in the associated coordinate agent for the node. Clicking refresh will read the \ncurrent location from the agent and populate the latitude and longitude fields. \nAlternatively, the latitude and longitude values can be entered manually in Decimal \nDegree (DD) notation. Clicking update will write these values back the the agent. \nii. If the location is static, leave the DE checkbox unchecked and enter the static location \nof the node in DD notation\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-GIS - Quick Start Guide.docx \n \n \n \n \n \n \n \n \nP a g e | 6 \nd. The default zoom level dictates which zoom level the map will be set to when navigating to \nthe pin on a map control. The default zoom should be somewhere between the minimum and \nmaximum zoom levels. \ne. When viewing the pin on a map, it will only be visible when the zoom level of the map is \nbetween the specified minimum and maximum zoom levels of the pin. \nf. There is also an option to hide the pin completely. This is useful when the node only \nrepresents a logical group and has no real location associated with it. Typically the location \nand zoom level of these nodes should be chosen that all its children will be visible when \nnavigating to it. \ng. If a geofence is defined for this node it can be displayed by checking the “Show Alarm Fence” \ncheckbox. The fence will be drawn in the same color as the pin, but with a higher \ntransparency. \nh. Specify the color and icon of pin for this node. \n \nNote: If you are designing your own icons, ensure that they fit within the provided icon template image \n(\"gis icon template.svg\" that is installed in the Smart UI installation folder, which is typically: C:\\Program \nFiles\\Adroit Technologies\\Adroit\\SmartUI) otherwise the colors of the states can be obstructed if your icons \nare too big. \n4. Geofence: \na. Specify the type of fence \ni. Polygon: The fence is described by a collection of points in the order they are entered \nii. Radius: The fence is described by a radius around a centre point. This is used to \ndefine a fence that triggers when the asset is has travelled more than a specified \ndistance from its start point. \nb. Enter the fence data for the alarm (and optionally the warning-) fence. If the pin is driven by \na coordinate agent, this data will be written back to the agent when the dialog is finished or if \nthe update button is pressed on the “General Information” tab. \n5. Graphic Form: \na. Specify a graphic form to open when the pin is clicked. \nb. Enter any aliases that the form might require. \n6. Alarming and Status: \na. Browse a tag to use to indicate that this asset is in alarm. An alarm condition will be shown \nwhenever this tag evaluates to true. \nb. Browse a tag to drive the status of the asset. The value of this tag will be compared to a set \nof user defined values on the Map control. If the incoming value matches any of these values, \nthe pin status area color will be set to the color associated to this value. \n7. Tooltip: \na. Set up a tooltip to display when hovering over this pin on a map. \n \nIf necessary, repeat this process for all your other sites and/or areas. Tip: In the Enterprise Manager, \nyou can remove unwanted items by using the right click Delete option.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-GIS - Quick Start Guide.docx \n \n \n \n \n \n \n \n \nP a g e | 7 \n2.2.2. Using an Excel spreadsheet to bulk configure the required items \n1. Ensure that you have Microsoft Excel (version 2007 and above) installed. \n2. Right click on your GIS datasource and select “Export”. You can use this blank export sheet as a \ntemplate. It is suggested that you add the first few items from first principles before exporting, \nso you have a few examples of proper formatting for each column. \n3. For each new item, add a new row and increment the ID. Set the ParentID equal to the ID of \nrow that contains the item that will be the parent of the new item. To add a node to the root, set \nthe ParentID to -1. \n4. Enter the DisplayName, Descriptor, Latitude and Longitude. If the pin is driven, enter the full \nname of the associated coordinate agent. Otherwise leave this field blank. \n5. ShowFences is set as follows: \n \n1 \n2 \n4 \n6 \nPin \n0 \n1 \n0 \n1 \nFence \n0 \n0 \n1 \n1 \n \n6. The export folder should contain an images folder. This should contain all the images that are to \nbe used by the datasource. The images should be named appropriately. The IconKey field should \nmatch the name (without extension) of the target image. \n7. Alarm- and StatusTag should be the full tag name (including slot). \n8. AliasKeys and –Values should be semicolon separated lists (in matching order) of the Alias names \nand values repectively. \n9. GeoFenceType should be set to nothing, Radius or Polygon. GeoFenceAlarmLats and –Longs \nshould be a semicolon separated list of the latitudes (and longitudes respectively) for the alarm \ngeofence, in order. The same applies to the WarningGeoFence fields. \n10. AttributeNames and –Values should be handled like the aliases. \n11. The TooltipText field should contain the entire, formatted tootltip text including placeholders and \nformat specifiers. The TooltipSubs field should be a semicolon separated list of the full \nDataElement names, to be inserted at the specified positions in the tooltip text. \n12. Right click on the GIS Datasource and select import. Browse in the appropriate .xls file and click \nFinish. The import will overwrite any current configuration completely. The process could fail if \nany part of the import sheet is badly formatted. Any failures will be reported, with reasons, if \navailable.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-GIS - Quick Start Guide.docx \n \n \n \n \n \n \n \n \nP a g e | 8 \n3. Add and Configure a MappingControl \n \nThe MappingControl maps the defined items of a specific GIS datasource on a map and provides \nnavigation abilities so that users can view and/or interact with these items. \n1. \nIf necessary, add a project and a graphic form in the Enterprise Manager window of the Smart UI \nDesigner and ensure that this graphic form is opened. \n2. \nIn the Toolbox window, open the GIS category and drag the MappingControl onto the graphic \nform. If you do not see the GIS category or the MappingControl, right-click in the toolbox and \nselect “Add controls”. In the configuration window that appears, find the GISMapControl item, \ncheck the box next to it and click finish. This will add the control to your toolbox. \n3. \nOpen the MappingControl Tasks menu. \nNote: This menu of tasks is displayed when the control is initially added and can be accessed by clicking \nits glyph usually displayed in the top left corner of the selected control. \n4. \nSelect the name of the required GIS datasource from the GIS Datasource list box. This displays the \nmap and all the items that you have configured on it, typically by using the default icons, allowing \nyour users to navigate between the specified items. \n5. \nYou can set the initial location of the map by using the CenterLatitude/Y and CenterLongitude/X \nproperties of the MappingControl to specify the centre point location of the map, in decimal \nnotation. \n6. \nYou can set the initial zoom level of the map too, by using the ZoomLevel property of the \nMappingControl. \n7. \nThe MappingControl has a native treeview that shows the GIS Datasource hierarchy. If required, \nthis treeview can be hidden, by setting the ShowTreeView property to false. \n \nThe MappingControl allows users to interact with the map as follows: \no Zooming: Use the mouse wheel to zoom in and out or change the magnification of the map. \nNote: Ctrl + and Ctrl – also zooms in and out, pressing the Home button returns to the initial \nzoom level and location. \no Panning: Click and drag to pan the map or change the portion of the map that is currently \nviewed. \no Treeview: Click a node in the treeview to highlight the associated pin. Double-clicking will center \nthe map at the location of the pin, at the configured default zoom level for that pin. \no Pins: By default, double clicking on a pin will open the associated graphic form for that pin, using \nthe provided aliases. This operation can be fine-tuned, by changing the gISMapControl.OpenGF \nspider in the spider workspace (this spider is automatically created and configured when the \nMapping Control is added to the form. \no Hovering on a pin will show its configured tooltip. \n \nThe MappingControl control selects the free OpenStreetMaps Map Provider by default. While you can \nalso select one of the available BINGMAPS options - you need to license these before they can be used. \nA third option (LocalMapProvider) is also available. This is most appropriate when no internet connection \nis available. LocalMapProvider uses a custom offline map pack, generated specifically for the area of \ninterest. Contact our support department for more information on custom map packs.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-GIS - Quick Start Guide.docx \n \n \n \n \n \n \n \n \nP a g e | 9 \n3.1. \nAlarming \n \nEach GIS node can have an alarm tag associated with it (as configured when adding an item to the \ndatasource). Essentially, whenever this tag evaluates to true, the Mapping Control will indicate an alarm \ncondition for the node. Alarms are indicated in the native treeview, by a small, solid red square to the \nleft of the treeview node. Treeview nodes also indicate when a child node is in alarm, by adding an \nadditional red outline to the alarm indicator. \n \nPins on the Mapping Control also indicate alarms, by applying a red color to the AlarmIndicator area of \nthe pin. On the default pin this is a highlighted outline of the pin. \n \n3.1.1. Define additional colors indicating specific states for your items \nIn addition to the default color of your icons on the map you can define additional colors indicating \nspecific states. These colors are applied to the StatusColor area of the pin (on the default pin this is the \ntriangular area at the bottom of the pin. \n \nNote: These state colors will ONLY be visible if you use the default item icons or design your own items \nto fit within the provided icon template, as described below. The relevant tags to use for status values \nwere configured while adding the items to the datasource. \n \nConfigure the StatusColors property of the required MappingControl and specify the value of a specific \nstate in the State column and its associated color in the Color column. Note: This StatusColors property \ndefines is a list of states ONLY available to this specific MappingControl. Then typically when the value \nof a StatusTag associated with an item is the same as a value specified in the State column then the pin \nof this item is set to the specified Color. \n \nYou need to carefully decide what types of values are used for each StatusTag depending on whether \ncertain states need to be common for all items or specific to certain items. Integer or double values work \nwell for generic cases, string values allow a finer degree of control. Also the Color associated with the \n'default ' state will be displayed when a StatusTag is not specified for an item or when the value of the \nspecified StatusTag does not match any of the specified State values. \n \n3.1.2. Filtering \nThe treeview can be filtered at runtime to make finding the required asset easier. The treeview can be \nfiltered by name or by attribute keys (and values). Type any part of the search string into the filter box, \nand the treeview will automatically filter out items that don’t match. \n \n3.1.3. Pin History \nThe MappingControl can also display a historical view of the recorded locations for a specific asset. To \naccess this functionality, click on the Pin History tab. If the selected asset has logged location data, the \nPin History control can be configured to display this data on the map. The length and frequency of the \nreturned data can be configured on the Pin History control. Clicking apply will draw the collection of \nhistorical points on the map with a line connecting them in sequence. The points will show a tooltip \ncontaining the date and time associated with this point, along with the value of the StatusTag (if one \nwas configured) at that time.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-GIS - Quick Start Guide.docx \n \n \n \n \n \n \n \n \nP a g e | 10 \n3.1.4. User Layers \nYou also have the option to load custom shapes onto the map using KML, SHP or SVG files. Shapefiles \ncan be created in various 3rd party software packages (ArcGIS, MicroStation, Google Maps, etc). The \nshapefile contains the geometry of the shapes as well as their intended location on the map. While SHP \nan KML files have coded locations included, SVG files need to be given a canvas area so the Mapping \nControl knows where to draw the shape. If a valid shapefile is loaded, the shapes will be drawn on the \nmap, in the user defined color. Map tiles are always drawn below shapes, pins are always drawn on top \nof shapes. Like pins, the shapes can be configured to only be displayed on certain zoom levels. The \nvisibility of a set of shapes can be toggled can be toggled by showing or hiding the associated user layer \nusing the UserLayers control on the Mapping Control \n \nUser layers can also be z-ordered at runtime using this control.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-GIS - Quick Start Guide.docx \n \n \n \n \n \n \n \n \nP a g e | 11 \n4. Appendix A \n \n4.1. \nCore Changes \n \nIn order to include more GIS functionality and to make configuration more intuitive, a new agent type \n(Coordinate agent) has been created. This agent will be the primary method for representing dynamic \nGIS data. The features of this agent are as follows: \n• \nConverting between multiple GIS representations \n• \nCombines Latitude and Longitude values into a single value \n• \nDefines warning and alarm geofences \n• \nRaises alarms depending on position relative to the 2 fences \n• \nSimultaneous logging of both coordinates \nThe agent can be driven by and represent a location as Decimal Degrees (DD) or Degree Minute Second \n(DMS). Latitude and longitude values can be driven independently, or as a full coordinate in either \nformat. \nThe coordinate agent exposes both a warning and alarm geofence. These fences can be represented as \neither a polygon, defined by a collection of points, or as a radius around a centre point. In radius mode, \nthe agent is essentially alarming when the current location is more than X meters away from a predefined \npoint. \nSince it is possible that latitude and longitude updates can arrive in different updates, the coordinate \nagent always logs a full coordinate – so a logged latitude will always have a corresponding longitude. \nThis simplifies the interpretation of historical GIS data. \n \nThe rest of the GIS components have been updated to integrate more tightly with this new agent type. \nHenceforth, if a GIS node represents a moveable asset, that node should be driven by a Coordinate \nagent. It is also recommended to use a Coordinate agent for nodes that represent areas by using either \nthe warning or alarm fence, though configuring the area without a coordinate agent is still possible. \nStatus and Alarm tag operation remains as is. To interact with geofence alarms, the approach is still to \nroute all alarms associated with a node to a single agent (alarmList, expression or marshal) and use that \nagent as the Alarm tag. \nIf driven by a Coordinate agent, GIS elements will reflect the security and dataelement status of the \nCoordinate agent. This means that if the underlying agent is bad, the GIS node will indicate this to the \nuser. If the asset location is sensitive information, the underlying coordinate agent can be secured and \nthe corresponding GIS Pin will not show any updated location to disallowed users. \n \n4.2. \nAdditional Changes \n4.2.1. Alternate Coordinate Systems \nGIS 3.0 (actually available since 2.0) enables the user to view his GIS data in either geographic or \nCartesian representations. While most use cases will be suited to geographical representation, in some \ncases absolute position is either not available or not important. Examples include building management \nand mine maps. Typically, in this mode, traditional map tiles are irrelevant and the user can provide his \nown map in .SVG, .SHP or .KML formats.\n\n[Page 4]\nATQMS-MKTG-DOC-GIS - Quick Start Guide.docx\nP a g e | 3\n1. Summary\nA geographic information system (GIS) is simply a way of displaying data related to specific positions on\nthe Earth's surface to allow one to more easily understand their patterns and relationships. GIS relates\nto SCADA because most often the starting point of navigation in geographically dispersed projects is a\nmap overview, since this is a natural and logical reference point to centralize information on, and control\ntasks from. By using the Geographic Information System (GIS) Add-on, you can add intelligence to these\nmap overviews by providing icons that represent the actual positions of your items, such as your plant\nor equipment locations.\nThis Smart UI GIS add-on consists of the following three main components:\nThe GIS datasource, which stores the defined items and their hierarchy in the SmartUI server, along\nwith their icons and other configuration.\nThe GIS Mapping Control, which maps the defined items of a specific GIS datasource on a map and\nprovides navigation abilities, so that users can view and/or interact with these items.\nThe Coordinate Agent, which is used to drive and manage the location property of a map item\ndynamically. The agent can obtain location updates from a field device provided the driver exposes\nthe location in either Decimal Degrees (DD) or Degree Minute Second (DMS) format. The agent can\nalso raise alarms when the location falls outside of certain areas (geofences).\n2. How to configure the GIS Add-on\n2.1.\nAdd the GIS datasource\n1. Ensure that you have installed the Geographic Information System (GIS) Add-on on the\nrequired Smart UI Server computer.\n2. Open the Smart UI Designer and login to this Server.\n3. In the Enterprise Manager, right click the Datasources node and select the Add Datasource\noption.\n4. Double click GIS in the list of the available datasources.\n5. Provide the required name of your GIS datasource and optionally select the desired\ncoordinate system. Click the Finish button. The newly created GIS datasource will be\navailable under the Datasources node.\n6. Right click the Server and select the Save Server Data option to save this datasource.\n7. Additional datasource can be added in the same way\n\n[Page 5]\nATQMS-MKTG-DOC-GIS - Quick Start Guide.docx\nP a g e | 4\n2.2.\nBuild the Hierarchy\nEach GIS node potentially represents both a hierarchy item and an actual asset. This means a GIS node\ncan simply be a logical grouping for child nodes, an actual asset in the field, or both. There are two ways\nof configuring the GIS datasource to add hierarchy and asset nodes.\nUse the configuration dialogs provided by the GIS datasource Smart UI Designer to manually build\nthe required hierarchy and add asset nodes\nAdvantages:\no Being an interactive wizard (series of dialogs), each step of the project performs its own\nerror checking, so any mistakes that you make are immediately picked up and need to be\naddressed before you can continue.\no This provides a structured \"first principal\" approach of creating the GIS database of items.\nDisadvantage:\no Once you are familiar with the process of creating items and particularly if you have a large\nnumber of items to add, this method becomes unwieldy to use. Tip: We recommend that you\nuse the configuration dialogs first to create your first site, area and items to get the hang of\nwhat data each field requires before bulk configuring your items using the Excel spreadsheet.\nUse an Excel spreadsheet to bulk configure the required sites, areas and their items. In this case edit\nthe GISTemplate.xlsx that is installed into the is installed in the Smart UI installation folder, which is\ntypically: C:\\Program Files\\Adroit Technologies\\Adroit\\SmartUI) to create your sites, their areas and\nitems, which already contains the necessary columns and provides further assistance regarding the\nrequired syntax and information required by each column.\nAdvantage:\no Being an Excel spreadsheet, it is easier to add the required items in bulk.\nDisadvantages:\no Since the project is created by importing an Excel spreadsheet, limited error-checking is\navailable.\no Requires that you have Microsoft Excel (version 2007 and above) installed to edit this\nspreadsheet.\n\n[Page 7]\nATQMS-MKTG-DOC-GIS - Quick Start Guide.docx\nP a g e | 6\nd. The default zoom level dictates which zoom level the map will be set to when navigating to\nthe pin on a map control. The default zoom should be somewhere between the minimum and\nmaximum zoom levels.\ne. When viewing the pin on a map, it will only be visible when the zoom level of the map is\nbetween the specified minimum and maximum zoom levels of the pin.\nf. There is also an option to hide the pin completely. This is useful when the node only\nrepresents a logical group and has no real location associated with it. Typically the location\nand zoom level of these nodes should be chosen that all its children will be visible when\nnavigating to it.\ng. If a geofence is defined for this node it can be displayed by checking the \"Show Alarm Fence\"\ncheckbox. The fence will be drawn in the same color as the pin, but with a higher\ntransparency.\nh. Specify the color and icon of pin for this node.\nNote: If you are designing your own icons, ensure that they fit within the provided icon template image\n(\"gis icon template.svg\" that is installed in the Smart UI installation folder, which is typically: C:\\Program\nFiles\\Adroit Technologies\\Adroit\\SmartUI) otherwise the colors of the states can be obstructed if your icons\nare too big.\n4. Geofence:\na. Specify the type of fence\ni. Polygon: The fence is described by a collection of points in the order they are entered\nii. Radius: The fence is described by a radius around a centre point. This is used to\ndefine a fence that triggers when the asset is has travelled more than a specified\ndistance from its start point.\nb. Enter the fence data for the alarm (and optionally the warning-) fence. If the pin is driven by\na coordinate agent, this data will be written back to the agent when the dialog is finished or if\nthe update button is pressed on the \"General Information\" tab.\n5. Graphic Form:\na. Specify a graphic form to open when the pin is clicked.\nb. Enter any aliases that the form might require.\n6. Alarming and Status:\na. Browse a tag to use to indicate that this asset is in alarm. An alarm condition will be shown\nwhenever this tag evaluates to true.\nb. Browse a tag to drive the status of the asset. The value of this tag will be compared to a set\nof user defined values on the Map control. If the incoming value matches any of these values,\nthe pin status area color will be set to the color associated to this value.\n7. Tooltip:\na. Set up a tooltip to display when hovering over this pin on a map.\nIf necessary, repeat this process for all your other sites and/or areas. Tip: In the Enterprise Manager,\nyou can remove unwanted items by using the right click Delete option.\n\n[Page 8]\nATQMS-MKTG-DOC-GIS - Quick Start Guide.docx\nP a g e | 7\n2.2.2. Using an Excel spreadsheet to bulk configure the required items\n1. Ensure that you have Microsoft Excel (version 2007 and above) installed.\n2. Right click on your GIS datasource and select \"Export\". You can use this blank export sheet as a\ntemplate. It is suggested that you add the first few items from first principles before exporting,\nso you have a few examples of proper formatting for each column.\n3. For each new item, add a new row and increment the ID. Set the ParentID equal to the ID of\nrow that contains the item that will be the parent of the new item. To add a node to the root, set\nthe ParentID to -1.\n4. Enter the DisplayName, Descriptor, Latitude and Longitude. If the pin is driven, enter the full\nname of the associated coordinate agent. Otherwise leave this field blank.\n5. ShowFences is set as follows:\nPin\nFence\n6. The export folder should contain an images folder. This should contain all the images that are to\nbe used by the datasource. The images should be named appropriately. The IconKey field should\nmatch the name (without extension) of the target image.\n7. Alarm- and StatusTag should be the full tag name (including slot).\n8. AliasKeys and -Values should be semicolon separated lists (in matching order) of the Alias names\nand values repectively.\n9. GeoFenceType should be set to nothing, Radius or Polygon. GeoFenceAlarmLats and -Longs\nshould be a semicolon separated list of the latitudes (and longitudes respectively) for the alarm\ngeofence, in order. The same applies to the WarningGeoFence fields.\n10. AttributeNames and -Values should be handled like the aliases.\n11. The TooltipText field should contain the entire, formatted tootltip text including placeholders and\nformat specifiers. The TooltipSubs field should be a semicolon separated list of the full\nDataElement names, to be inserted at the specified positions in the tooltip text.\n12. Right click on the GIS Datasource and select import. Browse in the appropriate .xls file and click\nFinish. The import will overwrite any current configuration completely. The process could fail if\nany part of the import sheet is badly formatted. Any failures will be reported, with reasons, if\navailable.\n\n[Page 9]\nATQMS-MKTG-DOC-GIS - Quick Start Guide.docx\nP a g e | 8\n3. Add and Configure a MappingControl\nThe MappingControl maps the defined items of a specific GIS datasource on a map and provides\nnavigation abilities so that users can view and/or interact with these items.\n1.\nIf necessary, add a project and a graphic form in the Enterprise Manager window of the Smart UI\nDesigner and ensure that this graphic form is opened.\n2.\nIn the Toolbox window, open the GIS category and drag the MappingControl onto the graphic\nform. If you do not see the GIS category or the MappingControl, right-click in the toolbox and\nselect \"Add controls\". In the configuration window that appears, find the GISMapControl item,\ncheck the box next to it and click finish. This will add the control to your toolbox.\n3.\nOpen the MappingControl Tasks menu.\nNote: This menu of tasks is displayed when the control is initially added and can be accessed by clicking\nits glyph usually displayed in the   left corner of the selected control.\n4.\nSelect the name of the required GIS datasource from the GIS Datasource list box. This displays the\nmap and all the items that you have configured on it, typically by using the default icons, allowing\nyour users to navigate between the specified items.\n5.\nYou can set the initial location of the map by using the CenterLatitude/Y and CenterLongitude/X\nproperties of the MappingControl to specify the centre point location of the map, in decimal\nnotation.\n6.\nYou can set the initial zoom level of the map too, by using the ZoomLevel property of the\nMappingControl.\n7.\nThe MappingControl has a native treeview that shows the GIS Datasource hierarchy. If required,\nthis treeview can be hidden, by setting the ShowTreeView property to false.\nThe MappingControl allows users to interact with the map as follows:\no Zooming: Use the mouse wheel to zoom in and out or change the magnification of the map.\nNote: Ctrl + and Ctrl - also zooms in and out, pressing the Home button returns to the initial\nzoom level and location.\no Panning: Click and drag to pan the map or change the portion of the map that is currently\nviewed.\no Treeview: Click a node in the treeview to highlight the associated pin. Double-clicking will center\nthe map at the location of the pin, at the configured default zoom level for that pin.\no Pins: By default, double clicking on a pin
