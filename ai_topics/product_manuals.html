will open the associated graphic form for that pin, using\nthe provided aliases. This operation can be fine-tuned, by changing the gISMapControl.OpenGF\nspider in the spider workspace (this spider is automatically created and configured when the\nMapping Control is added to the form.\no Hovering on a pin will show its configured tooltip.\nThe MappingControl control selects the free OpenStreetMaps Map Provider by default."}, {"title": "ATQMS-MKTG-DOC-MAPS4-Quick-Start-Guide", "href": "manual_chapters/ATQMS-MKTG-DOC-MAPS4-Quick-Start-Guide/index.html", "category": "Product Manuals", "rel": "manual_chapters/ATQMS-MKTG-DOC-MAPS4-Quick-Start-Guide/index.html", "kind": "Manual", "text": "____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 1 \nCOPYRIGHT \n \nCopyright © 2021 Advanced Worx 112 (Pty) Ltd. All rights reserved. \nInformation in this document is subject to change without notice. The software described in this document is furnished under \na license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of \nthose agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or \nany means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal \nuse without the written permission of Advanced Worx 112 (Pty) Ltd. \nAdvanced Worx 112 (Pty) Ltd \n20 Waterford Office Park \n189 Witkoppen Road (c/o Waterford Drive) \nFourways \nSouth Africa \n \nwww.adroittech.co.za \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nVersion \nDate \nAuthor \nComment \nApproval \n1.0 \n24.02.2020 \nUnknown \nOriginal \n \n2.0 \n24.05.2021 \nJ. Duncan \nUpdate Content and Flow; new Cover \n \n3.0 \n04.06.2021 \nJ. Duncan \nModify links \nC. Swanepoel \n4.0 \n18.06.2021 \nJ. Duncan \nMinor corrections \n \n5.0 \n30.09.2021 \nJ. Duncan \nQMS\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 2 \nContents \n1. \nIntroduction.......................................................................................................................................... 4 \n1.1. \nGeneral Overview ......................................................................................................................... 4 \n2. \nInitial Setup of MAPS ............................................................................................................................ 6 \n2.1. \nHardware & Software Requirements ............................................................................................... 6 \n2.1.1. \nRecommended Hardware & Software ........................................................................................................6 \n2.1.2. \nSoftware download .................................................................................................................................6 \n2.1.3. \nAdditional Software.................................................................................................................................6 \n2.2. \nLicensing ..................................................................................................................................... 6 \n2.2.1. \nLicensing definitions................................................................................................................................6 \n2.3. \nPrerequisites for installing MAPS software ....................................................................................... 6 \n2.4. \nInstallation .................................................................................................................................. 7 \n3. \nConfiguring MAPS ............................................................................................................................... 10 \n3.1. \nNew Configuration ....................................................................................................................... 10 \n3.2. \nCreating a Device ........................................................................................................................ 11 \n4. \nRunning MAPS .................................................................................................................................... 13 \n5. \nConfiguring a Project .......................................................................................................................... 15 \n5.1. \nMAPS SmartUI Designer ............................................................................................................... 15 \n5.1.1. \nEnterprise Manager .............................................................................................................................. 16 \n5.1.2. \nAdding a New Project and Graphic Form .................................................................................................. 17 \n5.1.3. \nProperties ........................................................................................................................................... 18 \n5.1.4. \nToolbox .............................................................................................................................................. 19 \n6. \nConfiguring the Agent Server ............................................................................................................. 21 \n6.1. \nAgents ....................................................................................................................................... 21 \n6.1.1. \nAdding an Agent .................................................................................................................................. 22 \n6.1.2. \nSlots ................................................................................................................................................... 23 \n6.1.3. \nTag .................................................................................................................................................... 23 \n6.2. \nScanning .................................................................................................................................... 24 \n6.2.1. \nScanning a Tag .................................................................................................................................... 24 \n6.3. \nData logging ............................................................................................................................... 25 \n6.3.1. \nDatalog an Analog value ........................................................................................................................ 25 \n6.4. \nAlarming .................................................................................................................................... 27 \n6.4.1. \nAlarm Routing ...................................................................................................................................... 27 \n6.4.2. \nAlarm Types ........................................................................................................................................ 29 \n7. \nDisplaying Data................................................................................................................................... 30 \n7.1. \nBehaviours ................................................................................................................................. 30 \n7.1.1. \nDisplaying a value ................................................................................................................................ 30 \n7.1.2. \nChanging a value setpoint...................................................................................................................... 32 \n7.2. \nLine Charts ................................................................................................................................. 35 \n7.2.1. \nDisplay Historical Data .......................................................................................................................... 35 \n7.3. \nAlarm Viewer Control ................................................................................................................... 37 \n7.3.1. \nDisplaying an Alarm list ......................................................................................................................... 37 \n8. \nReusable Objects ................................................................................................................................ 39 \n8.1. \nWizards ...................................................................................................................................... 39 \n8.1.1. \nAdding a Pre-defined Wizard .................................................................................................................. 39 \n8.2. \nTemplates .................................................................................................................................. 40 \n8.2.1. \nOpening a Template ............................................................................................................................. 40 \n9. \nSmartUI Operator ............................................................................................................................... 43 \n9.1. \nRunning the Operator .................................................................................................................. 43 \n10. \nConfiguring an end-to-end MAPS Life Cycle Project .......................................................................... 44 \n10.1. \nPre-configuration Requirements .................................................................................................... 44 \n10.2. \nConfiguring the MAPS Project ....................................................................................................... 45\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 3 \n10.3. \nMAPS life cycle project. ................................................................................................................ 46 \n10.3.1. \nBulking Configuration ........................................................................................................................ 54 \n10.3.2. \nGenerating the Project Files ............................................................................................................... 55 \n11. \nAppendix A – Configure the PLC ......................................................................................................... 63 \n12. \nAppendix B – MAPS Supported Equipment and Instrumentation template library ........................... 68 \n12.1.1. \nInstrumentation equipment templates ................................................................................................. 68 \n12.1.2. \nElectrical equipment templates ........................................................................................................... 69 \n13. \nAppendix C – Additional Resources .................................................................................................... 70 \n14. \nMAPS Product Suite Documentation .................................................................................................. 71\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 4 \n1. Introduction \nThe MAPS Quick Start Guide document is designed to help the new user install, configure and get an \nunderstand of the various MAPS sub-systems. In addition to assist a new user in understanding the MAPS \napproach to SCADA/HMI project development and concepts surrounding the MAPS product. \n \n1.1. \nGeneral Overview \nIn order to understand MAPS it is important to understand the basic architecture of the product. \nBelow is a diagram, which represents the basic standalone architecture. \n \n \nFigure 1: Basic Stand Alone Architecture \n• \nFront end device (FED): The front-end device is a general term used for a PLC; OPC server; \nRTU; a controller; or any software package that allows third party communication (i.e. OPC, \nSIMATIC NET). \n• \nProtocol driver: MAPS supports +- 100 different protocols. Once a new driver has been installed \nand configured to talk to a FED, it is called a Device. A single protocol can support multiple \nDevices. An example of this is the user can have multiple FEDs which use the same protocol \n(i.e. MODBUS Ethernet), each FED will have its own IP address/Address. A device will need to \nbe created for each FED. \n• \nAgent Server (AS): The Agent Server (I/O Server), is the real-time database, which handles the \nreal-time values and if configured, will handle all post-processing, logging and/or alarming the \ndata. \n• \nSmartUI Server (SUIS): The SUIS is a middleware server which exposes data from a number of \ndisparate sources, using the datasource, and also acts as a repository for the graphic forms or \nmimics. It also acts as the manager of access, and broker for the unified data model \nimplemented across all data types that may end up in the \n• \nDatasource: Each source of data (i.e. MAPS Agent Server) requires a datasource plugin before it \ncan be associated with the SmartUI Server. This provides the ability to expose its data as data \nelements. An example of a data element is Adroit.Analog.SAMPLEANALOGUE.value. The \nSmartUI Server connects to data using two different types of datasources: \n• \nThe SmartUI Server allows multiple sources of data to be available to the configuration of a \nsystem in a unifed manner. It basically coverts all datatypes into universally usable elements \n(dataelements).\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 5 \nDatasource \nPurpose \nMAPS \nExposes the configured agents and their slots, of the connected MAPS Agent Server. \nEvent Log \nExposes the events within the Windows event logs of the connected specific computer. \nOLE DB \nExposes the data within a specific OLE DB compliant database or data store. \nServer Scripts Stores scripts that can be run on the Server. \nSimulation \nExposes a wide variety of different types of generated data \nWebServices \nExposes a wide variety of data available in web services \nNote: For further information on the available datasource see the MAPS help. \n• \nClients: The MAPS SUI comes with a number of types of clients which can securely connect to \nthe SmartUI Server: \na. Designer: The SmartUI Designer allows the user to configure datasources as well as create \nand design graphic forms. \nb. Operator (View Clients)allows the user to operate graphic forms \nc. Performance Anywhere: An HTML5 web reporting client for building dashboards \nd. Adroit Air: Mobile App for push notifications such as operator messages, alarms and process \ndata (runs on Android and IoS) \nWhen connecting to the SUIS the user will be prompted for login credentials. The default credentials \nare the same as the Windows credentials that the user installed MAPS SUI under.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 6 \n2. Initial Setup of MAPS \n2.1. \nHardware & Software Requirements \n2.1.1. \nRecommended Hardware & Software \nPlease refer to the Hardware & Software Specification document available from our website. \nhttps://adroittech.co.za/downloads-tree-view/ \n \n2.1.2. \nSoftware download \nDownload the software, available from our website. \nhttps://www.mapsscada.com/downloadsacc/ \n \n2.1.3. \nAdditional Software \nAdditional software that will expand the functionality of MAPS: \n• \nInternet information services (IIS): Required for web service and distribution service. \n• \nSQL with advanced reporting services: used for historical data logging and reporting. MAPS \nships with the free SQL Express that can be used for these purposes. \n2.2. \nLicensing \nTypically, the Agent Server is licensed via a HASP software protection hardware key, which is inserted into \nthe USB port of the computer on which the Agent Server is running. This HASP is then programmed in \naccordance with your specific license agreement. \nIn situations where it is not possible to use a physical HASP, it is also possible to license MAPS via a \nsoftware license, which is only available on request. For further details, contact your MAPS representative \nfor details. \n2.2.1. \nLicensing definitions \n• \nScan points: When a memory address is scanned/attached in the PLC and for every DBAccess \nAgent; Script Agent; and SNMP Agent a Scan Point is consumed. \n• \nVersion: HASPs are licensed against versions of MAPS. \nIMPORTANT: The former Remote Nodes licenses that applied to all types of clients have been DISCONTINUED. These \nhave now been replaced by the following client specific node licenses, each of which have different costs: \no Clients: typically Operators and/or Designers and \no Mobile/Web Clients: typically Performance Anywhere or Adroit Air clients. \n• \nOEM: Additional components that are separately licensed are specified as separate textual \nentries in the product license e.g. MAPS Alarm Management enablement, MAPS Historian \nenablement; Max Demand Agent, OEE Agent; Siemens Ethernet driver; DNP 3.0 driver. \nA time limit is set on development HASPs. Production HASPs have no time limit. \n2.3. \nPrerequisites for installing MAPS software \n1. Ensure that the Windows operating system on which you intend to install MAPS has been \nand remains legally licensed and ACTIVATED, since MAPS is not supported when it is run on \nan unlicensed Windows operating system. \n2. Ensure that you are not using the built-in Administrator account to run MAPS, since UAC is \nautomatically disabled whenever this built-in Administrator account is used.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 7 \n3. When installing and running MAPS on an operating system that provides User Account \nControl (UAC), such as Windows 7 or Windows Server 2008, please ensure that UAC is always \nENABLED, since MAPS is not supported when it is run with UAC disabled. \n4. MAPS 4 requires the Microsoft .NET Framework 4.6.2 \n5. The Web Service component can ONLY be installed on a computer that has IIS (Internet \nInformation Services) installed. \n2.4. \nInstallation \n1. Install the MAPS software from either the download or media supplied. \n2. Click on the MAPS installation executable option. \n \nFigure 2 - License Agreement \n3. Select the “I accept the agreement” to accept the EULA, then click the next button. \n \nFigure 3 – Release Notes \nNOTE: The release notes contain all the information regarding the new version of MAPS. It is \nrecommended that the user familiarise themselves with this document, then click the Next button.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 8 \n \nFigure 4 - Select Installation Type \n4. The user will now be prompted to select which type of installation they require. The Typical \ninstallation will install a stand-alone MAPS. Click the Next button. \n \nFigure 5 - Ready to Install \nThe Ready to Install screen give the user a summary of what will be installed. \n5. Click on the Install button. \n \nFigure 6 - Component Configuration Settings\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 9 \n6. The component configuration screen will give the user the option to setup the agent server \nand SmartUI server services. \n7. Make sure that the Configure services is checked. \n8. Set the Username to the current logged on user, supply the password in the corresponding \ntext boxes. \nNOTE: If the user requires the agent server and SmartUI server to start automatically then check the “Start the Agent Server \nservice automatically”. \n \n \nFigure 7 - SmartUI Theme \n9. Select the preferred Theme, then click Next button. \nThe installation will begin. \n10. Once the installation is complete restart the PC/server.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 10 \n3. Configuring MAPS \n3.1. \nNew Configuration \n \nFigure 8 - MAPS Config Editor \nThe MAPS Config Editor application is used to customize the installed applications and/or services by \nmodifying their default settings. First create a new configuration by following these steps: \n1. Select the Configuration menu item on the top left and check on “Allow Multiple \nConfigurations” option. \n \nFigure 9 - Allow Multiple Configurations \n2. Select the Add new configuration button.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 11 \n3. Give the new configuration a name. Then click the Ok button. \n \nFigure 10 - Create a new configuration \n4. Once the configuration has been created click the Ok button. \n3.2. \nCreating a Device \nSetup the OPC Client to the MAPS BatchOPC Server demo application. This application is part of the MAPS \ninstall. \n1. Open the Driver configuration in the MAPS Config Editor, under the Agent Server \nConfiguration. \n \nFigure 11 - Driver Configuration\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 12 \n2. Select the OPC Client Protocol driver, then click on the Add button. \n3. Enter the device name BAT_01 \n \nFigure 12 - Device Name \n4. In the OPC client driver configuration select the MAPS Batch OPC Server in the OPC server \ndrop down box. \n5. Click Ok. \n6. Click Ok on the performance counter installation. \n \nFigure 13 - OPC client configuration\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 13 \n4. Running MAPS \nMAPS is a client/server application and as such in a distributed architecture, particularly in large systems \nthe Agent Server and SmartUI Server would typically reside on a separate machine and all the Operators \non separate PC’s. In smaller stand-alone applications the Agent Server, SmartUI Server, Designer and \nOperator would reside on a single PC. For this reason you need to start The Agent Server and the Client \nApplications (Designer/Operator) separately. The SmartUI Server will start automatically when you start \nthe Agent Server application. \n1. On the desktop start the MAPS Agent Server. \n \n2. If the PC does not have MAPS Licensing, then the server will start with a timed limited demo \nlicense. Click OK on the agreement. \n \nFigure 14 - Time Limited License Agreement \n3. The MAPS Agent Server (AS) will load. Check that the server loads without any errors and \nthat the AS displays a LOAD complete. \n \nFigure 15 - MAPS Agent Server \n4. Once the AS has finished loading the AS will start the SmartUI Server. Check to make sure \nthat the SmartUI Server shows it is Running. This can be done by launching the SmartUI\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 14 \nServer application window from its icon on the desktop. In normal conditions you don’t need \nto do this but for starters it’s worthwhile understanding each component within the system. \n \nFigure 16 - MAPS SmartUI Server\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 15 \n5. Configuring a Project \n5.1. \nMAPS SmartUI Designer \n1. To begin creating a project the user will need to run the MAPS SmartUI Designer by clicking \non the Icon on the desktop. \n \n2. The user will then be prompted to login to the local SmartUI server. The user login is the \nsame as the user’s Windows OS credentials. \n3. Enter the Login Name and Password, typically your Windows configured credentials. \n4. Click on the Finish button. \n \nFigure 17 - SmartUI Designer User Login \nNote: by checking the “Automatically Login” check box the designer will auto login in future launches. \n \nThe Designer environment is where the user will spend most of their time. It is a single engineering \nwindow to your entire project. The user will manage connections to datasources, access the Agent Server \nfor Agent/Tag configuration, manage and apply security and build the graphical forms for the project. \n \nFigure 18 - SmartUI Designer\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 16 \nThe Designer has views that are docked around the centre design area. The most important of these is \nthe Enterprise Manager. \nTo reset the Designer layout, open the View ribbon and click on the “Reset to Default Layout” button. \n \n \n5.1.1. \nEnterprise Manager \nThe Enterprise Manager view is where the user configures the MAPS Project. \n \n \nFigure 19 - Enterprise manager \nThe Enterprise Manager has three areas, they are: \n \nDatasources \nThis area is where the user can create and manage the datasources. There are 3 default datasources \nwhich are created automatically, these are: \n• \nMAPS – This datasource connects to the local Agent Server. \n• \nEventlog – This datasource connects to the local Windows event log. \n• \nObjectModel - The object model datasource enables you to enhance your existing wizards, by adding \nSCADA configuration to them. Its main function is to save you engineering time when bulk creating \nobjects, such as items of equipment, which require similar HMI/SCADA configuration. \nManagement \nManagement consists of 3 sub-settings: \na. Profile – a default profile is created at installation which is used to manage user-specific \nconfiguration of the SmartUI Designer and SmartUI Operator. The profile manages all user-\nspecific settings like language, scripting, colour settings, menu settings and SmartUI Operator \nsettings to the graphic form.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 17 \nb. Security – Security in SmartUI is user-centric and operates on top of the traditional Windows \noperating system security, using a configurable sub-set of the existing users and groups on \neach Server computer, known as the “allowed” users and groups. For instance, when a Client \n(Designer or Operator) is launched, it is necessary to login to a Server and only a user that is \neither an allowed or a member of an allowed group on this Server is able to log into it. In \naddition to controlling the access of these “allowed” users and groups to the Server, its \nconfigured datasources and their data, it is possible to control or limit the access that these \nusers have within each Client (Designer or Operator). \nc. System – is mainly only for system monitoring reasons. This allows you to display which \nclients are connected, subscription pool, message queues, etc. \nProjects \nThe Projects area is where you create, build and store your own Graphic Forms. The Projects \ndirectory by default will have Shapes Wizards and Examples and System Information graphic forms \nuseful for incorporating for technicians to manage the HMI/SCADA project at runtime. (all the sample \nproject layouts incorporate these system management elements) \nNote: Projects can have sub-folders containing your graphic forms and it is important to give this structure some thought. We advise \nthe use of the ISA95 as a guideline which defines the physical structure of your plant, including enterprise, plant area, site, etc. \n5.1.2. \nAdding a New Project and Graphic Form \nTo create a new project: \n1. Select the Projects folder in the Enterprise Manager. \n \n2. On the Home ribbon click on the New Project icon. \n3. Give the new project a name, Plant A. \na. Please note, although we are not using them in this Quick Start Guide we recommend \nchoosing a template o which to base your project by checking “Show Project \nNavigation and Style Configuration and selecting a project layout that suits the \napplication you are building. This will give you a very good navigation and folder \nstructure as a basis for an actual project implementation. We have set these up with \ncorrect Properties in order to deal with most scenarios where for example you are \nusing different resolution screens for Operators and scaling is important (a whole \ncomplex subject by itself). \n4. Click the Finish button. \n \nFigure 20 - Add a new project \nNote: if the project does not appear straight away click on the Refresh icon on the Home ribbon.\n \n• \nSelect the new project Plant A. On the Home ribbon select the New Graphic Form Icon\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 18 \n \n \n• \nName the graphic form “Overview”. The new graphic form is now open in the design area. \nNote: It is possible to rename by right clicking on the GF and selecting Rename in the menu. \n \nFigure 21 - Enterprise Manager with new project \n5.1.3. \nProperties \nThe Properties view contains all properties of the selected object that is placed on the GF. The GF \nproperties are displayed by default.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 19 \n \nFigure 22 - Properties View \n5.1.4. \nToolbox \nThe Toolbox view contains all the base objects that the user will add to the graphic form. The \nToolbox view can be found below the Enterprise Manager view. \n \nFigure 23 - Toolbox View \nNote: Objects are grouped by their function and class. \n \nAdd an Object to the Graphic Form (GF)\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 20 \nTo place a new Object on the GF “Overview”: \n1. Make sure that the GF “Overview” is open. \n2. Under Windows Forms in the Toolbox select the control Label and click on the opened GF. \n3. Set the following properties of the label. \n• \n(Name):lblActTempValue \n• \nAutoSize:True \n• \nBackcolor:White \n• \nFont:Arial, 9pt, style=Bold \n• \nText:00.00 deg C \n4. Clicking on the Save icon \n on the top left of the design area. This will save the current \nselected GF. \n \nFigure 24 - Added New Object to GF\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 21 \n6. Configuring the Agent Server \nTo interact with the Agent Server (AS) the user will need to launch the MAPS Configurator by clicking on \nthe Open Configurator icon on the Home ribbon. \n \n \nFigure 25 - Agent Server Configurator \n6.1. \nAgents \nThe most fundamental building blocks of MAPS Agent Server are intelligent objects called Agents. In \naddition to being able to manipulate their own data, they can read and write from the FED and to other \nagents and so influence them. All Agents are grouped into three Agent groups, to allow easier access to \nAgents that are needed for a project, they are: \n \n• \nPrimitive Agent types \nBoolean, Frame, Integer, Real, Text \n \n• \nBasic Agent types \nAnalog, Counter, Date, Digital, Expression, Marshal, MultiState, String, StringList, Timer \n \n• \nAdvanced Agent types \nAgentGroup, Alarm, AlarmList, AlarmManagement, ARec, Command, DBAccess. DBLog, DBQuery, \nEventLog, EventOutput, MultiMedia, Notify, Recipe, Scheduler, Script, Shift, Shift_Adv, Statistical Agent \n \n• \nMIS/MES Agent types \nAccumulator, MaxDemand, OEE, OEE_Adv, PID \n \n• \nIT/IoT Agent types \nAudit, DumpConfig, ICMP, IoT, Perfmon, SNMPMgr \n \n• \nSystem Agent types\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 22 \nAlias, Beeper, DataLog, Device, Hasp, Proxy, Scan, SystemDataLog, SystemInformation \n6.1.1. \nAdding an Agent \nTo create a new Analog agent in the AS: \n1. Open the Configurator. \n2. Check Basic Agents and expand the selection of the Agent Types that belong to this group. \n3. In the Configurator change the selected agent Type to Analog \n4. Using a pre-defined Naming strategy give the new agent the name: \nBAT-01-MIX-01-TEM with a description: Batch Mixing Temperature. \n5. Click on the Add button to create the agent. \n6. Select File and Save, to save the agent server. \n \n \nFigure 26 - New Analog Agent \n7. Select the Agent BAT-01-MIX-01-TEM the click on the Edit.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 23 \n8. Change the Analog set points as follows: \na. Device Span \n• \nMinimum:0 \n• \nMaximum:4095 \nb. Engineering Span \n• \nMinimum:0 \n• \nMaximum:45 \nc. Alarms \n• \nHigh-high:35 \n• \nHigh:25 \n• \nLow:0 \n• \nLow-Low:0 \n \nFigure 27 - Edit Analog Agent \n6.1.2. \nSlots \nAgents are made up of Slots. Slots of an Agent are values (attributes) or fields within an Agent that can \nbe retrieved and/or set. The slots within an Agent can drive the logic/function of the Agent. \n6.1.3. \nTag \nA fully qualified named value in MAPS made up of an agentName.slotName and in the MAPS world are \nthen known as Tags All tags within MAPS can be driven, changed internally or externally.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 24 \n6.2. \nScanning \nScanning values simply means communicating using a predefined protocol from a memory address of a \nFED to a TAG. \n6.2.1. \nScanning a Tag \nTo scan the RawValue slot of the of BAT-01-MIX-01-TEM Analog Agent to the MAPS Batch OPC Server: \n1. Open the MAPS Configurator. \n2. Select the Analog Agent BAT-01-MIX-01-TEM. \n3. Click on the Scan button. \n4. In the scanning configuration, select the device BAT_01 in the Device dropdown box. \n5. The user will be prompted to create the device. \n6. Click the Yes button. The MAPS Batch OPC Server will automatically start. \n \nFigure 28 - Batch OPC Server \n7. Enter the OPC address ActualMixTemp into the address field and change the Scan rate to 0. \n8. Click on the Scan button to add the scan job to the device.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 25 \n9. Select the Started radial button to start communicating with the OPC server. \n10. Click OK on the scanning dialogue and save the Agent Server Configuration. \n \nFigure 29 - TAG Scanning Configuration \n6.3. \nData logging \nMAPS allows the value of a fully qualified named TAG value in MAPS AS (Agent.Slot) to be recorded or \nlogged to either proprietary log files or an OLE DB-compliant database. \n6.3.1. \nDatalog an Analog value \nTo datalog the value slot of the Analog agent BAT-01-MIX-01-TEM: \n \n1. Select the agent BAT-01-MIX-01-TEM, then click on the Log button. \n2. Set the datasource path by clicking on the browse button \n, then browse the path: \nC:\\ProgramData\\Adroit Technologies\\MAPS\\Configurations\\Quick Start Guide\\Datalogs \n3. Create the log file Temperature.LGD. Then click Open.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 26 \n \nFigure 30 - Select DataLog File \n4. Click on the length button and set the log length to 1 month. \n5. Under Deadbands click the Time button and set the period to 1 second. \n6. Click on the Start radial button to start the datalog. Then click on the OK button and save \nthe Agent Server. \n \n \nFigure 31 - Edit Datalog Agent\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 27 \n6.4. \nAlarming \nThe alarming capability of the MAPS SCADA is exceptionally powerful and needs careful attention. Alarming \ncan simply be explained by breaking the system down in to two parts. \n6.4.1. \nAlarm Routing \nAlarm routing, which is configured in the Alarm agent, is where the user will configure the outputs of an \nalarm. MAPS Alarming supports multiple routing outputs such as Alarm Lists; SMSs; Emails; Event logs; \nMultimedia notifications. \n \nSetting up an Alarm Agent Route \nConfiguring a route in the default alarm agent, which will send all configured alarms to an Alarm list: \n1. Open the MAPS Configurator. \n2. Select the agent type Alarm list. \n3. Create a new alarm list agent called BAT-01-MIX-01-ALM-LST. \n \nFigure 32 - Alarm List Agent\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 28 \n4. Select the Agent Type Alarm, edit the DEFAULTALARMAGENT. Make sure the selected route \nnumber is set to 2. \n5. In the Alarm List route definition click on the browse button\n. \n6. In the Agent browser select the Alarm list agent BAT-01-MIX-01-ALM-LST. \n7. Click Ok. \n8. Click on the defaultAlarmAgent agents’ Ok button and save the Agent Server configuration. \n \nFigure 33 - Default Alarm Agent\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 29 \n6.4.2. \nAlarm Types \nAlarm Agents can monitor other Agents with pre-set Alarm Types. An alarm type is simply the required \ncondition or state of an Agent’s header slots. A default Alarm Agent, created on start of a blank AS \ndatabase, contains a number of pre-defined alarm types. \n \nAlarming an Analog Agent \nTo alarm the high and High-high slots of the Analog Agent BAT-01-MIX-01-TEM, using the default alarm \nagent: \n1. Open the MAPS Configurator. \n2. Select the Analog Agent BAT-01-MIX-01-TEM. \n3. Click on the Alarm button. \n4. Move the Available Alarm type High from Available to Current by double clicking the alarm \ntype. Make sure that the Select route is set to 2. \n5. Repeat the process for the alarm type High-high. \n \nFigure 34 - Alarming an Analog Agent\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 30 \n7. Displaying Data \nOnce the Agent Server has been configured the user can now display and manipulating the data on a \ngraphic form using behaviours. Behaviours are used to create the dynamics pertaining to the Tag and how \nOperators interact with the graphical representation on any screen. \n \n7.1. \nBehaviours \nBehaviours are used to display and manipulate data elements. The MAPS SmartUI supports the following \nbehaviours: \n• \nBind Value - Drive a data element (value) to and/or from the value of a property of a control or \nvector. \n• \nColor - Assign colors to the two states of a digital (Boolean) value; to blink a specific Color \nproperty or the VISIBILITY property either continuously or triggered by a value. Also define \nstates of color based on specific value ranges to provide a visual indication of a value, as well \nas define states of color based on a bit mask - a specific sequence of bits that are set for up to \n32 bits to provide a visual indication of each bit mask. \n• \nDisplay Value - Display and if necessary, format a value. \n• \nExecute Command - Perform commands, such as launching an application or opening, closing \nor printing a graphic form or logging a user on or off and/or switching users. \n• \nFlip Bitmap - Create a defined sequence of images or a multi-image display, this behaviour can \nonly be added to a Picture vector object. \n• \nLocation - Dynamically move the object linearly in a defined X-Y direction by means of a \nmonitored value. \n• \nOperator Action - Typically provides methods that allow end users to change a value at \nruntime. \n• \nPercentage Fill - Dynamically fill an object by means of a monitored value. \n• \nRotation - Dynamically rotate the object by means of a monitored value. \n• \nSize - Dynamically resize the object linearly by means of a monitored value. \n• \nTooltip - Display additional information when the mouse cursor hovers over the object. \n• \nVisibility: Display or hide an object depending on a Boolean value. \n• \nDatabase: To execute a database query from a graphical form, without writing a script \nNote: The behaviour configuration dialogue provides an Advanced View button that displays more advanced configuration \noptions. \n7.1.1. \nDisplaying a value \nDisplay the analog value of the Agent BAT-01-MIX-01-TEM using a display value behaviour. \n1. In the Designer open the graphic form Overview that you previously created. \n2. Select the label placed in the previous exercise. \n3. Select the Behaviours ribbon. \n4. Click on the Display Value button.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 31 \n5. In the Display Value dialog click on the Input Data Element browser button. Browse for the \ndata element Adroit.Analog.BAT-01-MIX-01-TEM.value. \n6. Click the Finish button. \n \nFigure 35 - Data Element Browser \n7. Change the String format to {0:F2} deg C. \n8. Click the Finish button. \n \nFigure 36 - Display Value Behaviour \n9. Save the graphic form and test by clicking on the Run button\n, in the design area \nmenu bar. The label should display the value 18.00 deg C. The user can run the batch plant \nsimulator by clicking on the Auto start label in the OPC simulator. \nNote if the value is not displaying correctly make sure that he time license on the agent server has not run. If so, restart the Agent Server.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 32 \n7.1.2. \nChanging a value setpoint \nChanging the Analog agents BAT-01-MIX-01-TEM alarm setpoints using the Operator Action \nbehaviour. \n• \nOpen the graphic form Overview, place two more labels on the graphic form with the following \nproperties: \no (Name):lblActTempHihi \n▪ AutoSize:True \n▪ Backcolor:White \n▪ Font:Arial, 8pt \n▪ Text:High high alarm SP: 00.00 deg C \no (Name):lblActTempHi \n▪ AutoSize:True \n▪ Backcolor:White \n▪ Font:Arial, 8pt \n▪ Text:High alarm SP: 00.00 deg C \n \nFigure 37 - Graphic Form Displaying Alarm Setpoints\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 33 \n• \nSelect the label lblActTempHihi. Add a new Display Value behaviour to the object. \no The Input Data Element is \n▪ Adroit.Analog.BAT-01-MIX-01-TEM.hiHi, \no And the String formatting is \n▪ High high alarm SP: {0:F2} deg C \n• \nSelect the label lblActTempHi. Add a new Add a new Display Value behaviour to the object. \no The Input Data Element is \n▪ Adroit.Analog.BAT-01-MIX-01-TEM.hi, \no And the String formatting is \n▪ High alarm SP: {0:F2} deg C \n• \nSelect the label lblActTempHihi. Add a new Operator action behaviour, set the inputs as follows: \no Data Element:Adroit.Analog.BAT-01-MIX-01-TEM.hiHi \no Minimum DE:Adroit.Analog.BAT-01-MIX-01-TEM.hi \no Maximum DE:Adroit.Analog.BAT-01-MIX-01-TEM.engMax \n• \nFor the Action Type Select Data Entry. Click the finish button. \n \nFigure 38 - Operator Action Behaviour for Alarm High-high Set Point \n• \nSelect the label lblActTemphi. Add a new Operator action behaviour, set the inputs as follows: \no Data Element:Adroit.Analog.BAT-01-MIX-01-TEM.hi \no Minimum DE:Adroit.Analog.BAT-01-MIX-01-TEM.lo \no Maximum DE:Adroit.Analog.BAT-01-MIX-01-TEM.hiHi \no For the Action Type Select Data Entry. Click the finish button.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 34 \n \nFigure 39 - Operator Action Behaviour For Alarm High SP \n• \nSave and run the graphic form. Adjust the High Alarm SP by clicking the appropriate label and \nentering a new setpoint. \n \nFigure 40 - Change Alarm High Setpoint\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 35 \n7.2. \nLine Charts \nThe line chart control is used to display live as well as logged data from the MAPS Agent Server. \n7.2.1. \nDisplay Historical Data \nUsing the Line Chart control to display the logged data of the Analog Agent BAT-01-MIX-01-TEM. \n1. Confirm that the graphic form Overview is open and not in run mode. \n2. From the toolbox view under Data select the LineChart control and place it on the graphic \nform. Once the control has been placed the LineChart configuration will open. \n3. Change the Title of the series from Line to Actual Mixing Temperature by double clicking on \nthe series name Line. \n \n \nFigure 41 - Configuration Line Chart Series Name \n4. Select the Values tab in the series setup. Then setup the values as follows. \n• \nValues:Adroit.Analog.BAT-01-MIX-01-TEM.value \n• \nMin:Adroit.Analog.BAT-01-MIX-01-TEM.engMin \n• \nMax:Adroit.Analog.BAT-01-MIX-01-TEM.engMax \n• \nUnits:Adroit.Analog.BAT-01-MIX-01-TEM.unit \n• \nDescription:Adroit.Analog.BAT-01-MIX-01-TEM.agentDescription\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 36 \n \nFigure 42 - Configuration Line Chart Series Values \n5. Click the finish button save the graphic form. \n6. Click on the Run button. \n7. Start the batching process to change the Mixing Temperatures Value. \n \nFigure 43 - Displaying Logged data\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 37 \n7.3. \nAlarm Viewer Control \nThe Alarm viewer control allows the user to connect to ether an Alarm Agent or an Alarm list agent in \nthe MAPS Datasource. The control, once connected to a valid alarm list, will display all routed alarms \nand allows the user to acknowledge and filter the displayed alarms. \n7.3.1. \nDisplaying an Alarm list \nUsing the Alarm viewer control to display alarms routed to the alarm list agent BAT-01-MIX-01-ALM-LST. \n1. Confirm that the graphic form Overview is open and not in run mode. \n2. From the toolbox view under MAPS select the AlarmViewer control and place it on the graphic \nform. \n3. Select the task icon \n on the top right of the alarm control, this will open the task menu. \n \nFigure 44 - MAPSAlarmViewer Tasks menu \n4. Click on the General Configuration, which will open the MAPS alarm viewer Configuration. \n5. Change the Alarm type to AlarmListAgent. \n6. Set the Alarm List / Alarm Agent to Adroit.AlarmList.BAT-01-MIX-01-ALM-LST.alarmList.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 38 \n \nFigure 45 - MAPS Alarm Viewer Configuration \n7. Click the Finish button, save and run the graphic form. \n8. To test the Alarm view drop the High alarm set point below the value. \n \nFigure 46 - Displaying Alarm Incident\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 39 \n8. Reusable Objects \nMAPS has a two mechanism that allow for re-usable objects, Wizards and Templates. \n \n8.1. \nWizards \nAre user defined/created objects such as pumps; motors; analogue displays. The behaviours of a wizards \ncan contain substitution. MAPS contains a library of Shapes Wizards and Examples that contain a number \nof pre-defined wizards. \n8.1.1. \nAdding a Pre-defined Wizard \nAdding the wizard wzdAnalogueIndicator_Large_Horizontal_v01 from Situational awareness library to the \nOverview graphic form. \n1. Confirm that the graphic form Overview is open and not in run mode. \n2. Select the Shapes Wizards & Examples ribbon, Select the Situational Awareness in the drop \ndown box on the left of the ribbon. \n \n3. Click \non \nthe \nIndicators \ndropdown \nbox, \nselect \nthe \nwizard \nwzdAnalogueIndicator_Large_Horizontal_v01 then click on the Overview graphic form. \n4. The user will then be prompted to supply a substitution for the Analogue Agent, Click the \nbrowse button and select the data element Adroit.Analog.BAT-01-MIX-01-TEM make sure \nthat the data element does not contain a slot. The result should be green to display a valid \ndata element. \n \nFigure 47 - Substitution Assignment \n5. Click the Finish button, save and run the graphic form.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 40 \n \nFigure 48 - Display the Analogue indicator Wizard. \n8.2. \nTemplates \nAdroit Templates are re-usable graphic forms that can be used at run-time. The fundamental difference \nbetween a graphic form and a Template is that a Template has substitution abilities. This really means \nthat wherever you have repeatability for displays, such as machine process values you can effectively \ncreate a single trend configured as a Template and at runtime when you click on a certain machine you \ncan simply launch the Trend and substitute that machines values. \n8.2.1. \nOpening a Template \nOpen the template Analogue Faceplate Template from a button on the graphic form Overview. \n1. Confirm that the graphic form Overview is open and not in run mode. \n2. From the toolbox view under Windows Form select the button control and place it on the \ngraphic form. Set the following properties of the button \na. (Name):btnActTempValue \nb. Font:Arial, 9pt \nc. Size:107, 45 \nd. Text:Analog Faceplate \n3. With the button btnActTempValue selected, add a new Execute Command behaviour. \n4. Set the Command dropdown box to Open graphic form. Browse for the Graphic Form to \nShapes Wizards and Examples.Templates.Analogues.Analogue Faceplate Template\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 41 \n \nFigure 49 Graphic Form Selection \n5. Change the Open as: dropdown box to Modeless Form. \n6. Click the Finish button. \n \nFigure 50 - Execute Command Behaviour \n7. Click on the Advanced View > button, then select the Aliases tab. The Analogue Data Element \nSubstitution should be available in the Alias list. If not click on the get Aliases button. \n8. Click on the input field and select the Browse button and browse the data element \nAdroit.Analog.BAT-01-MIX-01-TEM.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 42 \n \nFigure 51 - Execute Command Behaviour Substitution \n9. Click the Finish button, save and run the graphic form. When the user clicks the button, the \nuser will see an error “This action is only available in the Operator”. \n \nFigure 52 - Operator Action Error \nThe User will need run the SmartUI Operator application to start the Operator view.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 43 \n9. SmartUI Operator \nTo view a project the user will need to run the MAPS SmartUI Operator by clicking on the Icon on the \ndesktop. \n \nThe user will then be prompted to login to the local SmartUI server. The user login is the same as the \nusers Windows credentials. Enter the login Name and Password. Click on the Finish button. Just like the \nDesigner, the Operator has an Enterprise Manager view which will allow the user to open a run time \nversion of the graphic forms created in the Designer. \n \n9.1. \nRunning the Operator \nOpen the graphic form Overview in the Operator. \n1. Run the SmartUI operator by double clicking on the Icon on the desktop. \n2. Login using the same user’s credentials as used with the designer. \n3. In the enterprise manager double click on the Overview graphic form in the Plant A project. \n4. Click on the Button Analog Faceplate. \n \n \nFigure 53 - MAPS Operator\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 44 \n10. Configuring an end-to-end MAPS Life Cycle \nProject \nPlanning is the key to creating a successful automation project. Using MAPS forces the engineer to think \nthrough and plan the following, before creating a project. \n10.1. Pre-configuration Requirements \nWhen using MAPS to engineer a project, the following will need to be defined. \n• \nCreate a list of all electrical and instrumentation equipment required in the plant and match them to \nthe available template library. Appendix B has a complete list of all templates. \n• \nUse the extended physical model of the S88/S95 hierarchical structure to organize this list of \nequipment. \nDefine a Hierarchical structure \nFor the demo MAPS project, this list of equipment is organized using the following MAPS-specific S88 \nhierarchy: \nS88 Structure Name \nMAPS Description \nName \nEnterprise \nConfiguration \nACME \nSite \nProject Name \nABC_Foods \nPlant Area \nPlant Area Name \nManufacturing \nProcess Cell \nPLC Name \nPLC_Q \nUnit \nProcess Unit \nBatching \nFilling \nPackaging \nEquipment Model \nEquipment \nDOL_A_v1_0 x 4 \nVALVE_S_A_v1_0 x 1 \nAI_A_v2_0 x 2 \nGS_A_v1_0\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 45 \n10.2. Configuring the MAPS Project \nA new configuration is required, which will allow the servers to start a new blank project. \nCreating a new MAPS Configuration \n• \nOpen the MAPS Config Editor. Select the Configuration menu item. \n \nFigure 54 - MAPS Config Editor Configuration \n• \nSelect the Add new configuration button. \n \n• \nGive the new configuration a name ACME (S88 Configuration). Then click the Ok button. \n \nFigure 55 - MAPS Config Editor New Configuration ACME \n• \nThe device PLC_Q, created in the previous section Creating a Device, will be used in the new \nconfiguration. \n• \nClick the Finish button to save and close the MAPS Config editor. \n• \nStart the MAPS server, once the servers are started start and login to the MAPS designer.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 46 \n10.3. MAPS life cycle project. \nThe user/engineer will now work with a new View called the Context view in the designer to create a MAPS \nlife cycle project. \n \nFigure 56 - MAPS Context view \nThe user can find the MAPS Context on the right side of the Designer below the Enterprise Manager. The \nContext view contains two default sections, Static Graphics which contains a library of static vector objects \nand the Templates library which contains the Electrical and Instrumentation templates as documented in \nappendix B. Any MAPS life cycle project that is created will also appear here.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 47 \nCreating a MAPS Life cycle project. \n• \nIn the Context view, right click on the MAPS icon then select Add Project. Give the project a name \nABC_Foods as defined in the pre-configuration, and a description, ABC_Foods Manufacturing and \ndistribution. \nNotes: Project Path – this is the projects path where files for GX Works2 will be placed together with other project related files. \n \nFigure 57 - Project Configuration, project name. \n• \nClick the next Button. \n• \nAdd the following Plant Area Data (S88 Plant Area). \na. Name: \nManufacturing \nb. Description: \nManufacturing process \nc. MAPS Server: Default \nd. Plant Area Code: \nA01 \nNotes: Plant Area Code is a unique alphanumeric code (typically 3 characters) that are prefixed to tag names to ensure unique and identifiable \ntag names in the project.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 48 \n \nFigure 58 - Project Configuration, Plant Area \n• \nClick the next button. \n• \nAdd the following PLC Data (S88 Process Cell). \na. Name: \n \nPLC_Q \nb. description: \n \nManufacturing PLC \nc. Plant Area Name: \nManufacturing \nd. MAPS Device Name: PLC_Q \n• \nOnce the PLC_Q entry has been accepted the PLC’s address range can be set. Make sure the required \nPLC is selected. Set the range for the digital inputs. \na. Start: X0000 \nb. Finish: Y003F \n• \nSet the Digital Outputs \na. Start: Y0040 \nb. Finish: Y007F\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 49 \n \nFigure 59 -Project Configuration, PLC Data \n• \nClick the next button. \n• \nAdd the following Unit Data (S88 Process Unit). \na. Name: \nBatching \nb. Description: \nBatching Process \nc. PLC Name: \nPLC_Q \n• \nAdd another Unit with the following details. \na. Name: \nFilling \nb. Description: \nFilling Process \nc. PLC Name: \nPLC_Q \n• \nAdd another Unit with the following details. \na. Name: \nPackaging \nb. Description: \nPackaging Process \nc. PLC Name: \nPLC_Q\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 50 \n \nFigure 60 - Project Configuration, Unit Data \n• \nClick the next Button. \n• \nThe Electrical Equipment (S88 Device) dialogue is the area were the number and type of electrical \ntemplates can be defined (from a pre-defined list of equipment templates). Set the following. \na. Template Name: \nDOL_A_v1_0 \nb. Quantity: \n \n4 \n• \nAdd another line and set the following: \na. Template Name: \nVALVE_S_A_v1_0 \nb. Quantity: \n \n1 \n \nFigure 61 - Project Configuration, Electrical Equipment \n• \nClick the next button.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 51 \n• \nEdit the Electrical Equipment Detail (S88 Device), each item of equipment is now displayed, edit the \ndetails for each item as follows. \na. DOL_A_v1_0 \ni. Unit Name: \nBatching \nii. Name: \nA01_AGI_001 \niii. Description: \nAgitator \niv. Graphic: \n_MOTOR_Vertical \nb. DOL_A_v1_0 \ni. Unit Name: \nBatching \nii. Name: \nA01_PMP_001 \niii. Description: \nWater Pump \niv. Graphic: \n_PUMP_LEFT \nc. DOL_A_v1_0 \ni. Unit Name: \nBatching \nii. Name: \nA01_PMP_002 \niii. Description: \nIngredient A Pump \niv. Graphic: \n_PUMP_RIGHT \nd. DOL_A_v1_0 \ni. Unit Name: \nBatching \nii. Name: \nA01_PMP_003 \niii. Description: \nIngredient B Pump \niv. Graphic: \n_PUMP_LEFT \ne. VALVE_S_A_v1_0 \ni. Unit Name: \nBatching \nii. Name: \nA01_VAL_001 \niii. Description: \nDrain Valve \niv. Graphic: \n_VALVE_RIGHT\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 52 \n \nFigure 62 - Project Configuration, Electrical Equipment Details. \n• \nLeave the Create Tags checkbox unchecked. Click the next Button. \n• \nThe Instrumentation Equipment (S88 Device) dialogue is the area were the number and type of \nInstrumentation templates can be defined (from a pre-defined list of Instrumentation templates). Set \nthe following: \na. Template Name: \nAI_A_v2_0 \nb. Quantity: \n \n2 \n• \nAdd another line and set the following: \na. Template Name: \nGS_A_v1_0 \nb. Quantity: \n \n1 \n \nFigure 63 - Project Configuration, Instrumentation Equipment\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 53 \n• \nClick the next button. \n• \nEdit the Instrumentation Equipment Detail (S88 Device), each item of equipment is now displayed, \nedit the details for each item as follows. \na. AI_A_v2_0 \ni. Unit Name: \nBatching \nii. Name: \nA01_MAS_001 \niii. Description: \nTank Weight \niv. Graphic: \n_AI \nb. AI_A_v2_0 \nv. Unit Name: \nBatching \nvi. Name: \nA01_TEM_001 \nvii. Description: \nTank Temperature \nviii. Graphic: \n_AI \nc. GS_A_v2_0 \nix. Unit Name: \nBatching \nx. Name: \nA01_STT_001 \nxi. Description: \nProcess Start \nxii. Graphic: \n_GS \n \nFigure 64 -Project Configuration, Instrumentation Equipment Details \n• \nLeave the Create Tags checkbox unchecked. Click the Finish Button to automatically build the project \nand the SCADA screens.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 54 \n \nFigure 65 - MAPS Context view with project \nNote: The Context view might need to be refreshed to view any newly created projects. \n10.3.1. \nBulking Configuration \nMAPS also supports bulking configuration through an Excel export and import mechanism. To export a \nProject need to exist with a completed ISA 88 Project structure with at least one template. To Export to \nExcel \nExporting and Importing a Project to excel \nNote: Excel must be installed to export or import the MAPS life cycle project. \n• \nRight click on the project and select Export to Excel.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 55 \n \nFigure 66 - Context View Export to Excel \n• \nSave and Open the Excel Spreadsheet. Edit the spreadsheet as required then close and save the \nspreadsheet. \n• \nRight click on the MAPS Icon in the Context view then select Import from Excel. \n \nFigure 67 - Context View Import to Excel \n10.3.2. \nGenerating the Project Files \nOnce the MAPS Life cycle Project has been created the project files need to be generated.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 56 \nGenerating the PLC Program \nNote: MAPS will be unable to generate a PLC project if GX Works2 is not installed. \n• \nIn the MAPS context view right click on the PLC Name PLC_Q (Process Cell) icon\n. Select the Build \nPLC Project. \n \nFigure 68 - Context View Build PLC Project \n• \nMAPS will generate a PLC project and open the project in GX Works2. \n• \nSetup the PLC communication in the projects Connection Destination. \n• \nEdit the PLC Project as required and download to the PLC.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 57 \nGenerating the MAPS SCADA agents \nNote: MAPS Agent Server must be running to generate the required agents. \n• \nIn the MAPS context view right click on the Plant Area Name Manufacturing (Plant Area) icon\n. \nSelect the Syn Tags. \n \nFigure 69 - Context View Sync Tags \n• \nEnable the Sync process to run in silent mode by clicking the yes button in the Sync dialogue. This \nprocess will take a few minutes so please be patient. \n \nFigure 70 - SYNC in Silent Mode \n• \nOnce the agents have been created, Save the MAPS Agent Server. \n• \nIn the MAPS context view right click on the PLC Name PLC_Q (Process Cell) icon\n. Select the Device \nStart/Stop.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 58 \n \nFigure 71 - Context View Device Start/Stop \n• \nMAPS will then prompt the user to start the PLC_Q device. Click on the Yes button to start \ncommunication to the device. \n \nFigure 72 - Start communication to the PLC\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 59 \n• \nOpen the MAPS Config Editor and check the Agent Server Configuration\\Driver Configuration. The \nPLC_Q device should display a green icon to indicate healthy communication between the MAPS \nAgent Server and the PLC. \n \nFigure 73 - MAPS Config Editor displaying healthy communication \n• \nIf the Icon displays is red then communication is unhealthy and the communication settings in the \nPLC and the PLC_Q device need to be checked. \nNote: The MAPS Agent Server time license might have expired so a restart of the MAPS Server might be required.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 60 \nGenerating the MAPS Graphic Forms and the navigation. \n• \nIn the MAPS context view right click on the Project Name ABC_FOODS (Site) icon\n. Select the \nRebuild all Graphics. Click the Yes button to acknowledge the Overwrite All Graphics warning. \n \nFigure 74 - Context View Rebuild All Graphics \n• \nRight click on the Process Unit Batching icon\n. \n• \nSelect the Open Unit Graphic Form. \n \nFigure 75 - Context View Open Unit Graphic Form \n• \nOnce the Batching Unit’s Graphic Form is open select the FlowLayoutPanel, click on the Task menu \nIcon and select the Move Controls.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 61 \n \nFigure 76 - FlowLayoutPanel Task Move Controls \n• \nThe “Shapes Wizards and Examples.Static \nGraphics.MAPS_Demo_Static.MAPS_Batching_Plant_Statics” Graphic Form can be added to the \nBATCHING_GF by dragging the MAPS_Batching_Plant_Statics GF from the enterprise manager and \ndropping on to and the BATCHING_GF (Select Paste Graphic Form Contents in the context menu). \nTemplates can be dragged to the corresponding positions. \n \nFigure 77 - Completed Batching Graphic Form \n• \nClose and Save the BATCHING_GF. \nGenerating the MAPS Navigation. \n• \nIn the MAPS context view right click on the Project Name ABC_FOODS (Site) icon\n. Select the Build \nOperator View. This action will generate the navigation for the Operator.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 62 \n \nFigure 78 - Context View Build Operator View \n• \nLaunch the MAPS Operator and log on to the MAPS Server. In the MAPS Operator’s Enterprise \nmanager view open the Graphic Form “ABC_FOODS.ABC_FOODS_OperatorView”. Use the navigation \nbuttons to open the Batching Graphic Form. \n \nFigure 79 - MAPS Operator with MAPS Life Cycle Project \nAdditional resources and online help can be found on the Adroit website.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 63 \n11. Appendix A – Configure the PLC \nThe GX Works2 software package will be used to configure the Mitsubishi PLC Q03UDE CPU. \n• \nStart GX Works2 and create a new project. Select the QCPU series and the PLC type Q03UDE. Click \nthe Ok button. \n \nFigure 80 - GX Works2 New Project \n• \nDouble click on the PLC parameters in the project navigation view. \n \nFigure 81 - Project navigation view. \n• \nSelect the Built-in Ethernet Port Settings tab in the Parameter Setting. Enter the Required IP address. \nMake sure that the Communication data code is set to binary and the Enable online change is \nchecked.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 64 \n \nFigure 82 - Q Parameter Setting \n• \nClick on the Open setting button to open the Built-In Ethernet Open Settings, to set up the ports on \nthe network interface card. At entry 16 set the Protocol to TCP; Open System to MC Protocol, and set \nthe Host Station to 1280. Click on the end button to accept the changes.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 65 \n \nFigure 83 - Built-In Ethernet Open Settings \n• \nClick the End button to close and accept the new Q Parameter Setting. Save the new PLC project and \nCompile the project by clicking on the Compile\\Build menu. \n• \nOpen the Connection Destination in the navigation view. \n \nFigure 84 - Connection Destination view \n• \nDouble click on the Connection1, to configure the connection to the Q PLC. \n• \nMake sure that the USB cable is connected from the Q PLC to the computer. In the Transfer Setup \nConnection1 dialogue, check on Serial USB on the PC and check on the PLC module on the PLC side.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 66 \nOther Station Settings must be set to No Specification. Click on the Connection Test to check the \ncommunication settings. \n \nFigure 85 - Transfer Setup Connection1 \n• \nClick the download button from the menu bar to start the program transfer to the PLC. \n \n• \nClick on the Select All button in the Online Data Operation, then click on the Execute button to start \nthe transfer.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 67 \n \nFigure 86 - Online Data Operation\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 68 \n12. Appendix B – MAPS Supported Equipment \nand Instrumentation template library \nMAPS has an extensive template library; the library is made up of two parts. \n12.1.1. \nInstrumentation equipment templates \nTemplate \nName \nType \nDescription \nAnalog Input \nAI_A_v1_0 \nAdvanced \nThe Analog Input MAPS template is designed to control \nan analog that is connected to an analog control unit. \nAI_S_v1_0 \nStandard \nAI_B_v1_0 \nBasic \nAI_A_v2_0 \nAdvanced \n \nAI_S_v2_0 \nStandard \n \nAI_B_v2_0 \nBasic \n \nAnalog Output \nAO_A_v1_0 \nAdvanced \nThe Analog Output MAPS template is designed to \ncontrol an analog that is connected to an analog control \nunit. \nAO_S_v1_0 \nStandard \nAO_B_v1_0 \nBasic \nAO_A_v2_0 \nAdvanced \n \nAO_S_v2_0 \nStandard \n \nAO_B_v2_0 \nBasic \n \nDigital Input \nDI_A_v1_0 \nAdvanced \nThe Digital Input MAPS template is designed to control \na digital input. \nDI_S_v1_0 \nStandard \nDI_B_v1_0 \nBasic \nDigital Output \nDO_A_v1_0 \nAdvanced \nThe Digital Output MAPS template is designed to control \na digital output. \nDO_S_v1_0 \nStandard \nDO_B_v1_0 \nBasic \nFlow Meter \nFM_A_v1_0 \nAdvanced \nThe Flow Meter MAPS template is designed to capture \nthe data from a Flow meter and calculate the different \nflow rates. \n \nFM_B_v1_0 \nBasic \nGroup Start \nGS_A_v1_0 \nAdvanced \nThe Group Start MAPS template is designed to control \na process. \n \nGS_S_v1_0 \nBasic \nJanitza Power Meter \nJPM_B_v1_0 \nBasic \nThe Janitza Power Meter MAPS template is designed to \ncapture the data from a Janitza Power Meter and \ndisplay the different values. \nPID Control \nPID_A_v1_0 \nAdvanced \nThe PID MAPS template is designed to control a device \nthat is connected to an analog output. \nPID_S_v1_0 \nStandard \nPID_A_v2_0 \nAdvanced \nTotalizer \nTOTALIZER_A_v1_0 Advanced \nThe Totalizer MAPS template is designed to control a \ntotalizer that is connected with digital inputs that \nincrements and decrements the totalizer accumulated \nvalue. \nVessel \nVESSEL_A_v1_0 \nAdvanced \nThe Vessel MAPS template is designed to control a \nvessel that is connected to digital and/or analog level \ncontrol units. \nVESSEL_S_v1_0 \nStandard \nVESSEL_B_v1_0 \nBasic \nVESSEL_A_v2_0 \nAdvanced \nVESSEL_S_v2_0 \nStandard\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 69 \n12.1.2. \nElectrical equipment templates \nMotor Templates \nName \nType \nDescription \nDirect On Line Starter \nDOL_A_v1_0 \nAdvanced \nThe Direct On Line (DOL) Motor MAPS template is \ndesigned to control a motor that is connected as a \nDOL. \nDOL_S_v1_0 \nStandard \nDOL_B_v1_0 \nBasic \nDOL_VB_v1_0 \nVery Basic \n2 Speed Direct On Line \nStarter \nDOL_2S_A_v1_0 \nAdvanced \nThe Direct On Line 2 Speed Motor MAPS template is \ndesigned to control a motor that is connected as a \nDOL, which is controlled by two outputs: one for slow \nspeed and another for high speed. \nForward Reverse \nDirect On Line Starter \nDOL_FR_A_v1_0 \nAdvanced \nThe Direct On Line Forward - Reverse Motor MAPS \ntemplate is designed to control a motor that is \nconnected as a DOL, which is controlled by two \noutputs: one for forward direction and another for the \nreverse direction. \nDOL_FR_VB_v1_0 \nVery Basic \nModbus Variable \nSpeed Drive \nVSD_Modbus_B_v1_0 Basic \nThe Modbus Variable Speed Drive [VSD] MAPS \ntemplate is designed to control a motor that is \nconnected to a Mitsubishi VSD on Modbus. \nProfibus Variable \nSpeed Drive \nPBVSD_A_v1_0 \nAdvanced \nThe Profibus Variable Speed Drive (VSD) Motor \nMAPS template is designed to control a VSD motor \nthat is connected via a Profibus network. \nPBVSD_S_v1_0 \nStandard \nPBVSD_B_v1_0 \nBasic \nVariable Speed Drive \nVSD_A_v1_0 \nAdvanced \nThe Variable Speed Drive (VSD) Motor MAPS template \nis designed to control a VSD motor that is connected \nby five outputs one for forward direction and one for \nreverse direction and three for the speed selection. \nCC-Link Variable \nSpeed Drive \nCCVSD_A_v1_0 \nAdvanced \nCC-Link Variable Speed Drive (VSD) Motor MAPS \ntemplate is designed to control a VSD motor that is \nconnected via a CC-Link network. \n \nCCVSD_S_v1_0 \nStandard \n \nCCVSD_B_v1_0 \nBasic \nAnalog Variable Speed \nDrive \nVSD_A_B_v1_0 \nBasic \nThe Analogue Variable Speed Drive (VSD) Motor MAPS \ntemplate is designed to control a motor that is \nconnected to a VSD with Analogue Set point and \nfeedback. \n \nValve Templates \nName \nType \nDescription \nControl Valve \nVALVE_C_A_v1_0 \nAdvanced \nThe Control Valve MAPS template is designed to control a \nvalve that has an analog output with an analog feedback \nand two end limit switches. \nDouble Actuating Valve \nVALVE_D_A_v1_0 \nAdvanced \nThe Double Actuating Valve MAPS template is \ndesigned to control a valve that has two \nsolenoids and two limit switches \nVALVE_D_S_v1_0 \nStandard \nVALVE_D_B_v1_0 \nBasic \nS
