const ITEMS = [{"title": "Adroit 10 Quick Start Guide", "href": "manual_chapters/Adroit_10_Quick_Start_Guide/index.html", "category": "Product Manuals", "rel": "manual_chapters/Adroit_10_Quick_Start_Guide/index.html", "kind": "Manual", "text": "____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 1 \nCOPYRIGHT \n \nCopyright © 2020 Advanced Worx 112 (Pty) Ltd. All rights reserved. \nInformation in this document is subject to change without notice. The software described in this document is furnished under \na license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of \nthose agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or \nany means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal \nuse without the written permission of Advanced Worx 112 (Pty) Ltd. \nAdvanced Worx 112 (Pty) Ltd \n20 Waterford Office Park \n189 Witkoppen Road (c/o Waterford Drive) \nFourways \nSouth Africa \n \nwww.adroittech.co.za \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nVersion \nDate \nAuthor \nComment \nApproval \n1.0 \n24.02.2020 \nUnknown \nOriginal \n \n2.0 \n29.06.2020 \nJ. Duncan \nUpdate Content and Flow; new Cover \n \n3.0 \n15.08.2020 \nJ. Duncan \nReformat \n \n4.0 \n27.08.2020 \nJ. Duncan \nFinalise\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 2 \nContents \n1. \nIntroduction .................................................................................................................................... 3 \n1.1. \nGeneral Overview ..................................................................................................................... 3 \n2. \nInitial Setup of Adroit ...................................................................................................................... 5 \n2.1. \nHardware & Software Requirements ............................................................................................ 5 \n2.1.1. \nRecommended Hardware & Software ........................................................................................................5 \n2.1.2. \nAdditional Software.................................................................................................................................5 \n2.2. \nLicensing................................................................................................................................. 5 \n2.2.1. \nLicensing definitions................................................................................................................................5 \n2.3. \nPrerequisites for installing Adroit software .................................................................................... 5 \n2.4. \nInstallation .............................................................................................................................. 6 \n3. \nConfiguring Adroit ........................................................................................................................... 9 \n3.1. \nNew Configuration .................................................................................................................... 9 \n3.2. \nCreating a Device ................................................................................................................... 10 \n4. \nRunning Adroit ...............................................................................................................................12 \n5. \nConfiguring a Project ......................................................................................................................14 \n5.1. \nAdroit SmartUI Designer .......................................................................................................... 14 \n5.1.1. \nEnterprise Manager .............................................................................................................................. 15 \n5.1.2. \nAdding a New Project and Graphic Form .................................................................................................. 16 \n5.1.3. \nProperties ........................................................................................................................................... 17 \n5.1.4. \nToolbox .............................................................................................................................................. 18 \n6. \nConfiguring the Agent Server .........................................................................................................20 \n6.1. \nAgents .................................................................................................................................. 20 \n6.1.1. \nAdding an Agent .................................................................................................................................. 21 \n6.1.2. \nSlots ................................................................................................................................................... 22 \n6.1.3. \nTag .................................................................................................................................................... 22 \n6.2. \nScanning ............................................................................................................................... 23 \n6.2.1. \nScanning a Tag .................................................................................................................................... 23 \n6.3. \nData logging .......................................................................................................................... 24 \n6.3.1. \nDatalog an Analog value ........................................................................................................................ 24 \n6.4. \nAlarming ............................................................................................................................... 26 \n6.4.1. \nAlarm Routing ...................................................................................................................................... 26 \n6.4.2. \nAlarm Types ........................................................................................................................................ 28 \n7. \nDisplaying Data ..............................................................................................................................29 \n7.1. \nBehaviours ............................................................................................................................ 29 \n7.1.1. \nDisplaying a value ................................................................................................................................ 29 \n7.1.2. \nChanging a value setpoint...................................................................................................................... 31 \n7.2. \nLine Charts ............................................................................................................................ 34 \n7.2.1. \nDisplay Historical Data .......................................................................................................................... 34 \n7.3. \nAlarm Viewer Control .............................................................................................................. 36 \n7.3.1. \nDisplaying an Alarm list ......................................................................................................................... 36 \n8. \nReusable Objects ............................................................................................................................38 \n8.1. \nWizards ................................................................................................................................ 38 \n8.1.1. \nAdding a Pre-defined Wizard .................................................................................................................. 38 \n8.2. \nTemplates ............................................................................................................................. 39 \n8.2.1. \nOpening a Template ............................................................................................................................. 39 \n9. \nSmartUI Operator ...........................................................................................................................42 \n9.1. \nRunning the Operator.............................................................................................................. 42 \n10. \nAdroit Product Suite Documentation...............................................................................................43\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 3 \n1. Introduction \nThe Adroit Quick Start Guide document is designed to help the new user install, configure and get an \nunderstand of the various Adroit sub-systems. In addition to assist a new user in understanding the Adroit \napproach to SCADA/HMI project development and concepts surrounding the Adroit product. \n \n1.1. \nGeneral Overview \nIn order to understand Adroit it is important to understand the basic architecture of the product. \nBelow is a diagram, which represents the basic standalone architecture. \n \n \nFigure 1: Basic Stand Alone Architecture \n• \nFront end device (FED): The front-end device is a general term used for a PLC; OPC server; \nRTU; a controller; or any software package that allows third party communication (i.e. OPC, \nSIMATIC NET). \n• \nProtocol driver: Adroit supports +- 100 different protocols. Once a new driver has been installed \nand configured to talk to a FED, it is called a Device. A single protocol can support multiple \nDevices. An example of this is the user can have multiple FEDs which use the same protocol \n(i.e. MODBUS Ethernet), each FED will have its own IP address/Address. A device will need to \nbe created for each FED. \n• \nAgent Server (AS): The Agent Server (I/O Server), is the real-time database, which handles the \nreal-time values and if configured, will handle all post-processing, logging and/or alarming the \ndata. \n• \nSmartUI Server (SUIS): The SUIS is a middleware server which exposes data from a number of \ndisparate sources, using the datasource, and also acts as a repository for the graphic forms or \nmimics. It also acts as the manager of access, and broker for the unified data model \nimplemented across all data types that may end up in the \n• \nDatasource: Each source of data (i.e. Adroit Agent Server) requires a datasource plugin before \nit can be associated with the SmartUI Server. This provides the ability to expose its data as \ndata elements. An example of a data element is Adroit.Analog.SAMPLEANALOGUE.value. The \nSmartUI Server connects to data using two different types of datasources: \n• \nThe SmartUI Server allows multiple sources of data to be available to the configuration of a \nsystem in a unifed manner. It basically coverts all datatypes into universally usable elements \n(dataelements).\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 4 \nDatasource \nPurpose \nAdroit \nExposes the configured agents and their slots, of the connected Adroit Agent Server. \nEvent Log \nExposes the events within the Windows event logs of the connected specific computer. \nOLE DB \nExposes the data within a specific OLE DB compliant database or data store. \nServer Scripts Stores scripts that can be run on the Server. \nSimulation \nExposes a wide variety of different types of generated data \nWebServices \nExposes a wide variety of data available in web services \nNote: For further information on the available datasource see the Adroit help. \n• \nClients: The Adroit SUI comes with a number of types of clients which can securely connect to \nthe SmartUI Server: \na. Designer: The SmartUI Designer allows the user to configure datasources as well as create \nand design graphic forms. \nb. Operator (View Clients)allows the user to operate graphic forms \nc. Performance Anywhere: An HTML5 web reporting client for building dashboards \nd. Adroit Air: Mobile App for push notifications such as operator messages, alarms and process \ndata (runs on Android and IoS) \nWhen connecting to the SUIS the user will be prompted for login credentials. The default credentials \nare the same as the Windows credentials that the user installed Adroit SUI under.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 5 \n2. Initial Setup of Adroit \n2.1. \nHardware & Software Requirements \n2.1.1. Recommended Hardware & Software \nPlease refer to the Hardware & Software Specification document available from our website. \nhttps://adroittech.co.za/downloads-tree-view/ \n2.1.2. Additional Software \nAdditional software that will expand the functionality of Adroit: \n• \nInternet information services (IIS): Required for web service and distribution service \n• \nSQL with advanced reporting services: used for historical data logging and reporting. Adroit \nships with the free SQL Express that can be used for these purposes. \n2.2. \nLicensing \nTypically, the Agent Server is licensed via a HASP software protection hardware key, which is inserted into \nthe USB port of the computer on which the Agent Server is running. This HASP is then programmed in \naccordance with your specific license agreement. \nIn situations where it is not possible to use a physical HASP, it is also possible to license Adroit via a \nsoftware license, which is only available on request. For further details, contact your Adroit representative \nfor details. \n2.2.1. Licensing definitions \n• \nScan points: When a memory address is scanned/attached in the PLC and for every DBAccess \nAgent; Script Agent; and SNMP Agent a Scan Point is consumed. \n• \nVersion: HASPs are licensed against versions of Adroit. \nIMPORTANT: The former Remote Nodes licenses that applied to all types of clients have been DISCONTINUED. These \nhave now been replaced by the following client specific node licenses, each of which have different costs: \no Clients: typically Operators and/or Designers and \no Mobile/Web Clients: typically Performance Anywhere or Adroit Air clients. \n• \nOEM: Additional components that are separately licensed are specified as separate textual \nentries in the product license e.g. Adroit Alarm Management enablement, Adroit Historian \nenablement; Max Demand Agent, OEE Agent; Siemens Ethernet driver; DNP 3.0 driver. \nA time limit is set on development HASPs. Production HASPs have no time limit. \n2.3. \nPrerequisites for installing Adroit software \n1. Ensure that the Windows operating system on which you intend to install Adroit has been \nand remains legally licensed and ACTIVATED, since Adroit is not supported when it is run on \nan unlicensed Windows operating system. \n2. Ensure that you are not using the built-in Administrator account to run Adroit, since UAC is \nautomatically disabled whenever this built-in Administrator account is used. \n3. When installing and running Adroit on an operating system that provides User Account \nControl (UAC), such as Windows 7 or Windows Server 2008, please ensure that UAC is always \nENABLED, since Adroit is not supported when it is run with UAC disabled. \n4. Adroit 10 requires the Microsoft .NET Framework 4.6.2 \n5. The Web Service component can ONLY be installed on a computer that has IIS (Internet \nInformation Services) installed.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 6 \n2.4. \nInstallation \n1. Install the Adroit software from either the download or media supplied. \n2. Click on the Adroit installation executable option. \n \nFigure 2 - License Agreement \n3. Select the “I accept the agreement” to accept the EULA, then click the next button \n \nFigure 3 – Release Notes \nNOTE: The release notes contain all the information regarding the new version of Adroit. It is \nrecommended that the user familiarise themselves with this document, then click the Next button.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 7 \n \nFigure 4 - Select Installation Type \n4. The user will now be prompted to select which type of installation they require. The Typical \ninstallation will install a stand-alone Adroit. Click the Next button. \n \nFigure 5 - Ready to Install \nThe Ready to Install screen give the user a summary of what will be installed. \n5. Click on the Install button. \n \nFigure 6 - Component Configuration Settings\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 8 \n6. The component configuration screen will give the user the option to setup the agent server \nand SmartUI server services. \n7. Make sure that the Configure services is checked. \n8. Set the Username to the current logged on user, supply the password in the corresponding \ntext boxes. \nNOTE: If the user requires the agent server and SmartUI server to start automatically then check the “Start the Agent Server \nservice automatically”. \n \n \nFigure 7 - SmartUI Theme \n9. Select the preferred Theme, then click Next button. \nThe installation will begin. \n10. Once the installation is complete restart the PC/server.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 9 \n3. Configuring Adroit \n3.1. \nNew Configuration \n \nFigure 8 - Adroit Config Editor \nThe Adroit Config Editor application is used to customize the installed applications and/or services by \nmodifying their default settings. First create a new configuration by following these steps: \n1. Select the Configuration menu item on the top left and check on “Allow Multiple \nConfigurations” option. \n \nFigure 9 - Allow Multiple Configurations\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 10 \n2. Select the Add new configuration button. \n \n3. Give the new configuration a name. Then click the Ok button. \n \nFigure 10 - Create a new configuration \n4. Once the configuration has been created click the Ok button. \n3.2. \nCreating a Device \nSetup the OPC Client to the Adroit BatchOPC Server demo application. This application is part of the Adroit \ninstall. \n1. Open the Driver configuration in the Adroit Config Editor, under the Agent Server \nConfiguration. \n \nFigure 11 - Driver Configuration\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 11 \n2. Select the OPC Client Protocol driver, then click on the Add button. \n3. Enter the device name BAT_01 \n \nFigure 12 - Device Name \n4. In the OPC client driver configuration select the Adroit Batch OPC Server in the OPC server \ndrop down box. \n5. Click Ok. \n6. Click Ok on the performance counter installation. \n \nFigure 13 - OPC client configuration\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 12 \n4. Running Adroit \nAdroit is a client/server application and as such in a distributed architecture, particularly in large systems \nthe Agent Server and SmartUI Server would typically reside on a separate machine and all the Operators \non separate PC’s. In smaller stand-alone applications the Agent Server, SmartUI Server, Designer and \nOperator would reside on a single PC. For this reason you need to start The Agent Server and the Client \nApplications (Designer/Operator) separately. The SmartUI Server will start automatically when you start \nthe Agent Server application. \n1. On the desktop start the Adroit Agent Server. \n \n2. If the PC does not have adroit Licensing, then the server will start with a timed limited demo \nlicense. Click OK on the agreement. \n \nFigure 14 - Time Limited License Agreement \n3. The Adroit Agent Server (AS) will load. Check that the server loads without any errors and \nthat the AS displays a LOAD complete. \n \nFigure 15 - Adroit Agent Server\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 13 \n4. Once the AS has finished loading the AS will start the SmartUI Server. Check to make sure \nthat the SmartUI Server shows it is Running. This can be done by launching the SmartUI \nServer application window from its icon on the desktop. In normal conditions you don’t need \nto do this but for starters it’s worthwhile understanding each component within the system. \n \nFigure 16 - Adroit SmartUI Server\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 14 \n5. Configuring a Project \n5.1. \nAdroit SmartUI Designer \n1. To begin creating a project the user will need to run the Adroit SmartUI Designer by clicking \non the Icon on the desktop. \n \n2. The user will then be prompted to login to the local SmartUI server. The user login is the \nsame as the user’s Windows OS credentials. \n3. Enter the Login Name and Password, typically your Windows configured credentials. \n4. Click on the Finish button. \n \nFigure 17 - SmartUI Designer User Login \nNote: by checking the “Automatically Login” check box the designer will auto login in future launches. \n \nThe Designer environment is where the user will spend most of their time. It is a single engineering \nwindow to your entire project. The user will manage connections to datasources, access the Agent Server \nfor Agent/Tag configuration, manage and apply security and build the graphical forms for the project. \n \nFigure 18 - SmartUI Designer\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 15 \nThe Designer has views that are docked around the centre design area. The most important of these is \nthe Enterprise Manager. \nTo reset the Designer layout, open the View ribbon and click on the “Reset to Default Layout” button. \n \n \n5.1.1. Enterprise Manager \nThe Enterprise Manager view is where the user configures the Adroit Project. \n \n \nFigure 19 - Enterprise manager \nThe Enterprise Manager has three areas, they are: \n \nDatasources \nThis area is where the user can create and manage the datasources. There are 3 default datasources \nwhich are created automatically, these are: \n• \nAdroit – This datasource connects to the local Agent Server. \n• \nEventlog – This datasource connects to the local Windows event log. \n• \nObjectModel - The object model datasource enables you to enhance your existing wizards, by adding \nSCADA configuration to them. Its main function is to save you engineering time when bulk creating \nobjects, such as items of equipment, which require similar HMI/SCADA configuration. \nManagement \nManagement consists of 3 sub-settings: \na. Profile – a default profile is created at installation which is used to manage user-specific \nconfiguration of the SmartUI Designer and SmartUI Operator. The profile manages all user-\nspecific settings like language, scripting, colour settings, menu settings and SmartUI Operator \nsettings to the graphic form.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 16 \nb. Security – Security in SmartUI is user-centric and operates on top of the traditional Windows \noperating system security, using a configurable sub-set of the existing users and groups on \neach Server computer, known as the “allowed” users and groups. For instance, when a Client \n(Designer or Operator) is launched, it is necessary to login to a Server and only a user that is \neither an allowed or a member of an allowed group on this Server is able to log into it. In \naddition to controlling the access of these “allowed” users and groups to the Server, its \nconfigured datasources and their data, it is possible to control or limit the access that these \nusers have within each Client (Designer or Operator). \nc. System – is mainly only for system monitoring reasons. This allows you to display which \nclients are connected, subscription pool, message queues, etc. \nProjects \nThe Projects area is where you create, build and store your own Graphic Forms. The Projects \ndirectory by default will have Shapes Wizards and Examples and System Information graphic forms \nuseful for incorporating for technicians to manage the HMI/SCADA project at runtime. (all the sample \nproject layouts incorporate these system management elements) \nNote: Projects can have sub-folders containing your graphic forms and it is important to give this structure some thought. We advise \nthe use of the ISA95 as a guideline which defines the physical structure of your plant, including enterprise, plant area, site, etc. \n5.1.2. Adding a New Project and Graphic Form \nTo create a new project: \n1. Select the Projects folder in the Enterprise Manager. \n \n2. On the Home ribbon click on the New Project icon. \n3. Give the new project a name, Plant A. \na. Please note, although we are not using them in this Quick Start Guide we recommend \nchoosing a template o which to base your project by checking “Show Project \nNavigation and Style Configuration and selecting a project layout that suits the \napplication you are building. This will give you a very good navigation and folder \nstructure as a basis for an actual project implementation. We have set these up with \ncorrect Properties in order to deal with most scenarios where for example you are \nusing different resolution screens for Operators and scaling is important (a whole \ncomplex subject by itself). \n4. Click the Finish button. \n \nFigure 20 - Add a new project \nNote: if the project does not appear straight away click on the Refresh icon on the Home ribbon.\n \n• \nSelect the new project Plant A. On the Home ribbon select the New Graphic Form Icon\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 17 \n \n \n• \nName the graphic form “Overview”. The new graphic form is now open in the design area. \nNote: It is possible to rename by right clicking on the GF and selecting Rename in the menu. \n \nFigure 21 - Enterprise Manager with new project \n5.1.3. Properties \nThe Properties view contains all properties of the selected object that is placed on the GF. The GF \nproperties are displayed by default.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 18 \n \nFigure 22 - Properties View \n5.1.4. Toolbox \nThe Toolbox view contains all the base objects that the user will add to the graphic form. The \nToolbox view can be found below the Enterprise Manager view. \n \nFigure 23 - Toolbox View \nNote: Objects are grouped by their function and class. \n \nAdd an Object to the Graphic Form (GF)\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 19 \nTo place a new Object on the GF “Overview”: \n1. Make sure that the GF “Overview” is open. \n2. Under Windows Forms in the Toolbox select the control Label and click on the opened GF. \n3. Set the following properties of the label. \n• \n(Name):lblActTempValue \n• \nAutoSize:True \n• \nBackcolor:White \n• \nFont:Arial, 9pt, style=Bold \n• \nText:00.00 deg C \n4. Clicking on the Save icon \n on the top left of the design area. This will save the current \nselected GF. \n \nFigure 24 - Added New Object to GF\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 20 \n6. Configuring the Agent Server \nTo interact with the Agent Server (AS) the user will need to launch the Adroit Configurator by clicking on \nthe Open Configurator icon on the Home ribbon. \n \n \nFigure 25 - Agent Server Configurator \n6.1. \nAgents \nThe most fundamental building blocks of Adroit Agent Server are intelligent objects called Agents. In \naddition to being able to manipulate their own data, they can read and write from the FED and to other \nagents and so influence them. All Agents are grouped into three Agent groups, to allow easier access to \nAgents that are needed for a project, they are: \n \n• \nPrimitive Agent types \nBoolean, Frame, Integer, Real, Text \n \n• \nBasic Agent types \nAnalog, Counter, Date, Digital, Expression, Marshal, MultiState, String, StringList, Timer \n \n• \nAdvanced Agent types \nAgentGroup, Alarm, AlarmList, AlarmManagement, ARec, Command, DBAccess. DBLog, DBQuery, \nEventLog, EventOutput, MultiMedia, Notify, Recipe, Scheduler, Script, Shift, Shift_Adv, Statistical Agent \n \n• \nMIS/MES Agent types \nAccumulator, MaxDemand, OEE, OEE_Adv, PID \n \n• \nIT/IoT Agent types \nAudit, DumpConfig, ICMP, IoT, Perfmon, SNMPMgr \n \n• \nSystem Agent types\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 21 \nAlias, Beeper, DataLog, Device, Hasp, Proxy, Scan, SystemDataLog, SystemInformation \n6.1.1. Adding an Agent \nTo create a new Analog agent in the AS: \n1. Open the Configurator. \n2. Check Basic Agents and expand the selection of the Agent Types that belong to this group. \n3. In the Configurator change the selected agent Type to Analog \n4. Using a pre-defined Naming strategy give the new agent the name: \nBAT-01-MIX-01-TEM with a description: Batch Mixing Temperature. \n5. Click on the Add button to create the agent. \n6. Select File and Save, to save the agent server. \n \n \nFigure 26 - New Analog Agent \n7. Select the Agent BAT-01-MIX-01-TEM the click on the Edit.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 22 \n8. Change the Analog set points as follows: \na. Device Span \n• \nMinimum:0 \n• \nMaximum:4095 \nb. Engineering Span \n• \nMinimum:0 \n• \nMaximum:45 \nc. Alarms \n• \nHigh-high:35 \n• \nHigh:25 \n• \nLow:0 \n• \nLow-Low:0 \n \nFigure 27 - Edit Analog Agent \n6.1.2. Slots \nAgents are made up of Slots. Slots of an Agent are values (attributes) or fields within an Agent that can \nbe retrieved and/or set. The slots within an Agent can drive the logic/function of the Agent. \n6.1.3. Tag \nA fully qualified named value in Adroit made up of an agentName.slotName and in the Adroit world are \nthen known as Tags All tags within Adroit can be driven, changed internally or externally\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 23 \n6.2. \nScanning \nScanning values simply means communicating using a predefined protocol from a memory address of a \nFED to a TAG. \n6.2.1. Scanning a Tag \nTo scan the RawValue slot of the of BAT-01-MIX-01-TEM Analog Agent to the Adroit Batch OPC Server: \n1. Open the Adroit Configurator. \n2. Select the Analog Agent BAT-01-MIX-01-TEM. \n3. Click on the Scan button. \n4. In the scanning configuration, select the device BAT_01 in the Device dropdown box. \n5. The user will be prompted to create the device. \n6. Click the Yes button. The Adroit Batch OPC Server will automatically start. \n \nFigure 28 - Batch OPC Server \n7. Enter the OPC address ActualMixTemp into the address field and change the Scan rate to 0. \n8. Click on the Scan button to add the scan job to the device.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 24 \n9. Select the Started radial button to start communicating with the OPC server. \n10. Click OK on the scanning dialogue and save the Agent Server Configuration. \n \nFigure 29 - TAG Scanning Configuration \n6.3. \nData logging \nAdroit allows the value of a fully qualified named TAG value in Adroit AS (Agent.Slot) to be recorded or \nlogged to either proprietary log files or an OLE DB-compliant database. \n6.3.1. Datalog an Analog value \nTo datalog the value slot of the Analog agent BAT-01-MIX-01-TEM: \n \n1. Select the agent BAT-01-MIX-01-TEM, then click on the Log button. \n2. Set the datasource path by clicking on the browse button \n, then browse the path: \nC:\\ProgramData\\Adroit Technologies\\Adroit\\Configurations\\Quick Start Guide\\Datalogs \n3. Create the log file Temperature.LGD. Then click Open.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 25 \n \nFigure 30 - Select DataLog File \n4. Click on the length button and set the log length to 1 month. \n5. Under Deadbands click the Time button and set the period to 1 second. \n6. Click on the Start radial button to start the datalog. Then click on the OK button and save \nthe Agent Server. \n \n \nFigure 31 - Edit Datalog Agent\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 26 \n6.4. \nAlarming \nThe alarming capability of the Adroit SCADA is exceptionally powerful and needs careful attention. Alarming \ncan simply be explained by breaking the system down in to two parts. \n6.4.1. Alarm Routing \nAlarm routing, which is configured in the Alarm agent, is where the user will configure the outputs of an \nalarm. Adroit Alarming supports multiple routing outputs such as Alarm Lists; SMSs; Emails; Event logs; \nMultimedia notifications. \n \nSetting up an Alarm Agent Route \nConfiguring a route in the default alarm agent, which will send all configured alarms to an Alarm list: \n1. Open the Adroit Configurator. \n2. Select the agent type Alarm list. \n3. Create a new alarm list agent called BAT-01-MIX-01-ALM-LST. \n \nFigure 32 - Alarm List Agent\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 27 \n4. Select the Agent Type Alarm, edit the DEFAULTALARMAGENT. Make sure the selected route \nnumber is set to 2. \n5. In the Alarm List route definition click on the browse button\n. \n6. In the Agent browser select the Alarm list agent BAT-01-MIX-01-ALM-LST. \n7. Click Ok. \n8. Click on the defaultAlarmAgent agents’ Ok button and save the Agent Server configuration. \n \nFigure 33 - Default Alarm Agent\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 28 \n6.4.2. Alarm Types \nAlarm Agents can monitor other Agents with pre-set Alarm Types. An alarm type is simply the required \ncondition or state of an Agent’s header slots. A default Alarm Agent, created on start of a blank AS \ndatabase, contains a number of pre-defined alarm types. \n \nAlarming an Analog Agent \nTo alarm the high and High-high slots of the Analog Agent BAT-01-MIX-01-TEM, using the default alarm \nagent: \n1. Open the Adroit Configurator. \n2. Select the Analog Agent BAT-01-MIX-01-TEM. \n3. Click on the Alarm button. \n4. Move the Available Alarm type High from Available to Current by double clicking the alarm \ntype. Make sure that the Select route is set to 2. \n5. Repeat the process for the alarm type High-high. \n \nFigure 34 - Alarming an Analog Agent\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 29 \n7. Displaying Data \nOnce the Agent Server has been configured the user can now display and manipulating the data on a \ngraphic form using behaviours. Behaviours are used to create the dynamics pertaining to the Tag and how \nOperators interact with the graphical representation on any screen. \n \n7.1. \nBehaviours \nBehaviours are used to display and manipulate data elements. The Adroit SmartUI supports the following \nbehaviours: \n• \nBind Value - Drive a data element (value) to and/or from the value of a property of a control or \nvector. \n• \nColor - Assign colors to the two states of a digital (Boolean) value; to blink a specific Color \nproperty or the VISIBILITY property either continuously or triggered by a value. Also define \nstates of color based on specific value ranges to provide a visual indication of a value, as well \nas define states of color based on a bit mask - a specific sequence of bits that are set for up to \n32 bits to provide a visual indication of each bit mask. \n• \nDisplay Value - Display and if necessary, format a value. \n• \nExecute Command - Perform commands, such as launching an application or opening, closing \nor printing a graphic form or logging a user on or off and/or switching users. \n• \nFlip Bitmap - Create a defined sequence of images or a multi-image display, this behaviour can \nonly be added to a Picture vector object. \n• \nLocation - Dynamically move the object linearly in a defined X-Y direction by means of a \nmonitored value. \n• \nOperator Action - Typically provides methods that allow end users to change a value at \nruntime. \n• \nPercentage Fill - Dynamically fill an object by means of a monitored value. \n• \nRotation - Dynamically rotate the object by means of a monitored value. \n• \nSize - Dynamically resize the object linearly by means of a monitored value. \n• \nTooltip - Display additional information when the mouse cursor hovers over the object. \n• \nVisibility: Display or hide an object depending on a Boolean value. \n• \nDatabase: To execute a database query from a graphical form, without writing a script \nNote: The behaviour configuration dialogue provides an Advanced View button that displays more advanced configuration \noptions. \n7.1.1. Displaying a value \nDisplay the analog value of the Agent BAT-01-MIX-01-TEM using a display value behaviour. \n1. In the Designer open the graphic form Overview that you previously created. \n2. Select the label placed in the previous exercise. \n3. Select the Behaviours ribbon. \n4. Click on the Display Value button.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 30 \n5. In the Display Value dialog click on the Input Data Element browser button. Browse for the \ndata element Adroit.Analog.BAT-01-MIX-01-TEM.value. \n6. Click the Finish button. \n \nFigure 35 - Data Element Browser \n7. Change the String format to {0:F2} deg C. \n8. Click the Finish button. \n \nFigure 36 - Display Value Behaviour \n9. Save the graphic form and test by clicking on the Run button\n, in the design area \nmenu bar. The label should display the value 18.00 deg C. The user can run the batch plant \nsimulator by clicking on the Auto start label in the OPC simulator. \nNote if the value is not displaying correctly make sure that he time license on the agent server has not run. If so, restart the Agent Server.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 31 \n7.1.2. Changing a value setpoint \nChanging the Analog agents BAT-01-MIX-01-TEM alarm setpoints using the Operator Action \nbehaviour. \n• \nOpen the graphic form Overview, place two more labels on the graphic form with the following \nproperties: \no (Name):lblActTempHihi \n▪ AutoSize:True \n▪ Backcolor:White \n▪ Font:Arial, 8pt \n▪ Text:High high alarm SP: 00.00 deg C \no (Name):lblActTempHi \n▪ AutoSize:True \n▪ Backcolor:White \n▪ Font:Arial, 8pt \n▪ Text:High alarm SP: 00.00 deg C \n \nFigure 37 - Graphic Form Displaying Alarm Setpoints\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 32 \n• \nSelect the label lblActTempHihi. Add a new Display Value behaviour to the object. \no The Input Data Element is \n▪ Adroit.Analog.BAT-01-MIX-01-TEM.hiHi, \no And the String formatting is \n▪ High high alarm SP: {0:F2} deg C \n• \nSelect the label lblActTempHi. Add a new Add a new Display Value behaviour to the object. \no The Input Data Element is \n▪ Adroit.Analog.BAT-01-MIX-01-TEM.hi, \no And the String formatting is \n▪ High alarm SP: {0:F2} deg C \n• \nSelect the label lblActTempHihi. Add a new Operator action behaviour, set the inputs as follows: \no Data Element:Adroit.Analog.BAT-01-MIX-01-TEM.hiHi \no Minimum DE:Adroit.Analog.BAT-01-MIX-01-TEM.hi \no Maximum DE:Adroit.Analog.BAT-01-MIX-01-TEM.engMax \n• \nFor the Action Type Select Data Entry. Click the finish button. \n \nFigure 38 - Operator Action Behaviour for Alarm High-high Set Point \n• \nSelect the label lblActTemphi. Add a new Operator action behaviour, set the inputs as follows: \no Data Element:Adroit.Analog.BAT-01-MIX-01-TEM.hi \no Minimum DE:Adroit.Analog.BAT-01-MIX-01-TEM.lo \no Maximum DE:Adroit.Analog.BAT-01-MIX-01-TEM.hiHi \no For the Action Type Select Data Entry. Click the finish button.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 33 \n \nFigure 39 - Operator Action Behaviour For Alarm High SP \n• \nSave and run the graphic form. Adjust the High Alarm SP by clicking the appropriate label and \nentering a new setpoint. \n \nFigure 40 - Change Alarm High Setpoint\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 34 \n7.2. \nLine Charts \nThe line chart control is used to display live as well as logged data from the Adroit Agent Server. \n7.2.1. Display Historical Data \nUsing the Line Chart control to display the logged data of the Analog Agent BAT-01-MIX-01-TEM. \n1. Confirm that the graphic form Overview is open and not in run mode. \n2. From the toolbox view under Data select the LineChart control and place it on the graphic \nform. Once the control has been placed the LineChart configuration will open. \n3. Change the Title of the series from Line to Actual Mixing Temperature by double clicking on \nthe series name Line. \n \n \nFigure 41 - Configuration Line Chart Series Name \n4. Select the Values tab in the series setup. Then setup the values as follows. \n• \nValues:Adroit.Analog.BAT-01-MIX-01-TEM.value \n• \nMin:Adroit.Analog.BAT-01-MIX-01-TEM.engMin \n• \nMax:Adroit.Analog.BAT-01-MIX-01-TEM.engMax \n• \nUnits:Adroit.Analog.BAT-01-MIX-01-TEM.unit \n• \nDescription:Adroit.Analog.BAT-01-MIX-01-TEM.agentDescription\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 35 \n \nFigure 42 - Configuration Line Chart Series Values \n5. Click the finish button save the graphic form. \n6. Click on the Run button. \n7. Start the batching process to change the Mixing Temperatures Value. \n \nFigure 43 - Displaying Logged data\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 36 \n7.3. \nAlarm Viewer Control \nThe Alarm viewer control allows the user to connect to ether an Alarm Agent or an Alarm list agent in \nthe Adroit Datasource. The control, once connected to a valid alarm list, will display all routed alarms \nand allows the user to acknowledge and filter the displayed alarms. \n7.3.1. Displaying an Alarm list \nUsing the Alarm viewer control to display alarms routed to the alarm list agent BAT-01-MIX-01-ALM-LST. \n1. Confirm that the graphic form Overview is open and not in run mode. \n2. From the toolbox view under Adroit select the AlarmViewer control and place it on the graphic \nform. \n3. Select the task icon \n on the top right of the alarm control, this will open the task menu. \n \nFigure 44 - AdroitAlarmViewer Tasks menu \n4. Click on the General Configuration, which will open the Adroit alarm viewer Configuration. \n5. Change the Alarm type to AlarmListAgent. \n6. Set the Alarm List / Alarm Agent to Adroit.AlarmList.BAT-01-MIX-01-ALM-LST.alarmList.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 37 \n \nFigure 45 - Adroit Alarm Viewer Configuration \n7. Click the Finish button, save and run the graphic form. \n8. To test the Alarm view drop the High alarm set point below the value. \n \nFigure 46 - Displaying Alarm Incident\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 38 \n8. Reusable Objects \nAdroit has a two mechanism that allow for re-usable objects, Wizards and Templates. \n \n8.1. \nWizards \nAre user defined/created objects such as pumps; motors; analogue displays. The behaviours of a wizards \ncan contain substitution. Adroit contains a library of Shapes Wizards and Examples that contain a number \nof pre-defined wizards. \n8.1.1. Adding a Pre-defined Wizard \nAdding the wizard wzdAnalogueIndicator_Large_Horizontal_v01 from Situational awareness library to the \nOverview graphic form. \n1. Confirm that the graphic form Overview is open and not in run mode. \n2. Select the Shapes Wizards & Examples ribbon, Select the Situational Awareness in the drop \ndown box on the left of the ribbon. \n \n3. Click \non \nthe \nIndicators \ndropdown \nbox, \nselect \nthe \nwizard \nwzdAnalogueIndicator_Large_Horizontal_v01 then click on the Overview graphic form. \n4. The user will then be prompted to supply a substitution for the Analogue Agent, Click the \nbrowse button and select the data element Adroit.Analog.BAT-01-MIX-01-TEM make sure \nthat the data element does not contain a slot. The result should be green to display a valid \ndata element. \n \nFigure 47 - Substitution Assignment \n5. Click the Finish button, save and run the graphic form.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 39 \n \nFigure 48 - Display the Analogue indicator Wizard. \n8.2. \nTemplates \nAdroit Templates are re-usable graphic forms that can be used at run-time. The fundamental difference \nbetween a graphic form and a Template is that a Template has substitution abilities. This really means \nthat wherever you have repeatability for displays, such as machine process values you can effectively \ncreate a single trend configured as a Template and at runtime when you click on a certain machine you \ncan simply launch the Trend and substitute that machines values. \n8.2.1. Opening a Template \nOpen the template Analogue Faceplate Template from a button on the graphic form Overview. \n1. Confirm that the graphic form Overview is open and not in run mode. \n2. From the toolbox view under Windows Form select the button control and place it on the \ngraphic form. Set the following properties of the button \na. (Name):btnActTempValue \nb. Font:Arial, 9pt \nc. Size:107, 45 \nd. Text:Analog Faceplate \n3. With the button btnActTempValue selected, add a new Execute Command behaviour. \n4. Set the Command dropdown box to Open graphic form. Browse for the Graphic Form to \nShapes Wizards and Examples.Templates.Analogues.Analogue Faceplate Template \n5. Change the Open as: dropdown box to Modeless Form. \n6. Click the Finish button.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 40 \n \nFigure 49 - Execute Command Behaviour \n7. Click on the Advanced View > button, then select the Aliases tab. The Analogue Data Element \nSubstitution should be available in the Alias list. If not click on the get Aliases button. \n8. Click on the input field and select the Browse button and browse the data element \nAdroit.Analog.BAT-01-MIX-01-TEM. \n \nFigure 50 - Execute Command Behaviour Substitution \n9. Click the Finish button, save and run the graphic form. When the user clicks the button, the \nuser will see an error “This action is only available in the Operator”.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 41 \n \nFigure 51 - Operator Action Error \nThe User will need run the SmartUI Operator application to start the Operator view.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 42 \n9. SmartUI Operator \nTo view a project the user will need to run the Adroit SmartUI Operator by clicking on the Icon on the \ndesktop. \n \nThe user will then be prompted to login to the local SmartUI server. The user login is the same as the \nusers Windows credentials. Enter the login Name and Password. Click on the Finish button. Just like the \nDesigner, the Operator has an Enterprise Manager view which will allow the user to open a run time \nversion of the graphic forms created in the Designer. \n \n9.1. \nRunning the Operator \nOpen the graphic form Overview in the Operator. \n1. Run the SmartUI operator by double clicking on the Icon on the desktop. \n2. Login using the same user’s credentials as used with the designer. \n3. In the enterprise manager double click on the Overview graphic form in the Plant A project. \n4. Click on the Button Analog Faceplate. \n \n \nFigure 52 - SmartUI Operator\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit 10 Quick Start Guide \n \n \n \n \n \n \n \n \nP a g e | 43 \n10. Adroit Product Suite Documentation \nThe following related documentation is also available on the Adroit website:- \n \nhttps://adroittech.co.za/downloads-tree-view/\n\n[Page 4]\nP a g e | 3\n1. Introduction\nThe Adroit Quick Start Guide document is designed to help the new user install, configure and get an\nunderstand of the various Adroit sub-systems. In addition to assist a new user in understanding the Adroit\napproach to SCADA/HMI project development and concepts surrounding the Adroit product.\n1.1.\nGeneral Overview\nIn order to understand Adroit it is important to understand the basic architecture of the product.\nBelow is a diagram, which represents the basic standalone architecture.\nFigure 1: Basic Stand Alone Architecture\nFront end device (FED): The front-end device is a general term used for a PLC; OPC server;\nRTU; a controller; or any software package that allows third party communication (i.e. OPC,\nSIMATIC NET).\nProtocol driver: Adroit supports +- 100 different protocols. Once a new driver has been installed\nand configured to talk to a FED, it is called a Device. A single protocol can support multiple\nDevices. An example of this is the user can have multiple FEDs which use the same protocol\n(i.e. MODBUS Ethernet), each FED will have its own IP address/Address. A device will need to\nbe created for each FED.\nAgent Server (AS): The Agent Server (I/O Server), is the real-time database, which handles the\nreal-time values and if configured, will handle all post-processing, logging and/or alarming the\ndata.\nSmartUI Server (SUIS): The SUIS is a middleware server which exposes data from a number of\ndisparate sources, using the datasource, and also acts as a repository for the graphic forms or\nmimics. It also acts as the manager of access, and broker for the unified data model\nimplemented across all data types that may end up in the\nDatasource: Each source of data (i.e. Adroit Agent Server) requires a datasource plugin before\nit can be associated with the SmartUI Server. This provides the ability to expose its data as\ndata elements. An example of a data element is Adroit.Analog.SAMPLEANALOGUE.value. The\nSmartUI Server connects to data using two different types of datasources:\nThe SmartUI Server allows multiple sources of data to be available to the configuration of a\nsystem in a unifed manner. It basically coverts all datatypes into universally usable elements\n(dataelements).\n\n[Page 6]\nP a g e | 5\n2.1.\nHardware & Software Requirements\n2.1.1. Recommended Hardware & Software\nPlease refer to the Hardware & Software Specification document available from our website.\nhttps://adroittech.co.za/downloads-tree-view/\n2.1.2. Additional Software\nAdditional software that will expand the functionality of Adroit:\nInternet information services (IIS): Required for web service and distribution service\nSQL with advanced reporting services: used for historical data logging and reporting. Adroit\nships with the free SQL Express that can be used for these purposes.\n2.2.\nLicensing\nTypically, the Agent Server is licensed via a HASP software protection hardware key, which is inserted into\nthe USB port of the computer on which the Agent Server is running. This HASP is then programmed in\naccordance with your specific license agreement.\nIn situations where it is not possible to use a physical HASP, it is also possible to license Adroit via a\nsoftware license, which is only available on request. For further details, contact your Adroit representative\nfor details.\n2.2.1. Licensing definitions\nScan points: When a memory address is scanned/attached in the PLC and for every DBAccess\nAgent; Script Agent; and SNMP Agent a Scan Point is consumed.\nVersion: HASPs are licensed against versions of Adroit.\nIMPORTANT: The former Remote Nodes licenses that applied to all types of clients have been DISCONTINUED. These\nhave now been replaced by the following client specific node licenses, each of which have different costs:\no Clients: typically Operators and/or Designers and\no Mobile/Web Clients: typically Performance Anywhere or Adroit Air clients.\nOEM: Additional components that are separately licensed are specified as separate textual\nentries in the product license e.g. Adroit Alarm Management enablement, Adroit Historian\nenablement; Max Demand Agent, OEE Agent; Siemens Ethernet driver; DNP 3.0 driver.\nA time limit is set on development HASPs. Production HASPs have no time limit.\n2.3.\n1. Ensure that the Windows operating system on which you intend to install Adroit has been\nand remains legally licensed and ACTIVATED, since Adroit is not supported when it is run on\nan unlicensed Windows operating system.\n2. Ensure that you are not using the built-in Administrator account to run Adroit, since UAC is\nautomatically disabled whenever this built-in Administrator account is used.\n3. When installing and running Adroit on an operating system that provides User Account\nControl (UAC), such as Windows 7 or Windows Server 2008, please ensure that UAC is always\nENABLED, since Adroit is not supported when it is run with UAC disabled.\n4. Adroit 10 requires the Microsoft .NET Framework 4.6.2\n5. The Web Service component can ONLY be installed on a computer that has IIS (Internet\nInformation Services) installed.\n\n[Page 11]\nP a g e | 10\n2. Select the Add new configuration button.\n3. Give the new configuration a name. Then click the Ok button.\nFigure 10 - Create a new configuration\n4. Once the configuration has been created click the Ok button.\n3.2.\nCreating a Device\nSetup the OPC Client to the Adroit BatchOPC Server demo application. This application is part of the Adroit\ninstall.\n1. Open the Driver configuration in the Adroit Config Editor, under the Agent Server\nConfiguration.\nFigure 11 - Driver Configuration\n\n[Page 12]\nP a g e | 11\n2. Select the OPC Client Protocol driver, then click on the Add button.\n3. Enter the device name BAT_01\nFigure 12 - Device Name\n4. In the OPC client driver configuration select the Adroit Batch OPC Server in the OPC server\ndrop down box.\n5. Click Ok.\n6. Click Ok on the performance counter installation.\nFigure 13 - OPC client configuration\n\n[Page 24]\nP a g e | 23\n6.2.\nScanning\nScanning values simply means communicating using a predefined protocol from a memory address of a\nFED to a TAG.\n6.2.1. Scanning a Tag\nTo scan the RawValue slot of the of BAT-01-MIX-01-TEM Analog Agent to the Adroit Batch OPC Server:\n2. Select the Analog Agent BAT-01-MIX-01-TEM.\n3. Click on the Scan button.\n4. In the scanning configuration, select the device BAT_01 in the Device dropdown box.\n5. The user will be prompted to create the device.\n6. Click the Yes button. The Adroit Batch OPC Server will automatically start.\nFigure 28 - Batch OPC Server\n7. Enter the OPC address ActualMixTemp into the address field and change the Scan rate to 0.\n8. Click on the Scan button to add the scan job to the device.\n\n[Page 35]\nP a g e | 34\n7.2.\nLine Charts\nThe line chart control is used to display live as well as logged data from the Adroit Agent Server.\n7.2.1. Display Historical Data\nUsing the Line Chart control to display the logged data of the Analog Agent BAT-01-MIX-01-TEM.\n1. Confirm that the graphic form Overview is open and not in run mode.\n2. From the toolbox view under Data select the LineChart control and place it on the graphic\nform. Once the control has been placed the LineChart configuration will open.\n3. Change the Title of the series from Line to Actual Mixing Temperature by double clicking on\nthe series name Line.\nFigure 41 - Configuration Line Chart Series Name\n4. Select the Values tab in the series setup. Then setup the values as follows."}, {"title": "ATQMS-MKTG-DOC-ADR_10-Spec-Sheet-2024", "href": "manual_chapters/ATQMS-MKTG-DOC-ADR_10-Spec-Sheet-2024/index.html", "category": "Product Manuals", "rel": "manual_chapters/ATQMS-MKTG-DOC-ADR_10-Spec-Sheet-2024/index.html", "kind": "Manual", "text": "___________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-ADR_10 - Spec Sheet 2024.docx \n \n \n \n \n \n \n \nP a g e | 1\n\n_________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-ADR_10 - Spec Sheet 2024.docx \n \n \n \n \n \n \n \nP a g e | 2 \nCOPYRIGHT \n \nCopyright © 2024 Advanced Worx 112 uivalent) \nRAM \n16GB \n8GB \n8GB \nHDD* \n6GB Free (excluding datalog requirements) \n80GB Free \n80GB Free \nHDD Speed \n7200rpm (enterprise grade) ** \n7200rpm (enterprise grade) ** \n7200rpm (enterprise grade) ** \nDisplay Resolution \nFull HD (1920 x 1080) \nFull HD (1920 x 1080) \nFull HD (1920 x 1080) \nNetwork \n1 GB/s Full duplex *** \n1 GB/s Full duplex *** \n1 GB/s Full duplex *** \n \n \n \n \n \n \n \nRecommended for: Adroit (up to 2 500); MAPS (up to 2 500). ~ SQL & Reporting supported ~ \nMedium \nHardware & Software \nAgent Server \nOperator / Client \nEngineering Station \nSQL Server \nOperating System \nWindows Server 2016; 2019; 2022 \nWindows 10; 11 \nWindows 10; 11 \nWindows Server 2016; 2019; 2022 \nDatabase \n- \n- \n- \nMicrosoft SQL Server 2017; 2019; 2022 \nCPU**** \nServer: Intel Xeon (or equivalent) \nDesktop: Intel I7 (or equivalent) \nDesktop: Intel I7 (or equivalent) \nServer: Intel Xeon (or equivalent) \nRAM \n16GB \n8GB \n8GB \n16GB \nHDD* \n6GB Free (excluding datalog requirements) \n80GB Free \n80GB Free \n6GB Free (excluding database requirements) \nHDD Speed \n7200rpm (enterprise grade) ** \n7200rpm \n7200rpm \n7200rpm (enterprise grade) ** \nDisplay Resolution \nFull HD (1920 x 1080) \nFull HD (1920 x 1080) \nFull HD (1920 x 1080) \nFull HD (1920 x 1080) \nNetwork \n1 GB/s Full duplex *** \n1 GB/s Full duplex *** \n1 GB/s Full duplex *** \n1 GB/s Full duplex *** \n \n \n \n \n \n \n \nRecommended for: Adroit > 2 500; MAPS >2 500; Clusters; Hot Standby Systems; Distributed Multi-Server systems. ~ SQL & Reporting supported ~ \nLarge \nHardware & Software \nAgent Server \nOperator / Client \nEngineering Station \nSQL Server \nOperating System \nWindows Server 2016; 2019; 2022 \nWindows 10; 11 \nWindows 10; 11 \nWindows Server 2016; 2019; 2022 \nDatabase \n- \n- \n- \nMicrosoft SQL Server 2017; 2019; 2022 \nCPU**** \nServer: Intel Xeon (or equivalent) \nDesktop: Intel I7 (or equivalent) \nDesktop: Intel I7 (or equivalent) \nServer: Intel Xeon (or equivalent) \nRAM \n16GB \n8GB \n8GB \n32GB \nHDD* \n12GB Free (excluding datalog requirements) \n80GB Free \n80GB Free \n12GB Free (excluding database requirements) \nHDD Speed \n7200rpm (enterprise grade) ** \n7200rpm \n7200rpm \n7200rpm (enterprise grade) ** \nDisplay Resolution \nFull HD (1920 x 1080) \nFull HD (1920 x 1080) \nFull HD (1920 x 1080) \nFull HD (1920 x 1080) \nNetwork \n1 GB/s Full duplex *** \n1 GB/s Full duplex *** \n1 GB/s Full duplex *** \n1 GB/s Full duplex ***\n\n__________________________________________________________________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-ADR_10 - Spec Sheet 2024.docx \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nP a g e | 4 \n2. Web & Mobility : Supported Software \nSoftware \nPerformance Anywhere \nAdroit Air \nSecure Mobile Gateway \nOperating \nSystem \nAndroid 11 or higher \niOS 13.6 or iPadOS 13.6 or higher \nWindows Mobile (8,8.1,10) \nWindows OS 10 or higher (new Microsoft Edge & Google Chrome \nBrowsers only) \nAndroid 11 or higher \niOS 13.6 or iPadOS 13.6 or higher \nBrowser support: Chrome, Firefox, Safari, Opera, Edge; \nOS Support: Android, iOS, Linux, Windows \nOn-Cloud: Operator client install required (minimum hardware requirements) \nOn-Premise: Windows Server 2016; 2019; 2022; RDS Cals availability required ***** \n8GB RAM; If running on VM, VT-X support required. \n \n \n \n3. Notes \n* \nHard disk speed is of great importance when it comes to disk intensive operations like storing data. This applies to all forms whether logging to \na database or to proprietary datalog files. Hard disks with low rotational speeds (5400rpm) are not recommended in general as their read and \nwrite performance typically hinders overall performance of the system especially when it comes to historical data storage and retrieval \n** \nIt is recommended that enterprise grade drives be used. Enterprise grade disk drives are characterised by greater reliability in that rated mean \ntime between failures (MTBF) tends to be several orders higher than standard desktop grade drives. Caution must be exercised when considering \ndrives with faster rotational speeds as well as solid state drives since reliability varies greatly depending on model and manufacturer \n*** \nNetwork speed represents only part of network performance, and it is important to consider network latency (turnaround time) when \nunderstanding overall performance. A \"fast\" network with high latencies will result in an overall poor performance when considering more \n\"chatty\" transactional network traffic such as that between Adroit Client and Server Applications. \nSimilarly, network stability also comes into play. It is vital that the network supporting any SCADA system be stable. \n**** \nThe minimum CPU specification indicated are determined based on the median size and configuration for projects in general. However, it is \npossible to configure and execute projects on less performant hardware, based on the experience and testing of the project execution. CPUs \nincluding the Intel Atom C series and Intel Atom P Series could be utilized, especially for HMI projects. A minimum of two cores are required. \n***** \nThe On-Premise Secure Mobile Gateway requires the end-user or integrator to ensure that the necessary cyber security measures are in place \nif cloud based access will be provided. \nFor the On-Cloud version, the Cyber Security measures are part of the Adroit Data Center services. \nFor further information please consult with your Sales Representative. \nGeneral: \nIMPORTANT: Please consult with your sales representative to verify the specific details required for your project and/or solution.\n\n[Page 1]\nATQMS-MKTG-DOC-ADR_10 - Spec Sheet 2024.docx\nP a g e | 1\n\n[Page 2]\nATQMS-MKTG-DOC-ADR_10 - Spec Sheet 2024.docx\nP a g e | 2\nlicense agreement or nondisclosure agreement. The software may b _______________ \nATQMS-MKTG-DOC-ADR_AIR - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 2 \nContents \n1. \nSummary ............................................................................................................................................... 3 \n2. \nIntroduction.......................................................................................................................................... 3 \n3. \nInstallation ........................................................................................................................................... 3 \n4. \nInitial Setup .......................................................................................................................................... 3 \n4.1. \nRegister an Adroit Air account ........................................................................................................ 3 \n4.2. \nLogin .......................................................................................................................................... 3 \n4.3. \nCreate Project .............................................................................................................................. 3 \n5. \nInitial Configuration ............................................................................................................................. 4 \n5.1. \nInvite users ................................................................................................................................. 4 \n5.2. \nActivate Users .............................................................................................................................. 4 \n5.3. \nLicensing ..................................................................................................................................... 4 \n6. \nAlarm Configuration ............................................................................................................................. 5 \n7. \nText Messages ...................................................................................................................................... 5 \n8. \nProcess Data ......................................................................................................................................... 6 \n9. \nLinks to Other Adroit Mobile Applications ............................................................................................ 6\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-ADR_AIR - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 3 \n1. Summary \nAdroit Air is an alarm notification platform that enables user to receive alarms and process data directly \non their smart device. \n \n2. Introduction \nThis document deals specifically with the Adroit Air datasource functionality. Throughout this document \nit is assumed that users have downloaded the mobile app and registered an account. Adroit Air requires \ninternet access. All configuration and notification delivery runs through HTTPS. \n \n3. Installation \nThe installation should be run on the SmartUI Server. Make sure that the SmartUI Server and any clients \nhave been stopped. Run the installation. Follow the prompts and complete the process. This process \nshould be completed on all the PC’s that have SmartUI Designer installations. After installation, the \nSmartUI Server and clients can be started again. \n \n4. Initial Setup \nFrom the designer, add the Adroit Air datasource by right-clicking on the Datasources node in the \nEnterprise Manager tree, and selecting “Add datasource”. Select “Air” from the configuration wizard and \nclick finish. If you have already created an Adroit Air account for the administrator user, proceed to the \nlogin section. If not, complete the registration process first. \n \n4.1. \nRegister an Adroit Air account \nFrom the “Add Datasource” wizard, click the “Register” link. Fill in the required fields on the register \nwindow. Make sure to use a valid email address. Finish the registration process. When the registration \ncompletes, you can proceed to login. \n \n4.2. \nLogin \nEnter the login credentials of the administrator user. If you have forgotten the password for this user, \nclick the “Forgot password” link. This will send an email to the administrator’s email address with \ninstructions to reset the password. \n \n4.3. \nCreate Project \nIf the login succeeds, you will be able to create a project. An Adroit Air user can only be the administrator \nto one project. If your administrator account already has a project associated, you will be able to \ncontinue with the current one or remove the existing project and create a new one. Deleting a project \nwill erase all the configuration for that project. \nEnter the name of your project and click “Add project”. Once the project is created, you can finish the \nwizard and complete the process.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-ADR_AIR - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 4 \n5. Initial Configuration \nAt this point you should see the Air datasource in the Enterprise Manager tree. If you do not see it, try \nrefreshing the “Datasources” node in the tree. Right click on the Air datasource and select “Configure”. \nThe first step is to add the required Adroit Air users to the project. Any app user that wishes to be \nincluded in the project should have sent an ID to the specified email address. Typically, this would be \nyour Adroit Air administrator user. The administrator user is added automatically to the user list after \nthe project is created. \n \n5.1. \nInvite users \nEnter the ID’s of the users you wish to invite in the User ID text box and invite them one by one. When \nyou click invite, a unique One Time Pin (OTP) will be sent to that user’s Air app. The user should report \nthis OTP back, at which point you can select the user in the Pending Users box, enter the OTP in the \nOTP textbox and validate it. If validation succeeds, the user will be added to the project. If the user \ndoes not receive the OTP, you can resend the invite to the appropriate user ID. \n \n5.2. \nActivate Users \nBy default users are added in the “Active” state. A user can be de-activated at any point. An inactive \nuser will not receive any notifications and will not consume a license; however, a user can be fully \nconfigured while inactive. \n \n5.3. \nLicensing \nIf no Adroit Air licenses are found, you will be given 1 licence for demo purposes. Licensed users appear \nat the top of the “Available users” list and are indicated with a white background. Only users that are \nboth licensed and active will receive any notifications. If limited licensed are available, de-activate lower \npriority users to make licenses available for higher priority users.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-ADR_AIR - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 5 \n6. Alarm Configuration \n \nAlarms are assigned to available users from the “Alarms” tab. Each \nuser can be linked to a single alarm agent or alarm list agent on any \navailable Adroit datasource. Multiple users can be linked to the same \nagent. Changing the minimum priority setting will prevent lower \npriority alarms from being sent to the user. Changes will be applied \nwhen the “Finish” button is clicked on the wizard. \nThe configured agents will be monitored for changes. Whenever a \nnew alarm becomes active or an existing alarm clears, an updated \nlist of alarms will be sent to the appropriate users. Updates will be \nsent to users at a one minute interval. Filter options have been \nadded. \n \n \n \n \n \n \n \n \n \n \n \n7. Text Messages \n \nText messages can be sent to test the system or to deliver some \nspecific information to a user. Text messages can be up to 1000 \ncharacters long. Basic text formatting like tabs and line feeds are \nallowed. Filter options and selective deletion of messages have \nbeen added.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-ADR_AIR - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 6 \n8. Process Data \n \nFrom the “Process data” tab, new process data messages can be \nconfigured. Click on “Add process data message” to add a new message. \nBrowse the data element that will trigger this. Messages can be sent at \na maximum rate of once per minute. Click on the message to configure \nthe message content. A total of 24 configured messages allowed. \n \nUp to 20 data element values can be included in the message content. \nBrowse in the required data elements and set the required formatting \n(either manually or by using the format browser). Insert the data \nelements at the required point in the message by pressing the “Insert \nselected data element at the cursor” button. \nNow select which users should receive this message. A process data \nmessage can be sent to any number of available users. \nApply the changes and configure more messages if required. \nWhen the trigger value for a specified messages changes to true, the \nlatest value of all the data elements in that message will be read and \ninserted into the message (using the specified format) and the message \nwill be sent to all the configured users. If the trigger is toggled again \nbefore a minute has passed, the trigger is cached. Once a minute has \npassed the message will be raised again. Only one trigger will be cached \nper message, meaning if the trigger toggles 5 times in a minute, the \nmessage will only be sent once, with the latest data element values. \n \nFilter options and selective deletion of messages have been added. \n \n9. Links to Other Adroit Mobile Applications \nIf you have a Performance Anywhere (PA) server running, you can view the pages natively in the Adroit \nAir application. To access PA from the app, you first need to specify the address of the PA server for \nyour project in the Adroit Air datasource. On the project settings page of the datasource configuration \nwindow, enter the URL of the PA server. This URL should be reachable from the internet, or at least \nfrom a network available to any app instances that need to use this feature. Once you save this setting, \nit will be pushed to all of the Air clients available on the project. \n \nWhen the app receives this setting, it will automatically load a new page in the project view and load \nthe login page of PA. At this point the user could login manually on this interface, but it is recommended \nto store the credentials in the app in order to automatically login every time the page is loaded. To set \nthis up, go to the settings for the project in the app, and enter the relevant username and password \n(note that this is not the Adroit Air credential, but rather the credentials required to log into the PA \nserver - typically domain credentials: [domain]\\username). \n \nNow when the user returns to the PA page in the app and taps the refresh button, the page will reload \nand will login automatically. The page will be set to run automatically. While it is possible, users should \navoid attempting to make design changes to the page from the app as the real estate available makes \nthis an arduous task.\n\n[Page 2]\nATQMS-MKTG-DOC-ADR_AIR - Quick Start Guide.docx\nP a g e | 1\na license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of\nany means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser's personal\nuse without the written permission of Advanced Worx 112 (Pt
