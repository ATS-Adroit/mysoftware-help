d login manually on this interface, but it is recommended\nto store the credentials in the app in order to automatically login every time the page is loaded. To set\nthis up, go to the settings for the project in the app, and enter the relevant username and password\n(note that this is not the Adroit Air credential, but rather the credentials required to log into the PA\nserver - typically domain credentials: [domain]\\username).\nNow when the user returns to the PA page in the app and taps the refresh button, the page will reload\nand will login automatically. The page will be set to run automatically. While it is possible, users should\navoid attempting to make design changes to the page from the app as the real estate available makes\nthis an arduous task."}, {"title": "ATQMS-MKTG-DOC-Adroit Secure Mobile Gateway - Quick Start Guide", "href": "manual_chapters/ATQMS-MKTG-DOC-Adroit_Secure_Mobile_Gateway_Quick_Start_Guide/index.html", "category": "Product Manuals", "rel": "manual_chapters/ATQMS-MKTG-DOC-Adroit_Secure_Mobile_Gateway_Quick_Start_Guide/index.html", "kind": "Manual", "text": "____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Secure Mobile Gateway - Quick Start Guide \n \n \n \n \n \nP a g e | 1 \nCOPYRIGHT \n \nCopyright © 2020 Advanced Worx 112 (Pty) Ltd. All rights reserved. \nInformation in this document is subject to change without notice. The software described in this document is furnished under \na license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of \nthose agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or \nany means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal \nuse without the written permission of Advanced Worx 112 (Pty) Ltd. \nAdvanced Worx 112 (Pty) Ltd \n20 Waterford Office Park \n189 Witkoppen Road (c/o Waterford Drive) \nFourways \nSouth Africa \n \nwww.adroittech.co.za \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nVersion \nDate \nAuthor \nComment \nApproval \n1.0 \n21.11.2019 \nUnknown \nOriginal \nD. Wibberley \n2.0 \n22.05.2020 \nJ. Duncan \nUpdate Cover and formatting \nF. Kok \n3.0 \n10.07.2020 \nJ. Duncan \nUpdated and new sections added \nF. Kok \n4.0 \n28.08.2020 \nJ. Duncan \nFinalise \n \n5.0 \n13.11.2020 \nJ. Duncan \nMods to Troubleshooting and Firewall Rules\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Secure Mobile Gateway - Quick Start Guide \n \n \n \n \n \nP a g e | 2 \nContents \n1. \nRequirements: ................................................................................................................................. 3 \n2. \nInstallation ...................................................................................................................................... 3 \n2.1. \nStep 1: Download the Launcher .................................................................................................. 3 \n2.2. \nStep 2: Run the Launcher .......................................................................................................... 3 \n2.3. \nStep 3: Register and Connect ..................................................................................................... 3 \n2.4. \nStep 4: Retrieve the Connection Information / Launch a Browser ..................................................... 4 \n2.5. \nStep 5: Run the Secure Gateway Operator .................................................................................... 4 \n2.6. \nUsage within the Browser: ......................................................................................................... 5 \n3. \nFrequently Asked Questions: ........................................................................................................... 5 \n4. \nTroubleshooting .............................................................................................................................. 8 \n5. \nAddendum – Multiple Sessions ........................................................................................................ 9 \n6. \nAddendum – Security......................................................................................................................10 \n6.1. \nSSH 2.0 ................................................................................................................................ 10 \n6.2. \nHTTPS .................................................................................................................................. 10 \n6.3. \nCloud based process ............................................................................................................... 10 \n6.4. \nFirewall Rules ........................................................................................................................ 10 \n6.5. \nTo secure a project even further: .............................................................................................. 10\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Secure Mobile Gateway - Quick Start Guide \n \n \n \n \n \nP a g e | 3 \n1. Requirements: \nInternet Connection \nPC with SmartUI installed <- This could simply be an Operator PC which is configured to connect to \nanother Server within the network OR the actual SmartUI Server PC. \n \nNO open firewall ports, external -> internal internet access, IIS installation or other software is required \n \n2. Installation \n \n2.1. \nStep 1: Download the Launcher \nDownload the Launcher application here: \nhttps://adroittechnologiesautomation.com/securedownload/smg_launch.exe \n \n2.2. \nStep 2: Run the Launcher \nRun SMG_LAUNCH.EXE \nThis will connect to the distribution service and always ensure that the latest version of the Secure \nGateway Manager is installed. \n \n2.3. \nStep 3: Register and Connect \nProvide an e-mail address and click Register. \n \n \nOnce registration is complete, a license code will be displayed in the “License” box. If this is successful, \nclick Connect.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Secure Mobile Gateway - Quick Start Guide \n \n \n \n \n \nP a g e | 4 \n2.4. \nStep 4: Retrieve the Connection Information / Launch a \nBrowser \nIf the connection is successful, the “Connection Information” will appear green. Click on the “Connection \nInformation” for the Connection URL. \n \n \n \nBy clicking on the URL, the default browser will open and automatically launch the Operator connection \nfrom within the Browser. Right-click on the URL to Copy the connection information to the Clipboard \n(This URL can be pasted in a browser directly). \n \n2.5. \nStep 5: Run the Secure Gateway Operator \nThe Operator should launch within the browser and automatically be configured to connect to the Server. \nIf a username and password is required, provide the necessary credentials and Login to the Operator \nwindow within the Browser. These are the same credentials as if connecting with the local Operator. If \nthe Operator has been configured to automatically login, the Operator within the browser will also be \nconfigured to automatically login.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Secure Mobile Gateway - Quick Start Guide \n \n \n \n \n \nP a g e | 5 \n \n \n2.6. \nUsage within the Browser: \nOn a PC, pressing CTRL+SHIFT+ALT will bring up the connection menu. \nOn a Touch Device / Mobile, Swipe in from the left side to bring up the connection menu. \n \n3. Frequently Asked Questions: \n \nQ: Which versions of Adroit are supported on the Secure Gateway? \nA: 8.4.2.x LTS, 10.0.4.x and 10.0.5.x \n \nQ: How many simultaneous Cloud connections are supported? \nA: By default 2 simultaneous connections are supported for each registration. If more connections are \nrequired, please contact your Sales representative. \nNOTE: A maximum of 10 simultaneous connections are supported. \n \nQ: Which Browsers are supported? \nA: Internet Explorer, Edge, Firefox, Chrome, Safari, Opera \n \nQ: What licensing is required? \nA: The Cloud Hosted version requires Performance Anywhere licenses at the Server and a monthly \nhosting fee. The first 14 days is provided as a free trial. \n \nQ: What happens when I click on “Connect” in the Secure Gateway Manager? \nA: \n• \nThe Secure Gateway Client Manager determines whether a local Adroit Operator is installed. \n• \nIf found, it contacts the Secure Cloud Delegation Server and configures an Adroit Cloud Operator \nwith the same encrypted credentials and connection information as the local Adroit Operator. \n \nQ: How does the Operator Scaling work in the Web Browser? \nA: By default, the Operator scaling is configured for 1920x1080 (Full HD). The Cloud Operator will always \nbe scaled in order to maintain these dimensions without scroll bars. Scaling can be enabled/disabled in \nthe Advanced Menu -> Options -> Enable web client scaling. If scaling is turned off, scroll bars may \nappear at the side of the browser depending on the client resolution. For example: If a web browser is\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Secure Mobile Gateway - Quick Start Guide \n \n \n \n \n \nP a g e | 6 \nopen in full screen mode on a display that is configured for 1920x1080 resolution, no scrollbars should \nbe visible. \n \nQ: Should I redesign my project for mobile devices? \nA: No, this is not required. However, this can sometimes be preferred if the current level of detail on the \ngraphic forms are too much for smaller form factor devices. Also if the navigation is difficult to use on \ntouch based devices. In these cases, it can be useful to design a set of graphic forms with large \nnavigation options (such as large buttons) and a limited amount of detail in order to translate into a \nbetter usability experience for users on smaller form factor and touch based devices. The selection \nbetween the two types of projects can be configured by specifying a landing page where the user can \nchoose between either of the two types of projects. \n \nQ: What are the network requirements for the Secure Gateway? \nA: An Internet Connection of at least 2Mbps is recommended. \n \nQ: Will the Secure Gateway connection resume if the PC is restarted? \nA: Yes. The “Secure Gateway” Windows Service is automatically started when the PC reboots. A Secure \nGateway session can also be started / stopped via the Windows Service manager. \n \nQ: Will the Secure Gateway connection re-connect in the event of a network failure? \nA: Yes, the Secure Gateway connection will attempt to reconnect after a successful network connection \nhas been established again. \n \nQ: Can I use the same e-mail address for multiple connections? \nA: No, this is not currently supported. \n \nQ: What if I want to use the same e-mail address for another connection? \nA: First de-register the current connection through the Advanced -> Registration menu. Thereafter the \ne-mail address can be used for another connection. \n \nQ: What if my project requires additional DLLs and third party controls? \nA: In this case the Secure Gateway Manager can be configured for Own Process mode. In this mode \nthe Operator runs in a virtual session on the actual host that initiated the Secure Gateway Client \nManager and not on a Cloud Host. This mode requires Windows 2008, 2012 or 2016 Server editions. \nTo configure Own Process mode, please refer to the Secure Gateway Enterprise Mode \ndocumentation. \n \nQ: Which secure technologies are implemented? \nA: \n• \nThe Secure Gateway Client Manager requires no open firewall ports, a secure channel is initiated \nfrom client side – This prevents any direct exposure to sniffing, DDOS attacks and hack attempts. \n• \nSSH 2.0 implemented (RFC 4419/4432/6594 compliant) –Used by millions of organisations \nworldwide to provide secure communication \n• \nHTTPS and TLS to ensure secure web connectivity (TLS 1.2, AES128 with SHA256) \n• \nProvides optional 2FA – Two-Factor-Authentication can be used to provide additional security. \n• \nApplication specific – Access is only provided to the Operator and not to any underlying Operating \nSystem functions.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Secure Mobile Gateway - Quick Start Guide \n \n \n \n \n \nP a g e | 7 \n• \nIf the Operator is compromised or exits, the end-result is a virtual session hosted on a Cloud \nServer and not on the actual host (Applies only to Cloud Process hosting) \n \nQ: Where is the Secure Gateway Manager application installed? \nA: It is installed in the C:\\SECUREGATEWAY folder. If required, a shortcut can be created to the VIP \nLAUNCHER.EXE <- This is the executable that is responsible for ensuring that all files are up to date and \nwill then continue to launch the Secure Gateway Manager. \n \nQ: How do I remove the Secure Gateway Manager? \nA: \nStep 1 \nUninstall the Secure Gateway Service: \n \n \n \nStep 2: \nDelete the C:\\SECUREGATEWAY folder. This removes the application completely.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Secure Mobile Gateway - Quick Start Guide \n \n \n \n \n \nP a g e | 8 \n4. Troubleshooting \n \nQ: When I run the launcher, nothing happens, or it freezes at some point during or after the \nfiles have been downloaded. \n \nA: Certain Anti-Virus products as well as certain Windows Updates may cause this behaviour. Normally \nthis behaviour occurs after the necessary files have already been downloaded. Then the launcher can \nbe closed, and the SMG_MANAGER.EXE application can be run from within the C:\\SECUREGATEWAY \nfolder to configure the Secure Gateway connection. \n \nOR: \n1. A full version of the Secure Gateway Manager can also be downloaded here: \nhttps://adroittechnologiesautomation.com/securedownload/SecureGateway_latest.zip \n2. All the files inside this archive must be placed in the C:\\SECUREGATEWAY folder. \n3. The SMG_MANAGER.EXE application can be run from within this folder to configure the Secure \nGateway connection. \n \nQ: I am having trouble invoking the menu on a touch device \n \nA: On certain touch devices (such as iPhones) as well as certain browsers (such as \nSafari), the swipe action from left to right from the edge of the device triggers a “back” \naction instead of invoking the menu. \n \nOn these devices, to invoke the menu, take care not to swipe to close to the edge of \nthe device. In the picture below, be careful to swipe from left to right in the green area \nto the centre of the screen, and not the red area. \n \nTo remove the menu swipe from the right to the left again. \n \nThere is an on-screen keyboard which can be enabled for touch devices with and without built-in \nkeyboards on the menu. You can also make use of the built-in touch keyboard available on many \nOperator dialogs:\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Secure Mobile Gateway - Quick Start Guide \n \n \n \n \n \nP a g e | 9 \n5. Addendum – Multiple Sessions \n \nNormally a web browser (Firefox, Chrome, IE etc.) will store the Secure Gateway session information as \na session cookie for ALL OPEN TABS. In other words, opening a new tab in order to open another Secure \nGateway session will not work. The browser will simply navigate to the existing session. \n \nIn order to create multiple independent sessions: \n \n• \nIn Internet Explorer: \no Click File->New Session in order to create separate independent Secure Gateway sessions \n• \nIn Firefox \no Install the “Multi Account Containers” extension \n• \nIn Chrome \no Install the “SessionBox” extension\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Secure Mobile Gateway - Quick Start Guide \n \n \n \n \n \nP a g e | 10 \n6. Addendum – Security \n \nThe Secure Gateway makes use of several mechanisms to ensure confidentiality and integrity: \n \n6.1. \nSSH 2.0 \n• \nSecure Shell (SSH) is a cryptographic network protocol for operating network services securely \nover an unsecured network. \n• \nThis protocol is used widely by commercial and governmental organisations to establish a \ncryptographic network channel and ensure the confidentiality of the underlying communication. \n• \nThis protocol implements the RFC 4250 through 4345 Internet standards. \n• \nThe encryption protocol is used to establish an encrypted channel between the Secure Mobile \nGateway Client Manager and a Cloud Delegation Server. \n• \nThe protocol implementation that forms part of the Secure Mobile Gateway will only connect to a \ntrusted set of Cloud Delegation Servers as identified by their public/private key pairs. \n6.2. \nHTTPS \n• \nWeb based access is provided via HTTPS only and all traffic is encrypted between the Browser and \nthe Cloud Delegation Server. \n6.3. \nCloud based process \n• \nIf the “Cloud process” host mode is used, the actual Operator process does not run on the Host \ninfrastructure, but rather in a protected sandbox environment on one of the trusted Cloud \nDelegation Servers. \n6.4. \nFirewall Rules \n• \nIf required, specific firewall rules can be configured. All the rules require an OUTBOUND direction \nonly, NO INBOUND rules are required. \ni. RULE 1; Outbound; ALLOW HTTP/HTTPS secure.pharaday.org (port 80 & 443) \nii. RULE 2; Outbound; ALLOW HTTP/HTTPS 41.185.80.219 (port 80 & 443) \niii. RULE 3; Outbound; ALLOW HTTP/HTTPS 41.185.80.222 (port 80 & 443) \niv. RULE 4: Outbound; ALLOW HTTP/HTTPS/TCP adroittechnologiesautomation.com (port 80 & 443) \nv. RULE 5: Outbound; ALLOW HTTP/HTTPS/TCP mapscloudsolutions.com (port 80 & 443) \n6.5. \nTo secure a project even further: \n• \nProvide two-factor authentication - If an automatic login is performed through the Secure Mobile \nGateway, ensure that the default credentials in the Operator is of a low level user (i.e. no write \naccess). \n• \nAny elevated task (for example, changing a setpoint), would require an additional login process \nfrom within the Operator: \na. The Secure Mobile Gateway Client Manager retrieves the user details from the current active \nconfiguration. \nb. In order to change the credentials that the Client Manager uses, simply run the Operator, \nchange the credentials, and select “automatically login with these settings next time”. \nc. The next time the Secure Mobile Gateway Client Manager connects, it will use the newly \nconfigured Operator credentials.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Secure Mobile Gateway - Quick Start Guide \n \n \n \n \n \nP a g e | 11 \nd. Provide an optional login graphic form within the project, if a user could login and establish a \nhigher level of access for a specific task OR ensure that Data Element security is enabled for \nconfigured write access.\n\n[Page 3]\nATQMS-MKTG-DOC-Adroit Secure Mobile Gateway - Quick Start Guide\nP a g e | 2\n1.\n2.\n\n[Page 4]\nATQMS-MKTG-DOC-Ad y session can also be started / stopped via the Windows Service manager.\nQ: Will the Secure Gateway connection re-connect in the event of a network failure?\nA: Yes, the Secure Gateway connection will attempt to reconnect after a successful network connection\nhas been established again.\nQ: Can I use the same e-mail address for multiple connections?\nA: No, this is not currently supported.\nQ: What if I want to use the same e-mail address for another connection?\nA: First de-register the current connection through the Advanced -> Registration menu. Thereafter the\ne-mail address can be used for another connection.\nQ: What if my project requires additional DLLs and third party controls?\nA: In this case the Secure Gateway Manager can be configured for Own Process mode. In this mode\nthe Operator runs in a virtual session on the actual host that initiated the Secure Gateway Client\nManager and not on a Cloud Host. This mode requires Windows 2008, 2012 or 2016 Server editions.\nTo configure Own Process mode, please refer to the Secure Gateway Enterprise Mode\ndocumentation.\nQ: Which secure technologies are implemented?\nA:\nThe Secure Gateway Client Manager requires no open firewall ports, a secure channel is initiated\nfrom client side - This prevents any direct exposure to sniffing, DDOS attacks and hack attempts.\nSSH 2.0 implemented (RFC 4419/4432/6594 compliant) -Used by millions of organisations\nworldwide to provide secure communication\nHTTPS and TLS to ensure secure web connectivity (TLS 1.2, AES128 with SHA256)\nProvides optional 2FA - Two-Factor-Authentication can be used to provide additional security.\nApplication specific - Access is only provided to the Operator and not to any underlying Operating\nSystem functions.\n\n[Page 9]\nATQMS-MKTG-DOC-Adroit Secure Mobile Gateway - Quick Start Guide\nP a g e | 8\n4. Troubleshooting\nQ: When I run the launcher, nothing happens, or it freezes at some point during or after the\nfiles have been downloaded.\nA: C teway Client Manager and a Cloud Delegation Server.\nThe protocol implementation that forms part of the Secure Mobile Gateway will only connect to a\ntrusted set of Cloud Delegation Servers as identified by their public/private key pairs.\n6.2.\nHTTPS\nWeb based access is provided via HTTPS only and all traffic is encrypted between the Browser and\nthe Cloud Delegation Server.\n6.3.\nCloud based process\nIf the \"Cloud process\" host mode is used, the actual Operator process does not run on the Host\ninfrastructure, but rather in a protected sandbox environment on one of the trusted Cloud\nDelegation Servers.\n6.4.\nIf required, specific firewall rules can be configured. All the rules require an OUTBOUND direction\nonly, NO INBOUND rules are required.\ni. RULE 1; Outbound; ALLOW HTTP/HTTPS secure.pharaday.org (port 80 & 443)\nii. RULE 2; Outbound; ALLOW HTTP/HTTPS 41.185.80.219 (port 80 & 443)\niii. RULE 3; Outbound; ALLOW HTTP/HTTPS 41.185.80.222 (port 80 & 443)\niv. RULE 4: Outbound; ALLOW HTTP/HTTPS/TCP adroittechnologiesautomation.com (port 80 & 443)\nv. RULE 5: Outbound; ALLOW HTTP/HTTPS/TCP mapscloudsolutions.com (port 80 & 443)\n6.5.\nTo secure a project even further:\nProvide two-factor authentication - If an automatic login is performed through the Secure Mobile\nGateway, ensure that the default credentials in the Operator is of a low level user (i.e. no write\naccess).\nAny elevated task (for example, changing a setpoint), would require an additional login process\nfrom within the Operator:\na. The Secure Mobile Gateway Client Manager retrieves the user details from the current active\nconfiguration.\nb. In order to change the credentials that the Client Manager uses, simply run the Operator,\nchange the credentials, and select \"automatically login with these settings next time\".\nc. The next time the Secure Mobile Gateway Client Manager connects, it will use the newly\nconfigured Operator credentials."}, {"title": "ATQMS-MKTG-DOC-Adroit-Edge-Gateway-Quick-Start-Guide", "href": "manual_chapters/ATQMS-MKTG-DOC-Adroit-Edge-Gateway-Quick-Start-Guide/index.html", "category": "Product Manuals", "rel": "manual_chapters/ATQMS-MKTG-DOC-Adroit-Edge-Gateway-Quick-Start-Guide/index.html", "kind": "Manual", "text": "____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 1 \nCOPYRIGHT \n \nCopyright © 2025 Advanced Worx 112 (Pty) Ltd. All rights reserved. \nInformation in this document is subject to change without notice. The software described in this document is furnished under \na license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of \nthose agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or \nany means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal \nuse without the written permission of Advanced Worx 112 (Pty) Ltd. \nAdvanced Worx 112 (Pty) Ltd t/a Adroit Technologies \n20 Waterford Office Park \n189 Witkoppen Road (c/o Waterford Drive) \nFourways \nSouth Africa \n \nwww.adroitscada.com \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nVersion \nDate \nAuthor \nComment \nApproval \n1.0 \n27.05.2025 \nD. Wibberley \nOriginal (based on Jason M material) \n \n2.0 \n19.08.2025 \nD. Wibberley \nFinal\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 2 \nContents \n1. \nIntroduction.......................................................................................................................................... 3 \n2. \nGetting Started ..................................................................................................................................... 3 \n2.1. \nSystem Requirements ........................................................................................................................... 3 \n2.2. \nPrerequisites for installing and configuring the Product ........................................................................... 4 \n2.2.1. \nInstalling the Product ................................................................................................................................ 4 \n3. \nApplication Launcher ............................................................................................................................ 5 \n3.1. \nConfiguration ....................................................................................................................................... 5 \n3.2. \nAgent (I/O) Server ............................................................................................................................... 7 \n3.3. \nLicensing ............................................................................................................................................. 8 \n3.4. \nUtilities ................................................................................................................................................ 9 \n3.5. \nDocuments ........................................................................................................................................ 10 \n4. \nLicensing ............................................................................................................................................. 11 \n4.1. \nRequest a new license (c2v file). ......................................................................................................... 11 \n4.2. \nInstall the new license (v2c file). ......................................................................................................... 12 \n5. \nConfiguring the Adroit Edge Gateway ................................................................................................ 13 \n5.1. \nGateway Mode - Connecting to existing Adroit Agent Servers................................................................ 14 \n5.2. \nStand-Alone Mode - Configuring a Local Agent Server .......................................................................... 15 \n5.2.1. \nDriver Configuration ................................................................................................................................ 16 \n5.2.2. \nAgent Configuration ................................................................................................................................ 17 \n6. \nAdding an Adroit Datasource .............................................................................................................. 20 \n7. \nConfiguring a Microservice ................................................................................................................. 22 \n8. \nOther Settings, Debugging and Management .................................................................................... 24 \n8.1. \nStart Page ......................................................................................................................................... 24 \n8.2. \nGlobal Settings Page .......................................................................................................................... 25 \n8.3. \nDashboard Page ................................................................................................................................ 26 \n8.4. \nLogs Page ......................................................................................................................................... 27 \n8.5. \nEvents Page ....................................................................................................................................... 28 \n9. \nStarting and Running the System....................................................................................................... 29 \n10. \nBackup and Restore ............................................................................................................................ 29 \n10.1. \nBackup .......................................................................................................................................... 30 \n10.2. \nRestore ......................................................................................................................................... 30 \n11. \nAppendix A – Glossary ........................................................................................................................ 31 \n12. \nAppendix B – Simulator for Testing Purposes .................................................................................... 32\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 3 \n1. Introduction \nThe Adroit Edge Gateway is designed to provide universal secure connectivity between OT systems and \nthe Cloud . It can run as a Stand-Alone system or be used to provide the same functionality by connecting \nto existing Adroit SCADA systems. \n \nIn this guide we will be focusing on setting up and running the Adroit Edge Gateway and will touch on \nsome of the other functions that can be run from the Application Launcher. \n \nWe will also be focused on configuring and connecting to an Adroit Agent Server as a Datasource. The \noutput configuration of the software relates to individual Microservices and as such each have their own \nQuick Start Guides that can be found under the Documents menu of the Application Launcher. \n \nWe will not be dealing with the data once it gets into each Cloud endpoint or OPCUA interface as this is \nsomething that would be unique to the end user requirements. \n \n2. Getting Started \n2.1. System Requirements \nThe software can be downloaded from the Adroit Website. The installation is simple and requires little \ninput other than providing a valid local or domain user account under which the application services will \nrun and be able to access network resources. \n \nThe machine can be installed inside a network or in the DMZ of a company IT infrastructure, adding to \nthe security. Either way, if the Adroit Edge Gateway is to be used to publish data to an external Cloud \nService Provider or use the OPCUA/MQTT functionality somewhere on the Internet, it requires an Internet \nconnection. \n \nNote: The Adroit Edge Gateway software CANNOT be installed and added to an existing Agent Server machine \nand must run on a separate PC. \n \nThis User Account is important in that it will facilitate the correct level of access to local machine \nresources (typically this account is a local Admin on the Adroit Edge Gateway machine). \n \nIn the case where remote access to existing Agent Servers is required, this account must have user security \nrights to access the network and be able to authenticate on the SCADA network machines where the \nAdroit Agent Servers need to be accessed as Datasources.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 4 \n2.2. Prerequisites for installing and configuring the Product \nTo run in a “Stand-Alone Mode” you can simply install the product after downloading the media from \nthe Adroit Website. \n \nIf you wish to use the Adroit Edge Gateway in “Gateway Mode” connecting to an existing Adroit SCADA \nnetwork and if you are already running an older version of Adroit then you will need to have upgraded to \nAdroit version 10 or higher. \n \nRemember to install/upgrade all the components of Adroit, i.e. the Agent Server, SmartUI Server, SmartUI \nDesigner and SmartUI Operator prior to configuring the Adroit Edge Gateway. \n \n2.2.1. Installing the Product \nAfter downloading the software, the install is an executable and can simply be run by double-clicking on \nthe “.exe” file. Follow the steps and complete the installation. This will include a single icon on the desktop \nthat will allow the user to run the Application Launcher. \n \n \n \n \n\\ \n \n \n \n \n \nNote: It is recommended to restart the PC after installing the software. \n \nFigure 1 Installation Dialogs and Desktop Icon\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 5 \n3. Application Launcher \nThere are various menu items available within the application interface: \n \n• \nConfiguration \n• \nAgent (I/O) Server \n• \nLicensing \n• \nUtilities \n• \nDocuments \n \n3.1. Configuration \nFrom the Configuration menu option, the user will be able to launch the Configuration Editor application \n(commonly known as the Config Editor). From here the user will have access to all settings and \nconfiguration of each component that makes up the Edge Gateway. \n \nFigure 2 The Configuration Menu \n \nApplication \nDescription \nConfig Editor \nThe Adroit Edge Gateway Configuration Editor allows for setting up Edge Items and \nconfiguring settings for all Adroit Edge Gateway applications and Servers as well as \nother core functions such as backup and restore. \n \nThis is where the majority of the Adroit Edge Gateway configuration happens i.e., adding and connecting \nto Adroit Datasources and configuring the chosen Microservice(s). \n \nThe adding and setting up of Microservices and the detailed configuration and troubleshooting of each of \nthese can be done using the particular Microservice Quick Start Guide.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 6 \nThe landing page will present a summary of the status of the system and will point out any missing \ncomponents or services that have not yet been started. Resolving these “issues” is done in the same place: \n \nFigure 3 Edge Gateway Configurator Window\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 7 \n3.2. Agent (I/O) Server \n \nFigure 4 Agent (I/O) Server Menu \nApplication \nDescription \nAgent Configurator \nThe Agent Configurator allows the creation and configuration of Agents in the Agent \nServer. \n \nClicking on this item opens the Agent Server (I/O Server) Configuration application. This is where users \ncan add, delete and configure Agents, add and manage connections (PLC Drivers and Devices), Setup \nScanning to PLC’s etc. This is dealt with in more detail later in the guide. \n \nFigure 5 Agent Configurator\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 8 \n3.3. Licensing \nOpening the Licensing Utility opens the application known as the Adroit Licensing Utility (ALU). It shows \nwhat Adroit Edge Gateway is licensed for. A new user will also use the application to request a soft license, \nand to install the license once received using the sub-menu items within the ALU itself. \n \nFigure 6 Licensing Menu \nApplication \nDescription \nLicensing Utility \nThe Adroit Licensing Utility allows you to get, view and/or update your Adroit Edge \nGateway product license, which you can either license via a HASP hardware key or a \nsoftware license. \n \nFigure 7 Adroit Licensing Utility (ALU)\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 9 \n3.4. Utilities \n \nFigure 8 Utilities Menu \nThe utilities contained and launched from here assist with configuration debugging and include: \n \nApplication \nDescription \nService Manager \nThe Service Manager application monitors and controls the key Edge Services. \nAgent Browser \nThe Agent Browser utility allows you to browse the Agents and slots of an Agent \nServer. \nDriver Monitor \nAllows advanced users to diagnose or troubleshoot device drivers. \nScanning Monitor \nThe Scanning Monitor utility is designed to assist experienced users in fine-tuning the \nAdroit scanning subsystem to achieve optimal performance, by providing an intuitive \nreport-like view of advanced diagnostic information. \nAgent Server Monitor Allows advanced users to diagnose or troubleshoot the Agent Server and its client \nconnections. \n \n \n \nFigure 9 Typical Monitoring of Device using Scanning Monitor Utility\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 10 \n3.5. Documents \nThis Menu folder contains documents including all the Quick Start Guides for the Adroit Edge Gateway and \neach of the Microservices available to the user. \n \nFigure 10 Documentation Menu \nApplication \nDescription \nQuick Start Guide \nA Guide to help getting started with Adroit Edge Gateway. \nAdroit Cloud Microservice \nAn installation guide for Adroit Cloud Microservice. \nAWS Microservice \nAn installation guide for Amazon Web Services Microservice. \nHTTP Microservice \nAn installation guide for HTTP Microservice. \nMicrosoft Azure Microservice \nAn installation guide for Microsoft Azure Microservice. \nMQTT Microservice \nAn installation guide for MQTT Microservice. \nOPC UA Microservice \nAn installation guide for OPC UA Microservice. \n \nFigure 11 Microservices Documents\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 11 \n4. Licensing \nThe process is simple, and the general approach is as follows: \n \n4.1. Request a new license (c2v file). \nOnce you have installed the product, run the Application Launcher. \nOpen the Licensing tab, run the Licensing Utility, navigate to the Licensing menu and select “Licensing \nUtility”. \nFrom here the user can generate a License request file (.c2v) \n \nFigure 12 Adroit Licensing Utility \nOpen the Adtech Licensing Utility and select “Generate license request file” in the top right hand corner. \nThe c2v file will be generated as follows “New-SL-computername.c2v”. \nSend an email to licensing@adroit.co.za with this c2v file attached. \nAdroit Technologies will then generate the required v2c file accordingly. \nYou will receive an email with the attached v2c file with instructions on how to apply the license.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 12 \n4.2. Install the new license (v2c file). \nCopy the attached v2c file to a folder on your PC. \nOpen the Adtech Licensing Utility, click on “Install new license” \nBrowse to where you saved your v2c file, select the license file and click Open. \nClose the Adtech Licensing Utility. \n \nFigure 13 Adroit Licensing Utility showing install License \n \nHaving installed the license, restart the PC to initiate.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 13 \n5. Configuring the Adroit Edge Gateway \nOpen the Application Launcher, navigate to the “Configuration” menu and run the Config Editor. \n \nIn the Start Page Window you should have all the green ticks indicating that the following Services are \nstarted when launching the product: \n• \nLocal Agent Server \n• \nSmartUI Server \n• \nSmart Data Services \n \nNote: These services are started in the “Automatic (Delayed Start)” start-up type, thus allowing priority to important \ncritical services. Delays may occur before all services are started. \n \n \nFigure 14 Config Editor showing installed License and Services running. \n \nThere are two ways the Adroit Edge Gateway can be used. \n \n• \nGateway Mode (refer to section 5.1) \n• \nStand-Alone Mode (refer to section 5.2) \n \nDetails on how to configured each mode are described in the relevant sections.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 14 \n5.1. Gateway Mode - Connecting to existing Adroit Agent Servers \nIf you are installing the Adroit Edge Gateway on an existing network or in the DMZ of a company IT \ninfrastructure, follow this simple procedure. \n \n \n \n \nIf you are using the Adroit Edge Gateway on an existing Adroit SCADA/HMI solution you can move to the \nChapter 6 that deals with “Adding an Adroit Datasource” connection to each of the Agent Servers from \nwhich you wish to extract and publish data.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 15 \n5.2. Stand-Alone Mode - Configuring a Local Agent Server \nWhere a user is installing it as a stand-alone concentrator from a stand-alone PLC or a network of PLCs. \nIn this instance the user needs to run and configure the local Agent Server, configure PLC drivers along \nwith creating and scanning the Agents to the PLC’s prior to being able to access the Tags required for the \nAdroit Edge Gateway solution. \nTo users that do not know anything about how Adroit Agent Servers work there is a lot more detailed \ninformation on the Adroit SCADA on the website. Remembering that the Adroit Edge Gateway is built on \nthe tried and tested Adroit SCADA but does not have the HMI interface. \n \n \nOnce your Agent (I/O) Server has started as a Service, you can now start configuring your local Agent \nServer as follows: \n• \nDriver Configuration (refer to section 5.2.1) \no Add and configure a Device Driver \n• \nAgent Configuration (refer to section 5.2.2) \no Create the Agents/Tags required. \no Scan these tags to the front-end device (PLC)\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 16 \n5.2.1. Driver Configuration \n• \nFrom the Agent Server Configuration menu on the left select “Driver Configuration”. If the driver \nyou wish to use is NOT in the list then just click on “Install New Driver” item and select the \ndriver from the list presented and follow the installation process. \n• \nOnce the Driver is installed you need to create a Device instance that uses the selected driver. \nThis is done by highlighting the Driver in the list and clicking on “Add” button. This will allow \nyou to name the Device and to configure the Device communications parameters. \n \nFigure 15 Adding a Device/PLC Driver \nThe image below shows a Device named MITS_PLC_BATCHING that is using the Mitsubishi Ethernet Driver \nalong with its specific configuration. You will see the relevant IP settings, Timeouts etc. set for the Device. \nWith most drivers you can test the communications to ensure that the Device has been set up correctly. \n \nFigure 16 Configuring a Device\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 17 \n5.2.2. Agent Configuration \nFrom the Application Launcher, open the Agent (I/O) Server tab and launch the Agent Configurator. \n \nThe Agent Server Configurator is the application that is used to configure Agents which are then the \nDataelements you will want to publish via the Adroit Edge Gateway to the Cloud (or expose using OPCUA). \n \n \nFigure 17 Agent Server Configuration Window \nData from the field is represented in Agents (add an Agent that suits the data or functionality required) – \nthe standard Basic Agents are as follows: \n \nAgent \nDescription \nAnalog \nstores a floating-point engineering value, and associated scaling parameters. \nCounter \nDriven by a Digital Agent and delivers value-add data on a Digital Agent (i.e., on count, off count etc.). This is \nan Internal Agent. \nDigital \nstores a digital (ON/OFF) value and their text representations \nExpression \nExpression – allows for the configuration and execution of user-defined mathematical and logical expressions. \nMarshal \n\"marshals\" an integer input value into 16 discrete digital values \nString \nstores an 80-character ASCII string (79 chars max. with zero terminator) \nStringList \nstores any number of variable ASCII strings. \nTimer \nperforms several commonly used timing operations.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 18 \nThere are many Agents available to the user to do pre-processing in the Agent Server and just use the \ndata necessary in the Cloud. \n \nNOTE: Refer to the Adroit Technical Description Document available on the website for a better \ndescription and understanding of the Adroit Agent concept and functionality. For many users it requires \nan understanding of the Adroit Agent terminology. A TAG in the Adroit world is the Agent.Slot and \nevery Tag can be used in the Adroit Edge Gateway solution. \n \nThe images below shows an Analog Agent named MIXING_MOTOR_CURRENT and by double-clicking on \nthe Agent you have added, it is possible to configure the particulars of the Agent such as Scaling, Units, \nAlarm Levels and Deadbands etc. \n \nFigure 18 Adding and Setting up an Analogue Agent \nThe next step would be to Scan the Slot (typically the Agent.RawValue) to the PLC address in the selected \nPLC. This is done by selecting the Agent in the list, clicking on the “Scan” button and following the next \nfew steps. \n \n• \nSelect the PLC Device from the Device listbox. \n• \nClick on “Started” Radio Button (this allows you to stop and start a driver, however this only \nneeds to be done once and applies to all Agents scanned to that Device.) \n• \nSelect the Agent Slot you wish to scan to. \n• \nAdd the PLC address. \n• \nSelect the Scan Rate you wish to use. \n• \nClick on the Scan button, this will add to the scan list below and will automatically begin \ncommunications to the PLC.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 19 \nThere are various tools to check that the values are correct and are available in the Utilities Menu of the \nAdroit Edge Gateway Application Launcher. The easiest way is to simply open the Agent and click on \n“Refresh” to monitor or set the values of the Slots and see that they are changing and showing the correct \nvalues as contained in the PLC register. \n \nNote: As previously pointed out there are many Agent Types, and each adds value to the project. Details \nof each Agent can be found in the help file in the Agent Configurator, else in the Adroit Technical \nDescription Document available on our website. \n \nOnce you have configured your device driver and required Agents you can move to the Chapter that deals \nwith “Adding an Adroit Datasource” connection to each of the Agent Servers from which you wish to \nextract and publish data.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 20 \n6. Adding an Adroit Datasource \nWhen “Edge Gateway Configuration” is selected in the Config Editor, the view will show available \nDatasources in the top left tree (this is used to select tags from one or more Agent Servers). \n \nIn order to add an Adroit Datasource, click on “Add Adroit Datasource” in the “Datasources” window. \n \nName the Datasource and browse your network and select the \nAgent Server you wish to access and publish data from. Once added \nthe tree can be expanded and you can browse down the list of \nAgents and Slots available. \n \nThe Adroit Edge Gateway makes data available from one or more \nAgent Servers. These are made available by adding Datasources \nfor each Agent Server (or Cluster). \n \nThe option to add Adroit Datasources is clearly visible at the top of the Datasource tree. This will then \nprompt us to name and configure a new Datasource by typing in the applicable connection string for the \nrelevant Agent Server (typically of the form: ComputerName.AgentServerName). \n \nFigure 19 Add new Datasource \nOnce a Datasource is added the Agents will become available in the Datasource tree and can then be \nlinked to Microservices for publishing. \n \nNote: it is possible to expose Agents and Slots (properties) of any Agents existing within your Agent Server, by \nchanging the selection under the Options icon on the right-hand side of this window.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 21 \n \nFigure 20 Config Editor showing Datasource\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 22 \n7. Configuring a Microservice \nThe next step is to set up the Microservice you wish to use to Publish your Dataelements to. This is done \nin the Microservices window. There is a separate “Quick Start Guide” for each of the possible Microservices \navailable within the Adroit Edge Gateway. These can be accessed from the Document Menu in the \nApplication Launcher. \n \nFigure 21 Microservices Configuration Window \n \nIt is important to understand the architecture of the Microservices, and the terminology used in the Adroit \nEdge Gateway. \n \nA Microservice is similar to an Adroit Driver, a Connection is similar to a Device and a Publisher is an \ninstance of a “Job”, so a controlled push of data governed by your application requirements. \n \n• \nMicroservice \no Connection 1 \n▪ \nPublisher 1 \no Connection 2 \n▪ \nPublisher 1 \n▪ \nPublisher 2 \n \nAn example might be as follows: \n• \nAdroit Cloud \no Plant 1 \n▪ \nBlending Batch Details (published at end of Batch Cycle) \no Plant 2 \n▪ \nEnergy Values (published every minute) \n▪ \nProduction Values (published at end of shift)\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 23 \nExamples of this can be found below: \n \nFigure 22 Examples of configured Microservices\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 24 \n8. Other Settings, Debugging and Management \nThere are a number of other tabs in the Configuration Interface namely: \n \n• \nStart Page \n• \nGlobal Settings \n• \nDashboard \n• \nLogs \n• \nEvents \n \n8.1. Start Page \nThe Start Page shows the status and gives the user control over stopping and starting the various \napplications and services used in the Publisher. \n \nFigure 23 Start Page\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 25 \n8.2. Global Settings Page \nIn the Global Settings Page, the User can set the display format of the Analogue Values and set the \nDate/Time format to be used in the JSON message. \n \n \nFigure 24 Global Settings Page\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 26 \n8.3. Dashboard Page \nIn the Dashboard Page shows the status of the License and each Microservice configured. \n \n \nFigure 25 Dashboard Page \nThis page will also give an indication if there is a problem on any of the Microservices. i.e., licensed items \nexceeded, Publishers not started etc.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 27 \n8.4. Logs Page \nThe Logs Page shows a log of what has happened in the product. This is very useful when understanding \nhow the system is functioning. \n \nFigure 26 Logs Page\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 28 \n8.5. Events Page \nThe Events Page shows a log of the Windows Event System pertaining to the Publisher you have \nconfigured. This page is useful for debugging a system. \n \nFigure 27 Events Page\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 29 \n9. Starting and Running the System \nBy default, the Adroit Edge Server and other Services are installed as Services. This means it can run \nsecurely within an IT environment as a Service. \n \nNote: You need to start the individual Microservice for it to publish and in addition ensure the connection \nmade is not in Maintenance Mode but in Publish Mode. \n \nThe following picture shows that the Microservice is running and the Connection is in “Publish” mode not \n“Maintenance” mode. These are dealt with in more detail in each of the Microservice Quick Start Guides. \n \n \n \nFigure 28 Microservice running and the connection in Publish Mode. \n10. Backup and Restore \nThe backup process generates a single compressed file in the specified location, which contains the \ndate and time of its creation, as well as containing all the relevant registry settings and all the files \nand folders containing the user-configuration of the currently specified Configuration. \n \nFigure 29 System Backup and Restore\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 30 \n10.1. \nBackup \nBackup files are generated and stored at the following standard location: \nC:\\ProgramData\\Adroit Technologies\\Adroit\\SmartUI\\Backups\\Default_Backup \n \n \n10.2. \nRestore \nBefore restoring the backup file, all service must be stopped. \nSelect the backup file you wish to restore, then click Restore. \n \nNote: It is recommended to restart the PC after a Restore, this will ensure all required services are started.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 31 \n11. Appendix A – Glossary of Terms \n \nOT \n“Operational Technology”. Referring to the hardware and software used to \nmonitor and control physical devices. This often refers to the hardware on which \nSCADA and associated software operates. \nDMZ \n“Demilitarized Zone”. A sub-network or network zone separated by firewalls \nand/or switches in order to create a form of buffer zone between OT machines \nand outside networks or the internet. \nMicroservice \nRefers to services responsible for specific functional roles within the Edge \nGateway. These services typically represent specific types of Publishers (Adroit \nCloud or OPC UA for example) \nEndpoint \nAn Endpoint is essentially an address representing a specific service or API for \ningesting and processing data. A single cloud service may expose multiple \nEndpoints representing logical grouping of incoming data and different potential \nprocessing streams within the cloud service. \nDatasource \nThis represents a source of data. Most commonly in the Edge Gateway this will \nrepresent a connection to a specific Adroit Agent Server. The Datasource then \nexposes individual Dataelements that can then be consumes by Microservices \nand their Publishers. \nDataelement \nA single point of data, typically representing a specific Slot within an Agent \n(when referring to data from an Adroit Datasource) but can also represent \ncomplex data types such as lists and tables from various Datasources \nAgent \nAn Agent is the fundamental object type defined within the Agent Server. It \nrepresents a logical container that exposes one or more slots. \nIn most cases the Agent is responsible for ingestion of raw data from devices \nand then applying intermediate manipulation thereof in order to make said data \navailable to other consumers in different forms (scaling of raw data in an Analog \nfor example). \nSlot \nA Slot typically represents a single value as exposed by a given Agent (the value \nSlot of an Analog agent which represents the scaled raw value as read from a \nphysical device) \nTag \nThis refers to the minimum uniquely addressable form when consuming data \nfrom an Agent Server, i.e. “Agent.Slot”. This term is commonly used simply to \nrefer to a specific value from an Agent Server. \nStand-Alone Mode \nA self-contained, independent installation of the Edge Gateway that includes a \nlocal Agent Server thus providing a complete solution from physical device to \nendpoint (whether cloud based or OPC UA). \nGateway Mode \nSimilar to Stand-Alone with the primary difference being the absence of a local \nAgent Server. This variant connects to external Agent Servers and augments \ntheir existing functionality by publishing data through various Microservices.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx \n \n \n \n \n \n \nP a g e | 32 \n12. Appendix B – Simulator for Testing Purposes \n \nFor initial testing purposes, the user can make use of the built-in SIMPLC Simulator to simulate their \nFront-End Device. \n \nFor Analog Tags, use any of the range of addresses between DB 0:DW0 to DB 255:DW255 \nTo simulate a dynamic situation, the values in memory are automatically incremented by the DB number \non every scan. The formula is: new value = old value + DBnumber \nFor example: \n \n• \nscanning to DB2:DW0 will increment the analog by 2 every cycle \n• \nscanning to DB10:DW0 will increment the analog by 10 every cycle \n \nFor Digital Tags, use any of the range of addresses between DB 0:DW0.0 to DB 255:DW0.15 \nAny address in the range will result in the value of the Tag cyclically switching between 0 and 1. \nFor example: \n \n• \nscanning to DB0:DW0.0 will toggle the value every cycle. \n \nFollow this simple procedure: \n• \nOpen the Agent Configurator. \n• \nSelect the Tag you wish to scan, Click “Scan”. \n• \nSelect the SIMPLC from the Device listbox. \n• \nSelect the Agent Slot you wish to scan to.(i.e., value or rawValue) \n• \nAdd the Address.(see above examples) \n• \nSelect the Scan Rate you wish to use. \n• \nClick on the Scan button, this will add to the scan list.(Currently scanned tags) \n• \nClick on “Started” Radio Button (this allows you to stop and start a driver, however this only \nneeds to be done once and applies to all Agents scanned to that Device.) \n• \nClick on File, Save in order to save the changes. \n \n \nFigure 30 Scanning the Agent Slot to the PLC\n\n[Page 4]\nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx\nP a g e | 3\n1. Introduction\nThe Adroit Edge Gateway is designed to provide universal secure connectivity between OT systems and\nthe Cloud . It can run as a Stand-Alone system or be used to provide the same functionality by connecting\nIn this guide we will be focusing on setting up and running the Adroit Edge Gateway and will touch on\nsome of the other functions that can be run from the Application Launcher.\nWe will also be focused on configuring and connecting to an Adroit Agent Server as a Datasource. The\noutput configuration of the software relates to individual Microservices and as such each have their own\nQuick Start Guides that can be found under the Documents menu of the Application Launcher.\nWe will not be dealing with the data once it gets into each Cloud endpoint or OPCUA interface as this is\nsomething that would be unique to the end user requirements.\n2. Getting Started\n2.1. System Requirements\nThe software can be downloaded from the Adroit Website. The installation is simple and requires little\ninput other than providing a valid local or domain user account under which the application services will\nrun and be able to access network resources.\nThe machine can be installed inside a network or in the DMZ of a company IT infrastructure, adding to\nthe security. Either way, if the Adroit Edge Gateway is to be used to publish data to an external Cloud\nService Provider or use the OPCUA/MQTT functionality somewhere on the Internet, it requires an Internet\nconnection.\nNote: The Adroit Edge Gateway software CANNOT be installed and added to an existing Agent Server machine\nand must run on a separate PC.\nThis User Account is important in that it will facilitate the correct level of access to local machine\nresources (typically this account is a local Admin on the Adroit Edge Gateway machine).\nIn the case where remote access to existing Agent Servers is required, this account must have user security\nrights to access the network and be able to authenticate on the SCADA network machines where the\nAdroit Agent Servers need to be accessed as Datasources.\n\n[Page 16]\nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx\nP a g e | 15\n5.2. Stand-Alone Mode - Configuring a Local Agent Server\nWhere a user is installing it as a stand-alone concentrator from a stand-alone PLC or a network of PLCs.\nIn this instance the user needs to run and configure the local Agent Server, configure PLC drivers along\nwith creating and scanning the Agents to the PLC's prior to being able to access the Tags required for the\nTo users that do not know anything about how Adroit Agent Servers work there is a lot more detailed\ninformation on the Adroit SCADA on the website. Remembering that the Adroit Edge Gateway is built on\nthe tried and tested Adroit SCADA but does not have the HMI interface.\nOnce your Agent (I/O) Server has started as a Service, you can now start configuring your local Agent\nServer as follows:\nDriver Configuration (refer to  )\no Add and configure a Device Driver\nAgent Configuration (refer to  )\no Create the Agents/Tags required.\no Scan these tags to the front-end device (PLC)\n\n[Page 17]\nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx\nP a g e | 16\n5.2.1. Driver Configuration\nFrom the Agent Server Configuration menu on the left select \"Driver Configuration\". If the driver\nyou wish to use is NOT in the list then just click on \"Install New Driver\" item and select the\ndriver from the list presented and follow the installation process.\nOnce the Driver is installed you need to create a Device instance that uses the selected driver.\nThis is done by highlighting the Driver in the list and clicking on \"Add\" button. This will allow\nyou to name the Device and to configure the Device communications parameters.\nFigure 15 Adding a Device/PLC Driver\nThe image below shows a Device named MITS_PLC_BATCHING that is using the Mitsubishi Ethernet Driver\nalong with its specific configuration. You will see the relevant IP settings, Timeouts etc. set for the Device.\nWith most drivers you can test the communications to ensure that the Device has been set up correctly.\nFigure 16 Configuring a Device\n\n[Page 18]\nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx\nP a g e | 17\n5.2.2. Agent Configuration\nFrom the Application Launcher, open the Agent (I/O) Server tab and launch the Agent Configurator.\nThe Agent Server Configurator is the application that is used to configure Agents which are then the\nDataelements you will want to publish via the Adroit Edge Gateway to the Cloud (or expose using OPCUA).\nFigure 17 Agent Server Configuration Window\nData from the field is represented in Agents (add an Agent that suits the data or functionality required) -\nthe standard Basic Agents are as follows:\nAgent\nDescription\nstores a floating-point engineering value, and associated scaling parameters.\nCounter\nDriven by a Digital Agent and delivers value-add data on a Digital Agent (i.e., on count, off count etc.). This is\nan Internal Agent.\nDigital\nstores a digital (ON/OFF) value and their text representations\nExpression\nExpression - allows for the configuration and execution of user-defined mathematical and logical expressions.\nMarshal\n\"marshals\" an integer input value into 16 discrete digital values\nString\nstores an 80-character ASCII string (79 chars max. with zero terminator)\nStringList\nstores any number of variable ASCII strings.\nTimer\nperforms several commonly used timing operations.\n\n[Page 19]\nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx\nP a g e | 18\nThere are many Agents available to the user to do pre-processing in the Agent Server and just use the\ndata necessary in the Cloud.\nNOTE: Refer to the Adroit Technical Description Document available on the website for a better\ndescription and understanding of the Adroit Agent concept and functionality. For many users it requires\nan understanding of the Adroit Agent terminology. A TAG in the Adroit world is the Agent.Slot and\nevery Tag can be used in the Adroit Edge Gateway solution.\nThe images below shows an Analog Agent named MIXING_MOTOR_CURRENT and by double-clicking on\nthe Agent you have added, it is possible to configure the particulars of the Agent such as Scaling, Units,\nAlarm Levels and Deadbands etc.\nFigure 18 Adding and Setting up an Analogue Agent\nThe next step would be to Scan the Slot (typically the Agent.RawValue) to the PLC address in the selected\nPLC. This is done by selecting the Agent in the list, clicking on the \"Scan\" button and following the next\nfew steps.\nSelect the PLC Device from the Device listbox.\nClick on \"Started\" Radio Button (this allows you to stop and start a driver, however this only\nneeds to be done once and applies to all Agents scanned to that Device.)\nSelect the Agent Slot you wish to scan to.\nAdd the PLC address.\nSelect the Scan Rate you wish to use.\nClick on the Scan button, this will add to the scan list below and will automatically begin\ncommunications to the PLC.\n\n[Page 32]\nATQMS-MKTG-DOC- Adroit Edge Gateway Quick Start Guide.docx\nP a g e | 31\n11. Appendix A - Glossary of Terms\nOT\n\"Operational Technology\". Referring to the hardware and software used to\nmonitor and control physical devices. This often refers to the hardware on which\nSCADA and associated software operates.\nDMZ\n\"Demilitarized Zone\". A sub-network or network zone separated by firewalls\nand/or switches in order to create a form of buffer zone between OT machines\nand outside networks or the internet.\nMicroservice\nRefers to services responsible for specific functional roles within the Edge\nGateway. These services typically represent specific types of Publishers (Adroit\nCloud or OPC UA for example)\nEndpoint\nAn Endpoint is essentially an address representing a specific service or API for\ningesting and processing data. A single cloud service may expose multiple\nEndpoints representing logical grouping of incoming data and different potential\nprocessing streams within the cloud service.\nDatasource\nThis represents a source of data. Most commonly in the Edge Gateway this will\nrepresent a connection to a specific Adroit Agent Server. The Datasource then\nexposes individual Dataelements that can then be consumes by Microservices\nand their Publishers.\nDataelement\nA single point of data, typically representing a specific Slot within an Agent\n(when referring to data from an Adroit Datasource) but can also represent\ncomplex data types such as lists and tables from various Datasources\nAgent\nAn Agent is the fundamental object type defined within the Agent Server. It\nrepresents a logical container that exposes one or more slots.\nIn most cases the Agent is responsible for ingestion of raw data from devices\nand then applying intermediate manipulation thereof in order to make said data\navailable to other consumers in different forms (scaling of raw data in an Analog\nfor example).\nSlot\nA Slot typically represents a single value as exposed by a given Agent (the value\nSlot of an Analog agent which represents the scaled raw value as read from a\nphysical device)\nTag\nThis refers to the minimum uniquely addressable form when consuming data\nfrom an Agent Server, i.e. \"Agent.Slot\". This term is commonly used simply to\nrefer to a specific value from an Agent Server.\nStand-Alone Mode\nA self-contained, independent installation of the Edge Gateway that includes a\nlocal Agent Server thus providing a complete solution from physical device to\nendpoint (whether cloud based or OPC UA).\nGateway Mode\nSimilar to Stand-Alone with the primary difference being the absence of a local\nAgent Server. This variant connects to external Agent Servers and augments\ntheir existing functionality by publishing data through various Microservices."}, {"title": "ATQMS-MKTG-DOC-Adroit-Report-Suite-Quick-Start-Guide", "href": "manual_chapters/ATQMS-MKTG-DOC-Adroit-Report-Suite-Quick-Start-Guide/index.html", "category": "Product Manuals", "rel": "manual_chapters/ATQMS-MKTG-DOC-Adroit-Report-Suite-Quick-Start-Guide/index.html", "kind": "Manual", "text": "___________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - Quick Start Guide \n \n \n \n \n \n \n \nP a g e | 1 \nCOPYRIGHT \n \nCopyright © 2020 Advanced Worx 112 (Pty) Ltd. All rights reserved. \nInformation in this document is subject to change without notice. The software described in this document is furnished under \na license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of \nthose agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or \nany means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal \nuse without the written permission of Advanced Worx 112 (Pty) Ltd. \nAdvanced Worx 112 (Pty) Ltd \n20 Waterford Office Park \n189 Witkoppen Road (c/o Waterford Drive) \nFourways \nSouth Africa \n \nwww.adroittech.co.za \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nVersion \nDate \nAuthor \nComment \nApproval \n1.0 \n27.08.2020 \nJ. Duncan \nOriginal \nD. Wibberley \n2.0 \n28.08.2020 \nJ. Duncan \nFinalise\n\n_____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - Quick Start Guide \n \n \n \n \n \n \n \nP a g e | 2 \nThank you for choosing Adroit Report Suite, \nyour first step to getting more value from \nyour SCADA. . .\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - Quick Start Guide \n \n \n \n \n \n \n \nP a g e | 3\n\n[Page 2]\nATQMS-MKTG-DOC-Adroit Report Suite - Quick Start Guide\nP a g e | 1\na license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of\nany means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser's personal\nuse without the written permission of Advanced Worx 112 (Pty) Ltd.\nAdvanced Worx 112 (Pty) Ltd\n20 Waterford Office Park\n189 Witkoppen Road (c/o Waterford Drive)\nFourways\nSouth Africa\nwww.adroittech.co.za\nVersion\nDate\n\n[Page 3]\nATQMS-MKTG-DOC-Adroit Report Suite - Quick Start Guide\nP a g e | 2\nThank you for choosing Adroit Report Suite,\nyour first step to getting more value from\nyour SCADA. . .\n\n[Page 4]\nATQMS-MKTG-DOC-Adroit Report Suite - Quick Start Guide\nP a g e | 3"}, {"title": "ATQMS-MKTG-DOC-Adroit-Report-Suite-User-Manual", "href": "manual_chapters/ATQMS-MKTG-DOC-Adroit-Report-Suite-User-Manual/index.html", "category": "Product Manuals", "rel": "manual_chapters/ATQMS-MKTG-DOC-Adroit-Report-Suite-User-Manual/index.html", "kind": "Manual", "text": "____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - User Manual \n \n \n \n \n \n \n \nP a g e | 1 \nCOPYRIGHT \n \nCopyright © 2020 Advanced Worx 112 (Pty) Ltd. All rights reserved. \nInformation in this document is subject to change without notice. The software described in this document is furnished under \na license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of \nthose agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or \nany means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal \nuse without the written permission of Advanced Worx 112 (Pty) Ltd. \nAdvanced Worx 112 (Pty) Ltd \n20 Waterford Office Park \n189 Witkoppen Road (c/o Waterford Drive) \nFourways \nSouth Africa \n \nwww.adroittech.co.za \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nVersion \nDate \nAuthor \nComment \nApproval \n1.0 \n18.12.2017 \nG Joyce \nOriginal \nD. Wibberley \n2.0 \n22.05.2020 \nJ. Duncan \nUpdate Cover and formatting \n \n3.0 \n28.08.2020 \nJ. Duncan \nFinalise\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-Adroit Report Suite - User Manual \n \n \n \n \n \n \n \nP a g e | 2 \nContents \n1. \nIntroduction .................................................................................................................................... 3 \n1.1. \nAdroit Technologies .................................................................................................................. 3 \n1.2. \nAdroit SCADA ........................................................................................................................... 3 \n2. \nReport Suite Features ...................................................................................................................... 4 \n3. \nAdroit Report Suite Components...................................................................................................... 5 \n3.1. \nDatabase Platform .................................................................................................................... 5 \n3.2. \nReport User Interface is Internet Explorer..................................................................................... 5 \n3.3. \nReport Packs ........................................................................................................................... 5 \n3.4. \nAdroit Report Deployment Utility ................................................................................................. 5 \n3.5. \nData Sources ........................................................................................................................... 5 \n4. \nThe Technology Platform ................................................................................................................. 6 \n5. \nReport Deployment Utility ............................................................................................................... 7 \n6. \nGetting Started ................................................................................................................................ 8 \n6.1. \nInstall SQL Server 2008 R2 Reporting Services .............................................................................. 8 \n6.2. \nInstall the Adroit Report Deployment Utility .................................................................................. 8
