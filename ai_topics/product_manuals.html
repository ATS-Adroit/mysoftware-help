ingle Actuating Valve \nVALVE_S_A_v1_0 \nAdvanced \nThe Single Actuating Valve MAPS template is designed to \ncontrol a valve that has one solenoid and two limit \nswitches. \nVALVE_S_S_v1_0 \nStandard \nVALVE_S_B_v1_0 \nBasic\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 70 \n13. Appendix C – Additional Resources \n• \nTechnical description documents available on the MAPS DVD \n• \nContext sensitive online support forum. \n• \nOnline Quick Start videos \n• \nHelp desk \nNote: The more advanced the template the greater the number of signals (scanned tags) required to represent \nthis item of equipment. This can increase the size (and cost) of your required MAPS license - so assign these \ntemplates to your equipment carefully.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx \n \n \n \n \n \n \n \nP a g e | 71 \n14. MAPS Product Suite Documentation \nThe following related documentation is also available on the Adroit website:- \n \nhttps://www.mapsscada.com/downloadsacc/\n\n[Page 5]\nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx\nP a g e | 4\n1. Introduction\nThe MAPS Quick Start Guide document is designed to help the new user install, configure and get an\nunderstand of the various MAPS sub-systems. In addition to assist a new user in understanding the MAPS\napproach to SCADA/HMI project development and concepts surrounding the MAPS product.\n1.1.\nGeneral Overview\nIn order to understand MAPS it is important to understand the basic architecture of the product.\nBelow is a diagram, which represents the basic standalone architecture.\nFigure 1: Basic Stand Alone Architecture\nFront end device (FED): The front-end device is a general term used for a PLC; OPC server;\nRTU; a controller; or any software package that allows third party communication (i.e. OPC,\nSIMATIC NET).\nProtocol driver: MAPS supports +- 100 different protocols. Once a new driver has been installed\nand configured to talk to a FED, it is called a Device. A single protocol can support multiple\nDevices. An example of this is the user can have multiple FEDs which use the same protocol\n(i.e. MODBUS Ethernet), each FED will have its own IP address/Address. A device will need to\nbe created for each FED.\nAgent Server (AS): The Agent Server (I/O Server), is the real-time database, which handles the\nreal-time values and if configured, will handle all post-processing, logging and/or alarming the\ndata.\nSmartUI Server (SUIS): The SUIS is a middleware server which exposes data from a number of\ndisparate sources, using the datasource, and also acts as a repository for the graphic forms or\nmimics. It also acts as the manager of access, and broker for the unified data model\nimplemented across all data types that may end up in the\nDatasource: Each source of data (i.e. MAPS Agent Server) requires a datasource plugin before it\ncan be associated with the SmartUI Server. This provides the ability to expose its data as data\nelements. An example of a data element is Adroit.Analog.SAMPLEANALOGUE.value. The\nSmartUI Server connects to data using two different types of datasources:\nThe SmartUI Server allows multiple sources of data to be available to the configuration of a\nsystem in a unifed manner. It basically coverts all datatypes into universally usable elements\n(dataelements).\n\n[Page 7]\nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx\nP a g e | 6\n2. Initial Setup of MAPS\n2.1.\nHardware & Software Requirements\n2.1.1.\nRecommended Hardware & Software\nPlease refer to the Hardware & Software Specification document available from our website.\nhttps://adroittech.co.za/downloads-tree-view/\n2.1.2.\nSoftware download\nDownload the software, available from our website.\nhttps://www.mapsscada.com/downloadsacc/\n2.1.3.\nAdditional Software\nAdditional software that will expand the functionality of MAPS:\nInternet information services (IIS): Required for web service and distribution service.\nSQL with advanced reporting services: used for historical data logging and reporting. MAPS\nships with the free SQL Express that can be used for these purposes.\n2.2.\nLicensing\nTypically, the Agent Server is licensed via a HASP software protection hardware key, which is inserted into\nthe USB port of the computer on which the Agent Server is running. This HASP is then programmed in\naccordance with your specific license agreement.\nIn situations where it is not possible to use a physical HASP, it is also possible to license MAPS via a\nsoftware license, which is only available on request. For further details, contact your MAPS representative\nfor details.\n2.2.1.\nScan points: When a memory address is scanned/attached in the PLC and for every DBAccess\nAgent; Script Agent; and SNMP Agent a Scan Point is consumed.\nVersion: HASPs are licensed against versions of MAPS.\nIMPORTANT: The former Remote Nodes licenses that applied to all types of clients have been DISCONTINUED. These\nhave now been replaced by the following client specific node licenses, each of which have different costs:\no Clients: typically Operators and/or Designers and\no Mobile/Web Clients: typically Performance Anywhere or Adroit Air clients.\nOEM: Additional components that are separately licensed are specified as separate textual\nentries in the product license e.g. MAPS Alarm Management enablement, MAPS Historian\nenablement; Max Demand Agent, OEE Agent; Siemens Ethernet driver; DNP 3.0 driver.\nA time limit is set on development HASPs. Production HASPs have no time limit.\n2.3.\nPrerequisites for installing MAPS software\n1. Ensure that the Windows operating system on which you intend to install MAPS has been\nand remains legally licensed and ACTIVATED, since MAPS is not supported when it is run on\nan unlicensed Windows operating system.\n2. Ensure that you are not using the built-in Administrator account to run MAPS, since UAC is\nautomatically disabled whenever this built-in Administrator account is used.\n\n[Page 12]\nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx\nP a g e | 11\n3. Give the new configuration a name. Then click the Ok button.\nFigure 10 - Create a new configuration\n4. Once the configuration has been created click the Ok button.\n3.2.\nCreating a Device\nSetup the OPC Client to the MAPS BatchOPC Server demo application. This application is part of the MAPS\ninstall.\n1. Open the Driver configuration in the MAPS Config Editor, under the Agent Server\nConfiguration.\nFigure 11 - Driver Configuration\n\n[Page 13]\nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx\nP a g e | 12\n2. Select the OPC Client Protocol driver, then click on the Add button.\n3. Enter the device name BAT_01\nFigure 12 - Device Name\n4. In the OPC client driver configuration select the MAPS Batch OPC Server in the OPC server\ndrop down box.\n5. Click Ok.\n6. Click Ok on the performance counter installation.\nFigure 13 - OPC client configuration\n\n[Page 25]\nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx\nP a g e | 24\n6.2.\nScanning\nScanning values simply means communicating using a predefined protocol from a memory address of a\nFED to a TAG.\n6.2.1.\nScanning a Tag\nTo scan the RawValue slot of the of BAT-01-MIX-01-TEM Analog Agent to the MAPS Batch OPC Server:\n1. Open the MAPS Configurator.\n2. Select the Analog Agent BAT-01-MIX-01-TEM.\n3. Click on the Scan button.\n4. In the scanning configuration, select the device BAT_01 in the Device dropdown box.\n5. The user will be prompted to create the device.\n6. Click the Yes button. The MAPS Batch OPC Server will automatically start.\nFigure 28 - Batch OPC Server\n7. Enter the OPC address ActualMixTemp into the address field and change the Scan rate to 0.\n8. Click on the Scan button to add the scan job to the device.\n\n[Page 64]\nATQMS-MKTG-DOC-MAPS4 - Quick Start Guide.docx\nP a g e | 63\n11. Appendix A - Configure the PLC\nThe GX Works2 software package will be used to configure the Mitsubishi PLC Q03UDE CPU.\nStart GX Works2 and create a new project. Select the QCPU series and the PLC type Q03UDE. Click\nthe Ok button.\nFigure 80 - GX Works2 New Project\nDouble click on the PLC parameters in the project navigation view.\nFigure 81 - Project navigation view.\nSelect the Built-in Ethernet Port Settings tab in the Parameter Setting. Enter the Required IP address.\nMake sure that the Communication data code is set to binary and the Enable online change is\nchecked."}, {"title": "Remote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router", "href": "manual_chapters/Remote_Service_Monitoring_using_Melsoft_GX_Works3_Robustel_Gateway_Router/index.html", "category": "Product Manuals", "rel": "manual_chapters/Remote_Service_Monitoring_using_Melsoft_GX_Works3_Robustel_Gateway_Router/index.html", "kind": "Manual", "text": "Remote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 1 \n \n \nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router \n \nPurpose \nThis document provides step-by-step instructions for engineers to remotely access, monitor, \nand service Mitsubishi PLC’s using GX Works3 via a Robustel VPN Router. \n \nIt assumes that: \n• \nThe Robustel Router has been correctly configured and registered on the RCMS Cloud \nPlatform. \n• \nThe router is part of the appropriate VPN Group. \n• \nThe network planning and configuration are already completed. \n• \nThe Router connect to the Internet and VPN service. \nNote: This guide does not cover router configuration or network planning. It focuses on \nestablishing a remote connection to the PLC and using GX Works3 for monitoring or program \noperations. \n \nTypical Network Layout \n \nPrerequisites \n1. The Robustel Router must be registered on the RCMS Cloud Platform and included in a \nVPN group. \n2. The RCMS Client must be enabled on the router. \n3. Verify that the router is connected to the Robustel VPN and the link is active. \n4. The remote engineer must be a verified VPN user in the Robustel RCMS Cloud Platform \n(https://rcms-cloud.robustel.net/) or request access from the platform administrator. \n5. Install the Robustel VPN Manager application on your PC. This can be downloaded \nfrom the RCMS Cloud Platform (RCMS Support Resources) or requested from the \nplatform administrator. \n6. Ensure the PC has a reliable internet connection, and your IT administrator allows \nconnections to the Robustel RCMS VPN if using an office network.\n\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 2\n\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 3 \n \n \n \nStep 1: Connect to the Robustel VPN \n1. Launch the Robustel VPN Manager on your PC. \n2. Log in using your VPN credentials. \n3. If you are part of multiple VPN groups, select the relevant VPN Group and click \nConnect. \n4. If a timeout warning appears, click Refresh — the connection may already be \nestablished successfully. \n5. Ping the PLC to test and ensure connectivity.\n\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 4\n\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 5\n\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 6 \n \n \n \n \nStep 2: Launch GX Works3 \n1. Open GX Works3 on your PC. \n2. Select New Project or Load an Existing Project.\n\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 7 \n \n \nStep 3: Configure PLC Connection \n1. From the menu, select Online → Current Connection Destination. \n2. Choose Other Connection Method. \n3. Select Ethernet Board. \n4. Double-click on the PLC Module: \no \nConfigure the PLC IP Address. \no \nSet the Response Wait Time. \no \nClick OK. \n5. Under Network Communication Route, select No Specification and Ethernet. \n6. Click Connection Test. \no \nIf successful, the PLC will respond with a message such as: \n“Successfully connected with the FX5UCPU”. \n7. Click OK to close the connection setup window.\n\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 8\n\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 9\n\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 10 \n \n \n \nStep 4: Read Parameters from PLC \n1. Go to Online → Read from PLC. \n2. Select Parameters to read and press Execute. \n3. Confirm by selecting Yes to All. \n4. GX Works3 will read the PLC program and parameters. \n5. Once complete, press OK to close the read window.\n\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 11\n\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 12 \n \n \n \n \n \n \nStep 5: Monitor or Modify PLC \n• \nYou can now monitor the PLC or perform tasks in GX Works3 as required. \n• \nImportant: Always create backups of the latest PLC program before making any \nchanges or uploads.\n\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 13 \n \nAdditional Notes \n• \nEnsure all operations comply with the site’s safety and access policies. \n• \nMaintain documentation of any changes performed during remote service.\n\n[Page 1]\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 1\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router\nPurpose\nThis document provides step-by-step instructions for engineers to remotely access, monitor,\nand service Mitsubishi PLC's using GX Works3 via a Robustel VPN Router.\nIt assumes that:\nThe Robustel Router has been correctly configured and registered on the RCMS Cloud\nPlatform.\nThe router is part of the appropriate VPN Group.\nThe network planning and configuration are already completed.\nThe Router connect to the Internet and VPN service.\nNote: This guide does not cover router configuration or network planning. It focuses on\nestablishing a remote connection to the PLC and using GX Works3 for monitoring or program\noperations.\nTypical Network Layout\nPrerequisites\n1. The Robustel Router must be registered on the RCMS Cloud Platform and included in a\nVPN group.\n2. The RCMS Client must be enabled on the router.\n3. Verify that the router is connected to the Robustel VPN and the link is active.\n4. The remote engineer must be a verified VPN user in the Robustel RCMS Cloud Platform\n(https://rcms-cloud.robustel.net/) or request access from the platform administrator.\n5. Install the Robustel VPN Manager application on your PC. This can be downloaded\nfrom the RCMS Cloud Platform (RCMS Support Resources) or requested from the\nplatform administrator.\n6. Ensure the PC has a reliable internet connection, and your IT administrator allows\nconnections to the Robustel RCMS VPN if using an office network.\n\n[Page 2]\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 2\n\n[Page 3]\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 3\nStep 1: Connect to the Robustel VPN\n1. Launch the Robustel VPN Manager on your PC.\n2. Log in using your VPN credentials.\n3. If you are part of multiple VPN groups, select the relevant VPN Group and click\nConnect.\n4. If a timeout warning appears, click Refresh - the connection may already be\nestablished successfully.\n5. Ping the PLC to test and ensure connectivity.\n\n[Page 4]\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 4\n\n[Page 7]\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 7\nStep 3: Configure PLC Connection\n1. From the menu, select Online → Current Connection Destination.\n2. Choose Other Connection Method.\n3. Select Ethernet Board.\n4. Double-click on the PLC Module:\no\nConfigure the PLC IP Address.\no\nSet the Response Wait Time.\no\nClick OK.\n5. Under Network Communication Route, select No Specification and Ethernet.\n6. Click Connection Test.\no\nIf successful, the PLC will respond with a message such as:\n\"Successfully connected with the FX5UCPU\".\n7. Click OK to close the connection setup window.\n\n[Page 10]\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 10\nStep 4: Read Parameters from PLC\n1. Go to Online → Read from PLC.\n2. Select Parameters to read and press Execute.\n3. Confirm by selecting Yes to All.\n4. GX Works3 will read the PLC program and parameters.\n5. Once complete, press OK to close the read window."}, {"title": "What is new in the Adroit 10 Release", "href": "manual_chapters/What_is_new_in_the_Adroit_10_Release/index.html", "category": "Product Manuals", "rel": "manual_chapters/What_is_new_in_the_Adroit_10_Release/index.html", "kind": "Manual", "text": "________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \n \nP a g e | 1 \nCOPYRIGHT \n \nCopyright © 2020 Advanced Worx 112 (Pty) Ltd. All rights reserved. \nInformation in this document is subject to change without notice. The software described in this document is furnished \nunder a license agreement or nondisclosure agreement. The software may be used or copied only in accordance with \nthe terms of those agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted \nin any form or any means electronic or mechanical, including photocopying and recording for any purpose other than \nthe purchaser’s personal use without the written permission of Advanced Worx 112 (Pty) Ltd. \nAdvanced Worx 112 (Pty) Ltd \n20 Waterford Office Park \n189 Witkoppen Road (c/o Waterford Drive) \nFourways \nSouth Africa \n \nwww.adroittech.co.za \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nVersion \nDate \nAuthor \nComment \nApproval \n1.0 \n09.03.2018 \nUnknown \nOriginal \nD. Wibberley \n2.0 \n22.05.2020 \nJ. Duncan \nUpdate Cover and formatting \n \n3.0 \n23.07.2020 \nJ. Munitich \nUpdate Content for 10.0.5.0 \n \n4.0 \n26.07.2020 \nJ. Duncan \nReformat \n \n5.0 \n27.08.2020 \nJ. Duncan \nFinalise\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \n \nP a g e | 2 \nContents \n1. \nWhat is new in the Adroit 10 Release ........................................................................................ 3 \n1.1. \nProduct Licensing Changes .................................................................................................3 \n1.1.1. \nImportant differences between a HASP and a Soft License:................................................................... 3 \n1.2. \nInstall...............................................................................................................................4 \n1.3. \nProduct Theme, Icons and Shortcuts ...................................................................................5 \n1.4. \nAdroit Agent Server ...........................................................................................................7 \n1.4.1. \nThe ICMP or PING Agent ................................................................................................................. 7 \n1.4.2. \nThe DumpConfig Agent ................................................................................................................... 7 \n1.4.3. \nThe DBQuery Agent ........................................................................................................................ 7 \n1.4.4. \nThe Accumulator Agent ................................................................................................................... 7 \n1.4.5. \nPrimitive Agents – Adroit Lite............................................................................................................ 7 \n1.4.6. \nThe Analog Agent ........................................................................................................................... 7 \n1.4.7. \nThe AlarmManagement Agent........................................................................................................... 8 \n1.4.8. \nThe Notify Agent ............................................................................................................................ 8 \n1.4.9. \nThe Custom Agents......................................................................................................................... 8 \n1.4.10. \nThe SNMPMgr Agent ................................................................................................................... 8 \n1.4.11. \nAgent Classification ..................................................................................................................... 8 \n1.4.12. \nScanning ................................................................................................................................... 9 \n1.4.13. \nThe Datalog Agent .................................................................................................................... 10 \n1.4.14. \nAdroit 10 Backup Files ............................................................................................................... 11 \n1.4.15. \nAgent Browser .......................................................................................................................... 11 \n1.4.16. \nAgent Server Monitor Utility ........................................................................................................ 12 \n1.4.17. \nThe Alarm and Event Routes ...................................................................................................... 12 \n1.4.18. \nThe IOT Agent ......................................................................................................................... 12 \n1.5. \nSmartUI Config Editor ...................................................................................................... 13 \n1.5.1. \nTheme ........................................................................................................................................ 13 \n1.5.2. \nIOT Agent Configuration ................................................................................................................ 13 \n1.5.3. \nBackup and Restore Enhancements ................................................................................................. 14 \n1.5.4. \nProduct Mode indication ................................................................................................................ 14 \n1.5.5. \nSmart Data Services Configuration .................................................................................................. 15 \n1.6. \nPerformance Anywhere .................................................................................................... 16 \n1.7. \nSmartUI Designer ............................................................................................................ 17 \n1.7.1. \nThe Object Model Datasource ......................................................................................................... 17 \n1.7.2. \nThe Context Window ..................................................................................................................... 18 \n1.7.3. \nFind and Replace .......................................................................................................................... 19 \n1.7.4. \nEnhanced Data Element Browser .................................................................................................... 20 \n1.7.5. \nGraphic Form Publishing ................................................................................................................ 21 \n1.7.6. \nWizards ....................................................................................................................................... 21 \n1.7.7. \nControls ...................................................................................................................................... 21 \n1.7.8. \nVectors ....................................................................................................................................... 22 \n1.7.9. \nBehaviours .................................................................................................................................. 24 \n1.7.10. \nScripting .................................................................................................................................. 24 \n1.8. \nSmartUI Operator ............................................................................................................ 25 \n1.9. \nOther Components: .......................................................................................................... 25 \n1.9.1. \nSCADA Components and Utilities and Samples: ............................................................................... 25 \n1.9.2. \nHMI SCADA Demo install .............................................................................................................. 27 \n1.9.3. \nReport Suite 1.3 .......................................................................................................................... 27\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 3 \n1. What is new in the Adroit 10 Release \n \nApart from various performance enhancements of the existing functionality, Adroit provides the \nfollowing additions: \n \n1.1. \nProduct Licensing Changes \nIMPORTANT: HASPs are NOT backwardly compatible with previous product versions due to a \nchange in the internal licensing structure of the HASPs. \n \nThe Adtech Licensing Utility allows you to get, view and/or update your Adroit product license. \n• \nThe product license is now a .XML document to make it easier to read and is displayed in \nthe License tab. \nIMPORTANT: The former Remote Nodes licenses that applied to all types of clients have been \nDISCONTINUED. These have now been replaced by the following client specific node licenses, \neach of which have different costs: \n• \nClients: typically Operators and/or Designers and \n• \nWeb Clients: typically Performance Anywhere clients. \n• \nRemote Desktop (RDP) clients can now get a free node connection to obtain engineering \naccess to the Agent Server, by adding and configuring the RDAdminName WG.INI registry \nstring value. \nNote: By default, this registry entry does not exist and therefore all Remote Desktop (RDP) clients \nare subject to node licensing. This registry value must be created and set to the required Windows \nusername to establish free connections for this user. \n \nThe OEM (separately-licensed) components are no longer specified by their associated OEM codes \nbut now included as separate textual entries in the product license, so that users can easily see \nexactly which components they are currently licensed for. \n \nTip: Only the OEM components that you are licensed for will appear. \n• \nAll product licenses have a GLOBAL expiry and can also support product-specific expiries, \nwhich can be used for product trials. \n• \n.V2C (Vendor to Customer) and .C2V (Customer to Vendor) files are now used to create \nand update product licenses instead of using .RUS files. \nA new licensing methodology has been added to support new product variants (Ignite and OPC/Edge \nGateway) where rather than using traditional scan point licensing the system will count the number \nof user defined agents. \nNote: Full and Lite / HMI products continue to use the traditional scan point methodology \n \n1.1.1. \nImportant differences between a HASP and a Soft License: \n• \nA HASP license is bound to a USB HASP, which has a specific serial number - this is \ntherefore portable and not restricted to a specific computer but has associated security \nrisks and needs to be insured at your own risk. \n• \nA Soft license is bound to a specific computer and therefore cannot be transferred\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 4 \n1.2. \nInstall \nAdroit 10 is designed to run on Windows 10 and Windows Server 2008 R2 onwards, it no longer \nsupports the Windows Vista nor Windows Server 2008 operating systems. \n \nAdroit 10 requires Microsoft .NET Framework 4.6.2. If this is not installed then the installation uses \nan offline installation that it provides to install this for you (so no further downloading is required). \n \nIMPORTANT: The install can no longer be installed if the name of the user running it is called \n\"Administrator\", since this COULD be the built-in Windows Administrator account, which is \nDISALLOWED because UAC is automatically disabled whenever this built-in Administrator account is \nused, which causes a myriad of problems to occur. \n \nWhen installing the Agent Server, the Component Configuration Settings dialog does not \nprovide the option of not installing the Agent Server and SmartUI Server as services. From version \n10.0.5.0 this is required as certain underlying functionality requires consistency so far as access \nrights and user context go. \n \n \n \nIt is mandatory to specify both a username and \npassword for the Agent Server Service, which should \nbe those of a user that has the rights / permissions to \naccess the network resources (printers, SQL Express, \nnetwork shares) that the Agent Server requires access \nto. Hence this dialog has been reorganized as follows: \n \n \n \n \nThe install installs/updates the latest INSTALLABLE drivers’ files, typically in the Drivers sub folder \nof the Adroit installation folder. When users want to install a new driver via the Config Editor this \nfolder is now selected by default. While the drivers that are automatically installed by the install, \nsuch as the OPC Client driver are automatically installed and/or updated. For all other drivers, we \ndo not touch the installed drivers and the onus is upon the user to update the necessary drivers. \nWhen the installed version is same as the version of the install, a message box is displayed to allow \nusers to select whether they want to reinstall the existing components or they can opt to install \nadditional components that have not been installed yet or exit the install (the default option). \n \nThe install now detects when the .NET Framework 4 install seems to install without any issue but \ndoes not update Microsoft .NET Runtime Execution Engine (mscoree.dll) and prevents the install \nfrom continuing in this instance and provides assistance to resolve this Microsoft issue that ONLY \naffects Windows 7 and Windows Server 2008 R2. \n \nAdded Performance Anywhere to the list of available installable components and added the \nPerformance Anywhere Server option to the list of available installation options, which also \ninstalls the required Web Server component: \nPerformance Anywhere needs to be installed on a Web Server - a computer that has IIS (Internet \nInformation Services) installed and ensures that the SmartUI Web Service is also installed.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 5 \n1.3. \nProduct Theme, Icons and Shortcuts \nThe SmartUI applications now support the following two themes that affect how these \napplications are displayed: \n \n \n \nUsers can select which theme they want to use, when installing the SmartUI Operator, Designer or \nServer for the first time (in other words this is not displayed when any of these components are \ninstalled subsequently), from the following installation dialog: \n \n \n \nTip: You change this theme at any time by opening the Adroit Config Editor and specifying the \nrequired option from the Theme list box at the bottom of this application. \n \nThe product icons have been revised and updated and standardized and are now classified using \ndifferent coloured vertical bars on their left hand side. Each colour representing the following \ncategories of function to make them easier to recognize and use:\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 6 \nThe Adroit Utilities has been added to provide a central location from which the installed utilities \ncan be launched, instead of installing a host of separate shortcuts for each individual utility. This \nshortcut is also installed on the Desktop. \n \n \n \nThis application also describes their supported command line options and by right clicking the utility \nyou can specify which command line options you want to use when launching the utility\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 7 \n1.4. \nAdroit Agent Server \n1.4.1. \nThe ICMP or PING Agent \nAdded the ICMP or PING agent uses the Internet Control Message Protocol to troubleshoot network \nproblems. \n \nBy continuously polling the specified remote IP address, this agent is therefore able to identify \npotential network problems as they occur by generating alarms when errors are obtained when \nattempting to contact the specified remote IP address and/or when the round trip time exceeds \nspecified High and High-high times. \n \n1.4.2. \nThe DumpConfig Agent \nAdded the DumpConfig agent, which simply stores the configuration of specific agents in an OLE DB \ndatabase. \n \nOne example for its use is when you need to report on agents in the context of their configuration \nat the time of the report, alternatively this could be used as an extensive method of auditing changes \nmade to specific agents. \n \n1.4.3. \nThe DBQuery Agent \nAdded the DBQuery agent type supporting a full range of advanced database interactions \nsuperseding that provided by the DBAccess agent \n \nThis agent type allows for advanced queries to be executed on an OLDB database connection for \nreading; inserting and manipulating tabular data \n \n1.4.4. \nThe Accumulator Agent \nThis agent performs 3 basic functions: \nIt retrieves an input value that normally accumulates over time and is always increasing in value. \nIt uses this value to calculate the difference, or its change in value, between successive events or \nover a specific time or interval. \nIt calculates the total for a period based on a predefined trigger or time interval. \n \n1.4.5. \nPrimitive Agents – Adroit Lite \nThe following primitive agent types have also been added to Lite / HMI mode: Real and Integer, \nhowever these agents (including Boolean) should ONLY be used where efficient use of memory is \nrequired. \nPLEASE NOTE: These legacy primitive agents do not support Alarming and other SCADA \nfunctionality, use Analog/Digital agents instead! \n \n1.4.6. \nThe Analog Agent \nThe Analog agent now provides support for up to 51 bit numbers, in that the new maximum range \nis 2,000,000,000,000,000 for unsigned numbers or -1,000,000,000,000,000 to \n1,000,000,000,000,000 for signed numbers. \nTo reduce the loss of accuracy in scaling caused by IEEE conversion issues, the Analog agent \nbypasses the scaling calculation, when the scaling is 1:1.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 8 \n1.4.7. \nThe AlarmManagement Agent \nThe AlarmManagement agent now provides the Integer kpiCalcRate slot that sets the maximum \nrate at which the KPIs should be calculated, in minutes, to improve the performance of this agent, \nwhich by default is set to 1. \n \nIf this slot is set to 0 then KPI calculations are NEVER executed on new or changed alarm occurrences \nand so also added the Boolean kpiCalcNow slot that pulses to allow users to perform a KPI \ncalculation at any time, especially when they have set the kpiCalcRate slot to 0. \n \n1.4.8. \nThe Notify Agent \nThe Notify agent now provides a valueEx VARSTRING slot that is now SMS’d or emailed to \nsubsystems that can handle long strings. It is also the slot that is saved to the WGP file. \n \n1.4.9. \nThe Custom Agents \nCustom agents created via the Custom Agent Designer that require scripting intelligence now \nprovides support for JavaScript (.jav file) or you can choose to use the existing VBScript (.vbs file). \n \n1.4.10. The SNMPMgr Agent \nThe enhanced SNMPMgr agent replaces the legacy SNMPManager agent \n• \nThis agent supports up to SNMP version 3 and allows an MIB file to be browsed in, in order \nto select which OID values you need to monitor and/or control and/or trap. \n• \nAny existing SNMPManager agent is converted to SNMPMgr agent when the Agent Server \nloads. \n• \nThis agent does not use .wgx files as now the OID configuration of your SNMPMgr agents \nare saved to the Agent database (.wgp) file directly. \n• \nVarious improvements have been made in the way the SNMPMgr agent handles reporting \nthe quality (the bad or good state) of the OID list linked tags. \n \n1.4.11. Agent Classification \nFor a new project, the available agent types are now classified into the following default groups to \nbetter facilitate the selection of the required agent when designing your system: \n \nPrimitive: \nThese agent types are primitive because they offer limited value and are limited in functionality \nwhen compared to the Basic agents, they are essentially single value containers. \nBoolean, Integer, Real, Text and Frame \n• \nIMPORTANT: These agent types CANNOT be alarmed, and their values are not scaled etc, so use the Basic agent types \ninstead to represent your process values. \nBasic: \nThese agent types form the basic building blocks of a system and are used for gathering, handling \nand processing data to and from the physical external world. \nAnalog, Counter, Date, Digital, Expression, Marshal, MultiState, String, StringList, Timer\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 9 \nAdvanced: \nThese agent types provide powerful SCADA and integration functionality that allow the Basic agents \nto be alarmed and logged to databases and provides various means of reporting and/or controlling \ntheir values. \nAgentGroup, Alarm, Alarm List, AlarmManagement, ARec, Command, DBAccess, DBLog, \nEventLogging, EventOutput, Multimedia, Notify, Recipe, Scheduler, Script, Shift, Statistical \n \nMIS/MES: \nThese are very specific and usually quite complex agent types used to do monitor, control and solve \nhigher level shop-floor and general industrial challenges. \nAccumulator, MaxDemand, OEE, PID \n \nIT/IOT: \nThese agent types facilitate the integration and management of SCADA and IT \nAudit, DumpConfig, ICMP, Perfmon, SNMPMgr \n \nSystem: \nThese agent types are used internally to perform certain SCADA and other specific functions. \nAlias, Beeper, DataLog, Device, Hasp, Proxy, Scan, SystemDataLog, SystemInformation \n• \nNote: Instances of these Agents are created automatically and cannot be added manually by the user. \nHence the Agent filter section of the Agent Configuration dialog provides checkboxes for these \ndefault agent groups which if checked, allows you to determine which agent types are displayed in the \nType list: \n \n \n1.4.12. Scanning \nSimplified the configuration of scanning related settings when scanning tags, hence the following \ncheckboxes appear in the Tag Scanning Configuration dialog:\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 10 \nAlso these settings are now being stored in the Agent Database (.wgp) file along with the other \nscanning related settings, such as the scan address, scan rate etc, as an IO flags setting, which is \ndisplays as an additional column in the Currently scanned tags list. \n \nFor this reason Adroit WGP files for 10 are NOT backward compatible with previous versions, which \nsaved these settings in the agent header slots. \n \nAdded support for the demand scanning of tags, which are only communicated when there are one \nor more subscriptions against them. For example a graphic form is open with the tag in it. Once the \ngraphic form closes, if this is the only subscription to this tag then communication of that tag will \ncease. \n \nNote: Demand scanning is only supported by drivers that have been written to support it. \n \n1.4.13. The Datalog Agent \n• \nThe logging to ADO (SQL) databases by the Datalog agent is disabled by default (the SQL... \nbutton of the Datasource field is hidden in the Edit Datalog agent dialog). This is to force users \nto use the DBLog agent instead, which logs data to SQL more efficiently. \n \n \n \nAlthough if the Agent Server loads a legacy WGP file that ALREADY contains an ADO datalogging \nconfiguration, then the SQL... button of the Datasource field will be visible in the Edit Datalog \nagent dialog. \n \nThe Datalog agent should therefore only be used for proprietary logging and the datalog period \n(Length...) should not exceed what is required for operational trending purposes. \n \nIn other words, should an operator only need to see 24 hours of trend data to properly monitor and \ncontrol his plant then the datalog period should only be set for 1 day. Historical data (i.e. data \noutside of the datalog period), if requested, will be retrieved from the backup files, if required. \n \nWhen the allocated size of the datalog (.LGD) file is filled, it wraps (starts again at the beginning). \nAt which time one or more datalog backup (.LGB) files are created to store this older (historical) \ndata. The datalogging sub-system automatically retrieves this historical data from these files, when \nthis data is required by trends (charts) or other requests for historical data.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 11 \n1.4.14. Adroit 10 Backup Files \nIn Adroit 10, the naming convention of these backup files have improved compared to Adroit 8.4 to \nsignificantly reduce the number of files that are created. \n \nWhen creating monthly datalog backup files in Adroit 8.4, a separate file was created for each day \nof the month that had data logged, since the file name also included the day that the data was \nlogged. For instance: \n• \nA data value with a timestamp of 2017-11-21 10:00:00 would go to a backup file called \n2017-11-21-m-11 \n• \nA data value with a timestamp of 2017-11-22 10:00:00 would go to a backup file called \n2017-11-22-m-11 \nIn Adroit 10, the name of the backup file only specifies the year and month so that now only one \nfile is created for the month. For instance: \n• \nA data value with a timestamp of 2017-11-21 10:00:00 would go to a backup file called \n2017-11 \n• \nA data value with a timestamp of 2017-11-22 10:00:00 would also go to a backup file \ncalled 2017-11 \n1.4.15. Agent Browser \nEnhanced the Agent Browser utility, as follows: \n \nThis dialog is now resizable and when the selected slot is a LIST slot then a browse (...) button is \ndisplayed to the right of the slot value, which when clicked displays the contents of this LIST slot in \na table with the required headings. \n \n \nDouble clicking an agent displays a dialog that allows you to view the real time status of an agent \nat a glance. \nBy default the Agent Browser displays a categorized view \nof the double-clicked agent, although you can check the \nSorted checkbox to display an alphabetical listing. \n \n \nYou can also click the Previous / Next buttons (or use \nthe PAGE UP / PAGE DOWN keys) to view other agents of \nthe selected agent type, in this manner. \n \nWhen launched in admin mode you can add or remove \nagents from it using the + or - buttons of the Agents list.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 12 \n1.4.16. Agent Server Monitor Utility \nAdded the Ping tab to the Agent Server Monitor utility, which can help you determine whether any \nof the currently connected clients have connection issues to the Agent Server. \n \n \n \n1.4.17. The Alarm and Event Routes \nThe alarm and event routes support lists of up to 256 characters instead of the legacy 80 characters. \n1.4.18. The IOT Agent \nThe IOT agent type has been officially incorporated for use with IOT type devices such as Sigfox \netc. The mechanism was revised to allow new IOT type agents to be created based on templates \nfrom the config editor. A number of templates are shipped with the base product but this will expand \nover time and can be customised based on each user's needs. Some of the IOT templates included \nare: \n• \nKamstrup’s MULTICAL® 21 smart water meter \n• \nLesira smart water meter \n• \nSimple leak detector \n• \nWi-i Tremoli fence intrusion detection \n• \nVisioPressure meter \n• \nVisioTamp tamper detection \n• \nVisioTrack tracking device \n• \nVisioUtil utility logging device \n• \nWavetrend water pressure meter\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 13 \n1.5. \nSmartUI Config Editor \n \n1.5.1. \nTheme \nYou can change the SmartUI application theme at any time by opening the Adroit Config Editor and \nspecifying the required option from the Theme list box at the bottom of this application: \n \n \n \n1.5.2. \nIOT Agent Configuration \nIOT Agent Configuration has been added to the config editor so that types (based on installed \ntemplates) can be added or removed as required. The idea is to not pollute the list of available agent \ntypes unnecessarily in a running Agent Server\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 14 \n1.5.3. \nBackup and Restore Enhancements \nThe backup and restore functionality has been revamped to allow for improved ease of use while \nstill allowing for greater customization if and when required. In most cases the simple backup \nmechanisms (Basic and Complete) do exactly what users would require from a backup however, the \nCustom option is available if needed. \n \n \n \nThe backup process now clearly indicated what files and / or settings are being taken care of while \nintelligent defaults with regards to deliberate exclusions minimise unnecessary files from being \nincluded thus bloating the backup files. \n \n1.5.4. \nProduct Mode indication \nThe current product mode is clearly indicated in the config editor and a newly added feature is that \nthe active mode of a configuration can be altered rather than having to create a new configuration. \nNote: This can only be done if the Full product is installed and the system is licensed for Full mode.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 15 \n1.5.5. \nSmart Data Services Configuration \nSmart Data Services configuration has been added to the config to allow the user to configure the \navailability and function of certain modules. \n \n \n \nThe following services are provided: \n• \nRemote Agent Server connectivity \n \n \nThis facilitates remote communication to the local Agent Server from a SmartUI Server \nlocated on another machine. \n \n• \nOPC UA Server \nProvides OPC UA Server functionality, exposing specific tags within the Agent Server via \nOPC UA \n \n• \nRemote Monitoring service \nThis allows remote diagnostic monitoring of servers through the Server Activity Monitor. \nI.e. A Server Activity Monitor on another machine can connect to this machine remotely \nand gather status information regarding the running Agent Server and / or SmartUI Server \n \n• \nRemote Application service. \nThis allows licensing to be controlled / applied remotely from another machine via the \nALU utility. Rather than having to engage the ALU on each Server, one can apply licensing \nupdates from a central location.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 16 \n1.6. \nPerformance Anywhere \nAdded Performance Anywhere to the list of installable components of the Adroit 10 install. \n \nPerformance Anywhere needs to be installed on a Web \nServer - a computer that has IIS (Internet Information \nServices) installed and ensures that the SmartUI Web \nService is also installed. \nOnce installed, by specifying the required URL provided by \nthe install, the Performance Anywhere dashboard can be \nopened on a mobile device and/or Internet browser and \nallows you to create numerous pages in which you place \nand configure widgets (controls) in Design mode so that \nyou can display and, in some cases, configure your Adroit \ndata in Run mode. \n \n \nThe Performance Anywhere shortcut that is installed to the Desktop, also contains the virtual \ndirectory name of the Web Service, to prevent login issues. \n \nWhen configuring a Gauge the Sub Values tab allows you to add additional values to the gauge, \nwhich you can identify using the selected Sub Value Indicator, of which the following are \nprovided: \n \nTo save configuration time, you can now clone \n(duplicate) existing pages (and all of their \nconfigured widgets and/or clone individual \nwidgets to duplicate their current configuration \nsettings. \n \nAnother way to save configuration time, is to \ncreate a single page that can display different \nsets of data, such as to represent different \nitems of the same equipment, without having \nto create a separate page for each item of \nequipment. \n \nFurthermore all the non-specific configuration or configuration that would normally be duplicated \nfor each item of equipment now only needs to be performed once, to ensure absolute consistency. \n \nPerformance Anywhere licensing change: \nYou can use a single instance (ONE Performance Anywhere client) free of charge without any \nchanges to your product license. \nIf you require more than 1 concurrent Performance Anywhere client then you need to add the \nnecessary number of Web Clients to your product license.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 17 \n1.7. \nSmartUI Designer \n \n1.7.1. \nThe Object Model Datasource \nAdded the Object Model datasource, which enables you to enhance your existing wizards, by adding \nSCADA configuration to them. \n \nWhat can the object model do for you? \nIt saves you SCADA engineering time by allowing you to reliably duplicate objects that can have all \nor most of their SCADA configuration pre-configured. \nThe objects that you can create will typically be items of equipment, like pumps or motors and can \nbe anything that you have already created a wizard to represent. \nWhen creating an object template or an object instance, you are able to add one or more attributes \nor searchable strings or identifiers to them that you can use to filter or group the objects that you \ndeploy in the Context View window. \n \nWhat does the object model NOT do for you? \nIt does not help you create the graphical representation of the object; it requires a working instance \nof a wizard to begin. \nIt does not help you create the SCADA configuration required by this object, it requires that all the \nnecessary agents already exist for the wizard instance that you have selected and that these agents \nhave already been configured. \n \nPractical example: \nConsider an industrial plant has a large number of similar pumps made by the same manufacturer, \neach of which had some characteristics that differed such as their power calibration. \n \nThe engineer would initially create a wizard that provides the graphical representation of this pump. \n \nThen the engineer would implement the wizard and create the necessary SCADA configuration for \nthis pump, such as its required scanning, logging and alarming. \n \nThe engineer would then test that this SCADA configuration was working correctly. \n \nThen the engineer would create a template from this working wizard, ensuring that the \ncharacteristics that differed between these pumps would be substitutable. \n \nUsing this template the engineer would then create multiple instances of the pump, changing each \nof their differing characteristics as needed. \n \nSo each instance of this pump would then have their scanning, logging and alarming pre-configured. \n \nThe Object Model also now supports configuring of data element security during the instance \ncreation process\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 18 \n1.7.2. \nThe Context Window \n \nThe Context View window, logically groups or organises the deployed objects according to their \ndefined attributes, so that they can be easily located and/or searched. In other words all the objects \nthat have the SAME attribute are added a separate group or 'context'. \n \nFurthermore this grouping is hierarchical so that the \nobjects are further classified or grouped according \nto their specified values of this attribute. This allows \nyou to see which objects have the same values \nand/or view all the values \n \n \n \n \nFor instance, if an attribute defined the power rating for equipment, then you could see all your \nequipment that had the same power rating OR if an attribute defined the manufacturer, you could \nsee how much of your equipment was made by each manufacturer. \n \nTherefore by defining common attributes for your deployed \nobjects, the Context View window can become a very useful \ntool in managing not just your deployed objects but your entire \nprocess. \nWhile these automatically generated contexts cannot be edited, \nyou can edit the Default context to create your own logical \norganisation of your objects and/or other data, by either: \n• \nmanually adding the necessary hierarchy of nodes \n• \nor if you have implemented Alarm Management, \nyou can import your existing hierarchy of categories \nas nodes , with or without the agents that are \nassociated with their configured incidents. \n \nNodes are like folders, each of which typically represent a specific contextual area and can contain \nadditional nodes or a graphic form associated to them or have data elements and/or object model \nobjects added to them. \n \nYou can also use the TemplateGOContextNav control to display the graphic forms associated \nwith the nodes and/or added to the nodes of this Default context. \n \nThe Default context lends itself to the creation of \nobject instances, especially those whose name and \nsubstitution(s) use a predefined naming convention \nthat specifies the context in which the instance is \ncreated.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 19 \nHowever, make best use of this feature you need to: \n• \ndefine the necessary hierarchy of Nodes, each of which typically represent specific \ncontextual areas and especially specify each Node descriptor, which is typically a 3 \ncharacter reference code for each contextual area. \n• \nif your object employs multiple substitutions to define its process variable names, then \nensure that these substitutions are specified in the template in the logical order of the \ndefined contextual areas. \n1.7.3. \nFind and Replace \nThe primary purpose of a graphic form is to display data elements (tags). Over the years a number \nof separate mechanisms have been created to make this process as easy as possible and/or to \nfacilitate their duplication to save on their engineering time. This means that: \n• \nlocating all the references of a tag on a graphic form is a non-trivial task and so this tool \nis essential and \n• \nnot all of these mechanisms allow the tag to be externally replaced by this tool, without \nbreaking the mechanisms themselves. \nTo work around this limitation, the following two utilities have been created which have different \ncapabilities or uses: \n• \nThe GLOBAL Find utility in the Project group of the Home tab of the SmartUI Designer \nribbon, enables you to select one or more graphic forms of one or more projects to find \nwhere text, typically a tag (agent name), has been referenced and used, you can then \nexport the list of located references to Excel. \nNote: This utility only appears when the Spider Configuration Mode section of View tab of the \nDesigner ribbon is set to Advanced, since it is intended for advanced users only.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 20 \nThis utility can save much time when redesigning large projects and when creating and maintaining \nmultiple SCADA systems in keeping track of your agents or other graphic form components. \n \nNote: You need to close all open graphic forms before you can use this tool and you cannot perform \nany other action in the Designer while this utility is open. \n \nThe LOCAL Find and Replace utility in the graphic form toolbar, searches for the specified text, \ntypically a tag (agent name), in the currently selected graphic form and unlike the other utility \nprovides: \n• \nan Edit column in the Find Results tab \nthat allows you to edit the indirect \nmechanisms so that you can change these \nreferences to the required replacement one \nat a time; \n• \nthe Replace tab to replace the direct \nreferences to the searched for text with the \nspecified replacement and \n• \na moveable dialog, so that you can carry on \nworking on other things or can find and \nreplace text in more than one currently \nopen graphic form. \n• \nThis utility also allows you to export the list \nof references to the searched for text to \nExcel, if needed. \n \n \n \n1.7.4. \nEnhanced Data Element Browser \n \nEnhanced the Data Element Browser dialog by \nproviding the ability to display the current value \nof the data elements you are currently or have \npreviously selected, by clicking the button in the \ntop right hand corner, which adds the Watches \ncolumn to the Recently selected elements list \n(when this is displayed) and the icon and current \nvalue to the right of the currently selected data \nelement at the bottom of this dialog.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 21 \n1.7.5. \nGraphic Form Publishing \nAdded the facility to publish run-time versions of graphic forms, typically once a graphic form has \nbeen designed and is working as required. \nThis process creates an optimized run-time version of the graphic form for the Operator as it strips \nout the design time information from the graphic form to reduce the size and complexity of the \ngraphic form that is sent to the Operator, which also improves its loading time. \nSimply click the Save and Publish graphic form toolbar button. \n \n1.7.6. \nWizards \nMade it easier to locate the wizards associated with wizard instances and/or edit the wizard instance, \nby providing a number of new right click menu options for wizard instances: \n \n \n1.7.7. \nControls \n \n• \nEnhanced the WebBrowser control to support the latest Web clients, which allows you to \ndisplay content that was previously not possible, such as hosting the Adroit Report Suite in the \nOperator. \n \n• \nIn addition to viewing the defined contexts in the Context View window in the Operator you can \nalso use the TemplateGOContextNav control to display all the graphic forms and/or object \ninstances that have been added to your defined contexts. \nTypically this control is used to view the Default context in the Operator, to display the graphic \nforms associated to the nodes of this context and/or any additional graphic forms added to the \nnodes too. \nThis provides the Context View window pane on the left and a TemplateGO pane on the right to \ndisplay graphic forms. \n \n• \nThe Alarm Viewer control’s item colour configuration has been redesigned to make the \nconfiguration of alarm entry colour as well as colouring based on priority simpler and more \neffective\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 22 \n \n \n \n \n• \nThe Trend Configurator control has been enhanced to allow greater configurability in its layout \n \n \n \n1.7.8. \nVectors \n \nMultiple Vector design enhancements: \n \n• \nVector editing through \"grab\" handles / nodes now toggles between normal resizing and \nenhanced, allowing node manipulation etc. Toggle is carried out by clicking on the vector again \nafter selecting it. The different modes are visually indicated through sqare or circular grab \nhandles as in other drawing packages\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 23 \n• \nMore intuitive sizing of vecotrs with text such as buttons so that the text size is preserved by \ndefault as it is in controls \n \n \n \n \n• \nAdded new vectors equivalent to certain controls: CheckBox; ComboBox and TextBox \n \n \n \n• \nAdded new Slider and Pipe vectors. The latter allowing the drawing of pipework on a graphic \nform \n \n \n \n• \nAllowed for the length of a line vector to be specified explicitly \n \n \n \n• \nEnhanced \"crosshair\" mechanism for alignment of vectors (Enabled by setting the \nShowCursorGuidlines property of the graphic form)\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 24 \n \n \n1.7.9. \nBehaviours \n• \nAdded the option to close the Operator from the Execute Command behaviour \n \n• \nAdded a new Database behaviour which allows for the configuration and execution of queries \non and OLE DB Datasource (usually SQL Server) \n \n \nThis is particularly useful for linking relevant controls / vectors to data returned from queries, for \nexample displaying the result in a datagridview control. \n \n• \nEnhanced the Execute Command behaviour when opening pop up graphic forms so as to \nallow the pop up to be displayed without a border and title bar. This allows for more modern \nUI design in navigation. \n \n1.7.10. Scripting \nAdded script engine support for Visual Studio 2017 and 2019\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 25 \n1.8. \nSmartUI Operator \n \nProvides the Context View window to display all the graphic forms and/or object instances that \nhave been added to your defined contexts, such as the graphic forms associated to the nodes of \nyour Default context. \n \n \n \nIn addition to searching for your objects, you can also right click them to view the defined attributes \nof each object instance and/or show the children (sub-components) of any item in your contexts. \n \n1.9. \nOther Components: \n1.9.1. \nSCADA Components and Utilities and Samples: \nThis was previously known as the Additional SCADA Components install. \nNote: Performance Anywhere is now installed as part of the main product install. \n \nAdded the following components: \n• \nRecipe Management - this installs a SmartUI project on a SmartUI Server, which allows \nusers to create recipes and then run them at scheduled times. \n• \nWanlink - links Agent Servers over a slow or Wide Area Network. \n• \nAgent Server ActiveX Control - an alternative to the Agent Server OLE interface \n(MISSRVR). \n• \nAdroit Classic Backup Utility - backs up the Classic Adroit system and data files and \nregistry settings. \nRemoved the following unnecessary and unused components: \n• \nSCADA DB Generator - to create WGP files from 3rd party sources - since the object \nmodel does this. \n• \nDependency Walker - to troubleshoot applications or DLLs - since this is a developer tool \nnot a user tool. \nEnhanced the SCADA Excel AddIn \n• \nThe Scanning sheet now displays the new IO flags column. \n• \nThe Excel Configuration Template now automatically jumps to first agent listed in the \nSelected Types. \n• \nWhen the Excel Addin Configurator is closed an automatic save is now performed to \nensure that the selected agent types and slots are saved. \n• \nYou can now view the historical data of a logged tag (agent.slot), which is configured via \nthe Historical Data tool from the Project group:\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 26 \n \n \n• \nThe Historical Page now informs the user of invalid inputs and fixed the issues around \nits Date Time Picker dialog. \n• \nThe Configuration Templates dialog now provides an Include Header Slot checkbox \nso that these can also be displayed and selected when needed. \n \n \n \nNew Tools \nAdded the following two new tools that to the Import Variables group: Create Agents and Add \nto SCAN Sheet to simplify the process of adding variables from a GX Works2 project into the Agent \nServer, as follows: \n• \nClick the Create Agents to create the applicable agents using the selected variable \nnames. \n• \nClick the Add to SCAN Sheet to scan these new agents. \n• \nSpecify the MAPS Driver Device to which these agents need to be scanned. \n• \nClick the Scan button. \nHowever, you can still use the previous method that uses the Add to Agents Sheet tool to first \nadd variables to the various agents’ sheets, for instance when you need to modify the various fields \nand agent settings before creating the agents and scanning, logging and alarming them.\n\n____________________________________________________________________________________________________________________________ \nATQMS-MKTG-DOC-What is new in the Adroit 10 Release \n \n \n \n \n \n \nP a g e | 27 \n1.9.2. \nHMI SCADA Demo install \nUpdated the look and feel of the demo and included the new Adroit 10 features. \n \n \n \n1.9.3. \nReport Suite 1.3 \nProvides a new look and feel for easier navigation: \n \n \n \nEnhanced the free SCADA Report Pack, by adding an Agent Configuration Export report for your \nDumpConfig and DBLog agents and added 21 CFR Part 11-specific Audit Activity and Authorization \nDetail reports. \n \nAdded the OEE Report Pack, which provides four reports that analyse and provide management \ninformation about your configured OEE agents and their KPIs. \n \nImproved the Alarm Management Report Pack, by adding the Interrupt Reasons and Interrupt \nDetails reports.\n\n[Page 4]\nATQMS-MKTG-DOC-What is new in the Adroit 10 Release\nP a g e | 3\n1. What is new in the Adroit 10 Release\nApart from various performance enhancements of the existing functionality, Adroit provides the\nfollowing additions:\n1.1.\nProduct Licensing Changes\nIMPORTANT: HASPs are NOT backwardly compatible with previous product versions due to a\nchange in the internal licensing structure of the HASPs.\nThe Adtech Licensing Utility allows you to get, view and/or update your Adroit product license.\nThe product license is now a .XML document to make it easier to read and is displayed in\nthe License tab.\nIMPORTANT: The former Remote Nodes licenses that applied to all types of clients have been\nDISCONTINUED. These have now been replaced by the following client specific node licenses,\neach of which have different costs:\nClients: typically Operators and/or Designers and\nWeb Clients: typically Performance Anywhere clients.\nRemote Desktop (RDP) clients can now get a free node connection to obtain engineering\naccess to the Agent Server, by adding and configuring the RDAdminName WG.INI registry\nstring value.\nNote: By default, this registry entry does not exist and therefore all Remote Desktop (RDP) clients\nare subject to node licensing. This registry value must be created and set to the required Windows\nusername to establish free connections for this user.\nThe OEM (separately-licensed) components are no longer specified by their associated OEM codes\nbut now included as separate textual entries in the product license, so that users can easily see\nexactly which components they are currently licensed for.\nTip: Only the OEM components that you are licensed for will appear.\nAll product licenses have a GLOBAL expiry and can also support product-specific expiries,\nwhich can be used for product trials.\n.V2C (Vendor to Customer) and .C2V (Customer to Vendor) files are now used to create\nand update product licenses instead of using .RUS files.\nA new licensing methodology has been added to support new product variants (Ignite and OPC/Edge\nGateway) where rather than using traditional scan point licensing the system will count the number\nof user defined agents.\nNote: Full and Lite / HMI products continue to use the traditional scan point methodology\n1.1.1.\nImportant differences between a HASP and a Soft License:\nA HASP license is bound to a USB HASP, which has a specific serial number - this is\ntherefore portable and not restricted to a specific computer but has associated security\nrisks and needs to be insured at your own risk.\nA Soft license is bound to a specific computer and therefore cannot be transferred\n\n[Page 5]\nATQMS-MKTG-DOC-What is new in the Adroit 10 Release\nP a g e | 4\n1.2.\nInstall\nAdroit 10 is designed to run on Windows 10 and Windows Server 2008 R2 onwards, it no longer\nsupports the Windows Vista nor Windows Server 2008 operating systems.\nAdroit 10 requires Microsoft .NET Framework 4.6.2. If this is not installed then the installation uses\nan offline installation that it provides to install this for you (so no further downloading is required).\nIMPORTANT: The install can no longer be installed if the name of the user running it is called\n\"Administrator\", since this COULD be the built-in Windows Administrator account, which is\nDISALLOWED because UAC is automatically disabled whenever this built-in Administrator account is\nused, which causes a myriad of problems to occur.\nWhen installing the Agent Server, the Component Configuration Settings dialog does not\nprovide the option of not installing the Agent Server and SmartUI Server as services. From version\n10.0.5.0 this is required as certain underlying functionality requires consistency so far as access\nrights and user context go.\nIt is mandatory to specify both a username and\npassword for the Agent Server Service, which should\nbe those of a user that has the rights / permissions to\naccess the network resources (printers, SQL Express,\nnetwork shares) that the Agent Server requires access\nto. Hence this dialog has been reorganized as follows:\nThe install installs/updates the latest INSTALLABLE drivers' files, typically in the Drivers sub folder\nof the Adroit installation folder. When users want to install a new driver via the Config Editor this\nfolder is now selected by default. While the drivers that are automatically installed by the install,\nsuch as the OPC Client driver are automatically installed and/or updated. For all other drivers, we\ndo not touch the installed drivers and the onus is upon the user to update the necessary drivers.\nWhen the installed version is same as the version of the install, a message box is displayed to allow\nusers to select whether they want to reinstall the existing components or they can opt to install\nadditional components that have not been installed yet or exit the install (the default option).\nThe install now detects when the .NET Framework 4 install seems to install without any issue but\ndoes not update Microsoft .NET Runtime Execution Engine (mscoree.dll) and prevents the install\nfrom continuing in this instance and provides assistance to resolve this Microsoft issue that ONLY\naffects Windows 7 and Windows Server 2008 R2.\nAdded Performance Anywhere to the list of available installable components and added the\nPerformance Anywhere Server option to the list of available installation options, which also\ninstalls the required Web Server component:\nPerformance Anywhere needs to be installed on a Web Server - a computer that has IIS (Internet\nInformation Services) installed and ensures that the SmartUI Web Service is also installed.\n\n[Page 8]\nATQMS-MKTG-DOC-What is new in the Adroit 10 Release\nP a g e | 7\n1.4.\n1.4.1.\nThe ICMP or PING Agent\nAdded the ICMP or PING agent uses the Internet Control Message Protocol to troubleshoot network\nproblems.\nBy continuously polling the specified remote IP address, this agent is therefore able to identify\npotential network problems as they occur by generating alarms when errors are obtained when\nattempting to contact the specified remote IP address and/or when the round trip time exceeds\nspecified High and High-high times.\n1.4.2.\nThe DumpConfig Agent\nAdded the DumpConfig agent, which simply stores the configuration of specific agents in an OLE DB\ndatabase.\nOne example for its use is when you need to report on agents in the context of their configuration\nat the time of the report, alternatively this could be used as an extensive method of auditing changes\nmade to specific agents.\n1.4.3.\nThe DBQuery Agent\nAdded the DBQuery agent type supporting a full range of advanced database interactions\nsuperseding that provided by the DBAccess agent\nThis agent type allows for advanced queries to be executed on an OLDB database connection for\nreading; inserting and manipulating tabular data\n1.4.4.\nThe Accumulator Agent\nThis agent performs 3 basic functions:\nIt retrieves an input value that normally accumulates over time and is always increasing in value.\nIt uses this value to calculate the difference, or its change in value, between successive events or\nover a specific time or interval.\nIt calculates the total for a period based on a predefined trigger or time interval.\n1.4.5.\nThe following primitive agent types have also been added to Lite / HMI mode: Real and Integer,\nhowever these agents (including Boolean) should ONLY be used where efficient use of memory is\nrequired.\nPLEASE NOTE: These legacy primitive agents do not support Alarming and other SCADA\nfunctionality, use Analog/Digital agents instead!\n1.4.6.\nThe Analog Agent\nThe Analog agent now provides support for up to 51 bit numbers, in that the new maximum range\nis 2,000,000,000,000,000 for unsigned numbers or -1,000,000,000,000,000 to\n1,000,000,000,000,000 for signed numbers.\nTo reduce the loss of accuracy in scaling caused by IEEE conversion issues, the Analog agent\nbypasses the scaling calculation, when the scaling is 1:1.\n\n[Page 11]\nATQMS-MKTG-DOC-What is new in the Adroit 10 Release\nP a g e | 10\nAlso these settings are now being stored in the Agent Database (.wgp) file along with the other\nscanning related settings, such as the scan address, scan rate etc, as an IO flags setting, which is\ndisplays as an additional column in the Currently scanned tags list.\nFor this reason Adroit WGP files for 10 are NOT backward compatible with previous versions, which\nAdded support for the demand scanning of tags, which are only communicated when there are one\nor more subscriptions against them. For example a graphic form is open with the tag in it. Once the\ngraphic form closes, if this is the only subscription to this tag then communication of that tag will\ncease.\nNote: Demand scanning is only supported by drivers that have been written to support it.\n1.4.13. The Datalog Agent\nThe logging to ADO (SQL) databases by the Datalog agent is disabled by default (the SQL...\nbutton of the Datasource field is hidden in the Edit Datalog agent dialog). This is to force users\nto use the DBLog agent instead, which logs data to SQL more efficiently.\nAlthough if the Agent Server loads a legacy WGP file that ALREADY contains an ADO datalogging\nconfiguration, then the SQL... button of the Datasource field will be visible in the Edit Datalog\nagent dialog.\n(Length...) should not exceed what is required for operational trending purposes.\nIn other words, should an operator only need to see 24 hours of trend data to properly monitor and\ncontrol his plant then the datalog period should only be set for 1 day. Historical data (i.e. data\noutside of the datalog period), if requested, will be retrieved from the backup files, if required.\nWhen the allocated size of the datalog (.LGD) file is filled, it wraps (starts again at the beginning).\nAt which time one or more datalog backup (.LGB) files are created to store this older (historical)\ndata. The datalogging sub-system automatically retrieves this historical data from these files, when\nthis data is required by trends (charts) or other requests for historical data.\n\n[Page 16]\nATQMS-MKTG-DOC-What is new in the Adroit 10 Release\nP a g e | 15\n1.5.5.\nSmart Data Services Configuration\nSmart Data Services configuration has been added to the config to allow the user to configure the\navailability and function of certain modules.\nThe following services are provided:\nRemote Agent Server connectivity\nThis facilitates remote communication to the local Agent Server from a SmartUI Server\nlocated on another machine.\nOPC UA Server\nProvides OPC UA Server functionality, exposing specific tags within the Agent Server via\nOPC UA\nRemote Monitoring service\nThis allows remote diagnostic monitoring of servers through the Server Activity Monitor.\nI.e. A Server Activity Monitor on another machine can connect to this machine remotely\nand gather status information regarding the running Agent Server and / or SmartUI Server\nRemote Application service.\nThis allows licensing to be controlled / applied remotely from another machine via the\nALU utility. Rather than having to engage the ALU on each Server, one can apply licensing\nupdates from a central location.\n\n[Page 17]\nATQMS-MKTG-DOC-What is new in the Adroit 10 Release\nP a g e | 16\n1.6.\nPerformance Anywhere\nAdded Performance Anywhere to the list of installable components of the Adroit 10 install.\nPerformance Anywhere needs to be installed on a Web\nServer - a computer that has IIS (Internet Information\nServices) installed and ensures that the SmartUI Web\nService is also installed.\nOnce installed, by specifying the required URL provided by\nthe install, the Performance Anywhere dashboard can be\nopened on a mobile device and/or Internet browser and\nallows you to create numerous pages in which you place\nand configure widgets (controls) in Design mode so that\nyou can display and, in some cases, configure your Adroit\ndata in Run mode.\nThe Performance Anywhere shortcut that is installed to the Desktop, also contains the virtual\ndirectory name of the Web Service, to prevent login issues.\nWhen configuring"}];
const host = document.getElementById("cards");
ITEMS.forEach(function(it) {
  const card = document.createElement("div");
  card.className = "card";
  const text = it.text ? `<div class="small">${esc(it.text).slice(0, 260)}${it.text.length > 260 ? "..." : ""}</div>` : "";
  const kind = it.kind ? `<span class="pill">${esc(it.kind)}</span>` : "";
  card.innerHTML = `<h3><a href="${it.href}">${esc(it.title)}</a></h3><div class="small">${esc(it.category || "")}</div>${kind}${text}`;
  host.appendChild(card);
});
</script>
<script>
(function() {
  var storageKey = "help_theme";
  function preferredTheme() {
    try {
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    } catch (e) {
      return "light";
    }
  }
  function applyTheme(t) {
    if (t === "dark" || t === "light") {
      document.documentElement.setAttribute("data-theme", t);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }
  function getSaved() {
    try { return localStorage.getItem(storageKey) || ""; } catch (e) { return ""; }
  }
  function setSaved(t) {
    try { localStorage.setItem(storageKey, t); } catch (e) {}
  }
  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") || preferredTheme();
  }
  function updateLabels() {
    var cur = currentTheme();
    var label = (cur === "dark") ? "Light mode" : "Dark mode";
    document.querySelectorAll(".theme-toggle").forEach(function(btn) {
      btn.textContent = label;
    });
  }
  function toggleTheme() {
    var cur = currentTheme();
    var next = (cur === "dark") ? "light" : "dark";
    applyTheme(next);
    setSaved(next);
    updateLabels();
  }
  function bind() {
    document.querySelectorAll(".theme-toggle").forEach(function(btn) {
      btn.addEventListener("click", function() {
        toggleTheme();
      });
    });
    updateLabels();
  }
  var saved = getSaved();
  applyTheme(saved || preferredTheme());
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bind);
  } else {
    bind();
  }
})();
</script>
