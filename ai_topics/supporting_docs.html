aries, etc.)\nwhile reading and writing live process data.\nEvent-driven execution with trigger tags\nConfigure one or more trigger tags per agent. Each trigger can be individually enabled or\ndisabled and set to fire on any value change, rising edge (0→n), or falling edge (n→0).\nCustomer benefit: Run Python logic in direct response to process events - alarm\nconditions, setpoint changes, batch phase transitions, and more.\nFlexible execution modes\nScripts always launch on a dedicated thread. In synchronous mode, the agent waits for the\nPython process to finish before pulsing Complete. In asynchronous mode, the agent\nreturns immediately while the script continues in the background.\nCustomer benefit: Choose the right execution model for each use case - quick tag\ncalculations vs. long-running data exports or API calls.\nNew Python Script Editor\nThe new Python Script Editor improves productivity by making scripts easier to read, write,\nand maintain. Syntax highlighting helps users quickly identify code structure and potential\nerrors, while code folding simplifies navigation through large scripts.\nBy default, Adroit opens scripts in the new Python Script Editor. If you prefer, you can use\nyour own script editor by specifying the full path to its executable.\nCustomer benefit: Faster development, easier troubleshooting, and a more efficient\nscripting workflow.\nWho Benefits\nSCADA engineers and integrators\nImplement custom calculations, data\ntransformations, and integrations without\nC++, VB Script or JScript development\n\n[Page 5]\nUse Python skills and libraries directly at\nthe Agent Server layer\nOperations teams\nMonitor script execution through standard\nagent status bits and slots\nIT / OT integration teams\nBridge SCADA data to enterprise systems\nvia Python REST, database, and messaging\nlibraries\nOrganizations adopting Python\nStandardize on one language across Smart\nTypical Use Cases\n• Custom calculations and engineering unit conversions triggered by tag changes\n• Data aggregation and KPI computation at the Agent Server\n• REST API and web service integration with external systems\n• Database read/write operations for MES, ERP, or CMMS connectivity\n• Batch and recipe logic extensions using Python's expressiveness\n• Historical data analysis and reporting triggered on schedule or event\n• Alarm enrichment and notification routing via custom Python logic\n• Proof-of-concept and rapid prototyping before formal agent development\nTechnical Scope (internal reference)\n• Agent DLL: T_PythonScript.dll\n• Script Editor: adrscriptedit.exe\n• Python packages: pywin32, adroit-py (Adroit OLE Python)\n• Default Python path: C:\\Program Files\\Adroit Technologies\\Python\\Python.exe\n• Key slots: scriptFn, pythonPath, parameters, synchronous, runNow, triggerList,\nrunTime, info\n• Status bits: busy, complete, error\n• Future: embedded mode (in-process Python execution) planned for a later release\n• Not supported: script scheduling (use trigger tags or external Scheduler agent),\nrealtime catchup\nDocument Information\nBased on: PythonScript Agent URS/FDS (PythonScript Agent.docx) and Adroit 11 Agent\nServer help topics\n\n[Page 6]\nFor detailed end-user instructions, refer to the Adroit 11 help: The PythonScript Agent,\nConfiguring PythonScript Agents, and PythonScript Agent Slot Details"}, {"title": "Remote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router", "href": "supporting_docs_html/Remote_Service_Monitoring_using_Melsoft_GX_Works3_Robustel_Gateway_Router.html", "category": "Supporting Docs", "rel": "supporting_docs_html/Remote_Service_Monitoring_using_Melsoft_GX_Works3_Robustel_Gateway_Router.html", "kind": "Supporting Doc", "text": "[Page 1]\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 1\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router\nPurpose\nThis document provides step-by-step instructions for engineers to remotely access, monitor,\nand service Mitsubishi PLC's using GX Works3 via a Robustel VPN Router.\nIt assumes that:\nThe Robustel Router has been correctly configured and registered on the RCMS Cloud\nPlatform.\nThe router is part of the appropriate VPN Group.\nThe network planning and configuration are already completed.\nThe Router connect to the Internet and VPN service.\nNote: This guide does not cover router configuration or network planning. It focuses on\nestablishing a remote connection to the PLC and using GX Works3 for monitoring or program\noperations.\nTypical Network Layout\nPrerequisites\n1. The Robustel Router must be registered on the RCMS Cloud Platform and included in a\nVPN group.\n2. The RCMS Client must be enabled on the router.\n3. Verify that the router is connected to the Robustel VPN and the link is active.\n4. The remote engineer must be a verified VPN user in the Robustel RCMS Cloud Platform\n(https://rcms-cloud.robustel.net/) or request access from the platform administrator.\n5. Install the Robustel VPN Manager application on your PC. This can be downloaded\nfrom the RCMS Cloud Platform (RCMS Support Resources) or requested from the\nplatform administrator.\n6. Ensure the PC has a reliable internet connection, and your IT administrator allows\nconnections to the Robustel RCMS VPN if using an office network.\n\n[Page 2]\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 2\n\n[Page 3]\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 3\nStep 1: Connect to the Robustel VPN\n1. Launch the Robustel VPN Manager on your PC.\n2. Log in using your VPN credentials.\n3. If you are part of multiple VPN groups, select the relevant VPN Group and click\nConnect.\n4. If a timeout warning appears, click Refresh - the connection may already be\nestablished successfully.\n5. Ping the PLC to test and ensure connectivity.\n\n[Page 4]\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 4\n\n[Page 7]\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 7\nStep 3: Configure PLC Connection\n1. From the menu, select Online → Current Connection Destination.\n2. Choose Other Connection Method.\n3. Select Ethernet Board.\n4. Double-click on the PLC Module:\no\nConfigure the PLC IP Address.\no\nSet the Response Wait Time.\no\nClick OK.\n5. Under Network Communication Route, select No Specification and Ethernet.\n6. Click Connection Test.\no\nIf successful, the PLC will respond with a message such as:\n\"Successfully connected with the FX5UCPU\".\n7. Click OK to close the connection setup window.\n\n[Page 10]\nRemote Service & Monitoring using Melsoft GX Works3 & Robustel Gateway Router 10\nStep 4: Read Parameters from PLC\n1. Go to Online → Read from PLC.\n2. Select Parameters to read and press Execute.\n3. Confirm by selecting Yes to All.\n4. GX Works3 will read the PLC program and parameters.\n5. Once complete, press OK to close the read window."}, {"title": "Robustel R1520 IPsec guide", "href": "supporting_docs_html/Robustel_R1520_IPsec_guide.html", "category": "Supporting Docs", "rel": "supporting_docs_html/Robustel_R1520_IPsec_guide.html", "kind": "Supporting Doc", "text": "[Page 3]\nRJ CONNECT cc.\nMembers: RJ Wright, BL Wright Reg: 199703909723 VAT: 4030168183 Page 3 of 12\nPurpose\nThe purpose of this guide is to provide a clear, step-by-step procedure for\nimplementing and configuring IPsec VPN on the Robustel R1520 router. This guide\nalso covers adding a Moxa Iologik device as an end device on the PLC-side network\nof the Robustel, ensuring secure remote connectivity.\nTopology\nConfigure the PC Network Settings (SCADA)\n• Set the PC's IP address to be in the same subnet range as the Robustel\nrouter on the SCADA-side network.\n\n[Page 4]\nRJ CONNECT cc.\nMembers: RJ Wright, BL Wright Reg: 199703909723 VAT: 4030168183 Page 4 of 12\nConfiguration (Robustel SCADA side)\nConfiguring WWAN settings\n• Configure WWAN1 with the required SIM card and network settings.\n• Set WWAN1 as the primary link for internet connectivity.\n• (Optional) If a second SIM card is available, configure WWAN2 as the backup\nlink to provide automatic failover if WWAN1 goes down.\n• Configure the WWAN interface (WWAN1 or WWAN2) according to your SIM\ncard's required settings (APN, authentication, etc.) or your preferred network\nconfiguration.\n• Ensure the interface successfully registers on the cellular network before\nproceeding.\n\n[Page 5]\nRJ CONNECT cc.\nMembers: RJ Wright, BL Wright Reg: 199703909723 VAT: 4030168183 Page 5 of 12\nVerify SIM Card Connectivity\n• Check the WWAN status and wait for the SIM card to register on the network.\n• Confirm the status shows Connected before proceeding.\n• Once connected, log into the Robustel router using the SIM card's static\npublic IP address.\n• Tip: Use https://<SIM_IP> in your browser to access the web interface\nsecurely.\nVerify LAN Settings\n• Navigate to LAN Settings in the Robustel web interface.\n• Ensure the LAN IP address of the router is 192.168.0.1.\n• This IP should match the gateway address configured on your PC to allow\nproper communication.\n\n[Page 6]\nRJ CONNECT cc.\nMembers: RJ Wright, BL Wright Reg: 199703909723 VAT: 4030168183 Page 6 of 12\nConfigure the IPsec Tunnel\n• Navigate to VPN → IPsec → Tunnel in the Robustel web interface.\n• Click Add to create a new IPsec tunnel.\n• Enter the required tunnel parameters according to your network design or VPN\nconfiguration plan.\nConfigure IPsec Settings\n• After clicking Add, configure the IPsec tunnel settings according to your\npreferred or required VPN configuration.\n• Important: All IPsec parameters (e.g., encryption, authentication, pre-shared\nkey) must match between both Robustel routers, one on the SCADA side and\nthe other on the PLC side, for the tunnel to establish successfully.\n\n[Page 9]\nRJ CONNECT cc.\nMembers: RJ Wright, BL Wright Reg: 199703909723 VAT: 4030168183 Page 9 of 12\nConfiguration (Robustel PLC Side)\nNote: Repeat the previous steps to configure the WWAN settings on the second\nRobustel router located on the PLC side. Ensure both routers have matching IPsec\ntunnel configurations for successful VPN connectivity.\nConfigure LAN IP on PLC-Side Router\n• Change the default LAN IP address of the router to match the subnet range of\nthe PLC/Iologik network.\n• After making changes, click Submit, then Save & Apply to apply the new\nsettings.\nConfigure IPsec VPN Tunnel (PLC-Side)\n• Ensure all IPsec VPN tunnel settings match the configuration of the Robustel\non the SCADA side.\n• Confirm that the pre-shared key is identical on both routers; any mismatch\nwill prevent the tunnel from connecting.\n\n[Page 11]\nRJ CONNECT cc.\nMembers: RJ Wright, BL Wright Reg: 199703909723 VAT: 4030168183 Page 11 of 12\nConfiguration (ioLogik E1242)\n• Configure the Ethernet settings on the Iologik device.\n• Assign an IP address within the same subnet as the Robustel router's LAN IP\n(e.g., 192.168.127.x).\n• Set the default gateway to the Robustel router's LAN IP address (e.g.,\n192.168.127.1).\nTest Iologik Connectivity Using Modscan\n• Open Modscan on your PC.\n• Enter the IP address of the Iologik device configured earlier.\n• Click OK to establish the connection and begin communication."}, {"title": "What is new in the Adroit 10 Release", "href": "supporting_docs_html/What_is_new_in_the_Adroit_10_Release.html", "category": "Supporting Docs", "rel": "supporting_docs_html/What_is_new_in_the_Adroit_10_Release.html", "kind": "Supporting Doc", "text": "[Page 4]\nATQMS-MKTG-DOC-What is new in the Adroit 10 Release\nP a g e | 3\n1. What is new in the Adroit 10 Release\nApart from various performance enhancements of the existing functionality, Adroit provides the\nfollowing additions:\n1.1.\nProduct Licensing Changes\nIMPORTANT: HASPs are NOT backwardly compatible with previous product versions due to a\nchange in the internal licensing structure of the HASPs.\nThe Adtech Licensing Utility allows you to get, view and/or update your Adroit product license.\nThe product license is now a .XML document to make it easier to read and is displayed in\nthe License tab.\nIMPORTANT: The former Remote Nodes licenses that applied to all types of clients have been\nDISCONTINUED. These have now been replaced by the following client specific node licenses,\neach of which have different costs:\nClients: typically Operators and/or Designers and\nWeb Clients: typically Performance Anywhere clients.\nRemote Desktop (RDP) clients can now get a free node connection to obtain engineering\naccess to the Agent Server, by adding and configuring the RDAdminName WG.INI registry\nstring value.\nNote: By default, this registry entry does not exist and therefore all Remote Desktop (RDP) clients\nare subject to node licensing. This registry value must be created and set to the required Windows\nusername to establish free connections for this user.\nThe OEM (separately-licensed) components are no longer specified by their associated OEM codes\nbut now included as separate textual entries in the product license, so that users can easily see\nexactly which components they are currently licensed for.\nTip: Only the OEM components that you are licensed for will appear.\nAll product licenses have a GLOBAL expiry and can also support product-specific expiries,\nwhich can be used for product trials.\n.V2C (Vendor to Customer) and .C2V (Customer to Vendor) files are now used to create\nand update product licenses instead of using .RUS files.\nA new licensing methodology has been added to support new product variants (Ignite and OPC/Edge\nGateway) where rather than using traditional scan point licensing the system will count the number\nof user defined agents.\nNote: Full and Lite / HMI products continue to use the traditional scan point methodology\n1.1.1.\nImportant differences between a HASP and a Soft License:\nA HASP license is bound to a USB HASP, which has a specific serial number - this is\ntherefore portable and not restricted to a specific computer but has associated security\nrisks and needs to be insured at your own risk.\nA Soft license is bound to a specific computer and therefore cannot be transferred\n\n[Page 5]\nATQMS-MKTG-DOC-What is new in the Adroit 10 Release\nP a g e | 4\n1.2.\nInstall\nAdroit 10 is designed to run on Windows 10 and Windows Server 2008 R2 onwards, it no longer\nsupports the Windows Vista nor Windows Server 2008 operating systems.\nAdroit 10 requires Microsoft .NET Framework 4.6.2. If this is not installed then the installation uses\nan offline installation that it provides to install this for you (so no further downloading is required).\nIMPORTANT: The install can no longer be installed if the name of the user running it is called\n\"Administrator\", since this COULD be the built-in Windows Administrator account, which is\nDISALLOWED because UAC is automatically disabled whenever this built-in Administrator account is\nused, which causes a myriad of problems to occur.\nWhen installing the Agent Server, the Component Configuration Settings dialog does not\nprovide the option of not installing the Agent Server and SmartUI Server as services. From version\n10.0.5.0 this is required as certain underlying functionality requires consistency so far as access\nrights and user context go.\nIt is mandatory to specify both a username and\npassword for the Agent Server Service, which should\nbe those of a user that has the rights / permissions to\naccess the network resources (printers, SQL Express,\nnetwork shares) that the Agent Server requires access\nto. Hence this dialog has been reorganized as follows:\nThe install installs/updates the latest INSTALLABLE drivers' files, typically in the Drivers sub folder\nof the Adroit installation folder. When users want to install a new driver via the Config Editor this\nfolder is now selected by default. While the drivers that are automatically installed by the install,\nsuch as the OPC Client driver are automatically installed and/or updated. For all other drivers, we\ndo not touch the installed drivers and the onus is upon the user to update the necessary drivers.\nWhen the installed version is same as the version of the install, a message box is displayed to allow\nusers to select whether they want to reinstall the existing components or they can opt to install\nadditional components that have not been installed yet or exit the install (the default option).\nThe install now detects when the .NET Framework 4 install seems to install without any issue but\ndoes not update Microsoft .NET Runtime Execution Engine (mscoree.dll) and prevents the install\nfrom continuing in this instance and provides assistance to resolve this Microsoft issue that ONLY\naffects Windows 7 and Windows Server 2008 R2.\nAdded Performance Anywhere to the list of available installable components and added the\nPerformance Anywhere Server option to the list of available installation options, which also\ninstalls the required Web Server component:\nPerformance Anywhere needs to be installed on a Web Server - a computer that has IIS (Internet\nInformation Services) installed and ensures that the SmartUI Web Service is also installed.\n\n[Page 8]\nATQMS-MKTG-DOC-What is new in the Adroit 10 Release\nP a g e | 7\n1.4.\n1.4.1.\nThe ICMP or PING Agent\nAdded the ICMP or PING agent uses the Internet Control Message Protocol to troubleshoot network\nproblems.\nBy continuously polling the specified remote IP address, this agent is therefore able to identify\npotential network problems as they occur by generating alarms when errors are obtained when\nattempting to contact the specified remote IP address and/or when the round trip time exceeds\nspecified High and High-high times.\n1.4.2.\nThe DumpConfig Agent\nAdded the DumpConfig agent, which simply stores the configuration of specific agents in an OLE DB\ndatabase.\nOne example for its use is when you need to report on agents in the context of their configuration\nat the time of the report, alternatively this could be used as an extensive method of auditing changes\nmade to specific agents.\n1.4.3.\nThe DBQuery Agent\nAdded the DBQuery agent type supporting a full range of advanced database interactions\nsuperseding that provided by the DBAccess agent\nThis agent type allows for advanced queries to be executed on an OLDB database connection for\nreading; inserting and manipulating tabular data\n1.4.4.\nThe Accumulator Agent\nThis agent performs 3 basic functions:\nIt retrieves an input value that normally accumulates over time and is always increasing in value.\nIt uses this value to calculate the difference, or its change in value, between successive events or\nover a specific time or interval.\nIt calculates the total for a period based on a predefined trigger or time interval.\n1.4.5.\nThe following primitive agent types have also been added to Lite / HMI mode: Real and Integer,\nhowever these agents (including Boolean) should ONLY be used where efficient use of memory is\nrequired.\nPLEASE NOTE: These legacy primitive agents do not support Alarming and other SCADA\nfunctionality, use Analog/Digital agents instead!\n1.4.6.\nThe Analog Agent\nThe Analog agent now provides support for up to 51 bit numbers, in that the new maximum range\nis 2,000,000,000,000,000 for unsigned numbers or -1,000,000,000,000,000 to\n1,000,000,000,000,000 for signed numbers.\nTo reduce the loss of accuracy in scaling caused by IEEE conversion issues, the Analog agent\nbypasses the scaling calculation, when the scaling is 1:1.\n\n[Page 11]\nATQMS-MKTG-DOC-What is new in the Adroit 10 Release\nP a g e | 10\nAlso these settings are now being stored in the Agent Database (.wgp) file along with the other\nscanning related settings, such as the scan address, scan rate etc, as an IO flags setting, which is\ndisplays as an additional column in the Currently scanned tags list.\nFor this reason Adroit WGP files for 10 are NOT backward compatible with previous versions, which\nAdded support for the demand scanning of tags, which are only communicated when there are one\nor more subscriptions against them. For example a graphic form is open with the tag in it. Once the\ngraphic form closes, if this is the only subscription to this tag then communication of that tag will\ncease.\nNote: Demand scanning is only supported by drivers that have been written to support it.\n1.4.13. The Datalog Agent\nThe logging to ADO (SQL) databases by the Datalog agent is disabled by default (the SQL...\nbutton of the Datasource field is hidden in the Edit Datalog agent dialog). This is to force users\nto use the DBLog agent instead, which logs data to SQL more efficiently.\nAlthough if the Agent Server loads a legacy WGP file that ALREADY contains an ADO datalogging\nconfiguration, then the SQL... button of the Datasource field will be visible in the Edit Datalog\nagent dialog.\n(Length...) should not exceed what is required for operational trending purposes.\nIn other words, should an operator only need to see 24 hours of trend data to properly monitor and\ncontrol his plant then the datalog period should only be set for 1 day. Historical data (i.e. data\noutside of the datalog period), if requested, will be retrieved from the backup files, if required.\nWhen the allocated size of the datalog (.LGD) file is filled, it wraps (starts again at the beginning).\nAt which time one or more datalog backup (.LGB) files are created to store this older (historical)\ndata. The datalogging sub-system automatically retrieves this historical data from these files, when\nthis data is required by trends (charts) or other requests for historical data.\n\n[Page 16]\nATQMS-MKTG-DOC-What is new in the Adroit 10 Release\nP a g e | 15\n1.5.5.\nSmart Data Services Configuration\nSmart Data Services configuration has been added to the config to allow the user to configure the\navailability and function of certain modules.\nThe following services are provided:\nRemote Agent Server connectivity\nThis facilitates remote communication to the local Agent Server from a SmartUI Server\nlocated on another machine.\nOPC UA Server\nProvides OPC UA Server functionality, exposing specific tags within the Agent Server via\nOPC UA\nRemote Monitoring service\nThis allows remote diagnostic monitoring of servers through the Server Activity Monitor.\nI.e. A Server Activity Monitor on another machine can connect to this machine remotely\nand gather status information regarding the running Agent Server and / or SmartUI Server\nRemote Application service.\nThis allows licensing to be controlled / applied remotely from another machine via the\nALU utility. Rather than having to engage the ALU on each Server, one can apply licensing\nupdates from a central location.\n\n[Page 17]\nATQMS-MKTG-DOC-What is new in the Adroit 10 Release\nP a g e | 16\n1.6.\nPerformance Anywhere\nAdded Performance Anywhere to the list of installable components of the Adroit 10 install.\nPerformance Anywhere needs to be installed on a Web\nServer - a computer that has IIS (Internet Information\nServices) installed and ensures that the SmartUI Web\nService is also installed.\nOnce installed, by specifying the required URL provided by\nthe install, the Performance Anywhere dashboard can be\nopened on a mobile device and/or Internet browser and\nallows you to create numerous pages in which you place\nand configure widgets (controls) in Design mode so that\nyou can display and, in some cases, configure your Adroit\ndata in Run mode.\nThe Performance Anywhere shortcut that is installed to the Desktop, also contains the virtual\ndirectory name of the Web Service, to prevent login issues.\nWhen configuring"}];
const host = document.getElementById("cards");
ITEMS.forEach(function(it) {
  const card = document.createElement("div");
  card.className = "card";
  const text = it.text ? `<div class="small">${esc(it.text).slice(0, 260)}${it.text.length > 260 ? "..." : ""}</div>` : "";
  const kind = it.kind ? `<span class="pill">${esc(it.kind)}</span>` : "";
  const href = resolveHref(it.href || it.rel || "#");
  card.innerHTML = `<h3><a href="${escAttr(href)}">${esc(it.title)}</a></h3><div class="small">${esc(it.category || "")}</div>${kind}${text}`;
  host.appendChild(card);
});
</script>
<script>
(function() {
  var storageKey = "help_theme";
  function preferredTheme() {
    try {
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    } catch (e) {
      return "light";
    }
  }
  function applyTheme(t) {
    if (t === "dark" || t === "light") {
      document.documentElement.setAttribute("data-theme", t);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }
  function getSaved() {
    try { return localStorage.getItem(storageKey) || ""; } catch (e) { return ""; }
  }
  function setSaved(t) {
    try { localStorage.setItem(storageKey, t); } catch (e) {}
  }
  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") || preferredTheme();
  }
  function updateLabels() {
    var cur = currentTheme();
    var label = (cur === "dark") ? "Light mode" : "Dark mode";
    document.querySelectorAll(".theme-toggle").forEach(function(btn) {
      btn.textContent = label;
    });
  }
  function toggleTheme() {
    var cur = currentTheme();
    var next = (cur === "dark") ? "light" : "dark";
    applyTheme(next);
    setSaved(next);
    updateLabels();
  }
  function bind() {
    document.querySelectorAll(".theme-toggle").forEach(function(btn) {
      btn.addEventListener("click", function() {
        toggleTheme();
      });
    });
    updateLabels();
  }
  var saved = getSaved();
  applyTheme(saved || preferredTheme());
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bind);
  } else {
    bind();
  }
})();
</script>
