const ITEMS = [{"title": "Adroit 10 Quick Start Guide", "href": "supporting_docs_html/Adroit_10_Quick_Start_Guide.html", "category": "Supporting Docs", "rel": "supporting_docs_html/Adroit_10_Quick_Start_Guide.html", "kind": "Supporting Doc", "text": "[Page 4]\nP a g e | 3\n1. Introduction\nThe Adroit Quick Start Guide document is designed to help the new user install, configure and get an\nunderstand of the various Adroit sub-systems. In addition to assist a new user in understanding the Adroit\napproach to SCADA/HMI project development and concepts surrounding the Adroit product.\n1.1.\nGeneral Overview\nIn order to understand Adroit it is important to understand the basic architecture of the product.\nBelow is a diagram, which represents the basic standalone architecture.\nFigure 1: Basic Stand Alone Architecture\nFront end device (FED): The front-end device is a general term used for a PLC; OPC server;\nRTU; a controller; or any software package that allows third party communication (i.e. OPC,\nSIMATIC NET).\nProtocol driver: Adroit supports +- 100 different protocols. Once a new driver has been installed\nand configured to talk to a FED, it is called a Device. A single protocol can support multiple\nDevices. An example of this is the user can have multiple FEDs which use the same protocol\n(i.e. MODBUS Ethernet), each FED will have its own IP address/Address. A device will need to\nbe created for each FED.\nAgent Server (AS): The Agent Server (I/O Server), is the real-time database, which handles the\nreal-time values and if configured, will handle all post-processing, logging and/or alarming the\ndata.\nSmartUI Server (SUIS): The SUIS is a middleware server which exposes data from a number of\ndisparate sources, using the datasource, and also acts as a repository for the graphic forms or\nmimics. It also acts as the manager of access, and broker for the unified data model\nimplemented across all data types that may end up in the\nDatasource: Each source of data (i.e. Adroit Agent Server) requires a datasource plugin before\nit can be associated with the SmartUI Server. This provides the ability to expose its data as\ndata elements. An example of a data element is Adroit.Analog.SAMPLEANALOGUE.value. The\nSmartUI Server connects to data using two different types of datasources:\nThe SmartUI Server allows multiple sources of data to be available to the configuration of a\nsystem in a unifed manner. It basically coverts all datatypes into universally usable elements\n(dataelements).\n\n[Page 6]\nP a g e | 5\n2.1.\nHardware & Software Requirements\n2.1.1. Recommended Hardware & Software\nPlease refer to the Hardware & Software Specification document available from our website.\nhttps://adroittech.co.za/downloads-tree-view/\n2.1.2. Additional Software\nAdditional software that will expand the functionality of Adroit:\nInternet information services (IIS): Required for web service and distribution service\nSQL with advanced reporting services: used for historical data logging and reporting. Adroit\nships with the free SQL Express that can be used for these purposes.\n2.2.\nLicensing\nTypically, the Agent Server is licensed via a HASP software protection hardware key, which is inserted into\nthe USB port of the computer on which the Agent Server is running. This HASP is then programmed in\naccordance with your specific license agreement.\nIn situations where it is not possible to use a physical HASP, it is also possible to license Adroit via a\nsoftware license, which is only available on request. For further details, contact your Adroit representative\nfor details.\n2.2.1. Licensing definitions\nScan points: When a memory address is scanned/attached in the PLC and for every DBAccess\nAgent; Script Agent; and SNMP Agent a Scan Point is consumed.\nVersion: HASPs are licensed against versions of Adroit.\nIMPORTANT: The former Remote Nodes licenses that applied to all types of clients have been DISCONTINUED. These\nhave now been replaced by the following client specific node licenses, each of which have different costs:\no Clients: typically Operators and/or Designers and\no Mobile/Web Clients: typically Performance Anywhere or Adroit Air clients.\nOEM: Additional components that are separately licensed are specified as separate textual\nentries in the product license e.g. Adroit Alarm Management enablement, Adroit Historian\nenablement; Max Demand Agent, OEE Agent; Siemens Ethernet driver; DNP 3.0 driver.\nA time limit is set on development HASPs. Production HASPs have no time limit.\n2.3.\n1. Ensure that the Windows operating system on which you intend to install Adroit has been\nand remains legally licensed and ACTIVATED, since Adroit is not supported when it is run on\nan unlicensed Windows operating system.\n2. Ensure that you are not using the built-in Administrator account to run Adroit, since UAC is\nautomatically disabled whenever this built-in Administrator account is used.\n3. When installing and running Adroit on an operating system that provides User Account\nControl (UAC), such as Windows 7 or Windows Server 2008, please ensure that UAC is always\nENABLED, since Adroit is not supported when it is run with UAC disabled.\n4. Adroit 10 requires the Microsoft .NET Framework 4.6.2\n5. The Web Service component can ONLY be installed on a computer that has IIS (Internet\nInformation Services) installed.\n\n[Page 11]\nP a g e | 10\n2. Select the Add new configuration button.\n3. Give the new configuration a name. Then click the Ok button.\nFigure 10 - Create a new configuration\n4. Once the configuration has been created click the Ok button.\n3.2.\nCreating a Device\nSetup the OPC Client to the Adroit BatchOPC Server demo application. This application is part of the Adroit\ninstall.\n1. Open the Driver configuration in the Adroit Config Editor, under the Agent Server\nConfiguration.\nFigure 11 - Driver Configuration\n\n[Page 12]\nP a g e | 11\n2. Select the OPC Client Protocol driver, then click on the Add button.\n3. Enter the device name BAT_01\nFigure 12 - Device Name\n4. In the OPC client driver configuration select the Adroit Batch OPC Server in the OPC server\ndrop down box.\n5. Click Ok.\n6. Click Ok on the performance counter installation.\nFigure 13 - OPC client configuration\n\n[Page 24]\nP a g e | 23\n6.2.\nScanning\nScanning values simply means communicating using a predefined protocol from a memory address of a\nFED to a TAG.\n6.2.1. Scanning a Tag\nTo scan the RawValue slot of the of BAT-01-MIX-01-TEM Analog Agent to the Adroit Batch OPC Server:\n2. Select the Analog Agent BAT-01-MIX-01-TEM.\n3. Click on the Scan button.\n4. In the scanning configuration, select the device BAT_01 in the Device dropdown box.\n5. The user will be prompted to create the device.\n6. Click the Yes button. The Adroit Batch OPC Server will automatically start.\nFigure 28 - Batch OPC Server\n7. Enter the OPC address ActualMixTemp into the address field and change the Scan rate to 0.\n8. Click on the Scan button to add the scan job to the device.\n\n[Page 35]\nP a g e | 34\n7.2.\nLine Charts\nThe line chart control is used to display live as well as logged data from the Adroit Agent Server.\n7.2.1. Display Historical Data\nUsing the Line Chart control to display the logged data of the Analog Agent BAT-01-MIX-01-TEM.\n1. Confirm that the graphic form Overview is open and not in run mode.\n2. From the toolbox view under Data select the LineChart control and place it on the graphic\nform. Once the control has been placed the LineChart configuration will open.\n3. Change the Title of the series from Line to Actual Mixing Temperature by double clicking on\nthe series name Line.\nFigure 41 - Configuration Line Chart Series Name\n4. Select the Values tab in the series setup. Then setup the values as follows."}, {"title": "Adroit Disaster Recovery Document", "href": "supporting_docs_html/Adroit_Disaster_Recovery_Document.html", "category": "Supporting Docs", "rel": "supporting_docs_html/Adroit_Disaster_Recovery_Document.html", "kind": "Supporting Doc", "text": "[Page 1]\nDisaster Recovery Process\nDocument\nCustomer:\n\n[Page 3]\n1.\n2.\n\n[Page 4]\n1. Project Information\nSite Name\nAddress\nOwner\nRepresentative\nContractor\nSub-Contractor\nDate\n2. Introduction\nThis document provides a basic disaster recovery plan. Each customer, project, and site is unique, so\nspecific procedures may vary. It outlines steps to ensure continuity and recovery of a cluster SCADA\nsystem, including OPC services, telemetry radio connections, and local SQL datalogging. The plan\nalso incorporates key stakeholders, critical spares, and pre-identified system risks\n2.1 REQUIREMENTS\na) Access to the site/server room\nb) Backup power in the server room\nc) Cold standby server with latest licenced software loaded.\nd) USB Drive with the latest backups\ne) Admin User Login Credentials\nf)\nNetwork Diagram and IP addresses\ng) Maintain a list of key stakeholders for disaster response\nh) Ensure availability of critical spares (PSU, hard drives, network cards, graphic cards, RAM,\nOS keys, passwords, installation disks, switches)\ni)\nDocument site-specific environmental controls (temperature regulation, humidity)\n2.2 Stakeholders\nMaintain a list of personnel responsible for disaster response:\na. SCADA Administrator / Lead Engineer - Responsible for recovery of SCADA servers and\nsoftware\nb. IT / Network Administrator - Ensures connectivity, firewall rules, switches, and remote access\nc. Database Administrator - Responsible for SQL server and data integrity\nd. Operations Manager / Process Owner - Confirms system operation and verifies critical\nprocess continuity\ne. Maintenance Engineer / Onsite Support - Handles hardware swaps, spare parts, and server\npower issues\nf.\nRemote Support Contact (Adroit Technologies / OEM) - Escalation for technical support\n2.2 COLD STANDBY SERVER ACTIVATION\nIn the event of a disaster, follow the steps below to activate the cold standby server:\na) Keep the standby-server configuration, software, database, and project configuration up to\ndate and test regularly.\nb) Keep some basic server spares onsite.\nc) Use soft licence keys instead of HASP USB keys.\nd) Power on the cold standby server and ensure it is connected to the network.\n\n[Page 5]\ne) Configure the necessary network settings to match the production server.\nf)\nInstall and configure any required software or services on the cold standby server.\ng) Restore the latest project backup from the removable USB drive to the cold standby server.\nh) Verify the connectivity between the cold standby server and the other system components.\nEnsure all spares are readily available for server replacement or component failure\n2.3 PROJECT BACKUP AND RECOVERY\nEnsure the following steps are taken to manage project backups:\na) Regularly back up the project files to the removable USB drive (Scheduled automated\nbackups).\nb) Store the removable USB drive in a secure location onsite.\nc) Connect the removable USB drive to a UPS backup power source and ensure it is accessible\nto the switch.\nd) Test the restoration process periodically to ensure the backup files are valid and can be\nsuccessfully recovered.\ne) Maintain multiple backup locations if possible (offsite or cloud) for added resilience\nf)\nInclude incremental backups for minimal data loss\n2.4 DATA LOG CONNECTOR AND DATA WAREHOUSE SERVER\nVerify the health and connectivity of the data log connectors and data warehouse server as follows:\na) Periodically check the data log connectors to ensure they are functioning correctly.\nb) Validate that the data log connectors are successfully sending data to the data warehouse\nserver.\nc) Regularly test the data warehouse server's ability to receive and process data from the log\nconnectors.\nd) Monitor data replication and storage to confirm the integrity of the data.\n2.5 USER SECURITY AND LOG ON PROCEDURES\nMaintain user security and log on functionality by adhering to the following measures:\na) Regularly review and update user accounts, access levels, and privileges.\nb) Ensure that user credentials are securely stored and encrypted.\nc) Test the log on procedure periodically to verify its functionality.\nd) Establish a process for password recovery and account lockout in case of security breaches.\ne) Regular review of users, privileges, and credentials\nf)\nEstablish password recovery and lockout procedures\n2.6 REMOTE UI SERVER AND COLD STANDBY SERVER ACCESS\nEnable the remote UI server to access the cold standby server with the following steps:\na) Configure network access rules to allow the remote UI server to connect to the cold standby\nserver.\nb) Test the connectivity between the remote UI server and the cold standby server.\nc) Ensure that all necessary software and services are installed and properly configured on the\ncold standby server to support remote access.\nd) Network rules for remote access\ne) Test connectivity\nf)\nEnsure proper software installed for remote access\n\n[Page 6]\n2.7 SYSTEM HEALTH CHECKS\nRegularly perform system health checks to ensure the SCADA system and devices are functioning\noptimally:\na) Develop a monitoring and alerting system to identify any abnormalities or failures in the\nsystem.\nb) Schedule regular system health checks, including device polling and status verification.\nc) Keep all devices and software up to date with the latest patches and updates.\nd) Perform periodic tests to confirm the responsiveness and accuracy of device communication.\ne) Monitoring and alerting\nf)\nDevice polling and status verification\ng) Apply software patches and firmware updates\n2.8 SYSTEM SPARES\nMaintain the following critical spare components onsite to reduce downtime:\nPSU (Power Supply Units)\nHard Drives (OS, SQL, SCADA backups)\nNetwork Cards & Switches\nGraphic Cards\nRAM Modules\nCold standby servers (if multiple servers are available)\nOperating System and SCADA software keys\nInstallation media/disks\n3. Conclusion\nThis disaster recovery document provides guidelines to ensure the continuity and recovery of the\ncluster SCADA system in case of a disaster. Regular testing, monitoring, and backup management\nwill contribute to a reliable and resilient SCADA system.\n4. Approval\nSigned at ______________________________on this date________________________________\nName & Surname Project Engineer\nSigned at ______________________________on this date________________________________\n\n[Page 7]\nName & Surname\nProject Sponsor"}, {"title": "Adroit Smart UI Asset Library-Help", "href": "supporting_docs_html/Adroit_Smart_UI_Asset_Library-Help.html", "category": "Supporting Docs", "rel": "supporting_docs_html/Adroit_Smart_UI_Asset_Library-Help.html", "kind": "Supporting Doc", "text": "[Page 2]\nResize sidebar: Drag the thin strip on the right edge of the sidebar (200-400 px wide).\nBrowsing by category\nCategories vs All\n● Categories - Browse one category at a time using the tree.\n● All - Show assets from every category together (no tree).\nCategory tree\nCategories can be nested (e.g. Parent/Child). Click a node to filter the main grid to that category.\nBreadcrumbs at the   of the main area show your current location; click a breadcrumb segment to\njump back up the tree (when not in All mode).\nFinding assets\nSearch\n1. Choose what to search by: Name, Industry, or Author.\n2. Type your search text.\n3. Click Search or press Enter.\nSearch is not live - you must click Search or press Enter after typing.\nIndustry search tip: When Industry is selected, use the ▼ button in the search box to pick from a\npredefined list (Agriculture, Manufacturing, Oil & Gas, Water & Wastewater, etc.).\n\n[Page 3]\nFigure 2: Searching assets by name containing \"pump\"\nFigure 3: Searching assets by industry i.e. Water & Wastewater\n\n[Page 4]\nFilter by asset type\nUse the All Types dropdown to limit results to:\nType\nColor indicator (left edge of card)\nGraphic\nBlue\nDefault / other\nGray\nFigure 4: Filter assets by type i.e. show all Objects\nFilter by tags\nBelow the search row, use Filter tags… to select one or more tags. Selected tags appear as chips.\nRemove a chip to clear that tag filter.\nYou can also click a tag on an expanded asset card to add or remove it from the active filters.\nFigure 5: Filter tags dropdown options\n\n[Page 5]\nFigure 6: Filter assets by tags i.e. show all assets with ISO tag\nReset\nClick Reset to clear search text, tag filters, type filter, and All categories mode (returns to single-category\nview). Category selection is restored to the first available category after reset.\nSort results\n● Sort by: Name or Last Updated\n● Order: Ascending or Descending (toggle with the arrow button)\nSorting applies to the assets currently visible (after category, search, tag, and type filters).\nUnderstanding asset cards\nEach card shows a preview image, name, and short description.\nExpand for details\n\n[Page 7]\nDownload (cloud)\nDownload this asset as a ZIP file named {AssetName}.zip\nAdd to cart (+)\nAdd to download cart (turns green when in cart)\nRemove from cart (−)\nRemove from cart\nShare\nCopy link to clipboard, or share via email\nDocumentation\nOpen asset documentation (PDF in browser; Word docs via Office Online\nviewer)\nNotifications at the bottom of the screen confirm cart and copy actions.\nDownload cart\n1. Click + on each asset you want.\n3. Click Download Cart to download all selected assets as adroit-assets.zip.\n4. After a successful download, the cart is cleared automatically.\nClear Cart removes all items without downloading.\nYour cart is saved in the browser (local storage) and persists if you close and reopen the page on the\nsame device/browser.\nWhen assets are downloaded in Embedded Mode from the Asset Library tab in the Adroit Smart UI\nDesigner, they are copied to the Object Repository and become available in the Objects Toolbox.\nAppearance\n\n[Page 8]\nFigure 8: Adroit Smart UI Asset Library in Dark mode\nHelp menu\nOption\nWhat it does\nReport Issue\nSubmit Feedback\nOpens feedback email\nRequest an Asset\nOpens email to request a new asset\nContact Us\nGeneral contact email\nAbout\nVersion and product description dialog\nCommon tasks (quick reference)\n● Download one asset: Expand the card → click the download icon.\n● Download several assets: Add each to cart → Download Cart.\n● Find assets for pharmaceuticals: Set search field to Industry → pick Pharmaceuticals → Search.\n● Find all wizard-type assets: Set type dropdown to Wizard (no search text needed).\n● Share an asset with a colleague: Share icon → Copy Link or Share via Email."}, {"title": "AI Assistant - Help", "href": "supporting_docs_html/AI_Assistant_Help.html", "category": "Supporting Docs", "rel": "supporting_docs_html/AI_Assistant_Help.html", "kind": "Supporting Doc", "text": "[Page 1]\nAI Assistant - Help\nOverview\nThe AI Assistant is a built-in help chat in Smart UI Designer. You can ask product-related\nquestions in plain language - for example how a feature works, how to complete a task, or\nhow to troubleshoot a problem.\nThe assistant is powered by Chatbase and has been trained on our product help files and\nfast, conversational answers without leaving the Designer.\nFigure 1: AI Assistant\n\n[Page 2]\nThe AI Assistant complements other help options:\nHelp option\nBest for\nQuick, conversational answers while you work\nDesigner Help\nStructured, context-sensitive topics in the local help file\nOnline Help\nFull searchable documentation in your browser\nKnowledge Base Adroit Technologies articles and resources\nOpening the AI Assistant\n1. Open Smart UI Designer and connect to your project as usual.\n2. Switch to the AI Assistant tab\nOr\n3. On the ribbon, select the View tab.\n4. In the Content group, click AI Assistant (chatbot icon).\n5. The AI Assistant panel appears on the right side of the Designer.\nClick AI Assistant again to hide the panel. You can also dock, resize, or tab it like other\nDesigner panels.\nTip: If you use the AI Assistant often, include it in your saved window layout so it stays\nvisible when you open the Designer.\nUsing the chat\nOnce the panel is open:\n1. Wait for the chat interface to load.\n2. Type your question in the message box.\n\n[Page 3]\n3. Press Enter or click the Send Arrow.\n4. Read the reply and ask follow-up questions if needed.\nExample questions\n\"How do I publish a graphic form?\"\n\"How do I connect to the Agent Server?\"\n\"Why can't I see the Properties panel?\"\n\"How to execute queries in script?\"\n\"How to trend historical datalog data?\"\nBe specific where you can. Instead of \"It doesn't work,\" try \"When I save a wizard, I get error\nX - what should I check?\"\n\n[Page 4]\nPanel toolbar\nAt the   of the AI Assistant panel:\nButton\nPurpose\nReturn to the chat start page\nBack\nGo back in the chat/browser history\nForward Go forward in the chat/browser history\nReload\nRefresh the chat if it fails to load or stops responding\nUse Reload if the panel is blank or the chat appears stuck.\nChat settings\nThe AI Assistant includes a few built-in options to help you manage your chat experience.\nStarting a new chat\nClick the New Chat button in the AI Assistant side-panel to start a new conversation.\nStarting a new chat:\nClears the current conversation history from the panel.\nBegins a fresh conversation with no previous chat context.\nIs useful when changing to a different topic or starting a new task.\nLight and Dark mode\nThe AI Assistant supports both Light and Dark display modes.\nTo change the appearance:\n1. Toggle the (sun/moon) button in the AI Assistant side-panel.\n2. This should toggle the chat display between Light or Dark theme mode.\nThe selected theme changes only the appearance of the AI Assistant chat panel and does\nnot affect the Smart UI Designer application theme.\nTip: Choose the theme that is most comfortable for your working environment. Dark mode\ncan reduce eye strain when working in low-light conditions.\n\n[Page 5]\nFigure 2: AI Assistant side-panel with chat settings\nWhat the AI Assistant can and cannot do\nIt can help with\nProduct features and terminology\nStep-by-step guidance based on our documentation\nCommon troubleshooting and \"how do I…?\" questions\nPointing you toward related topics or workflows\nIt cannot\nChange your project, graphic forms, or server settings\nReplace official support for critical production issues\nGuarantee answers that are always complete or up to date\nAccess your local project files or server data directly\n\n[Page 7]\nRelated help\nHome → Help → Designer Help - context-sensitive help for the current ribbon page\nor task\nHome → Help → Online Help - full documentation at https://atsadroit.github.io/mysoftware-help/\nHome → Help → Knowledge Base - Adroit Technologies knowledge base\nFrequently asked questions\nQ: Is the AI Assistant the same as Online Help?\nA: No. Online Help is static documentation. The AI Assistant answers in a chat format using\ndocumentation it was trained on.\nQ: Do I need to log in separately?\nA: The chat loads inside Smart UI Designer, not need to login into Chatbase bot separately.\nQ: Why is the panel empty when I first open it?\nA: The chat loads when you activate the panel. If it remains empty, check connectivity and\nclick Reload.\nQ: Can I use the AI Assistant offline?\nA: No. An internet connection is required.\nQ: Will the assistant know about my specific project?\nA: No. It answers from trained documentation, not from your live project or server\nconfiguration."}, {"title": "AI Assistant - Whats New", "href": "supporting_docs_html/AI_Assistant_Whats_New.html", "category": "Supporting Docs", "rel": "supporting_docs_html/AI_Assistant_Whats_New.html", "kind": "Supporting Doc", "text": "[Page 1]\nWhat's New: AI Assistant in Smart UI Designer\nAdroit 11 Smart UI Designer | Release highlight\nGet answers without leaving your workspace\nSmart UI Designer now includes a built-in AI Assistant - a smart help chat trained on our\nproduct documentation and help files. Ask questions in plain language and get immediate\nguidance while you design, configure, and troubleshoot.\nNo more switching between the Designer, Help file, PDFs, and browser tabs to find an\nanswer. Help is now one click away, right inside the application.\nFigure 1: AI Assistant\n\n[Page 2]\nWhy we built it\nDesigning automation and graphic forms is complex. Even experienced users spend time\nsearching documentation for the right menu, setting, or workflow.\nThe AI Assistant helps you:\nWork faster - get quick answers without interrupting your flow\nOnboard more easily - new users can ask \"how do I…?\" instead of hunting\nthrough manuals\nResolve issues sooner - describe a problem and get relevant guidance from our\nofficial help content\nStay focused - help lives in a dock panel beside your project, not in a separate\nwindow\nWhat it does\nThe AI Assistant is a conversational help experience powered by Chatbase, integrated\ndirectly into Smart UI Designer.\nIt has been trained on:\nHelp files\nProduct documentation\nOfficial user guidance\nYou can ask about features, workflows, terminology, and common problems - for\nexample:\n\"How do I publish a graphic form?\"\n\"How do I connect to the Agent Server?\"\n\"Why can't I see the Properties panel?\"\n\"How to execute queries in script?\"\n\"How to trend historical datalog data?\"\n\n[Page 3]\nThe assistant responds in a natural chat format, and you can ask follow-up questions to go\ndeeper.\nHow to use it\n1. Open Smart UI Designer\n2. Switch to the AI Assistant tab\nOr\n3. Go to the View tab on the ribbon\n4. Click AI Assistant in the Content group\n5. Start typing your question\nThe panel opens on the right side of the Designer, alongside your familiar tools like\nProperties and Enterprise Manager. Show or hide it anytime with a single click. The AI\nAssistant panel is already open by default upon logging into Smart UI Designer.\n\n[Page 4]\nDesigned to fit your workflow\nThe AI Assistant is built into the Designer experience, not bolted on as an external tool.\nDockable panel - resize, reposition, or tab it like other Designer panels\nSimple navigation - Home, Back, Forward, and Reload controls at the   of the\npanel\nAlways available - open it whenever you need help, without leaving your project\nComplements existing help - works alongside Designer Help, Online Help, and\nthe Knowledge Base\nUse the AI Assistant for quick, conversational guidance. Use traditional help when you\nwant structured topics or full reference material.\nSmarter help for a smarter Designer\nThis release is part of our ongoing investment in usability and productivity. We want Smart\nUI Designer to feel more approachable, more responsive, and easier to learn - whether\nyou're building your first graphic form or managing complex automation projects.\nThe AI Assistant is your 24/7 documentation companion: trained on our content, available\ninside the tool you already use every day.\nGet started today\nUpgrade to the latest version of Adroit 11, and in the Smart UI Designer either switch to the\nAI Assistant tab or open the View ribbon and click AI Assistant.\nTry asking a question about something you do regularly - you might be surprised how\nquickly you get the answer you need."}, {"title": "ATQMS-TRNG-DOC-ACE-User Requirments Specifications 2025", "href": "supporting_docs_html/ATQMS-TRNG-DOC-ACE-User_Requirments_Specifications_2025.html", "category": "Supporting Docs", "rel": "supporting_docs_html/ATQMS-TRNG-DOC-ACE-User_Requirments_Specifications_2025.html", "kind": "Supporting Doc", "text": "[Page 5]\nATQMS-TRNG-DOC-ACE-User Requirments Specifications 2025.docxATQMS-TRNG-DOC-Adroit Certified Engineer Exam URS 2025.docx\nP a g e | 4\nThe purpose of this exam is to test your competency in configuring the Adroit SCADA products using\nvarious additional components. Therefore, we have designed the exam around a real plant and a\ntypical user's requirements and functional design specifications.\nIn the real world, engineers have different approaches and philosophies when it comes to engineering\na project. We recommend that you follow our Best Practices guide to engineer your solution.\nKeep in mind that default installation folders are structured in a specific way for a reason and you\nshould strive to adhere to them wherever possible to avoid loss of data during backup procedures.\nThe outcome of this exam is that, should you be successful, we will feel very comfortable in\nrecommending you to any of our customers. We also believe that you will be able to charge a premium\nfor your services in the field. If you are working for an end customer, then we feel that your\norganisation will be in very good hands. This is not an easy task, but we believe you will be justifiably\nproud once you successfully complete it.\nAll of Adroit's software products, drivers, knowledge base, help files and how to videos are available\nfrom the website https://adroitscada.com/\n2. Prerequisites\nIt is advised that you attend the Adroit SmartUI Basic, Adroit SmartUI Advanced, and Report Suite\nand Alarm Management courses before attempting this exam, however there is no substitute for\nexperience, and anyone can attempt the exam anytime.\nWe recommend that you familiarise and even base your exam project on our Best Practises, the\nsample Standards and FDS/DRP Documents that can be found on our website or obtained from our\nSupport Department.\nThe Certified Engineers Exam Documentation:\nThis document, the Certified Engineer Exam User Requirement Specification (URS).\nAdroit Certified Engineer Exam - Disaster Recovery Procedure (DRP) Template.\nAdroit Certified Engineer Exam - Function Design Specification (FDS) Template.\nAdroit Certified Engineer Exam - Supporting Excel Spreadsheets:\no I/O Schedule,\no Problem Solving Tasks, Marking Sheet and Summary.\n\n[Page 6]\nATQMS-TRNG-DOC-ACE-User Requirments Specifications 2025.docxATQMS-TRNG-DOC-Adroit Certified Engineer Exam URS 2025.docx\nP a g e | 5\n3. The User Requirements Specification (URS)\n3.1.\nProject Requirements\nABC Spices are in need of a simple batching system to produce their range of Juices for use in the\nfood industry. The plant is simple since their juices consist of water mixed with two ingredients for a\nspecified amount of time. These juice recipes need to be created and stored in a SQL Express\ndatabase. The system needs to enable the operator to select a juice to be manufactured and to then\ndownload the target values for that recipe from the database to the Adroit Batch OPC Server on which\nthe system is based (This sample Batch OPC Server is installed with any Adroit system).\nThe Database needs to contain the following fields:\nProduct Name,\nTarget Mass Ing A,\nTarget Mass Ing B,\nTarget Mass H2O,\nTarget Temperature and\nMixing Time\nThe company makes four recipes/products namely; Apple Juice, Peach Juice, Pear Juice and Grape\nJuice . The batching plant consists of a single mixing bin which has a capacity of 1000 kg in which the\ntwo required ingredients are added automatically once the batch is started from within the simulation\nBatch OPC Server.\nThe Batch OPC Server has been designed to simulate PLC operation. Water is dispensed from a pump\nautomatically, again, controlled by the Batch OPC Server.\nIt is important that the plant runs with a hot standby Agent Server configuration and has one remote\nclient connected for remote viewing purposes.\nDW Asked the following question.\nWhat licensing do I need for an Adroit with 30 scan points and runs in a hot standby Agent Server\nconfiguration and has one remote client connected for remote viewing purposes?\nIt is critical that we keep a record of each batch by inserting the relevant information from each batch\ninto the SQL database. You will need to ensure that each batch record contains the following\ninformation:\nBatch Number\nBatch Start Time & Batch Stop Time ensuring that the record ends up in SQL as a Date & Time\nProduct Name\nTarget Mass for Ing A (kg), Ing B (kg), H2O (Water (l)), Mixing Time (sec)\nActual Mass for Ing A (kg), Ing B (kg), H2O (Water (l)), Mixing Time (sec)\nComment on the Batch entered by the Operator\nWhat Adroit Agent should I use to send my Batch data to a SQL Server database and do I need a\nlicense for this functionality?\nFormatted: Indent: Left: 0 cm, First line: 0 cm\n\n[Page 7]\nATQMS-TRNG-DOC-ACE-User Requirments Specifications 2025.docxATQMS-TRNG-DOC-Adroit Certified Engineer Exam URS 2025.docx\nP a g e | 6\nThe operator's interface should be uncluttered, pleasing and navigation between screens must be\nclear and logical. Navigation should be achieved by the use of templates wherever possible to ensure\nthat maintenance is kept to a minimum. Templates should also be used wherever it is necessary to\nuse common screens, such as maintenance and running hour screens.\nWhat is the best practise suggestion for designing an uncluttered UI in Adroit SCADA?\nIs there a best practises document I can use to help me design the operator interface?\nThe plant needs to be run in both Automatic and Manual mode. Selection between these operation\nmodes must be performed by using a switch on the Control/Management Graphic Form. This plant\nstatus should be displayed on the Operator/Plant Graphic Form in addition to the Control/Management\nGraphic Form, the change to Manual can only be performed by Engineers or Electricians, not by\nOperators.\nThe Automatic mode will require the plant to be in a \"Stopped\" state, which can be reset from a\nbutton on the control screen thus resetting the entire plant. The operator needs to select a product\nto be manufactured and then press a button to \"Start\" the process.\nThe status of the PLC will then change to \"Batching\". The details of the required recipe must then be\nloaded and clearly displayed in a logical format. The required information includes the \"target\" masses\nof the ingredients as well as the required mixing time and temperature. Other information is available\nand should be utilised and presented to the Operators logically. The currently logged on user must be\ndisplayed through the use of Graphic Form scripting. (There is a knowledge base article on how to\nachieve this in the Adroit Knowledge Base which can be found on the website).\nOnce the target masses are generated by the simulation Batch OPC Server, it will start the \"Mixing\"\nphase and change the status integer accordingly. This integer is found in the I/O schedule attached.\nThis will start an Agitator/Mixer and you will need to display the start and end times for the batch,\nthe current status of the plant as well as all the other states of the physical plant.\nHow do I setup the OPC Driver in Adroit?\nOnce the Mixing is complete, the \"Heating\" phase will begin where the mixture will be heated to a\npredefined temperature as set by the operator. Once the heating phase is complete, the valve under\nthe mixing tank will open automatically and the mix will discharge at the set rate.\nThe status integer at this stage will be changed to reflect \"Discharging\". Once empty, the status will\nchange to \"Batch Complete\" and a button to allow the Operator to commit the records to the database\nshould become enabled or visible.\nThe complete record of the Batch must then be written to a database, including a comment field in\nwhich the Operator can enter some free text, prior to pressing a button to update the batch record\ndatabase. Once the transaction is complete you will need to reset the plant, setting it into the\n\"Stopped\" state once again. On a Graphic Form, the Operator needs to be able to select a date/time\nrange and return and display all records associated with that selection.\nA Functional Design Specification document must be submitted. (as per our attached template)\nI need an FDS document example for my project, where can I find it?\n\n[Page 8]\nATQMS-TRNG-DOC-ACE-User Requirments Specifications 2025.docxATQMS-TRNG-DOC-Adroit Certified Engineer Exam URS 2025.docx\nP a g e | 7\n3.2.\nNavigation and Screen Layout\nUsing a TGONavToolbar on the bottom quarter of the Operator Screen you need to be able to navigate\nbetween the Trend screen, the Event Viewer and the Alarm Viewer, each replacing the other. The\n75% of the Operator Screen must be reserved for the graphical representation of the plant. The\ndefault layout/workspace must be the Operator screen with the Trend screen displayed. The\nnavigation should be done through a menu on the left and a TGO in which the Graphic Forms will be\nloaded.\nHow do I use the TGONavToolbar control in a graphic form ?\n3.3.\nMaintenance and MIS\nIn the event of a catastrophic SCADA system failure, a Disaster Recovery Procedure (DRP) document\nmust exist detailing the steps to follow to recover the entire system from a backup, as well as hardware\nrequirements and any other relevant information. This document needs to be submitted with the rest\nof the exam.\nWhat sort of Adroit information would I need in a Disaster Recovery Procedure document for an Adroit\nSCADA system?\nIn order to give the maintenance staff additional assistance with each motor, the electrician must\nbelong to his own Windows security group. It is also important that the running hours of each pump\nand the number of times that it has been stopped and started (in either Auto/Man) is recorded via a\nsecond 'running stats' template that must be opened by way of an Execute command behaviour\ntriggered from a mouse hover event on the text describing of the motor on the Operator Screen.\nWhat Agent would I use to track the running hours of a pump?\nThe mixing motor and the water pump should be able to be operated in Auto/Manual mode from a\ntemplate screen that can only be accessed from the running stats Graphic Form. The running totals\nfor each motor can only be reset by an \"Engineer\" with Administrator privileges. However, you also\nneed to consider the following requirements.\nThe Control/Management Graphic Form must display the following information:\nWhich Agent Server is the Master\nThe average number of putslots happening in the system.\nThe HASP serial number.\nThe status of the Device health (OPC Server).\nAdroit recommends that you always have at least 25% spare capacity on the memory usage on\nthe SCADA PC. Therefore display the PC Memory Usage. This value must be alarmed accordingly.\nWhat Agent would give me details such as the Adroit Cluster Name and the HASP Serial number?\nThe status of the device needs to be displayed on the control screen and should the OPC Server fail\nraised.\n\n[Page 9]\nATQMS-TRNG-DOC-ACE-User Requirments Specifications 2025.docxATQMS-TRNG-DOC-Adroit Certified Engineer Exam URS 2025.docx\nP a g e | 8\nWhat Agent and Slot would give me details of the health of an OPC Driver?\n3.4.\nSecurity\nUsing Windows local security create three levels of user groups and named users.\n1. Operators/Operator\na. Can operate the plant but cannot access the Running and Maintenance templates, can\nreset the plant.\n2. Electricians/Electrician\na. Can access everything the Operators can as well as access the Running and Maintenance\ntemplates, but they cannot reset the running statistics of the motors.\n3. Engineers/ Engineer (Administrator)\na. Can access everything the Operators/Electricians can as well as access the Running\nand Maintenance templates, and they can reset the running statistics of the motors.\nAs it is not possible to submit your user and group structure with the Adroit configuration backup, you\nare required to add the Windows security procedures to your Disaster Recovery Procedure document.\nPlease provide only the details of the user and group configur"}, {"title": "Objects Toolbox - Help", "href": "supporting_docs_html/Objects_Toolbox_Help.html", "category": "Supporting Docs", "rel": "supporting_docs_html/Objects_Toolbox_Help.html", "kind": "Supporting Doc", "text": "[Page 1]\nObjects Toolbox - Help\nOverview\nThe Objects Toolbox is a left-side panel in the Smart UI Designer that lets you browse, filter,\nand manage assets stored in the Object Repository project. Assets include Graphics\n(reusable graphic objects), Wizards (wizard-based graphic objects), Templates (template\nassets i.e. popups and faceplates etc.), and Objects (object templates with configurable\ninstances).\nYou can drag assets from the toolbox onto an open Graphic Form, preview asset details,\nmanage object instances, and perform repository actions from a context menu.\nThe toolbox is populated from assets in the Object Repository - typically assets you\ndownload from the Asset Library tab in the Designer.\n\n[Page 3]\nFigure 2: Asset Library embedded in Asset Library tab in Smart UI Designer\nPrerequisites\n• Connect to a server - the toolbox loads data from the Object Model datasource.\n• Load the Asset Library (if adding new assets) browse and download graphics,\nwizards, templates, and object templates. Downloaded assets are imported into the\nObject Repository and appear in the toolbox after refreshing.\n• Open a Graphic Form - drag-and-drop targets an active graphic form design\nsurface.\nOpening the Objects Toolbox\nThe Objects Toolbox appears as a dock panel titled Objects on the left side of the Designer.\nTo show or hide it:\n• Go to the View ribbon tab.\n• In the Content section, click Objects Toolbox.\nYou can dock, resize, or auto-hide the panel like other Designer panels.\n\n[Page 5]\nInterface Overview\nFilter bar ( )\nControl\nPurpose\nFilters items by name (case-insensitive)\nShow\nMulti-select filter by asset type: Graphics,\nWizards, Templates, Objects\nBoth filters work together. Category folders stay visible only if they contain matching items.\nFigure 5: Filter assets by name and type\nAsset tree (main area)\nAssets are shown in an expandable accordion tree, organized by category folders matching\nthe folder structure in the Object Repository.\nEach item shows:\n• An icon (preview thumbnail for most assets; special icons for object templates and\ninstances)\n• A colored vertical bar on the left indicating asset type\n• A tooltip on hover with name, description, type, and a preview image (when\navailable)\n\n[Page 7]\nFilter by type\nUse the Show dropdown to include or exclude Graphics, Wizards, Templates, and Objects.\nAll four types are selected by default.\nAdding Assets to a Graphic Form (Drag and Drop)\n• Open the Graphic Form you want to edit.\n• In the Objects Toolbox, locate the asset.\n• Left-click and drag the asset onto the graphic form design surface.\n• Release to drop.\nAsset type\nDrop result\nInserts a Graphic Object\nWizard\nInserts a Wizard Graphic Object, prompting\nfor substitutions if required\nInstance\nInserts the Object Instance onto the form,\nprompting for substitutions if required\nTip: Hover over an item before dragging to confirm name, description, and preview in the\ntooltip.\nObject Templates and Instances\nObject templates behave differently from other assets. They appear as expandable groups\n(green bar, cube icon). Instances created from a template appear as child items under that\ntemplate (amber bar, filled cube icon).\nCreating instances\n• Right-click an object template.\n• Choose Create New Instances.\n• Complete the instance creation flow (supports bulk creation of multiple instances).\n• New instances appear under the template; the template expands automatically.\n\n[Page 9]\nInstances\nAction\nDeploy the instance via the Object Model\nEdit Instance\nEdit instance configuration\nDelete Instance\nDelete the instance\nImport Assets\nImport Assets option allows you to import already downloaded Asset zip files into the\nObject Repository. This is useful when connecting with a Designer when there is no internet\nconnectivity available to connect to and view the Asset Library.\nView Details\nView Details opens a flyout panel showing Name, Description, Type, a preview image, and a\nthumbnail strip when multiple preview images exist. The flyout closes when you click\noutside it or move the mouse away.\nFigure 7: Asset Preview via View Details\nCopy Path (Templates and Wizards)\nCopy Path puts the asset's DataElement path reference on the clipboard, for example:\n{ServerName}.Object Repository.{Category}.{AssetName}.{FileName}\nUse this when you need the exact reference in scripts, bindings, or other Designer tools.\n\n[Page 10]\nTypical Workflows\nWorkflow 1: Add a graphic from the Asset Library to a form\n• Connect to the server and open the Asset Library tab.\n• Download the desired graphic - it is imported into the Object Repository.\n• Open the Objects panel (Objects Toolbox).\n• If the asset does not appear, right-click and choose Refresh.\n• Drag the graphic onto your Graphic Form.\nWorkflow 2: Use an object template with instances\n• Download the object template from the Asset Library, if you not already.\n• Locate the object template in the Objects Toolbox (green bar).\n• Right-click and choose Create New Instances.\n• Expand the template to see its instances.\n• Drag an instance onto the Graphic Form.\n• Use Deploy Instance or Edit Instance from the context menu as needed.\nWorkflow 3: Clean up unused assets\n• Right-click the asset and choose Delete.\n• Confirm when prompted.\n• The item is removed from the Object Repository and disappears from the tree.\nTips and Troubleshooting\nIssue\nWhat to try\nToolbox is empty\nConfirm you are connected to a server. Use\nRefresh after downloading from the Asset\nLibrary.\nNew download not visible\nThe toolbox refreshes automatically after a\nsuccessful Asset Library import; if not, use\nRefresh manually.\nCannot find an asset\nClear the search box and ensure all types\nare checked in Show.\nDrag-and-drop does nothing\nEnsure a Graphic Form is open and active\nas the drop target.\nInstance actions missing\nRight-click the instance (child item), not\nthe parent template."}, {"title": "Objects Toolbox - Whats New", "href": "supporting_docs_html/Objects_Toolbox_Whats_New.html", "category": "Supporting Docs", "rel": "supporting_docs_html/Objects_Toolbox_Whats_New.html", "kind": "Supporting Doc", "text": "[Page 1]\nWhat's New: Objects Toolbox\nAdroit 11 Smart UI Designer | Release highlight\nExecutive Summary\nThe new Objects Toolbox brings your Asset Library and Object Repository directly into the Smart UI\nDesigner workspace. Designers can browse, search, preview, and place graphics, wizards, and\nobject instances on Graphic Forms without leaving the design surface.\nThis release closes the loop between discovering assets online and using them in production\nprojects - reducing friction, speeding up screen design, and making reusable content easier to\nmanage at scale.\n\n[Page 2]\nFigure 1: Objects Toolbox\n\n[Page 3]\nFigure 2: Asset Library embedded in Asset Library tab in Smart UI Designer\nKey Features at a Glance\nFeature\nWhat it does\nWhy it matters\nObjects Toolbox\npanel\nDedicated left-side panel in Smart UI\nDesigner\nKeeps all repository assets\nvisible while you design\nAsset Library\nintegration\nDownloaded assets appear in the toolbox\nautomatically\nNo manual import steps\nbetween browse and build\nDrag and drop to\nGraphic Forms\nPlace graphics, wizards, and instances\ndirectly on the canvas\nFaster screen assembly with\nfewer clicks\nSearch and type\nfilters\nFind assets by name or category\n(Graphics, Wizards, Templates, Objects)\nScales well as libraries grow\nVisual asset\npreviews\nTooltips and View Details flyout with\nimages and descriptions\nChoose the right asset before\nplacing it\nObject template\nCreate, edit, deploy, and delete instances\nfrom one place\nStandardizes object reuse\nacross projects\nBulk instance\nCreate multiple instances from a template\nin one action\nSaves time on large\ndeployments\nContext menu\nCopy path, view documentation, import,\nrefresh, expand/collapse, delete\nPower-user workflows without\nleaving the panel\nColor-coded asset\ntypes\nInstant visual identification of graphics,\nwizards, templates, and objects\nReduces errors and improves\nscanability\n\n[Page 4]\nFeature Highlights\nAll your assets, one panel\nBrowse the full Object Repository without switching tools.\nThe Objects Toolbox organizes graphics, wizards, templates, and object templates in a searchable\ntree aligned with your repository categories. Everything you download from the Asset Library is\nready to use in the same workspace where you design Graphic Forms.\nCustomer benefit: Less context switching means faster project delivery and a smoother designer\nexperience.\nDrag, drop, done\nPlace assets on Graphic Forms in a single gesture.\nSelect any supported asset and drag it onto an open Graphic Form. Graphics and wizards become\ndesign elements immediately; object instances connect to your Object Model with the correct\nreferences built in.\nCustomer benefit: Accelerates HMI and SCADA screen development for both new and experienced\nusers.\nFind what you need, fast\nSearch and filter as your library grows.\nA built-in search box and multi-select type filter help teams locate the right asset among hundreds\nof items. Category folders expand and collapse so large libraries stay manageable.\nCustomer benefit: Supports enterprise-scale content libraries without slowing designers down.\n\n[Page 5]\nFigure 3: Filter assets by name and type\nPreview before you place\nSee details and thumbnails before committing to the canvas.\nHover tooltips show name, description, type, and preview images. View Details opens a rich flyout\nwith larger previews and gallery of multiple thumbnails when available. If the documentation\nreference is a URL, it opens in the browser; if it is a file, the file opens directly.\nCustomer benefit: Fewer mistakes, better asset reuse, and more confidence in design decisions.\nFigure 4: Asset Preview via View Details\nObject templates and instances, simplified\nManage reusable object definitions and their live instances in one view.\nObject templates appear as expandable groups with dedicated icons. Create new instances\n(including bulk creation), edit configuration, deploy to runtime, or remove instances - all from a\n\n[Page 6]\nright-click menu. Instances are visually distinct and draggable onto Graphic Forms like any other\nasset.\nCustomer benefit: Makes standardized equipment and process objects easier to roll out\nconsistently across sites and projects.\nStays in sync with your library\nRefresh when you need it; auto-update when you download.\nAfter downloading from the Asset Library, new assets flow into the Object Repository and the\ntoolbox refreshes automatically. Manual refresh is also available anytime from the context menu.\nManual import of already downloaded Asset zip files into the Object Repository via the Objects\nToolbox is available when there is no internet connectivity.\nCustomer benefit: Teams always work with the latest approved content.\nBefore and After\nBefore\nAfter\nBrowse assets in one place, import or locate\nthem elsewhere\nBrowse and use assets in the same Designer\npanel\nLimited visibility into repository content while\ndesigning\nLive tree of all repository assets beside the\ncanvas\nManual steps to place reusable graphics and\ntemplates\nDrag and drop directly onto Graphic Forms\nObject instances managed through separate\nworkflows\nCreate, deploy, edit, and delete instances\nfrom the toolbox\nHard to preview asset content before use\nTooltips and detail flyout with images and\ndescriptions\nWho Benefits\nAudience\nHMI / SCADA designers\nFaster screen building with immediate access to approved\ngraphics and templates\nSystem integrators\nQuicker rollout of standardized objects and instances across\nprojects\nAsset Library curators\nClear path from published content to in-project usage\nOperations and engineering\nteams\nConsistent reuse of validated design components\nTraining and support\nSingle, intuitive panel to teach asset discovery and placement"}, {"title": "Python Scripting Integration - Help", "href": "supporting_docs_html/Python_Scripting_Integration_Help.html", "category": "Supporting Docs", "rel": "supporting_docs_html/Python_Scripting_Integration_Help.html", "kind": "Supporting Doc", "text": "[Page 1]\nPython Scripting Integration - Help\nOverview\nThe Adroit Smart UI Designer supports Python as a third scripting language alongside Microsoft\nVisual Basic.NET and Microsoft C# (CSharp) for scripts in Graphic Form scripting, Script Spiders\nand Script Datasource. Python scripts are executed using Python.NET (pythonnet), which embeds\nthe Python interpreter inside the .NET runtime and allows Python code to call .NET assemblies and\ninteract with Smart UI components through the same INeed interfaces used by C# and VB.NET\nscripts.\nThis help covers configuring Python as your default scripting language, using the Script Editor for\nPython, managing Python packages, and writing Python scripts in the Designer.\nHow Python Scripts Are Executed\nUnlike C# and VB.NET scripts, Python scripts are not compiled into a .NET assembly. The Script\nEngine uses Python.NET to:\nInitialize the Python runtime and connect to the Python 3.13 interpreter installed with the\nproduct.\nCreate a Python execution scope and load referenced .NET assemblies using\nclr.AddReference.\nExecute the script source text within that scope.\nCall the script main(ctx) function, passing a context object with Application, Connection,\nController, Inputs, Outputs, and Control.\nDefault Python interpreter location:\nOptional: Set the PYTHONNET_PYDLL environment variable to point to a different Python DLL.\nSetting Python as the Default Scripting Language (Profile\nDataSource)\nThe default scripting language for new scripts is determined by the profile associated with the\nlogged-in user. Profiles are managed through the Profile DataSource in the Designer.\nTo set Python as the default:\nExpand the Profile DataSource and select (or create) the required profile.\n\n[Page 2]\nConfigure the profile and in the Profile Properties, locate the Script Language setting.\nSelect Python from the drop-down list (options: Microsoft Visual Basic.NET, Microsoft C#,\nPython).\nSave the profile configuration.\nWhen a user assigned to this profile creates a new script, the Script Editor opens with Python\nselected and the default Python template loaded.\nNote: The profile must also specify the Built-in script editor for scripts to open in the Designer\nScript Editor. You can override the profile default per script using Build > Languages in the Script\nEditor.\nYou may use other external Script Editors such as Visual Studio or Visual Studio Code to edit your\nPython scripts. This can be configured in the Script Editor setting in your profile.\n\n[Page 4]\nFor C# and VB.NET, external assemblies are managed via Build > References. For Python scripts:\nReferences menu and toolbar button are hidden.\nPackages menu and toolbar button are shown instead.\nSolution Explorer and Class View panels are hidden (Python packages are environmentlevel, not per script).\n.NET assembly references for Python are declared in script source using clr.AddReference\nstatements in the default template.\nFile Operations\nThe Script Editor supports .py files alongside .cs and .vb files for open and save operations.\nCompile and Run\nPython scripts are not traditionally compiled. Build > Compile validates the script is not at default\ntemplate text. Build > Compile and Run executes via Python.NET. Every Python script must define\nmain(ctx). Runtime errors appear in the Output window.\nPython Package Manager\nThe Python Package Manager dialog installs, views, and removes Python packages in the shared\nPython 3.13 environment. It uses pip for all operations.\n\n[Page 5]\nImportant: Unlike .NET references for C#/VB.NET, Python packages are NOT stored per script\nobject. Packages are installed into the common Python environment and available to all Python\nscripts.\nTo open: Edit a Python script, then click Build > Packages or the Packages toolbar button.\nView Installed Packages\nOpen the Python Package Manager while editing a Python script.\nThe upper list shows package name and version.\nClick Refresh to reload the list.\nInstall from Online Repository\nEnter the package name (e.g. numpy) or pip specifier (e.g. numpy==1.26.4) in the package\nname field.\nClick Install. Requires network access.\nAfter installation, import in scripts: import numpy\nInstall from Local File (Offline)\nClick Install from File and select a .whl (wheel) file.\nEnsure the wheel is compatible with Python 3.13 and your platform.\nUninstall a Package\nSelect the package in the list and click Uninstall selected.\nConfirm the uninstall. The package is removed from the shared environment.\nWriting Python Scripts\nNew Python scripts receive a default template containing:\nimport clr and clr.AddReference calls for .NET and Smart UI assemblies.\nPython import statements for common namespaces.\nGlobal variables: MyConnection, MyApplication, MyController, MyGraphicObject, MyInputs,\nMyOutputs.\nmain(ctx) entry point that receives the runtime context.\nInitializeVIZNETComponents() for component bindings and event handlers.\n\n[Page 6]\nThe main(ctx) Entry Point\nContext Property Description\nctx.Application\nIObjectManager - application-level functions\nctx.Connection\nServer connection and functions\nctx.Controller\nINeed controller for spiders/controls by name\nctx.Control\nGraphic object or host control\nctx.Inputs\nInput data elements\nctx.Outputs\nOutput data elements\nAccessing .NET from Python\nAdd reference: clr.AddReference(\"AssemblyName\")\nImport namespace: import Namespace.Path or from Namespace.Path import ClassName\nThe default template pre-loads commonly used Smart UI and System assemblies.\nProperty Grid Integration\nComponents and event handlers can be added to Python scripts from the Property Grid when\nworking with Script Engine spiders. Code is automatically inserted into\nInitializeVIZNETComponents(). The default template must contain this function.\nDifferences: Python vs C#/VB.NET\nFeature\nC# / VB.NET\nPython\nExecution\nCompiled to .NET assembly\nInterpreted via Python.NET\nEntry point\nMain() method\n.NET References (per script) Python packages (shared) + clr.AddReference\nIndentation\nTabs (default)\nSolution Explorer Shown\nHidden for Python\nCompile\nFull compilation\nRuntime execution, no traditional compile\nHelp and Learning Resources\nScript Editor Help menu links:\nOfficial Python Documentation - https://docs.python.org/3/\nPython Tutorial (W3Schools) - https://www.w3schools.com/python/\n\n[Page 7]\nTroubleshooting\nmain(ctx) not defined: Use Build > Languages > Reset Script Source to restore the default\ntemplate.\nImport error for package: Verify package in Python Package Manager; reinstall if needed.\nPackage install fails: Check network for online installs; use Install from File with compatible\n.whl (Python 3.13).\n.NET type not found: Add clr.AddReference(\"AssemblyName\") before importing.\nWrong language selected: Confirm Python under Build > Languages or set Python in Profile\nDataSource."}, {"title": "Python Scripting Intergration - Whats New", "href": "supporting_docs_html/Python_Scripting_Intergration_Whats_New.html", "category": "Supporting Docs", "rel": "supporting_docs_html/Python_Scripting_Intergration_Whats_New.html", "kind": "Supporting Doc", "text": "[Page 1]\nWhat's New: Python Scripting for Adroit Smart UI\nAdroit 11 Smart UI | Release highlight\nUnlock the Power of Python in Adroit Smart UI\nAdroit Smart UI now includes native Python scripting support, enabling engineers and\ndevelopers to automate tasks, extend system functionality, and build sophisticated\nsolutions using one of the world's most popular programming languages.\nPython scripting is available throughout the Smart UI platform, including Graphic Form\nscripting, Script Spiders, and the Script Datasource, allowing users to implement custom\nlogic wherever it is needed.\nPython scripts can run directly within Adroit Smart UI while interacting seamlessly with\ndatasources, dataelements, graphic forms, vectors & controls, spiders and application\nservices.\nFigure 1: Selecting Python as your Script Language from your profile\nKey Benefits\nAccelerate Development\nLeverage Python's simplicity and extensive ecosystem to create automation, calculations,\nintegrations, and custom business logic faster than ever before.\nAccess Smart UI Objects Directly\nPython scripts have access to Smart UI datasources, dataelements, graphic forms, vectors\n& controls, spiders, application settings, communications interfaces, and logging services,\nallowing developers to build powerful solutions without leaving the platform.\nUse Your Preferred Development Environment\nDevelopers can edit scripts directly in Smart UI with the built-in Script Editor or launch\nthem into Microsoft Visual Studio or Visual Studio Code for a richer editing and debugging\nexperience, including IntelliSense, breakpoints, and variable inspection.\n\n[Page 2]\nFigure 2: Selecting Visual Studio Code as your external script editor from your profile\nFigure 3: Graphic Form script opened in Visual Studio Code\nBuilt-in Python Package Manager\nExtend your scripting capabilities without leaving the application. The built-in Python\nPackage Manager allows users to easily install, update, and remove Python packages\ndirectly from the built-in Script Editor, simplifying the setup of third-party libraries and\nreducing development time.\nKey Benefits\nInstall and manage Python packages from within the application.\n\n[Page 3]\nQuickly add functionality using popular open-source libraries.\nEliminate the need for external package management tools.\nStreamline script development and deployment workflows.\nMaintain control over installed dependencies in a centralized location.\nFigure 4: Built-in Python Package Manager launched from the Built-in Script Editor\nSimplified Script Management\nAutomatic file monitoring and script reloading ensure that updates are detected and\napplied quickly, reducing downtime during development and maintenance.\nEnterprise-Ready Reliability\nScripts execute within a controlled environment with error reporting, logging, timeout\ncontrols, and safeguards designed to protect the stability of the host application.\n\n[Page 4]\nTypical Use Cases\n• Advanced calculations and data transformations\n• Automated workflows and business logic\n• Alarm handling and event-driven actions\n• Database integration and report generation\n• REST API and web service integration\n• Custom operator dashboards and user interactions\n• Scheduled maintenance and housekeeping tasks\n• Historical data analysis and KPI reporting\n• Integration with MES, ERP, CMMS, and other enterprise systems\n• Predictive analytics and condition monitoring\nThese capabilities are further enhanced through support for popular Python libraries and\nframeworks.\nDeveloper Productivity Features\nPython scripting includes:\nBuilt-in Python editor support\nSyntax highlighting and code folding\nIntegration with Visual Studio and Visual Studio Code\nIntelliSense support\nBuilt-in Python Package Manager\nBreakpoint debugging (with the help of python packages or Visual Studio\nextensions)\nRuntime error reporting\nAutomatic script reload on file changes\nServer-side script scheduling and execution management\n\n[Page 5]\nWhy It Matters\nPython has become the preferred language for automation, data science, artificial\nintelligence, systems integration, and rapid application development. By bringing Python\ndirectly into Adroit Smart UI, organizations can leverage existing Python skills and libraries\nwhile maintaining full access to their operational technology environment.\nThe result is faster solution delivery, greater flexibility, and a significantly expanded\nintegration ecosystem for Smart UI applications."}, {"title": "PythonScript Agent", "href": "supporting_docs_html/PythonScript_Agent.html", "category": "Supporting Docs", "rel": "supporting_docs_html/PythonScript_Agent.html", "kind": "Supporting Doc", "text": "[Page 1]\nPythonScript Agent\nAugust 21, 2026\nThe Python Script (PythonScript) Agent\nIntroduction\nThe PythonScript agent is designed to allow for execution of Python scripts. Scripts will be run outside of the\nagent server process to protect the agent server process. Python scripts will have the ability to communicate to\nthe agent server process via Adroit's OLE Automation component.\nFuture versions of the agent may allow for embedded running of python scripts.\nOperation\nPython must be installed on any agent server PC's requiring to run PythonScript agents.\nThe Adroit 11 installer will ensure that Python application as well as the pywin32 package is installed on the\nagent server computer. However, if Python has already been installed, the agent allows you to configure the\npath to python.exe.\nOn installing Adroit, you will have had the option of installing the Python environment, if you do not already\nhave Python installed. Adroit will install Python to your C:\\Program Files\\Adroit Technologies\\Python folder\ntogether with the pywin32 and adroit-py (Adroit OLE Python) packages. Python scripts are able to interact with\nthe agent server using Adroit OLE Python package.\nIf you have Python already installed, you will need to\ninstall the PyWin32 package as follows:\npip install pywin32\ninstall the Adroit OLE Python package as follows:\nThe Adroit OLE Python package (zip file) can also be download from [to be decided]. The Adroit OLE Python\nzip file contains:\nadroit_py-0.1.0-py3-none-any.whl - this file must be copied to your pc and installed as follows:\npip install adroit_py-0.1.0-py3-none-any.whl\nmyscript.py - a sample python script showing how to use the Adroit OLE package\nThe agent then allows you to specify the full path to the python script to be run. Python scripts should include\nthe provided adroitole.py script for programmatic access to Adroit's OLE Automation component which will\nallow you to get (fetch) and set (poke) tag values.\nThe python script will run without a visible console window. Therefore …\nThe use of print() statements in your scripts will never be visible\nDo not use input() statements in your python script otherwise the python.exe instance will remain in\nprocess space until manually terminated!!\n\n[Page 2]\nP r e l i m i n a r y\nAugust 21, 2026\nThe script can be configured to run synchronously or asynchronously. The script is always invoked on a\nseparate thread to avoid holding up other agent server processes. In asynchronous mode the thread will\nterminate immediately after setting off the python process. In synchronous mode the thread will only terminate\nafter the python process has terminated.\nOnce the thread is created to launch the script, a busy status bit will be set until the thread is terminated. Before\nterminating the thread will pulse the completed status bit to indicate completion.\nThe agent supports a list of trigger tags. Triggers tags may be individually enabled/disable. For each trigger tag\nthe type of trigger may be configured viz any value change, rising edge (0->n) or falling edge (n->0).\nOther than the ability to add trigger tags, this agent does not cater for scheduling of scripts\nThis agent does not support realtime catchup.\nScripting examples\n3.1\nThe following code shows the ability to execute a script with or without parameters\nimport sys\ndef HelloWorld():\nprint(\"Hello World!\")\ndef DoSomething(str):\nprint(str)\n# --- simply running a script file with no parameters\nif __name__ == \"__main__\":\nif len(sys.argv) == 1:\nHelloWorld()\nsys.exit(0)\n# --- running a script file with parameters DoSomething \"Hello World\"\nif len(sys.argv) == 3 and sys.argv[1] == \" DoSomething \":\nDoSomething (sys.argv[2])\nsys.exit(0)\n# --- if we get this far than the script was not called correctly, set agent's error status to true\n# by exiting with a a non-zero code. This will also show cause the agent's info slot to show\n# \"Process finished with error code: 1\"\nsys.exit(1)\n3.2\nAdvanced script showing agent server interaction\nThe following code shows how to interact with Adroit\n# Sample script demonstrating the use of AdroitOLE COM wrapper to interact with Adroit SCADA system.\n# This script creates analog agents, sets alarms, scans tags, logs data, and performs various\noperations.\n# Revision: 1.0\n# Date: 2026-01-22\nfrom datetime import datetime, timedelta\n\n[Page 4]\nP r e l i m i n a r y\nAugust 21, 2026\nPlease note when running your Adroit enabled scripts from the command-line (cmd.exe) for testing purposes,\nyou must be running the command-line window as administrator (elevated mode) otherwise you will not be able\nto communicate to the Adroit Agent Server which always runs in elevated mode.\nAgent Slots\nAs of Rev\n4.1\nAgent Specific Slots\nThe following slots are available in the scheduler agent:\nSlot name\nSlot type\nMonitor python script file timestamp and reload file if timestamp changes (for\nembedded mode only)\neditorPath\nSTRING\nFull file path to script code editor application - default adrscriptedit.exe\nembedded\nBOOLEAN\nenable embedded mode - for future use only\nenable\nBOOLEAN\nFeedback information. If a script error occurs sys.exit(nnn) calls will set this slot\nvalue to show \"Process finished with error code: nnn\"\nparameters\nSTRING\nOptional parameters to be passed to script\npythonPath\nSTRING\nFull path to Python.exe. Will default to C:\\Program Files\\Adroit\nTechnologies\\Python\\Python.exe if it exists.\nreloadNow\nBOOLEAN\nReload script - only valid for embedded mode\nrunNow\nBOOLEAN\nExecute script now\nrunTime\nBOOLEAN\nTime taken for script to complete execution in ms\nscriptFn\nSTRING\nFilename of script to be launched. If scriptFn does not contain a full path, it will be\nsearched for in the Adroit project data folder\nsynchronous\nBOOLEAN\nRun script synchronously - default 0\ntriggerList\nLIST\nList of trigger tags\n4.2\nStatus slots\nScript has been launched and is running. In synchronous mode, bit will be turned off prior to setting\ncomplete status. In asynchronous mode, bit will be turned off when script has completed.\ncomplete\nScript has been launched (in synchronous mode) or completed (in asynchronous mode)\nerror\nAn error has occurred\n\n[Page 10]\nP r e l i m i n a r y\nAugust 21, 2026\nFor passing lists/dicts: build PyList_New or PyDict_New accordingly.\nThis approach gives you full control: pass parameters, get return values, and handle errors - all from your MFC C++ application. Let me\nknow if you want to pass complex data (lists, dicts) or capture print() output!\nHow do I give the python scipt access to a COM object?\nTo give your embedded Python script access to a COM object (e.g., Excel, Outlook, or a custom MFC-exposed COM server), use the\npywin32 library (win32com.client). This works seamlessly in embedded Python, as long as you set up your project correctly.\n7.\n1. Prerequisites and Project Setup\nInstall pywin32 in your Python environment (matching the embedded version): pip install pywin32.\nFor embedded/distributed apps, include pywin32 DLLs (pythoncomXX.dll, pywintypesXX.dll) and run post-install if needed.\nLink your MFC project against the same Python libs.\nCall Py_Initialize() early (e.g., in InitInstance()).\nImportantly: Call pythoncom.CoInitialize() (or CoInitializeEx) before any COM usage in the thread running Python code. The\nmain thread often initializes automatically via pywin32, but call it explicitly for safety.\nC++\n#include <pythoncom.h> // From pywin32\n// In your Python execution function or InitInstance\npythoncom::CoInitialize(); // Or pythoncom::CoInitializeEx(0, pythoncom::COINIT_APARTMENTTHREADED)\nCall pythoncom::CoUninitialize() on thread exit if needed.\n8.\n2. Python Script Accessing External COM Objects (Most Common)\nYour Python script can create and use standard Windows COM objects directly.\nExample Python script (myscript.py):\nPython\nimport win32com.client as win32\n# Example: Control Excel\nexcel = win32.Dispatch(\"Excel.Application\")\nexcel.Visible = True\nwb = excel.Workbooks.Add()\nws = wb.ActiveSheet\nws.Cells(1, 1).Value = \"Hello from embedded Python!\"\nws.Cells(2, 1).Value = 42\nprint(\"Excel cell written!\")\n# Example: Outlook\n# outlook = win32.Dispatch(\"Outlook.Application\")\n# mail = outlook.CreateItem(0)\n# mail.Subject = \"Test\"\n# mail.Body = \"Hello\"\n# mail.Send()\nNo extra C++ code needed - just import the module and run as before.\n9.\n3. Passing a C++-Created COM Object (IDispatch*) to Python\nIf you have an existing COM object in C++ (e.g., your MFC app exposes one via IDispatch), wrap it and inject it into Python globals.\nUpdate your function (e.g., after importing the module):\nC++\n\n[Page 13]\nPythonScript Agent\nAugust 21, 2026\nif (PyErr_Occurred()) PyErr_Print();\n// Py_Finalize() on app exit\n11. Tips & Troubleshooting\nUse apartment-threaded model (COINIT_APARTMENTTHREADED) for most GUI/COM apps.\nFor multithreaded Python execution, call CoInitialize per thread.\nErrors like \"coinit not called\" → Add explicit pythoncom.CoInitialize().\nCapture output/errors as shown previously.\nTest simple win32com.client.Dispatch(\"Excel.Application\") first.\nThis gives your Python script full COM access, including external apps or your own C++/MFC COM objects. Let me know the specific\nCOM object (e.g., Excel, custom) if you need a tailored example!\n45 sources\nIs there an alternative to COM for giving the python script access to C++ callback functions\nYes, there are several modern and more straightforward alternatives to COM for allowing an embedded Python script to call C++ functions\n(including callbacks). COM is Windows-specific, heavyweight, and overkill for this scenario. The preferred approaches use Python binding\nlibraries that let you expose C++ functions, classes, and objects directly to Python as a module.\n12. Recommended Alternative: pybind11 (Best Choice in 2024+)\nPython. It's the most popular choice today for both extending (exposing C++ to Python) and embedding Python.\nWhy pybind11 over COM?\nNo COM/IUnknown/IDispatch boilerplate.\nModern C++ syntax, automatic type conversions (including STL containers).\nExcellent support for callbacks: Python functions can be passed to C++ and called later.\nSmaller binaries, faster compile times than older tools like Boost.Python.\nFull embedding support via pybind11/embed.h.\nSetup in Your MFC Project\n\n[Page 16]\nP r e l i m i n a r y\nAugust 21, 2026\napp.set_callback(my_callback) # Register Python func as C++ callback\nThen load/run the file as before (py::eval_file(\"myscript.py\")).\n16. Other Alternatives\nnanobind → A faster successor to pybind11 (from the same author), even smaller/simpler for modern C++ (C++17+). Use if you\nneed maximum performance.\nBoost.Python → Older but still works; similar to pybind11 but heavier (requires full Boost). Good if you're already using Boost.\nManual Python/C API → Possible but verbose and error-prone (lots of PyObject* refcounting). Avoid unless you have very\nspecific needs.\nSWIG → Generates bindings automatically from headers; good for large APIs but more setup and less \"native\" feel.\npybind11 is the cleanest, most maintainable way without the complexity of COM. It's widely used in projects like TensorFlow, PyTorch\nbindings, and many embedded scripting systems.\nIf you need a full MFC-integrated example (e.g., exposing MFC UI callbacks safely across threads), let me know!"}, {"title": "PythonScript Agent - Whats New", "href": "supporting_docs_html/PythonScript_Agent_Whats_New.html", "category": "Supporting Docs", "rel": "supporting_docs_html/PythonScript_Agent_Whats_New.html", "kind": "Supporting Doc", "text": "[Page 1]\nWhat's New: PythonScript Agent\nAdroit 11 Agent Server | Release highlight\nExecutive Summary\nAdroit 11 introduces the PythonScript Agent - a new Agent Server agent that executes\nPython scripts as part of your SCADA automation strategy. Scripts run outside the Agent\nServer process to protect server stability, while the Adroit OLE Python package (adroit-py)\ngives scripts full read/write access to tags, slot information, and historical data through\nWhether you need event-driven calculations, custom integrations, or advanced data\nprocessing at the Agent Server layer, the PythonScript Agent brings Python's ecosystem to\nFigure 1: PythonScript Agent Configuration\n\n[Page 2]\nFigure 2: New Python Script Editor (adrscriptedit.exe)\nKey Features at a Glance\nFeature\nWhat it does\nWhy it matters\nPythonScript Agent\nNew Agent Server agent\n(T_PythonScript.dll) that\nlaunches Python scripts on\ndemand or via tag triggers\nto the Agent Server layer\nagents\nNew Python Script Editor\nNew Python script editor\npowered by the Scintilla,\nfeaturing syntax\nhighlighting, code folding,\nand an enhanced editing\nexperience for faster, more\nefficient script\ndevelopment.\nIt makes maintaining\nPython scripts significantly\neasier and increases\nproductivity and improve\nthe overall scripting\nexperience.\nProcess isolation\nScripts execute in a\nseparate python.exe\nprocess, outside the Agent\nServer\nProtects Agent Server\nstability - a script failure\ncannot crash the server\n\n[Page 3]\nPython package for Fetch,\nSetTag, FetchTags,\nFetchChanges,\nand remote Connect\nScripts interact with live\nSCADA data using a simple,\npurpose-built API\nTrigger tags\nConfigure a list of trigger\ntags with enable/disable,\nvalue change, rising edge,\nor falling edge conditions\nRun scripts automatically in\nresponse to process events\nSync / async execution\nRun synchronously (wait for\ncompletion) or\nasynchronously (fire-andforget); always on a\ndedicated thread\nFlexibility for short\ncalculations vs. longrunning integrations without\nblocking other agents\nScript parameters\nPass optional commandline parameters to scripts\nvia the parameters slot\nReuse one script for\nmultiple scenarios\nConfigurable Python path\nPython or your own\npython.exe installation\nWorks with existing Python\nbundled setup\nStatus feedback\nBusy, Complete, and Error\nstatus bits plus info and\nrunTime slots\nOperators and logic can\nmonitor script execution\nand detect failures\nFeature Highlights\nThe PythonScript Agent is a first-class Agent Server agent. Add it to your project like any\nother agent, configure the script file, and execute it on demand via the runNow slot or\nautomatically through configured trigger tags.\nCustomer benefit: Teams can implement custom logic, calculations, and integrations at\nthe SCADA layer using Python - without custom DLL development.\nSafe, isolated script execution\nPython scripts run in a separate process (python.exe) with no visible console window. The\nAgent Server launches and monitors the process while continuing to serve other agents\nnormally.\nCustomer benefit: Script errors are contained. A non-zero exit code sets the agent's Error\nstatus and reports the exit code in the info slot - the Agent Server keeps running.\n\n[Page 4]\nFull SCADA integration via Adroit OLE Python\nThe adroit-py package provides the AdroitOLE wrapper, enabling scripts to fetch and set tag\nvalues, retrieve slot information, query historical changes and values, and connect to\nremote Agent Servers. Adroit 11 can install Python, pywin32, and adroit-py automatically;\nexisting Python installations are supported with pip install.\nCustomer benefit: Leverage Python's rich ecosystem (pandas, requests, ML libr
