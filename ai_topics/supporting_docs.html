const ITEMS = [{"title": "Adroit Disaster Recovery Document", "href": "supporting_docs_html/Adroit_Disaster_Recovery_Document.html", "category": "Supporting Docs", "rel": "supporting_docs_html/Adroit_Disaster_Recovery_Document.html", "kind": "Supporting Doc", "text": "[Page 1]\nDisaster Recovery Process\nDocument\nCustomer:\n\n[Page 3]\n1.\n2.\n\n[Page 4]\n1. Project Information\nSite Name\nAddress\nOwner\nRepresentative\nContractor\nSub-Contractor\nDate\n2. Introduction\nThis document provides a basic disaster recovery plan. Each customer, project, and site is unique, so\nspecific procedures may vary. It outlines steps to ensure continuity and recovery of a cluster SCADA\nsystem, including OPC services, telemetry radio connections, and local SQL datalogging. The plan\nalso incorporates key stakeholders, critical spares, and pre-identified system risks\n2.1 REQUIREMENTS\na) Access to the site/server room\nb) Backup power in the server room\nc) Cold standby server with latest licenced software loaded.\nd) USB Drive with the latest backups\ne) Admin User Login Credentials\nf)\nNetwork Diagram and IP addresses\ng) Maintain a list of key stakeholders for disaster response\nh) Ensure availability of critical spares (PSU, hard drives, network cards, graphic cards, RAM,\nOS keys, passwords, installation disks, switches)\ni)\nDocument site-specific environmental controls (temperature regulation, humidity)\n2.2 Stakeholders\nMaintain a list of personnel responsible for disaster response:\na. SCADA Administrator / Lead Engineer - Responsible for recovery of SCADA servers and\nsoftware\nb. IT / Network Administrator - Ensures connectivity, firewall rules, switches, and remote access\nc. Database Administrator - Responsible for SQL server and data integrity\nd. Operations Manager / Process Owner - Confirms system operation and verifies critical\nprocess continuity\ne. Maintenance Engineer / Onsite Support - Handles hardware swaps, spare parts, and server\npower issues\nf.\nRemote Support Contact (Adroit Technologies / OEM) - Escalation for technical support\n2.2 COLD STANDBY SERVER ACTIVATION\nIn the event of a disaster, follow the steps below to activate the cold standby server:\na) Keep the standby-server configuration, software, database, and project configuration up to\ndate and test regularly.\nb) Keep some basic server spares onsite.\nc) Use soft licence keys instead of HASP USB keys.\nd) Power on the cold standby server and ensure it is connected to the network.\n\n[Page 5]\ne) Configure the necessary network settings to match the production server.\nf)\nInstall and configure any required software or services on the cold standby server.\ng) Restore the latest project backup from the removable USB drive to the cold standby server.\nh) Verify the connectivity between the cold standby server and the other system components.\nEnsure all spares are readily available for server replacement or component failure\n2.3 PROJECT BACKUP AND RECOVERY\nEnsure the following steps are taken to manage project backups:\na) Regularly back up the project files to the removable USB drive (Scheduled automated\nbackups).\nb) Store the removable USB drive in a secure location onsite.\nc) Connect the removable USB drive to a UPS backup power source and ensure it is accessible\nto the switch.\nd) Test the restoration process periodically to ensure the backup files are valid and can be\nsuccessfully recovered.\ne) Maintain multiple backup locations if possible (offsite or cloud) for added resilience\nf)\nInclude incremental backups for minimal data loss\n2.4 DATA LOG CONNECTOR AND DATA WAREHOUSE SERVER\nVerify the health and connectivity of the data log connectors and data warehouse server as follows:\na) Periodically check the data log connectors to ensure they are functioning correctly.\nb) Validate that the data log connectors are successfully sending data to the data warehouse\nserver.\nc) Regularly test the data warehouse server's ability to receive and process data from the log\nconnectors.\nd) Monitor data replication and storage to confirm the integrity of the data.\n2.5 USER SECURITY AND LOG ON PROCEDURES\nMaintain user security and log on functionality by adhering to the following measures:\na) Regularly review and update user accounts, access levels, and privileges.\nb) Ensure that user credentials are securely stored and encrypted.\nc) Test the log on procedure periodically to verify its functionality.\nd) Establish a process for password recovery and account lockout in case of security breaches.\ne) Regular review of users, privileges, and credentials\nf)\nEstablish password recovery and lockout procedures\n2.6 REMOTE UI SERVER AND COLD STANDBY SERVER ACCESS\nEnable the remote UI server to access the cold standby server with the following steps:\na) Configure network access rules to allow the remote UI server to connect to the cold standby\nserver.\nb) Test the connectivity between the remote UI server and the cold standby server.\nc) Ensure that all necessary software and services are installed and properly configured on the\ncold standby server to support remote access.\nd) Network rules for remote access\ne) Test connectivity\nf)\nEnsure proper software installed for remote access\n\n[Page 6]\n2.7 SYSTEM HEALTH CHECKS\nRegularly perform system health checks to ensure the SCADA system and devices are functioning\noptimally:\na) Develop a monitoring and alerting system to identify any abnormalities or failures in the\nsystem.\nb) Schedule regular system health checks, including device polling and status verification.\nc) Keep all devices and software up to date with the latest patches and updates.\nd) Perform periodic tests to confirm the responsiveness and accuracy of device communication.\ne) Monitoring and alerting\nf)\nDevice polling and status verification\ng) Apply software patches and firmware updates\n2.8 SYSTEM SPARES\nMaintain the following critical spare components onsite to reduce downtime:\nPSU (Power Supply Units)\nHard Drives (OS, SQL, SCADA backups)\nNetwork Cards & Switches\nGraphic Cards\nRAM Modules\nCold standby servers (if multiple servers are available)\nOperating System and SCADA software keys\nInstallation media/disks\n3. Conclusion\nThis disaster recovery document provides guidelines to ensure the continuity and recovery of the\ncluster SCADA system in case of a disaster. Regular testing, monitoring, and backup management\nwill contribute to a reliable and resilient SCADA system.\n4. Approval\nSigned at ______________________________on this date________________________________\nName & Surname Project Engineer\nSigned at ______________________________on this date________________________________\n\n[Page 7]\nName & Surname\nProject Sponsor"}, {"title": "ATQMS-TRNG-DOC-ACE-User Requirments Specifications 2025", "href": "supporting_docs_html/ATQMS-TRNG-DOC-ACE-User_Requirments_Specifications_2025.html", "category": "Supporting Docs", "rel": "supporting_docs_html/ATQMS-TRNG-DOC-ACE-User_Requirments_Specifications_2025.html", "kind": "Supporting Doc", "text": "[Page 5]\nATQMS-TRNG-DOC-ACE-User Requirments Specifications 2025.docxATQMS-TRNG-DOC-Adroit Certified Engineer Exam URS 2025.docx\nP a g e | 4\nThe purpose of this exam is to test your competency in configuring the Adroit SCADA products using\nvarious additional components. Therefore, we have designed the exam around a real plant and a\ntypical user's requirements and functional design specifications.\nIn the real world, engineers have different approaches and philosophies when it comes to engineering\na project. We recommend that you follow our Best Practices guide to engineer your solution.\nKeep in mind that default installation folders are structured in a specific way for a reason and you\nshould strive to adhere to them wherever possible to avoid loss of data during backup procedures.\nThe outcome of this exam is that, should you be successful, we will feel very comfortable in\nrecommending you to any of our customers. We also believe that you will be able to charge a premium\nfor your services in the field. If you are working for an end customer, then we feel that your\norganisation will be in very good hands. This is not an easy task, but we believe you will be justifiably\nproud once you successfully complete it.\nAll of Adroit's software products, drivers, knowledge base, help files and how to videos are available\nfrom the website https://adroitscada.com/\n2. Prerequisites\nIt is advised that you attend the Adroit SmartUI Basic, Adroit SmartUI Advanced, and Report Suite\nand Alarm Management courses before attempting this exam, however there is no substitute for\nexperience, and anyone can attempt the exam anytime.\nWe recommend that you familiarise and even base your exam project on our Best Practises, the\nsample Standards and FDS/DRP Documents that can be found on our website or obtained from our\nSupport Department.\nThe Certified Engineers Exam Documentation:\nThis document, the Certified Engineer Exam User Requirement Specification (URS).\nAdroit Certified Engineer Exam - Disaster Recovery Procedure (DRP) Template.\nAdroit Certified Engineer Exam - Function Design Specification (FDS) Template.\nAdroit Certified Engineer Exam - Supporting Excel Spreadsheets:\no I/O Schedule,\no Problem Solving Tasks, Marking Sheet and Summary.\n\n[Page 6]\nATQMS-TRNG-DOC-ACE-User Requirments Specifications 2025.docxATQMS-TRNG-DOC-Adroit Certified Engineer Exam URS 2025.docx\nP a g e | 5\n3. The User Requirements Specification (URS)\n3.1.\nProject Requirements\nABC Spices are in need of a simple batching system to produce their range of Juices for use in the\nfood industry. The plant is simple since their juices consist of water mixed with two ingredients for a\nspecified amount of time. These juice recipes need to be created and stored in a SQL Express\ndatabase. The system needs to enable the operator to select a juice to be manufactured and to then\ndownload the target values for that recipe from the database to the Adroit Batch OPC Server on which\nthe system is based (This sample Batch OPC Server is installed with any Adroit system).\nThe Database needs to contain the following fields:\nProduct Name,\nTarget Mass Ing A,\nTarget Mass Ing B,\nTarget Mass H2O,\nTarget Temperature and\nMixing Time\nThe company makes four recipes/products namely; Apple Juice, Peach Juice, Pear Juice and Grape\nJuice . The batching plant consists of a single mixing bin which has a capacity of 1000 kg in which the\ntwo required ingredients are added automatically once the batch is started from within the simulation\nBatch OPC Server.\nThe Batch OPC Server has been designed to simulate PLC operation. Water is dispensed from a pump\nautomatically, again, controlled by the Batch OPC Server.\nIt is important that the plant runs with a hot standby Agent Server configuration and has one remote\nclient connected for remote viewing purposes.\nDW Asked the following question.\nWhat licensing do I need for an Adroit with 30 scan points and runs in a hot standby Agent Server\nconfiguration and has one remote client connected for remote viewing purposes?\nIt is critical that we keep a record of each batch by inserting the relevant information from each batch\ninto the SQL database. You will need to ensure that each batch record contains the following\ninformation:\nBatch Number\nBatch Start Time & Batch Stop Time ensuring that the record ends up in SQL as a Date & Time\nProduct Name\nTarget Mass for Ing A (kg), Ing B (kg), H2O (Water (l)), Mixing Time (sec)\nActual Mass for Ing A (kg), Ing B (kg), H2O (Water (l)), Mixing Time (sec)\nComment on the Batch entered by the Operator\nWhat Adroit Agent should I use to send my Batch data to a SQL Server database and do I need a\nlicense for this functionality?\nFormatted: Indent: Left: 0 cm, First line: 0 cm\n\n[Page 7]\nATQMS-TRNG-DOC-ACE-User Requirments Specifications 2025.docxATQMS-TRNG-DOC-Adroit Certified Engineer Exam URS 2025.docx\nP a g e | 6\nThe operator's interface should be uncluttered, pleasing and navigation between screens must be\nclear and logical. Navigation should be achieved by the use of templates wherever possible to ensure\nthat maintenance is kept to a minimum. Templates should also be used wherever it is necessary to\nuse common screens, such as maintenance and running hour screens.\nWhat is the best practise suggestion for designing an uncluttered UI in Adroit SCADA?\nIs there a best practises document I can use to help me design the operator interface?\nThe plant needs to be run in both Automatic and Manual mode. Selection between these operation\nmodes must be performed by using a switch on the Control/Management Graphic Form. This plant\nstatus should be displayed on the Operator/Plant Graphic Form in addition to the Control/Management\nGraphic Form, the change to Manual can only be performed by Engineers or Electricians, not by\nOperators.\nThe Automatic mode will require the plant to be in a \"Stopped\" state, which can be reset from a\nbutton on the control screen thus resetting the entire plant. The operator needs to select a product\nto be manufactured and then press a button to \"Start\" the process.\nThe status of the PLC will then change to \"Batching\". The details of the required recipe must then be\nloaded and clearly displayed in a logical format. The required information includes the \"target\" masses\nof the ingredients as well as the required mixing time and temperature. Other information is available\nand should be utilised and presented to the Operators logically. The currently logged on user must be\ndisplayed through the use of Graphic Form scripting. (There is a knowledge base article on how to\nachieve this in the Adroit Knowledge Base which can be found on the website).\nOnce the target masses are generated by the simulation Batch OPC Server, it will start the \"Mixing\"\nphase and change the status integer accordingly. This integer is found in the I/O schedule attached.\nThis will start an Agitator/Mixer and you will need to display the start and end times for the batch,\nthe current status of the plant as well as all the other states of the physical plant.\nHow do I setup the OPC Driver in Adroit?\nOnce the Mixing is complete, the \"Heating\" phase will begin where the mixture will be heated to a\npredefined temperature as set by the operator. Once the heating phase is complete, the valve under\nthe mixing tank will open automatically and the mix will discharge at the set rate.\nThe status integer at this stage will be changed to reflect \"Discharging\". Once empty, the status will\nchange to \"Batch Complete\" and a button to allow the Operator to commit the records to the database\nshould become enabled or visible.\nThe complete record of the Batch must then be written to a database, including a comment field in\nwhich the Operator can enter some free text, prior to pressing a button to update the batch record\ndatabase. Once the transaction is complete you will need to reset the plant, setting it into the\n\"Stopped\" state once again. On a Graphic Form, the Operator needs to be able to select a date/time\nrange and return and display all records associated with that selection.\nA Functional Design Specification document must be submitted. (as per our attached template)\nI need an FDS document example for my project, where can I find it?\n\n[Page 8]\nATQMS-TRNG-DOC-ACE-User Requirments Specifications 2025.docxATQMS-TRNG-DOC-Adroit Certified Engineer Exam URS 2025.docx\nP a g e | 7\n3.2.\nNavigation and Screen Layout\nUsing a TGONavToolbar on the bottom quarter of the Operator Screen you need to be able to navigate\nbetween the Trend screen, the Event Viewer and the Alarm Viewer, each replacing the other. The\n75% of the Operator Screen must be reserved for the graphical representation of the plant. The\ndefault layout/workspace must be the Operator screen with the Trend screen displayed. The\nnavigation should be done through a menu on the left and a TGO in which the Graphic Forms will be\nloaded.\nHow do I use the TGONavToolbar control in a graphic form ?\n3.3.\nMaintenance and MIS\nIn the event of a catastrophic SCADA system failure, a Disaster Recovery Procedure (DRP) document\nmust exist detailing the steps to follow to recover the entire system from a backup, as well as hardware\nrequirements and any other relevant information. This document needs to be submitted with the rest\nof the exam.\nWhat sort of Adroit information would I need in a Disaster Recovery Procedure document for an Adroit\nSCADA system?\nIn order to give the maintenance staff additional assistance with each motor, the electrician must\nbelong to his own Windows security group. It is also important that the running hours of each pump\nand the number of times that it has been stopped and started (in either Auto/Man) is recorded via a\nsecond 'running stats' template that must be opened by way of an Execute command behaviour\ntriggered from a mouse hover event on the text describing of the motor on the Operator Screen.\nWhat Agent would I use to track the running hours of a pump?\nThe mixing motor and the water pump should be able to be operated in Auto/Manual mode from a\ntemplate screen that can only be accessed from the running stats Graphic Form. The running totals\nfor each motor can only be reset by an \"Engineer\" with Administrator privileges. However, you also\nneed to consider the following requirements.\nThe Control/Management Graphic Form must display the following information:\nWhich Agent Server is the Master\nThe average number of putslots happening in the system.\nThe HASP serial number.\nThe status of the Device health (OPC Server).\nAdroit recommends that you always have at least 25% spare capacity on the memory usage on\nthe SCADA PC. Therefore display the PC Memory Usage. This value must be alarmed accordingly.\nWhat Agent would give me details such as the Adroit Cluster Name and the HASP Serial number?\nThe status of the device needs to be displayed on the control screen and should the OPC Server fail\nraised.\n\n[Page 9]\nATQMS-TRNG-DOC-ACE-User Requirments Specifications 2025.docxATQMS-TRNG-DOC-Adroit Certified Engineer Exam URS 2025.docx\nP a g e | 8\nWhat Agent and Slot would give me details of the health of an OPC Driver?\n3.4.\nSecurity\nUsing Windows local security create three levels of user groups and named users.\n1. Operators/Operator\na. Can operate the plant but cannot access the Running and Maintenance templates, can\nreset the plant.\n2. Electricians/Electrician\na. Can access everything the Operators can as well as access the Running and Maintenance\ntemplates, but they cannot reset the running statistics of the motors.\n3. Engineers/ Engineer (Administrator)\na. Can access everything the Operators/Electricians can as well as access the Running\nand Maintenance templates, and they can reset the running statistics of the motors.\nAs it is not possible to submit your user and group structure with the Adroit configuration backup, you\nare required to add the Windows security procedures to your Disaster Recovery Procedure document.\nPlease provide only the details of the user and group configur"}];
const host = document.getElementById("cards");
ITEMS.forEach(function(it) {
  const card = document.createElement("div");
  card.className = "card";
  const text = it.text ? `<div class="small">${esc(it.text).slice(0, 260)}${it.text.length > 260 ? "..." : ""}</div>` : "";
  const kind = it.kind ? `<span class="pill">${esc(it.kind)}</span>` : "";
  const href = resolveHref(it.href || it.rel || "#");
  card.innerHTML = `<h3><a href="${escAttr(href)}">${esc(it.title)}</a></h3><div class="small">${esc(it.category || "")}</div>${kind}${text}`;
  host.appendChild(card);
});
</script>
<script>
(function() {
  var storageKey = "help_theme";
  function preferredTheme() {
    try {
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    } catch (e) {
      return "light";
    }
  }
  function applyTheme(t) {
    if (t === "dark" || t === "light") {
      document.documentElement.setAttribute("data-theme", t);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }
  function getSaved() {
    try { return localStorage.getItem(storageKey) || ""; } catch (e) { return ""; }
  }
  function setSaved(t) {
    try { localStorage.setItem(storageKey, t); } catch (e) {}
  }
  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") || preferredTheme();
  }
  function updateLabels() {
    var cur = currentTheme();
    var label = (cur === "dark") ? "Light mode" : "Dark mode";
    document.querySelectorAll(".theme-toggle").forEach(function(btn) {
      btn.textContent = label;
    });
  }
  function toggleTheme() {
    var cur = currentTheme();
    var next = (cur === "dark") ? "light" : "dark";
    applyTheme(next);
    setSaved(next);
    updateLabels();
  }
  function bind() {
    document.querySelectorAll(".theme-toggle").forEach(function(btn) {
      btn.addEventListener("click", function() {
        toggleTheme();
      });
    });
    updateLabels();
  }
  var saved = getSaved();
  applyTheme(saved || preferredTheme());
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bind);
  } else {
    bind();
  }
})();
</script>
