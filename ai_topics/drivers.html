 S7(3)\nstandard Scada communications.\n4.1.5. MPI/PPI Configuration\nLocal Address - Local MPI/PPI address, usually 0.\nPLC Address - MPI/PPI address of the PLC.\nSpeed - The speed at which the MPI/PPI connection has been configured.\n4.1.6. Test Device Configuration for Connectivity\nThis is used to check whether or not the configuration currently on the dialog can establish a\nconnection and communicate correctly with the PLC. Use this feature instead of having to start the\nAgent Server only to find your configuration does not establish a connection or communicate\ncorrectly with the PLC.\nTest Address - The Siemens PLC address which the driver will attempt to scan.\nIO Type - The Adroit type in which returned values from the PLC will be displayed in.\nStart Reading - If this button is clicked, the driver will attempt to connect to the PLC using the\ncurrent configuration on the dialog and the driver datascope will automatically open. If the driver\ndoes not connect or does not receive any information back from the PLC within 5 seconds, the scan\nattempt will be deemed unsuccessful and an appropriate error message will be displayed in the\nmessage box to the right of the button.\nINFORMATION\nNote, be sure to read messages on the device's datascope and read message box on the righthand side of 'Test Device Configuration for Connectivity'. These messages will help you determine\nwhether the device is operating correctly.\n4.1.7. Watchdogs\nEnable PLC program running check - Enable to activate.\nThis is a master side check that will force all I/O offline if the SPU is stopped and not the CP card.\nData will become latched and stale. Use this to check for activity.\nAddress DB:DBW any DBx:DBWy that has activity, if the value is stale in this register for more\nthan 1 second, all I/O on this device will be marked bad.\n\n[Page 13]\nATQMS-DRVR-DOC-SIEMENS.docx\nP a g e | 13\n7. General Notes and Troubleshooting\n7.1. Contact Details\nPhone: +27 11 658-8100\nFor additional information, please refer to our Knowledgebase website:\nLatest Drivers topics - Features, discussions, tips, tricks, questions, problems and feedback\n(adroittechnologiesautomation.com)\n7.3. Troubleshooting\n7.3.1. Error 33028 - cannot connect to the Siemens S7-1200/1500\nPLC\nThis error indicates the following: \"The S7-1200 has indirect access on by default. Check if Optimised\nBlock access is disabled.\" To resolve this issue, ensure that all the steps in Appendix D - Creating S71200/1500 Ethernet Connection have been correctly implemented.\n8.\nAppendix A - PLC Models Tested\nThe following PLC CPU's and cards have been tested so far:\nS7-200 CPU 226 with CP Card CP 243 - 1.\nS7-300 CPU 314C-2 with CP Card CP 343 - lean.\nS7-400 CPU xxx\nS7-1200 and S7-1500 (WARNING - See Appendix D below for correct setting)\n\n[Page 16]\nATQMS-DRVR-DOC-SIEMENS.docx\nP a g e | 16\nSpecify the number of connections required. At least 1 for Adroit connection. Now press next button\nto open the next screen.\nThis is the most important screen of all. This is where we setup the connection to allow Adroit to\ncommunicate to the PLC. The screen above is the exact setting required to make the communications\nwork. We want a server connection that allows the PLC to operate as the server and Adroit as the\nclient which connects and requests data from the PLC. The Local TSAP on this page refers to the\nPLC TSAP settings. This setting is not changeable and when 'The server will connect with an Operator\nPane(OP)' is selected the TSAP will change to 02.00. This means the SLOT setting in the driver is 2\nand RACK setting is 0. Also make sure 'Accept all connection requests' is checked. This will allow for\nany IP address to create a connection to the PLC. The Remote TSAP properties refer to the PC TSAP\nand always leave it as 02.01. Once ready click the OK button to continue to the next screen."}, {"title": "Sigfox_Protocol_Driver", "href": "drivers_html/Sigfox_Protocol_Driver.html", "category": "Drivers", "rel": "drivers_html/Sigfox_Protocol_Driver.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-D_SIGFOX.docx\nP a g e | 3\n1.\n2.\n\n[Page 4]\nATQMS-DRVR-DOC-D_SIGFOX.docx\nP a g e | 4\n1. Overview\nSigfox is a Low Power Wide Area Network (LPWAN) technology that allows Sigfox enabled devices\nto send small packets of data to the Sigfox Cloud (dedicated Sigfox servers on the internet). Sigfox\nuses a very light-weight protocol, so devices consume very little power and can operate over large\ndistances.\nAs shown below, the Sigfox network consists of objects (devices), Sigfox Stations (gateways) and\nthe Sigfox cloud (internet). Objects are Sigfox compliant sensors that send data over the air to the\nSigfox base stations, which then routes the data to the Sigfox Cloud (also known as the Sigfox\nbackend). The Adroit Sigfox Driver then communicates with the Sigfox cloud via an API or a callback, to retrieve the objects data.\nFigure 1 Sigfox Overview\nThis Sigfox Driver document is divided into two parts:\nSetting up and registering objects/devices onto the Sigfox cloud.\nSetting up the Adroit Sigfox driver to communicate to the Sigfox cloud.\nPLEASE NOTE\nThe Sigfox cloud can store a maximum of 1 years' worth of data per device.\n\n[Page 9]\nATQMS-DRVR-DOC-D_SIGFOX.docx\nP a g e | 9\nPLEASE NOTE\nContracts cannot be changed once device type is created.\nIn figure 4, the most important fields are the Device Type name (keep to naming conventions), the\ncontract (discussed above), the payload parsing (keep this as Regular). Downlink data is if you are\nwriting information down to the device from the Sigfox backend. This is not currently implemented\nin the Sigfox driver, so keep this field (Downlink Mode) as NONE.\n3.1.4. Creating a new Device\nOnce the device type is created, then we can register our device to that device type. Figure 5 displays\nthe parameters required for registering a new device.\nFigure 5: Creating a New Device\nIn Figure 5, the Device ID (keep to naming conventions), PAC and end product certificate must be\nsupplied by the manufacturer of the Sigfox device. For instance, if VisioSoft manufactured the device,\nthen communicate with them to get this information.\n3.1.5. Setting up the Sigfox Callback\nThe Sigfox Callback is used to send data to a specific computer on the internet when the value of a\ndevice changes on the Sigfox backend. As shown in Figure 6, the callback is a query string with a\npublic facing IP address (41.185.80.219) and an open port (5004) on the machine. This should be\nthe IP address of the computer where Adroit is running. An example of the query string is:\nhttp://41.185.80.219:5004/sigfox_data?id={device}&time={time}&data={data}&snr={snr}&statio\nn={station}&avgsnr={avgSnr}&lat={lat}&lng={lng}&rssi={rssi}&seqNumber={seqNumber}\nPLEASE NOTE\nYour computer must have a public IP address and the port in the callback string must be opened\non the firewall on the computer that is running Adroit.\n\n[Page 14]\nATQMS-DRVR-DOC-D_SIGFOX.docx\nP a g e | 14\n3.3.1. Driver Details\nEnable Secondary - (Default = OFF) Allows enabling of redundant Sigfox Cloud connections such\nthat in case of a failure, a switchover will occur.\nPrimary - Allows configuration setting of the Primary Sigfox Cloud connection.\nSecondary - Allows configuration setting of the Secondary Sigfox Cloud connection.\n3.3.2. Primary Connection Parameters\nEnable shadow scanning from master to standby - (Default = OFF) If enabled will stop any\ncommunication to the Sigfox Cloud when the Agent server is in standby mode. By default, parallel\nscanning is assumed.\nEnable standby reads - (Default = ON) Allows reading from the Sigfox Cloud when Agent Server\nis in standby mode.\nEnable standby writes - (Default = OFF) Allows writing to the Sigfox Cloud when Agent Server is\nin standby mode.\n3.3.3. REST API\nUser - This is the API Access Login name from the Sigfox Backend, see Figure 13.\nPassword - This is the API Access Password from the Sigfox Backend, see Figure 13.\nDevice type ID - The Device Type ID from the Sigfox Backend, as shown in Figure 5.\n3.3.4. HTTP Server\nPort - The port which the Sigfox Backend will use to connect to Adroit. Make sure this port is open\non the firewall and accessible from the internet. This port must be used in the Callback query string,\nas shown in Figure 6.\n3.3.5. Script\nScript File - Load the script file to parse the Device Type payload.\n3.3.6. TimeOut\nContact Exceeded Time - If Adroit does not receive a payload from a specific device within this\namount of time, the device will mark bad. Due to the 140 message constraint, the minimum contact\nexceeded time is 10 minutes. A value of 0 will disable this functionality.\nPLEASE NOTE\nThe computer that has Adroit installed and running must have internet access. In addition, all\nrelevant Sigfox ports must be accessible from the internet.\n\n[Page 18]\nATQMS-DRVR-DOC-D_SIGFOX.docx\nP a g e | 18\n6. General Notes and Troubleshooting\n6.1.\nContact Details\nPhone: +27 11 658-8100\n6.2.\nFor additional information, please refer to our Knowledgebase website:\nLatest Drivers topics - Features, discussions, tips, tricks, questions, problems and feedback\n(adroittechnologiesautomation.com)\n6.3.\nTroubleshooting\nWhen troubleshooting a Sigfox Driver problem, it is important to understand where the source of\nthe problem is. Please use the Sigfox device Datascope as a tool to try debug the problem. The\nfollowing steps will hopefully be a guide in troubleshooting a faulty Sigfox device that is trying to\n1. Step 1: As shown in Figure 17 below, if the device cannot be found on your Sigfox backend,\nthen you need to register that device onto the Sigfox backend (see Part 1 of this document). If\nit was registered, then check if it was deleted, moved or if you are searching in the correct\nSigfox group.\nFigure 17: Device Not Found\n2. Step 2 is to check if the device and device type contracts have expired. In Figure 18 below, the\nadroit_t_50bb_820c contract is clickable, this is where you can check if the devices and device\ntype contracts are still valid.\n\n[Page 19]\nATQMS-DRVR-DOC-D_SIGFOX.docx\nP a g e | 19\nFigure 18: Check Contract Validity\n3. Step 3 is to check if the information on the Sigfox backend is correct for that specific device, as\nshown in Figure 19 below.\nFigure 19: Verify Device Payloads\nIf the signal strength is bad, then packets could be lost. Check the times of each message\nand check if this correlates to the devices contract (140/50/2 messages per day). Also\ncheck if the payload of these messages are what you expect, if you are unsure how to\ninterpret the payload, then contact Adroit support or the device manufacturer. This is the\nfirst place to check if you are reading incorrect values in Adroit from the device.\nIf the timestamp is very old, and a lot of messages are being lost, then check if the device\nis turned off, if the battery died or if the device moved to a location with bad signal\nstrength.\n4. If the callbacks are failing, as shown in Figure 20 below. Then the callback URL for the device\ntype associated to that device might be incorrect. The port needs to be opened on the relevant\nfirewalls and servers and the IP address must be a static public IP address. If the Agent Server\nis not running on the machine waiting for the callback, then the callback will also fail. Note that\nmultiple callbacks can be setup for a device type and if one of them fails (and the rest\nsucceed), then the icon will go red. Also make sure the User, Password and Device Type ID are\ncorrect in the Adroit Sigfox Driver Configuration.\nFigure 20: Callback Failure"}, {"title": "Spectrum_Tele-RANGER", "href": "drivers_html/Spectrum_Tele-RANGER.html", "category": "Drivers", "rel": "drivers_html/Spectrum_Tele-RANGER.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-SPECTR.docx\nP a g e | 3\n1.\n2.\n\n[Page 4]\nATQMS-DRVR-DOC-SPECTR.docx\nP a g e | 4\n1. Overview\nAdroit supports communications with the Spectrum TeleRanger Radio Telemetry System, using the\nProtocol Driver SPECTR.DLL. Related documents that may be read in conjunction with this document\nare:\nEngineering Note EN-5 SCADA Protocol Serial Interface for the tele-RANGER Radio Telemetry\nSystem\n\n[Page 8]\nATQMS-DRVR-DOC-SPECTR.docx\nP a g e | 8\nTimeout (Sec) - The time (in seconds) that a response will be waited for, before retrying or timing\nout\nNumber of Retries - Number of times a link test (or other command) will be sent without receiving\nthe corresponding response, before a communications failure is flagged. Not inclusive\n3.1.2.\nCentral Station Details (Global affects all\ndevices)\nItems configured in this group are common to all outstations using the same serial port. What this\nmeans is if you want to change a parameter such as, say, Link Test Interval, you will need to change\nit for all other devices on that particular communications resource (com port), if not then a new port\nshould be used, which implies a different teleRanger RS-232 module, etc.\nPlease Note non device specific messages like SM and LT etc will not have a checksum at all, the\nspectrum device will not expect one either.\nCentral Station Address - The teleRanger central station address, C1 -> C2\nLink Test Interval (Sec) - The time (in seconds) between the sending of successive link test (\"LT\")\ncommands from Adroit to the teleRanger central station. A time of zero disables link testing\nSynchronize All Telemetry Clocks (Startup) - When active, this check box will cause all\noutstations to be time synchronized with the SCADA system clock, This will happen once when the\ndriver loads. Manual syncs via OSCTL.5 will need to be done when in modem mode … OSHDR.16\ncan be driven via an Expression Agent.\nTime between \"IR\" messages The number of seconds to leave between any two stations\nperforming an \"IR\" or interrogate command.\nLatency (Sec) - The minimum time delay (in seconds) between the sending of ANY (IR or GL)\nrequest commands from Adroit to the outstation. Any one will reset the timer to force the other to\ndelay. This is NOT global it is only a delay between two IR/GL polls to the SAME station. Manual\ncommands (IR and GL) are unaffected and will go out as normal.\n3.1.3.\nOutstation Logging \"GL\" Functions (Device\nSpecific)\nGetLog Interval (Sec) - Default is 0 (disabled). This is a timer to generate an automatic GL request\nto a device every x Seconds. If set to 0 the timer is disabled and GL's will have to be done from\nwithin adroit either via osctl.7 These Gl messages obey the OQD.\nLogs per batch - Default is 5. This is the number of logs to request either in autolog mode or via\nOSCTL.7 bit.\n3.1.4.\nOutstation Modem Identification Strings (Device\nSpecific)\nModem ID's Enabled - Default : Checked, Used for backward compatibility to older tele-ranger\nequipment where no ID's are available and where unsolicited mode is unavailable too.\n(ONLY Used In Modem MODE!)\n\n[Page 12]\nATQMS-DRVR-DOC-SPECTR.docx\nP a g e | 12\n4. Supported Addresses\n4.1.\nModem Configuration Strings (x2 command\nset)\nTested with US-Robotics 56k modems, compatible with x2 command set.\nSee Appendix A for additional modem topics.\nThis string is sent whenever Adroit attempt to communicate to a device, it is also sent at startup of\nthe agent server, and also if your stop/restart your device.\nTry to use Factory default settings if possible; AT&F\nTo use Auto answer mode on the modem: AtS0=n (where n = number of rings)\nTo not use Auto Answer, make sure you uncheck the AutoAnswer checkbox in the Modem Dialogue.\nMake sure AtS0=0 in your string.\nMake sure &D is 2, the driver needs normal DTR signals to do its hang-ups etc\nMake sure &C is 1, the driver needs normal Carrier detection to operate correctly.\n4.1.1.\nExample Connection String:\nAt&f&w0&w1 in \"terminal\" to reset to factory defaults and save profiles or you could allow adroit to\ndo it at startup.\nATE0&D2&C1S0=2&W0&W1\nEcho off | normal dtr | Normal cd | AA after 2 rings | Save profile to 0 and 1.\nThe Non Protocol or noise message above is not fatal, some modem handshake may be found to\nbe rejected as above … ok The \"\\r\\n\" etc are just the carriage return line feed converted to printable\nform they are not actually \"\\r\" they are non-printable and thus not detectable on the scope\notherwise!\n\n[Page 13]\nATQMS-DRVR-DOC-SPECTR.docx\nP a g e | 13\n4.2.\nBasic Structure of Driver\nBeing a Radio Telemetry System, teleRanger poses some special protocol driver development and\nconfiguration challenges:\nDelayed response. With PLC systems a read request is honoured immediately, whereas with\na radio telemetry system, several different requests can be sent out before a response to the\nfirst one is received. Also, the sequence in which responses arrive is totally unpredictable\nException-based. Instead of using a poll-response type protocol like most other Adroit protocol\ndrivers, the teleRanger driver operates in an exception- or event-based mode. This means\nthat messages arrive from the teleRanger equipment in an unsolicited fashion\nTime-tagged. The teleRanger protocol includes the possibility of tagging changes of state and\nother events with the time of occurrence. The protocol driver needs to be aware of timetagged information and make sure that this time, as opposed to the current system time, is\nassociated with the event\nEven though Adroit directly connects to only a local teleRanger station, it must maintain\ncommunications, etc., on a per remote station basis. This is to prevent all stations being\nconsidered bad when only one station may be experiencing communication problems\nGiven all the above, the following diagram illustrates the context within which the teleRanger protocol\ndriver operates:\nFrom the above diagram it is clear that there is a direct correspondence between teleRanger stations\nand Adroit device agents, i.e. a separate device agent is configured for each teleRanger outstation.\nThe following diagram shows how the protocol driver connects via an RS232 link to the teleRanger\nlocal station\nThe local station connects via a radio network to its remote outstations. One can see on the above\ndiagram, shown in dotted, that it is possible for different instances of the teleRanger driver to use\ndifferent COM ports to other local stations that are part of completely separate radio telemetry\nsystems, if necessary.\n4.3.\nLog Retrieval\nFor datalog retrieval from the RTU via the tag OSCTL.7, or Autolog retrieval…\nAn Int/real tag must be scanned from OSLOG.1 to hold the count of remaining records.\nA Digital tag can be scanned to OSCTL.7 if a manual log retrieval is required.\nAn Int/real/marshal tag must be scanned to OSHDRB.1 these items all update as a result of a SL,\nGL or in the case of a Teleflex an IR, which provide an LS.\n\n[Page 21]\nATQMS-DRVR-DOC-SPECTR.docx\nP a g e | 21\n7. Appendix A - How to Troubleshoot and\nSetup Modems.\nThis discussion describes landline dialup modem support , but gsm modems are also compatible to\nthe basic command sets so there is no reason for them not to work either.\nWhere applicable I will refer to the Hayes (x.2) command set as well as the Duxbury command set.\n(*h) - X2 Hayes only (e.g. US robotics)\n(*d) - Duxbury only.\nNothing means identical for both command sets.\n7.1.\n1st Steps\nUse HyperTerminal to establish initial communications with the modems , make sure you can\ncommunicate with the modem by creating a hyper terminal session manually to the appropriate com\nport. Type in any command and check whether the modem acknowledges it. Try AT(return) you\nshould see OK. [ATZ, ATI4(*h) or AT&V(*d) for current config info etc)\nIf no ack is found try a command that will definitely return something ATI4(*h) AT&V(*d).\nIf no acks are sent but the about info does get sent check result codes are being sent Q = 0. And\nthe codes must be returned as text V=1.\nAT&F will reset the modem factory defaults.\nMake sure Carrier detect is enabled &C1. *NB - for driver hang up ability.\nMake sure DTR control is enabled &D2. *NB - for driver hang up ability.\nIf you want the modem to auto-answer make sure S0>0 (i.e. S0=2 for 2 rings then answer)\nMake sure Echo is off when you are finished testing E=0. *NB - for driver logic.\nMake sure B0(*h). Data baud rate will follow connection train rate.\nAT&W(*h) will save the profile , older modems have 2 profiles AT&W0 , AT&W1…\n7.2.\nFor Remote Modem\nMake sure the following is set : S0=0, spectrum answers manually.\n&D0 spectrum does not control the DTR line and thus must be disabled/ignored!\nRecommended ATE0 s0=0 &D2 &C1&W done manually via terminal! Make sure the save went\nthrough by turning off the modem and then doing a ATI4(*h) to check.\n7.3.\nFor Master Modem\nS0 = 2 , two rings until auto answer, then the device modem \"modem is configured for auto answer\"\nmust be checked , otherwise if its unchecked S0=0, then the driver with do a manual ATA. (It is\nrecommended to use the modems auto answer feature)"}, {"title": "Strike_ENERMAX_Plus", "href": "drivers_html/Strike_ENERMAX_Plus.html", "category": "Drivers", "rel": "drivers_html/Strike_ENERMAX_Plus.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-STKEMAXP.docx\nP a g e | 3\n1.\n2.\n\n[Page 5]\nATQMS-DRVR-DOC-STKEMAXP.docx\nP a g e | 5\n2.\nWiring\nStandard RS-232C cable (DTE-DTE) cross-over cable with or without handshaking.\nThe driver expects the communication link to be point-to-point due to the session-based protocol\nused.\nOR\nStandard Ethernet UTP Cable.\n\n[Page 6]\nATQMS-DRVR-DOC-STKEMAXP.docx\nP a g e | 6\n3.\nDevice Configuration\nComms Type - Select communications type:\nSelect 'Serial' for Serial communications.\nSelect 'Ethernet' for Ethernet communications.\nSerial ID - Serial identification number unique to the meter.\nRetry - The number of times that Adroit will try to gain communication with the meter before failing\na transaction.\nTimeout - The time that Adroit will wait for a valid response from the meter before failing a\ntransaction (Read or Write). Ensure proper timeout if using modem connection as it is much slower,\nwhere the maximum is 9600bps.\nModem - Opens the Modem Dialog if using Modem Connection.\nPort - The available serial ports on your machine.\n\n[Page 7]\nATQMS-DRVR-DOC-STKEMAXP.docx\nP a g e | 7\nBaud rate - (Default = 115200) Select a baud rate: 9600, 19200, 38400, 56000, 57600, 115200\nParity - (Default = Even)\nDataBits - (Default = 7)\nStopBits - (Default = 1)\nForce Sign-on - (Default = unchecked) If checked the driver will force a sign on and off for every\ntransaction used when having multiple serial devices on a bus network.\nWARNING: communications will be slower.\n3.1.1. TCP/IP Settings\nAddress - IP address of the meter.\nPort - (Default = 10001) The port configured for the meter.\n3.1.2. Modem Settings\nUse Modem - Enable/Disable the Use of Modem on RS232.\nDial Number - Number to dial that is situated at end device.\nModem Init String - String to Initialize Local Modem with before dialling.\nConnect Timeout - Time(ms) to wait for connection.\n\n[Page 10]\nATQMS-DRVR-DOC-STKEMAXP.docx\nP a g e | 10\n*2) The display reads numbers can be found in Emaxplus-CM-RDU-3rd-Party-0v01.xls\nPlease remember that Dx:y , x is the row and you usually want to scan D2:y not 1 , which will give you the\ndisplay name… but it can be scanned if you really want to… just use D1:y\n*3) 8 profile channels available as floating-point values, only Real/Analog agents will be supported for profile\ndata.\nWARNING\nChannels are dynamically ordered from the smallest period to the largest. If you add a channel or\nedit a channel in the meter, the SCADA MUST take this into account that channels positions could\nmove.\nExample: channel 1 period = 10 minute sample rate, channel 2 = 30 minute sample rate, now you\nadd channel 3 = 5 minute rate, then channel 3 will become channel 1 in memory, and the old 1\nand 2 will become 2 and 3 respectively. So, if channel 1 was VOLTS, and channel 3 was VARS, the\nnext profile read, channel 1 would have VARS instead of VOLTS. This is like swapping two digital\njumpers on a digital output card without telling the SCADA engineer to update the user interface\n- a wrong indication is presented.\nWARNING\nChannels cannot be skipped in the read. So, for example, if channel 2 were to be deleted from the\nmeter, the remaining channels would move down the list in this case channel 3 would move to\nchannel 2.\nProfile modifiers: Modifiers can be added to a channel to modify the value before it is sent to\nYou can multiply(divide) a value and/or subtract(add) a value. (See Profile Modifiers Appendix.)\n*4) These are administrative registers used in advanced function that may require more than one type of data\nto be present before execution can take place, for example profile retrieval of multiple days.\nAdmin area consists of 5 16bit registers only available to integer type agents such as Integer/Marshal.\nRegister 0 (Address A:0) is not persisted data, will be reset when the Agent Server restarts.\nRegister 1-4 (Address A:1-4) are persisted, so these will be preserved between Agent Server restarts, and\nthere is no need to save WGP file manually, the data is persisted to the device config in the registry.\nRegister 0 [bit packed 16 (unpersisted)]\n{ Bit 0 = Do time synchronisation (>20min will cause a fast set)\nBit 1 = Do profile read (will use Registers 2 and 3 for required parameters)\nBit 2 ... Bit 15 = not used yet.}\nRegister 1 [bit packed 16 (persisted)]\n{ Bit 0 = Enable \"fetch yesterday\" profile data (uses Register 4 as time in minutes from 00:00 to start)\nBit 1... Bit 15 = not used yet.}\nRegister 2 [unsigned short] = day offset from today for profile read (see bit 1 of register 0) (1 = yesterday)\n(0 = today) (>1 days further into the past)\n\n[Page 15]\nATQMS-DRVR-DOC-STKEMAXP.docx\nP a g e | 15\n(Aside from applying the TVF)\nSlot Type\nTo Do\nAllow user to choose if VT ratio to be applied\nxxxxxx.x\nCurrent\nAllow user to choose if CT ratio to be applied\nxxxx.xxx\nPower/Energy\nAllow user to choose if IMC to be applied\nUse demand category scaling\n8.\nRevisions\n8.1.\nDocument Revision\nRev.\nDate\nGrammar edits, formatting changes and\ncontent additions\nD. Jordaan\n3.0\n8.2.\nDLL Revision\nRev.\nDate\nEnabled serial support.\n3a\n10/09/2009\nadded documentation regarding P and A registers.\n3d\n06/10/2009\nadded documentation regarding P modifiers.\n02/07/2010\nadded modem support.\n18/01/2012\nExtra check on protocol to detect out of sequence messaging."}, {"title": "User-defined", "href": "drivers_html/User-defined.html", "category": "Drivers", "rel": "drivers_html/User-defined.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-USERDRV.docx\nP a g e | 3\n1.\n2.\n\n[Page 5]\nATQMS-DRVR-DOC-USERDRV.docx\nP a g e | 5\n1. Overview\nThe UserDrv protocol driver for Adroit is a generic paging and text device driver. Messages configured\nin String or Notifier Agents may be sent via an encoder or modem to paging devices. Alarms that\noccur in Adroit can thus be routed to automatically page a person.\nThis driver is intended for easy use with many varied text protocols, while allowing advanced users to\nconfigure custom protocols of their own. No windows drivers for a modem (is used) are needed, this\ndriver provides its own interface and control over the modem via the serial port or IP address assigned\nto it.\n\n[Page 9]\nATQMS-DRVR-DOC-USERDRV.docx\nP a g e | 9\n4.2.2. Communication Medium\nCommunication medium - Used to select whether TCP/IP or serial will be used as the\ncommunications medium.\n4.2.3. Serial Port Settings\nPort The communication port to which the modem/device is attached. A coloured icon helps indicate\nif the port is used or not, (red icon replaces the asterisk that used to appear).\nParity - The type of parity, odd, even or none.\nBaud - The baud-rate, in the case of a modem, select the highest usable speed.\nData bits - The number of data bits will depend on the service used.\nStop bits - The number of stop bits to use will depend on the service used.\nTimeout (ms) - The time to wait for a response from the locally connected device.\n4.2.4. TCP/IP Settings\nUse DNS Lookup - Checking this box will use the DNS Server IP and hostname to do a lookup of the\nDevice IP Address. This allows devices to be referenced which may have dynamic IP Addresses.\nDNS Server IP - The IP address of the server to use for DNS lookup.\nHostname - The hostname of the device for which the IP address is to be requested from the DNS\nserver.\nLookup Test - Clicking this button does a DNS lookup and brings up a dialog box showing the IP\naddress retrieved.\nDevice IP Address - The IP address that will be used to communicate with the device. If the \"Use\nDNS Lookup\" box is checked this IP address will be the result of a DNS lookup based on the DNS\nServer IP and Hostname\nPing Test - Clicking this button will do a ping test and display the result in a dialog box\nPort - This is the port number that adroit will use when communicating with the device\nListen mode (outstation connects) - Checking this box will instruct the driver to wait for incoming\nconnections.\n4.2.5. UserDrv Details\nProtocol selection - Select a pre-defined protocol or \"User defined\" if you want to use a definition\nfile. When selecting a predefined protocol, the next field is ignored.\nTransmission strings file - The file to use if selecting a definition file, selection is disabled and\nignored if \"User defined\" is not selected.\nRetries - Number of attempts to communicate.\n\n[Page 14]\nATQMS-DRVR-DOC-USERDRV.docx\nP a g e | 14\n3. Confirm your changes and move to the Analog tag TESTANALOG.\n4. Click on the configurator \"Alarm\" button to open the alarming dialog. Select the alarm agent\nMYALARMAGENT. In the \"Agent Type\" drop-down box, select the Analogue tag type. Add Low\nand High to the current alarms. Ensure that route 2 is selected.\nScanning the Tag\non.\n2. Then click scan and scan it from the device we have configured. (If you see a message\n\"Device does not exist create automatically\" , select \"Yes\".) Use the scan address \"Notify : 1\"\n(no quotes) and select the rawValue slot, make the scan-interval zero. Click on \"Scan\" to add\nthe I/O point.\n3. Click on the \"Details\" button and verify that the device is started, if not start it now. Accept\nthese settings as needed.\nTesting the Driver Operation\n1. Open the driver datascope, to do so you can either run the driver monitor launcher and select\nUSERDRV from the list there to open a monitor or use the \"Diagnostics\" button in the Adroit\nSetup program.\n2. In the datascope program, select option 1 which is for datascope, the communications\nanalyser screen will appear. If it does not, the driver could not open the communications port\nor the driver could not be found, troubleshoot accordingly. If the window TITLE displays \"HEX\ndatascope …\" then hit 'A' on the keyboard to force it to toggle modes into ASCII.\n3. Leave this window running. Go back to the Configurator window and edit the notify agent.\nClick on the \"Advanced\" button and type in \"Hello world\" in the format field (if there is already\ntext in the field, add a \"dot\" period\" to the field each time to cause a change).\n4. Click on the Test button (subsequent test messages must differ), and then Alt-Tab back to the\nDatascope (communications analyser) window. A message must appear indicating that the\ndriver will attempt to start sending. If not go to troubleshooting. As relevant, the modem will\nstart to dial and connect to the gateway or terminal server, watch the display as it does this to\ndetermine where if anywhere it goes wrong.\n5. If the SMS does get sent this part is working, else verify the modem operation in some other\nway.\nTesting the Alarming setup\n1. Edit your alarm agent, and place a value of 100 into it, thereby sending it into high and highhigh alarm, click \"Update\", then change the value to zero again to generate low alarms.\n2. If this does not result in an SMS being sent, create a new mimic, and display a text value\nassociated to MYNOTIFY.rawValue on it, the last alarm text should thus be displayed, if your\n\"Hello world\" is still in there, re-check the alarm configuration steps. The actual text shown\nshould be the subscriber user/cell code, a comma ',' and the alarm text, which is usually\npreceded by the time.\nThe Notifier Agent can also support User entered messages. Simply type the message into the value\nslot from an Operator Action, \"Set value\" and the message will be sent when clicking on the OK button.\nNote, to re-send an old message, you must change the message content by e.g. adding a space at\nthe end of it.\n\n[Page 18]\nATQMS-DRVR-DOC-USERDRV.docx\nP a g e | 18\nonly pay for the SMS, and no dialing actually occurs, although this mechanism still remains available\nsince the GEM modem is a normal modem too.\n5.3.2. Configuring the GSM modem\nSome effort is required to set up the modem for initial operation; this is a once-off effort. Please note\nthat this procedure may become irrelevant in future.\nAlthough the driver has an SMS/Cel-modem protocol selection, this \"script\" for the driver does not\npre-configure the modem, in order to save time on each transmission. The necessary steps to perform\nare laid out here, along with the meaning, once completed, even turning off the device will not loose\nthese changes.\nThe necessary steps to perform are laid out here, along with the meaning, once completed. Even\nturning off the device will not loose these changes. Actual HyperTerminal instructions may very\ndepending on which Microsoft operating system you use. Exit all un-necessary applications before\nstarting.\nIf not installed, install HyperTerminal, as follows:\nFrom control panel, select Add/remove programs.\nClick on the \"windows\" or \"components\" tab, and select HyperTerminal under \"communications\" to\ninstall it.\nSelect windows start/programs/communications/HyperTerminal, HyperTerminal will launch.\nType in a connection name (you can save this profile if you need to use it again) If this is the first\ntime you run HyperTerminal, it may ask to install/configure a modem, ignore this step by providing\nany needed information or skipping as needed. You do not want to be installing a modem driver at\nthis point.\nUse default settings at all these steps, only select the comm. port you are using. Baud rate is not\nimportant, select 9600 if in doubt; no handshaking, 8 data bits, 1 stop and no parity. When you see\n\"0\" in this explanation it is a zero, not uppercase \"o\", case is not important in these commands, but\nuppercase is used for simplicity. If them instruction says to turn the modem off, do so for at least 5\nseconds.\nClick on the \"Connect\" toolbar icon; then type \"ATZ\" (no quotes) followed by Carriage-return\n<ENTER>\nYou should see the text ATZ as you type it, and the next line should read OK.\nIf you see your typing ATZ appearing twice, click on the menu \"File/properties\" click \"ASCII\nsetup\", and remove the check from the box \"echo typed characters locally\". OK the settings,\nand click the \"connect\" toolbar icon.\nIf the modem does not respond:\nDisconnect HyperTerminal and select 2400 baud, reconnect. Switch the modem off, then on,\nand type AT<ENTER> in (the AT MUST be upper-case here) 3 times over. Doing so allows the\nmodem to train to a new baud-rate, which it will loose if re-initialized.\nType AT+IPR=9600;&W<ENTER>, then switch the modem off and on again, change the\nHyperTerminal baud-rate back to 9600, it should respond properly on the first command now.\nIf the modem still returns garbage, type AT+ICF=3,4<ENTER> to set up 8 data-bits 1 stop\nand no parity. Save this using the W command as above, and cycle power on the modem.\nType ATE1 and <ENTER>, the unit will respond with OK. Now we can build on this, type\nAT&D2<ENTER> this turns the handshaking to the default we want.\nThen AT+CMEE=1<ENTER> this turns error reporting mode , (which the datascope displays\nas a number if an error is reported) , the unit will respond with OK.\nThen AT+CMGF=1<ENTER>, this puts the modem into Text mode. the unit will respond with\nOK.\nThen type ATE0&W0<ENTER>, this will turn echo off, and save the modem settings to profile\n0, also type ATE0&W1<ENTER> to save into profile 1 (this is because some modems have\nprofile 0 and 1, and others have 1 and 2). If using a Falcom modem, the \"W\" must not be\nfollowed by a 0 or 1, the modem only has 1 profile.\nTurn the modem off and on.\n\n[Page 29]\nATQMS-DRVR-DOC-USERDRV.docx\nP a g e | 29\n7. General Notes and Troubleshooting\n7.1.\nContact Details\nPhone: +27 11 658-8100\n7.2.\nFor additional information, please refer to our Knowledgebase website:\nLatest Drivers topics - Features, discussions, tips, tricks, questions, problems and feedback\n(adroittechnologiesautomation.com)\n7.3.\nTroubleshooting\n7.3.1. PFF Scripts\nOnly pre-defined scripts are supported, any scripts browsed in using \"Custom Protocol\" need to be\ndebugged. The process for debugging a custom PFF file is simple…\nFrom Setup, click on \"Check…\", a dialog with all the script variables in it appear.\nDouble-click on each user variable labelled \"TX1\" etc to make sure that the driver can\nprocess it correctly. Fix any errors then close this dialog and open it again and re-check your\nchanges.\nClose the driver setup dialog. If you still have problems continue…\nOnce connected, the driver will wait for a while to allow the server to respond. Then it will\ncommence with the processing of the communication steps. If the driver sends a string that\nis incorrect or not recognised by the remote device, that device will either not respond or will\ngive an error response. Use the ASCII \"Datascope\" to determine if this is the case.\nIf problems persist, try exporting all of the built-in scripts and analysing them to find a\npossible solution. Note: You can edit the script and save it between attempts, since the\ndriver re-processes the script on every transaction.\nQ: My tag does not update, what am I doing wrong? A: If the Datascope is showing a\nupdate value and it looks correct, all you need to do is type the scan-address correctly, see\nthe section on Typing scan-addresses above.\nQ: What do I do if the device's response for a step is random or un-defined? A: Use an\nempty RX step, the driver will read and display the response without doing anything else\nwith it.\nThe PFF script is re-loaded every time the datascope displays [Attempt n/n Sending xxxx] or\n[Acquire I/O data], certain script variables require a re-start to re-load or change."}];
const host = document.getElementById("cards");
ITEMS.forEach(function(it) {
  const card = document.createElement("div");
  card.className = "card";
  const text = it.text ? `<div class="small">${esc(it.text).slice(0, 260)}${it.text.length > 260 ? "..." : ""}</div>` : "";
  const kind = it.kind ? `<span class="pill">${esc(it.kind)}</span>` : "";
  const href = resolveHref(it.href || it.rel || "#");
  card.innerHTML = `<h3><a href="${escAttr(href)}">${esc(it.title)}</a></h3><div class="small">${esc(it.category || "")}</div>${kind}${text}`;
  host.appendChild(card);
});
</script>
<script>
(function() {
  var storageKey = "help_theme";
  function preferredTheme() {
    try {
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    } catch (e) {
      return "light";
    }
  }
  function applyTheme(t) {
    if (t === "dark" || t === "light") {
      document.documentElement.setAttribute("data-theme", t);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }
  function getSaved() {
    try { return localStorage.getItem(storageKey) || ""; } catch (e) { return ""; }
  }
  function setSaved(t) {
    try { localStorage.setItem(storageKey, t); } catch (e) {}
  }
  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") || preferredTheme();
  }
  function updateLabels() {
    var cur = currentTheme();
    var label = (cur === "dark") ? "Light mode" : "Dark mode";
    document.querySelectorAll(".theme-toggle").forEach(function(btn) {
      btn.textContent = label;
    });
  }
  function toggleTheme() {
    var cur = currentTheme();
    var next = (cur === "dark") ? "light" : "dark";
    applyTheme(next);
    setSaved(next);
    updateLabels();
  }
  function bind() {
    document.querySelectorAll(".theme-toggle").forEach(function(btn) {
      btn.addEventListener("click", function() {
        toggleTheme();
      });
    });
    updateLabels();
  }
  var saved = getSaved();
  applyTheme(saved || preferredTheme());
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bind);
  } else {
    bind();
  }
})();
</script>
</body>
</html>
