<style>
  :root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #f7f7f7;
  --text: #222222;
  --muted: #666666;
  --border: #d0d4d8;
  --border-soft: #e3e5e8;
  --link: #0066cc;
}
[data-theme="dark"] {
  --bg: #0f1115;
  --panel: #151922;
  --panel-2: #1b2130;
  --text: #e6e9ef;
  --muted: #a6adbb;
  --border: #c7cbd4;
  --border-soft: #9aa3b2;
  --link: #7bb0ff;
}
html, body { background: var(--bg) !important; color: var(--text) !important; }
body, p, li, td, th, div, span, pre, code, h1, h2, h3, h4, h5, h6 {
  color: var(--text) !important;
}
a, a:visited { color: var(--link) !important; }
table, th, td, hr {
  border-color: var(--border) !important;
}
.popup, .tooltip, .dropdown, .menu, .context, .modal, .panel {
  background: var(--panel) !important;
  color: var(--text) !important;
  border-color: var(--border) !important;
}
.popup *, .tooltip *, .dropdown *, .menu *, .context *, .modal *, .panel * {
  color: var(--text) !important;
}
.topbar, .group, .header, pre, code, table {
  background: var(--panel) !important;
}
.nav {
  background: var(--panel-2) !important;
  border-color: var(--border) !important;
}
.note, .small, .meta { color: var(--muted) !important; }
input, select, textarea, button {
  background: var(--panel-2) !important;
  color: var(--text) !important;
  border-color: var(--border) !important;
}
input::placeholder, textarea::placeholder {
  color: var(--muted) !important;
}
.btn, .theme-toggle {
  background: var(--panel-2) !important;
  color: var(--text) !important;
  border-color: var(--border) !important;
}
.group h2 { border-bottom-color: var(--border-soft) !important; }
.theme-toggle {
  padding: 6px 8px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}
  body { font-family: Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  .page { padding: 18px 20px 30px; }
  .topnav { position: sticky; top: 0; z-index: 10000; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--border-soft); }
  .topnav a { text-decoration: none; }
  .hero { margin: 16px 0 18px; max-width: 1000px; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 12px; padding: 12px; }
  .card h3 { margin: 0 0 8px; font-size: 16px; }
  .card ul { margin: 0; padding-left: 18px; }
  .small { color: var(--muted); font-size: 12px; }
  .pill { display: inline-block; margin: 4px 6px 0 0; padding: 3px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); font-size: 12px; }
  .btn { display:inline-block; padding:8px 10px; border:1px solid var(--border); background:var(--panel-2); border-radius:6px; color:var(--text); text-decoration:none; }
</style>

<div class="page">
  <h1>Best Practices</h1>
  <p class="hero">Best practice documents and implementation guidance.</p>
  <div>
    <a class="btn" href="../index.html">Help Index</a>
    <a class="btn" href="../ai_index.html" style="margin-left:8px;">AI Index</a>
  </div>
  <p class="small" style="margin-top:12px;">0 item(s) in this topic.</p>
  <div class="grid" id="cards"></div>
</div>
<script>
function esc(s) {
  return (s || "").replace(/[&<>]/g, function(c) {
    return ({"&":"&amp;","<":"&lt;",">":"&gt;"})[c];
  });
}
function escAttr(s) {
  return esc(s).replace(/"/g, "&quot;");
}
function resolveHref(href) {
  if (!href) return "#";
  if (/^(?:[a-z]+:|#|\/)/i.test(href)) return href;
  return href.startsWith("./") || href.startsWith("../") ? href : "../" + href;
}
const ITEMS = [];
const host = document.getElementById("cards");
ITEMS.forEach(function(it) {
  const card = document.createElement("div");
  card.className = "card";
  const text = it.text ? `<div class="small">${esc(it.text).slice(0, 260)}${it.text.length > 260 ? "..." : ""}</div>` : "";
  const kind = it.kind ? `<span class="pill">${esc(it.kind)}</span>` : "";
  const href = resolveHref(it.href || it.rel || "#");
  card.innerHTML = `<h3><a href="${escAttr(href)}">${esc(it.title)}</a></h3><div class="small">${esc(it.category || "")}</div>${kind}${text}`;
  host.appendChild(card);
});
</script>
<script>
(function() {
  var storageKey = "help_theme";
  function preferredTheme() {
    try {
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    } catch (e) {
      return "light";
    }
  }
  function applyTheme(t) {
    if (t === "dark" || t === "light") {
      document.documentElement.setAttribute("data-theme", t);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }
  function getSaved() {
    try { return localStorage.getItem(storageKey) || ""; } catch (e) { return ""; }
  }
  function setSaved(t) {
    try { localStorage.setItem(storageKey, t); } catch (e) {}
  }
  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") || preferredTheme();
  }
  function updateLabels() {
    var cur = currentTheme();
    var label = (cur === "dark") ? "Light mode" : "Dark mode";
    document.querySelectorAll(".theme-toggle").forEach(function(btn) {
      btn.textContent = label;
    });
  }
  function toggleTheme() {
    var cur = currentTheme();
    var next = (cur === "dark") ? "light" : "dark";
    applyTheme(next);
    setSaved(next);
    updateLabels();
  }
  function bind() {
    document.querySelectorAll(".theme-toggle").forEach(function(btn) {
      btn.addEventListener("click", function() {
        toggleTheme();
      });
    });
    updateLabels();
  }
  var saved = getSaved();
  applyTheme(saved || preferredTheme());
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bind);
  } else {
    bind();
  }
})();
</script>
