const ITEMS = [{"title": "AdroitCOM API Reference 10.0.5.1", "href": "spec_sheet_html/AdroitCOM_API_Reference_10.0.5.1.html", "category": "Spec Sheets", "rel": "spec_sheet_html/AdroitCOM_API_Reference_10.0.5.1.html", "kind": "Spec Sheet", "text": "[Page 1]\nAdvanced Worx 112 (Pty) Ltd • Registration No. 2001/027975/07 |20 Waterford Office Park, Corner Witkoppen Road and\nWaterford Drive, Fourways | PO Box 2904, Fourways, 2055, South Africa | Tel: +27 11 658-8100 | Fax: +27 11 658-8101 |\nWebsite: www.adroit.co.za Directors: D V Wibberley (Managing) | M G Lamusse | G J Campbell | F J Kok | J Nieuwenhuizen\nAdroitCOM (.NET Agent Server interface) usage and guidelines\nIntroduction\nThe AdroitCOM interface was designed as a COM wrapper for as_api to allow managed applications (.NET) to\nAs a rule this interface is designed to be used exclusively as an internal api for software provided and maintained by\nAdroit Technologies. As a result this interface may be altered without warning possibly hindering the functionality of\nany third party applications making use of this interface directly.\nAdroit Technologies also takes no responsibility whatsoever for any adverse effects induced through incorrect usage\nof this interface.\nNote that certain methods listed hereon are explicitly stated as being for internal use only but any public methods\nnot listed here but exposed by the interface are to be assumed to be for internal use and not for third party\nconsumption.\nArchitecture\nThe AdroitCOM interface comprises essentially 3 assemblies:\n1) AdroitCOM.dll\nThis is the COM wrapper for as_api and is registered in COM\n2) Interop.AdroitCOMLib.dll\nThis is the Interop library which facilitates accessing the COM library via a managed (.NET) application. This is\nthe assembly that is referenced by any managed application making use of this interface.\n3) as_api.dll\nThis assembly is shipped as part of the Adroit install and facilitates access to the Agent Server via unmanaged\napplications.\nAs the AdroitCOM is a registered COM library, only one instance can be installed on a machine at any given time and\ncare should be taken not to override any installed copy of this file as part of a normal Adroit / SmartUI installation.\nThe Interop library (Interop.AdroitCOMLib.dll), which would be directly referenced by the managed application,\nwould be incorporated and shipped as part of the third party application.\n\n[Page 3]\nGeneral Operations\n1) GetApiPath\nvoid GetApiPath(ref object pvariantResult, ref bool pvariantboolError, ref object pvariantErrorMessage)\nUsed internally to establish the path of the Adroit installation\n2) GetServerList\nvoid GetServerList(ref object pvariantResult, ref bool pvariantboolError, ref object pvariantErrorMessage)\nThis method returns a list of agent servers that are broadcasting on the network\n3) GetVersion\nvoid GetVersion(ref object pvariantResult)\nUsed internally to determine the version of as_api\n4) SetTimeout\nvoid SetTimeout(int timeout, ref bool pvariantboolError, ref object pvariantErrorMessage)\nUsed internally to set the timeout applied to various function calls\n\n[Page 8]\nScanning\n1) ScanTag\nvoid ScanTag(string bstrAgent, string bstrSlot, string bstrDeviceName, string bstrScanAddress, int\nplongScanRate, int plongDeadband, bool pvariantboolOutputenabled, ref bool pvariantboolError, ref object\npvariantErrorMessage)\nScans a tag based on the given parameters (legacy method)\n2) ScanTagEx\nvoid ScanTagEx(string bstrAgent, string bstrSlot, string bstrDeviceName, string bstrScanAddress, int\nplongScanRate, int plongDeadband, bool pvariantboolReadenabled, bool pvariantboolOutputenabled, bool\npvariantboolOutputinitialize, bool pvariantboolDemandscan, ref bool pvariantboolError, ref object\npvariantErrorMessage);\nCurrent method of adding scan points incorporating all scan modifiers.\n3) UnScanTag\nvoid UnScanTag(string bstrAgent, string bstrSlot, string bstrDeviceName, string bstrScanAddress, int\nplongScanRate, int plongDeadband, bool pvariantboolOutputenabled, int plongUnscanKey, ref bool\npvariantboolError, ref object pvariantErrorMessage)\nUnscans a tag as per the parameters matching those the original scan was created with. Note that this\nfunction requires a key which is not made public and thus this function is only for internal use.\n\n[Page 9]\nAlarming\n1) AddAlarmRoute\nvoid AddAlarmRoute(string bstrAlarmAgent, string bstrAlarmLists, string bstrAudioDevices, string\nbstrOutputs, string bstrEventLogs, ref object pvariantResult, ref bool pvariantboolError, ref object\npvariantErrorMessage)\nAdds a new route to a given Alarm agent with the given parameters\n2) AddAlarmType\nvoid AddAlarmType(string bstrAlarmAgent, string bstrAlarmTypeName, string bstrAgentType, int\nplongStatusMask, string bstrSlots, bool pvariantboolAlarmOffState, ref bool pvariantboolError, ref object\npvariantErrorMessage)\nAdds a new alarm type to a given Alarm agent with the given parameters\n3) AlarmTag\nvoid AlarmTag(string bstrAgent, string bstrAlarmAgent, string bstrAlarmType, int plongRoute, bool\npvariantboolAlarmAck, int plongAlarmTypeEnum, ref bool pvariantboolError, ref object pvariantErrorMessage)\nAlarms a specified agent to a given Alarm agent with the supplied parameters\n4) AlarmTagEx\nvoid AlarmTagEx(string bstrAgent, string bstrAlarmAgent, string bstrAlarmType, int plongRoute, bool\npvariantboolAlarmAck, int plongPriority, int plongDelay, string bstrCondition, System.DateTime\ndtInhibitedUntil, int plongAlarmTypeEnum, ref bool pvariantboolError, ref object pvariantErrorMessage)\nSame as the previous function with the addition of the condition, inhibit until and alarm delay parameters\n5) ChangeAlarmRoute\nvoid ChangeAlarmRoute(string bstrAlarmAgent, int plongRoute, string bstrAlarmLists, string\nbstrAudioDevices, string bstrOutputs, string bstrEventLogs, ref bool pvariantboolError, ref object\npvariantErrorMessage)\nAllows the modification of an existing alarm route\n\n[Page 10]\nSubscription Handling\nSubscription handling is done through a callback method which is registered with the AdroitCOM object instance.\nThis callback differs in structure from Adroit 10.0.5.1 onwards but both structures are shown herein.\nThe newer form of the callback is defined as follows:\nvoid SubscribeCallBack(ref object subscriptionId, ref object subscriptionValue, ref object subscriptionStatus, ref\nobject timeStamp, ref object pureStatusUpdate, ref object sequenceNumber)\nBinding to the sunscription callback is done similarly to binding to any event handler:\n_adroit.SubscriptionUpdate += SubscribeCallBack\nThe legacy form of the callback is defined similarly although is missing the sequence number which is an essential\npart of current methodologies around handling asynchronous subscription updates\nvoid SubscribeCallBack(ref object subscriptionId, ref object subscriptionValue, ref object subscriptionStatus, ref\nobject timeStamp, ref object pureStatusUpdate)\n\n[Page 11]\nHistorical Data\n1) GetHistoricalData\nvoid GetHistoricalData(string bstrAgent, string bstrSlot, System.DateTime dateStartTime, System.DateTime\ndateEndTime, uint ulongSampleRate, ref object pvariantResult, ref bool pvariantboolError, ref object\npvariantErrorMessage)\nRetrieves historical data for a given tag based on the supplied parameters\n2) GetHistoricalDataEx\nvoid GetHistoricalDataEx(string bstrAgent, string bstrSlot, System.DateTime dateStartTime,\nSystem.DateTime dateEndTime, int longSamples, ref object pvariantResult, ref bool pvariantboolError, ref\nobject pvariantErrorMessage)\nSame as the previous function except that only actual data points are returned and no interpolated values\nare given."}, {"title": "ATQMS-MKTG-DOC-ADR_10-Spec-Sheet-2024", "href": "spec_sheet_html/ATQMS-MKTG-DOC-ADR_10-Spec-Sheet-2024.html", "category": "Spec Sheets", "rel": "spec_sheet_html/ATQMS-MKTG-DOC-ADR_10-Spec-Sheet-2024.html", "kind": "Spec Sheet", "text": "[Page 1]\nATQMS- perator / Client\nEngineering Station\nSQL Server\nWindows Server 2016; 2019; 2022\nWindows 10; 11\nWindows 10; 11\nWindows Server 2016; 2019; 2022\nDatabase\nMicrosoft SQL Server 2017; 2019; 2022\nCPU****\nServer: Intel Xeon (or equivalent)\nDesktop: Intel I7 (or equivalent)\nDesktop: Intel I7 (or equivalent)\nServer: Intel Xeon (or equivalent)\nRAM\n16GB\n6GB Free (excluding datalog requirements)\n80GB Free\n80GB Free\n6GB Free (excluding database requirements)\nHDD Speed\n7200rpm (enterprise grade) **\n7200rpm\n7200rpm\n7200rpm (enterprise grade) **\nDisplay Resolution\nFull HD (1920 x 1080)\nFull HD (1920 x 1080)\nFull HD (1920 x 1080)\nFull HD (1920 x 1080)\nNetwork\n1 GB/s Full duplex ***\n1 GB/s Full duplex ***\n1 GB/s Full duplex ***\n1 GB/s Full duplex ***\nRecommended for: Adroit > 2 500; MAPS >2 500; Clusters; Hot Standby Systems; Distributed Multi-Server systems. ~ SQL & Reporting supported ~\nLarge\nHardware & Software\nAgent Server\nOperator / Client\nEngineering Station\nSQL Server\nWindows Server 2016; 2019; 2022\nWindows 10; 11\nWindows 10; 11\nWindows Server 2016; 2019; 2022\nDatabase\nMicrosoft SQL Server 2017; 2019; 2022\nCPU****\nServer: Intel Xeon (or equivalent)\nDesktop: Intel I7 (or equivalent)\nDesktop: Intel I7 (or equivalent)\nServer: Intel Xeon (or equivalent)\nRAM\n16GB\n12GB Free (excluding datalog requirements)\n80GB Free\n80GB Free\n12GB Free (excluding database requirements)\nHDD Speed\n7200rpm (enterprise grade) **\n7200rpm\n7200rpm\n7200rpm (enterprise grade) **\nDisplay Resolution\nFull HD (1920 x 1080)\nFull HD (1920 x 1080)\nFull HD (1920 x 1080)\nFull HD (1920 x 1080)\nNetwork\n1 GB/s Full duplex ***\n1 GB/s Full duplex ***\n1 GB/s Full duplex ***\n1 GB/s Full duplex ***\n\n[Page 4]\nATQMS-MKTG-DOC-ADR_10 - Spec Sheet 2024.docx\nP a g e | 4\n2. Web & Mobility : Supported Software\nSoftware\nPerformance Anywhere\nSecure Mobile Gateway\nOperating\nSystem\nAndroid 11 or higher\niOS 13.6 or iPadOS 13.6 or higher\nWindows Mobile (8,8.1,10)\nWindows OS 10 or higher (new Microsoft Edge & Google Chrome\nBrowsers only)\nAndroid 11 or higher\niOS 13.6 or iPadOS 13.6 or higher\nBrowser support: Chrome, Firefox, Safari, Opera, Edge;\nOS Support: Android, iOS, Linux, Windows\nOn-Cloud: Operator client install required (minimum hardware requirements)\nOn-Premise: Windows Server 2016; 2019; 2022; RDS Cals availability required *****\n8GB RAM; If running on VM, VT-X support required.\n3. Notes\nHard disk speed is of great importance when it comes to disk intensive operations like storing data. This applies to all forms whether logging to\na database or to proprietary datalog files. Hard disks with low rotational speeds (5400rpm) are not recommended in general as their read and\nwrite performance typically hinders overall performance of the system especially when it comes to historical data storage and retrieval\nIt is recommended that enterprise grade drives be used. Enterprise grade disk drives are characterised by greater reliability in that rated mean\ntime between failures (MTBF) tends to be several orders higher than standard desktop grade drives. Caution must be exercised when considering\ndrives with faster rotational speeds as well as solid state drives since reliability varies greatly depending on model and manufacturer\nNetwork speed represents only part of network performance, and it is important to consider network latency (turnaround time) when\nunderstanding overall performance. A \"fast\" network with high latencies will result in an overall poor performance when considering more\n\"chatty\" transactional network traffic such as that between Adroit Client and Server Applications.\nSimilarly, network stability also comes into play. It is vital that the network supporting any SCADA system be stable.\nThe minimum CPU specification indicated are determined based on the median size and configuration for projects in general. However, it is\npossible to configure and execute projects on less performant hardware, based on the experience and testing of the project execution. CPUs\nincluding the Intel Atom C series and Intel Atom P Series could be utilized, especially for HMI projects. A minimum of two cores are required.\nThe On-Premise Secure Mobile Gateway requires the end-user or integrator to ensure that the necessary cyber security measures are in place\nif cloud based access will be provided.\nFor the On-Cloud version, the Cyber Security measures are part of the Adroit Data Center services.\nFor further information please consult with your Sales Representative.\nGeneral:\nIMPORTANT: Please consult with your sales representative to verify the specific details required for your project and/or solution."}];
const SELF = "specifications";
const ADD_FROM = false;

function uniq(arr) {
  return [...new Set(arr)];
}

function normalise(s) {
  return (s || "").toLowerCase();
}

function getUI(it) {
  if (it.ui) return normalise(it.ui);
  const c = normalise(it.category || "");
  if (c.startsWith("classic ui - ")) return "classic ui";
  if (c.startsWith("smart ui - ")) return "smart ui";
  return "";
}

function getQ() {
  return document.getElementById("q").value || "";
}

function getInitialCategory() {
  try {
    return new URLSearchParams(window.location.search).get("cat") || "";
  } catch (e) {
    return "";
  }
}

function addParamsToHref(href, q) {
  try {
    let parts = href.split("#");
    let base = parts[0];
    let frag = parts.length > 1 ? "#" + parts.slice(1).join("#") : "";

    let qp = new URLSearchParams();
    if (q) qp.set("q", q);
    let qs = qp.toString();
    if (!qs) return base + frag;
    let joiner = base.includes("?") ? "&" : "?";
    return base + joiner + qs + frag;
  } catch (e) {
    return href;
  }
}

function freshChatHref() {
  try {
    const u = new URL(CHAT_HELP, window.location.href);
    u.searchParams.set("_t", String(Date.now()));
    return u.toString();
  } catch (e) {
    const sep = CHAT_HELP.includes("?") ? "&" : "?";
    return CHAT_HELP + sep + "_t=" + Date.now();
  }
}

function syncQuickFilterButtons() {
  const active = document.getElementById("cat").value;
  const productBtn = document.getElementById("filter-product-manuals");
  const supportBtn = document.getElementById("filter-supporting-docs");
  if (productBtn) productBtn.classList.toggle("active", active === "Product Manuals");
  if (supportBtn) supportBtn.classList.toggle("active", active === "Supporting Docs");
}

const chatLink = document.querySelector('[data-chat-help="1"]');
if (chatLink) {
  chatLink.href = freshChatHref();
  chatLink.addEventListener("click", () => {
    chatLink.href = freshChatHref();
  });
}

function render() {
  const qRaw = getQ();
  const q = normalise(qRaw);
  const ui = normalise(document.getElementById("ui").value);
  const cat = document.getElementById("cat").value;
  const mode = document.getElementById("mode").value;

  let filtered = ITEMS.filter(it => {
    if (ui && getUI(it) !== ui) return false;
    if (cat && it.category !== cat) return false;
    if (!q) return true;
    const hay = normalise(it.title + " " + it.rel + " " + it.category + " " + (it.text || ""));
    return hay.includes(q);
  });

  filtered.sort((a,b) => a.title.localeCompare(b.title));

  document.getElementById("counts").textContent =
    `${filtered.length} item(s) shown (of ${ITEMS.length}).`;
  syncQuickFilterButtons();

  const host = document.getElementById("results");
  host.innerHTML = "";

  const makeItemHtml = (it) => {
    const kind = it.kind ? ` <span class="small">[${it.kind}]</span>` : "";
    const href = addParamsToHref(it.href, qRaw.trim());
    return `<a href="${href}">${it.title}</a><span class="small">[${it.category}]</span>${kind}`;
  };

  if (mode === "alpha") {
    const ul = document.createElement("ul");
    filtered.forEach(it => {
      const li = document.createElement("li");
      li.innerHTML = makeItemHtml(it);
      ul.appendChild(li);
    });
    host.appendChild(ul);
    return;
  }

  if (mode === "ui") {
    const byUI = new Map();
    filtered.forEach(it => {
      const ui = getUI(it) || "other ui";
      if (!byUI.has(ui)) byUI.set(ui, []);
      byUI.get(ui).push(it);
    });

    const uis = Array.from(byUI.keys()).sort((a,b)=>a.localeCompare(b));
    uis.forEach(u => {
      const div = document.createElement("div");
      div.className = "group";
      const label = u === "other ui" ? "Other UI" : (u === "classic ui" ? "Classic UI" : "Smart UI");
      div.innerHTML = `<h2>${label}</h2>`;
      const ul = document.createElement("ul");
      byUI.get(u).forEach(it => {
        const li = document.createElement("li");
        const href = addParamsToHref(it.href, qRaw.trim());
        const kind = it.kind ? ` <span class="small">[${it.kind}]</span>` : "";
        li.innerHTML = `<a href="${href}">${it.title}</a>${kind}`;
        ul.appendChild(li);
      });
      div.appendChild(ul);
      host.appendChild(div);
    });
    return;
  }

  const byCat = new Map();
  filtered.forEach(it => {
    if (!byCat.has(it.category)) byCat.set(it.category, []);
    byCat.get(it.category).push(it);
  });

  const cats = Array.from(byCat.keys()).sort((a,b)=>a.localeCompare(b));
  cats.forEach(c => {
    const div = document.createElement("div");
    div.className = "group";
    div.innerHTML = `<h2>${c}</h2>`;
    const ul = document.createElement("ul");
    byCat.get(c).forEach(it => {
      const li = document.createElement("li");
      const href = addParamsToHref(it.href, qRaw.trim());
      const kind = it.kind ? ` <span class="small">[${it.kind}]</span>` : "";
      li.innerHTML = `<a href="${href}">${it.title}</a>${kind}`;
      ul.appendChild(li);
    });
    div.appendChild(ul);
    host.appendChild(div);
  });
}

function initCats() {
  const select = document.getElementById("cat");
  const cats = uniq(ITEMS.map(x => x.category)).sort((a,b)=>a.localeCompare(b));
  cats.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    select.appendChild(opt);
  });

  const initialCat = getInitialCategory();
  if (initialCat && cats.includes(initialCat)) {
    select.value = initialCat;
  }
}

["q","ui","cat","mode"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});

document.getElementById("clear").addEventListener("click", () => {
  document.getElementById("q").value = "";
  document.getElementById("ui").value = "";
  document.getElementById("cat").value = "";
  document.getElementById("mode").value = "alpha";
  render();
});

function bindQuickFilterButton(id, category) {
  const btn = document.getElementById(id);
  if (!btn) return;
  const hasCategory = ITEMS.some(it => it.category === category);
  if (!hasCategory) {
    btn.disabled = true;
    btn.title = `No ${category} items on this page`;
    return;
  }
  btn.addEventListener("click", () => {
    const select = document.getElementById("cat");
    select.value = (select.value === category) ? "" : category;
    render();
  });
}

bindQuickFilterButton("filter-product-manuals", "Product Manuals");
bindQuickFilterButton("filter-supporting-docs", "Supporting Docs");

initCats();
render();
</script>
<script>
(function() {
  var storageKey = "help_theme";
  function preferredTheme() {
    try {
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    } catch (e) {
      return "light";
    }
  }
  function applyTheme(t) {
    if (t === "dark" || t === "light") {
      document.documentElement.setAttribute("data-theme", t);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }
  function getSaved() {
    try { return localStorage.getItem(storageKey) || ""; } catch (e) { return ""; }
  }
  function setSaved(t) {
    try { localStorage.setItem(storageKey, t); } catch (e) {}
  }
  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") || preferredTheme();
  }
  function updateLabels() {
    var cur = currentTheme();
    var label = (cur === "dark") ? "Light mode" : "Dark mode";
    document.querySelectorAll(".theme-toggle").forEach(function(btn) {
      btn.textContent = label;
    });
  }
  function toggleTheme() {
    var cur = currentTheme();
    var next = (cur === "dark") ? "light" : "dark";
    applyTheme(next);
    setSaved(next);
    updateLabels();
  }
  function bind() {
    document.querySelectorAll(".theme-toggle").forEach(function(btn) {
      btn.addEventListener("click", function() {
        toggleTheme();
      });
    });
    updateLabels();
  }
  var saved = getSaved();
  applyTheme(saved || preferredTheme());
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bind);
  } else {
    bind();
  }
})();
</script>
