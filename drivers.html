...................................... 15 6.3.2. Message Boxes ........................................................................................................................................ 16 7. Revisions ........................................................................................................................................... 17 7.1. Document Revision........................................................................................................................ 17 7.2. DLL Revision ................................................................................................................................. 17 _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_OPC_UA.docx P a g e | 4 1. Overview OPC UA (OLE for Process Control Unified Architecture) is a standard specification that makes it possible for automation/control software applications and field systems/devices to interoperate and communicate data between each other. To learn more about what OPC UA is, visit the OPC foundation website: https://opcfoundation.org/about/opc-technologies/opc-ua/ The OPC UA client driver for Adroit communicates to OPC servers that expose an OPC UA interface. 1.1. Connectivity The OPC UA client driver communicates with OPC UA Servers in accordance with the OPC UA Specification whose details are beyond the intended scope of this document. 1.2. Driver Installation and Setup If the Adroit OPC UA Client driver is not installed, you will need to install it. Installation of this driver for the first time will install the OPC Foundation’s OPC UA redistributable if not already installed on your PC. The following files will be installed agent server folder: • d_opc_ua.dll • d_opc_ua.doc • opcuabrowser.exe as well as the following 3rd party dependency files: • libeay32.dll • libxml2.dll • TB5CPP.dll • TB5OT.dll • TB5STACK.dll • TB5UTIL.dll If any of these files is not in the agent directory, then the driver did not install properly. 1.3. OPC UA Instance Certificates The OPC UA specification requires that all UA clients have an instance certificate that positively identifies the client to the server. The instance certificate for Adroit OPC UA is automatically created on the Agent Server PC when the OPC UA Protocol driver DLL is loaded by PSEXE or AS.EXE for the first time. The instance certificate can also be created manually by executing the %ProgramData%\\Adroit Technologies\\Adroit\\certs\\create_instance_certificate.bat file which is found in the folder. This will be required if the certificate expires. Before executing the batch file, delete the existing certificate called cert_adroit_client.der file will be found in the %ProgramData%\\Adroit Technologies\\Adroit\\certs\\own folder. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_OPC_UA.docx P a g e | 5 Once the batch file has completed, the following folders will have been created under the certs folder, if the batch file is being executed for the first time: crl issuer own private rejected trusted As mentioned above, the cert_adroit_client.der file will be found in the certs/own folder and the private_key_adroit_client.pem file will be found in the certs/private folder. Select these two files for the instance certificate entries above. Furthermore, the cert_adroit_client.der file needs to be copied to the trusted certificate folder of the OPC UA Server/s that you will be communicating to. Conversely, the OPC UA Server instance certificate needs to be copied to the Adroit system folder for two way authentication. The certificate types should be the same. 1.4. OPC UA Server Certificates The OPC UA specification requires that all UA clients trust the server certificate for the OPC UA server that they are connecting to. By default, server certificates will be placed in the %ProgramData%\\Adroit Technologies\\Adroit\\rejected folder when a client connects to the OPC UA server for the first time. These must be manually copied to the %ProgramData%\\Adroit Technologies\\Adroit\\trusted folder before a successful connection will be allowed. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_OPC_UA.docx P a g e | 6 2. Wiring Not applicable. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_OPC_UA.docx P a g e | 7 3. Device Configuration When configuring an OPC UA client device, the following dialog is launched and must be completed accordingly. 3.1. Device Configuration 3.1.1. OPC UA Server On selecting the […] button for “Endpoint URL” you will be presented with the “Connect to Server” dialog. See section Connect to Server. The device configuration dialog has 3 different layouts depending on the authentication type selected. Anonymous authentication (Default): _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_OPC_UA.docx P a g e | 8 Username Authentication looks as follows: User credentials - if authentication type = username, a username and password must be specified. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_OPC_UA.docx P a g e | 9 Certificate Authentication looks as follows: User certificates - if authentication type = certificate, a certificate must be specified. User certificates need to be issued by a 3rd party certification authority. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_OPC_UA.docx P a g e | 10 Issued Token Authentication looks as follows: 3.1.2. General Timestamp source – Local, Server or Source. Default is Local. • Local – If this option is selected, the driver will update values with the timestamp of when the driver receives the value. • Server – When the OPC server sends a value the driver, whether by exception or from being polled, the OPC server return two timestamps, the timestamp that the server received the value, or the timestamp that the device/source received the value, by selecting this radio button, the driver will update values with the server’s timestamp. • Source – The driver will update values with the device/source timestamp as mentioned above. (Important: do not use this timestamp option if the communication protocol connecting to the device does not supply a timestamp) Should you wish to use Server or Source timestamps, you must ensure that the agent server and the OPC UA Server and/or the remote device are time synced to the same time source as the agent server! Polled – OPC clients by nature receive data “by exception” from OPC Servers. However, you can use OPC for polling data from front end devices. This setting enables polling as opposed to “by exception”. This setting should only be used if absolutely necessary. (Default off) Timeout – The timeout value in msecs. If polled mode is not enabled (which is the norm), you must either: _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_OPC_"}, {"title": "d_sigfox", "href": "drivers_html/d_sigfox.html", "category": "Drivers", "rel": "drivers_html/d_sigfox.html", "kind": "Driver", "text": "Adroit Technologies Protocol Driver Name Sigfox Protocol Driver DLL D_SIGFOX _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_SIGFOX.docx P a g e | 2 COPYRIGHT Copyright © 2022 Advanced Worx 112 (Pty) Ltd. All rights reserved. Information in this document is subject to change without notice. The software described in this document is furnished under a license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of those agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or any means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal use without the written permission of Advanced Worx 112 (Pty) Ltd. Advanced Worx 112 (Pty) Ltd 20 Waterford Office Park 189 Witkoppen Road (c/o Waterford Drive) Fourways South Africa https://adroittech.co.za/ _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_SIGFOX.docx P a g e | 3 Contents 1. Overview ............................................................................................................................................. 4 2. Wiring ................................................................................................................................................. 5 3. Device Configuration .......................................................................................................................... 6 3.1. Part 1 ............................................................................................................................................. 6 3.1.1. Setting up Devices on the Sigfox Cloud ....................................................................................................... 6 3.1.2. Sigfox Backend Hierarchal Structure ........................................................................................................... 7 3.1.3. Creating a new Device Type ...................................................................................................................... 8 3.1.4. Creating a new Device............................................................................................................................... 9 3.1.5. Setting up the Sigfox Callback .................................................................................................................... 9 3.1.6. Setup Validation ...................................................................................................................................... 10 3.2. Part 2 ........................................................................................................................................... 11 3.2.1. Setting Up the Adroit Sigfox Driver ............................................................................................................ 11 3.3. Configuration Dialog ...................................................................................................................... 13 3.3.1. Driver Details .......................................................................................................................................... 14 3.3.2. Primary Connection Parameters ................................................................................................................ 14 3.3.3. REST API ................................................................................................................................................ 14 3.3.4. HTTP Server ............................................................................................................................................ 14 3.3.5. Script ...................................................................................................................................................... 14 3.3.6. TimeOut ................................................................................................................................................. 14 4. Supported Addresses ........................................................................................................................ 15 4.1. Example ....................................................................................................................................... 16 5. Protocol Definition and Considerations ............................................................................................ 17 5.1. Final Verification ........................................................................................................................... 17 6. General Notes and Troubleshooting ................................................................................................. 18 6.1. Contact Details .............................................................................................................................. 18 6.2. Adroit Technologies Knowledge Base .............................................................................................. 18 6.3. Troubleshooting ............................................................................................................................ 18 7. Revisions ........................................................................................................................................... 21 7.1. Document Revision........................................................................................................................ 21 7.2. DLL Revision ................................................................................................................................. 21 _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_SIGFOX.docx P a g e | 4 1. Overview Sigfox is a Low Power Wide Area Network (LPWAN) technology that allows Sigfox enabled devices to send small packets of data to the Sigfox Cloud (dedicated Sigfox servers on the internet). Sigfox uses a very light-weight protocol, so devices consume very little power and can operate over large distances. As shown below, the Sigfox network consists of objects (devices), Sigfox Stations (gateways) and the Sigfox cloud (internet). Objects are Sigfox compliant sensors that send data over the air to the Sigfox base stations, which then routes the data to the Sigfox Cloud (also known as the Sigfox backend). The Adroit Sigfox Driver then communicates with the Sigfox cloud via an API or a call- back, to retrieve the objects data. Figure 1 Sigfox Overview This Sigfox Driver document is divided into two parts: Setting up and registering objects/devices onto the Sigfox cloud. Setting up the Adroit Sigfox driver to communicate to the Sigfox cloud. PLEASE NOTE The Sigfox cloud can store a maximum of 1 years’ worth of data per device. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_SIGFOX.docx P a g e | 5 2. Wiring Not applicable. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_SIGFOX.docx P a g e | 6 3. Device Configuration 3.1. Part 1 3.1.1. Setting up Devices on the Sigfox Cloud Before you can register your Sigfox devices onto the Sigfox Cloud, there are two things you must do: Make sure there is Sigfox Coverage in the area that you are deploying the devices. If there is no Sigfox coverage, please contact South Africa’s Sigfox Local Operator - Sqwidnet at https://www.sqwidnet.com/. Buy a Sigfox contract and load tokens onto that contract. Each Sigfox device you are registering requires one token. There are three different types of contracts: 140 messages per day, 50 messages per day and 2 messages per day. If your device can send 140 messages per day, then go with this contract. Similarly, if your device can only send 2 messages per day, then go for the 2 messages/day contract. Contact your country’s Sigfox operator for more information on the different types of contracts and how to purchase them. In South Africa, please contact South Africa’s Sigfox Local Operator - Sqwidnet at https://www.sqwidnet.com/. PLEASE NOTE If you need to register 10 devices onto a 140 messages/day contract, then you need 10 tokens on that 140 messages/day contract. PLEASE NOTE Each device type is associated to a specific contract, so make sure it is the correct contract (140/50/2 messages per day). _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_SIGFOX.docx P a g e | 7 3.1.2. Sigfox Backend Hierarchal Structure Figure 2 displays the hierarchal structure of the Sigfox backend, which is arranged in the following way: 1. Groups: This is the highest level. For example we have an Adroit group. 2. Sub-groups: Groups are divided into several sub-groups; we divide each customer into their own sub-group. 3. Device types: Group of devices with the same behavior. All sensors that have same manufacturer, payload, contract and call-back will fall into the same Device Type, for example Device_Type_Visio_Pressure. 4. Devices: Also known as objects, fall under a specific Device type category. They have a unique PAC ID, ID and a Product Certificate. For example, device_VisioPressure_123456. Figure 2 Sigfox Cloud Architecture _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_SIGFOX.docx P a g e | 8 To register a new Sigfox device, we must choose a group, sub-group and device type which is associated with that device. As shown in Figure 3, choose the group, which the new device should belong too. Figure 3: Sigfox Backend Groups and Sub-Groups In figure 3, Adroit Technologies is the main group and JW_Group is a sub-group of the Adroit Technologies group. Use the sub-groups to divide customers of Adroit. For instance, if we have a new client called Tim, then create a Tim sub-group and connect all device types, contracts and devices associated to Tim on the Tim Sub-group. Keep in mind we can also give certain Sigfox users access to certain Sigfox groups and sub-groups. 3.1.3. Creating a new Device Type Next, we need to create a new device type for our new device we want to register. Figure 4 shows a description of each parameter. Figure 4: Creating a new Device Type _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_SIGFOX.docx P a g e | 9 PLEASE NOTE Contracts cannot be changed once device type is created. In figure 4, the most important fields are the Device Type name (keep to naming conventions), the contract (discussed above), the payload parsing (keep this as Regular). Downlink data is if you are writing information down to the device from the Sigfox backend. This is not currently implemented in the Sigfox driver, so keep this field (Downlink Mode) as NONE. 3.1.4. Creating a new Device Once the device type is created, then we can register our device to that device type. Figure 5 displays the parameters required for registering a new device. Figure 5: Creating a New Device In Figure 5, the Device ID (keep to naming conventions), PAC and end product certificate must be supplied by the manufacturer of the Sigfox device. For instance, if VisioSoft manufactured the device, then communicate with them to get this information. 3.1.5. Setting up the Sigfox Callback The Sigfox Callback is used to send data to a specific computer on the internet when the value of a device changes on the Sigfox backend. As shown in Figure 6, the callback is a query string with a public facing IP address (41.185.80.219) and an open port (5004) on the machine. This should be the IP a"}, {"title": "Device Driver Supplement", "href": "drivers_html/Device_Driver_Supplement.html", "category": "Drivers", "rel": "drivers_html/Device_Driver_Supplement.html", "kind": "Driver", "text": "Mitsubishi : AJ71E71 Printed 17-Aug-20 1 Mitsubishi MITAJE71 protocol driver Overview This driver supports the A Series of PLC’s. Revision 103 onwards also supports the the FX3U PLC. NOTE : Support for QnA and Q series controllers has moved to the Mitsubishi Q driver, revision 101 no longer supports QnA or Q processors. The SNMP and FTP services are not required for Adroit to Mitsubishi communication. For improved network performance and reliability, it is recommended that you install 2 network adapters into your PC. Use the first adapter for Adroit to Adroit and all other NT connectivity. The first adapter may have all the default installation bindings. Use the second adapter for Adroit to PLC (AJ71E71 communication processor) connectivity and bind only to the TCP/IP protocol. Contents Mitsubishi MITAJE71 protocol driver ............................................................................ 1 Overview ................................................................................................................................ 1 Device Configuration ............................................................................................................ 2 Wiring .................................................................................................................................... 3 PLC software ......................................................................................................................... 3 Supported addresses ............................................................................................................. 5 Message protocol ................................................................................................................... 7 Appendix A .......................................................................................................................... 11 Appendix B .......................................................................................................................... 25 Revision Information .......................................................................................................... 30 Adroit Protocol Driver Setup Manual 2 Printed 17-Aug-20 Device Configuration One device agent must be configured for each CPU to be communicated to. PLC Details CPU Type - The following CPU types are supported; A1, A1N, A2, A2N, A2C, AOJ2H, A2-S1, A2N-S1, A3N, A3M, A2A, A2A-S1, A3, Q-Series,Fx3U. IP Address - Identifies the Mitsubishi PLC’s IP addresses. This address must be unique. It defaults to your local IP (40.0.0.1). Port - TCP/IP port number. The PLC software shipped with the driver is programmed for port 1280 - 1287. Heartbeat Bit (M) - In order to guarantee the re-establishment (under all circumstances) of a connection between Adroit and the Mitsubishi PLC, the heartbeat bit is used. Adroit will set this bit every Heartbeat time-out period. The PLC program will reset this bit immediately after Adroit has set it. The PLC program will also monitor this bit and reset the connection if the 120 seconds (PLC program default) has elapsed without being set by Adroit. Heartbeat Time-out - The heartbeat pulse generated by Adroit to keep the communication link alive. Adroit will set the Heartbeat Bit every Heartbeat time period. CPU Time-out - This is the time-out period for transactions between the AJ71E71 card and the PLC CPU. Mitsubishi : AJ71E71 Printed 17-Aug-20 3 Local Details Time-out - The maximum time allowed for Adroit to PLC communication messages before a time-out error will be registered. Detailed debugging - Currently detailed debugging does the following: 1. Shows transaction start and end times 2. Describes each read opperation before executing it The Agent server must as always be re-started for the options changed in this dialog to take effect. Test Device Config for Connectivity This section is available to help users determine whether or not the settings they have entered are valid and Adroit can communicate with your device. Test Address – An address in your device which will be polled when the “Read Address” button is clicked. The address entered must be valid. IO Type – The address type being read. ie Boolean, integer, real or string. Read Address – Click this button to poll your device with the current settings in your dialog. Reply – When “Read Address” is clicked, Adroit will poll your device. The value returned from your device will be displayed here. Wiring As per Ethernet standards. AJ71E71 module Set the Mode switch to 0. Set SW-7 to ON to allow Adroit to write to PLC memory. All other switches must be off. Ref: Mitsubishi Electric Corporation AJ71E71 User Manual, Document Number IB (NA) 66310-A (9105) MEE, page 4-6, May 1991 AJ71E71N-B5T Note: The dip-switch SW-7 is on the mini-dip inside the module. PLC software A Series PLC setup PLC software is required to allow communication with the AJ71E71 card. Copies of this software for the Mitsubishi AJ71E71 card is available as part of the Adroit 3.51 distribution in the Samples/MitPLC sub-directory. A GX-Developer 7 project is also available. All PLC items used by this software has to be checked for possible conflict with your existing PLC program. Adroit Protocol Driver Setup Manual 4 Printed 17-Aug-20 Fx3U Series PLC setup FX Configurator-EN software is required to allow communication with the Fx3U Ethernet card. This software is available from CBI Automation. Appendix B has step by step instructions on how to setup the Ethernet card that Adroit can talk to it using the FX Configurator-EN software. Software Note - Copies of the Mitsubishi PLC software for the AJ71E71 adapter is available on a No Guarantee basis and the standard terms of Adroit software distribution apply. Adroit Technologies will therefore not accept any responsibility for any direct, indirect or consequential damages of any nature that may occur as a result of the use of such software. A listing of the program follows appears in appendix A. Troubleshooting It is possible that by modifying the default settings, that the watchdog sent by the driver may not arrive in the PLC, thus causing the PLC to “intermittently” reset our connection to the PLC. Ensure that the timer in the PLC (which runs for 120 seconds by default) is at least double the setting used by the driver. If the driver channel is backlogged (ie the driver is too busy with polling tasks), the watchdog may also be delayed,as it is not a foreground process in the driver. Driver backlogging or queing is easily detectable by setting a value in register in the PLC, and then timing how long it takes to receive a feedback via another tag which was scanned to the same register. Mitsubishi : AJ71E71 Printed 17-Aug-20 5 Supported addresses Mitsubishi A series PLC data (device) types supported in the Adroit Protocol Driver Product Version 3.51 Build 151 (Pvt. Build 88) Please see Table 8.2 on page 8-15 of the Ethernet Interface Module Manual : IB (NA) 66310-A (9105) MEE Device Min Range Max Range* PLC Data Type BOOLEAN INTEGER REAL STRING Data Reg D 0 6143 Int 16 D 1.2 D 0 D 0 D 0 Sn 6143 BCD 16 D 0 B D 0 B 6142 BCD 32 D 0 C D 0 C 6142 Long D 0 L D 0 L 6142 Real 32 D 0 R Data Reg D 9000 9255 Int 16 D 1.2 D 0 D 0 D 0 Sn 9255 BCD 16 D 0 B D 0 B 9254 BCD 32 D 0 C D 0 C 9254 Long D 0 L D 0 L 9254 Real 32 D 0 R Link Reg W 0 0xFFF Int 16 W1.2 W 0 W 0 W 0 Sn File Reg R 0 8191 Int 16 R 0.0 R 0 R 0 R 0 Sn 8191 BCD 16 R 0 B R 0 B 8190 BCD 32 R 0 C R 0 C 8190 Long R 0 L R 0 L 8190 Real 32 R 0 R Ext File Reg E 0:0 28:8191 Int 16 E 1:0.0 E 1:0 E 1:0 E 1:0 Sn 28:8191 BCD 16 E 1:0 B E 1:0 B 28:8190 BCD 32 E 1:0 C E 1:0 C 28:8190 Long E 1:0 L E 1:0 L 28:8190 Real 32 E 1:0 R Timer T 0 2047 Int 16 T 0 T 0 Counter C 0 1023 Int 16 C 0 C 0 Inputs X 0 0x7FF Bool X 0 X 0 (16) X 0 (16) 0x7F0 BCD 16 X 0 B X 0 B Outputs Y 0 0x7FF Bool Y 0 Internal Relay M/L/S 0 8191 Bool M 0 9000 9255 Bool L 0 Link Relay B 0 0xFFF Bool B 0 Annunciator F 0 0x7FF Bool F 0 Address register numbers are in decimal or HEX notation depending on: Device Prefix Notation Data Reg D DECIMAL Link Reg W HEX File Reg R DECIMAL Ext File Reg E DECIMAL Timer T DECIMAL Counter C DECIMAL Inputs X HEX Outputs Y HEX Internal Relay M,L,S DECIMAL Link Relay B HEX Ann irst word Last Word 00 00 00 00 Write response: Subheader Completion Code 83 00 Link Registers Read request: Read word PC CPU 2500 ms t/o Offset Type Length End 01 ff 0a 00 00 00 00 00 20 57 00 00 Read response: Subheader Completion Code First data word Last data word 81 00 00 00 00 00 Write request: Write word PC CPU 2500 ms t/o Offset Type Length End 03 Ff 0a 00 00 00 00 00 20 57 00 00 First word Last Word 00 00 00 00 Write response: Subheader Completion Code 83 00 File Registers Read request: Read word PC CPU 2500 ms t/o Offset Type Length End 01 ff 0a 00 00 00 00 00 20 52 00 00 Read response: Subheader Completion Code First data word Last data word 81 00 00 00 00 00 Write request: Write word PC CPU 2500 ms t/o Offset Type Length End 03 ff 0a 00 00 00 00 00 20 52 00 00 Write response: Adroit Protocol Driver Setup Manual 8 Printed 17-Aug-20 Subheader Completion Code 83 00 Extended File Registers Read request: Read word PC CPU 2500 ms t/o Offset Type Block Length End 17 ff 0a 00 00 00 00 00 20 52 01 00 00 00 Read response: Subheader Completion Code First data word Last data word 97 00 00 00 00 00 Write request: Write word PC CPU 2500 ms t/o Offset Type Block Length 18 ff 0a 00 00 00 00 00 20 52 01 00 00 End First word Last Word 00 00 00 00 00 Write response: Subheader Completion Code 98 00 Timers Read request (Present Value): Read word PC CPU 2500 ms t/o Offset Type Length End 01 ff 0a 00 00 00 00 00 4e 54 00 00 Response: Subheader Completion Code First data word Last data word 81 00 00 00 00 00 Write request: Write word PC CPU 2500 ms t/o Offset Type Length End 03 ff 0a 00 00 00 00 00 4e 54 00 00 First word Last Word 00 00 00 00 Write response: Subheader Completion Code 83 00 Counters Read request (Present Value): Read wor"}, {"title": "dnp3", "href": "drivers_html/dnp3.html", "category": "Drivers", "rel": "drivers_html/dnp3.html", "kind": "Driver", "text": "Adroit Technologies Protocol Driver Name DNP3 Level 2+ DLL DNP3 _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-DNP3.docx P a g e | 2 COPYRIGHT Copyright © 2022 Advanced Worx 112 (Pty) Ltd. All rights reserved. Information in this document is subject to change without notice. The software described in this document is furnished under a license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of those agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or any means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal use without the written permission of Advanced Worx 112 (Pty) Ltd. Advanced Worx 112 (Pty) Ltd 20 Waterford Office Park 189 Witkoppen Road (c/o Waterford Drive) Fourways South Africa https://adroittech.co.za/ _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-DNP3.docx P a g e | 3 Contents 1. Overview ................................................................................................................................................. 4 2. Wiring ..................................................................................................................................................... 4 3. Device Configuration .............................................................................................................................. 5 3.1. Configuration ....................................................................................................................................... 5 3.2. Master Details ...................................................................................................................................... 6 3.3. Slave Details ........................................................................................................................................ 6 3.4. Communication Settings ....................................................................................................................... 6 3.4.1. RS-232, RS-485, MODEM Specific Parameters: .................................................................................................. 6 3.4.2. TCP/IP, UDP/IP Specific Parameters: ................................................................................................................ 7 3.5. Modem Details ..................................................................................................................................... 8 3.6. Advanced .......................................................................................................................................... 10 3.7. Controls and Outputs.......................................................................................................................... 11 3.7.1. Scheme Table: ............................................................................................................................................. 11 3.8. Maximum Addresses ........................................................................................................................... 13 3.9. Unique Driver Specifications ................................................................................................................ 13 4. Supported Addresses ............................................................................................................................ 16 4.1. Advanced Registry Key Settings .......................................................................................................... 17 5. Protocol Definition and Considerations ................................................................................................ 18 6. General Notes and Troubleshooting ..................................................................................................... 19 6.1. Contact Details ................................................................................................................................... 19 6.2. Adroit Technologies Knowledge Base ................................................................................................... 19 7. Appendix A – Master Profile Document ................................................................................................ 20 8. Appendix B - DNP Subset Definitions ................................................................................................... 23 9. Revisions ............................................................................................................................................... 27 9.1. Document Revision............................................................................................................................. 27 9.2. DLL Revision ...................................................................................................................................... 27 _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-DNP3.docx P a g e | 4 1. Overview Adroit supports communication with the following DNP3 levels : Level 1 and level 2 and some level 3 and 4 functions. 2. Wiring Standard depending on configuration. DNP3 can be utilised with RS-485, RS-232, Modem (RS- 232), and Ethernet. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-DNP3.docx P a g e | 5 3. Device Configuration 3.1. Configuration _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-DNP3.docx P a g e | 6 Enable Secondary – Will allow configuration for a second communication resource that will allow for dual redundancy at the driver level. The device will then be able to switching between configurations when a completed retry cycle exits without response from the slave device. Primary / Secondary – Selects between the two configurations (Enable Secondary must be enabled.) 3.2. Master Details Link ID - Master identification number. Port – (Ethernet only) The TCP or UDP port number to use on the master side. Com Type – Choice between Rs232, Rs485, Modem(Rs232) or Ethernet communications resource. 3.3. Slave Details Link ID - Slave identification number. Device Type - Unrestricted currently implements protocol maximums device specific maximums and default will become available when available. IP - (Ethernet only) Remote IP address. Port - (Ethernet only) Only available ports will be listed here. 3.4. Communication Settings Communication Combo box: RS232, RS485, TCP/IP, UDP/IP, MODEM. Some group box areas will dynamically update to suit the communications resource selected. Retry - The number of times that Adroit will try to gain communication with a PLC before failing a transaction. Timeout - The time that Adroit will wait for a valid response from a PLC before failing a transaction (Read or Write). This is referring to time allowed to receive individual transport fragments that make up and application fragment. See Application timeout in the advanced dialogue for the overall Application timeout. 3.4.1. RS-232, RS-485, MODEM Specific Parameters: Com Port – Select as per requirement. Baud Rate – Select as per requirement. Parity – Select as per requirement. Databits – Select as per requirement. Stopbits – Select as per requirement. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-DNP3.docx P a g e | 7 RTS – If enabled, the RTS signal line will be permanently on. If disabled, the RTS signal line will be permanently off. Other options are Toggle or Handshake as per requirement. Manual RTS for Radios – (Rs232 only) RTS will be asserted according to the delays specified below. This will allow the RTS to signal the radio key. Pre TX delay – (Rs232 only) (only if Manual RTS for Radios is checked) Key up time before manual RTS is Asserted (Read or Write). Post TX delay - (Rs232 only) (only if Manual RTS for Radios is checked) Key down time before manual RTS is de-asserted after transmission (Read or Write). DTR – (Serial types only) – If enabled, the DTR signal line will be permanently on. If disabled, the DTR signal line will be permanently off. Other option is Handshake as per requirement. CTS – (Serial types only) If enabled, the CTS signal line will be permanently on. If disabled, the CTS signal line will be permanently off. DSR – If enabled, the DSR signal line will be permanently on. If disabled, the DSR signal line will be permanently off. Rs485 Reflections – (Rs485 only) If checked, reflections are expected and will be filtered out during on any read algorithm. Currently no reflection checking is enabled. Enable DCD support – (Default = OFF) If checked, it will enable data carrier detection so that the driver attempts to prevent clashes (especially when using radios). Max DCD Wait Time (mSec) – Maximum backoff time to wait while a carrier busy is detected. If this time is exceeded before transmission, the transaction will fail, and normal retry procedures will be followed. 3.4.2. TCP/IP, UDP/IP Specific Parameters: Keep Alive – (Ethernet types only) The period (in milliseconds) the driver will wait between keepalive (LINK TEST) messages. Incoming connection only – (Ethernet types only)If checked the driver will wait for incoming connections, it will not initiate connections, used for internet of things type devices that connect to the master only periodically, see Contact lost setting too. The driver will operate as normal when a connection is established, if the outstation disconnects the driver will wait for the next connection to continue. The master will not disconnect, that function is left up to the slave (Default = unchecked). Contact lost delay (mSec) – (Ethernet types only) Only active if the Incoming connection only is checkbox is checked. This is the period (in milliseconds) the driver will wait before marking I/O point as comms fail (Default = 93600000 = 26 hours). _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-DNP3.docx P a g e | 8 If Modem communication resource was selected: Modem Button – When clicked you will be able to setup the appropriate modem configuration details. See the Modem Support dialog menu below: 3.5. Modem Details Connection string – The string used in configuring the modem on each dialup attempt. This will allow modem specific configurations before the dial attempt take place. Dial Number – The destination telephone number. Connection Timeout – (milliseconds) The maximum period allowed to dial. Inactivity Timeout – (milliseconds) The inactivity period before the modem auto hangs up. Phone Type – Tone or Pulse mode. Ignore Dial Tone – Set if dial tone is unavailable or is at an unreliable level. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-DNP3.docx P a g e | 9 _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-DNP3.docx P a g e | 10 3.6. Advanced Periodic Poll (mSec) - Insert the required period in milliseconds here to cause the driver to initiate a periodic poll which consists of any (or all) classes defined in the dropdown check combo alongside. Integrity Poll Ratio - Insert the required ratio of periodic to integrity polls which consists of any or all classes defined in the dropdown check combo alongside. E.g. if 10 is used, every 10th periodic poll will be an Integrity poll and not periodic. (Note: integrity poll should have class 0 da"}, {"title": "DSC Envisalink Ethernet", "href": "drivers_html/DSC_Envisalink_Ethernet.html", "category": "Drivers", "rel": "drivers_html/DSC_Envisalink_Ethernet.html", "kind": "Driver", "text": "DSC EnvisaLink Ethernet Driver DSC EnvisaLink Ethernet Driver Overview This document describes the setup of, and the communication protocol implemented in the Adroit protocol driver, with the following logic unit: DSC EnvisaLink. Device Configuration Configuration Selection Enable Secondary – Enables secondary configuration for dual redundant Controllers. This setting is disabled for this driver. Primary / Secondary – Select the primary or secondary button depending on which connection you wish to configure. This setting is disabled for this driver. 1 Adroit Protocol Driver Setup Manual IP Settings IP Address – The IP Address that will be used for communicating with the controller. Passwords Please note. Passwords are encrypted using 16 bit key encryption before being stored in the registry. TPI Password – Enter your envisalink webpage password here DSC Master Code – Enter the DSC alarm panel’s master code. This is used to arm and disarm the alarm panel. DSC Installer Code – Enter the DSC alarm panel’s installer code. This is used when configuring the alarm panel. Internal Settings Note. This driver has an internal thread which handles the scanning. Changing these settings, change the frequency in which the scanning thread adds the following to the read queue. Keep alive poll frequency (ms) – This is the time delay between keep alive polls. This value is measured in milliseconds and must be between 1000 and 10000. Status poll frequency (ms) – This is the time delay between status polls. This value is measured in milliseconds and has a minimum of 10000ms. Set alarm system time from SCADA – If this checkbox is checked, the alarms panel’s system time will be set with the time from the Adroit agent server. Time update frequency (m) – The time on the alarm panel may drift, if “Set alarm system time from SCADA” is check, the alarm panel’s system time will be updated with this frequency. Timeout (ms) – If the driver does not receive a valid response from the device within this period (measured in milliseconds), the port will be closed. Note. This value must be greater that the “keep alive poll period” in the “Internal Settings” section. 2 DSC EnvisaLink Ethernet Driver Wiring Standard Ethernet connection 3 Adroit Protocol Driver Setup Manual Supported addresses The DSC EnvisaLink Adroit Ethernet driver supports the following data address types: Address Description Min Addr Max Addr Addressing example Supported Adroit Data types Read/W rite PAR Partition status request 1 8 PAR 1 PAR 8 Integer Read ZON Zone status request 1 64 ZON 1 ZON 64 Integer Read ALM Alarm status request 1 5 ALM 1 ALM 5 Digital Integer Read GEN General status request 1 4 GEN 1 GEN 4 Digital Integer Read TBL Trouble LED request 1 8 TBL 1 TBL 8 Digital Integer Read PAD Partition Arm/Disarm 1 8 PAD 1 PAD 8 Integer Write KEY Keypad Sequence 1 8 KEY 1 KEY 8 String Write PAA Panic Alarm Activate 0 0 PAA Integer Write PGM Programmable output activate 1 4 PGM1 PGM4 Integer Write Note. Please read the Address Descriptions section before using these addresses! 4 DSC EnvisaLink Ethernet Driver Address Descriptions The addresses are either read only or write only. Read only addresses are sent from the driver to adroit in an unsolicited manner. Write only addresses will be cleared (to 0 if digital or integer and to “” if string) once the write is complete. Partition status request (PAR) This is a read only address. The value sent to adroit when scanning this address, represents the state of the partition being scanned. Value State 1 Partition ready 2 Partition not ready 4 Partition armed in away mode 8 Partition armed in stay mode 16 Partition armed in zero entry away mode 32 Partition armed in zero entry stay mode 64 Partition in alarm 128 Partition in exit delay 256 Partition in entry delay Zone status request (ZON) This is a read only address. The value sent to adroit when scanning this address, represents the state of the zone being scanned. Value State 1 Zone restored 2 Zone Open 4 Zone Fault 8 Zone Tamper 16 Zone Alarm Alarm status request (ALM) Each address references a different type of alarm. The following table indicates what type of alarm each addresses refers to. Address Alarm Type ALM 1 Duress alarm state ALM 2 Fire alarm state ALM 3 Auxiliary key alarm state ALM 4 Panic alarm state ALM 5 Smoke alarm state This is a read only address. The value sent to adroit when scanning this address, represents the state of the alarm being scanned. Value State 5 Adroit Protocol Driver Setup Manual 0 Not alarmed 1 In Alarm General status request (GEN) This is a read only address. Each address references a unique general status. The table below indicates what each address references to. Address Status Type GEN 1 Panel battery trouble, battery low or battery has been removed. GEN 2 Panel AC trouble, AC power to the panel has been removed. GEN 3 System bell trouble, an open circuit has been detected across the bell terminals. GEN 4 General system tamper. The value sent to adroit when scanning this addresses, represents the general state of the status type being scanned. Value State 0 Good status 1 Bad status Trouble LED request (TBL) This is a read only address. The table below indicates the state of the trouble LED on the keypad of the partition being scanned (1-8). Value State 0 LED off 1 LED on Partition Arm/Disarm (PAD) This is a write only address. The table below describes the resultant action on the partition scanned (1-8), when writing the following values from adroit. 6 DSC EnvisaLink Ethernet Driver Write Value Result of write 1 Arm partition in away mode 2 Arm partition in stay mode 3 Arm partition with zero entry delay 4 Disarm partition with user code entered in the dialog Keypad Sequence (KEY) This is a write only address. This address allows the driver to simulate a keystroke sequence as if it were being pressed on a specific partition’s (1-8) keypad. Only the following characters are can be sent ‘1 2 3 4 5 6 7 8 9 * #’. If any other chars are found in the character sequence, the write will fail. Panic Alarm Activate (PAA) This is a write only address. The following table indicates which panic alarms will be triggered when certain values are written to this address. Write Value Result of write 1 Trigger fire alarm 2 Trigger ambulance alarm 3 Trigger police alarm Programmable output activate (PGM) This is a write only address. The address index (1-4) represents the PGM that will be outputted when written. Valid write values are 1-8. The write value is partitions which activates the programmable output. 7 Adroit Protocol Driver Setup Manual Message Protocol Description DSC EnvisaLink message structure Command Code Data Checksum Carriage- return linefeed CCC DDD…DDD KK \\r\\n Command Code: This three digit code when sent to the device issues a command, i.e. tells the device what to do. However when receiving a message from the device, this code tells the driver what type of information is being received. Data: This part of the message is variable length depending on the command code sent, and contains the data required for the command code. Checksum: The checksum is two characters wide. The checksum is calculated by adding the hex value of all command and data digits, and truncating the result to 8 bits. Carriage-return-linefeed: The carriage-return and linefeed characters are appended to the end of each message. 8 DSC EnvisaLink Ethernet Driver Revision information Date: Changes: 10/02/2012 First Release notes! Adroit is a trademark of Advanced Works 112 (Pty) Ltd, R.S.A. Microsoft is a registered trademark of Microsoft Corporation, U.S.A. Windows is a trademark of Microsoft Corporation, U.S.A. 9"}, {"title": "email", "href": "drivers_html/email.html", "category": "Drivers", "rel": "drivers_html/email.html", "kind": "Driver", "text": "Adroit Technologies Protocol Driver Name Adroit Generic Email SMTP DLL EMAIL _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-EMAIL.docx P a g e | 2 COPYRIGHT Copyright © 2022 Advanced Worx 112 (Pty) Ltd. All rights reserved. Information in this document is subject to change without notice. The software described in this document is furnished under a license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of those agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or any means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal use without the written permission of Advanced Worx 112 (Pty) Ltd. Advanced Worx 112 (Pty) Ltd 20 Waterford Office Park 189 Witkoppen Road (c/o Waterford Drive) Fourways South Africa https://adroittech.co.za/ _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-EMAIL.docx P a g e | 3 Contents 1. Overview ............................................................................................................................................... 4 2. Wiring ................................................................................................................................................... 5 3. Device Configuration ............................................................................................................................ 6 3.1. Email Configuration ............................................................................................................................6 3.1.1. Outgoing Mail Settings ................................................................................................................................. 6 3.2. MACRO Usage in Email .......................................................................................................................6 4. Supported Addresses ............................................................................................................................ 8 4.1. Outgoing Email Rawbytes Slots. ..........................................................................................................8 5. Protocol Definition and Considerations ................................................................................................ 9 6. General Notes and Troubleshooting ................................................................................................... 10 6.1. Contact Details ................................................................................................................................. 10 6.2. Adroit Technologies Knowledge Base ................................................................................................. 10 6.3. Troubleshooting ............................................................................................................................... 10 7. Appendix ............................................................................................................................................. 13 7.1. Appendix A: Gmail Setup for Email Drivers using IMAP [New Google Security Policy] ............................ 13 8. Revisions ............................................................................................................................................. 18 8.1. Document Revision........................................................................................................................... 18 8.2. DLL Revision .................................................................................................................................... 18 _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-EMAIL.docx P a g e | 4 1. Overview This driver is used to send email messages via Simple Mail Transfer Protocol (SMTP), designed specifically for sending alarms or any other information such as Adroit tag values, SV and PV values, as well as attachments. The driver currently only supports RAWBYTES slots, of which only the Notify Agent currently provides a suitable Rawbytes slot. The Notify Agent allows for manual email sending, and it also exposes the various sub items such as TO, CC, FROM, SUBJECT and so forth as individual VARSTRING slots so an email interface could easily be crafted onto a mimic. The subject line and body may contain text macros that are parsed to allow for the additional information from Adroit, specifically slot and alarm details, to be sent if required and not just a simple alarm text field. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-EMAIL.docx P a g e | 5 2. Wiring Not applicable. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-EMAIL.docx P a g e | 6 3. Device Configuration 3.1. Email Configuration 3.1.1. Outgoing Mail Settings Mailbox Resource – A specific resource ID that uniquely identifies an email resource. The relevant mailbox settings are saved and remembered for the next time the configuration is brought up. Additional Adroit devices can be created and quickly configured with existing mailbox resources. A prompt will appear when settings have been changed that do not impact the resource constituents whether it must affect all existing devices that use that resource or if it must create a new resource to not affect current devices. For this email driver, this only applies to the LOGIN PASSWORD field. From – The fully qualified email address the email will be sent from. Login Password – The account domain password. SMTP Server – The specific SMTP server to contact according to protocol specifications. Usually matches the machine name e.g. MAIL.adroit.co.za SMTP Mail Port – Port required on the mail server for SMTP. Typically, this is 465 for SSL. Other ports could include 25 and 587. 3.2. MACRO Usage in Email This email driver is used in conjunction with the Notify agent. <ALM> will insert the alarm string received from the Notify Agent. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-EMAIL.docx P a g e | 7 PLEASE NOTE The text that will be substituted into the <ALM> macro first needs to be generated by an actual alarm. If you see this field as blank in testing, it means an alarm has not been triggered to generate it. <Agent.slot> will insert the result of a string query to the agent slot. For example, an Analog.value slot will result in the engineering value being inserted. Emails manually sent will contain the macros without the substitution for verification. The macros will only be expanded through the traditional Adroit alarming mechanism. Macros can be placed anywhere in the text fields of SUBJECT or BODY where duplicates are allowed. The ATTACHMENT line may only send 1 file at a time, though any file may be sent. For example, this can be inserted into the BODY: Hello Fred An alarm for your attention: ( <ALM> ), The dam level is at <DAM_LVL.VALUE> meters. The pump is <RUN_STATE.TEXT>. Goodbye from Adroit _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-EMAIL.docx P a g e | 8 4. Supported Addresses 4.1. Outgoing Email Rawbytes Slots. The driver address is “EMAIL.x” where {x >= 0, X <= 250}. When scanning, note the following: - Must be Output enabled. - Must be Input disabled. - Must be scanned to a Notify agent’s Email-rawValue slot. The other Notify agent slots are internal and should not be directly scanned to any driver. Noting that the FROM field is defined once in the device setup, a system may require more. This can be achieved by adding as many mode “devices” as needed. If the FROM field is not significant, up to 250 Notify agent slots may be scanned to one device by incrementing the scan address index. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-EMAIL.docx P a g e | 9 5. Protocol Definition and Considerations _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-EMAIL.docx P a g e | 10 6. General Notes and Troubleshooting 6.1. Contact Details Email: support@adroit.co.za and drivers@adroit.co.za Phone: +27 11 658-8100 Web: www.adroit.co.za 6.2. Adroit Technologies Knowledge Base For additional information, please refer to our Knowledgebase website: Latest Drivers topics - Features, discussions, tips, tricks, questions, problems and feedback (adroittechnologiesautomation.com) 6.3. Troubleshooting When I try send a test email in the Notify agent with an <ALM> macro, I get the following printed in my email body: Alarm trigger required to generate ALM message. Placeholding 80 characters here. The reason this message is inserted is because an alarm has not been triggered for the affected Notify agent. Only on an alarm is the message generated which can then be substituted into this macro. This message is substituted instead to account for the worst-case scenario regarding the length of the alarm message macro – maximum size of 80 characters. I cannot connect to my Gmail account. (Authentication error) Google has updated its security policy regarding 3rd party applications with access to your Google account. You will need to setup an App Password with 2-Step Verification to allow the Adroit Email Protocol Driver to have access to your Google account. For more information, please refer to this Adroit Knowledge Base article, which can also be viewed in Appendix A: Gmail Setup for Email Drivers using IMAP [New Google Security Policy]: https://adroittechnologiesautomation.com/t/sending-e-mail-with-smtp-using-gmail/1287 Or visit Google Help Centre for more information: https://support.google.com/accounts/answer/185833?hl=en I cannot connect to my email account. (Authentication error) If you are experiencing issues trying to connect to your email address, please confirm the following is correct: 1. Email address (check formatting, characters used) 2. Email password 3. FROM field in the device configuration _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-EMAIL.docx P a g e | 11 If this error has still not been resolved, there may be an issue with the authentication. Similar to Gmail and Google’s security policy changes (refer to the previous troubleshooting scenario for more details), there may be a security policy change surrounding 3rd party application access to your email account. If this is the case or if there is no reference of this security policy change, please report it to Adroit Support. I get any of the following errors: In the Datascope: ERROR: Email exceeds RAWBYTES max size in _______ field… In the email notification: [ADROIT ERROR] This message indicates that your email is too long. You will experience missing or incomplete text or information, and there will be no attachments. Please refer to the Adroit Email driver documentation for more information on how to resolve this, or please contact Adroit Support. This indicates that the number of characters in the email generated exceeded the maximum size. Adroit recommends that you reduce the number of characters in your email. This can be done by: - Reducing the number of recipients. - Reducing the number of macros. - Simplify the text in the email text to summarise the alarm. - Send email attachments only if necessary. If this is not possible, another solution is to chang"}, {"title": "Endress & Hauser Promag 800 Email", "href": "drivers_html/Endress_Hauser_Promag_800_Email.html", "category": "Drivers", "rel": "drivers_html/Endress_Hauser_Promag_800_Email.html", "kind": "Driver", "text": "Adroit : Endress & Hauser Promag 800 Email Driver Endress & Hauser Promag 800 Email driver Introduction This driver is designed to provide an interface for Promag 800 flow meters. The data is sent in the form of an email containing a csv attachment. Once the email is received it is decoded to expose the values contained in the attachment and body of the mail. Inbox management is provided through a backup box and an unknown/todo box, where email messages can be moved as appropriate. Messages older than a configured amount of days may be set for auto deletion. A separate Adroit device has to be created for each flow meter with the station ID being set equal to the serial number of the flow meter as per the CSV file that get emailed. There is a resource id allocated automatically on configuration, new devices will attempt to find a compatible configuration (those that share an inbox for example) any others will create a new resource, selecting a resource in the dialogue will load the current configuration for that box, if the device is saved (On OK) any changes will be save with an appropriate warning. Resource ID can be deleted with appropriate warnings if it might affect other devices. Offline devices and unknown (unconfigured) devices will have their emails moved to the UNKNOWN box if the MOVE radio is applied. Else if DELETE was selected unconfigured emails will be deleted. And offline device emails will be left in the main INBOX. 1 Adroit : Endress & Hauser Promag 800 Email Driver Configuration Dialog Mail server settings (*Resource key) (the parameters Identified by the * define a resource common to all devices that share those parameters, any change to any other parameter in this group will be changed for all devices using this mailbox.) *Mailbox Type – Choose IMAP or POP depending on your server type. (pop has been disabled for the time being) *Mail Server – The name of the mail server *Mail Port – 143 for IMAP , 110 for POP. (Some Servers use non-default ports) *Server uses SSL – IF the mail server requires this, usually IMAP port will then need 993. *Login Name – User name on the server. (the remaining parameters can be considered as sub-parameters (these will not result in a new resource being generated if different from any other resource) and if a change is requested on these the whole resource will be updated, and thus affect all devices using that resource) Login Password – User password. 2 Adroit : Endress & Hauser Promag 800 Email Driver Detailed debugging to datascope – Additional processing information will be sent to the datascope. Incoming mailbox configuration Incoming Mailbox Inbox name – this is where all new emails should arrive first. Mailbox Poll Period (ms) – Mailbox will be checked for new mail at this interval. Move used messages to BACKUP mailbox - Radio – If a mail is parsed and accepted and considered complete, checking this radio button will tell the driver to move that mail to the used or BACKUP mailbox, where further processing could take place such as remain there for x amount of days before being discarded.(see further down) Delete used messages - Radio – If a mail is parsed and accepted and considered complete, checking this radio button will tell the driver to delete the mail immediately. Move unknown messages to UNKNOWN mailbox - Radio – If a mail is parsed and found to be junk or for an offline device and NOT considered complete, checking this radio button will tell the driver to move that mail to the todo or UNKNOWN mailbox, where further processing could take place such as remain there for x amount of days before being discarded.(see further down) Delete unknown messages - Radio – If a mail is parsed and found to be junk or for an offline device and NOT considered complete, checking this radio button will tell the driver to delete the mail immediately. Backup mailbox configuration Backup Mailbox – Backup name – this is a sub or secondary mailbox where completed emails can be stored for a period of time. Delete messages older than x days – Any email in this box older than this number of days will be deleted during driver maintenance tasks. Unknown mailbox configuration Unknown Mailbox – Unknown name – this is a sub or secondary mailbox where incompleted emails can be stored for a period of time. Junk/spam and or unconfigured or offline devices will also go here. Delete messages older than x days – Any email in this box older than this number of days will be deleted during driver maintenance tasks. Unknown mailbox configuration (these setting are stored per device and will not affect other devices using the same resource id.) Station ID – This is the identifier code sent in the subject line of the email. (for example : Data from ML250 29902 , the id is 29902. Model – Select the Model of the Promag 800 flometer. Currently only Promag 800 is available. Device contains units – The Promag 800 can report data with unit fields. 3 Adroit : Endress & Hauser Promag 800 Email Driver Supported addresses A CSV row constitutes 1 record: 1,2010/02/03,00:00:00,<Unit 1>,<Value1>,<Unit 2>,<Value2>…<Unit 21>,<Value21> Data Result Representation Adroit Integer Adroit Real Adroit String Unit 1 Unit for Positive Total U1 Value 1 Value of Positive Total V1 V1 Unit 2 Unit of Negative Total U2 Value 2 Value of Negative Total V2 V2 Unit 3 Unit of Flow Rate U3 Value 3 Value of Flow Rate V3 V3 Unit 4 Unit of Flow Rate % U4 Value 4 Value of Flow Rate % V4 V4 Unit 5 Unit of SPARE U5 Value 5 Value of SPARE V5 V5 Unit 6 Unit of SPARE U6 Value 6 Value of SPARE V6 V6 Unit 7 Unit of Positive Partial Total U7 Value 7 Value of Positive Partial Total V7 V7 Unit 8 Unit of Negative Partial Total U8 Value 8 Value of Negative Partial Total V8 V8 Unit 9 Unit of Total Net Value U9 Value 9 Value of Total Net Value V9 V9 Unit 10 Unit of Partial Net Value U10 Value 10 Value of Partial net Value V10 V10 Unit 11 Unit of SPARE U11 Value 11 Value of SPARE V11 V11 Unit 12 Unit of SPARE U12 Value 12 Value of SPARE V12 V12 Unit 13 Unit of SPARE U13 Value 13 Value of SPARE V13 V13 Unit 13 Unit of SPARE U14 Value 14 Value of SPARE V14 V14 Unit 15 Unit of SPARE U15 Value 15 Value of SPARE V15 V15 Unit 16 Unit of Cycles Per Hour U16 Value 16 Value of Cycles Per Hour V16 V16 Unit 17 Unit of Battery 1 Status U17 Value 17 Value of Battery 1 Status V17 V17 Unit 18 Unit of Battery 2 Status U18 Value 18 Value of Battery 2 Status V18 V18 Unit 19 Unit of Battery 3 Status U19 Value 19 Value of Battery 3 Status V19 V19 Unit 20 Unit of Antenna Signal U20 Value 20 Value of Antenna Signal V20 V20 Unit 21 Unit of Board Temperature U21 Value 21 Value of Board Temperature V21 V21 4 Adroit : Endress & Hauser Promag 800 Email Driver Application example 1. You have a Promag 800 flow meter from which you need to extract the following data: a. The positive volume counter b. The negative volume counter c. The Flow rate 2. You are also required to extract the units of these values from the csv file. 3. In addition to this you need to determine the signal strength of the antenna. In order to accomplish this you will need to create 4 analog agents and 4 string agents. You will scan the value of the positive volume counter (analog) from the “V1” address of the device You will scan the unit of the positive volume counter (string) from the “U1” address of the device. You will scan the value of the negative volume counter (analog) from the “V2” address of the device You will scan the unit of the negative volume counter (string) from the “U2” address of the device. You will scan the value of the flow rate (analog) from the “V3” address of the device You will scan the unit of the flow rate (string) from the “U3” address of the device. You will scan the value of the antenna signal strength from the “V20” address of the device. You will scan the unit of the antenna signal strength from the “U20” address of the device. Fault finding 1. Ensure the connection settings to your mailbox is correct. 2. Ensure the serial number of the Promag 800 flow meter matches the Station ID as set up in the driver configuration. 3. Ensure the emails do have attachments. 4. Ensure that the data attachment is before the event attachment. 5. Ensure that there is no invalid data in the body of the email, or in the attachment. 6. Do not move emails between folders in excel. A Copy is required for the driver to operate to specification. 5 Adroit : Endress & Hauser Promag 800 Email Driver Revision information Date: Changes: 16-Apr-2015 First Released Document. 6 Adroit : Endress & Hauser Promag 800 Email Driver Appendix A – Datascope examples 7"}, {"title": "Generic Software Specification", "href": "drivers_html/Generic_Software_Specification.html", "category": "Drivers", "rel": "drivers_html/Generic_Software_Specification.html", "kind": "Driver", "text": "EnvisaLink™ TPI Programmer's Document DEVELOPER DOCUMENTATION VERSION 1.08 February 10, 2017 1.0 Overview The EnvisaLink™ Third Party Interface (TPI) consists of a set of commands and responses designed to allow third-party command and control applications to interface directly with the EnvisaLink™ module and in turn the security system, over a TCP/IP connection. The goal in releasing this programmer's interface is not only to allow existing home-automation software greater interaction with the EnvisaLink module, but also to encourage the development of third-party applications on mobile platforms. 2.0 Connecting to the Envisalink™ 2.1 Hardware Connections Please refer to Envisalink installation or “Quick Start” document. 2.2 TCP Connection The Envisalink acts as a server for the TCP connection and the user application is the client. The Envisalink listens on port 4025 and will only accept one client connection on that port. Any subsequent connections will be denied. The Envisalink will close the connection if the client closes its side. To initiate a connection, the application must first start a session by establishing a TCP socket. Once established the TPI will send a 5053 command (See section 3.0 for a detailed description of the protocol) requesting a session password. The client should then, within 10 seconds, send 005 login request. The 005 command contains the password which is the same password to log into the Envisalink's local web page. Upon successful login, the Envisalink's TPI will respond with the session status command, 505, and whether the password was accepted or rejected. If a password is not received within 10 seconds, the TPI will issue a 5052 command and close the TCP socket. The socket will also be closed if the password fails. Once the password is accepted, the session is created and will continue until the TCP connection is dropped. Note, as with all network communications, it is possible the TCP socket could be lost due to a network disruption, or an exception at either the client or server end. Application programmers are advised to include some handling for dropped connections. The Poll command (000) is a useful command to test of the connection is still alive. Alternately, an application could watch for the period time broadcast (510) which is issued by the panel every 4 minutes. Enivsalink 3 vs Envisalink 4 Difference The Envisalink 3 only supports 6 ASCII digits for a password but the Envisalink 4 supports 10. IMPORTANT: Envisalink Application Firewall As of Envisalink 4 (1.0.102) and Envisalink 3 (1.12.180) the Envisalink has an internal firewall that will block all TPI connections that originate outside of the network segment it resides upon. This is to protect users who expose their Envisalinks to the public Internet either by mistake or ignorance. This feature can be disabled by changing the default user's password from “user” to any other password, 4 characters or longer. 3.0 Detailed Description of the Feature Set 3.1 Communications Protocol All data is sent as hex ASCII codes. The transmission from will consist of the following: CCC DDD…DDD CKS CR/LF CCC => 3 Digit Command This tells the module or the application what to do. Commands are 3 characters long. For example, the Status Command (001) would be sent as hex ASCII codes ‘30 30 31’. See the following tables for a list of supported commands. DDD…DDD => Data Byte(s) This is the data that may be needed for the command. For example, after the Partition Arm command (030), the application must specify which partition should be armed (1-8). The following tables show what the data requirements are for each command. Some commands, like the User Closing, have space holding zeros. In this case all 4 digits are sent even though this module ever uses only two. CKS => Checksum The checksum is calculated by adding the hex value of all command and data digits, and truncating the result to 8 bits. The upper and lower nibbles of the result are converted to ASCII characters before sending. For example, a Partition Alarm on partition 3 would be sent like this: The command and data fields contain: 6 5 4 3 The ASCII codes for this would be: 36 35 34 33 36 + 35 + 34 + 33 = D2. Since the result is already 8 bits we don’t have to worry about the length and simply send it. Format Command Data Checksum CR/LF Code 6 5 4 3 D 2 CR LF ASCII 36 35 34 33 44 32 0D 0A CR/LF => Carriage Return & Line Feed Each transmission is followed with a carriage return (hex ASCII 0D) and a line feed (hex ASCII 0A) to indicate the end of a transmission. 3.2 Application Commands Description Command # of Data Bytes Data Bytes Poll The TPI will respond with a Command Acknowledge code. Note: The POLL command will also reset the Envisalink's network watch- dog timer. If there is no communications with the Envisalerts servers for a period of 20 minutes, the Envisallink will reboot. Sending the TPI POLL command will reset this timer. Useful if the module is not connected to the Internet or firewalled. 000 0 Status Report The TPI will send updates for all general zone, partition, and trouble status to the Application (Troubles will be limited to indicating the status of the Trouble LED on a keypad). Only the partitions that have been detected, and their trouble states, will be displayed. Please see section 3.5 for more information. 001 0 Dump Zone Timers This will dump the internal Envisalink Zone Timers. See command 615 008 0 Network Login The command is sent by the client after it has created a TCP connection to the TPI to open a session. The TPI will respond with command 505 if the login was successful. The password is the same as the local Envisalink password for the web page. 005 1-6 Password, case sensitive Set Time & Date The TPI will change the time and date to that sent by the application. Please note it may take up to 4 minutes for this command to be reflected on all the keypads on the security system. 010 10 hhmmMMDDYY Command Output Control The TPI will activate the selected Command Output 020 2 Partition (1-8) Output (1-4) Partition Arm Control The TPI will attempt to arm the selected partition. The partition will be armed in AWAY mode (no zones bypassed). 030 1 Partition (1-8) Partition Arm Control – Stay Arm The TPI will attempt to stay-arm the selected partition. 031 1 Partition (1-8) Partition Arm Control – Zero Entry Delay The TPI will attempt to arm the partition with zero entry delay. 032 1 Partition (1-8) Partition Arm Control – With Code The TPI will attempt to arm the selected partition by using a User Code. This is equivalent to entering a User Code while the partition is in the Ready mode. 033 7 Partition (1-8) Code (4-6 digit) Partition Disarm Control The TPI will attempt to disarm the selected partition. This command can also be used to acknowledge alarms on a partition. Sending the Partition Disarm command will silence any alarms as well as disarm the partition. 040 7 Partition (1-8) Code (4-6 digit) Time Stamp Control Sending a ‘1’ (ON) will cause the TPI to prepend all TPI commands with an 8 digit timestamp followed by a single space (0x20). For backwards compatibility the default state is OFF. Note, the timestamps do not form part of the packet format and hence are not included in the checksum. 055 1 On/Off (1,0) Time Broadcast Control Sending a ‘1’ (ON) will cause the TPI to periodically transmit system time broadcasts (TPI COMMAND 550). The default state is OFF. 056 1 On/Off (1,0) Temperature Broadcast Control Sending a ‘1’ (ON) will cause the TPI to periodically transmit the interior 057 1 On/Off (1,0) and exterior temperatures (TPI COMMANDS 561,562). The default state is OFF. This applies to the EMS-100 only. Use command 080 to force a 561 report with the STAT50 et al. Trigger Panic Alarm This command emulates the FAP (Fire, Ambulance, Police) panic keys on a DSC keypad. Send this command, with 1, 2, or 3, will cause an immediate alarm. This assumes the panel is properly programmed to allow such events to occur. 060 1 1 = Fire 2 = Ambulance 3 = Police Single Keystroke – Partition 1 This command is provided for backwards compatibility. 071 is the preferred command. Send a single keystroke on Partition 1 only. NOTE: Any other characters other than those listed are ignored but the TPI still responds with a 500 if the checksum is good. This is for backwards compatibility with other interfaces. 070 1 ASCII(0..9, *,#,A) Send Keystroke String (Max: 6 Keystrokes) This command allows the application to send a keystroke string as if the user pressed the equivalent key sequence on an existing keypad. WARNING: There is no error checking for state of the panel so the application must know what mode the panel is beforehand, before sending key presses. 071 2-7 Partition (1-8) ASCII(0..9, *,#) Enter User Code Programming This command will cause the partition to enter user code programming (*5) mode if the partition isn’t already busy. 072 1 Partition (1-8) Enter User Pro
