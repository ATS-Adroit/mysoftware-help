const ITEMS = [{"title": "ABB COMLI", "href": "drivers_html/ABB_COMLI.html", "category": "Drivers", "rel": "drivers_html/ABB_COMLI.html", "kind": "Driver", "text": "[Page 9]\nCOMLI\n1 COMLI\nCOMLI (COMmunication LInk) is a ABB Automation data transmission sys-\ntem for communication between control systems and between control systems\nand computers. COMLI is a conventional communication link using serial,\nasynchronous data transmission in half duplex mode, i.e. one direction at a\ntime, and according to the master/slave principle.\nThis document provides detailed information on COMLI for personnel requir-\ning a thorough understanding of the system in order to implement COMLI in\na particular application or locate faults on a system.\nThe description assumes a knowledge of ABB Automation’s control systems\nand the terminology used in the control system descriptions.\nCOMLI is the most common data communication system used with the ABB\nAutomation family of control systems. Latest generation installations provid-\ning operator presentation as well as PLC facilities may use new data transmis-\nsion systems such as MMS. When COMLI is also used in these new systems,\nimplementation is slightly different to when COMLI is used for data commu-\nnication between SattCon systems only. Throughout this description it is\nassumed that only SattCon systems are used.\nDefinitions\nMaster and Slave\nThe terms master and slave are used frequently throughout this handbook.\nMaster in a communications context means the controlling station which\nalways initiates the message transmission sequence. Slave means a reply sta-\ntion which cannot start a communication sequence but simply responds to calls\nfrom the Master station.\nHexadecimal notation and ASCII format\nWhen communication via COMLI is used 2-digit hexadecimal notation is used\nto described a byte. This is indicated by the suffix H after the hexadecimal\ncharacters. The data in the last byte of the message is coded in hexadecimal\nformat, other bytes are coded in ASCII-hexadecimal format.\nI/O-bit\nABB Automation’s control systems include a memory area called I/O RAM\ncontaining the I/O rack’s digital input and output signal statuses. In addition to\nI/O RAM, storage for memory cells, timer indications, limiter modules etc. is\nalso included. An advantage with I/O RAM is that unused channels on the\ninput and output cards can be used as working memory cells for temporary\nstorage of intermediate results. Throughout the remainder of this description\nthe term I/O bit refers to a location in this I/O RAM.\n\n[Page 10]\nCOMLI\nLetter codes\nThe following letters are used to identify the various types of address:\nP = an address of 16 contiguous I/O-bits in I/O-RAM.\nAI = analogue input signal address.\nA = analogue output signal address.\nR = 16-bit register address.\n1.2 COMLI - principle of operation\nABB Automation’s systems communicate with each other and with other com-\nputers using COMLI (COMmunication LInk). COMLI is one of ABB Auto-\nmation’s communication networks using serial, asynchronous data\ntransmission in half duplex mode (one direction at a time) and in accordance\nwith the Master/Slave principle (the Slave does not reply if there is an error in\nthe message received).\nMaster and Slave can be linked together in different ways to achieve the\ndesired function, i.e. Point-to-Point, Multipoint (Multidrop) or radial configu-\nration (see the section on Network configuration). Up to 32 Slave systems can\nbe connected to a Master system in a multipoint configuration. Master and\nSlave are linked via the serial channels on the different systems which are to\ncommunicate with each other. Master and Slave need not use the same physi-\ncal channel numbers in both the systems. They must however have the same\ncharacter format, transmission speed etc.\nCommunication is controlled by the PLC programs in the different control sys-\ntems. By activating a predetermined memory cell, the PLC program in the\ncontrol system acting as Master transmits a message. When the Slave receives\nthe message, it responds either by sending the requested information or by\nacknowledging the information received. The memory cell is reset when the\nMaster receives the information or an acknowledgement from the Slave.\nThe information in ABB Automation's control systems is stored in the differ-\nent memory modules. About 50 different message types are defined for the\nvarious types of information to be transferred.\nWhen the master starts a communication sequence, a communication area\ndetermines the type of data to be transferred. The data is transmitted and\nreceived via a serial channel defined using a channel definition area.\nNetwork configurations\nThere are two network configurations for a COMLI serial communication net-\nwork:\n• Multipoint communication\n• Point to point communication\n\n[Page 15]\nCOMLI\n1.3 Communication interfaces\nOne of the following standard communication interfaces is used for serial\ncommunication with COMLI:\n• RS485.\n• RS232C/V24.\n• Current loop.\nRS-485 interface\nThis is the most usual interface used for communications with COMLI since\nit is less sensitive to interference than RS232C. This communication interface\nshould be used where possible.\nThe RS485 is a standard communications interface from EIA (Electronic\nIndustries Association, USA) and is a voltage driven interface which operates\nwith voltages between 0 and +5V. The interface is differential, i.e. for every\nlogic state it sends two signals where one signal is inverted in relation to the\nother. By detecting differences between these two signals, a more interference\ntolerant transfer is achieved compared with RS232C. RS485 is a later version\nof RS422 which can handle a greater load but is otherwise identical to the ear-\nlier standard. RS485 can handle a maximum of 32 units.\nUnlike RS232C, RS-485 defines only the electrical parameters. RS485 per-\nmits a maximum transmission speed of 10 Mbits/s and can operate over a long-\ner transmission distance than RS232C. The maximum transmission distance is\n1200 metres at 9600 baud.\nRS-232C/V24 interface\nRS232C/V24 is used primarily for connections to terminals but can also be\nused for COMLI communication in point to point configuration. RS232 can-\nnot be used for multidrop configurations.\nThe RS232C communications interface is a standard from EIA (Electronics\nIndustries Association, USA). The standard specifies serial, asynchronous\ncommunication up to 20 kbit/s with a maximum distance between communi-\ncating units of 15 metres. Under various circumstances it is however possible\nto communicate over much longer distances via RS232C. The standard speci-\nfies signal levels, driver circuits and mechanical structure, i.e. the connector\ndevice and the pin configuration.\nThe communication interface is an international standard which merely spec-\nifies signal levels. RS232C and V24 have the same signal levels and the volt-\nage levels +15V/+5V mean logic zero whereas voltage levels -5V/-15V mean\nlogic 1. Handshaking takes place with XON-XOFF or with the signals RTS-\nCTS.\nCurrent loop\nA current loop employs switched current to represent data on the line. Usually,\na closed circuit, current flow, means a logic one and an open circuit (no current\nflow) a logic zero. A current loop is used in less demanding applications or\nwhere electrical isolation of linked units is required. A current loop usually\noperates with a current of 20 mA.\n\n[Page 19]\nCOMLI\nFunction block\nThe function block contains the functional information and data as follows:\n• Message type\n• Start address\n• Quantity\n• Data block\nMessage type\nThis indicates the type of message being transmitted or received. The charac-\nters can be considered as a function code indicating how the Master or Slave\ninterprets the data received. The message type is included in all message cat-\negories, i.e. request, data transfer, acknowledge. The character can assume a\nvalue between 30H and 7FH. Always coded in ASCII.\nStart address, quantity and data block\nThe start address, quantity and data block have different meanings depending\non whether the message is a request, a data transfer or an acknowledgement.\nThe meanings are as follows:\nRequest\nStart address indicates the first address from which the requested data is to be\nread. In the case of data that does not have an address, e.g a controller or lim-\niter module, the number of the requested device is given, i.e. the controller\nnumber or limiter module number. Always represented in ASCII code.\nQuantity indicates the number of items requested, e.g. the number of I/Os,\nnumber of registers, number of limiter modules etc. Always coded in ASCII.\nThe data block is not used in a request.\nData transfer\nStart address indicates the first destination address for the data being trans-\nferred. In the case of data that does not have an address, e.g a controller or lim-\niter module, the number of the requested device is given, i.e. the controller\nnumber or limiter module number. Always coded in ASCII.\nQuantity indicates the number of bytes of data being transferred. Always cod-\ned in ASCII.\nThe data block contains the data being transferred. The arrangement of the\ndata depends on the type of message. The size of the data block can be between\n1 and 64 bytes. The data can be coded in binary or coded in ASCII depending\non the chosen communication method.\nNote. The data block must contain as many byte as requested. If there isn´t\nenough data, then fill the block with 00H.\n\n[Page 29]\nMessage types\nRequest the status of several I/O bits (Message type 2)\nApplication\nUsed to request the status of up to 512 I/O bits using binary communication\n(256 using ASCII communication). Note that there is a special message to\nrequest the status of a single I/O bit. I/O bits starting at any address divisible\nby 8 in the address range 0000 (octal) to 37770 (octal) can be requested. The\nupper limit in different systems can be larger or smaller than the message\nallows. For systems containing addresses above 37770 (octal), bits in the out\nof range addresses must first be moved to addresses under 40000 (octal) before\nthey can be transferred via COMLI.\nMessage structure\nThe message structure is as follows:\nMessage type (byte 4)\nThe message type is “2”, i.e. ASCII code 32H. Note that a request for a register\nand a request for I/O bits share the same message type. The address determines\nif the request is for I/O bits or for a register. An address less than 4000H indi-\ncates that the request is for I/O bits, an address 4000H or above indicates reg-\nisters.\nStart address (bytes 5–8)\nIndicates the first address of the group of input or output I/O bits being request-\ned. The address must always be exactly divisible by 8, i.e. the octal address\nmust always end with a zero. Requests for bits in the address range 00000\n(octal) to 37770 (octal) are permitted.\nNumber of I/O bits requested (bytes 9–10)\nThe number of bits which can be requested depends on whether binary or\nASCII communication is being used. Every byte can contain the status of 8\nI/O bits in binary communication (4 I/O bits in ASCII communication). A data\nblock can contain a maximum of 64 bytes. Thus the minimum and maximum\nquantities of data which can be requested are as follows:\nMin. 1 byte = 8 I/O bits using binary communication.\nMin. 1 byte = 4 I/O bits using ASCII communication.\nMax. 64 byte (64x8) = 512 I/O bits using binary communication.\nMax. 64 byte (64x4) = 256 I/O bits using ASCII communication.\nExample\nA request for 512 I/O bits beginning at address 4770(octal). Binary communi-\ncation is assumed.The message is as follows:\n4770(octal) = 09F8H\n64(dec)= 40H\nDESTINATION\nOF I/O BITS\nI/O-BIT ADDRESS\nDESTINATION\n\n[Page 92]\n2.15 Time marked events\nRequest time marked events (Message type Å)\nApplication\nRequests 6 time marked events when using binary communication to transfer\nthe data from a subsystem (3 events using ASCII communication). A knowl-\nedge of the type of alarm monitoring used in the system concerned is necessary\nto use this message correctly. See also the message “Transfer of time marked\nevents”.\nAn increasing number of installations employ several control s"}, {"title": "Adroit Generic Email SMTP", "href": "drivers_html/Adroit_Generic_Email_SMTP.html", "category": "Drivers", "rel": "drivers_html/Adroit_Generic_Email_SMTP.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-EMAIL.docx\nP a g e | 3\n1.\nOverview ............................................................................................................................................... 4\n2.\nWiring ................................................................................................................................................... 5\n3.\nDevice Configuration ............................................................................................................................ 6\n3.1.\nEmail Configuration ............................................................................................................................6\n3.1.1.\nOutgoing Mail Settings ................................................................................................................................. 6\n3.2.\nMACRO Usage in Email .......................................................................................................................6\n4.\nSupported Addresses ............................................................................................................................ 8\n4.1.\nOutgoing Email Rawbytes Slots. ..........................................................................................................8\n5.\nProtocol Definition and Considerations ................................................................................................ 9\n6.\nGeneral Notes and Troubleshooting ................................................................................................... 10\n6.1.\nContact Details ................................................................................................................................. 10\n6.2.\n6.3.\nTroubleshooting ............................................................................................................................... 10\n7.\nAppendix ............................................................................................................................................. 13\n7.1.\nAppendix A: Gmail Setup for Email Drivers using IMAP [New Google Security Policy] ............................ 13\n8.\nRevisions ............................................................................................................................................. 18\n8.1.\nDocument Revision........................................................................................................................... 18\n8.2.\nDLL Revision .................................................................................................................................... 18\n\n[Page 4]\nATQMS-DRVR-DOC-EMAIL.docx\nP a g e | 4\n1.\nOverview\nThis driver is used to send email messages via Simple Mail Transfer Protocol (SMTP), designed\nspecifically for sending alarms or any other information such as Adroit tag values, SV and PV values,\nas well as attachments.\nThe driver currently only supports RAWBYTES slots, of which only the Notify Agent currently provides\na suitable Rawbytes slot.\nThe Notify Agent allows for manual email sending, and it also exposes the various sub items such as\nTO, CC, FROM, SUBJECT and so forth as individual VARSTRING slots so an email interface could easily\nbe crafted onto a mimic.\nThe subject line and body may contain text macros that are parsed to allow for the additional\ninformation from Adroit, specifically slot and alarm details, to be sent if required and not just a simple\nalarm text field.\n\n[Page 6]\nATQMS-DRVR-DOC-EMAIL.docx\nP a g e | 6\n3.\nDevice Configuration\n3.1. Email Configuration\n3.1.1. Outgoing Mail Settings\nMailbox Resource – A specific resource ID that uniquely identifies an email resource. The relevant\nmailbox settings are saved and remembered for the next time the configuration is brought up.\nAdditional Adroit devices can be created and quickly configured with existing mailbox resources. A\nprompt will appear when settings have been changed that do not impact the resource constituents\nwhether it must affect all existing devices that use that resource or if it must create a new resource\nto not affect current devices. For this email driver, this only applies to the LOGIN PASSWORD field.\nFrom – The fully qualified email address the email will be sent from.\nLogin Password – The account domain password.\nSMTP Server – The specific SMTP server to contact according to protocol specifications. Usually\nSMTP Mail Port – Port required on the mail server for SMTP. Typically, this is 465 for SSL. Other\nports could include 25 and 587.\n3.2. MACRO Usage in Email\nThis email driver is used in conjunction with the Notify agent.\n<ALM> will insert the alarm string received from the Notify Agent.\n\n[Page 10]\nATQMS-DRVR-DOC-EMAIL.docx\nP a g e | 10\n6. General Notes and Troubleshooting\n6.1. Contact Details\nPhone: +27 11 658-8100\nFor additional information, please refer to our Knowledgebase website:\nLatest Drivers topics - Features, discussions, tips, tricks, questions, problems and feedback\n(adroittechnologiesautomation.com)\n6.3. Troubleshooting\nWhen I try send a test email in the Notify agent with an <ALM> macro, I get the following\nprinted in my email body: Alarm trigger required to generate ALM message.\nPlaceholding 80 characters here.\nThe reason this message is inserted is because an alarm has not been triggered for the affected\nNotify agent. Only on an alarm is the message generated which can then be substituted into this\nmacro. This message is substituted instead to account for the worst-case scenario regarding the\nlength of the alarm message macro – maximum size of 80 characters.\nI cannot connect to my Gmail account. (Authentication error)\nGoogle has updated its security policy regarding 3rd party applications with access to your Google\naccount. You will need to setup an App Password with 2-Step Verification to allow the Adroit Email\nProtocol Driver to have access to your Google account.\nFor more information, please refer to this Adroit Knowledge Base article, which can also be viewed\nin Appendix A: Gmail Setup for Email Drivers using IMAP [New Google Security Policy]:\nhttps://adroittechnologiesautomation.com/t/sending-e-mail-with-smtp-using-gmail/1287\nOr visit Google Help Centre for more information:\nhttps://support.google.com/accounts/answer/185833?hl=en\nI cannot connect to my email account. (Authentication error)\nIf you are experiencing issues trying to connect to your email address, please confirm the following is\ncorrect:\n1. Email address (check formatting, characters used)\n2. Email password\n3. FROM field in the device configuration\n\n[Page 11]\nATQMS-DRVR-DOC-EMAIL.docx\nP a g e | 11\nIf this error has still not been resolved, there may be an issue with the authentication. Similar to Gmail\nand Google’s security policy changes (refer to the previous troubleshooting scenario for more details),\nthere may be a security policy change surrounding 3rd party application access to your email account.\nIf this is the case or if there is no reference of this security policy change, please report it to Adroit\nSupport.\nI get any of the following errors:\nIn the Datascope:\nERROR: Email exceeds RAWBYTES max size in _______ field…\nIn the email notification:\n[ADROIT ERROR] This message indicates that your email is too long. You will experience\nmissing or incomplete text or information, and there will be no attachments. Please refer\nto the Adroit Email driver documentation for more information on how to resolve this,\nThis indicates that the number of characters in the email generated exceeded the maximum size.\nAdroit recommends that you reduce the number of characters in your email. This can be done by:\nReducing the number of recipients.\nReducing the number of macros.\nSimplify the text in the email text to summarise the alarm.\nSend email attachments only if necessary.\nIf this is not possible, another solution is to change the RAWBYTESMaxSize registry setting.\nWARNING\nIncorrectly configuring this registry setting can cause undesirable behaviour. Please only change\nthis setting if there is no other solution. This setting will affect all drivers that utilise the Rawbytes\nslot in Adroit. This setting is only available in Adroit 10.0.5.2 Update 1 or later. Do not\nadd this registry setting manually.\n\n[Page 13]\nATQMS-DRVR-DOC-EMAIL.docx\nP a g e | 13\n7.\nAppendix\n7.1. Appendix A: Gmail Setup for Email Drivers using IMAP\n[New Google Security Policy]\nThis knowledge base article details the steps required in configuring the Gmail IMAP server with the\nmentioned Adroit email drivers, in line with Gmail’s new security policies implemented as of 30 May\n2022.\nFor\nThe opening article states the following:\nTo help keep your account secure, from May 30, 2022, Google no longer supports the use of third-party\napps or devices which ask you to sign in to your Google Account using only your username and password.\nImportant: This deadline does not apply to Google Workspace or Google Cloud Identity customers. The\nenforcement date for these customers will be announced on the Workspace blog at a later date.\nFor more information, continue to read.\nPreviously, Adroit email driver’s required full access to your Gmail account, and subsequently your\nGoogle account, to allow access into your inbox using the Gmail IMAP server. This required adjusting\na security setting on your Google account to allow 3rd party applications to access your account.\nIf you have noticed that Adroit has not been able to successfully connect to the Gmail IMAP server,\ntypically stating an authentication error, the problem could be related to this issue.\nExample of MYCITY Email Client Protocol Driver device authentication error [x0000 NO\n[AUTHENTICATIONFAILED] Invalid Credentials (Failure) Cannot do email work!]\nTo access the setting in question, follow the steps provided:\n1)\nAccessing from Gmail directly:\na. Log in to your Gmail account\nb. Click on the Google Account indicator in the   right-hand corner of the screen. Click on\nManage your Google Account"}, {"title": "Adroit M2M Protocol", "href": "drivers_html/Adroit_M2M_Protocol.html", "category": "Drivers", "rel": "drivers_html/Adroit_M2M_Protocol.html", "kind": "Driver", "text": "[Page 1]\nHist\nMask\n0 : TYPE Msb {00(Dig),01(Int),10(ana)}\n1 : TYPE Lsb\n2 : MEMTYPE Msb {00(Dx),,10(DDx)}\n3 : MEMTYPE Lsb\n4 : En Unsolicited reporting\n5 : En History reporting\n6 – 15 : null\n0F00\n00FF\nConverts physical PLC words to logical RTU words.\nDW1000\nDW937\nOffset 0 - 65535\nUnsolicited Mask:\nBitwise mask bits 0-15\nRegister types >0\nHistory Mask:\nBitwise mask bits 0-15\nRegister types >0\nTimeObj:\nMsw +Lsw\nanywhere the protocol ensures\nthe value.\nby DDx\nFixed buffer control header\nNot sent to master aswell.\nQUEUE based buffer\nEmptied from the oldest to\nthe newset.\nNew records are pushed in\nat the back , transact data is\nacquired from the front.\nSent in fixed records where\na record ios a whole row\n(4Words) or (8Words) if a 32\nitem is sent.\nDWORD never get wrapped\nhalvies enough space is\npoped for oth to be ordered.\nDWORDS are never\ntransmitted halvies.\nNOTES:\nIf during popping to wrap we pop the msw of a double\nthe lsw wont be removed also the driver will detect the\nOverview of the buffers in the PLC\nunless required. (this does not apply to the other types such as CW or SW s which are not indexed and fixed and are transacted as a whole.\nThe following buffers are for example how we organize memory in our plc s M2M solution but don t necessarily have to be identical, except that the\nprotocol messaging content obviously needs to match. FuncW for example is not ever transmitted on the protocol, but having something like this in\nthe sensor would help matters, but perhaps the sensor may only need one type fit for all etc.\n\n[Page 2]\nFunctionWord: (used with all transactions)\n000x --- > FUNCTION . { Action requires such as interrogate }\n00x0 --- > DIRECTION ( 0=initiated from master, 1=initiated from slave(unsolicited, or link so far) )\n01xx <---- ACK . acknowledge reception.\n10xx <---- NACK .... nacknowledge reception.\nError Word: (used with all nak transactions master and slave)\n0001 --- > Invalid Function\n0002 --- > Invalid Data\n0003 --- > Not enabled\n0004 --- > Need time first.\n0005 --- > No data available {perhaps a nak if say hist buffer has no events}\n0006 --- > Huh?\nStatistics Words:\n0 : # of reboots\n1 : # of retries\n2 : # messages sent\n3 : # messages recieved\n4 : # open errors\n5 : # send errors\n6 : # recieve errors\n7 : Last months bytes tx (internal)\n8 : Last months bytes rx (internal)\n9 : current months bytes tx (internal)\n10 : current months bytes rx (internal)\n11 : Today bytes tx (internal)\n12 :Today bytes rx (internal)\nActionWord 0: {sent from master}\n0 : START RTU\n1 : RESET RTU {clear all buffers etc}\n2 : GO LIVE { push inst buffer periodically}\n3 : ENABLE-PRIORITY\n4 : ENABLE-HISTORY\n5 : ENABLE-AUTO-HISTORY\n6 : KEEP-ALIVE\n7 : RESET RTU STATISTICS\n8 : STOP RTU\n9 : STOP LIVE\n10 : DISABLE-PRIORITY\n11 : DISABLE-HISTORY\n12 : DISABLE-AUTO-HISTORY\n13: DISABLE-KEEP-ALIVE\n14 :\n15 : RESET-OVERFLOW-FLAGS\nThis word is fleeting bits, i.e. one shots under\nnormal conditions the action word will be\n0000 indicating no change in current state.\nActionWord 1: { internal }\n0 : (internal) INTERROGATE NOW\n1 : (internal) READ CONFIG NOW\n2 : (internal) WRITE TIME NOW\n3 : (internal READ HISTORY NOW\n4 : (internal) READ STATISTICS NOW\n5 : -\n6 : -\n7 : -\n8 : (internal ENABLE MINIMAL device only)\n9 : (internal ENABLE MINIMAL whole driver)\n10: (internal DISABLE MINIMAL device only)\n11: (internal DISABLE MINIMAL whole driver\nThese cause other functions to trigger and is\nnot part of action word0 which is actually\nwritten to the plc\nStatusWord 0: (used with all responses)\n0 : STARTED\n1 : NEEDTIME { 0(no) , 1(yes) }\n2 : LIVE { 0(no) , 1(yes) }\n3 : PRIORITY-STARTED\n4 : PRIORITY-OVER { 0(no) , 1(yes) } (should be alarmed)\n5: HIST STARTED\n6 : HIST-OVER { 0(no) , 1(yes) } (should be alarmed)\n7 : AUTO_REPORT_HISTORY { 0(no) , 1(yes) }\n8 : WILL SEND KEEPALIVES\n9 : Contact time exceeded (internal)\n10 : Device or Driver in minimal mode (internal)\n11 : RTU vs SCADA mapping mismatch.\n12,13 : 2bit*25 Count of HISTORY BUFFER\n14-15 : 2bit*25 Count of UNSOLICITED BUFFER\nConfig Area: (Words)\n0 : ID (immediate)\n1 : IP Msw (readonly - reset required)\n2 : IP Lsw (readonly - reset required)\n3 : PORT (readonly - reset required)\n4 : TIMEOUT (immediate 100ms) [>=20]\n5 : RETRIES (immediate)\n6 : LIVE PERIOD (immediate 100ms)\n7 : LIVE REPORT INTERVAL (immediate 100ms) [>=100]\n8 : AUTO HIST PERIOD (immediate hours)\n9 : AUTO HIST REPORT INTERVAL (immediate 100ms)[>=100]\n10 : RTC UPDATE INTERVAL (immediate hours)\n11 : KEEP ALIVE INTERVAL (immediate 100ms) [>=100]\n12 : RTU SOFTWARE VERSION (readonly)\n13 : NEW IP MSW (AW0 reset required)\n14 : NEW IP LSW (AW0 reset required)\n15 : NEW Port (AW0 reset required)\nOnce these are writen a reset RTU must get a RESET onACTIONW0 to initiate.\nLast known good config is updated on reception of a valid master message. If a\nreconfig fails, the next hard reset will use last known.\nThese are transacted via READCFG,WRITECFG.\nTypedef struct TIMEOBJECT\nlsb\nlsw\nunsigned Sec : 6; //0 -> 59\nunsigned Min : 6; //0 -> 59\nunsigned Hour : 5; //0 -> 23\nunsigned Day : 5; //1 -> 31\nunsigned Month : 4; //1 -> 12\nmsw\nunsigned Year : 6; //0 -> 64 since 2000\nmsb\nApplication Protocol:\nAll data is represented in Hexadecimal.\nTCP connection established from the slave.\nTO\nlsw\n\n[Page 4]\nRO\nAD\nPrefix is a 2 word header sent with every\npacket master and standby\n< packet >\n0 PREFIX AND POSTFIX\n0.1 Prefix\nRO\nThere is no postfix at this time.\n0.1 Postfix\n\n[Page 8]\n5.1 WRITEDATA control from master:\nDW\nCount\n0004 --- > WRITEDATA [OFFSET+DATA] . Write to a single (DW) or double (DD) (RTU) item.\n0114 <---- ACK . acknowledge reception.\n5 WRITEDATA\nStatus\n0005 --- > WRITECFG [OFFSET+DATA] . Write to a single system config (DW) (RTU) item.\n0115 <---- ACK . acknowledge reception.\n6 WRITECONFIG\nThere is no DD write command for Configuration data area\nThe config buffer is a mixed DW and DD buffer, but since all immediate indexes are DW only therefore the write takes effect immediately.\nThe DD indexs that require 2 words are writen seperately and need to be activated via a reset, make sure the application knows to write both words\nbefore initiating a reset.\nCount is in words\nPrefix +\nPrefix +\n5.3 NACK from slave:\n5.2 ACK from slave:\nPrefix +\nPrefix +\nControls are retried\nwithout user intervetion\nAccording to the number\nof retries configured.\n6.1 WRITECONFIG control from master:\nDW\nCount\nCount is in words\nPrefix +\nErrorW\n6.3 NACK from slave:\n6.2 ACK from slave:\nPrefix +\nPrefix +\nControls are retried\nwithout user intervetion\nAccording to the number\nof retries configured.\nNB – lsw of the DD is\nwritten first,\n\n[Page 9]\nAction\nWord\nSee the TimeStruct for the bit packed definition of the timestructure.\nThis is the same timestructure used on timebased objects (TO)\n7.1 WRITETIME control from master:\nStatus\nWord\n7.3 NACK from slave:\n7.2 ACK from slave:\nPrefix +\nPrefix +\nControls are retried\nwithout user intervetion\nAccording to the number\nof retries configured.\n0007 --- > WRITETIME [FIXED TIMEOBJ + ACTIONWORD] . Write timeobj (2 words) time to RTU (fixed)\n0117 <---- ACK . acknowledge reception.\nTypedef struct TIMEOBJECT\nlsb\nlsw\nunsigned Sec : 6; //0 -> 59\nunsigned Min : 6; //0 -> 59\nunsigned Hour : 5; //0 -> 23\nunsigned Day : 5; //1 -> 31\nunsigned Month : 4; //1 -> 12\nmsw\nunsigned Year : 6; //0 -> 64 since 2000\nmsb\nNot used at this time\nforced to (0000)\n0006 --- > READCFG . Fetches all cfg words in one fixed single update packet.\n0116 <---- ACK [FIXED ALL DATA] . acknowledge reception.\n8 READCONFIG\n8.1 READCONFIG Request from master:\nDW15\nDW0\nCount\nFixed 16 word buffer\nStation ID\nmsb\n8.3 READCONFIG NAK message from slave:\nStation ID\nmsb\n8.2 READCONFIG response from slave:\n\n[Page 10]\n0008 --- > READSTATS . Fetches all plcstats words in one fixed single update packet.\n0118 <---- ACK [FIXED ALL DATA] . acknowledge reception.\n9 READSTATS\n9.1 READSTATS Request from master:\nDW6\nDW0\nCount\nFixed 0-6 word buffer,\nwhere only the first 7\nwords are sent from the\nPLC.\n(Word 7 through 12) are\ndriver internal and not\ndirectly returned on the\nprotocol\nStation ID\n9.3 READSTATS NAK message from slave:\nStation ID\nmsb\n9.2 READSTATS response from slave:\nStatistics Words:\n0 : # of reboots\n1 : # of retries\n2 : # messages sent\n3 : # messages recieved\n4 : # open errors\n5 : # send errors\n6 : # recieve errors\n7 : Last months bytes tx (internal)\n8 : Last months bytes rx (internal)\n9 : current months bytes tx (internal)\n10 : current months bytes rx (internal)\n11 : Today bytes tx (internal)\n12 :Today bytes rx (internal)\nIf any protocol message is not implemented, a NAK [huh?] Will be at least expected."}, {"title": "Adroit-Mitsubishi M2M", "href": "drivers_html/Adroit-Mitsubishi_M2M.html", "category": "Drivers", "rel": "drivers_html/Adroit-Mitsubishi_M2M.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-MIT_M2M.docx\nP a g e | 3\n1.\nOverview ............................................................................................................................................... 5\n1.1.\nSupported Hardware ..........................................................................................................................5\n2.\nWiring ................................................................................................................................................... 7\n3.\nDevice Configuration ............................................................................................................................ 8\n3.1.\nFeatures and Operation: .....................................................................................................................8\n3.2.\nPLC Performance Considerations: FX5 ............................................................................................... 10\n3.3.\nConfiguration Dialogs ....................................................................................................................... 11\n3.3.1.\nLocal Daemon Config ................................................................................................................................. 11\n3.3.2.\nPolling Config ............................................................................................................................................ 12\n3.3.3.\nPriority Buffer ............................................................................................................................................ 12\n3.3.4.\nHistory Buffer ............................................................................................................................................ 12\n3.3.5.\nMiscellaneous ............................................................................................................................................ 12\n4.\nSupported Addresses .......................................................................................................................... 13\n4.1.\nQ/L-Series rev620, FX5 rev634 and Later: ......................................................................................... 13\n4.2.\nFor revs earlier than rev620 and rev634: ........................................................................................... 14\n4.3.\nAddressing Details DATA AREA.......................................................................................................... 15\n4.3.1.\nData area [DW0 – DW(max d-reg)] (READ and WRITEABLE) ......................................................................... 15\n4.4.\nAddressing Details CONFIG AREA ...................................................................................................... 16\n4.4.1.\nConfig Area [CW0 – CW15] (READ and WRITEABLE (on some)) ..................................................................... 16\n4.5.\nAddressing Details STATISTICS AREA ................................................................................................ 19\n4.5.1.\nStatistics Area [EW0 – ED12] (READ only) ................................................................................................... 19\n4.6.\nAddressing Details STATUS AREA ...................................................................................................... 20\n4.6.1.\nStatus Area [SW0] (Read-Only internal returned automatically)...................................................................... 20\n4.6.2.\nStatus Area [SW1] (Read-Only internal returned automatically)...................................................................... 20\n4.7.\nAddressing Details ACTION AREA ...................................................................................................... 21\n4.7.1.\nAction Area [AW0 – AW1] (READ internal pulsed will return to zero, WRITE) .................................................. 21\n5.\nProtocol Definition and Considerations .............................................................................................. 23\n5.1.\nDatascope ....................................................................................................................................... 23\n5.2.\nDual-Port and Standalone Mode ........................................................................................................ 23\n5.2.1.\nDescription ................................................................................................................................................ 23\n5.3.\nM2M Configuration with Adroit Cluster Server (Shadow Scanning vs Parallel Scanning) ......................... 24\n5.3.1.\nShadow Scanning ...................................................................................................................................... 24\n5.3.2.\nParallel Scanning ....................................................................................................................................... 24\n5.4.\nHardware Considerations .................................................................................................................. 24\n5.5.\nPLC Considerations ........................................................................................................................... 26\n5.5.1.\nPLC Library................................................................................................................................................ 26\n5.5.2.\nResource Requirements (VERY IMPORTANT) ................................................................................................ 26\n5.5.3.\nProgram Configuration ............................................................................................................................... 27\n5.5.4.\nInitialise DataMap Program ......................................................................................................................... 27\n5.5.5.\nCommunication Program ............................................................................................................................ 30\n5.6.\nFX Configurator EN for FX3U ............................................................................................................. 38\n5.7.\nCommunications Setup for QUDE and L-Series ................................................................................... 39\n5.8.\nCommunications Setup for FX5-Series ............................................................................................... 44\n6.\nGeneral Notes and Troubleshooting ................................................................................................... 47\n6.1.\nContact Details ................................................................................................................................. 47\n6.2.\n6.3.\nTroubleshooting ............................................................................................................................... 47\n7.\nAppendix A – Memory Requirements ................................................................................................. 51\n8.\nAppendix B - Standalone/Dual-Port Details ....................................................................................... 52\n8.1.\nOn First Ever Boot-Up: Standalone .................................................................................................... 52\n8.2.\nChange Connection Details [Maintaining the current connection]: Standalone ...................................... 53\n8.3.\nChange Connection Details [Updating Secondary (B)]: Standalone ...................................................... 54\n8.4.\nChange Mode of Operation: Standalone -> Dual-Port ......................................................................... 55\n8.5.\nOn First Ever Boot-Up: Dual-Port ....................................................................................................... 56\n8.6.\nGeneral Connection Fail: Dual-Port .................................................................................................... 57\n\n[Page 8]\nATQMS-DRVR-DOC-MIT_M2M.docx\nP a g e | 8\n3.\nDevice Configuration\n3.1.\nFeatures and Operation:\nThe system supports the following “Areas” or data types scannable into Adroit:\nFX5 DATA Area: 500 data 16-bit WORDs or 250 32-bit WORDs can be mapped or any\ncombination making up a total 500 WORDs. This is enforced because of the maximum packet\nsize that can be transmitted in one transaction. (ONLY D registers can be monitored)\nQ/L DATA Area: 232 data 16-bit WORDs or 116 32-bit WORDs can be mapped or any\ncombination making up a total 232 WORDs. This is enforced because of the maximum packet\nsize that can be transmitted in one transaction. (ONLY D registers can be monitored) (500\nWORD support still to come)\nCONFIG Area: 30 configuration WORDs.\nSTATISTICS Area: 6 data usage DWORDs and 7 remote side statistical WORDs.\nSTATUS Area: 3 status 16-bit WORDs, status bits, count WORD seconds to next poll, other\nstatus bits.\nACTION Area: 2 control 16-bit packed WORDs.\nData area is time-stamped (seconds resolution) data. Devices request time synchronization\nperiodically (default is once per day, but this is configurable) but the master can set time at\nany point if required. (Time set is instantaneously, not gradually.)\nManual poll instructions for all Areas, and a periodic DATA Area poll.\nWrite commands for all Areas except STATISTICS.\nUnsolicited support for priority events of DATA Area.\nUnsolicited support for historical events of DATA Area.\nLogical addresses can be allocated to Priority (Alarmed) or Historical modes, with per logical\naddress value deadbanding to reduce risk of chatter.\nThe driver implements a daemon that will listen for and associate a channel to device link to\nallow incoming and outgoing data to a known device. The PLC is in control of the connection\nattempt and is expected to contact the master periodically via a LINK which the master will\nACK. This allows for support for fixed and, part of the main design philosophy, dynamic non-\npublic IPs typically found on public GPRS networks.\nFX Systems Historical buffer supporting 1000 (16-bit) events or 500 (32-bit) events.\nQ/L Systems Historical buffer supporting 7 500 (16-bit) events or 3750 (32-bit) events.\nFX Systems Priority buffer supports 250 (16-bit) events or 125(32-bit) events.\nQ/L Systems Priority buffer supports 250 (16-bit) events or 125(32-bit) events.\n\n[Page 9]\nATQMS-DRVR-DOC-MIT_M2M.docx\nP a g e | 9\nHistorical mode can be enabled/disabled. Automatic retrieval of history can be\nenabled/disabled. Historical buffer can be configured to be kept below a defined threshold.\nAny device may be put into reduced communications mode or ‘Economy Mode’ on a per device\nlevel, and/or per driver level, to allow for reduced comms load during high/peak periods.\nHistory buffer threshold exceeded reads and periodic interrogates are stopped during this time.\nFailover protection in case an invalid IP/port is configured the PLC will eventually timeout and\ngo back to the last known “good” configuration (LKG) to reduce the risk of having to manually\nreprogram the configuration.\nA standard default configuration is also implemented for first boot-up and connection.\nA forced and fixed latency (quiet delay) between consecutive message transmissions from the\nmaster to the same PLC device is currently hardcoded to 500ms. Retry attempts are also\nhardcoded at 250ms.\nThe following config data will result in dynamic change and persisted to keep the change valid\nbetween agent server restarts:\no Enable priority events.\no Enable history logging.\no Keep buffer below %.\no The actual %. – (this will only accept 25%, 50%, 75% and will automatically select\nthe closest valid value.)\no Periodic Update interval.\nLocal daemon configuration, however, will remain offline. Changes via Adroit’s setup will\nrequire an Agent Server restart. Please note that even though station address is\nconfigurable via the CONFIG Area and can even be changed, this is specifically not\npersisted. The user is forced to manually all"}, {"title": "BACnet Ethernet UDP-IP", "href": "drivers_html/BACnet_Ethernet_UDP-IP.html", "category": "Drivers", "rel": "drivers_html/BACnet_Ethernet_UDP-IP.html", "kind": "Driver", "text": "[Page 1]\nProtocol Driver\nName\nBACnet Ethernet UDP/IP\nDLL\nD_BACNET\n\n[Page 3]\nATQMS-DRVR-DOC-D_BACNET.docx\nP a g e | 3\n1.\nOverview ............................................................................................................................................... 4\n2.\nRevisions ............................................................................................................................................. 20\n2.1.\nDocument Revision .......................................................................................................................... 20\n2.2.\nDLL Revision ................................................................................................................................... 20\n3.\nWiring .................................................................................................................................................... 5\n4.\nDevice Configuration ............................................................................................................................. 6\n4.1.\nDriver Details .................................................................................................................................... 6\n4.1.1.\nBACnet Device Details .................................................................................................................................. 6\n5.\nSupported Addresses ............................................................................................................................ 8\n5.1.\nBACnet Objects List: .......................................................................................................................... 9\n5.2.\nBACnet Properties List: .................................................................................................................... 10\n6.\nProtocol Definition and Considerations .............................................................................................. 16\n7.\nGeneral Notes and Troubleshooting ................................................................................................... 17\n7.1.\nContact Details ................................................................................................................................ 17\n7.2.\n8.\nAppendix A – Mitsubishi AE-200/AE-50/EW-50 Aircon Control Unit ................................................. 18\n\n[Page 4]\nATQMS-DRVR-DOC-D_BACNET.docx\nP a g e | 4\n1. Overview\nThis driver makes use of the BACnet Stack library supplied by sourceforge.com.\nThe driver supports these functions at the moment:\nReadProperty\nReadPropertyMultiple\nNot all devices support ReadPropertyMultiple.\nFor reading we will always try to do a ReadPropertyMultiple and if it fails the driver will revert to a\nReadProperty call instead. ReadProperty is much slower and has a limitation of only supporting 255\nItems that can be scanned individually.\nThe driver also supports Ethernet connection through a WhoIs function call.\nNOTE: Please ensure broadcasting is enabled on all routers and internal network between driver\nand BACnet devices to ensure successful communications. Also only UDP is used so ensure UDP is\nenabled through any firewalls. UDP port 47808 is used.\n\n[Page 6]\nATQMS-DRVR-DOC-D_BACNET.docx\nP a g e | 6\n3. Device Configuration\n3.1.\nDriver Details\nEnable Secondary – Allows enabling of redundant BACnet device connections such that in case of\na failure a switchover will occur. (Default = OFF)\nPrimary – Allows configuration setting of the Primary BACnet device.\nSecondary – Allows configuration setting of the Secondary BACnet device.\n3.1.1. BACnet Device Details\nEnable shadow scanning from master to standby – If enabled will stop any communication\nto the BACnet device when the Agent server is in standby mode. By default we assume parallel\nscanning (default = OFF)\nEnable standby reads – Allows reading from BACnet device when agent server is in standby\nmode. (Default = ON)\nEnable standby writes – Allows writing to BACnet device when agent server is in standby mode.\n(Default = OFF)\nTimeout – Time in milliseconds to wait for a response from the BACnet device. (Default = 1000\nms)\nRetries – The maximum number of retries to attempt communication to the BACnet device before\nensuring a complete failure. (Default = 3)\n\n[Page 7]\nATQMS-DRVR-DOC-D_BACNET.docx\nP a g e | 7\nStation ID – The BACnet device Station ID. This is only required and comes into working when\nthe actual IP Address of the unit is unknown or will change dynamically.\nIP Address – The static IP Address of the BACnet device. If this is specified the Station ID is\nignored as connection happens purely based on IP and UDP Port then.\nAPDU – The maximum size in bytes that can be transferred over Ethernet. 1495 bytes is the\nmaximum allowed on a single network packet and then some devices may implement segmentation\nof packets. As not all devices support segmentation, the driver in itself will segment the packets\nbefore sending it.\nPoll Interval – The time in milliseconds at which all the items will be requested from the device.\nPLEASE NOTE\nNB – If using the Station ID for WhoIs command the BACnet stack makes use of the very first NIC\non your PC to send broadcast messages. In some cases, this specific NIC chosen is not the same one\nthat the BACnet devices is running on and hence no communications. To overcome this scenario, a\nglobal registry key called “IPToUse” is created in the Drivers registry area with the default used NIC’s\nIP address in it. Here you can change the IP Address to the current NIC you want to use to access\nyour BACnet devices with. See image below.\nThe registry key for 32 Bit O/S:\nThe registry key for 64 Bit O/S:\n\n[Page 12]\nATQMS-DRVR-DOC-D_BACNET.docx\nP a g e | 12\nPROP_VT_CLASSES_SUPPORTED\nPROP_WEEKLY_SCHEDULE"}, {"title": "Beckhoff", "href": "drivers_html/Beckhoff.html", "category": "Drivers", "rel": "drivers_html/Beckhoff.html", "kind": "Driver", "text": "[Page 1]\nProtocol Driver\nName\nBeckhoff TwinCAT ADS-DLL API\nDLL\nBECKHOFF\n\n[Page 3]\nATQMS-DRVR-DOC-BECKHOFF.docx\nP a g e | 3\n1.\nOverview ................................................................................................................................................. 4\n1.1.\nRequired Files ...................................................................................................................................... 4\n2.\nWiring ..................................................................................................................................................... 5\n3.\nDevice Configuration .............................................................................................................................. 6\n3.1.\nDevice Configuration ............................................................................................................................ 6\n3.1.1.\nPort Selection ................................................................................................................................................. 6\n3.1.2.\nUDT Settings .................................................................................................................................................. 6\n3.1.3.\nPLC Details ..................................................................................................................................................... 7\n3.1.4.\nTest Connection Details ................................................................................................................................... 7\n4.\nSupported Addresses .............................................................................................................................. 7\n5.\nProtocol Definition and Considerations .................................................................................................. 8\n5.1.\nScanning UDT’s .................................................................................................................................... 8\n5.2.\nScanning VARIABLES by Name .............................................................................................................. 9\n5.3.\nMessage Protocol ................................................................................................................................. 9\n6.\nGeneral Notes and Troubleshooting ..................................................................................................... 11\n6.1.\nContact Details ................................................................................................................................... 11\n6.2.\n7.\nAppendix A – TwinCAT2 Installation .................................................................................................... 12\n7.1.\nTwinCAT Server Installation ................................................................................................................ 12\n8.\nAppendix B – TwinCAT3 Installation .................................................................................................... 15\n9.\nRevisions ............................................................................................................................................... 17\n9.1.\nDocument Revision............................................................................................................................. 17\n9.2.\nDLL Revision ...................................................................................................................................... 17\n\n[Page 4]\nATQMS-DRVR-DOC-BECKHOFF.docx\nP a g e | 4\n1. Overview\nFor this driver to work correctly the machine must have a running version of the Beckhoff’s TwinCAT\nServer. The Driver Supports TwinCAT2 and TwinCAT3. Please ensure it is installed.\nSee Appendix A for TwinCAT2 Installation and Appendix B for TwinCAT3 installation.\n1.1.\nRequired Files\nThis driver was developed using AdsDll.dll version 28, revision 0, build 14. This file or newer must\nbe present in the Windows path for the driver to be configured or run.\n\n[Page 6]\nATQMS-DRVR-DOC-BECKHOFF.docx\nP a g e | 6\n3. Device Configuration\n3.1.\nDevice Configuration\n3.1.1.\nPort Selection\nEnable Secondary – Enables secondary configuration for dual redundant PLCs via the primary and\nsecondary radio buttons. Do not enable if a secondary channel is not configured correctly.\n3.1.2.\nUDT Settings\nTPY File. – The TPY File is a file from the Beckhoff System that contains all the UDT Data. The\nDriver will import this file and automatically create all the UDT’s as specified in this TPY file. Click on\nthe browse button to select a file to open, and then press the “Get UDT Defs.” Button to create all\nthe UDT’s. A window will open after the creation process that will show all the UDT’s created and\nallow for manual intervention, if required.\nUDT Prefix – Prefix for UDT’s to search for in the TPY File.\nGet UDT defs. – This button will be enabled as soon as the “Test Con.” Action has succeeded. This\nwill open the TPY File specified and automatically create all UDT’s that can be found in the file with\nthe specified Prefix.\nPLEASE NOTE\nFrom Adroit 7.0.10.0 onwards, you will have a Browse functionality on the scan dialog that will\nread all the symbols from the TPY file into the browser and allow you to select the symbol. This\nwill then construct the scan address accordingly.\n\n[Page 7]\nATQMS-DRVR-DOC-BECKHOFF.docx\nP a g e | 7\n3.1.3.\nPLC Details\nRoutes – The Routes allow selection of Remote Beckhoff Units or just the remote. These routes will\nbe read from the registry where Beckhoff saves its configured routes. If communication is to be on\nthe local machine, just select “Local”. Also, “Custom” is available whereby the user can then manually\nspecify the AMS Net ID in case of the driver failing to fetch the routes from the registry as in the\ncase of TwinCAT3.\nAMS Net ID – The IP Address of the device you wish to communicate to. The default IP Address\nwill be the hosting PC’s IP Address. The last two digits are fixed.\nPort No. – A drop down list of available supported ports.\nPacket size (bytes) – The maximum number of bytes to read in one job. The maximum available\nis 1990 bytes and a minimum of 80 bytes (default string length).\nRetries – The number of times that Adroit will try to gain communication with a PLC before failing\na transaction.\nThe driver uses a fixed timeout of 5000 milliseconds on transactions.\n3.1.4.\nTest Connection Details\nTest Con. – A ‘test connection’ button is provided and will report the details of the type of PLC and\nits status.\n4. Supported Addresses\nDevice\nMin\nInputs I (read only)\n65535.8\nBOOL\nWORD\nIW:0\nIW:0\nOutputs Q\n65535.8\nBOOL\nWORD\nQW:0\nQW:0\nInternal M\n65535.8\nByte\nMB:0\nWORD\nMW:0\nMW:0\nInt\nMW:0 S\nMW:0\nDWORD\nMD:0\nMD:0\nDint\nMD:0 S\nMD:0 S\nFloat (Real)\nMD:0 F\nString\nMW:0.80 C\nUDT’s\n\n[Page 8]\nATQMS-DRVR-DOC-BECKHOFF.docx\nP a g e | 8\n5. Protocol Definition and Considerations\n5.1.\nScanning UDT’s\nTo Scan any UDT, just follow the following structure:\nUDT:<ProgramName>.<MyUDT> <StructureName>\nWhere:\n<ProgramName> = If the UDT Instance is in the Global Variable Scope of the Beckhoff Software,\nthen this stays empty, but if it is any other place than Global Variables, then\nthe scope must be specified, like MAIN as example.\n<MyUDT>\n= The Structure Instance as created in Beckhoff software.\n<StructureName> = UDT(Structure) Name as created in the Beckhoff software.\nExample(MAIN Program Scope): UDT:MAIN.myTest1 ST_DEMO\nExample(Global Variable Scope): UDT:.myTest1 ST_DEMO\nUDT’s can be setup for callbacks instead of polling. To do this, just change the scan rate to 0 when\nscanning. This is for the purpose of timestamping. To enable timestamping for a UDT, you must\ncreate 2 DWORD slots called “FILETIME_HIGH_DWORD” and “FILETIME_LOW_DWORD”, which\nmust be packed with the FILETIME’s high and low 32-bit words.\nThe driver also support ENUMS and UDT’s in UDT’s.\nPLEASE NOTE\nThis driver does not support Arrays in UDT’s."}, {"title": "Cimbria", "href": "drivers_html/Cimbria.html", "category": "Drivers", "rel": "drivers_html/Cimbria.html", "kind": "Driver", "text": "[Page 1]\nProtocol Driver\nName\nCimbria Serial\n\n[Page 3]\nATQMS-DRVR-DOC-CIMBRIA.docx\nP a g e | 3\n1.\nOverview ............................................................................................................................................. 4\n2.\nRevisions ........................................................................................................................................... 10\n2.1.\nDocument Revision........................................................................................................................ 10\n2.2.\nDLL Revision ................................................................................................................................. 10\n3.\nWiring ................................................................................................................................................. 5\n4.\nDevice Configuration .......................................................................................................................... 6\n4.1.\nDevice Configuration ....................................................................................................................... 6\n4.1.1.\nConfiguration Selection [not implemented] .................................................................................................. 6\n4.1.2.\nPort Setup ................................................................................................................................................ 6\n4.1.3.\nDevice Details ........................................................................................................................................... 7\n5.\nSupported Addresses .......................................................................................................................... 8\n6.\nProtocol Definition and Considerations .............................................................................................. 9\n6.1.1.\nCimbria Protocol Instruction Structure......................................................................................................... 9\n7.\nGeneral Notes and Troubleshooting ................................................................................................. 10\n7.1.\nContact Details .............................................................................................................................. 10\n7.2.\n\n[Page 4]\nATQMS-DRVR-DOC-CIMBRIA.docx\nP a g e | 4\n1. Overview\nThis document describes the setup of, and the communication protocol implemented in the Adroit\nprotocol driver, with the following logic unit: Cimbria level sensor.\nThe Cimbria devices can take up to 12 seconds to reply to a single line request, for this reason it is\nrecommended that scans are only added when the device is stopped.\n\n[Page 6]\nATQMS-DRVR-DOC-CIMBRIA.docx\nP a g e | 6\n3. Device Configuration\n3.1.\nDevice Configuration\n3.1.1.\nConfiguration Selection [not implemented]\nEnable Secondary – Enables secondary configuration for dual redundant Controllers. This setting\nis disabled for this driver.\nPrimary/Secondary – Select the primary or secondary button depending on which connection you\nwish to configure.\nThis feature is not available for this driver.\n3.1.2.\nPort Setup\nPort – Select the serial port to use for communications.\nParity – Select even or uneven parity in a single serial transmission message.\nDataBits – Select the number of data-bits per packet.\nStopBits – Select the number of stop-bits per packet.\nBaud Rate – The transmission rate of data (including start and stop bits). The default baud rate\nfor a Cimbria unit is 9600.\n\n[Page 9]\nATQMS-DRVR-DOC-CIMBRIA.docx\nP a g e | 9\n5. Protocol Definition and Considerations\n5.1.1.\nCimbria Protocol Instruction Structure\nMessage\nStart\nMessage start:\nThe exclamation mark character (0x21) indicates the start of a new instruction.\nCimbria Station Address:\nThis three digit number indicates the address of the Cimbria device, to which the message will to be\nsent.\nCommand/Instruction:\nThis single character instruction identifies the type of information that is requested by the user. This\ncould be any one of the instructions described in the previous section (Supported Addresses).\nCommand Parameters:\nThese parameters are command specific and vary in length between commands.\nMessage stop:\nThe Asterix character (0x2A) indicates the end of the instruction.\n\n[Page 10]\nATQMS-DRVR-DOC-CIMBRIA.docx\nP a g e | 10\n6. General Notes and Troubleshooting\n6.1.\nContact Details\nPhone: +27 11 658-8100\n6.2.\nFor additional information, please refer to our Knowledgebase website:\nLatest Drivers topics - Features, discussions, tips, tricks, questions, problems and feedback\n(adroittechnologiesautomation.com)\n7. Revisions\n7.1.\nDocument Revision\nRev.\nDate\nChanges to format, updated image resources.\nAdded Appendix B DCOM Hardening. Removed\nWindows XP section\nD. Jordaan\n2.0\n3.0\n7.2.\nDLL Revision\nRev.\nDate\n24-Nov-2014\nFirst Release notes!\n26-June-2018\nExtended address ranges of A and T line numbers to 0 - 8\n18-Aug-2020\nOngoing driver maintenance."}, {"title": "Communications Link Serial", "href": "drivers_html/Communications_Link_Serial.html", "category": "Drivers", "rel": "drivers_html/Communications_Link_Serial.html", "kind": "Driver", "text": "[Page 1]\nD_COMLI_SER\nCommunications Link Serial Protocol Driver\n\n[Page 3]\nD_COMLI_SER.docx\nP a g e | 2\n1.\nCommunications link Serial protocol Driver ........................................................................................... 3\n1.1.\nOverview ............................................................................................................................................. 3\n1.2.\nTest Hardware ..................................................................................................................................... 3\n1.3.\nWiring ................................................................................................................................................. 3\n1.4.\nDevice Configuration ............................................................................................................................ 5\n1.5.\nSupported Addresses ........................................................................................................................... 8\n1.6.\nTimesync considerations ....................................................................................................................... 9\n1.7.\nComli – Protocol function supported ...................................................................................................... 9\n2.\nConfiguring Mitsubishi FX5 as a Comli slave ....................................................................................... 10\n2.1.\nComli function block setup .................................................................................................................. 10\n2.2.\nPLC program...................................................................................................................................... 10\n2.3.\nPLC Wiring ......................................................................................................................................... 11\n2.4.\nResulting output ................................................................................................................................ 12\n2.5.\nFX5 / Comli I/O mapping .................................................................................................................... 12\n\n[Page 4]\nD_COMLI_SER.docx\nP a g e | 3\n1. Communications link Serial protocol Driver\n1.1.\nOverview\nThis driver supports the ABB Communications link driver.\nThe 2nd Generation driver allows for the following features:\nImproved performance due to optimizations on mixed I/O to the same protocol area being transacted\nonly once removing redundant transactions.\nSerial drivers by design don’t benefit from multiple channels thus only one channel per device is\nenforced. Up to 247 Multi-dropped devices are supported per port.\nDemand scanning support, where read only I/O that is not on a mimic / graphic form and not logged\nor alarmed will be removed from the scanning system, the applicable tasks will dynamically reduce is\nsize and merge into fewer scan tasks.\nFor improved network performance and reliability, it is recommended to use of industrial USB serial ports\nor true serial cards into the machines where applicable. RS232 and RS485 and RS422 is supported\nWindows traditionally expects com ports to always be available, loosing contact with Ethernet serial\nextenders can cause lockups… please contact Adroit support if you suspect this.\n1.2.\nTest Hardware\nThis driver has been tested on the following hardware:\nFX5U -32MT/DSS Plc using USER_FB_Comli_FX5U function block dated 2019/04/24 14:25:42\n1.3.\nWiring\nControl of DSR/DTR CTS/RTS signalling is available as needed.\nRS-232-c / RS-422 / 485, 4 and 2 wire supported.\nReflection detection is configurable, (future …)\nDB9 , DTE to DTE cable diagram RS-232C - 3 wire (With loopbacks in case the system expects signalling)\nPLC 9 pin\nPC 9 pin\n2 RX\n2 RX\n3 TX\n3 TX\n5 GND\n5 GND\nNote: Connect shield to one side , PLC side only\n\n[Page 7]\nD_COMLI_SER.docx\nP a g e | 6\nPLC Details\nStation ID – ( 1 default ) PLC station id 1 – 247 , Master is always 0.\nPLC Model – ( ABB CPU default) – Choose a specific model (future)\nDebug level bitmask – ( 480 default) - this is a bit mask that enable extra debugging in the data-scope\noutput, do not leave it enabled during normal operation on high speed drivers as it will slow down the\nsystem, depending on speed requirements, in serial drivers this delay is negligible.\n960 default is just the protocol messages 40hex + 80hex+ 100hex + 200hex = 3C0hex -> 960 decimal in\nthe dialogue\n#define DEBUG_MASK_COMSRESOURCE_INFO 0x00000001\n#define DEBUG_MASK_COMSRESOURCE_CRITICAL 0x00000002\n#define DEBUG_MASK_PROTOCOL_ITEM_VALUES 0x00000004\n#define DEBUG_MASK_PROTOCOL_ITEM_BAD_VALUES 0x00000008\n#define DEBUG_MASK_NASA_POOLS 0x00000010\n#define DEBUG_MASK_TIMING 0x00000020\n#define DEBUG_MASK_PROTOCOL_RESPONSES 0x00000040\n#define DEBUG_MASK_PROTOCOL_REQUESTS 0x00000080\n#define DEBUG_MASK_PROTOCOL_READ_DESC 0x00000100\n#define DEBUG_MASK_PROTOCOL_WRITE_DESC 0x00000200\nStale threshold – ( 5 default) – Every nth occurrence of a unchanged item value will be sent to the\nmaster, if the value is different the value will be send regardless of this count. This count reduces\nunnecessary event withing the agent server. Set to to report every poll value regardless of change , 0 is\nnot a valid option.\nMax PDU length – (32 default) - The overall maximum transaction length , 1 is the lowest value up to\n32 16bit-registers or 32 x 16 discreet bits digitals per transaction.\nSerial\nCom Port – Only insert the number for the port, E.g. “4” for com4\nBaud rate – Combo ( 9600 default ) – select the required baud rate from the selection provided.\nDatabits – Combo ( 8 default ) – select the required databit count from the selection provided.\nParity – Combo (ODD default) – select the required Parity mode from the selection provided.\nStopbits – Combo ( 1 default) ) – select the required stopbit count from the selection provided.\nTransaction timeout – (3000 mSec Default ) – insert the required timeout for the system in\nmilliseconds.\n485 Reflections (false by default) – check if reflection detection and compensation is required on the\nport (future …)\n\n[Page 8]\nD_COMLI_SER.docx\nP a g e | 7\nPurging\nThe driver will purge TX and RX buffers (data on the port) by default when required.\nHowever, some systems such as Ethernet to serial port servers can become overloaded or even lockup if\nleft receiving bytes in its internal buffer without a driver reading anything for a long period, for example\nwhen a cluster partner is in standby use the setting below to compensate.\nPurge port in standby (false by default) – check if purging of the buffers are to be performed in the\nbackground while the cluster partner is in standby.\nPurge mode – (SOFT default) Soft cause a simple flushing via reading any available bytes, HARD sends\na system call to tell the device itself to flush, some systems have become unresponsive in hard mode.\nError handling – Multi-dropped system variables\nRetries – Enable this button to have the driver keep the PLC connection alive. Please see the PLC program\nand heartbeat sections below. This option is only useful with the watchdog program running in the PLC.\nBackoff count – (5 default) – require 5 full consecutive failures including retries.\ne.g. if 3 retries is configured and the backoff count is 5, the system will go into a backoff delay period in\nwhich this device will not be polled or written to for the Backoff period, in this example after the ((1+3)*5)\nconsecutive failures.\nBackoff period – Specify the millisecond interval the a device will stay silent on the channel, this is very\nuseful in multi-dropped systems as failing devices do not severely affect online devices.\nDisconnect after every transaction – (false default) -tell the channel to close the port after every\ntransaction, can be useful on gateways if required.\nDisconnect after every error – –(false default) – tell the channel to close and reopen the port on every\nerror during retries else it will only occur after the final retry\nLatency\nInter-PLC latency – The period that the system will wait before transmitting any read request or write\nrequest in multi-dropped system when a new device is contacted.\nTransmission latency – The period that the system will wait before transmitting any read request or write\nrequest for the same plc device. Inter message delay.\nTx to RX latency – The period that the system will wait after transmitting a request and before attempting\nto read the response.\nData ranges\nn W\n\n[Page 10]\nD_COMLI_SER.docx\nP a g e | 9\n1.6.\nTimesync considerations\nScan address T 0, T 0 W scan to any discreet agent type such as BOOLEAN, INTEGER or REAL agent.\nMake sure the “INPUT DISABLED” and OUTPUT ENABLED” check boxes are checked, as this type is write\nonly.\nThe driver will then send down the system time in UTC time format.\n1.7.\nComli – Protocol function supported\n0 30H (Write) Transfer Multiple I/O bits ( P 0 ) or register (P 0 W)\n1 31H Acknowledge.\n2 32H Requests multiple I/O bits or registers groups of at least 8 bits, registers are\ngroups of 16bits\n3 33H (Write) Transfer single I/O bit\n4 34H Request a single I/O bit. (redundant function 2 is used)\nJ 4AH Transfer date and time in UTC format.\nIf more messages are required please contact the Adroit driver department, these will be added as required."}, {"title": "Conet PCI", "href": "drivers_html/Conet_PCI.html", "category": "Drivers", "rel": "drivers_html/Conet_PCI.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-CONETPCI.docx\nP a g e | 3\n1.\nOverview ............................................................................................................................................. 4\n2.\nWiring ................................................................................................................................................. 5\n3.\nDevice Configuration .......................................................................................................................... 6\n3.1.\nHardware Installation ...................................................................................................................... 6\n3.2.\nDriver Installation and Setup ............................................................................................................ 8\n3.3.\nDevice Configuration ....................................................................................................................... 9\n3.3.1.\nSelect FEP Card for this Device................................................................................................................... 9\n3.3.2.\nFEP Card State ......................................................................................................................................... 9\n3.3.3.\nOutstation Settings ................................................................................................................................... 9\n4.\nSupported Addresses ........................................................................................................................ 10\n5.\nProtocol Definition and Considerations ............................................................................................ 11\n5.1.\nPLC Software ................................................................................................................................ 11\n6.\nGeneral Notes and Troubleshooting ................................................................................................. 12\n6.1.\nContact Details .............................................................................................................................. 12\n6.2.\n6.3.\nTroubleshooting ............................................................................................................................ 12\n6.3.1.\nCommunications problems ........................................................................................................................ 12\n6.3.2.\nInstallation problems ................................................................................................................................ 12\n7.\nAppendix A – Node Address Table .................................................................................................... 13\n8.\nRevisions ........................................................................................................................................... 15\n8.1.\nDocument Revision........................................................................................................................ 15\n8.2.\nDLL Revision ................................................................................................................................. 15\n\n[Page 6]\nATQMS-DRVR-DOC-CONETPCI.docx\nP a g e | 6\n3. Device Configuration\n3.1.\nHardware Installation\nPlease follow the instructions provided with your card, the instructions below are correct at time of\ncompilation, and may differ from the prescribed procedure.\nUnless the card is already successfully installed and working in the host machine the following steps\nmust be followed.\nEnable Plug-N-Play on your computer’s BIOS.\nSwitch off your computer and unplug the power cable.\nInsert the card into a blank PCI (white) slot.\nCard OID /Node Address(SW1 1to SW1 7). The own ID of the card must be set to a unique\naddress between 1 and 127. Remember that optimum performance (owing to the nature of the “Next\nNode searching algorithm employed for token passing) is achieved when there are no gaps between\nthe node numbers.\nMode Setting (SW1 8). Select between (N)ormal mode and (S)low mode. Mode N is 62500\nbaud and Mode S is 7800 baud. Typically Mode N is used, but for networks with high interference\nlevels, or large distances between the terminators, Mode S will be more reliable.\nTurn on the computer, windows will automatically install the Jungo card drivers for you from\nthe Conet Software CD, which must be inserted into your CD-Rom drive.\nRun the Omniflex CD setup program to install the COM component needed by the Adroit\ndriver, a small test program will also be installed at this time.\nReceive LED (yellow)\nToken LED (green)\nTransmit LED (red)\nD9 connector\nSW1 1..8\n\n[Page 8]\nATQMS-DRVR-DOC-CONETPCI.docx\nP a g e | 8\n3.2.\nDriver Installation and Setup\nThe driver installation follows the normal installation procedure. This will entail running Adroit setup\nand selecting the “Drivers” tab, choosing the “Add Driver” button, selecting the Conet PCI driver,\nand entering in the setup details in the setup dialogue that appears. However, because third-party\nsoftware is used to assist in the low-level communications, there are certain checks that can be made\nto ensure that the installation was successful.\nPerform the checks listed below if you have any problems.\nSecurity Problems you may have:\nTypically, when installing Adroit and configuring the driver for the first time, the configuring user will\nhave Administrator Privileges allocated.\n\n[Page 9]\nATQMS-DRVR-DOC-CONETPCI.docx\nP a g e | 9\n3.3.\nDevice Configuration\nThe driver setup dialog will allow you to configure your driver devices. Configure one device per\nConet Network Node. A maximum of 127 devices may be used at one time. More than 32 devices\non the Conet Network may significantly reduce the speed of data transmission and is not\nrecommended.\n3.3.1. Select FEP Card for this Device\nFEP Card (1 – 4) - This Radio Button Group requires the selection of a Card Number. This Card\nNumber has nothing to do with settings on the proprietary card itself; the Card Number is a driver\noption, which will be allocated to a physical card to identify it. This means that a maximum of four\nConet cards may be installed in a single machine.\n3.3.2. FEP C
