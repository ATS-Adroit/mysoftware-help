.............................................................................................................................. 13\n\n[Page 6]\nATQMS-DRVR-DOC-HITACHIH.docx\nP a g e | 6\n2.1.1. For Modems\nConnect PLC via the [DTE<->DCE] cable to the receiving Modem.\nConnect PC via a straight modem cable (usually ships with modem) to the Transmitting modem.\nRecommended US Robotics Modem config Setups:\nConfiguring PC-side modem use Hyper-terminal:\nStart with “AT&F0” factory reset. “ATI4” displays current configuration. Alternatively, insert this\nstring into device modem configuration for auto loading:\n“ATE0&B1&N10&C1&D2&R2”\nSave with “AT&W0”, “AT&W1”.\n&B1, &N10 forces it to connect at only 19200.\nCareful: to match your configuration, see your modem documents for specific details.\n&D2, &R2 forcing hang-ups, etc., during communications attachment.\nConfiguring PLC-side modem use Hyper-terminal:\n“ATE0S0=1&B1&N10&C1&D0&H1&S1&R2”\n“&D0” forces modem to accept incoming connections without terminal ready (TR).\n“&H1”, “&S1”, “&R2” enables handshaking to the PLC.\n“S0=1” auto answer mode.\n“&B1”, “&N10” forces it to connect at only 19200 (Careful: make sure to match your device\nconfiguration.)\n\n[Page 8]\nATQMS-DRVR-DOC-HITACHIH.docx\nP a g e | 8\nStop bits - Forms part of the serial communication setting. For example, 8 data bits, 1 or 2 Stop bits,\nno parity serial communication. Ensure that the Stop bit settings are the same on the local and remote\nmachines. (Data bits are fixed to 7)\nRetry - The number of times that Adroit will try to gain communication with a PLC before failing a\ntransaction.\nTimeout (ms) - The time that Adroit will wait for a valid response from a PLC before failing a\ntransaction (Read or Write).\nTrans delay (ms) – (Default = 60) If non-zero CTS (Clear-to-send) flow control is enabled, and the\ndriver uses this value as a “settle” time for the outgoing CTS signal whenever it is about to send any\nrequests.\n3.1.3. PLC Details\nPLC Type - Applicable Hitachi PLC types (as detailed above.)\nUse RS-422 Network – Uncheck/disable for point-to-point connection. Check/enable for RS-422\nmulti-dropped connection.\nPLC Station ID – (RS-422 only) station ID as set on PLC.\nLink Number – (Default = FF) Link # in hexadecimal.\nUnit Number – (Default = FF) Unit # in hexadecimal.\nModule Number – (Default = 00) Module version number.\nPort Number – (Default = 00) Port # in hexadecimal.\nDelay (TM) – (Default = 2) The TM (TW) delay in hexadecimal.\n3.1.4. Advanced\nUse Occupy Task Codes – (Default = unchecked) This option will be set depending on CPU model\nselected. If it was automatically set for a CPU, this option will be disabled but “ON”.\n3.1.5. Defaults Button\nLoad Default values – Will reset all settings shown to what they were before this device was\ncreated.\nSpecific CPUs only operate correctly with special parameter changes viz.\nH300, H302, H700 and H702 models require that the Trans delay parameter be adjusted to 60ms or\nmore. (Rev 20c onwards of the driver does this).\nModels H200 H300 H307 H700 and H2000 require the Task codes option turned on. In this case, the\ndriver does not allow the user to manipulate the setting either.\n\n[Page 10]\nATQMS-DRVR-DOC-HITACHIH.docx\nP a g e | 10\n4.\nSupported Addresses\nHitachi PLC data address types supported by the Hitachi Adroit Protocol driver\nDevice\nPLC Data Type\nBoolean\nInteger\nUnsigned 16bit Reg\nWR0000\nWR0000\nSigned 16bit Reg\nWR0000I\nWR0000I\nUnsigned 16bit Reg\nWM0000\nWM0000\nSigned 16bit Reg\nWM0000I\nWM0000I\nUnsigned 16bit Reg\nWL0000\nWL0000\nSigned 16bit Reg\nWL0000I\nWL0000I\nUnsigned 32bit Reg\nWR0000\nDR0000\nSigned 32bit Reg\nWR0000L\nDR0000L\nFloat 32bit Reg\nDM0000R\nDM0000R\nSigned 32bit Reg\nDM0000\nDM0000\nUnsigned 32bit Reg\nDL0000L\nDL0000L\nFloat 32bit Reg\nDL0000R\nDL0000R\nSigned 32bit Reg\nDM0000\nDM0000\nUnsigned 32bit Reg\nDL0000L\nDL0000L\nFloat 32bit Reg\nDL0000R\nDL0000R\nPLEASE NOTE\nBOOLEAN types can only be Read from and Written to Digital areas in the PLC (i.e. R, M, L types).\nThe maximum number of items (digital bits or “16-bit” Registers, with 2 consecutive registers for\nDoubles) that can be communicated for the different Hitachi PLC's is shown below:\nR\nM\n\n[Page 12]\nATQMS-DRVR-DOC-HITACHIH.docx\nP a g e | 12\n6. General Notes and Troubleshooting\n6.1.\nContact Details\nPhone: +27 11 658-8100\n6.2.\nFor additional information, please refer to our Knowledgebase website:\nLatest Drivers topics - Features, discussions, tips, tricks, questions, problems and feedback\n(adroittechnologiesautomation.com)\n6.3.\nTroubleshooting Notes\n1. H200 type PLC’s require CTS handshaking. This is automatically enabled if the PLC Type is\nH200, but not for other types.\n2. A Transaction Delay value of 60-100ms has been found to suit most applications. It is\nrequired as some Hitachi PLC’s cannot handle too many transactions in quick succession. Check\nthe Windows NT event log to see if you are getting too many retries or timeouts and try\nadjusting the Transaction Delay value to optimise performance. The default setting here is 60\nmilliseconds, newer controllers may be able to use 20 ms. Adjust this setting until stable comms\nis achieved for maximum performance.\n3. Another factor sometimes causing excessive errors/retries in the H200/250/252 PLC types is\nif the PLC program is too short. Some users have reported much more reliable communications\nto these PLC’s simply by increasing the PLC program size.\n4. If you get intermittent comms failures on older models … try setting the tm delay to 2. This\ndelay’s default value is 2, a value of 0 may be used for some newer CPU models."}, {"title": "How To - Robustel MQTT Device Setup", "href": "drivers_html/How_To_Robustel_MQTT_Device_Setup.html", "category": "Drivers", "rel": "drivers_html/How_To_Robustel_MQTT_Device_Setup.html", "kind": "Driver", "text": "[Page 1]\nRobustel MQTT Device Setup & Commissioning Procedure\nDrafted By\nDate\n* All required device access credentials and supporting apps can be found here:\n\\\\Adtech-dfs\\dfs\\Adroit Support\\Adroit Projects\\02 - Smart UI\\Umgeni\\CP MQTT to Fx Pilot\n1. Device Online Status\n1.1.\nLogin to Robustel RCMS Platform. Go to RobustelLink and view all devices. Verify that the router to be tested is online and registered to the\nnetwork.\nFollow link: Robustel Cloud Manager Service\n1.2.\nGo to RobustelVPN and select UW_MDMR_CP VPN group.\n\n[Page 4]\n2.5.\nClick on the generated link. This will launch a new webpage instance in your internet browser. Use the provided login credentials to access\nthe router.\n2.6.\nClick on status.\n- Ensure that firmware 5.3.5 or higher is installed on the router. If not, then the router first needs to be updated.\n- Copy the device serial number to notepad. Will be used during the MQTT client setup.\n\n[Page 24]\n4.3. Run the Adroit Configuration Setup and Install the MQTT driver or add the Adroit MQTT client. Clients connect to a single broker or API’s with a\nsecondary connection should the primary connection not be available.\n\n[Page 37]\nRouter not registered on the network\nEnsure that the correct sim card is installed\nto sim slot number 1. (Refer to the device\nmanagement register.xlsx)\nEnsure that Vodacom network service is\ncurrently available and that reception is good\nthe building or kiosk where the router is\ninstalled.\nGSM antenna connected to the Main\nconnector. Antenna placement is important.\nIf possible, move antenna outside of the\nkiosk or as high as possible. Monitor the\nrouter signal indicator. The LED must remain\nrather solid.\nCheck sim card status and data balance on\nthe RCMS platform and with RJ Connect.\nReboot the router and wait on the RUN, MDM\n& WLAN LEDs to come on.\nThe Router must be registered to the RCMS\nplatform, initialised and a RCMS licence\nallocated to it from accounts.\nRouter not registered on the VPN Network\nRCMS service not started on the router. Use\nremote access from RCMS platform to\nenable it.\nThe router must be grouped with the other\nrelated routers to the same VPN group.\nInitialise the VPN connection from the RCMS\nThe Router must be registered to the RCMS\nplatform, initialised and a RCMS licence\nallocated to router serial number from\naccounts.\nRouter Remote Access\nDevice must be online\nDelete old link and generate a new one.\n\n[Page 38]\nRouter/Client Can’t Connect with the Broker\nVerify the Broker login credentials, that TLS is\nenabled, that broker certificate is still valid\nand applied to the client.\nCheck internet connectivity.\nVerify if other devices or clients also\nexperience a connection problem, or do\nother clients still connect with the broker\nsuccessfully.\nLogin to the broker and see that broker\nsubscription & service is still active and that\nwe have not reached max client connections\nor that the device sim ran out of data.\nModbus Register/s not updating\nVerify that Modbus Client is enabled.\nVerify Modbus table, IP address, Port, TCP\nselection, Modbus function and registers to\nbe configured correctly.\nCheck PLC connection and availability. Use\nRouter ping tools to poll the local devices\nconnected to its LAN0 port.\nVerify that the PLC’s Modbus routing table is\nconfigured and setup correctly.\n\n[Page 39]\nSITE COMMISSIONING SHEET\nSCADA Engineer\nDATE\nSITE NAME\nREGION\nMQTT REPORT RATE\nMODBUS READ RATE\nFIREWALL STATUS\nTAG\nAGENT\nRAW & OFF STATE\nENG & ON STATE\nDISPLAY CHECKED\nUNIT\nText\nSITE NAME\nFRAME\nText\nSITE COORDINATES\nFRAME\nText\nDEVICE TIMESTAMP\nDATE\nText\nAC MAINS FAIL\nMARSHAL/R\nAC Mains Fail\nAC Mains Healthy\n0-1\nCritical Alarm/AMA\nPSU MAINS FAIL\nMARSHAL/R\nPSU Mains Fail\nPSU Mains Healthy\n0-1\nCritical Alarm/AMA\n0-1\nCritical Alarm/AMA\nCP CONTROL MODE STS\nMARSHAL/R\nIn Auto\n0-1\nEvent/AMA\nCIRCUIT DISCONNECT RELAY STS\nMARSHAL/R\nCircuit Closed\n0-1\nWarning Alarm/AMA\n0-1\nWarning Alarm/AMA\n0-1\nCritical Alarm/AMA\nIN/OUT OF SERVICE\nDIGITAL\nIn Service\nOut of Service\n0-1\nWarning Alarm/AMA\nCONTROL MODE CTRL\nMARSHAL/W\nAuto Select\n0-1\nEvent/OprAudit/Security/AMA\nCIRCUIT DISCONNECT RELAY CTRL\nMARSHAL/W\nCircuit Close Select\nCircuit Open Select\n0-1\nEvent/OprAudit/Security/AMA\nV\nLL Critical, L Warning/AMA\nYES\nDBLOG ANALOGS\nmA\nLL Critical, L Warning/AMA\nYES\nDBLOG ANALOGS\nV\nLL Critical, L Warning/AMA\nYES\nDBLOG ANALOGS\nREFRENCE POTENTIAL SP\nANALOG\n0-16000\nV\nEvent/OprAudit/Security/AMA\nPAYLOAD SCRIPT & TRIGGERS\nTEST WRITES\nCOMS FAIL SCRIPT\nTEST COMS FAIL\nAMA REPORT\nTEST AMA REPORT\nHereby we declare that the site has been tested end-to-end—from the frontend device through to the SCADA graphics—and is accepted as fully commissioned\nDATE\nCUSTOMER SIGNATURE\nDATE\nOutstanding items\nAdroit: SCADA Base Router & configuration still to be deployed on uMhgeni uThukela Midmar SCADA. To be planned & scheduled with IT during a planned visit."}, {"title": "INTRAC 2000", "href": "drivers_html/INTRAC_2000.html", "category": "Drivers", "rel": "drivers_html/INTRAC_2000.html", "kind": "Driver", "text": "[Page 1]\nINTRAC : INTRAC 2000\nINTRAC 2000 driver\nOverview\nThe INTRAC 2000 protocol for Adroit communicates to a INTRAC 2000 Central Interface Unit (CIU)\nvia a serial rs232 port that receives data from remote outstations.\nThe protocol allows both polling for data as well as receiving data on exception (i.e. data is received\nasynchronously when a value changes at an outstation).\nProtocol Manufacturer\nMotorola.\nIntrac CIU (25 pin RS-232C male)\nComputer Interface (25 pin RS-232C female)\n2 - Transmit\n2 - Receive\n3 – Receive\n3 – Transmit\n7 – Signal Ground\n7 – Signal Ground\nDriver Installation and Setup\nThe driver is installed by picking the INTRAC driver from the drivers directory. The INTRAC.DLL and\nthe INTRAC.DOC are then copied into the Adroit directory.\nAfter installation of the driver, the user may then create and configure devices for the INTRAC driver.\nPrinted\n\n[Page 2]\nINTRAC : INTRAC 2000\nDevice Configuration\nDevices\nAt a minimum, you must create at least one device for every port being used. However, you may choose\nto create a device for a group of transmitters. Device configuration dialog\nPort\nSelect the port through which you are going to communicate.\nBaud Rate\nThe baud can be selected. Other parameters are fixed at the standard rate of 7 data, 1\nstop, and odd parity.\nTimeout\nThis field gives the waiting time if not end of message is received once a start of message\nis received. It is recommended that this value be kept at 1000.\nMoxa\nCluster\nCheck this option when running on a MOXA virtual port in a cluster environment. It will\nallow to purge the port when in standby and in shadow mode, as the MOXA unit stops\nfunctioning in this mode. Data keeps filling the buffer seeing that the driver does not do\nany reading from the port and eventually becomes unresponsive!\nHard Purge\nDoes a call to the COM PORT to purge all the data on it. (Preferred Method)\nSoft Purge\nContinue to read data from the port and just discard it.\nClose serial\nport on fail\nWith a transaction failure closes the port and re-opens it by default but for some virtual\nports it becomes an issue so we allow not closing the port in this case.\nPrinted\n\n[Page 3]\nINTRAC : INTRAC 2000\nDownload & Driver Parameters\nThese Download parameters are explained in the appendix.\nDriver Parameters\nInterrogate on Startup – All outstations are interrogated on agent server load.\nHot Standby – The driver does not send any data to outstations but only receives data and updates its\ndatabase. This parameter can be toggled by using system tag number 9.\nDelay Between AI’s – To slow AI’s down – not really required since driver only polls after a RI is\nreceived.\nAcknowledge Delay – An AA message is sent only after this specified delay , so that more than 1 group\ncan be acknowledged at once.\nPrinted\n\n[Page 5]\nINTRAC : INTRAC 2000\nBit 4 - Group D communication failure\nBit 5 - Group E communication failure\nBit 6 - Group F communication failure\nBit 7 - Group G communication failure\nBit 8 - Group H communication failure\nBit 9 – Manual Poll does Auto Interrogate on demand. (Tag must be output enabled)\nBit 10 – 15 – Unused.\nGroup Data Tags: GD: St: Gr: [B] [T]\nWhere: GD – Group Data\nSt – Outstation Number\nGr – Group A,B,C,D,E,F,G or H\nB – Bit number – 0- 7\nT – Analogue type N or C\nBoolean, Integer and Real Support.\nFor digital tags a maximum of 8 scan points from a Group can be scanned.\nFor analogues a group can be scanned in as either Normal(N) or as a Counter(C). Scanning of integers\nmade of 2 groups is to be scanned individually and calculated using an expression agent.\nDigital Ouput Tags: DO: St: Gr: [B] [T]\nWhere: DO – Digital Output\nSt – Outstation Number\nGr – Group A,B,C,D,E,F,G or H\nB – Bit number\nT – Digital Output type – SM,SL,PN or PR\nSM - Single Momentary : the outputs to be toggled are set to 1 and the rest of the bits to 0. These bits are\nto be configured as pulsed items. The output is only triggered on a rising edge. 8 bits are used for every\ngroup.\nSL - Single Latched : a latched command ,the outputs to be set on are set to 1 and the outputs to be reset\nare set to 0. After the transaction the bits remains in their respective states. Outputs are sent both on\nrising and falling edges.8 bits are used for every group.\nPN - Paired Normal : If a bit is set, the data transmitted is a 1 and 0 ,and a bit is reset the data transmitted\nis a 0 and 1. 4 bits are used for every group.\nPR - Paired Reverse : If a bit is set, the data transmitted is a 0 and 1 ,and if a bit is reset the data\ntransmitted is a 1 and 0.\nPrinted\n\n[Page 9]\nINTRAC : INTRAC 2000\nAppendix\nCIU download configuration parameters\nConfiguration (4, 8, 16).\nDefault value 4. The CIU can address up to 512 stations out of a total of 2048\ndifferent remote stations in an INTRAC 2000 system. The parameter\ndetermines the number of systems among which the 2048 remote stations are\nto be allocated. If 1-4 systems are being used, the value “4” is assigned to this\nparameter, i.e. maximum 512 stations per system. If 5-8 systems are used, the\nvalue “8” is assigned, i.e. maximum 256 stations per system. If 9-16 systems\nare used, the value “16” is assigned, i.e. maximum 128 stations per system.\nSystem Address (0-3 or 0-7 or 0-15).\nDefault value 0. Each system assigned to a CIU requires an identification\naddress between 0 and 3. If 2-4 systems are being used, each system must be\nassigned a separate address between 0 and 3. If 5-8 systems are being used,\neach system must be assigned a separate address between 0 and 7. If 9-16\nsystems are being used, each system must be assigned a separate address\nbetween 0 and 15. NB : It is important to assign separate system\naddresses to adjacent INTRAC 2000 systems using identical\nfrequencies, to avoid inter system interference.\nLowest Address (0-511 or 0-255 or 0-127)\nDefault value 0. This parameter determines the lowest remote station address\nin the system from which the CIU will recognize messages. Messages sent\nfrom a remote station with an address lower than the value of this parameter\nwill not be recognized by the CIU.\nHighest Address (0-511 or 0-255 or 0-127)\nDefault value 511 or 255 or 127, depending on system configuration. This\nparameter determines the highest remote station address in the system from\nwhich the CIU recognizes messages sent from a remote station with an\naddress higher than this parameter will not be recognized by the CIU.\nPrinted\n\n[Page 11]\nINTRAC : INTRAC 2000\nWait-for-Answer T1 (0-6.35 sec)\nMinimal time resolution is 0.05sec, default value 2 sec. After each autonomous transmission of\ninterrogation code-words, the CIU waits a predetermined period of time for an answer from the\ninterrogated station. During this period the CIU makes no additional automatic interrogations. The\nWait-for-Answers T1 and Wait-for-Answers T2 parameters determine the actual length of time that\nthe CIU waits before indicating that the remote station being interrogated has failed. These two\nparameters are explained more fully in   in the CIU Operating Instructions Manual.\nWait-for-Answer T2 (0-635 msec)\nMinimim time resolution is 5 msec, default value 500 msec. After each\nautonomous transmission of interrogation code-words, the CIU waits a\npredetermined period of time for an answer from the interrogated station.\nDuring this period the CIU makes no additional automatic interrogations. The\nWait-for-Answer T1 and Wait-for-Answer T2 parameters determine the\nactual length of time that the CIU waits before indicating that the remote\nstation being interrogated has failed. (See   of the CIU Operating\nInstructions Manual).\nMin. Time between TX (0-6.35 sec)\nMinimim time resolution is 0.05sec, default value 1 sec. This parameter\ndetermines the minimum interval between any two consecutive CIU\ntransmissions, if required (either by government regulations or by equipment\nrequirements).\nAuto-Ack Valid Time (0-63.5 sec)\nMinimim time resolution is 0.5sec, default value 20 sec. This parameter\ndetermines the maximum amount of time the CIU waits for a free\ncommunication channel before cancelling an automatic acknowledgment\nrequest.\nComputer Wait Time (0-63.5 sec)\nMinimim time resolution is 0.5sec, default value 60.0 sec. This parameter\ndetermines the maximum time the CIU devotes to transferring a message to\nthe computer or to receiving from the computer an acknowledgment that the\nmessage was received.\nPrinted"}, {"title": "ISOIL Email IMAP Client", "href": "drivers_html/ISOIL_Email_IMAP_Client.html", "category": "Drivers", "rel": "drivers_html/ISOIL_Email_IMAP_Client.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-ISOIL.docx\nP a g e | 3\n1.\nOverview ............................................................................................................................................. 4\n2.\nWiring ................................................................................................................................................. 5\n3.\nDevice Configuration .......................................................................................................................... 6\n3.1.\nDevice Configuration ....................................................................................................................... 6\n3.1.1.\nMail Server Settings (*Resource key) .......................................................................................................... 6\n3.1.2.\nIncoming Mailbox Configuration ................................................................................................................. 7\n3.1.3.\nBackup mailbox configuration .................................................................................................................... 7\n3.1.4.\nLocal Device Settings ................................................................................................................................ 8\n3.1.5.\nUnknown mailbox configuration ................................................................................................................. 8\n4.\nSupported Addresses .......................................................................................................................... 9\n4.1.1.\nML150 ..................................................................................................................................................... 9\n4.1.2.\nML250 option 1 ........................................................................................................................................ 9\n4.1.3.\nML250 option 2 ........................................................................................................................................ 9\n4.1.4.\nUniversal Addressing ................................................................................................................................ 10\n5.\nProtocol Definition and Considerations ............................................................................................ 11\n5.1.\nApplication Example ...................................................................................................................... 11\n6.\nGeneral Notes and Troubleshooting ................................................................................................. 12\n6.1.\nContact Details .............................................................................................................................. 12\n6.2.\n6.3.\nTroubleshooting ............................................................................................................................ 12\n7.\nRevisions ........................................................................................................................................... 13\n7.1.\nDocument Revision........................................................................................................................ 13\n7.2.\nDLL Revision ................................................................................................................................. 13\n\n[Page 4]\nATQMS-DRVR-DOC-ISOIL.docx\nP a g e | 4\n1. Overview\nThis driver is designed to provide an interface for ISOIL ISOMAG flow meters.\nThe data is sent in the form of an email containing a csv attachment.\nOnce the email is received it is decoded to expose the values contained in the attachment and body\nof the mail.\nInbox management is provided through a BACKUPBOX mailbox and an UNKNOWN/TODO box, where\nemail messages can be moved as appropriate.\nMessages older than a configured amount of days may be set for auto deletion.\nA separate Adroit device has to be created for each flow meter with the station ID being set equal\nto the serial number of the flow meter.\nThere is a resource ID allocated automatically on configuration, new devices will attempt to find a\ncompatible configuration (those that share an inbox for example) any others will create a new\nresource, selecting a resource in the dialogue will load the current configuration for that box, if the\ndevice is saved (on OK) any changes will be save with an appropriate warning. Resource ID can be\ndeleted with appropriate warnings if it might affect other devices.\nOffline devices and unknown (unconfigured) devices will have their emails moved to the UNKNOWN\nbox if the MOVE radio is applied. Else if DELETE was selected unconfigured emails will be deleted.\nAnd offline device emails will be left in the main INBOX. Once an offline device is restarted the\nUNKNOWN box will be checked once for any emails for that device(s). This will also be done at Agent\nServer startup.\n\n[Page 7]\nATQMS-DRVR-DOC-ISOIL.docx\nP a g e | 7\n*Server uses SSL – (Default = ON) Some POP and IMAP servers require SLL mode. IMAP servers\nlisten on port 143 typically, while 993 is used for SSL/TLS.\nPOP servers listen on port 110 typically, while 995 is used for SSL/TLS (no longer supported).\nPLEASE NOTE\nThe remaining parameters can be considered as sub-parameters (these will not result in a new\nresource being generated if different from any other resource) and if a change is requested on\nthese the whole resource will be updated, and thus affect all devices using that resource.\nLogin Password – User password.\nDetailed debugging to datascope – Additional processing information will be sent to the\ndatascope.\n3.1.2.\nIncoming Mailbox Configuration\nIncoming Mailbox – Incoming account inbox name. This is where all new emails should arrive\nfirst.\nPoll Period (ms) – Mailbox will be checked for new mail at this interval.\nMove used messages to BACKUP mailbox - If a mail is parsed and accepted and considered\ncomplete, checking this radio button will tell the driver to move that mail to the used or BACKUP\nmailbox, where further processing could take place such as remain there for x amount of days before\nbeing discarded (see further down).\nDelete used messages – If a mail is parsed and accepted and considered complete, checking this\nradio button will tell the driver to delete the mail immediately.\nMove unknown messages to UNKNOWN mailbox – If a mail is parsed and found to be junk,\nor for an offline device and NOT considered complete, checking this radio button will tell the driver\nto move that mail to the TODO or UNKNOWN mailbox, where further processing could take place\nsuch as remain there for x amount of days before being discarded (see further down).\nDelete unknown messages – If a mail is parsed and accepted and considered complete, checking\nthis radio button will tell the driver to delete the mail immediately.\n3.1.3.\nBackup mailbox configuration\nBackup Mailbox – Backup name – this is a sub or secondary mailbox where completed emails can\nbe stored for a period of time.\nDelete messages older than x days – Any email in this box older than this number of days will\nbe deleted during driver maintenance tasks.\n\n[Page 8]\nATQMS-DRVR-DOC-ISOIL.docx\nP a g e | 8\n3.1.4.\nLocal Device Settings\nPLEASE NOTE\nThese setting are stored per device and will not affect other devices using the same resource\nID.\nStation ID – This is the identifier code sent in the subject line of the email For example, data from\nML250 29902, the ID is then 29902.\nModel – Select the Model of the ISOMAG flowmeter. Currently two models are supported. The\nML150 and the ML250.\nThe ML155 and ML255 can be selected but these must run in compatibility mode.\nPressure Multiplier – Multiplier for the pressure values contained in the csv files\nDevice contains units – The ISOMAG can report data with unit fields.\n3.1.5.\nUnknown mailbox configuration\nUnknown Mailbox – Unknown name – this is a sub or secondary mailbox where emails not\nassociated with an Adroit Device can be stored for a period of time. Junk/spam and or unconfigured\nor offline devices will also go here.\nDelete messages older than x days – Any email in this box older than this number of days will\nbe deleted during driver maintenance tasks.\n\n[Page 11]\nATQMS-DRVR-DOC-ISOIL.docx\nP a g e | 11\n5. Protocol Definition and Considerations\n5.1.\nApplication Example\n1. You have a ML250 ISOMAG flow meter from which you need to extract the following data:\na. The positive volume counter\nb. The negative volume counter\nc. The Flow rate\nd. The Pressure\n2. You are also required to extract the units of these values from the csv file.\n3. In addition to this you need to determine the signal strength of the antenna.\nIn order to accomplish this you will need to create 5 Analog Agents and 4 String Agents.\nYou will scan the value of the positive volume counter (analog) from the “V1” address of the device.\nYou will scan the unit of the positive volume counter (string) from the “U1” address of the device.\nYou will scan the value of the negative volume counter (analog) from the “V2” address of the device.\nYou will scan the unit of the negative volume counter (string) from the “U2” address of the device.\nYou will scan the value of the flow rate (analog) from the “V3” address of the device.\nYou will scan the unit of the flow rate (string) from the “U3” address of the device.\nYou will scan the value of the pressure (analog) from the “V4” address of the device.\nYou will scan the unit of the pressure (string) from the “U4” address of the device.\nYou will scan the value of the antenna signal strength from the “V9” address of the device.\n\n[Page 12]\nATQMS-DRVR-DOC-ISOIL.docx\nP a g e | 12\n6. General Notes and Troubleshooting\n6.1.\nContact Details\nPhone: +27 11 658-8100\n6.2.\nFor additional information, please refer to our Knowledgebase website:\nLatest Drivers topics - Features, discussions, tips, tricks, questions, problems and feedback\n(adroittechnologiesautomation.com)\n6.3.\nTroubleshooting\n1. Ensure the connection settings to your mailbox is correct.\n2. Ensure the serial number of the ISOMAG flow meter matches the Station ID as set up in the\ndriver configuration.\n3. Ensure the emails do have attachments.\n4. Ensure that the data attachment is before the event attachment.\n5. Ensure that there is no invalid data in the body of the email, or in the attachment.\n6. Do not move emails between folders in excel. A Copy is required for the driver to operate to\nspecification."}, {"title": "Koyo Direct Logic DL105", "href": "drivers_html/Koyo_Direct_Logic_DL105.html", "category": "Drivers", "rel": "drivers_html/Koyo_Direct_Logic_DL105.html", "kind": "Driver", "text": "[Page 1]\nKoyo Direct Logic DL105 : KDL105KSKSKS\nKoyo Direct Logic KDL105KS Protocol driver\nOverview\nAdroit supports communications with the Koyo Direct Logic DL105 PLC Via the K-Sequence\nprotocol.\nPrinted\n\n[Page 2]\nKoyo Direct Logic DL105 : KDL105KSKSKS\nDevice configuration\nDL105 Details\nPLC Station ID:\nFixed at 1\nPort Details\nPort:\nThe available serial ports on your machine\nBaud Rate:\nThe speed of data transmission. Fixed at 9600\nParity:\nCheck bit. Fixed at Odd.\nStop Bits:\nUART signal bits. Fixed at 1.\nRetries: The number of times that Adroit will try to gain communication with a PLC before failing a\ntransaction.\nTimeout:\nThe time that Adroit will wait for a valid response from a PLC before failing\na transaction (Read or Write).\nPrinted\n\n[Page 3]\nKoyo Direct Logic DL105 : KDL105KSKSKS\nWiring\nThe diagram above shows the wiring for the comms cable between a PC serial port and the DL105\nCom 1 port.\nSupported addresses\nPrefix\nV2000\nWORD\nV4000\nWORD\nV7260\nWORD\nV7750\nWORD\n\n[Page 4]\nKoyo Direct Logic DL105 : KDL105KSKSKS\nSupported Data types are as follows:\nPLC Data Type\nBool\nInteger\nNB All addresses with the Koyo DL105 PLC are expressed in Octal.\nWhen reading or writing data to or from the DL105 the driver is actually always using 16 bit words.\nThe driver, depending on the prefix, will work out the type of data and get or put only the correct\ninformation. For example when a digital input “X” prefix is used it can be mapped to any Adroit data\ntype. The global equivalent for X0 is V40400. This is a word and X0 to X20 (The next 16 bits) are\nstored here. This can be read into any Adroit data type except BOOLEAN or any of its derivatives. The\nmost efficient way of reading or writing digitals is to use a multistate agent and read the global\nequivalent address.\nTroubleshooting\nDuring the installation of the driver the following files will be copied:\nKDL105KS.DLL\nThe driver itself.\nKDL105KS.PDF\nThe driver help file.\nKDL105KS.WGP\nKDL105KS.MIM\nOnce the driver has been installed and setup, run the REG file, you may then set the Adroit database\nfile to the KDL205KS.WGP and start the agent server.\nWhen the agent server is ready, start the user interface and open the file KDL105KS.MIM. You will\nthen see a representation of a DL105 base with an input simulation module.\nIf all is installed correctly and the driver has successfully started, you will be able to see the inputs\nchange when the simulator module switches are changed and also will be able to change output states\nwhen the output lights are highlighted and clicked.\nThis is the first thing to run when first setting up the unit. It can also be used as a training aid to see\nhow the unit works.\nRevision Information\nDate\nAdroit Technologies takes over driver from Alex Griffiths.\n14-Aug-03\nPDF format document distribution from now on\nPrinted"}, {"title": "Koyo Direct Logic DL205", "href": "drivers_html/Koyo_Direct_Logic_DL205.html", "category": "Drivers", "rel": "drivers_html/Koyo_Direct_Logic_DL205.html", "kind": "Driver", "text": "[Page 1]\nKoyo Direct Logic DL205 : KDL205KS\nKoyo Direct Logic KDL205KS Protocol driver\nOverview\nAdroit supports communications with the Koyo Direct Logic DL205 PLC. Via the K-Sequence\nProtocol. This driver is property Adroit Technologies.\nDevice configuration\nDL205 Details\nThe CPU Model currently installed in the base. 230, 240 or 250.\nPLC Station ID:\nThe ID number of the PLC on the PLC network.\nFixed at 1 on Port 1 of the 230 & 240 CPU.\n1 – 90 on Port 1 of the 250\n1 – 90 on Port 2 of the 240 & 250.\nPrinted\n\n[Page 2]\nKoyo Direct Logic DL205 : KDL205KS\nPort Details\nPort:\nThe available serial ports on your machine\nBaud Rate:\nThe speed of data transmission for the PLC\nFixed at 9600 on Port 1 of the 230, 240 & 250.\nUp to 19200 on Port 2 of the 240\nUp to 38400 on Port 2 of the 250\nParity:\nCheck bit. Fixed at Odd.\nStop Bits:\nUART signal bits. Fixed at 1.\nRetries:\nThe number of times that Adroit will try to gain communication with\na PLC before failing a transaction.\nTimeout:\nThe time that Adroit will wait for a valid response from a PLC before\nfailing a transaction (Read or Write).\nWiring\nThe diagram above shows the wiring for the comms cable between a PC serial port and the 230, 240 & 250\nCPU port 1 and the 240’s Port 2.\nFor information on the use of port 2 of the 250 please refer to the DL205 User Manual 2nd Edition.\nSupported addresses 230 CPU\nPrefix\nStart\nV2000\nWORD\nV4000\nWORD\nV7260\nWORD\nV7750\nWORD\n\n[Page 3]\nKoyo Direct Logic DL205 : KDL205KS\nC\nV40600\nSupported addresses 240 CPU\nPrefix\nStart\nV2000\nWORD\nV4000\nWORD\nV7260\nWORD\nV7746\nWORD\nSupported addresses 250 CPU\nPrefix\nStart\nV10000\nWORD\nV7400\nWORD\n\n[Page 4]\nKoyo Direct Logic DL205 : KDL205KS\nSupported Data types are as follows:\nPLC Data Type\nBool\nInteger\nNB All addresses with the Koyo DL205 PLC are expressed in Octal.\nWhen reading or writing data to or from the DL205 the driver is actually always using 16 bit words. The\ndriver, depending on the prefix, will work out the type of data and get or put only the correct information.\nFor example when a digital input “X” prefix is used it can be mapped to any Adroit data type. The global\nequivalent for X0 is V40400. This is a word and X0 to X20 (The next 16 bits) are stored here. This can be\nread into any Adroit data type except BOOLEAN or any of its derivatives. The most efficient way of\nreading or writing digitals is to use a multistate agent and read the global equivalent address.\nTroubleshooting\nDuring the installation of the driver the following files will be copied:\nKDL205KS.DLL\nThe driver itself.\nKDL205KS.PDF\nThe driver help file.\nKDL205KS.WGP\nKDL205KS.MIM\nOnce the driver has been installed and setup, run the REG file, you may then set the Adroit database file to\nthe KDL205KS.WGP and start the agent server.\nWhen the agent server is ready, start the user interface and open the file KDL205KS.MIM. You will then\nsee a representation of a DL205 base unit with a 240 CPU, an input simulation module and an output\nmodule.\nThe database will work with the 230 and 250 as well.\nIf all is installed correctly and the driver has successfully started, you will be able to see the inputs change\nwhen the simulator module switches are changed and also will be able to change output states when the\noutput lights are highlighted and clicked.\nThis is the first thing to run when first setting up the unit. It can also be used as a training aid to see how the\nunit works.\nPrinted\n\n[Page 5]\nKoyo Direct Logic DL205 : KDL205KS\nRevision Information\nDate\nAdroit Technologies takes over driver from Alex Griffiths.\n14-Aug-03\nPDF format document distribution from now on\nPrinted"}, {"title": "Koyo Direct Logic DL405", "href": "drivers_html/Koyo_Direct_Logic_DL405.html", "category": "Drivers", "rel": "drivers_html/Koyo_Direct_Logic_DL405.html", "kind": "Driver", "text": "[Page 1]\nKoyo Direct Logic DL405 : KDL405KS\nKoyo Direct Logic KDL405KS Protocol driver\nOverview\nAdroit supports communications with the Koyo Direct Logic DL405 PLC.Via the K-Sequence\nProtocol.\nPrinted\n\n[Page 2]\nKoyo Direct Logic DL405 : KDL405KS\nDevice Configuration\nDL405 Details\nThe CPU Model currently installed in the base. 430, 440 or 450.\nPLC Station ID:\nThe ID number of the PLC on the PLC network.\nPort Details\nPort:\nThe available serial ports on your machine\nBaud Rate:\nThe speed of data transmission for the PLC\nUp to 38400.\nParity:\nCheck bit. None/Odd/Even. Default Odd.\nStop Bits:\nUART signal bits. One or Two. Default One.\nRetries: The number of times that Adroit will try to gain communication with a PLC before failing a\ntransaction.\nTimeout:\nThe time that Adroit will wait for a valid response from a PLC before failing\na transaction (Read or Write).\nPrinted\n\n[Page 3]\nKoyo Direct Logic DL405 : KDL405KS\nWiring\nThe diagram above shows the wiring for the comms cable between a PC serial port and the 450 CPU\nport 2.\nFor information on the use of other ports on the CPU’s please refer to the DL405 User Manual 3rd\nEdition.\nPrinted\n\n[Page 4]\nKoyo Direct Logic DL405 : KDL405KS\nSupported addresses 430 CPU\nPrefix\nStart\nV1400\nWORD\nV7400\nWORD\nSupported addresses 440 CPU\nPrefix\nStart\nV1400\nWORD\nV10000\nWORD\nV700\nWORD\nV7400\nWORD\n\n[Page 5]\nKoyo Direct Logic DL405 : KDL405KS\nSupported addresses 450 CPU\nPrefix\nStart\nV1400\nWORD\nV10000\nWORD\nV700\nWORD\nV7400\nWORD\nSupported Adroit Data types are as follows:\nPLC Data Type\nBool\nInteger\n\n[Page 6]\nKoyo Direct Logic DL405 : KDL405KS\nTroubleshooting\nNB All addresses with the Koyo DL405 PLC are expressed in Octal.\nWhen reading or writing data to or from the DL405 the driver is actually always using 16 bit words.\nThe driver, depending on the prefix, will work out the type of data and get or put only the correct\ninformation. For example when a digital input “X” prefix is used it can be mapped to any Adroit data\ntype. The global equivalent for X0 is V40400. This is a word and X0 to X20 (The next 16 bits) are\nstored here. This can be read into any Adroit data type except BOOLEAN or any of its derivatives. The\nmost efficient way of reading or writing digitals is to use a multistate agent and read the global\nequivalent address.\nDuring the installation of the driver the following files will be copied:\nKDL405KS.DLL\nThe driver itself.\nKDL405KS.PDF\nThe driver help file.\nKDL405KS.WGP\nKDL405KS.MIM\nOnce the driver has been installed and setup, run the REG file, you may then set the Adroit database\nfile to the KDL205KS.WGP and start the agent server.\nWhen the agent server is ready, start the user interface and open the file KDL405KS.MIM. You will\nthen see a representation of a DL405 base unit with a 450 CPU, an input simulation module and an\noutput module.\nThe database will work with the 430 and 440 as well.\nIf all is installed correctly and the driver has successfully started, you will be able to see the inputs\nchange when the simulator module switches are changed and also will be able to change output states\nwhen the output lights are highlighted and clicked.\nThis is the first thing to run when first setting up the unit. It can also be used as a training aid to see\nhow the unit works.\nRevision Information\nDate\nAdroit Technologies takes over driver from Alex Griffiths.\n14-Aug-03\nPDF format document distribution from now on\nPrinted"}, {"title": "Lovato RGAM Serial", "href": "drivers_html/Lovato_RGAM_Serial.html", "category": "Drivers", "rel": "drivers_html/Lovato_RGAM_Serial.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-LOVRGAM.docx\nP a g e | 3\n1.\nOverview ............................................................................................................................................. 4\n2.\nWiring ................................................................................................................................................. 5\n3.\nDevice Configuration .......................................................................................................................... 6\n3.1.\nDevice Configuration ....................................................................................................................... 6\n3.1.1.\nConfiguration Selection [not implemented] .................................................................................................. 6\n3.1.2.\nPort Setup ................................................................................................................................................ 6\n3.1.3.\nDevice Details ........................................................................................................................................... 7\n3.1.4.\nIP Settings ............................................................................................................................................... 7\n3.1.5.\nAdvanced Settings .................................................................................................................................... 7\n4.\nSupported Addresses .......................................................................................................................... 8\n5.\nProtocol Definition and Considerations .............................................................................................. 9\n5.1.\nLovato RGAM Message Structure ...................................................................................................... 9\n5.2.\nGeneral Status Request ................................................................................................................. 10\n5.3.\nError Status Request ..................................................................................................................... 10\n5.4.\nMains voltage (3-phase) Request ................................................................................................... 11\n5.5.\nGenerator Voltage Value Request ................................................................................................... 11\n5.6.\nGenerator Frequency Request ........................................................................................................ 11\n5.7.\nBattery Voltage Request ................................................................................................................ 11\n5.8.\nEngine Total Working Time (minutes) ............................................................................................. 11\n5.9.\nTime-to-Maintenance Request (minutes) ........................................................................................ 11\n5.10.\nBattery Charger Alternator Voltage ................................................................................................. 11\n5.11.\nDigital Input / Output Status .......................................................................................................... 11\n5.12.\nControl Bits ................................................................................................................................... 12\n6.\nGeneral Notes and Troubleshooting ................................................................................................. 13\n6.1.\nContact Details .............................................................................................................................. 13\n6.2.\n7.\nRevisions ........................................................................................................................................... 13\n7.1.\nDocument Revision........................................................................................................................ 13\n7.2.\nDLL Revision ................................................................................................................................. 13\n\n[Page 4]\nATQMS-DRVR-DOC-LOVRGAM.docx\nP a g e | 4\n1. Overview\nThis document describes the setup of, and the communication protocol implemented in the Adroit\nprotocol driver with the Lovato RGAM.\n\n[Page 6]\nATQMS-DRVR-DOC-LOVRGAM.docx\nP a g e | 6\n3. Device Configuration\n3.1.\nDevice Configuration\n3.1.1. Configuration Selection [not implemented]\nEnable Secondary – (not available) Enables secondary configuration for dual redundant\nControllers. This setting is disabled for this driver.\nPrimary/Secondary – Select the primary or secondary button depending on which connection you\nwish to configure.\n3.1.2. Port Setup\nPort – Select the serial port to use for communications.\nParity – Select even or uneven parity in a single serial transmission message.\nDataBits – Select the number of data-bits per packet.\nStopBits – Select the number of stop-bits per packet.\nBaud Rate – The transmission rate of data (including start and stop bits). The default baud rate for\nan RGAM unit is 9600.\nRetry – The number of times to retry a transaction before a comms-failure is reported.\nTimeout – The number of milliseconds to wait between communication-retries.\n\n[Page 7]\nATQMS-DRVR-DOC-LOVRGAM.docx\nP a g e | 7\n3.1.3. Device Details\nRGAM Station Address – Supply the unit address of the RGAM device to communicate with.\n3.1.4. IP Settings\nIf an Ethernet gateway is used to provide an encapsulated Serial interface to the controller, the\nfollowing settings is used to configure the connection:\nUse TCP/IP encapsulation – Ticking this box switches the driver from communicating using a\nCOM Port to using a TCP/IP Socket.\nTCP Port – The TCP Port on which the driver should try to connect to the controller.\nIP Address – The IP Address that will be used for communicating with the controller.\n3.1.5. Advanced Settings\nThis checkbox is available so that during setup the values being sent to and read from the device\nare displayed. The breakdown of what is sent back to Adroit is displayed and any errors that occur\nduring transmission are displayed.\nDisplay advanced debug in datascope – Displays extra information for debugging purposes\nduring setup.\n\n[Page 8]\nATQMS-DRVR-DOC-LOVRGAM.docx\nP a g e | 8\n4. Supported Addresses\nThe Lovato RGAM Adroit serial driver supports the following read-only data address types:\nOp-code\nDescription\nGeneral status request\nST 1\nST 12\nError status request\nER 1\nER 21\nMains voltage value (3-phase) request\nMV 1\nMV 3\nGenerator voltage value request\nGV 1\nInteger\nGenerator frequency request\nFR 1\nInteger\nBattery voltage request\nBV 1\nReal\nEngine total working time request\n(minutes)\nHR 1\nBattery charger alternator voltage\nrequest\nAV 1\nDigital input / output status request\nIO 1\nIO 15\nIO 1\nInteger\nCW\nControl Bits for simulation of the\nbuttons on the controller\nCW 1\nCW 11\n\n[Page 9]\nATQMS-DRVR-DOC-LOVRGAM.docx\nP a g e | 9\n5. Protocol Definition and Considerations\n5.1.\nLovato RGAM Message Structure\nMessage\nstart\nMessage start:\nThe opening bracket character (0x28) indicates the start of a new message.\nRGAM Station Address:\nThis two-digit number indicates the address of the RGAM to which the message has to be sent.\nOp-code:\nThe op-code identifies the type of information that is requested by the user. This could be any one\nof the opcodes described in the previous section (Supported addresses).\nOperator:\nThe operator indicates the type of message to send (Read or Write message). The Adroit Lovato\nRGAM serial driver only supports ‘Read’ messages; thus, the operator will always be a question mark\nData:\nThe data that the user wants to write to the unit. Because this driver doesn’t support write\nfunctionality, the data portion will always be omitted.\nStart checksum:\nThe ampersand character (‘&’) indicates the start of the message checksum.\nChecksum:\nThe checksum is two characters wide and is the lowest significant byte of the algebraic sum of the\nsingle bytes that are transmitted, starting from the RGAM station address to the last data byte.\nMessage stop:\nThe closing bracket (‘)’) indicates the end of the message.\nCarriage-return-linefeed:\nThe carriage-return and linefeed characters are appended to the end of each message."}, {"title": "Lovato RGK Serial", "href": "drivers_html/Lovato_RGK_Serial.html", "category": "Drivers", "rel": "drivers_html/Lovato_RGK_Serial.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-LOVRGK.docx\nP a g e | 3\n1.\nOverview ................................................................................................................................................. 4\n2.\nWiring ..................................................................................................................................................... 5\n3.\nDevice Configuration .............................................................................................................................. 6\n3.1.\nConfiguration Selection (not available) ................................................................................................... 6\n3.2.\nDevice Details ...................................................................................................................................... 6\n3.3.\nPort Setup ........................................................................................................................................... 6\n3.4.\nIP Settings ........................................................................................................................................... 7\n3.4.1.\nAdvanced ....................................................................................................................................................... 7\n4.\nSupported Addresses .............................................................................................................................. 8\n5.\nProtocol Definition and Considerations .................................................................................................. 9\n5.1.\nLovato RGK60 Message Structure .......................................................................................................... 9\n5.2.\nGeneral Status Request ...................................................................................................................... 10\n5.3.\nError Status Request .......................................................................................................................... 10\n5.4.\nMains voltage (3-phase) Request ........................................................................................................ 11\n5.5.\nGenerator Voltage Value Request ........................................................................................................ 12\n5.6.\nMains and Generator Frequency Request ............................................................................................. 12\n5.7.\nLoad Current Request ......................................................................................................................... 12\n5.8.\nMains Active Power Request ............................................................................................................... 12\n5.9.\nMains Reactive Power Request ............................................................................................................ 12\n5.10.\nMains Apparent Power Request ........................................................................................................... 12\n5.11.\nMains Power Factor Request ............................................................................................................... 13\n5.12.\nGenset active Power Request .............................................................................................................. 13\n5.13.\nGenset Reactive Power Request .......................................................................................................... 13\n5.14.\nGenset Apparent Power Request ......................................................................................................... 13\n5.15.\nGenset Power Factor Request ............................................................................................................. 14\n5.16.\nEnergy Meter Request ........................................................................................................................ 14\n5.17.\nBattery Voltage Request ..................................................................................................................... 14\n5.18.\nEngine Total Working Time (hours) ..................................................................................................... 14\n5.19.\nTime-to-Maintenance Request (minutes) ............................................................................................. 14\n5.20.\nBattery Charger Alternator Voltage ...................................................................................................... 14\n5.21.\nSensor Value Request ......................................................................................................................... 14\n5.22.\nEngine Speed (RPM) Request .............................................................................................................. 15\n5.23.\nCrank Number Request ....................................................................................................................... 15\n5.24.\nFront Panel Status .............................................................................................................................. 15\n5.25.\nDigital Input / Output Status ............................................................................................................... 16\n5.26.\nControl Bits ........................................................................................................................................ 17\n6.\nGeneral Notes and Troubleshooting ..................................................................................................... 18\n6.1.\nContact Details ................................................................................................................................... 18\n6.2.\n7.\nRevisions ............................................................................................................................................... 18\n7.1.\nDocument Revision............................................................................................................................. 18\n7.2.\nDLL Revision ...................................................................................................................................... 18\n\n[Page 4]\nATQMS-DRVR-DOC-LOVRGK.docx\nP a g e | 4\n1. Overview\nThis document describes the communication protocol details and configuration implemented in the\nAdroit protocol driver, with the following logic units: Lovato RGK60, RGK800.\n\n[Page 6]\nATQMS-DRVR-DOC-LOVRGK.docx\nP a g e | 6\n3. Device Configuration\n3.1.\nConfiguration Selection (not available)\nEnable Secondary – [Not implemented] Enables secondary configuration for dual redundant\nControllers. This setting is disabled for this driver.\nPrimary / Secondary – [Not implemented] Select the primary or secondary button depending on\nwhich connection you wish to configure.\n3.2.\nDevice Details\nRGK60 Station Address – Supply the unit address of the RGK60 device to communicate with.\n3.3.\nPort Setup\nPLC Model – Select the PLC model (RGK60 or RGK800).\nPort – Select the serial port to use for communications.\nParity – Select even or uneven parity in a single serial transmission message.\nDataBits – Select the number of data-bits per packet.\nStopBits – Select the number of stop-bits per packet.\nBaud Rate – The transmission rate of data (including start and stop bits). The default baud rate\nfor an RGK60 unit is 9600.\nRetry – The number of times to retry a transaction before a communication failure is reported.\n\n[Page 7]\nATQMS-DRVR-DOC-LOVRGK.docx\nP a g e | 7\nTimeout – The number of milliseconds to wait between communication retries.\n3.4.\nIP Settings\nIf an Ethernet gateway is used to provide an encapsulated Serial interface to the controller, the\nfollowing settings are used to configure the connection:\nUse TCP/IP encapsulation – Ticking this box switches the driver from communicating using a\nCOM Port to using a TCP/IP Socket.\nTCP Port – The TCP Port on which the driver should try to connect to the controller.\nIP Address – The IP Address that will be used for communicating with the controller.\n3.4.1.\nAdvanced\nClose port of device stop – If this check box is checked, when all logical devices sharing the same\nport have been stopped, the driver will release the COM port or IP port.\n\n[Page 8]\nATQMS-DRVR-DOC-LOVRGK.docx\nP a g e | 8\n4. Supported Addresses\nThe Lovato RGK60 Adroit serial driver supports the following data address types:\nOp-code\nDescription\nGeneral status request\n1.1\n1.12\nGeneral status request\nST 1\nInteger\nError status request\n1.1\n4.5\nError status request\nER 1\nER 4\nMains voltage value (3-phase) request\nMV 1\nMV 6\nGenset voltage value (3-phase) request\nGV 1\nGV 6\nMains & Genset frequency request\nSF 1\nSF 2\nLoad current (3-phase) request\nLC 1\nLC 3\nMains total active power (3-phase) request\nMP 1\nMP 3\nMains total reactive power (3-phase) request\nMR 1\nMR 3\nMains total apparent power (3-phase) request\nMA 1\nMA 3\nMains power factor (3-phase) request\nGF 1\nGF 3\nGenset total active power (3-phase) request\nGP 1\nGP 3\nGenset reactive power (3-phase) request\nGR 1\nGR 3\nGenset apparent power (3-phase) request\nGA 1\nGA 3\nGenset power factor (3-phase) request\nGF 1\nGF 3\nMains & genset energy meter\nEV 1\nEV 4\nBattery voltage request\nBV 1\nReal\nEngine total working time request\nHR 1\nHR 3\nTime-to-maintenance request (minutes)\nMN 1\nInteger\nBattery charger alternator voltage request\nAV 1\nReal\nSensors value (pressure, temperature and\nfuel) request\nSV 1\nEngine speed request (RPM)\nWV 1\nWV 3\nCrank number request\nNS 1\nNS 2\nFront panel status\n1.1\n1.10\nFront panel status\nPS 1\nInteger\nDigital input / output status request\n1.1\n4.1\nDigital input / output status request\nIS 1\nIS 4\nControl Bits for simulation of the buttons on\nthe controller\n1.1\n\n[Page 9]\nATQMS-DRVR-DOC-LOVRGK.docx\nP a g e | 9\n5. Protocol Definition and Considerations\n5.1.\nLovato RGK60 Message Structure\nMessage\nstart\nMessage start:\nThe opening bracket character (0x28) indicates the start of a new message.\nRGK60 Station Address:\nThis two-digit number indicates the address of the RGK 60 device to which the message will to be\nsent.\nOp-code:\nThe op-code identifies the type of information that is requested by the user. This could be any one\nof the op-codes described in the previous section (‘Supported addresses’).\nOperator:\nThe operator indicates the type of message to send (Read or Write message). The Adroit Lovato\nRGK60 serial driver only supports ‘Read’ messages, thus the operator will always be a question mark\nData:\nThe data that the user wants to write to the unit. Because this driver does not support write\nfunctionality, the data portion will always be omitted.\nStart checksum:\nThe ampersand character (‘&’) indicates the start of the message checksum.\nChecksum:\nThe checksum is two characters wide and is the lowest significant byte of the algebraic sum of the\nsingle bytes that are transmitted, starting from the RGK60 station address to the last data byte.\nMessage stop:\nThe closing bracket (‘ )’ ) indicates the end of the message.\nCarriage-return-linefeed:\nThe carriage-return and linefeed characters are appended to the end of each message."}, {"title": "LT350-Belt Scale", "href": "drivers_html/LT350-Belt_Scale.html", "category": "Drivers", "rel": "drivers_html/LT350-Belt_Scale.html", "kind": "Driver", "text": "[Page 3]\nLT350-BS BELT SCALE SYSTEM COMPONENTS...................................................................................................... 5\nLT350-BSI BELT SCALE SPECIFICATION.................................................................................................................. 6\nGENERAL CALIBTRATION SETUP REFERENCE....................................................................................................... 7\nLT350-BSI BELT SCALE INTEGRATOR - WALL MOUNT NEMA4X...................................................................... 9\nLT350-BSI BELT SCALE INTEGRATOR - PANEL MOUNT STAINLESS STEEL ................................................ 10\nLT350 KEYBOARD FUNCTIONS ................................................................................................................................... 11\nSCALE DISPLAY INDICATORS ..................................................................................................................................... 12\nLT350 HARDWARE INTERFACE DIAGRAM............................................................................................................... 13\nLT350-BSI-1 SINGLE CHANNEL BELT SCALE CONFIGURATION OPTIONS.................................................... 14\nLT350-BSI-1 BELT SCALE - SENSE LINES ............................................................................................................... 15\nLT45 – BS SCALE CARRIAGE ASSEMBLY................................................................................................................ 16\nHOW TO INSTALL THE WEIGH IDLER...................................................................................................................... 17\nLT45 – BS SCALE CARRIAGE ASSEMBLY................................................................................................................ 18\nHOW TO INSTALL AND CONNECT A SUMMING BOX ........................................................................................... 19\nLT45-SS SCALE SPEED SENSOR ASSEMBLY........................................................................................................ 20\nHOW TO WIRE THE LT45-SS ......................................................................................................................................... 21\nHOW TO NAVIGATE THE INTEGRATOR MENU FUNCTIONS ............................................................................ 22\nHOW TO USE THE DATA LOG FUNCTION................................................................................................................ 23\nHOW TO PRINT DATA LOG REPORTS ...................................................................................................................... 24\nHOW TO DO A STATIC CALIBRATION OF A BELT SCALE ................................................................................... 25\nLT350-BSI-1 HOW TO PERFORM LOAD CELL ADJUSTMENTS........................................................................... 26\nHOW TO TRIM A SUMMING BOX.................................................................................................................................. 27\nHOW TO SET INTEGRATOR PARAMETERS ........................................................................................................... 28\nHOW TO CALIBRATE THE SPEED SENSOR ............................................................................................................. 29\nHOW TO PERFORM A MATERIAL TEST CALIBRATION ........................................................................................ 30\nLT350-BS1 SCALE LOAD CELL DIAGNOSTICS ...................................................................................................... 31\nHOW TO CONFIGURE SET POINT PARAMETERS.................................................................................................. 32\nHOW TO WIRE THE SET POINT INTERFACE ........................................................................................................... 33\nHOW TO SETUP SERIAL RS232 TO TRANSMIT WEIGHT DATA .......................................................................... 34\nHOW TO SETUP USB TO TRANSMIT WEIGHT DATA ............................................................................................ 35\nHOW TO SETUP RS22/485 TO TRANSMIT WEIGHT DATA.................................................................................. 36\nHOW TO SETUP TCP/IP TO TRANSMIT WEIGHT DATA - I ................................................................................... 37\nHOW TO SETUP TCP/IP TO TRANSMIT WEIGHT DATA II.................................................................................... 38\nHOW TO SETUP TCP/IP WIFI TO TRANSMIT WEIGHT DATA............................................................................... 39\nUNIT CONVERSION TABLE............................................................................................................................................ 46\n\n[Page 13]\nLT350 HARDWARE INTERFACE DIAGRAM\nPower supply input. The indicator accepts a dc voltage\nbetween[16-48]Volts. If PoE is used, do not connect power here.\nNominal power input should be 24Vdc @ 200mA\nThe controller supports three types of network configurations.\nEthernet, Wi-Fi or USB. The Ethernet option also supports PoE\n(power over Ethernet).\nThe sense line mode is a special 6 wire load cell configuration.\nThis configuration uses CH-1 as the sense lines and CH-2 as\nthe weigh idler load cell inputs. This configuration is typically\nused to improve signal quality over long cable hauls.\nCommand[93] should be used to enable sense line activation.\nThe indicator is a single scale multiple weigh idler load cell\nsystem that supports between [1-4] weigh idler channels using\ncommand[10]\nThe primary serial port can be configured as RS232 or RS422\nand supports printing or strings using the ASCII.NET protocol\nThe primary serial port can be configured as RS232 or RS422\nand supports printing or strings using the ASCII.NET protocol\n\n[Page 35]\nHOW TO SETUP USB TO TRANSMIT WEIGHT DATA\nThis setup assumes that a USB port is installed on the LT350. The USB cable can also be the power\nsource to power the LT350. The USB drivers are available on the accompanied CD to support Virtual\nCOM ports on MSWindows platforms. To transmit ASCII strings containing weight information on the\nUSB port of the LT350 do following:\nCOMMAND[46] – Submenu for USB speed and protocol setup\nUSB PARAMETERS\nData Rate:\nSupported baud rates: 4800, 9600, 14400, 28800, 38400, 57600 or 230400\nProtocol Mode:\nprotocol string format. The LT350 Belt scale data include speed, rate and\ntotal related data.\nString Mode:\nThis command dictates whether the string is transmitted automatically or\npolled via an ASCII command.\nWindows HyperTerminal can be used to capture serial data strings at the same baud rate\n\n[Page 36]\nHOW TO SETUP RS22/485 TO TRANSMIT WEIGHT DATA\nTo change between RS232 and RS485 mode, the user must first unplug the COM1 cable. This\nconfiguration allows for long distance transmission over 100 meters. Unplug serial port, change to\nRS485 and then do the correct wire setup as outlined below before re-connecting:\nCOMMAND[34] – Disconnect serial port connector and then set COM1 for RS485 mode. Port\nmay get damaged if a cable is left plugged in that is not an RS485 type.\nCOMMAND[35] – serial baud rate 600,1200,4800,9600,14400,38400,57600 or 230400\nCOMMAND[36] – parity None, Even or Odd\nCOMMAND[37] – protocol string format. The LT350 Belt scale data include speed, rate and\ntotal related data.\nCOMMAND[39] – This command dictates whether the string is transmitted automatically or\npolled via the ASCII command\nCOMMAND[52] – string update rate dictates the pause periods between successive string\ntransmissions where continuous transmission was selected. This is helpful to prevent buffer\noverruns on the host system.\nWindows HyperTerminal can be used to capture serial data strings at the same baud rate\nNOTE: A RS232 to RS422 converter is required for the computer\n\n[Page 37]\nHOW TO SETUP TCP/IP TO TRANSMIT WEIGHT DATA - I\nThis setup assumes that a TCP/IP network port is installed on the LT350. The CAT5 network cable can\nalso be the power source to power the LT350 – see PoE:\nCOMMAND[47] – Submenu for internet setup\nINTERNET NETWORK PARAMETERS\nIP address:\nSets the device IP address when DHCP is off. Factory default is\n[192.168.1.200]\nThis address needs to be obtained from the network administrator.\nSubnet Mask:\nSets the device subnet mask address when DHCP is off. Factory\ndefault is [255.255.255.000]\nThis address needs to be obtained from the network administrator.\nDefault\nGateway:\nSets the default gateway address. Factory default is\n[192.168.1.1]\nThis address needs to be obtained from the network administrator.\nDHCP Mode:\nIf a DHCP server is available on you network you can have an IP\naddress allocated by the server – try not to use DHCP where\npossible.\nYou should try to obtain an extended lease on the IP address from\nthe network administrator – typically a real life person.\nProtocol Mode:\nprotocol string format. The LT350 Belt scale data include speed, rate\nand total related data.\nString Poll\nMode:\nThis command dictates whether the string is transmitted automatically\nor polled via the ASCII command set.\nWireless SSID:\nYou should set this SSID to the same as your wireless router SSID.\nThe factory SSID is:[ Connect ]\nNode ID:\nThe node ID [1-100] will be set to the value displayed on the display\nscreen e.g. SCALE 100. If you use the discovery software tool to\nsearch for network enabled connected nodes on the internet, the\nnode ID will be used to identify your device. This is particularly\nimportant if you will be using DHCP.\nWindows HyperTerminal can be used by selecting WinSock to capture the data strings by specifying\nthe IP address at Port 502\n\n[Page 39]\nHOW TO SETUP TCP/IP WiFi TO TRANSMIT WEIGHT DATA\nTo setup a LT350 indicator using wireless WiFi802.11b, using a Ethernet wireless router or access\npoint, using COMMAND[47] Submenu for internet setup:\nGet a static IP address for your LT350 and enter it by selecting IP address in the sub menu in\nthe form of [196.168.200]\nGet the Network mask for the network you are connecting to – enter it at the sub menu, Network\nMask. Most networks use the default of [255.255.255.000]. This information is readily available\non any computer connected to the network – simply copy this information. This information is\nalso available in the network router setup pages.\nGet the Default Gateway information and enter it at the sub menu, Default Gateway. This\ninformation should be the same for any computer connected to the network or on the network\nrouter.\nSetup the SSID to be the same name as the access point or wireless router/switch.\nIt is best to first get the basics working before enabling advanced WiFi encryption. Once you can\ncommunicate with the LT350 across a network. Use the Web interface described below to setup\nencryption if you need it.\nAlternatively, temporarily change the SSID of the router to the factory default SSID of the\nLT350, which is [Connect]. You should now be able to find the indicator using the\nLTDISCOVER.EXE program on the CD. Also temporarily disable encryption on the router until you\nhave the basic communications working. Then use the Web interface to setup the network address\ninformation.\nThe network setup interface requires a login and password. The default login and password is as\nfollows: LOGIN = [root] and PASSWORD = [dbps]\nYou will then be directed to the TCP/IP address settings. Fill in the IP address, Network Mask,\nDefault Gateway, SSID and enable encryption if needed. The SSID should be the same as the\nwireless router/switch. Connect the antenna, with a clear line of sight and positioned away from\nmetal structures wherever possible.\nSave the settings and request the LT350 to reboot with new settings – may take up to 10\nseconds for reboot.\nThe green LED (furthest from the display) must f"}, {"title": "Mitsubishi A-Series C24 Serial", "href": "drivers_html/Mitsubishi_A-Series_C24_Serial.html", "category": "Drivers", "rel": "drivers_ht \nfailure.\n3.1.4.\nTest Device Config for Connectivity\nThis section is available to help users determine whether or not the settings they have entered are\nvalid and Adroit can communicate with your device.\nTest Address – An address in your device which will be polled when the “Read Address” button\nis clicked. The address entered must be valid.\nIO Type – The address type being read. i.e. Boolean, integer, real or string.\nRead Address – Click this button to poll your device with the current settings in your dialog.\nReply – When “Read Address” is clicked, Adroit will poll your device. The value returned from\nyour device will be displayed here.\n\n[Page 8]\nATQMS-DRVR-DOC-MITAJC24.docx\nP a g e | 8\n4. Supported Addresses\nMitsubishi A series PLC data (device) types supported in the Adroit Protocol Driver Product Version\n3.51 (Pvt. Build 2)\nDevice\nMin\nRange\nD\nInt 16\nD 1.2\nD 0 Sn\nBCD 16\nD 0 B\nD 0 B\nWord\nD 0 W\nD 0 W\nBCD 32\nD 0 C\nD 0 C\nLong\nD 0 L\nD 0 L\nReal 32\nD 0 R\nInt 16\nD 1.2\nD 0 Sn\nBCD 16\nD 0 B\nD 0 B\nWord\nD 0 W\nD 0 W\nBCD 32\nD 0 C\nD 0 C\nLong\nD 0 L\nD 0 L\nReal 32\nD 0 R\nLink Reg\nW\nW 0 Sn\nFile Reg\nR\nR 0 Sn\nBCD 16\nR 0 B\nR 0 B\nWord\nR 0 W\nR 0 W\nBCD 32\nR 0 C\nR 0 C\nLong\nR 0 L\nR 0 L\nReal 32\nR 0 R\nExt. File Reg\nE\n0:0\nE 1:0 Sn\n28:8191\nBCD 16\nE 1:0 B\nE 1:0 B\n28:8190\nBCD 32\nE 1:0 C\nE 1:0 C\n28:8190\nLong\nE 1:0 L\nE 1:0 L\n28:8190\nReal 32\nE 1:0 R\nTimer\nT\nT 0\nT 0\nCounter\nC\nC 0\nC 0\nInputs\nX\n0x7F0\nBCD 16\nX 0 B\nX 0 B\nOutputs\nY\nInternal Rel\nM/L/S\nBool\nL 0\nLink Relay\nB\n\n[Page 9]\nATQMS-DRVR-DOC-MITAJC24.docx\nP a g e | 9\n4.1.\nAJ71UC24 Module Settings\nSet the Mode switch to mode 1 for Protocol 1 on RS-232C.\nSet SW-11 to 24 as follows (settings for 19200, 8, 1, EVEN serial communications)\nSW 11\nOff\n1 Stop Bit\nSW 21\nOn\nSum Checking Set\nSW 22\nOn\nIgnored – Master\n4.2.\nA1SJ71C24-R2,\nSettings for 9600,8,1,N serial communications\nMode = 1\nCustom Set = On\nTransmission specification setting switches\nSW 3\nOff\nParity Not Set\nSW 10\nOff\nIgnored – Odd\nSW 11\nOff\n1 Stop Bit\nSW 12\nOn\nSum Checking Set\n4.3.\nA1SJ71C24-R4 Module Settings\nSettings for 9600,8,1,N serial communications\nMode = A – Protocol one for RS-232C/RS-422\nTransmission specification setting switches\nSW 1\nOn\nIgnored – Master\nSW 2\nOn\nParity Not Set\nSW 10\nOff\nIgnored – Odd\nSW 11\nOff\n1 Stop Bit\nSW 12\nOn\nSum Checking Set\nOR\n\n[Page 10]\nATQMS-DRVR-DOC-MITAJC24.docx\nP a g e | 10\nSettings for 9600, 7, 1, ODD serial communications\nMode = 5\nSW 8 - Off\nSW 9 - On\nAll other SW’s as above.\n4.4.\nA2CCPUC24 and A2CCPUC24 - PRF Module\nSettings\nSettings for 9600,8,1,N serial communications\nMode = 1 – Protocol one for RS-232C\nTransmission specification setting switches\nSW 11\nOn\nParity Not Set\nSW 16\nOff\nIgnored – Odd\nSW 17\nOff\n1 Stop Bit\nSW 18\nOn\nSum Checking Set\nSW 19\nOff\nPLEASE NOTE\nUse the module document to change the serial setting to suite your needs.\nRef:\nMitsubishi Electric Corporation Computer Link Module User Manual, Document Number\nSH (NA) 3511-A (9409) MEE"}, {"title": "Mitsubishi Ethernet (3E Frames)", "href": "drivers_html/Mitsubishi_Ethernet_3E_Frames.html", "category": "Drivers", "rel": "drivers_html/Mitsubishi_Ethernet_3E_Frames.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-D_MIT_ETH.docx\nP a g e | 3\n1.\nOverview ................................................................................................................................................. 4\n1.1.\nUpgrading from classical MITQJE71 Driver ............................................................................................. 4\n2.\nWiring ..................................................................................................................................................... 5\n3.\nDevice Configuration .............................................................................................................................. 6\n3.1.\nDevice Configuration ............................................................................................................................ 6\n3.1.1.\nError Handling ................................................................................................................................................ 7\n3.1.2.\nLatency .......................................................................................................................................................... 7\n3.1.3.\nEthernet......................................................................................................................................................... 7\nPLC Details ..................................................................................................................................................... 8\n3.1.5.\nTest ............................................................................................................................................................... 9\n3.1.6.\nDriver Send Watchdog .................................................................................................................................... 9\n3.1.7.\nValidation ....................................................................................................................................................... 9\n3.1.8.\nData Ranges for Selected PLC Model ................................................................................................................ 9\n4.\nSupported Addresses ............................................................................................................................ 10\n4.1.\nMitsubishi Q series (System Q) ............................................................................................................ 10\n4.2.\nMitsubishi QnA series PLC ................................................................................................................... 11\n4.3.\nMitsubishi L serie
