gramming This command will cause the partition to enter user code programming (*6) mode if the partition isn’t already busy. 073 1 Partition (1-8) Keep Alive Sending this command will reset the timer on the panel so it doesn’t timed out. Useful when working in zone bypass mode or user account mode. 074 1 Partition (1-8) Request Interior HVAC broadcast This command will force the Envisalink to issue TPI command 651, regardless of whether there is HVAC enabled. 80 0 Code Send This command is used whenever there is a need to send a code. The command, such as command output, will be sent to the module and the module will then send command 900 to tell the user to enter an access code. This command transfers this code. NOTE: The code entered will be sent to the partition that sent the 900 request. The TPI remembers which partition the code request came from when sending 200: Code Send. 200 4-6 Access Code (4-6) 3.3 TPI Commands Description Command # of Data Bytes Data Bytes Command Acknowledge A command has been received successfully 500 3 Previous CMD received Command Error A command has been received with a bad checksum 501 0 System Error An error has been detected. See section 5.4 for a list of error codes 502 3 000-255 (error code) Login Interaction Sent during session login only. 3 = Request for password, sent after socket setup 2 = Time out. You did not send a password within 10 seconds. 1 = Password Correct, session established 0 = Password provided was incorrect 505 1 0 = Fail 1 = Successful 2 = Timed_Out 3 = Password Request Keypad LED State – Partition 1 only Outputed when the TPI has detected a change of state in the Partition 1 keypad LEDs. Bit 7 – BACKLIGHT LED Bit 6 - FIRE LED Bit 5 - PROGRAM LED Bit 4 - TROUBLE LED Bit 3 - BYPASS LED Bit 2 - MEMORY LED Bit 1 - ARMED LED Bit 0 - READY LED 510 2 Byte (HEX) indicating LED state (ON/OFF). Keypad LED FLASH state – Partition 1 only Outputed when the TPI has detected a change of state in the Partition 1 keypad LEDs as to whether to flash or not. Overrides 510. That is, if 511 says the PROGRAM LED is flashing, then it doesn't matter what 510 says. Bit 7 – BACKLIGHT LED Bit 6 - FIRE LED Bit 5 - PROGRAM LED Bit 4 - TROUBLE LED Bit 3 - BYPASS LED Bit 2 - MEMORY LED Bit 1 - ARMED LED Bit 0 - READY LED 511 2 Byte (HEX) indicating LED state (ON/OFF). Time/Date Broadcast Outputs the current security system time. 550 10 HH:MM MM/DD/YY Ring Detected The Panel has detected a ring on the telephone line. Note: This command will only be issued if an ESCORT 5580xx module is present. 560 0 Indoor Temperature Broadcast If an ESCORT 5580TC is installed, and at least one ENERSTAT thermostat, this command displays the interior temperature and the thermostat number. For other thermostats you must request this command by using API command 080. NOTE: The three digit temperature is a decimal representation of a signed byte. (0 – 255) representing -127 to 127 degrees. MSB is sign bit. 561 4 Thermostat (1-4) Temperature (X"}, {"title": "gsm_sms", "href": "drivers_html/gsm_sms.html", "category": "Drivers", "rel": "drivers_html/gsm_sms.html", "kind": "Driver", "text": "Adroit Technologies Protocol Driver Name GSM SMS Serial DLL GSM_SMS _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-GSM_SMS.docx P a g e | 2 COPYRIGHT Copyright © 2022 Advanced Worx 112 (Pty) Ltd. All rights reserved. Information in this document is subject to change without notice. The software described in this document is furnished under a license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of those agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or any means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal use without the written permission of Advanced Worx 112 (Pty) Ltd. Advanced Worx 112 (Pty) Ltd 20 Waterford Office Park 189 Witkoppen Road (c/o Waterford Drive) Fourways South Africa https://adroittech.co.za/ _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-GSM_SMS.docx P a g e | 3 Contents 1. Overview ................................................................................................................................................. 4 2. Wiring ..................................................................................................................................................... 5 3. Device Configuration .............................................................................................................................. 6 3.1. Driver Installation and Setup ................................................................................................................. 6 3.1.1. Devices .......................................................................................................................................................... 6 3.1.2. Device Configuration Dialog ............................................................................................................................. 6 3.1.3. GSM_SMS Driver Details Settings ..................................................................................................................... 6 3.1.4. Using Cost Control .......................................................................................................................................... 7 3.1.5. Using a SIM PIN ............................................................................................................................................. 9 3.1.6. Unicode Languages ......................................................................................................................................... 9 4. Supported Addresses ............................................................................................................................ 10 5. Protocol Definition and Considerations ................................................................................................ 11 5.1. Using the Notify Agent with GSM_SMS Driver ....................................................................................... 11 5.1.1. Phase 1: Creating the Agents ......................................................................................................................... 11 5.1.2. Phase 2: Configuring Alarming ....................................................................................................................... 11 5.1.3. Phase 3: Alarming ......................................................................................................................................... 12 5.1.4. Phase 4: Scanning ........................................................................................................................................ 12 5.2. Configuring a Notify Agent .................................................................................................................. 12 5.3. Configuring a Notify Agent .................................................................................................................. 15 5.4. Message Limitations ........................................................................................................................... 15 5.5. Tag Greying/Tags marked bad ............................................................................................................ 15 5.6. Limitations ......................................................................................................................................... 16 5.7. Message Protocols .............................................................................................................................. 17 5.7.1. Start-up ....................................................................................................................................................... 17 5.7.2. General Poling for SMS’s ................................................................................................................................ 17 5.7.3. Sending a SMS ............................................................................................................................................. 18 5.7.4. Receiving a SMS from an Unknown Source ...................................................................................................... 18 6. General Notes and Troubleshooting ..................................................................................................... 19 6.1. Contact Details ................................................................................................................................... 19 6.2. Adroit Technologies Knowledge Base ................................................................................................... 19 6.3. Troubleshooting ................................................................................................................................. 19 7. Appendix A – Abbreviations .................................................................................................................. 20 8. Revisions ............................................................................................................................................... 20 8.1. Document Revision............................................................................................................................. 20 8.2. DLL Revision ...................................................................................................................................... 20 9. Appendix B - Unicode (Multi-byte) Languages (Send only) ................................................................. 22 _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-GSM_SMS.docx P a g e | 4 1. Overview The GSM_SMS protocol driver for Adroit using GSM modems. Messages configured in String or Notify Agents may be sent via SMS. Alarms that occur in Adroit can thus be routed to a person via SMS. The driver only handles the transmission of the intended message, which can originate as an alarm, a message entered by an operator or from programming done in Adroit. This driver is intended for easy use with any cellular SMS protocol. No Windows drivers for the modem are needed, this driver provides its own interface to the modem via the serial port assigned to it. All tests and designs were carried out using a ‘WAVECOM WMOD2’ model GSM Modem. PLEASE NOTE This driver does not currently support secondary ports. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-GSM_SMS.docx P a g e | 5 2. Wiring Standard depending on configuration. Can be utilised with RS-485, RS-232, Modem, or Ethernet. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-GSM_SMS.docx P a g e | 6 3. Device Configuration 3.1. Driver Installation and Setup Installation of the GSM_SMS protocol driver is done in the standard way in Adroit Setup. After installation of the driver, the user may then create and configure devices for the GSM_SMS driver. 3.1.1. Devices At a minimum, you must create at least one GSM_SMS device for each modem. A new device must be created per service provider. Currently, the port settings for all devices on a port must be identical. In other words, it is not permitted for example to use Vodacom and MTN together. 3.1.2. Device Configuration Dialog 3.1.3. GSM_SMS Driver Details Settings Port The communication port to which the modem/device is attached. Baud rate The speed of data transmission. Any Baud Rates may be specified from 110 to 256000. Retries Number of attempts to communicate. Timeout Number of milliseconds before a transaction will be deemed as timed out. This setting is a safety in case the remote device keeps giving the same error response. Use with Command Agent If checked, then the device will only work for Command Agent Tags. Mark all scanned tags good (healthy) on starting up By default all tags are scan-bad or grey on start-up, selecting this option will enable all the tags on start up. However, if the tags then fail to communicate after this, they will be displayed as scan-bad (grey). _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-GSM_SMS.docx P a g e | 7 Tags never grey out in a communication failure state This option prevents tags from being marked bad. WARNING: If this option is used, then your Device Agent will NEVER show that it is unhealthy, even if the GSM modem stops working. Suppress writes on startup for x minutes. Default:0 – normal operation, if > 0 on start-up will cause the driver to suppress and consume any SMS alarm sending until this period expires, only new alarms after this period will be sent as normal. Modem type Type of GSM modem used. Currently ONLY the \"Wavecom\" option is supported, which is the default selection. Theoretically other modems should work as the driver attempts to use the standard GSM Hayes command set. Message centre number This is the message centre number, which will overwrite the number in your SIM. Example: − MTN +27831000002 − Vodacom +27829119 − Cell-C +27841000000 PIN Number (optional) This is optional because it is not necessary to enable and use a SIM PIN. See below for the advantages and disadvantages of using a SIM PIN and how to configure this parameter in both cases. Delivery Report Separator This is the .CSV delimiter, defaulted to your locale setting. This may be changed as required. (default = comma) SMS Separator This setting is reserved for future use and is network provider dependent. However, the comma separator has worked on all the cell networks encountered so far. Incoming message polling interval (mSec) This setting affects the update rate of the signal strength parameter. It is recommended to use a minimum interval of 1000 milliseconds, since smaller values have no effect. Modem Specific Adjustments Some modems does not all support the standard AT+CSMP=17,1,0,0 command and thus allows the user to change it accordingly. Enable per month cost control This allows a user to cap the number of messages that can be sent in a month. WARNING: Use this at your own risk, any messages sent after the cap has been reached will be discarded and you will never receive them. Maximum messages per month The number of messages that can be sent in a month. Note the month starts from the 1st of the specific month. Enable burst protection cost control This allows a user to cap the number of messages that can be sent in a specific time period. For example, if your plant goes into an alarmed state, use this to prevent multiple SMS’s being sent which all refer to the same alarm. WARN"}, {"title": "GST Profibus driver", "href": "drivers_html/GST_Profibus_driver.html", "category": "Drivers", "rel": "drivers_html/GST_Profibus_driver.html", "kind": "Driver", "text": "RDC SYSTEMS : REPORTER 8102 Printed 17-Aug-20 1 RDC8102 driver Overview The RDC8102 protocol for Adroit communicates to a Reporter 8102, which is designed to receive transmitter codes in a control room or operate as a stand alone intelligent repeater. Product obtainable from Radio Data Communications (Tel 011 616 7685) The protocol is an exception based protocol driver in that data is received asynchronously when a value changes on an outstation. Wiring Wiring between the RS232 port and the modem is standard RS232. Please consult your REPORTER 8102 documentation for additional particulars on setting up the hardware. Driver Installation and Setup The driver is installed by picking the RDC8102 driver from the drivers directory. The RDC8102.DLL and the RDC8102.DOC is then copied into the agent directory. After installation of the driver, the user may then create and configure devices for the RDC8102 driver. Device Configuration Devices At a minimum, you must create at least one device for every port being used. However, you may choose to create a device for a group of transmitters. RDC SYSTEMS : REPORTER 8102 Printed 17-Aug-20 2 Device configuration dialog Port Select the port through which you are going to communicate. The baud rate is fixed at 9600,8,1,N. Prefix This field is only used when the protocol is configured to communicate in alpha prefix mode. In all other modes this field is ignored. Scanning Due to the system operation, all scanned tags must be output enabled, pulsed, and cold started to zero. The reasoning follows: The scanning sub-system keeps a record of the last received value for optimization, and thus will not re-send an alarm “on” until it goes “off” again. By output enabling the tag, when the tag goes to “zero” the scanning system updates it’s last known value with the zero (“off”), thus when the alarm on (“one”) condition arrives again, it gets put into the tag as expected. By the same reasoning, cold-start will initialize the tags to zero (“off”), so that all current alarms are clear. In addition, stopping and starting a device agent causes the driver to zero all scanned values, and the tags. The driver keeps a last known value for the alarms, which is cleared on device start, this last known value gets “OR”ed with an incoming alarm, thus giving the SUM of alarms received to the tag. Effectively this “copy” of the value allows the driver to keep track of the tags’ value. This function naturally only works correctly if the tag was output enabled, so that when bits in the tag clear (go off) the driver will also clear them at the same instant in time. Outstation Data The driver processes the following data received: 0 - Alarm 1 - Lock up 2 - Open up 3 - Emergency 4 - Telemetry 1 5 - Telemetry 2 6 - Telemetry 3 7 - Telemetry 4 8 - Mains Fail RDC SYSTEMS : REPORTER 8102 Printed 17-Aug-20 3 9 - Mains Restore 10 - Engineer Test 11 - Customer Duress 12 - Medical Alert 13 - Fire Alarm 14 - Telemetry 5 15 - Telemetry 8 Data received in any mode will be processed according to the above list. In Chubb mode only bits(0-7) will be activated. Digital inputs Digital tags (Boolean slots) that are scanned from Outstations can be scanned into Digital tags The format of the address string is as follows: CN: TTTT: B Where: CN – stands for code number. TTTT – Code number of transmitter B – Bit number (0 - 15) Analogue / Multistate inputs If scanned into a Multistate agent than the 16 slots represent the digital status of that transmitter. The format of the address string is as follows: CN: TTTT Where: CN – stands for code number. TTTT – Code number of transmitter When scanned into an integer, the value of the integer will represent the status of the outstation by a number ranging from 1 to 65535 with the value 0 representing no alarms. Message protocol Datascope messages are displayed in hex or ascii. All messages are displayed whether that transmitter is configured or not. Messages of devices not configured are displayed in the first devices protocol monitor. Reporter Standard Byte Number Code Number 1- 4 Telemetry 5 Repeater 6 CR 7 Example 1220 1 1 ^13 RDC SYSTEMS : REPORTER 8102 Printed 17-Aug-20 4 3 Digit Telemetry Byte Number Code Number 1- 4 Telemetry 5-7 Repeater 8 CR 9 Example 1220 012 1 ^13 Chubb Format Byte Number Code Number 1- 4 Space 5 Telemetry 6 CR 7 Example 1220 1 ^13 Protocol with alpha prefix – Any of the above three protocols with an alpha prefix. Thus this protocol will have 1 byte more than the above 3 protocols. For the data to be valid the prefix defined must match the prefix defined in the device. Troubleshooting Revisions Date Changes 91/02/2002 Dialog updated after neatening up. 24/02/2003 Described better output enable and cold-starting of the tags."}, {"title": "hitachie", "href": "drivers_html/hitachie.html", "category": "Drivers", "rel": "drivers_html/hitachie.html", "kind": "Driver", "text": "Adroit Technologies Protocol Driver Name Hitachi Ethernet TCP/IP DLL HITACHIE _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIE.docx P a g e | 2 COPYRIGHT Copyright © 2022 Advanced Worx 112 (Pty) Ltd. All rights reserved. Information in this document is subject to change without notice. The software described in this document is furnished under a license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of those agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or any means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal use without the written permission of Advanced Worx 112 (Pty) Ltd. Advanced Worx 112 (Pty) Ltd 20 Waterford Office Park 189 Witkoppen Road (c/o Waterford Drive) Fourways South Africa https://adroittech.co.za/ _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIE.docx P a g e | 3 Contents 1. Overview ............................................................................................................................................. 4 2. Wiring ................................................................................................................................................. 5 3. Device Configuration .......................................................................................................................... 6 3.1. Device Configuration ....................................................................................................................... 6 3.1.1. Config Selection [not implemented] ............................................................................................................ 6 3.1.2. PLC Details ............................................................................................................................................... 6 3.1.3. Connection Type ....................................................................................................................................... 6 3.1.4. Local Details ............................................................................................................................................. 7 4. Supported Addresses .......................................................................................................................... 8 5. Protocol Definition and Considerations .............................................................................................. 9 5.1. Hitachi Task Command Header Structure .......................................................................................... 9 5.2. Hitachi Continuous N points monitor (READ) function ........................................................................ 9 5.3. Hitachi Continuous N forced set/reset (WRITE) function .................................................................. 10 5.4. I/O Memory Area Codes ................................................................................................................ 11 6. General Notes and Troubleshooting ................................................................................................. 12 6.1. Contact Details .............................................................................................................................. 12 6.2. Adroit Technologies Knowledge Base .............................................................................................. 12 6.3. Troubleshooting ............................................................................................................................ 12 7. Revisions ........................................................................................................................................... 13 7.1. Document Revision........................................................................................................................ 13 7.2. DLL Revision ................................................................................................................................. 13 _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIE.docx P a g e | 4 1. Overview Adroit supports communication with the following Hitachi PLC CPU’s - EH150, H200, H250, H252A/B/C, H300, H302, H700, H702, H1002, H2000, H2002 and H4010 via a dedicated Ethernet module. The three Ethernet modules that have been tested against this driver are the EH ETH (EH150), HLAN (H200-H252C) and the LAN ETH2 (H300-H4010). _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIE.docx P a g e | 5 2. Wiring Standard Ethernet interconnection (10BASE T/E). _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIE.docx P a g e | 6 3. Device Configuration 3.1. Device Configuration 3.1.1. Config Selection [not implemented] Enable Secondary – (feature disabled) Enables secondary configuration for dual redundant or backup PLC’s. Primary / Secondary – (feature disabled) Select the primary or secondary button depending on which connection you wish to configure. 3.1.2. PLC Details The maximum amount of data per scan is shown here : Data type Max number of read elements Max number of write elements Words 120 words 100 words Bits 240 bits 200 bits PLC IP Address – The TCP/IP Address of the PLC. PLC Port – This is the TCP or UDP port, typically 3004 through 3007. 3.1.3. Connection Type Connection Type – Choose whether the protocol driver should implement the TCP or UDP protocol. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIE.docx P a g e | 7 Back Off Time – As of rev 10c of the driver, this backoff time is unused due to a strange anomaly found with multiple Hitachi PLC’s on an Ethernet network whereby the time taken to establish a connection to a PLC is dependent on the number of PLC’s on the network. Therefore, the “back off time” time has been replaced by a hardcoded timing/backoff mechanism for reconnecting to PLC’s. The hardcoded algorithm is dependent on the number of configured devices in groups of 10. The value is 10 seconds for the first 10 devices + 20 seconds for each multiple of 10 devices or part thereof thereafter. For example, 26 PLC's will take up to 50 (10+20+20) seconds to reconnect. The following timing table refers: No of PLC’s Time to establish connection 1-10 10 secs 11-20 30 secs 21-30 50 secs 31-40 60 secs The reconnection takes place on a background thread. 3.1.4. Local Details Retry – The number of times the driver must retry a Transmit/Receive transaction before returning an indication of failure. Timeout – The time in milliseconds to wait between each communication retry. Please read the Back Off Time description in this section. For the same reason, experience has shown that the timeout value used here needs to take into consideration the number of PLC’s on the network. No definitive relationship has been established, but it has been found in practice that a normal timeout value of 1 second which would normally work on a network of 10 PLC’s or less, will not work on a network of 11 PLC’s or more. It has been found that on a network of 21 to 30 PLC’s, a timeout value of 35 seconds was required. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIE.docx P a g e | 8 4. Supported Addresses Hitachi Ethernet PLC data address types supported by the Hitachi Ethernet Adroit Protocol driver. Please refer to the relevant Hitachi CPU manuals for ranges, and or check the driver address options prompt. Hitachi PLC data address types supported by the Hitachi Adroit Protocol driver: Device PLC Data Type Boolean Integer Real R Area Digital R0000 - - M Area Digital M0000 - - L Area Digital L0000 - - X Area Digital X0000 - - Y Area Digital Y0000 - - WR Area 16-bit WORD Reg - WR0000 WR0000 16-bit SHORT Reg - WR0000 I WR0000 I WM Area 16-bit WORD Reg - WM0000 WM0000 16-bit SHORT Reg - WM0000 I WM0000 I WX Area 16-bit WORD Reg - WX0000 WX0000 16-bit SHORT Reg - WX0000 I WX0000 I WY Area 16-bit WORD Reg - WY0000 WY0000 16-bit SHORT Reg - WY0000 I WY0000 I WL Area 16-bit WORD Reg - WL0000 WL0000 16-bit SHORT Reg - WL0000 I WL0000 I DR Area 32-bit DWORD Reg - WR0000 WR0000 32-bit LONG Reg - WR0000 L WR0000 L 32-bit FLOAT Reg - - DM0000 R DM Area 32-bit DWORD Reg - DM0000 DM0000 32-bit LONG Reg - DL0000 L DL0000 L 32-bit FLOAT Reg - - DL0000 R DL Area 32-bit DWORD Reg - DM0000 DM0000 32-bit LONG Reg - DL0000 L DL0000 L 32-bit FLOAT Reg - - DL0000 R PLEASE NOTE Write functionality to the X and WX area (Status register area) have been disabled, due to it being an input register. Floats are defined as IEEE-754. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIE.docx P a g e | 9 5. Protocol Definition and Considerations 5.1. Hitachi Task Command Header Structure Prefix structure for all Read/ Write task messages. Hitachi packet header: (The numbers are in hexadecimal unless otherwise noted) Start Code Sequence no. L U M P Task Code Task Code Parameters 00 12 FF FF 00 00 xx xx Start Code: The start code indicates that we are issuing a new command when it is set to 0x00. Sequence no: The sequence no. can be anything from 0x01 to 0xFF. This number will be the same in the reply packet. This would be used to distinguish the correct reply packet from numerous incoming packets on a busy network. LUMP Address: (H Series Network Address): L: Loop No. The loop no. for a CPU Link module installed. In case a CPU link module is not installed or a station to link is not accessed, this number is set to 0xFF. For this protocol driver, the number is always set to 0xFF. U: Unit No. Station no. of a CPU Link module installed. In case a CPU link module is not installed or a station to link is not accessed, this number is set to 0xFF. For this protocol driver, the number is always set to 0xFF. M: Module number. If set to 0x00, this number indicates a normal CPU module. It is always set to 0x00 in this protocol driver. An error in the communication will result in the response packet having a different module and/or port number, to indicate the origin of the error. This will result in a communications failure in the protocol driver, after which the sequence of port retry and the back off time will be implemented. P: Port number. If set to 0x00 indicates that it is a normal CPU module port. Task code and task code parameters: The specific task to be performed, along with its parameters, can be set here. The task code is 1 byte long (for ex. 0x0A). 5.2. Hitachi Continuous N points monitor (READ) function Command Format: Task Code I/O Code. I/O Address. No. of items to read A0 01 0007ff 01 Response Format: Execution status Task Code Monitor data 00 A0 Xxxx _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIE.docx P a g e | 10 Command Code Parameters: Task Code: 0xA0 is the task code reading data from the PLC. I/O Code: The I/O Code indicates the memory area to read from. All the available memory area codes are listed under the section ‘I/O memory area codes’ later in this document. I/O Address: The I/O Address is the memory address from where the reading of the specified number of items will commence. It is a 6-digit hexadecimal number (0x000000). No. of items to read: The number of items (bits, words or d"}, {"title": "hitachih", "href": "drivers_html/hitachih.html", "category": "Drivers", "rel": "drivers_html/hitachih.html", "kind": "Driver", "text": "Adroit Technologies Protocol Driver Name Hitachi H Series Serial DLL HITACHIH _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIH.docx P a g e | 2 COPYRIGHT Copyright © 2022 Advanced Worx 112 (Pty) Ltd. All rights reserved. Information in this document is subject to change without notice. The software described in this document is furnished under a license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of those agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or any means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal use without the written permission of Advanced Worx 112 (Pty) Ltd. Advanced Worx 112 (Pty) Ltd 20 Waterford Office Park 189 Witkoppen Road (c/o Waterford Drive) Fourways South Africa https://adroittech.co.za/ _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIH.docx P a g e | 3 Contents 1. Overview ................................................................................................................................................. 4 2. Wiring ..................................................................................................................................................... 5 2.1.1. For Modems ................................................................................................................................................... 6 3. Device Configuration .............................................................................................................................. 7 3.1. Device Configuration ............................................................................................................................ 7 3.1.1. Port Selection ................................................................................................................................................. 7 3.1.2. Local port details ............................................................................................................................................ 7 3.1.3. PLC Details ..................................................................................................................................................... 8 3.1.4. Advanced ....................................................................................................................................................... 8 3.1.5. Defaults Button .............................................................................................................................................. 8 3.1.6. Use a Modem & Modem button ........................................................................................................................ 9 4. Supported Addresses ............................................................................................................................ 10 5. Protocol Definition and Considerations ................................................................................................ 11 5.1. Message Protocol ............................................................................................................................... 11 5.1.1. Analog or Digital Areas .................................................................................................................................. 11 6. General Notes and Troubleshooting ..................................................................................................... 12 6.1. Contact Details ................................................................................................................................... 12 6.2. Adroit Technologies Knowledge Base ................................................................................................... 12 6.3. Troubleshooting Notes ........................................................................................................................ 12 7. Appendix A – Abbreviations .................................................................................................................. 13 7.1. Abbreviations ..................................................................................................................................... 13 8. Revisions ............................................................................................................................................... 13 8.1. Document Revision............................................................................................................................. 13 8.2. DLL Revision ...................................................................................................................................... 13 _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIH.docx P a g e | 4 1. Overview Adroit supports communication with the following Hitachi H Series PLCs: EH150, H200, H250, H252/B/C, H300, H302, H700, H702, H1002, H2000, H2002 and H4010. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIH.docx P a g e | 5 2. Wiring Connecting to CPU port (15 pin) to PC (25 pin) [DTE <-> DTE] PLC 15 pin Designation PC 25 pin PC 9 pin 2 Tx RX 3 2 3 RX TX 2 3 4 RS (a) CTS 4 8 5 CS (b) RTS 5 7 6 RV1 DSR 6 6 CD 8 1 7 DR (c) DTR 20 4 8 PHL (d) 9,10 Sig. Ground Sig. Ground 7 5 11,12 5V Out NC 13 -12 Out NC 14 +12 Out NC (a) High when CPU is ready to receive (b) Must be high to allow CPU to send (may be fixed high) (c) Must be high when the host is ready (d) Set high to ignore dipswitch and select 19200 baud speed. Connecting to CPU port (15 pin) to MODEM (25 pin) [DTE<->DCE ~ DCE <-> DTE] PLC 15 pin Designation Modem 25 pin PC 9 pin 2 Tx Tx 2 3 3 RX Rx 3 2 4 RS (a) RTS 5 7 5 CS (b) CTS 4 8 6 RV1 DTR 20 4 CD 8 1 7 DR (c) DSR 6 6 8 PHL (d) 9,10 Sig. Ground Sig. Ground 7 5 11,12 5V Out NC 13 -12 Out NC 14 +12 Out NC _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIH.docx P a g e | 6 2.1.1. For Modems Connect PLC via the [DTE<->DCE] cable to the receiving Modem. Connect PC via a straight modem cable (usually ships with modem) to the Transmitting modem. Recommended US Robotics Modem config Setups: Configuring PC-side modem use Hyper-terminal: Start with “AT&F0” factory reset. “ATI4” displays current configuration. Alternatively, insert this string into device modem configuration for auto loading: “ATE0&B1&N10&C1&D2&R2” Save with “AT&W0”, “AT&W1”. &B1, &N10 forces it to connect at only 19200. Careful: to match your configuration, see your modem documents for specific details. &D2, &R2 forcing hang-ups, etc., during communications attachment. Configuring PLC-side modem use Hyper-terminal: “ATE0S0=1&B1&N10&C1&D0&H1&S1&R2” “&D0” forces modem to accept incoming connections without terminal ready (TR). “&H1”, “&S1”, “&R2” enables handshaking to the PLC. “S0=1” auto answer mode. “&B1”, “&N10” forces it to connect at only 19200 (Careful: make sure to match your device configuration.) _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIH.docx P a g e | 7 3. Device Configuration 3.1. Device Configuration 3.1.1. Port Selection Enable Secondary - (Default = unchecked) Enables secondary configuration for dual redundant devices via Primary and Secondary radio buttons. The secondary device will be connected to if Adroit fails to communicate with the Primary device. Do not enable if a secondary channel is not configured correctly. 3.1.2. Local port details Port - The available serial ports on your machine. An icon next to the port name indicates status, “ ” for example shows that the port is currently in use. This may mean your Agent Server is already running, or that another application or device is currently using the port. Baud rate - The speed of data transmission. Any of the following Baud Rates may be specified: 110, 300, 600, 1200, 2400, 4800, 9600, 19200 or 64800. Parity - The data parity used in the data transmission. This can be None, Odd or Even. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIH.docx P a g e | 8 Stop bits - Forms part of the serial communication setting. For example, 8 data bits, 1 or 2 Stop bits, no parity serial communication. Ensure that the Stop bit settings are the same on the local and remote machines. (Data bits are fixed to 7) Retry - The number of times that Adroit will try to gain communication with a PLC before failing a transaction. Timeout (ms) - The time that Adroit will wait for a valid response from a PLC before failing a transaction (Read or Write). Trans delay (ms) – (Default = 60) If non-zero CTS (Clear-to-send) flow control is enabled, and the driver uses this value as a “settle” time for the outgoing CTS signal whenever it is about to send any requests. 3.1.3. PLC Details PLC Type - Applicable Hitachi PLC types (as detailed above.) Use RS-422 Network – Uncheck/disable for point-to-point connection. Check/enable for RS-422 multi-dropped connection. PLC Station ID – (RS-422 only) station ID as set on PLC. Link Number – (Default = FF) Link # in hexadecimal. Unit Number – (Default = FF) Unit # in hexadecimal. Module Number – (Default = 00) Module version number. Port Number – (Default = 00) Port # in hexadecimal. Delay (TM) – (Default = 2) The TM (TW) delay in hexadecimal. 3.1.4. Advanced Use Occupy Task Codes – (Default = unchecked) This option will be set depending on CPU model selected. If it was automatically set for a CPU, this option will be disabled but “ON”. 3.1.5. Defaults Button Load Default values – Will reset all settings shown to what they were before this device was created. Specific CPUs only operate correctly with special parameter changes viz. H300, H302, H700 and H702 models require that the Trans delay parameter be adjusted to 60ms or more. (Rev 20c onwards of the driver does this). Models H200 H300 H307 H700 and H2000 require the Task codes option turned on. In this case, the driver does not allow the user to manipulate the setting either. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-HITACHIH.docx P a g e | 9 3.1.6. Use a Modem & Modem button Use Modem – (Default = unchecked). Will allow the user to configure a modem for dialup. Connection String – Runtime string to upload to the modem on every communication attach. You do not have to specify a save on this string as it is sent every time. Dial Number – Device Telephone number. For example: (011,555,1212) where ‘,’ is a pause. Connect Timeout – (Default = 60000ms ) Time delay to wait while trying to establish a connection before retrying. Inactivity Timeout – (Default = 60000ms) Time delay to hang-up after port goes silent. Phone Type – (Default = Tone) Tone or Pulse. Ignore Dial Tone – Select if you suspect voltage problems on the telephone line. PLEASE NOTE Modem dialup is supported for solicited communication only. If a second device is attached in the driver and its telephone number is identical the modem, it will not be hung up before an attempt at communications is made, which is great for clustered RTU’s connected to one modem. However, if the telephone number is different in any way (including pauses, etc.) then the modem will hang up if comms is requested to another device. _____________________________________________________________________________________________________________________ ATQMS-DRVR"}, {"title": "Intrac 2000 Exception-based", "href": "drivers_html/Intrac_2000_Exception-based.html", "category": "Drivers", "rel": "drivers_html/Intrac_2000_Exception-based.html", "kind": "Driver", "text": "INTRAC : INTRAC 2000 INTRAC 2000 driver Overview The INTRAC 2000 protocol for Adroit communicates to a INTRAC 2000 Central Interface Unit (CIU) via a serial rs232 port that receives data from remote outstations. The protocol allows both polling for data as well as receiving data on exception (i.e. data is received asynchronously when a value changes at an outstation). Protocol Manufacturer Motorola. Wiring No Intrac CIU (25 pin RS-232C male) Computer Interface (25 pin RS-232C female) 1 2 - Transmit 2 - Receive 2 3 – Receive 3 – Transmit 3 7 – Signal Ground 7 – Signal Ground Driver Installation and Setup The driver is installed by picking the INTRAC driver from the drivers directory. The INTRAC.DLL and the INTRAC.DOC are then copied into the Adroit directory. After installation of the driver, the user may then create and configure devices for the INTRAC driver. Printed 1 INTRAC : INTRAC 2000 Device Configuration Devices At a minimum, you must create at least one device for every port being used. However, you may choose to create a device for a group of transmitters. Device configuration dialog Port Select the port through which you are going to communicate. Baud Rate The baud can be selected. Other parameters are fixed at the standard rate of 7 data, 1 stop, and odd parity. Timeout This field gives the waiting time if not end of message is received once a start of message is received. It is recommended that this value be kept at 1000. Moxa Cluster Support Check this option when running on a MOXA virtual port in a cluster environment. It will allow to purge the port when in standby and in shadow mode, as the MOXA unit stops functioning in this mode. Data keeps filling the buffer seeing that the driver does not do any reading from the port and eventually becomes unresponsive! Hard Purge Does a call to the COM PORT to purge all the data on it. (Preferred Method) Soft Purge Continue to read data from the port and just discard it. Close serial port on fail With a transaction failure closes the port and re-opens it by default but for some virtual ports it becomes an issue so we allow not closing the port in this case. Printed 2 INTRAC : INTRAC 2000 Download & Driver Parameters These Download parameters are explained in the appendix. Driver Parameters Interrogate on Startup – All outstations are interrogated on agent server load. Hot Standby – The driver does not send any data to outstations but only receives data and updates its database. This parameter can be toggled by using system tag number 9. Delay Between AI’s – To slow AI’s down – not really required since driver only polls after a RI is received. Acknowledge Delay – An AA message is sent only after this specified delay , so that more than 1 group can be acknowledged at once. Printed 3 INTRAC : INTRAC 2000 Scanning System Tags is: SY: B Where: SY – System. B – Bit number (0 - 15) Boolean Support Only These bits represent the following: (Configure Pulsed Items – these bits must be configured as pulsed items as they indicate the condition on a raising edge) Bit 0 - 'BS' Radio channel busy. - Configure Pulsed Bit 1 - 'CB' Check back (indication only). - Configure Pulsed Bit 2 - 'OF' Overflow alarm. Any other message received will clear this bit. It is like a NAK NAK message - Configure Pulsed Bit 3 - 'RS' Request for restart for CIU. - Configure Pulsed Bit 4 - 'CM' Channel monitor received. - Configure Pulsed Bit 5 - 'TX' received after a control. Bit 6 - 'RI' request interrogation received. Bit 7 - The CIU is OFF LINE, no CK for 5 minutes. Bit 8 - Forced CIU download. - Configure Pulsed Bit 9 - Hot Standby Toggle. - Configure Pulsed Bit 10 - Force AI even if RI not received (RI outstanding reset)- Configure Pulsed Bit 11 - Force DW even if TX not received (TX outstanding reset)- Configure Pulsed Bit 12 – 15 - Unused Outstation Status Tags: OS: St: Gr: [B:] AI Where: OS – Outstation. St – Outstation Number Gr – Group/s A , BCH , CD , ABCDEFTGH, etc B – Bit number (0 – 15) AI – Auto Interrogation rate in minutes, 0 time disables auto interrogation. Boolean & Integer Support (Multi State). Bit 0 - AC power failure Bit 1 – Group A communication failure Bit 2 - Group B communication failure Bit 3 - Group C communication failure Printed 4 INTRAC : INTRAC 2000 Bit 4 - Group D communication failure Bit 5 - Group E communication failure Bit 6 - Group F communication failure Bit 7 - Group G communication failure Bit 8 - Group H communication failure Bit 9 – Manual Poll does Auto Interrogate on demand. (Tag must be output enabled) Bit 10 – 15 – Unused. Group Data Tags: GD: St: Gr: [B] [T] Where: GD – Group Data St – Outstation Number Gr – Group A,B,C,D,E,F,G or H B – Bit number – 0- 7 T – Analogue type N or C Boolean, Integer and Real Support. For digital tags a maximum of 8 scan points from a Group can be scanned. For analogues a group can be scanned in as either Normal(N) or as a Counter(C). Scanning of integers made of 2 groups is to be scanned individually and calculated using an expression agent. Digital Ouput Tags: DO: St: Gr: [B] [T] Where: DO – Digital Output St – Outstation Number Gr – Group A,B,C,D,E,F,G or H B – Bit number T – Digital Output type – SM,SL,PN or PR SM - Single Momentary : the outputs to be toggled are set to 1 and the rest of the bits to 0. These bits are to be configured as pulsed items. The output is only triggered on a rising edge. 8 bits are used for every group. SL - Single Latched : a latched command ,the outputs to be set on are set to 1 and the outputs to be reset are set to 0. After the transaction the bits remains in their respective states. Outputs are sent both on rising and falling edges.8 bits are used for every group. PN - Paired Normal : If a bit is set, the data transmitted is a 1 and 0 ,and a bit is reset the data transmitted is a 0 and 1. 4 bits are used for every group. PR - Paired Reverse : If a bit is set, the data transmitted is a 0 and 1 ,and if a bit is reset the data transmitted is a 1 and 0. Printed 5 INTRAC : INTRAC 2000 Analogue Ouput Tags: AO: St: Gr: [B] [T] Where: AO – Analogue Output St – Outstation Number Gr – Group A,B,C,D,E,F,G or H Integer and Real Support. Message protocol Datascope messages are displayed in hex or ASCII. All messages are displayed whether that transmitter is configured or not. Messages of devices not configured are displayed in the first devices protocol monitor. The INTRAC protocol is ASCII. The structure of transactions is as follows: Read analogue/digital Inputs Auto Interrogate: <STX><AI><ADR><AG><RG><ETX><CS><CR><LF> CIU reply’s <STX><AN><ADR><G><DAT><ETX><CS><CR><LF> Auto Acknowledge: (Auto Acknowledge once requested groups data arrives) <STX><AA><ADR><RG><ETX><CS><CR><LF> (Acknowledge Messages) <ACK><ACK><CR><LF> <NACK><NACK><CR><LF> Direct Word - Outputs: <STX><DW><ADR><G><DAT><ETX><CS><CR><LF> (Download parameters Px where x is 1,2,3,4,5) Printed 6 INTRAC : INTRAC 2000 <STX><PP><DAT><DAT><DAT><DAT><ETX><CS><CR><LF> CIU reply’s (Acknowledge Messages) <ACK><ACK><CR><LF> <NACK><NACK><CR><LF> (Spontaneous Data) <STX><DT><ADR><G><DAT><ETX><CS><CR><LF> (Failed Groups on Interrogate) <STX><FL><ADR><AG><ETX><CS><CR><LF> (Busy/Check/OverFlow/Request Interrogation/Restart) <STX><FI><ETX><CS><CR><LF> where: Field Bytes Range Format Description STX 1 02 Binary Start of Text ETX 1 04 Binary End of Text CR 1 13 Binary Carriage Return LF 1 10 Binary Line Feed AI 2 ‘AI’ ASCII Auto Interrogate AN 2 ‘AN’ ASCII Answer for Inputs DW 2 ‘DW’ ASCII Direct Word for Outputs PP 2 ‘P1’..’P5’ ASCII Download Parameters FI 2 ‘BS’ ASCII Busy Printed 7 INTRAC : INTRAC 2000 ‘CK’ ‘OF’ ‘RI’ ‘RS’ Check Back Overflow Request Interrogation Restart FL 2 ‘FL’ ASCII Failed Groups on interrogate G 1 ‘A’..’H’ ASCII Groups DAT 8 to 10 bits 0 - 3FF(hex) ASCII 8 bits per group for 8 digital 10 bits per group for a analogue AG 1 00 FF ASCII Awaited Groups RG 1 00-FF ASCII Requesteg Groups (Same as AG) CS 2 00-FF binary Checksum Troubleshooting Printed 8 INTRAC : INTRAC 2000 Appendix CIU download configuration parameters Configuration (4, 8, 16). Default value 4. The CIU can address up to 512 stations out of a total of 2048 different remote stations in an INTRAC 2000 system. The parameter determines the number of systems among which the 2048 remote stations are to be allocated. If 1-4 systems are being used, the value “4” is assigned to this parameter, i.e. maximum 512 stations per system. If 5-8 systems are used, the value “8” is assigned, i.e. maximum 256 stations per system. If 9-16 systems are used, the value “16” is assigned, i.e. maximum 128 stations per system. System Address (0-3 or 0-7 or 0-15). Default value 0. Each system assigned to a CIU requires an identification address between 0 and 3. If 2-4 systems are being used, each system must be assigned a separate address between 0 and 3. If 5-8 systems are being used, each system must be assigned a separate address between 0 and 7. If 9-16 systems are being used, each system must be assigned a separate address between 0 and 15. NB : It is important to assign separate system addresses to adjacent INTRAC 2000 systems using identical frequencies, to avoid inter system interference. Lowest Address (0-511 or 0-255 or 0-127) Default value 0. This parameter determines the lowest remote station address in the system from which the CIU will recognize messages. Messages sent from a remote station with an address lower than the value of this parameter will not be recognized by the CIU. Highest Address (0-511 or 0-255 or 0-127) Default value 511 or 255 or 127, depending on system configuration. This parameter determines the highest remote station address in the system from which the CIU recognizes messages sent from a remote station with an address higher than this parameter will not be recognized by the CIU. Printed 9 INTRAC : INTRAC 2000 PTT Delay (0-635 msec) Minimal time resolution is 5msec, default value 150msec. This is the amount of time the CIU allows for transmitter warm-up before transferring the first code-word to the transmitter. Number of Direct Words (0-127) Default value 4. This parameter determines the number of times the codeword is repeated in each word-burst transmitted to the remote station during a Direct Acknowledgement or Control message transmission. Number of Auto-Ack Words (0-127) Default value 4. This parameter determines the number of times the codeword is repeated in each word-burst transmitted to the remote station during an Auto-Acknowledge message transmission. Number of Auto-Intrg Words (0-127) Default value 4. This parameter determines the number of times the codeword is repeated in each word-burst transmitted to the remote station during an Auto-Interrogation message transmission. Auto-Intrg Time On (0-63.5 sec) Minimim time resolution is 0.5sec, default value 10 sec. This parameter determines the amount of time per on/off cycle that the CIU is enabled for transmission during Auto-Interrogation. The value of both this parameter and the Auto-Intrg Time-Off parameter are determined after considering the relevant government regulations and the Auto-Interrogation cycle dynamics for the system database, as outlined in Section 9 of the CIU Operating Instructions Manual. Auto-Intrg Time Off (0-63.5 sec) Minimim time resolution is 0.5sec, default value 50 sec. This parameter determines the amount of time per on/off cycle that the CIU does not transmit during Auto-Interrogation. The value of both this parameter and the Auto- Intrg Time-On parameter are determined after considering the relevant government regulations and the Auto-Interrogation cycle dynamics for the system database, as outlined in Section 9 of the CIU Operating Instructions Manual. Printed 10 INTRAC : INTRAC 2000 Wait-for-Answer T1 (0-6.35 sec) Minimal time resolution is 0.05sec, default value 2 sec. After each autonomous transmission of interrogation code-words, the CIU waits a predetermined period of time for an answer from the interrogated station. D"}, {"title": "ISOIL", "href": "drivers_html/ISOIL.html", "category": "Drivers", "rel": "drivers_html/ISOIL.html", "kind": "Driver", "text": "Adroit Technologies Protocol Driver Name ISOIL Email IMAP Client DLL ISOIL _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-ISOIL.docx P a g e | 2 COPYRIGHT Copyright © 2022 Advanced Worx 112 (Pty) Ltd. All rights reserved. Information in this document is subject to change without notice. The software described in this document is furnished under a license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of those agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or any means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal use without the written permission of Advanced Worx 112 (Pty) Ltd. Advanced Worx 112 (Pty) Ltd 20 Waterford Office Park 189 Witkoppen Road (c/o Waterford Drive) Fourways South Africa https://adroittech.co.za/ _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-ISOIL.docx P a g e | 3 Contents 1. Overview ............................................................................................................................................. 4 2. Wiring ................................................................................................................................................. 5 3. Device Configuration .......................................................................................................................... 6 3.1. Device Configuration ....................................................................................................................... 6 3.1.1. Mail Server Settings (*Resource key) .......................................................................................................... 6 3.1.2. Incoming Mailbox Configuration ................................................................................................................. 7 3.1.3. Backup mailbox configuration .................................................................................................................... 7 3.1.4. Local Device Settings ................................................................................................................................ 8 3.1.5. Unknown mailbox configuration ................................................................................................................. 8 4. Supported Addresses .......................................................................................................................... 9 4.1.1. ML150 ..................................................................................................................................................... 9 4.1.2. ML250 option 1 ........................................................................................................................................ 9 4.1.3. ML250 option 2 ........................................................................................................................................ 9 4.1.4. Universal Addressing ................................................................................................................................ 10 5. Protocol Definition and Considerations ............................................................................................ 11 5.1. Application Example ...................................................................................................................... 11 6. General Notes and Troubleshooting ................................................................................................. 12 6.1. Contact Details .............................................................................................................................. 12 6.2. Adroit Technologies Knowledge Base .............................................................................................. 12 6.3. Troubleshooting ............................................................................................................................ 12 7. Revisions ........................................................................................................................................... 13 7.1. Document Revision........................................................................................................................ 13 7.2. DLL Revision ................................................................................................................................. 13 _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-ISOIL.docx P a g e | 4 1. Overview This driver is designed to provide an interface for ISOIL ISOMAG flow meters. The data is sent in the form of an email containing a csv attachment. Once the email is received it is decoded to expose the values contained in the attachment and body of the mail. Inbox management is provided through a BACKUPBOX mailbox and an UNKNOWN/TODO box, where email messages can be moved as appropriate. Messages older than a configured amount of days may be set for auto deletion. A separate Adroit device has to be created for each flow meter with the station ID being set equal to the serial number of the flow meter. There is a resource ID allocated automatically on configuration, new devices will attempt to find a compatible configuration (those that share an inbox for example) any others will create a new resource, selecting a resource in the dialogue will load the current configuration for that box, if the device is saved (on OK) any changes will be save with an appropriate warning. Resource ID can be deleted with appropriate warnings if it might affect other devices. Offline devices and unknown (unconfigured) devices will have their emails moved to the UNKNOWN box if the MOVE radio is applied. Else if DELETE was selected unconfigured emails will be deleted. And offline device emails will be left in the main INBOX. Once an offline device is restarted the UNKNOWN box will be checked once for any emails for that device(s). This will also be done at Agent Server startup. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-ISOIL.docx P a g e | 5 2. Wiring Standard Ethernet network. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-ISOIL.docx P a g e | 6 3. Device Configuration 3.1. Device Configuration 3.1.1. Mail Server Settings (*Resource key) PLEASE NOTE The parameters identified by the * define a resource common to all devices that share those parameters, any change to any other parameter in this group will be changed for all devices using this mailbox. *Mailbox Type – Choose IMAP or POP depending on your server type (POP is no longer supported). *Mail Server – The name of the mail server *Mail Port – 993 for IMAP (143 is now no longer used), 110 for POP (no longer supported). *Login Name – Username on the server. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-ISOIL.docx P a g e | 7 *Server uses SSL – (Default = ON) Some POP and IMAP servers require SLL mode. IMAP servers listen on port 143 typically, while 993 is used for SSL/TLS. POP servers listen on port 110 typically, while 995 is used for SSL/TLS (no longer supported). PLEASE NOTE The remaining parameters can be considered as sub-parameters (these will not result in a new resource being generated if different from any other resource) and if a change is requested on these the whole resource will be updated, and thus affect all devices using that resource. Login Password – User password. Detailed debugging to datascope – Additional processing information will be sent to the datascope. 3.1.2. Incoming Mailbox Configuration Incoming Mailbox – Incoming account inbox name. This is where all new emails should arrive first. Poll Period (ms) – Mailbox will be checked for new mail at this interval. Move used messages to BACKUP mailbox - If a mail is parsed and accepted and considered complete, checking this radio button will tell the driver to move that mail to the used or BACKUP mailbox, where further processing could take place such as remain there for x amount of days before being discarded (see further down). Delete used messages – If a mail is parsed and accepted and considered complete, checking this radio button will tell the driver to delete the mail immediately. Move unknown messages to UNKNOWN mailbox – If a mail is parsed and found to be junk, or for an offline device and NOT considered complete, checking this radio button will tell the driver to move that mail to the TODO or UNKNOWN mailbox, where further processing could take place such as remain there for x amount of days before being discarded (see further down). Delete unknown messages – If a mail is parsed and accepted and considered complete, checking this radio button will tell the driver to delete the mail immediately. 3.1.3. Backup mailbox configuration Backup Mailbox – Backup name – this is a sub or secondary mailbox where completed emails can be stored for a period of time. Delete messages older than x days – Any email in this box older than this number of days will be deleted during driver maintenance tasks. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-ISOIL.docx P a g e | 8 3.1.4. Local Device Settings PLEASE NOTE These setting are stored per device and will not affect other devices using the same resource ID. Station ID – This is the identifier code sent in the subject line of the email For example, data from ML250 29902, the ID is then 29902. Model – Select the Model of the ISOMAG flowmeter. Currently two models are supported. The ML150 and the ML250. The ML155 and ML255 can be selected but these must run in compatibility mode. Pressure Multiplier – Multiplier for the pressure values contained in the csv files Device contains units – The ISOMAG can report data with unit fields. 3.1.5. Unknown mailbox configuration Unknown Mailbox – Unknown name – this is a sub or secondary mailbox where emails not associated with an Adroit Device can be stored for a period of time. Junk/spam and or unconfigured or offline devices will also go here. Delete messages older than x days – Any email in this box older than this number of days will be deleted during driver maintenance tasks. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-ISOIL.docx P a g e | 9 4. Supported Addresses 4.1.1. ML150 A CSV row constitutes 1 record: 1,2010/02/03,00:00:00,+,<Unit 1>,<Param1>,<Unit 2>,<Param2> Data Result Representation Adroit Integer Adroit Real Adroit String Param 1 Positive volume counter V1 V1 Param 2 Flow rate V3 V3 Unit 1 Unit of Positive volume counter U1 Unit 2 Unit of Flow rate U3 4.1.2. ML250 option 1 A CSV row constitutes 1 record: 1,2010/02/03,00:00:00,+,<Unit 1>,<Param1>,-,<Unit 2>,<Param2>,<Unit 3>,<Param3>,<Unit 4>,<Param4> Data Result Representation Adroit Integer Adroit Real Adroit String Param 1 Positive volume counter V1 V1 Param 2 Negative volume counter V2 V2 Param 3 Flow Rate V3 V3 Param 4 Pressure V4 V4 Unit 1 Unit of Positive volume counter U1 Unit 2 Unit of Negative volume counter U2 Unit 3 Unit of Flow Rate U3 Unit 4 Unit of Pressure U4 4.1.3. ML250 option 2 A CSV row constitutes 1 record: 1,2010/02/03,00:00:00,+,<Unit 1>,<Param1>,-,<Unit 2>,<Param2>,<Unit 3>,<Param3> Data Result Representation Adroit Integer Adroit Real Adroit String Param 1 Positive volume counter V1 V1 Param 2 Positive volume counter V2"}, {"title": "Koyo Direct Logic KDL105", "href": "drivers_html/Koyo_Direct_Logic_KDL105.html", "category": "Drivers", "rel": "drivers_html/Koyo_Direct_Logic_KDL105.html", "kind": "Driver", "text": "Koyo Direct Logic DL105 : KDL105KSKSKS Koyo Direct Logic KDL105KS Protocol driver Overview Adroit supports communications with the Koyo Direct Logic DL105 PLC Via the K-Sequence protocol. Printed 1 Koyo Direct Logic DL105 : KDL105KSKSKS Device configuration DL105 Details PLC Station ID: Fixed at 1 Port Details Port: The available serial ports on your machine Baud Rate: The speed of data transmission. Fixed at 9600 Parity: Check bit. Fixed at Odd. Stop Bits: UART signal bits. Fixed at 1. Retries: The number of times that Adroit will try to gain communication with a PLC before failing a transaction. Timeout: The time that Adroit will wait for a valid response from a PLC before failing a transaction (Read or Write). Printed 2 Koyo Direct Logic DL105 : KDL105KSKSKS Wiring The diagram above shows the wiring for the comms cable between a PC serial port and the DL105 Com 1 port. Supported addresses Prefix Start End Global Start Global End Type Access Description TA 0 77 V0 77 WORD Read Write Timer Accumulator CTA 0 77 V1000 1077 WORD Read Write Counter Accumulator V2000 2377 WORD Read Write Variable V4000 4177 WORD Read Write Variable V7260 7647 WORD Read Write System Status V7750 7777 WORD Read Write System Status X 0 177 V40400 40407 BIT Read Only Input Y 0 177 V40500 40507 BIT Read Write Output C 0 377 V40600 40617 BIT Read Write Variable S 0 377 V41000 41017 BIT Read Write Stage Status T 0 77 V41100 41103 BIT Read Write Timer Status CT 0 77 V41140 41143 BIT Read Write Counter Status SP 0 117 V41200 41204 BIT Read Only System Status SP 540 577 V41226 41227 BIT Read Only System Status Printed 3 Koyo Direct Logic DL105 : KDL105KSKSKS Adroit Data Types Supported Data types are as follows: Adroit Data Type PLC Data Type Bool Integer Real WORD Read √ √ WORD Write √ √ BIT Read √ √ √ BIT Write √ √ √ Driver Implementation NB All addresses with the Koyo DL105 PLC are expressed in Octal. When reading or writing data to or from the DL105 the driver is actually always using 16 bit words. The driver, depending on the prefix, will work out the type of data and get or put only the correct information. For example when a digital input “X” prefix is used it can be mapped to any Adroit data type. The global equivalent for X0 is V40400. This is a word and X0 to X20 (The next 16 bits) are stored here. This can be read into any Adroit data type except BOOLEAN or any of its derivatives. The most efficient way of reading or writing digitals is to use a multistate agent and read the global equivalent address. Troubleshooting During the installation of the driver the following files will be copied: KDL105KS.DLL The driver itself. KDL105KS.PDF The driver help file. KDL105KS.WGP An Adroit database file. KDL105KS.MIM An adroit mimic file. KDL105KS.REG Registry file Once the driver has been installed and setup, run the REG file, you may then set the Adroit database file to the KDL205KS.WGP and start the agent server. When the agent server is ready, start the user interface and open the file KDL105KS.MIM. You will then see a representation of a DL105 base with an input simulation module. If all is installed correctly and the driver has successfully started, you will be able to see the inputs change when the simulator module switches are changed and also will be able to change output states when the output lights are highlighted and clicked. This is the first thing to run when first setting up the unit. It can also be used as a training aid to see how the unit works. Revision Information Date Changes 11-Jun-02 Adroit Technologies takes over driver from Alex Griffiths. 14-Aug-03 PDF format document distribution from now on Printed 4"}, {"title": "Koyo Direct Logic KDL205", "href": "drivers_html/Koyo_Direct_Logic_KDL205.html", "category": "Drivers", "rel": "drivers_html/Koyo_Direct_Logic_KDL205.html", "kind": "Driver", "text": "Koyo Direct Logic DL205 : KDL205KS Koyo Direct Logic KDL205KS Protocol driver Overview Adroit supports communications with the Koyo Direct Logic DL205 PLC. Via the K-Sequence Protocol. This driver is property Adroit Technologies. Device configuration DL205 Details CPU Model: The CPU Model currently installed in the base. 230, 240 or 250. PLC Station ID: The ID number of the PLC on the PLC network. Fixed at 1 on Port 1 of the 230 & 240 CPU. 1 – 90 on Port 1 of the 250 1 – 90 on Port 2 of the 240 & 250. Printed 1 Koyo Direct Logic DL205 : KDL205KS Port Details Port: The available serial ports on your machine Baud Rate: The speed of data transmission for the PLC Fixed at 9600 on Port 1 of the 230, 240 & 250. Up to 19200 on Port 2 of the 240 Up to 38400 on Port 2 of the 250 Parity: Check bit. Fixed at Odd. Stop Bits: UART signal bits. Fixed at 1. Retries: The number of times that Adroit will try to gain communication with a PLC before failing a transaction. Timeout: The time that Adroit will wait for a valid response from a PLC before failing a transaction (Read or Write). Wiring The diagram above shows the wiring for the comms cable between a PC serial port and the 230, 240 & 250 CPU port 1 and the 240’s Port 2. For information on the use of port 2 of the 250 please refer to the DL205 User Manual 2nd Edition. Supported addresses 230 CPU Prefix Start End Global Start Global End Type Access Description TA 0 77 V0 77 WORD Read Write Timer Accumulator CTA 0 77 V1000 1077 WORD Read Write Counter Accumulator V2000 2377 WORD Read Write Variable V4000 4177 WORD Read Write Variable V7260 7647 WORD Read Write System Status V7750 7777 WORD Read Write System Status X 0 177 V40400 40407 BIT Read Only Input Y 0 177 V40500 40507 BIT Read Write Output Printed 2 Koyo Direct Logic DL205 : KDL205KS C 0 377 V40600 40617 BIT Read Write Variable S 0 377 V41000 41017 BIT Read Write Stage Status T 0 77 V41100 41103 BIT Read Write Timer Status CT 0 77 V41140 41143 BIT Read Write Counter Status SP 0 117 V41200 41204 BIT Read Only System Status SP 540 577 V41226 41227 BIT Read Only System Status Supported addresses 240 CPU Prefix Start End Global Start Global End Type Access Description TA 0 177 V0 77 WORD Read Write Timer Accumulator CTA 0 177 V1000 177 WORD Read Write Counter Accumulator V2000 3777 WORD Read Write Variable V4000 4377 WORD Read Write Variable V7260 7737 WORD Read Write System Status V7746 7777 WORD Read Write System Status X 0 477 V40400 40423 BIT Read Only Input Y 0 477 V40500 40523 BIT Read Write Output C 0 377 V40600 40617 BIT Read Write Variable S 0 777 V41000 41037 BIT Read Write Stage Status T 0 177 V41100 41107 BIT Read Write Timer Status CT 0 177 V41140 41147 BIT Read Write Counter Status SP 0 137 V41200 41204 BIT Read Only System Status SP 540 617 V41226 41230 BIT Read Only System Status Supported addresses 250 CPU Prefix Start End Global Start Global End Type Access Description TA 0 377 V0 377 WORD Read Write Timer Accumulator CTA 0 177 V1000 1177 WORD Read Write Counter Accumulator V10000 17777 WORD Read Write Variable V7400 7777 WORD Read Write System Status X 0 777 V40400 40437 BIT Read Only Input Y 0 777 V40500 40537 BIT Read
