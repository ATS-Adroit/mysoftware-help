 device will need to be created for each FED. • Agent Server (AS): The Agent Server (I/O Server), is the real-time database, which handles the real-time values and if configured, will handle all post-processing, logging and/or alarming the data. • SmartUI Server (SUIS): The SUIS is a middleware server which exposes data from a number of disparate sources, using the datasource, and also acts as a repository for the graphic forms or mimics. It also acts as the manager of access, and broker for the unified data model implemented across all data types that may end up in the • Datasource: Each source of data (i.e. Adroit Agent Server) requires a datasource plugin before it can be associated with the SmartUI Server. This provides the ability to expose its data as data elements. An example of a data element is Adroit.Analog.SAMPLEANALOGUE.value. The SmartUI Server connects to data using two different types of datasources: • The SmartUI Server allows multiple sources of data to be available to the configuration of a system in a unifed manner. It basically coverts all datatypes into universally usable elements (dataelements). ____________________________________________________________________________________________________________________________ ATQMS-MKTG-DOC-Adroit 10 Quick Start Guide P a g e | 4 Datasource Purpose Adroit Exposes the configured agents and their slots, of the connected Adroit Agent Server. Event Log Exposes the events within the Windows event logs of the connected specific computer. OLE DB Exposes the data within a specific OLE DB compliant database or data store. Server Scripts Stores scripts that can be run on the Server. Simulation Exposes a wide variety of different types of generated data WebServices Exposes a wide variety of data available in web services Note: For further information on the available datasource see the Adroit help. • Clients: The Adroit SUI comes with a number of types of clients which can securely connect to the SmartUI Server: tings like the IP, port address and watchdog addresses. On the A-Series driver the Decimal or Hex notation used is important and does change over in this Q/QnA driver. Names of I/O types stay the same so far possible, this means that scanned I/O types existing in the A-Series driver that have different names (prefixes) in the Q Driver are promoted automatically to their new names. After saving, the WGP file cannot be loaded on the old driver again without the possibility of losing some scan-points. _______________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MIT_ETH.docx P a g e | 5 2. Wiring As per Ethernet Standards. _______________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MIT_ETH.docx P a g e | 6 3. Device Configuration 3.1. Device Configuration _______________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MIT_ETH.docx P a g e | 7 Enable secondary – Turn this option to have the driver maintain 2 channels of communication, the radio buttons Primary and Secondary can then be used to toggle between configurations. Enable shadow scanning from master to standby – NASA specific function – per Device Agent level shadow scanning. If enabled, writes will be sent to the master to be executed on its corresponding device and reads from master will be replicated to the standby. If disabled writes Parallel scanning is enabled. Enable standby reads – If disabled, the standby will be considered cold, no reading will take place on the standby connection, and neither will any replication from the master occur. Enable standby writes -– If disabled, no writing will take place on the standby connection, and neither will any request be forwarded to the master. 3.1.1. Error Handling Retries - (Default = 3) Number of attempts per transaction. Disconnect after er in this Q/QnA driver. Names of I/O types stay the same so far possible, this means that scanned I/O types existing in the A-Series driver that have different names (prefixes) in the Q Driver are promoted automatically to their new names. After saving, the WGP file cannot be loaded on the old driver again without the possibility of losing some scan-points. _______________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-MITQJE71.docx P a g e | 5 2. Wiring Standard Ethernet. _______________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-MITQJE71.docx P a g e | 6 3. Device Configuration 3.1.1. Device Configuration 3.1.2. Port Selection Enable secondary – Turn this option to have the driver maintain 2 channels of communication, where the radio buttons Primary and Secondary can then be used to toggle between configurations. 3.1.3. PLC Details PLC Type – Select the relevant PLC CPU model; Q Series CPU, QnA Series CPU, L Series CPU, R Series CPU, FX5(iQ-F) Series and Custom. By selecting a CPU, you set the device address range. Custom allows you to modify these ranges. IP Address – Enter the TCP/IP address assigned to the PLC. The default IP address here is your own IP, and often it is required that only the last octet be changed. IPv6 is not supported. _______________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-MITQJE71.docx P a g e | 7 Port – The accessible port on the PLC in GX-developer. This value is expressed in hexadecimal; hence you can use the drop-box nest to the entry field to toggle between HEX and decimal display modes. AJ->CPU timeout (ms) – The timeout setting to be used internally by the external card for transactions with the CPU. This value must be less than the communications timeout specified below it. The actual value used is rounded up ________________________________________________________________________________________________ ATQMS-DRVR-DOC-MOD_ETH.docx P a g e | 7 2.2. Dynamic IP via DNS Lookup When Dynamic IP via DNS is enabled, the driver will launch a thread that will attempt to lookup an IP address when retries are exhausted and found to be failing. This lookup process will continue indefinitely until the Agent server is stopped, it will not block a connection or the Agent server read/writes which will continue existing connection parameters until changed by a successful lookup, which will then save those new parameters. This mode can be used on connections that are on the internet and have a dynamic IP such as when using ADSL that change IP address once a day. The device will need to be registered on a DNS server such as DYNDNS.ORG Enable – (Default = unchecked) This will enable the DNS Lookup mechanism. DNS Server IP – IP address of the DNS server that will handle lookup requests. Host Name – The name of the machine/PLC registered on the DNS server. This name is used to request the associated IP address. The IP address returned will be stored in the IP Address field dynamically in the PLC Details. 2.3. Local Details Retry - The number of attempts that the Master will attempt to communicate with the PLC before failing a transaction. Timeout - The time that the Master will wait for a valid response from a PLC before failing an individual transaction (Read or Write). 2.4. Test Device Config for Connectivity This section is available to help users determine whether the settings they have entered are valid and Adroit can communicate with your device. The Agent server is not required to be running. Test Address – An address in your device which will be polled when the “Read Address” button is clicked. The address entered must be valid and will match the IEC or Standard Modbus addressing scheme selected in the advanced dialogue. IO Type – Defines the base address type to be read, i.e., Boolean, Integer, Real or String80. Read Address – Click this button to poll the PLC with the current settings in the dialog. Reply – The successful or failed result will be updated to this static text control. Ping Test – Click to verify that the TCP/IP address entered into the boxes can be accessed using a ping. An appropriate MessageBox will appear as to the result. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-MOD_ETH.docx P a g e | 8 2.5. Advanced Settings Dialog PLEASE NOTE The registry is only updated upon pressing the final OK button on the main device configuration dialog (the current dialog). INFORMATION For all configuration settings: They are offline changes to the registry and are only reloaded at start-up (hence why we suggest a restart of the Agent server). There is a case where after a read completely timeouts and exceeding all the retries as well, the driver will dynamically reload the registry and a restart is then not required. This may not be entirely apparent so when in doubt it is suggested to restart the Agent server regardless just to make sure. 2.5.1. Backoff and Tolerance Settings Backoff period (mSec)(0=off) – The period in milliseconds that the driver will backoff from any further polling to a specific device, without affect"}, {"title": "MQTT Client Driver", "href": "drivers_html/MQTT_Client_Driver.html", "category": "Drivers", "rel": "drivers_html/MQTT_Client_Driver.html", "kind": "Driver", "text": "Adroit Technologies Protocol Driver Name MQTT Client Protocol Driver DLL D_MQTT_CL _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 2 COPYRIGHT Copyright © 2022 Advanced Worx 112 (Pty) Ltd. All rights reserved. Information in this document is subject to change without notice. The software described in this document is furnished under a license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of those agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or any means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal use without the written permission of Advanced Worx 112 (Pty) Ltd. Advanced Worx 112 (Pty) Ltd 20 Waterford Office Park 189 Witkoppen Road (c/o Waterford Drive) Fourways South Africa https://adroittech.co.za/ _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 3 Contents 1. Overview ............................................................................................................................................... 4 1.1. Supported Hardware ..........................................................................................................................4 2. Wiring ................................................................................................................................................... 5 3. Device Configuration ............................................................................................................................ 6 3.1. Device Configuration ..........................................................................................................................6 3.1.1. Driver Details .............................................................................................................................................. 6 3.1.2. Device Details .............................................................................................................................................. 7 4. Supported Addresses ............................................................................................................................ 9 4.1. Example ............................................................................................................................................9 5. Protocol Definition and Considerations .............................................................................................. 11 5.1. Additional MQTT Information ............................................................................................................ 12 6. General Notes and Troubleshooting ................................................................................................... 13 6.1. Contact Details ................................................................................................................................. 13 6.2. Adroit Technologies Knowledge Base ................................................................................................. 13 7. Revisions ............................................................................................................................................. 14 7.1. Document Revision........................................................................................................................... 14 7.2. DLL Revision .................................................................................................................................... 14 _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 4 1. Overview Message Queue Telemetry Transport (MQTT) is a lightweight, report by exception, ISO-standard pub-sub messaging protocol specifically designed for the Internet of Things. The MQTT network consists of publishers, subscribers and a broker. The publishers will publish or send information to the broker, the broker will then relay those messages to the subscribers. The broker is the “middleman” in the network and could be situated in the cloud. A publisher/subscriber are the clients on the network and are linked together by topics. Each Adroit agent can be a publisher and/or subscriber, and acts as a client on the network. If Adroit is a publisher, then it will write values out to other subscribers (when the tag is scanned using Output enabled). When Adroit is a subscriber, then it waits for data on a specific topic from any publisher to that topic. There are three parts of an MQTT transmission: Message: This is the data that is passed through the broker to all clients subscribed to a specific topic on the MQTT network. Topic: Some brokers support topic strings with a maximum of 128 levels and a maximum length of 250 bytes, so an MQTT client connection that exceeds those limits will be closed. QoS: Quality of Service, ensures delivery to connected clients: a. At most once - The published message is sent once, and if it does not arrive it is lost. b. At least once - Guarantees that the published message arrives, but there may be duplicates. c. Exactly once - Guarantees that the publish message arrives and that there are no duplicates. 1.1. Supported Hardware This driver has been tested on the following hardware: None applicable. The driver has been tested is known to work with the following brokers: • Mosquitto • HiveMQ _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 5 2. Wiring Not applicable. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 6 3. Device Configuration 3.1. Device Configuration Enable secondary – Turn this option to have the driver maintain 2 channels of communication, the radio buttons Primary and Secondary can then be used to toggle between configurations. 3.1.1. Driver Details Enable Secondary – (Default = OFF) Allows enabling of redundant MQTT Broker connections such that in case of a failure a switchover will occur. Primary – Allows configuration setting of the Primary broker connection. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 7 Secondary – Allows configuration setting of the Secondary broker connection. 3.1.2. Device Details Enable shadow scanning from master to standby – (Default = OFF) If enabled will stop any communication to the MQTT broker when the Agent server is in standby mode. By default, we assume parallel scanning. Enable standby reads – (Default = ON) Allows reading from the MQTT broker when agent server is in standby mode. Enable standby writes – (Default = OFF) Allows writing to the MQTT broker when agent server is in standby mode. Broker Host IP – The static IP Address or HOST name of the MQTT broker. Domain names are resolved to IP addresses. To connect over Websockets specify a hostname beginning with ws:// or wss://. For example: ws://test.mosquitto.org or test.mosquitto.org Port – A valid port number is required for the connection to take place. Client Name – The client identifier is a (1- 23 UTF-8 encoded) unique name to identify each MQTT client to the MQTT broker. It should be unique per client for a given broker, and each Adroit server device needs its own unique client ID. Click the button on the right-hand side to generate a random string for this field if required. Username – A username could be required by the MQTT broker. This allows authentication and authorization of clients to a broker. This must be a UTF-8 encoded string. Password – A password could be required by the MQTT broker. This allows authentication and authorization of clients to a broker. QoS – (Default = 2) Quality of Service level of each client. The level (0, 1 or 2) determines the guarantee of a message being delivered. Clean Session – (Default = True) This will tell the MQTT broker to establish a persistent session or not. If True, the broker will discard any data previously associated with the current client ID once successfully connected. Otherwise, when disconnected the broker and client will store the session, all subscriptions for the client and all missed messages, when QoS 1 or 2. Retain Flag – (Default = False) When publishing a non-empty message with the Retain flag set and a non-zero QoS level, will cause the server to store it (replacing any previously retained message in the process). When the message is stored, any new clients that subscribe to that topic will receive the message. Auto Reconnect – (Default = False) The MQTT driver will automatically reconnect to the MQTT broker if connection is lost. KeepAliveTime – The KeepAliveTime is a time interval that the client will continuously send control packets/PING requests to the MQTT broker to show that the client is still alive. If the broker does not receive a control packet/PING request within 1.5 times the KeepAliveTime, the broker MUST disconnect the network connection to the client as if the network had failed. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 8 Timeout – (Default = 60) If the Timeout is set to 0, all operations return immediately, potentially failing with an error if not completed immediately. If set to a positive value, then the driver will wait for the operation to complete before returning control. Retries – Number of retries before trying to switch between primary/secondary. Each Retry is 1 second. Will Topic – The topic to publish will payload. Can have a hierarchal structure with forward slashes as delimiters. Will Message – The message to publish when the Agent Server disconnects ungracefully. Will QoS Level – (Default = 0) Publish payload with QoS set. Will Retain Flag – (Default = False) This flag determines if the will message will be saved by the broker for the specific topic. New clients that subscribe to that topic will receive the last retained message on that topic after subscribing. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 9 4. Supported Addresses The scan address in Adroit is the topic in the MQTT protocol with a format prefix. A MQTT topic is a simple string with a hierarchical structure, with forward slashes as delimiters. For example: Prefix:City/house/bedroom/lamp/on PLEASE NOTE Currently the Adroit MQTT driver does not support wildcards, so please avoid using “+” and “#” characters in the scan addresses. Prefixes : Data type Prefix Example String S S:MYSTRING Long L L:MYSIGNED32 Double D D:MYUNSIGNED32 Integer I I:MYSIGNED32 Word W W:MYSIGNED32 Long F F:MYSIGNED32 INFORMATION Prefixes attempt to force the driver to pre-convert the I/O to various types and must be included. 4.1. Example Making use of the online MQTT Broker supplied by Mosquito you can test the MQTT functionality. Settings is as follows: HOST: test.mosquitto.org PORT: 1883 The scan address can be anything, as it relates to the Topic name. On this broker, scanning to any topic will register the topic and allow values to be transferred through the channel. Scanning a string agent to the broker will now have the following result in the scanniong dialog. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 10 Other supported ports for various Mosquitto.org test co"}, {"title": "OPC Client Driver", "href": "drivers_html/OPC_Client_driver.html", "category": "Drivers", "rel": "drivers_html/OPC_Client_driver.html", "kind": "Driver", "text": "Adroit Technologies Protocol Driver Name OPC DA Client DLL OPC_CL _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-OPC_CL.docx P a g e | 2 COPYRIGHT Copyright © 2022 Advanced Worx 112 (Pty) Ltd. All right  and make sure you understand what is being provided for in this new version. “Auto recovery” was not a feature available in older versions of the driver. 1.1. Supported Hardware This is equipment & vendor specific, installation instructions for specific OPC Servers is beyond the intended scope of this document, however notes on specific differences have been included. OPC Servers supporting version 2.0 of the OPC interface allow remote connections to servers as well as local OPC server connections. Please see the section on “Specific OPC Servers”, which covers differences experienced between commonly encountered OPC Servers. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-OPC_CL.docx P a g e | 5 Wiring Not applicable. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-OPC_CL.docx P a g e | 6 2. Device Configuration 2.1. Driver Installation and Setup The driver is installed in Adroit by default. If not, you will need to install it via the “Drivers” tab and click on “Add” in Adroit setup. The opc_cl.dll and the opc_cl.doc are then copied into the agent directory. 2.2. Device Configuration 2.2.1. Device Configuration The configuration of an OPC client device has only three basic items of configuration for a connection. These are: Remote or local If remote, name of remote host (or PC) The name of the OPC Server to connect to As with most Adroit protocol drivers, you can also specify a secondary (or backup) connection. Enable Secondary Enables secondary configuration for dual redundant OPC Server Connections. If enabled, the primary and secondary buttons are also enabled to allow you to select the connection you wish to configure. This driver supports auto and manual resetting and switching of connections. See “Resetting and Switching Connections” below. Local host Connect to an OPC Server on the local PC. The “host name” dropdown box will be disabled. Domain host / Global host Select an OPC Server on a remote PC. The “host name” dropdown box will be enabled to allow you to select a remote PC. The reason for two buttons is simply to allow for fast and slow (respectively) network searching of remote PC’s for populating the dropdown box. “Domain host” will search the local domain only while “global host” will take longer to search the wider network. OPC Server Select the OPC Server that you want to connect to. All servers registered on the PC will be available in the dropdown box. If you are not able to see OPC Servers on a remote PC please consult the paragraph on Security below. 2.3. Advanced Settings Dialog All advanced settings are accessible in the advanced dialog; Changes to these settings are not required by default. Notable exceptions are listed in the section OPC Server Notes. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-OPC_CL.docx P a g e | 7 Use synchronised polling (Default = off) OPC clients by nature receive data “by exception” from OPC Servers. However, you can use OPC for polling data from front end devices. This setting enables polling at the scan period specified when configuring scan items. This setting should only be used if necessary. Poll from device (Default = on) If polling is enabled, OPC can poll data from the device or internal cache of the OPC Server. Unless you are sure as to how your OPC Server operates, it is safer to leave this setting on. Use OPC server timestamps (Default = off) For OPC severs that provide timestamp data, whose timestamps must be reflected in Adroit as current and/or historical data, or else the current time is used for all data as it is received by the scanning subsystem. This setting is generally used for telemetry systems. Do not validate items (Default = off) This will skip the OPC item validation process. Normally used only if you configuring offline, appropriate if your OPC Server requires the actual hardware to be connected in order to validate correctly. Switching this setting off greatly speeds up the agent server loading process for configurations with large amounts of OPC scanning. Use alternate item validation. (Default = off) Some OPC servers have been found not to support the OPC “validate items” function. These servers can still be made to validate by turning this selection on which will cause the driver to add an item and remove and item for validation. Successfully adding the item implies a valid OPC item. Force OPC to convert data types (Default = on) The driver will ask the OPC Server for data in a format that best suits Adroit. If the option is off, the driver will accept any data types returned by the server and convert the data at runtime. Turn this option off if you have problems adding scan-points/items. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-OPC_CL.docx P a g e | 8 Use OPC 1.0 (Default = off) Forces the driver will use OPC interface version 1.0 if both are presented in the server. This setting allows operation where an OPC server has got version 2.0, but it does not operate satisfactorily. Enable auto recovery Enables the driver to attempt recovery of an OPC Server connection should the connection fail for any reason. This is achieved on a background thread for non-polled devices OR on a read/write transaction for polled devices. If auto recovery is disabled, auto recovery will not take place regardless of whether a device is set for sync. polling or not, and regardless of whether you have a s"}, {"title": "OPC Client driver", "href": "drivers_html/OPC_Client_driver.html", "category": "Drivers", "rel": "drivers_html/OPC_Client_driver.html", "kind": "Driver", "text": "Adroit OPC UA CLIENT Protocol Driver 2018/10/16 1 Adroit OPC UA Client Protocol Driver Contents Overview .............................................................................................................................................. 2 Connectivity ......................................................................................................................................... 2 Driver Installation and Setup ................................................................................................................ 2 OPC UA Instance Certificates .............................................................................................................. 2 OPC UA Server Certificates ................................................................................................................. 3 Device Configuration ........................................................................................................................... 3 Registry details ..................................................................................................................................... 6 Scanning Configuration ........................................................................................................................ 6 Message protocol .................................................................................................................................. 7 Troubleshooting .................................................................................................................................... 7 Revisions .............................................................................................................................................. 8 Adroit OPC UA CLIENT Protocol Driver 2018/10/16 2 Overview OPC UA (OLE for Process Control Unified Architecture) is a standard specification that makes it possible for automation/control software applications and field systems/devices to interoperate and communicate data between each other. To learn more about what OPC UA is, visit the OPC foundation website https://opcfoundation.org/about/opc-technologies/opc-ua/ The OPC UA client driver for Adroit communicates to OPC servers that expose an OPC UA interface. Connectivity The OPC UA client driver communicates with OPC UA Servers in accordance with the OPC UA Specification whose details are beyond the intended scope of this document. Driver Installation and Setup If the Adroit OPC UA Client driver is not installed, you will need to install it. Installation of this driver for the first time will install the OPC Foundation’s OPC UA reditributables if not already installed on your PC. The following files will be installed agent server folder:  d_opc_ua.dll  d_opc_ua.doc  opcuabrowser.exe as well as the following 3rd party dependency files:  libeay32.dll  libxml2.dll  TB5CPP.dll  TB5OT.dll  TB5STACK.dll  TB5UTIL.dll If any of these files is not in the agent directory, then the driver did not install properly. OPC UA Instance Certificates The OPC UA specification requires that all UA clients have an instance certificate that positively identifies client to the server. The instance certificate for Adroit OPC UA is automatically created on the agent server PC when the OPC UA Protocl driver DLL is loaded by PSEXE or AS.EXE for the first time. The instance certificate can also be created manually by executing the %ProgramData%\\Adroit Technologies\\Adroit\\certs\\create_instance_certificate.bat file which is found in the folder. Once the batch file has completed, the following folders will have been created under the certs folder: crl issuer own private Adroit OPC UA CLIENT Protocol Driver 2018/10/16 3 rejected trusted The cert_adroit_client.der file will be found in the certs/own folder and the private_key_adroit_client.pem file will be found in the certs/private folder. Select these two files for the instance certificate entries above. Furthermore, the cert_adroit_client.der file needs to be copied to the trusted certificate folder of the OPC UA Server/s that you will be communicating to. Conversely, the OPC UA Server instance certificate needs to be copied to the Adroit system folder for two way authentication. The certificate types should be the same. OPC UA Server Certificates The OPC UA specification requires that all UA clients trust the server certificate for the OPC UA server that they are connecting to. By default, server certficates will be place in the %ProgramData%\\Adroit Technologies\\Adroit\\rejected folder when a client connects to the OPC UA server for the first time. These must be manually copied to the %ProgramData%\\Adroit Technologies\\Adroit\\trusted folder before a successful connection will be allowed. Device Configuration When configuring an OPC UA client device, the following dialog is launched and must be completed accordingly. The dialog has 3 different modes depending on the authentication type selected. By default, the dialog looks as follows for anonymous authentication: Adroit OPC UA CLIENT Protocol Driver 2018/10/16 4 Username authentication looks as follows: Certificate authentication looks as follows: On selecting the […] button for ‘Endpoint URL’ you will be presented with the “Connect to Server” dialog discussed later. User credentials - if authentication type = username, a username and password must be specified User certificates - if authentication type = certificate, a certificate must be specified. User certificates need to be issued by a 3rd party certification authority. Timestamp source – Local, Server or Source. Default is Server  Server – When the OPC server sends a value the driver, whether by exception or from being polled, the OPC server return two timestamps, the timestamp that the server received the value, or the timestamp that the Adroit OPC UA CLIENT Protocol Driver 2018/10/16 5 device/source received the value, by selecting this radio button, the driver will update values with the servers timestamp.  Source – The driver will update values with the device/source timestamp as mentioned above. (NB, do not use this timestamp option if the communication protocol connecting to the device does not supply a timestamp)  Local – If this option is selected, the driver will update values with the timestamp of when the driver receives the value. Polled – OPC clients by nature receive data “by exception” from OPC Servers. However, you can use OPC for polling data from front end devices. This setting enables polling as opposed to “by exception”. This setting should only be used if absolutely necessary. (Default off) Timeout – Poll and connection timeouts in msecs Retries – Number of retries before failing a poll transaction Test – Test the connection to the OPC UA server using the configured endpoints. If the connection to the OPC UA server is being made for the first time, you will be prompted as o whether you wish to trust the server certificate. Connect To Server  Server name / Server IP address – This is the name or IP address of the machine on which an OPC UA server discovery will be conducted. To initiate a discovery on the machine or IP address entered, click on the refresh button.  Discovered Servers – This list displays all available OPC UA servers which are discoverable on the machine or IP address specified in “Discovery Host Machine. The [+] button allows you to enter a server manually that is not discoverable on the network if the format opc.tcp://hostname:port e.g. opc.tcp://klaus:1234. Manual entries are stored as a CSV entry in the registry value HKEY_LOCAL_MACHINE\\SOFTWARE\\Adroit Technologies\\Adroit\\OPC UA\\Manual. The [-] button allows you to remove the currently selected server, if it is a manually added server. If any of the servers displayed in “Discovered OPC Servers” are clicked on, then the “Connection Details” will automatically populate with the selected server’s details. Connections Details Adroit OPC UA CLIENT Protocol Driver 2018/10/16 6  Server Name – The name of the server to which the current device will connect to.  Connection URL – The server endpoint address on which the device will connect when connecting to the OPC UA server.  Endpoints – The list of endpoints (authentication methods) supported by the selected OPC UA Server  Message security mode  Security policy The combination of token type, message security mode and security policy must be valid for the OK button to be enabled. NOTE – It is best to always make your selection and press [Ok] on this “Connect to Server” dialog because pressing [Cancel] will make all the “OPC UA Server” group of properties editable. Editing these properties manually is done at your own risk. Registry details As is the case with all Adroit Protocol Drivers the configuration for a device is stored in the registry at HKEY_LOCAL_MACHINE\\SOFTWARE\\Adroit Technologies\\Adroit\\ProtocolDrivers\\D_OPCUA_CL\\DeviceName However, to allow both the driver and opcuabrowser.exe to share connection details for OPC UA Servers, these details are stored at HKEY_LOCAL_MACHINE\\SOFTWARE\\Adroit Technologies\\Adroit\\OPC UA\\ConnectionURL An example of the registry store is show below where both registry sections are visible: Scanning Configuration The default address is ns=1;s=address. Each node in the OPC UA address tree is made up of an address tuple which contains the namespace index and address of the node. The OPC UA address format is as follows: ns=x;s=y Where x is the namespace index of the node and y is the address of the node respectively. Adroit OPC UA CLIENT Protocol Driver 2018/10/16 7 A node’s namespace index and address can found/browsed by using the OPC UA Browser. Clicking the browse button in the scanning dialog will launch an item browser (not opcuabrowser.exe!) which will browse the entire address tree on the connected OPC UA server. The browser dialog looks as follows: If the driver is in polled mode, the update rate of a tag is determined by the scan period specified. Please note : 1. This driver does not support dula scanning. In other words should you scan more than one tag to a single address, subsqequent tags will always remain scan bad. 2. This driver does not support “Output Initialize”. Message protocol Datascope messages are displayed in ASCII mode. The underlying communication protocols to the device is not available to the OPC Client and thus not showed, see the troubleshooting section. This window will however show all validation of tags. If the tag cannot be validated, a message indicating the error message will be displayed here. All item updates (process-data changes) are also indicated here with an offset number of the tag that’s being updated. Troubleshooting Datascope errors Cannot connect to server Ensure that the OPC UA Server is running Re-connect failed (ERROR : Failed to get endpoints: 0x80AD0000(BadDisconnect) Ensure that the OPC UA Server is running Re-connect failed (ERROR : Failed to connect the session: 0x801A0000(BadCertificateUntrusted) Ensure that the certificate of the OPC UA Server is trusted by Adroit by moving the certificate from the rejected folder to the trusted folder Adroit OPC UA CLIENT Protocol Driver 2018/10/16 8 Re-connect failed (ERROR : Failed to connect the session: 0x80130000(BadSecurityChecksFailed) Ensure that the Adroit certificate is trusted by OPC UA Server Re-connect failed (ERROR : Failed to get endpoints: 0x80AD0000(BadDisconnect) 1. Ensure that the OPC UA Server is running 2. Ensure that the certificate of the remote OPC UA Server is trusted Message boxes ERROR : Failed to find servers at opc.tcp://hostname:4840 1. The host does not exist OR 2. The host is not locatable by your DNS Server - try using the IP Address instead of the hostname 3. The OPC UA Local Discovery Service is not running on the host 4. If hostname is the local PC - there is a known issue caused by Windows’ preference of IPV6 over IPV4. See https://theitbros.com/ping-returns-ipv6- address-ping-ipv"}, {"title": "Siemens Ethernet Driver", "href": "drivers_html/Siemens_Ethernet_Driv onsiderations .............................................................................................. 12 6.1. Datascope ....................................................................................................................................... 12 7. General Notes and Troubleshooting ................................................................................................... 13 7.1. Contact Details ................................................................................................................................. 13 7.2. Adroit Technologies Knowledge Base ................................................................................................. 13 7.3. Troubleshooting ............................................................................................................................... 13 7.3.1. Error 33028 – cannot connect to the Siemens S7-1200/1500 PLC ................................................................... 13 8. Appendix A – PLC Models Tested ........................................................................................................ 13 9. Appendix B – Considerations .............................................................................................................. 14 10. Appendix C – Creating S7-200 Ethernet Connection .......................................................................... 15 10.1. Create a new Ethernet Configuration ................................................................................................. 15 11. Appendix D – Creating S7-1200/1500 Ethernet Connection ............................................................. 19 11.1. Configuring Siemens TIA Portal Software ........................................................................................... 19 _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-SIEMENS.docx P a g e | 4 1. Overview The Adroit Siemens protocol driver supports a set of various PLC models and communication protocols. 1.1. Supported Communication Protocols • ISO over TCP/IP – Ethernet connection. o supported PLC models: S7-200, S7-300 and S7-400 and S7-1200 and S7-1500 • MPI – Serial connection. o supported PLC models: S7-300 and S7-400 and S7-1200 and S7-1500 • MPI via IBH Link S7/S7++ - Ethernet connection from Adroit to IBH Link, serial connection from IBH Link to PLC. o supported PLC models: S7-300 and S7-400 and S7-1200 and S7-1500 • PPI - Serial connection. o supported PLC models: S7-200 • PPI via IBH Link S7/S7++ - Ethernet connection from Adroit to IBH Link, serial connection from IBH Link to PLC. o supported PLC models: S7-200 See Appendix A for a list of tested CPU’s and CP’s and their respective part numbers. See Appendix B for some considerations about the protocol and how it is used effectively. See Appendix C for MicroWin S7-200 configuration. See Appendix D for Siemens TIA Portal configuration for S7-1200/S7-1500. The system requires no third party drivers, software, stacks or plc code to run, provided the Siemens PLC and/or IBH Link and/or CP card is supported and has been configured appropriately. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-SIEMENS.docx P a g e | 5 2. Revisions 2.1. Document Revision Rev. Date Author Comment Approval 1.0 14-Dec-2022 J. Duncan New Format D. Jordaan 2.0 06-Jan-2022 K. Robinson Grammar and proofing D. Jordaan 3.0 4.0 5.0 6.0 7.0 2.2. DLL Revision Rev. Date Changes 1 30-Oct-2013 First release of the driver. 2 15-Mar-2016 Added S7-1200 and S7-1500 TIA Configuration. 31 19-Oct-2020 Added Reset and Switch-Connection support to driver from Device Agent. 31 20-Oct-2020 Added Communication type to driver options (PG/OP/S7) 32 11-Nov-2020 Added PLC side watchdog mechanism _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-SIEMENS.docx P a g e | 6 3. Wiring Please see standard Ethernet wiring documentation for ISO-TPC, PPI-IBH and MPI-IBH protocols. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-SIEMENS.docx P a g e | 7 4. Device Configuration 4.1. Device Configuration _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-SIEMENS.docx P a g e | 8 4.1.1. Redundancy Enable Secondary – (Default = unchecked) Turn this option to have the driver maintain 2 channels of communication, where the radio buttons Primary and Secondary can then be used to toggle between configurations. 4.1.2. Device Details PLC Model – (Default = S7-200) Select which PLC model the driver will connect to, S7 200, S7 300 or S7 400. In the case of using S7-1200 or S7-500 select the S7300 option. Protocol – Select which communication protocol should be used when the driver communicate with the PLC. See the Overview: Supported Communication Protocols section for more details on supported protocols. Retry count – In the event of communication failure, this value indicates the number of retry attempts before the driver enters a back-off state. Back-off Period - The time in milliseconds which the driver idles when in the back-off state. Connection Timeout – Maximum time in milliseconds Adroit will wait for a device to reply, before timing out and retrying. PDU Length - The maximum bytes to read in a single transaction. 4.1.3. Connection Configuration Ethernet Configuration This block will only be active if either of the following protocols are selected: ISOTCP, MPI by IBH, or PPI by IBH. IP Address - Configurable Ethernet Address. 127.0.0.1 (default). Port – Usually 102 when ISOTCP is selected and 1099 when MPI by IBH, or PPI by IBH is selected. Change not recommended. Serial Configuration This block will only be active if either of the following protocols are selected: PPI, MPI Com Port – The available serial ports on your machine. Baud Rate – The speed of data transmission. Any of the following Baud Rates may be specified: 300, 600, 1200, 2400, 4800, 9600, 19200, 38400, 57600, 115200. Parity – The parity bit setting used in the data transmission. This can be Even, Odd or None. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-SIEMENS.docx P a g e | 9 4.1.4. Protocol Configuration Rack – The rack number in which the PLC is installed. The rack is only applicable to the S7-300 and S7-400 PLCs. All the other PLC models have no concept of racks and is therefore always 0. Slot – The slot number in which the CPU is installed. By default if using the S7-300 the PSU takes slot 1 and the CPU slot 2. In the case of S7-400 you could get the PSU to take slot 1 and 2 and then CPU is in slot 3. For S7-1200/S7-1500 the CPU is actually slot 1 as there is no actual bus system. For the S7-200 the slot is always 2. Type – (Default = PG) Options are PG(1) programming interface, OP(2) operator panel , S7(3) standard Scada communications. 4.1.5. MPI/PPI Configuration Local Address – Local MPI/PPI address, usually 0. PLC Address – MPI/PPI address of the PLC. Speed – The speed at which the MPI/PPI connection has been configured. 4.1.6. Test Device Configuration for Connectivity This is used to check whether or not the configuration currently on the dialog can establish a connection and communicate correctly with the PLC. Use this feature instead of having to start the Agent Server only to find your configuration does not establish a connection or communicate correctly with the PLC. Test Address – The Siemens PLC address which the driver will attempt to scan. IO Type – The Adroit type in which returned values from the PLC will be displayed in. Start Reading – If this button is clicked, the driver will attempt to connect to the s user. The OEM (separately-licensed) components are no longer specified by their associated OEM codes but now included as separate textual entries in the product license, so that users can easily see exactly which components they are currently licensed for. Tip: Only the OEM components that you are licensed for will appear. • All product licenses have a GLOBAL expiry and can also support product-specific expiries, which can be used for product trials. • .V2C (Vendor to Customer) and .C2V (Customer to Vendor) files are now used to create and update product licenses instead of using .RUS files. A new licensing methodology has been added to support new product variants (Ignite and OPC/Edge Gateway) where rather than using traditional scan point licensing the system will count the number of user defined agents. Note: Full and Lite / HMI products continue to use the traditional scan point methodology 1.1.1. Important differences between a HASP and a Soft License: • A HASP license is bound to a USB HASP, which has a specific serial number - this is therefore portable and not restricted to a specific computer but has associated security risks and needs to be insured at your own risk. • A Soft license is bound to a specific computer and therefore cannot be transferred ____________________________________________________________________________________________________________________________ ATQMS-MKTG-DOC-What is new in the Adroit 10 Release P a g e | 4 1.2. Install Adroit 10 is designed to run on Windows 10 and Windows Server 2008 R2 onwards, it no longer supports the Windows Vista nor Windows Server 2008 operating systems. Adroit 10 requires Microsoft .NET Framework 4.6.2. If this is not installed then the installation uses an offline installation that it provides to install this for you (so no further downloading is required). IMPORTANT: The install can no longer be installed if the name of the user running it is called \"Administrator\", since this COULD be the built-in Windows Administrator account, which is DISALLOWED because UAC is automatically disabled whenever this built-in Administrator account is used, which causes a myriad of problems to occur. When installing the Agent Server, the Component Configuration Settings dialog does not provide the option of not installing the Agent Server and SmartUI Server "}];
const SELF = "drivers";
const ADD_FROM = true;

function uniq(arr) {
  return [...new Set(arr)];
}

function normalise(s) {
  return (s || "").toLowerCase();
}

function getQ() {
  return document.getElementById("q").value || "";
}

function addParamsToHref(href, q, from) {
  try {
    // Preserve fragments
    let parts = href.split("#");
    let base = parts[0];
    let frag = parts.length > 1 ? "#" + parts.slice(1).join("#") : "";

    let joiner = base.includes("?") ? "&" : "?";
    let qp = new URLSearchParams();
    if (q) qp.set("q", q);
    if (ADD_FROM && from) qp.set("from", from);

    return base + joiner + qp.toString() + frag;
  } catch (e) {
    return href;
  }
}

function render() {
  const qRaw = getQ();
  const q = normalise(qRaw);
  const cat = document.getElementById("cat").value;
  const mode = document.getElementById("mode").value;

  let filtered = ITEMS.filter(it => {
    if (cat && it.category !== cat) return false;
    if (!q) return true;
    const hay = normalise(it.title + " " + it.rel + " " + it.category + " " + (it.text || ""));
    return hay.includes(q);
  });

  filtered.sort((a,b) => a.title.localeCompare(b.title));

  document.getElementById("counts").textContent =
    `${filtered.length} item(s) shown (of ${ITEMS.length}).`;

  const host = document.getElementById("results");
  host.innerHTML = "";

  const makeItemHtml = (it) => {
    const kind = it.kind ? ` <span class="small">[${it.kind}]</span>` : "";
    const href = addParamsToHref(it.href, qRaw.trim(), SELF);
    return `<a href="${href}">${it.title}</a><span class="small">[${it.category}]</span>${kind}`;
  };

  if (mode === "alpha") {
    const ul = document.createElement("ul");
    filtered.forEach(it => {
      const li = document.createElement("li");
      li.innerHTML = makeItemHtml(it);
      ul.appendChild(li);
    });
    host.appendChild(ul);
    return;
  }

  const byCat = new Map();
  filtered.forEach(it => {
    if (!byCat.has(it.category)) byCat.set(it.category, []);
    byCat.get(it.category).push(it);
  });

  const cats = Array.from(byCat.keys()).sort((a,b)=>a.localeCompare(b));
  cats.forEach(c => {
    const div = document.createElement("div");
    div.className = "group";
    div.innerHTML = `<h2>${c}</h2>`;
    const ul = document.createElement("ul");
    byCat.get(c).forEach(it => {
      const li = document.createElement("li");
      const href = addParamsToHref(it.href, qRaw.trim(), SELF);
      const kind = it.kind ? ` <span class="small">[${it.kind}]</span>` : "";
      li.innerHTML = `<a href="${href}">${it.title}</a>${kind}`;
      ul.appendChild(li);
    });
    div.appendChild(ul);
    host.appendChild(div);
  });
}

function initCats() {
  const select = document.getElementById("cat");
  const cats = uniq(ITEMS.map(x => x.category)).sort((a,b)=>a.localeCompare(b));
  cats.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    select.appendChild(opt);
  });
}

["q","cat","mode"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});

document.getElementById("clear").addEventListener("click", () => {
  document.getElementById("q").value = "";
  document.getElementById("cat").value = "";
  document.getElementById("mode").value = "alpha";
  render();
});

initCats();
render();
</script>
