the PLC to operate as the server and Adroit as the\nPLC TSAP settings. This setting is not changeable and when ‘The server will connect with an Operator\nPane(OP)’ is selected the TSAP will change to 02.00. This means the SLOT setting in the driver is 2\nand RACK setting is 0. Also make sure ‘Accept all connection requests’ is checked. This will allow for\nany IP address to create a connection to the PLC. The Remote TSAP properties refer to the PC TSAP\nand always leave it as 02.01. Once ready click the OK button to continue to the next screen"}, {"title": "Siemens S7 Functions", "href": "drivers_html/Siemens_S7_Functions.html", "category": "Drivers", "rel": "drivers_html/Siemens_S7_Functions.html", "kind": "Driver", "text": "[Page 1]\nSiemens Step7 Functions: SIES7FN\nSiemens : S7-Functions protocol driver\nSiemens : S7-Functions protocol driver\nOverview\nThe S7 Functions driver uses built-in S7 function blocks to communicate with the S7\nvia L2/MPI, ISO Industrial Ethernet or TCP/IP (if supported on your CP). You will\nneed to obtain “S7 Functions” or S7 drivers + licences for your CP card from\nSIEMENS to enable communication.\nCommunication to H1 BUS using S7 functions for H1 (to a CP 443-1) has only been\ntested for Industrial Ethernet, and not for TCP/IP.\nThis document will take you through the installation steps for SIMATIC NET, and\nthen of the Adroit driver. Depending on your version of Simatic and which CP card\nyou use, instructions will differ. The driver will not appear in the available list in\nAdroit Setup until you have completed installation of the Simatic net drivers.\nWiring\nL2: Wiring between the card and the stations is standard RS-485. Fibre optic\nlink modules (OLM’s) and copper may be used. No external terminators\nas such are required, however it is necessary to set up terminating\nswitches at the end of cable runs. As physical wiring is not within the\nscope of this document, please consult documentation accompanying the\ncommunication modules for details.\nH1: Use an AUI to BNC /UTP /Fibre converter to connect to the LAN.\nHardware installation\nWhen using Advanced PC configuration package, please follow the automatic\ninstallation process in the SIMATIC manuals.\nCP5412-A2\nUnless the card is already successfully installed and working in the host machine the\nfollowing steps must be followed. If the card is already installed, determine the I/O\nport and IRQ used and then follow the instructions in the Sinec Driver installation\nand setup section after removing or disabling the existing drivers.\nPrinted 01-Oct-02\n\n[Page 3]\nSiemens Step7 Functions: SIES7FN\n3. Make a note of all driver settings for each device. (you could back up\nthe registry key using regedit).\n4. Delete each device\nThe following steps can be followed to disable the existing NT device driver.\n1. Open Control Panel.\n2. Double click on the Devices applet.\n3. Find and select the old driver.\n4. Then click on Startup and change it to disabled.\n5. Reboot for the change to take effect.\nUnless the existing driver has an uninstaller, do not remove any files until you are sure\nthey are not needed.\nHardware installation: Ethernet\nYou will need to install an Ethernet card in your PC with the relevant driver, you can\nthen add NetBEUI or other protocols as normal.\nWhen installing the H1 component from the CD, you will be prompted to install the\nSINEC driver called “SIEMENS Industrial Ethernet (ISO)” from the Simatic net CD,\nthis driver must then bind to your network card which will connect to the PLC.\nOtherwise follow similar instructions as for L2.\nHardware installation: CP5613\n1. Install the SIMATIC NET software components first\n2. Shut down, and insert the CP card.\n3. Upon start-up, Windows 2000 Professional will find the PCI P&P card, and\ninstall the card-drivers for you from the CD.\n4. Open the applet called “Setting up the PC-PG Interface” from control panel;\nverify card is installed OK.\n5. Continue below.\nDriver installation and setup\nInstallation overview\nThe software installation is divided into 2 parts. The Sinec software must be installed\nfirst, followed by the Adroit driver installation. 3 different versions of Siemens\nsoftware are catered for.\nSinec Software Installation\nIf using the Advanced PC Configuration disk please jump to that section below.\nIf using S7-RedConnect please jump to the S7-Redconnect install procedure section\nbelow.\nBefore you will be able to install the SIES7FN driver in Adroit, you must install the\nRelevant Simatic Net Driver software and transfer the license from the key disk\nsupplied. H1 users must install the Industrial Ethernet component here instead. If you\nenter the Adroit Setup\\Drivers option without installing the S7 WinNT drivers first,\nyou will NOT see the SIES7FN driver appear in the list of available drivers. If using\nany other CP, install the relevant components.\nPrinted 01-Oct-02\n\n[Page 7]\nSiemens Step7 Functions: SIES7FN\nOnce you accept this configuration, the SINEC setup dialogue will look similar to that\nshown below.\nSimatic net version 4 installation instructions:\nWhen the installation completes you should re-boot your computer.\n5. Run the application “Setting the PG-PC interface.\n6. Select the Access point of Application, this is the name for the device\ndriver for the local CP card.\n7. Select the communications option (MPI or PROFIBUS). H1 users must\nselect “OSI Ind. Ethernet”.\n8. Click on properties to configure the parameter set. (see below)\n9. Click on the checkbox to enable the S7 functions software, select the\nwincc.ldb file. (After you have configured the adroit driver, a new\nselection becomes available here, then you can select the adroit.ldb file.)\nPrinted 01-Oct-02\n\n[Page 25]\nSiemens Step7 Functions: SIES7FN\n40.10.10.10\nRemote TSAP\nThis is divided into 2 hexadecimal numbers. First is the\ndevice number 01=PG, 02=OS, 03=Other (Adroit) then after\nthe period comes the rack and slot.\nυ bits 7..5 = rack (subsystem)\nυ bits 4..0 = slot\ne.g. 03.02 = Non S7 or other, with rack zero slot 2.\nThe slot number is the starting slot number in which the\nCPU resides. Slots are numbered from the left starting at one.\nDepending on the model of CPU, different slot rules may\napply, see relevant Simatic documentation for particulars.\nMonitor PLC\nwatchdog\nEnable the watchdog facility (default = off)\nWatchdog\naddress\nA register or word address where the watchdog variable is\nfound.\nWatchdog\nThe duration in seconds between each watchdog test done by\nthe driver.\nBrowse previous / next device\nCP Setup\nThe Sinec setup program can be run directly from this button.\nA RSAP is not required, since 00.00 is assumed. When assigning L2 BUS addresses;\nremember that an unused address must always be reserved between stations on the\nBUS. Only use either odd or even addresses. Address zero should also not be used,\nsince it is reserved for a PG or diagnostic node. If using MPI, the remote tsap to use\nmay be 01.00.\nWatchdog configuration\nWatchdog configuration is optional, and is intended to allow detection of the started\n/stopped state of the PLC. Without the watchdog a user has no way of knowing that\nthe remote CPU has gone into stop mode, since the communications processor, being\nseparate, continues to function as normal. If not required the watchdog checking\nshould be disabled.\nWatchdog operation\nIf enabled the watchdog operates by flagging the device as off-line, almost as if there\nwas a cable fault. The driver then polls the configured 16-bit word at 10-second\nintervals. If the PLC variable’s value is zero, the driver flags the device as on-line, and\noverwrites the zero with a one. If the PLC variable’s value is not zero, the driver will\nre-test the variable 2 more times, before flagging the device as off-line. The extra 3\ntries constitute a grace period, after that all scanning will be bad until the watchdog\nvariable is zeroed. The driver continues to poll during this time.\nWatchdog PLC coding\nThe simplest PLC code should simply zero the watchdog variable on every cycle.\nThe watchdog may also be used to detect the presence of the SCADA, by doing the\nwatchdog in an OB executed every 5 seconds. The OB must test the variable before\nsetting it to zero, if the test fails 4 times in a row, it can be assumed that the Adroit\nPrinted 01-Oct-02\n\n[Page 32]\nSiemens Step7 Functions: SIES7FN\nSimatic.Net Compatibility\nAny driver revision is backward compatible with Simatic.Net but not forward\ncompatible. Here is the Driver revisions that is compatible with the various\nSimatic.Net versions:\nDriver revisions 1 – 30 supports any Simatic.Net versions up to and including\nSimatic.Net v6.2!\nDriver revisions 31 – 33 supports any Simatic.Net versions up to and including\nSimatic.Net v6.3!\nDriver Revision 34 supports any Simatic.Net versions up to and including\nSimatic.Net Software Edition 2008!\nTroubleshooting\nWhile every attempt has been made to ensure technical accuracy, different software\nand hardware versions may operate in an undesired/unexpected fashion. We thus\nwelcome any comments and suggestions, and will include any pertinent technical data\nsubmitted.\nI cannot see the driver in the available list in Setup\nThe driver will only appear in the list, once the simatic networking API files\n(SPIAPI.DLL etc) from Seimens have been installed. Follow the Simatic installation\nprocedure.\nLicense required message appearing\nYou will need to acquire one of the licenses described in this message to operate this\npackage. Please contact your siemens representative and quote the GK number and\npackage description. The message will appear on loading and at other times while\nusing the package. Our driver will still function correctly, if you acknowledge this\nmessage each time it appears.\nIf Using “Advanced PC configuration”\nEnsure that your Application name is “ADROIT”.\nIf you download a new configuration to this PC, return to the driver setup, and verify\nyour settings by clicking OK in the driver setup. Re-start the agent server to ensure\nproper operation.\nRestarting\nIf Adroit driver configuration is changed, the Agent server must be re-started to accept\nthe new changes. Only re-boot if you change parameters within the SINEC set-up and\nthe save dialogue tells you that a reboot is required to put the changes into effect. I.e.\nbus parameters changed. If using the version 4 of SIMATIC NET software, re-booting\nthe PC may always not be required when changing settings, use the reset and restart\nfeature in the PG-CP setup program. If bus address conflicts are suspected shut down\nPrinted 01-Oct-02\n\n[Page 37]\nSiemens Step7 Functions: SIES7FN\nThe CP card may be a CP5613, or your existing Ethernet adapter, a Simatic net driver\nis installed in the case of Ethernet that uses your existing windows Ethernet driver.\nThe Simatic drivers and the API together manage connections configured in a\ndatabase, the database is roughly organized to allow many different applications\n(programs) to communicate to PLCs without interfering with each other. At the lowest\nlevel, the database holds a CP card.\nThis means that each application will have a\nnumber of connections, each connection will be\nassociated with a single CP. In Adroit, we\nassociate a connection with a device, since\nnormally you will sue one connection per PLC\nyou need to communicate to. Nothing however prevents the configuration of 2\nconnections whose parameters are for the same PLC. Adroit will still see them as\nseparate devices. Applications are differentiated by their names. “OPC Server” is an\nexample of an application with no connections. An application thus only needs to\nknow the connection name, the connection uses a specific set of parameters, and a CP,\nall of which are hidden from the application, allowing the user flexibility to use new\nkinds of CP cards and connection parameters freely.\nSo all of this information lies in a database, when you “download” you are actually\nupdating the local connection database, which gets used by any applications (the\nConnection appears twice?\nConnections will sometimes appear under 2 CPs in our driver, that is because a\nconnection on a CP that has multiple names is still the same CP, Example a CP_5613\nis equivalent to the same CP_L2_1:, which is the same in some cases to MPI.\nSelecting either CP will work, since the CP parameters are all actually the same, and\nso are the connection parameters.\nMPI\nIf using a CP 5613 to connect to the MPI port of a PLC, you must select MPI for the\ncard, you will know you have done this correctly if you cannot specify any profibus\nparameters for the CP, besides the baud-rate. The default rate is 187.5 Kbs.\nAppendices\nAbbreviations and Terms\nApplication\nPC station module for PC Applications and drivers.\nConnection\nA physical connection point with"}, {"title": "Siemens SIE3964R", "href": "drivers_html/Siemens_SIE3964R.html", "category": "Drivers", "rel": "drivers_html/Siemens_SIE3964R.html", "kind": "Driver", "text": "[Page 1]\nSiemens : SIE3964R\nPrinted 19-Apr-22\n14-1\n  : Siemens SIE3964R protocol driver\nOverview\nAdroit supports the Siemens S5 3964/R driver protocol.\nPLC Details\nProtocol - 3964 No BCC checking, 3964R BCC checking.\nLocal Details\nPort - The available serial ports on your machine\nBaud Rate - The speed of data transmission. Any of the following Baud Rates may be\nspecified: 2400, 4800, 9600, or 19200.\nParity – (Default even) Select none, odd or even as required.\nRetry - The number of times that Adroit will try to gain communication with a PLC\nbefore failing a transaction.\nWiring\nPLC 25 pin\nPC 25 pin\nShield\nNote:\nConnect shield to PLC side only\n\n[Page 2]\n14-2\nPrinted 19-Apr-22\nPLC software is required to allow communication with the CP524 and CP525 cards.\nSupported addresses\nSiemens S5 PLC data address types supported by the SIE3964R Adroit Protocol driver\nVersion 1.0\nDevice\nMin\nRange\nInput Bytes\nIB 0.0\nFlags Bytes\nFB 0.0\nTimers\nZB 0\nDB 0:DW 0.0\nDB 255:DW 255.15\nDigital\nX\nDB 0:DW 0\nDB 255:DW 255\nSigned\nInteger\nX\nX\nDB 0:DD 0 KF\nDB 255:DD 255 KF\n32 Bit\nInteger\nX\nX\nDB 0:DD 0 KG\nDB 255:DD 255 KG\n32 Bit\nIEEE Float\nX\nMessage protocol\nThe SIE3964R protocol involves a number of separate instructions for each memory read\nor memory write transaction. This is a point-to-point protocol and therefore device\naddressing is not supported.\nThe basic sequence of events for any transaction is displayed below. The arrows indicate\nP (for Protocol Driver) and S (for Siemens) to denote direction of communication. The\ntransaction data may be read or write requests.\nThe master (protocol driver) commences the transaction with:\nMnemonic\nValue\nHi, are you ready?\nDLE\n10h\nHere's the message\nDLE\n10h\nEnd of message\nDLE\n10h\nWithin 5 seconds, the slave (Siemens device) responds with:\nMnemonic\nValue\nHi, are you ready?\nDLE\n10h\nPS\nHere's my response\nDLE\n10h\nEnd of message\nDLE\n10h\nFollow-on telegrams are not supported/used by the protocol driver.\nThe rest of this section will concern itself only with the [Transaction] and with the\n[Response] structures.\n\n[Page 3]\nSiemens : SIE3964R\nPrinted 19-Apr-22\n14-3\nThe 3964R protocol uses the last byte of these structures as a byte checksum. The 3964\nprotocol does not use checksums. The checksum capability is configured per SIE3964R\nconnection device in the protocol driver setup procedure.\nThe 3964/3964R protocol employs DLE doubling in these structures whereby any DLE\nthat forms part of the data is padded immediately with another DLE.\nOutput flag bytes 0-255\nRead request:\nFetch\nInput flag bytes 0-255\nRead request:\nFetch\nData\nSource H Source L Number H\nNumber L\nCF\nError\nnum\n1st data byte\nnth data byte\nxx\nxx\nWrite request:\nNot allowed\nFlag bytes 0-255\nRead request:\nFetch\n1st data byte\nnth data byte\nxx\nxx\nData blocks 0-255, data words 0-255\nRead request:\nFetch\nData\n\n[Page 4]\n14-4\nPrinted 19-Apr-22\n1st data byte\nnth data byte\nxx\nxx\n1st data\nbyte\nError\nnum\nDocument Revisions\nDate\nNew screenshot, showing parity selection option, fixed wirrring diagram\ncharacters to be lines."}, {"title": "Sigfox", "href": "drivers_html/Sigfox.html", "category": "Drivers", "rel": "drivers_html/Sigfox.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-D_SIGFOX.docx\nP a g e | 3\n1.\nOverview ............................................................................................................................................. 4\n2.\nWiring ................................................................................................................................................. 5\n3.\nDevice Configuration .......................................................................................................................... 6\n3.1.\nPart 1 ............................................................................................................................................. 6\n3.1.1.\nSetting up Devices on the Sigfox Cloud ....................................................................................................... 6\n3.1.2.\nSigfox Backend Hierarchal Structure ........................................................................................................... 7\n3.1.3.\nCreating a new Device Type ...................................................................................................................... 8\n3.1.4.\nCreating a new Device............................................................................................................................... 9\n3.1.5.\nSetting up the Sigfox Callback .................................................................................................................... 9\n3.1.6.\nSetup Validation ...................................................................................................................................... 10\n3.2.\nPart 2 ........................................................................................................................................... 11\n3.2.1.\nSetting Up the Adroit Sigfox Driver ............................................................................................................ 11\n3.3.\nConfiguration Dialog ...................................................................................................................... 13\n3.3.1.\nDriver Details .......................................................................................................................................... 14\n3.3.2.\nPrimary Connection Parameters ................................................................................................................ 14\n3.3.3.\nREST API ................................................................................................................................................ 14\n3.3.4.\nHTTP Server ............................................................................................................................................ 14\n3.3.5.\nScript ...................................................................................................................................................... 14\n3.3.6.\nTimeOut ................................................................................................................................................. 14\n4.\nSupported Addresses ........................................................................................................................ 15\n4.1.\nExample ....................................................................................................................................... 16\n5.\nProtocol Definition and Considerations ............................................................................................ 17\n5.1.\nFinal Verification ........................................................................................................................... 17\n6.\nGeneral Notes and Troubleshooting ................................................................................................. 18\n6.1.\nContact Details .............................................................................................................................. 18\n6.2.\n6.3.\nTroubleshooting ............................................................................................................................ 18\n7.\nRevisions ........................................................................................................................................... 21\n7.1.\nDocument Revision........................................................................................................................ 21\n7.2.\nDLL Revision ................................................................................................................................. 21\n\n[Page 4]\nATQMS-DRVR-DOC-D_SIGFOX.docx\nP a g e | 4\n1. Overview\nSigfox is a Low Power Wide Area Network (LPWAN) technology that allows Sigfox enabled devices\nto send small packets of data to the Sigfox Cloud (dedicated Sigfox servers on the internet). Sigfox\nuses a very light-weight protocol, so devices consume very little power and can operate over large\ndistances.\nAs shown below, the Sigfox network consists of objects (devices), Sigfox Stations (gateways) and\nthe Sigfox cloud (internet). Objects are Sigfox compliant sensors that send data over the air to the\nSigfox base stations, which then routes the data to the Sigfox Cloud (also known as the Sigfox\nbackend). The Adroit Sigfox Driver then communicates with the Sigfox cloud via an API or a call-\nback, to retrieve the objects data.\nFigure 1 Sigfox Overview\nThis Sigfox Driver document is divided into two parts:\nSetting up and registering objects/devices onto the Sigfox cloud.\nSetting up the Adroit Sigfox driver to communicate to the Sigfox cloud.\nPLEASE NOTE\nThe Sigfox cloud can store a maximum of 1 years’ worth of data per device.\n\n[Page 9]\nATQMS-DRVR-DOC-D_SIGFOX.docx\nP a g e | 9\nPLEASE NOTE\nContracts cannot be changed once device type is created.\nIn figure 4, the most important fields are the Device Type name (keep to naming conventions), the\ncontract (discussed above), the payload parsing (keep this as Regular). Downlink data is if you are\nwriting information down to the device from the Sigfox backend. This is not currently implemented\nin the Sigfox driver, so keep this field (Downlink Mode) as NONE.\n3.1.4. Creating a new Device\nOnce the device type is created, then we can register our device to that device type. Figure 5 displays\nthe parameters required for registering a new device.\nFigure 5: Creating a New Device\nIn Figure 5, the Device ID (keep to naming conventions), PAC and end product certificate must be\nsupplied by the manufacturer of the Sigfox device. For instance, if VisioSoft manufactured the device,\nthen communicate with them to get this information.\n3.1.5. Setting up the Sigfox Callback\nThe Sigfox Callback is used to send data to a specific computer on the internet when the value of a\ndevice changes on the Sigfox backend. As shown in Figure 6, the callback is a query string with a\npublic facing IP address (41.185.80.219) and an open port (5004) on the machine. This should be\nthe IP address of the computer where Adroit is running. An example of the query string is:\nhttp://41.185.80.219:5004/sigfox_data?id={device}&time={time}&data={data}&snr={snr}&statio\nn={station}&avgsnr={avgSnr}&lat={lat}&lng={lng}&rssi={rssi}&seqNumber={seqNumber}\nPLEASE NOTE\nYour computer must have a public IP address and the port in the callback string must be opened\non the firewall on the computer that is running Adroit.\n\n[Page 14]\nATQMS-DRVR-DOC-D_SIGFOX.docx\nP a g e | 14\n3.3.1. Driver Details\nEnable Secondary – (Default = OFF) Allows enabling of redundant Sigfox Cloud connections such\nthat in case of a failure, a switchover will occur.\nPrimary – Allows configuration setting of the Primary Sigfox Cloud connection.\nSecondary – Allows configuration setting of the Secondary Sigfox Cloud connection.\n3.3.2. Primary Connection Parameters\nEnable shadow scanning from master to standby – (Default = OFF) If enabled will stop any\ncommunication to the Sigfox Cloud when the Agent server is in standby mode. By default, parallel\nscanning is assumed.\nEnable standby reads – (Default = ON) Allows reading from the Sigfox Cloud when Agent Server\nis in standby mode.\nEnable standby writes – (Default = OFF) Allows writing to the Sigfox Cloud when Agent Server is\nin standby mode.\n3.3.3. REST API\nUser – This is the API Access Login name from the Sigfox Backend, see Figure 13.\nPassword – This is the API Access Password from the Sigfox Backend, see Figure 13.\nDevice type ID – The Device Type ID from the Sigfox Backend, as shown in Figure 5.\n3.3.4. HTTP Server\nPort – The port which the Sigfox Backend will use to connect to Adroit. Make sure this port is open\non the firewall and accessible from the internet. This port must be used in the Callback query string,\nas shown in Figure 6.\n3.3.5. Script\nScript File – Load the script file to parse the Device Type payload.\n3.3.6. TimeOut\nContact Exceeded Time – If Adroit does not receive a payload from a specific device within this\namount of time, the device will mark bad. Due to the 140 message constraint, the minimum contact\nexceeded time is 10 minutes. A value of 0 will disable this functionality.\nPLEASE NOTE\nThe computer that has Adroit installed and running must have internet access. In addition, all\nrelevant Sigfox ports must be accessible from the internet.\n\n[Page 18]\nATQMS-DRVR-DOC-D_SIGFOX.docx\nP a g e | 18\n6. General Notes and Troubleshooting\n6.1.\nContact Details\nPhone: +27 11 658-8100\n6.2.\nFor additional information, please refer to our Knowledgebase website:\nLatest Drivers topics - Features, discussions, tips, tricks, questions, problems and feedback\n(adroittechnologiesautomation.com)\n6.3.\nTroubleshooting\nWhen troubleshooting a Sigfox Driver problem, it is important to understand where the source of\nthe problem is. Please use the Sigfox device Datascope as a tool to try debug the problem. The\nfollowing steps will hopefully be a guide in troubleshooting a faulty Sigfox device that is trying to\n1. Step 1: As shown in Figure 17 below, if the device cannot be found on your Sigfox backend,\nthen you need to register that device onto the Sigfox backend (see Part 1 of this document). If\nit was registered, then check if it was deleted, moved or if you are searching in the correct\nSigfox group.\nFigure 17: Device Not Found\n2. Step 2 is to check if the device and device type contracts have expired. In Figure 18 below, the\nadroit_t_50bb_820c contract is clickable, this is where you can check if the devices and device\ntype contracts are still valid.\n\n[Page 19]\nATQMS-DRVR-DOC-D_SIGFOX.docx\nP a g e | 19\nFigure 18: Check Contract Validity\n3. Step 3 is to check if the information on the Sigfox backend is correct for that specific device, as\nshown in Figure 19 below.\nFigure 19: Verify Device Payloads\nIf the signal strength is bad, then packets could be lost. Check the times of each message\nand check if this correlates to the devices contract (140/50/2 messages per day). Also\ncheck if the payload of these messages are what you expect, if you are unsure how to\ninterpret the payload, then contact Adroit support or the device manufacturer. This is the\nfirst place to check if you are reading incorrect values in Adroit from the device.\nIf the timestamp is very old, and a lot of messages are being lost, then check if the device\nis turned off, if the battery died or if the device moved to a location with bad signal\nstrength.\n4. If the callbacks are failing, as shown in Figure 20 below. Then the callback URL for the device\ntype associated to that device might be incorrect. The port needs to be opened on the relevant\nfirewalls and servers and the IP address must be a static public IP address. If the Agent Server\nis not running on the machine waiting for the callback, then the callback will also fail. Note that\nmultiple callbacks can be setup for a device type and if one of them fails (and the rest\nsucceed), then the icon will go red. Also make sure the User, Password and Device Type ID are\ncorrect in the Adroit Sigfox Driver Configuration.\nFigure 20: Callback Failure"}, {"title": "Spectrum Tele-RANGER", "href": "drivers_html/Spectrum_Tele-RANGER.html", "category": "Drivers", "rel": "drivers_html/Spectrum_Tele-RANGER.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-SPECTR.docx\nP a g e | 3\n1.\nOverview ............................................................................................................................................. 4\n2.\nWiring ................................................................................................................................................. 5\n3.\nDevice Configuration .......................................................................................................................... 7\n3.1.\nDevice Configuration ....................................................................................................................... 7\n3.1.1.\nPort Settings (Device Specific) ................................................................................................................... 7\n3.1.2.\nCentral Station Details (Global affects all devices) ........................................................................................ 8\n3.1.3.\nOutstation Logging “GL” Functions (Device Specific) ................................................................................... 8\n3.1.4.\nOutstation Modem Identification Strings (Device Specific) ............................................................................. 8\n3.1.5.\nOutstation Details (Device Specific) ............................................................................................................ 9\n3.1.6.\nOutstation Checksum Generation (Device Specific)....................................................................................... 9\n3.2.\nModem Dialog ............................................................................................................................... 10\n3.3.\nMaster/Standby ............................................................................................................................. 11\n4.\nSupported Addresses ........................................................................................................................ 12\n4.1.\nModem Configuration Strings (x2 command set) ............................................................................. 12\n4.1.1.\nExample Connection String: ...................................................................................................................... 12\n4.2.\nBasic Structure of Driver ................................................................................................................ 13\n4.3.\nLog Retrieval................................................................................................................................. 13\n4.4.\nAddressing Notation ...................................................................................................................... 14\n4.5.\nTeleRanger Module Types and Commands ...................................................................................... 16\n5.\nProtocol Definition and Considerations ............................................................................................ 17\n5.1.\nBasic Telegram Format .................................................................................................................. 17\n5.2. ........................................................................................................................................................... 17\n5.3.\nFields ........................................................................................................................................... 17\n5.3.1.\nCommand Type Breakdown ...................................................................................................................... 17\n5.3.2.\nCommand Words ..................................................................................................................................... 18\n5.4.\nDatascope Display ......................................................................................................................... 19\n5.5.\nAdvanced Registry Features: (rev 41 and above) ............................................................................ 19\n6.\nGeneral Notes and Troubleshooting ................................................................................................. 20\n6.1.\nContact Details .............................................................................................................................. 20\n6.2.\n7.\nAppendix A – How to Troubleshoot and Setup Modems. .................................................................. 21\n7.1.\n1st Steps ....................................................................................................................................... 21\n7.2.\nFor Remote Modem ....................................................................................................................... 21\n7.3.\nFor Master Modem ........................................................................................................................ 21\n8.\nRevisions ........................................................................................................................................... 22\n8.1.\nDocument Revision........................................................................................................................ 22\n8.2.\nDLL Revision ................................................................................................................................. 22\n\n[Page 4]\nATQMS-DRVR-DOC-SPECTR.docx\nP a g e | 4\n1. Overview\nAdroit supports communications with the Spectrum TeleRanger Radio Telemetry System, using the\nProtocol Driver SPECTR.DLL. Related documents that may be read in conjunction with this document\nare:\nEngineering Note EN-5 SCADA Protocol Serial Interface for the tele-RANGER Radio Telemetry\nSystem\n\n[Page 8]\nATQMS-DRVR-DOC-SPECTR.docx\nP a g e | 8\nTimeout (Sec) - The time (in seconds) that a response will be waited for, before retrying or timing\nout\nNumber of Retries - Number of times a link test (or other command) will be sent without receiving\nthe corresponding response, before a communications failure is flagged. Not inclusive\n3.1.2.\nCentral Station Details (Global affects all\ndevices)\nItems configured in this group are common to all outstations using the same serial port. What this\nmeans is if you want to change a parameter such as, say, Link Test Interval, you will need to change\nit for all other devices on that particular communications resource (com port), if not then a new port\nshould be used, which implies a different teleRanger RS-232 module, etc.\nPlease Note non device specific messages like SM and LT etc will not have a checksum at all, the\nspectrum device will not expect one either.\nCentral Station Address - The teleRanger central station address, C1 -> C2\nLink Test Interval (Sec) - The time (in seconds) between the sending of successive link test (“LT”)\ncommands from Adroit to the teleRanger central station. A time of zero disables link testing\nSynchronize All Telemetry Clocks (Startup) - When active, this check box will cause all\noutstations to be time synchronized with the SCADA system clock, This will happen once when the\ndriver loads. Manual syncs via OSCTL.5 will need to be done when in modem mode … OSHDR.16\ncan be driven via an Expression Agent.\nTime between “IR” messages The number of seconds to leave between any two stations\nperforming an “IR” or interrogate command.\nLatency (Sec) - The minimum time delay (in seconds) between the sending of ANY (IR or GL)\nrequest commands from Adroit to the outstation. Any one will reset the timer to force the other to\ndelay. This is NOT global it is only a delay between two IR/GL polls to the SAME station. Manual\ncommands (IR and GL) are unaffected and will go out as normal.\n3.1.3.\nOutstation Logging “GL” Functions (Device\nSpecific)\nGetLog Interval (Sec) - Default is 0 (disabled). This is a timer to generate an automatic GL request\nto a device every x Seconds. If set to 0 the timer is disabled and GL’s will have to be done from\nwithin adroit either via osctl.7 These Gl messages obey the OQD.\nLogs per batch - Default is 5. This is the number of logs to request either in autolog mode or via\nOSCTL.7 bit.\n3.1.4.\nOutstation Modem Identification Strings (Device\nSpecific)\nModem ID’s Enabled - Default : Checked, Used for backward compatibility to older tele-ranger\nequipment where no ID’s are available and where unsolicited mode is unavailable too.\n(ONLY Used In Modem MODE!)\n\n[Page 12]\nATQMS-DRVR-DOC-SPECTR.docx\nP a g e | 12\n4. Supported Addresses\n4.1.\nModem Configuration Strings (x2 command\nset)\nTested with US-Robotics 56k modems, compatible with x2 command set.\nSee Appendix A for additional modem topics.\nThis string is sent whenever Adroit attempt to communicate to a device, it is also sent at startup of\nthe agent server, and also if your stop/restart your device.\nTry to use Factory default settings if possible; AT&F\nTo use Auto answer mode on the modem: AtS0=n (where n = number of rings)\nTo not use Auto Answer, make sure you uncheck the AutoAnswer checkbox in the Modem Dialogue.\nMake sure AtS0=0 in your string.\nMake sure &D is 2, the driver needs normal DTR signals to do its hang-ups etc\nMake sure &C is 1, the driver needs normal Carrier detection to operate correctly.\n4.1.1.\nExample Connection String:\nAt&f&w0&w1 in “terminal” to reset to factory defaults and save profiles or you could allow adroit to\ndo it at startup.\nATE0&D2&C1S0=2&W0&W1\nEcho off | normal dtr | Normal cd | AA after 2 rings | Save profile to 0 and 1.\nThe Non Protocol or noise message above is not fatal, some modem handshake may be found to\nbe rejected as above … ok The “\\r\\n” etc are just the carriage return line feed converted to printable\nform they are not actually “\\r” they are non-printable and thus not detectable on the scope\notherwise!\n\n[Page 13]\nATQMS-DRVR-DOC-SPECTR.docx\nP a g e | 13\n4.2.\nBasic Structure of Driver\nBeing a Radio Telemetry System, teleRanger poses some special protocol driver development and\nconfiguration challenges:\nDelayed response. With PLC systems a read request is honoured immediately, whereas with\na radio telemetry system, several different requests can be sent out before a response to the\nfirst one is received. Also, the sequence in which responses arrive is totally unpredictable\nException-based. Instead of using a poll-response type protocol like most other Adroit protocol\ndrivers, the teleRanger driver operates in an exception- or event-based mode. This means\nthat messages arrive from the teleRanger equipment in an unsolicited fashion\nTime-tagged. The teleRanger protocol includes the possibility of tagging changes of state and\nother events with the time of occurrence. The protocol driver needs to be aware of time-\ntagged information and make sure that this time, as opposed to the current system time, is\nassociated with the event\nEven though Adroit directly connects to only a local teleRanger station, it must maintain\ncommunications, etc., on a per remote station basis. This is to prevent all stations being\nconsidered bad when only one station may be experiencing communication problems\nGiven all the above, the following diagram illustrates the context within which the teleRanger protocol\ndriver operates:\nFrom the above diagram it is clear that there is a direct correspondence between teleRanger stations\nand Adroit device agents, i.e. a separate device agent is configured for each teleRanger outstation.\nThe following diagram shows how the protocol driver connects via an RS232 link to the teleRanger\nlocal station\nThe local station connects via a radio network to its remote outstations. One can see on the above\ndiagram, shown in dotted, that it is possible for different instances of the teleRanger driver to use\ndifferent COM ports to other local stations that are part of completely separate radio telemetry\nsystems, if necessary.\n4.3.\nLog Retrieval\nFor datalog retrieval from the RTU via the tag OSCTL.7, or Autolog retrieval…\nAn Int/real tag must be scanned from OSLOG.1 to hold the count of remaining recor"}, {"title": "Strike EnerMAX", "href": "drivers_html/Strike_EnerMAX.html", "category": "Drivers", "rel": "drivers_html/Strike_EnerMAX.html", "kind": "Driver", "text": "[Page 1]\nStrike Enermax Power Meters : STKEMAX\nSTKEMAX : Strike Technologies EnerMAX\nOverview\nAdroit supports communication with the Strike Technologies Ener-max power meter.\nMeter Details\nPassword – Password required for any meter controls.\nOptical unit – Select this option to use the optical interface unit.\nRemote RS-232/485 – Select to use directly cabled option\nSerial #– Serial number to identify/address the unit.\nLocal Details\nPort - The available serial ports on your machine\nBaud rate – The default or connecting speed for the meter (300 for optical and 2400 if\nremote).\nComms Speed – The speed the driver must change to after connecting to the meter, the\nmeter returns to the default speed after every transaction.\nRetry - The number of times that Adroit will try to gain communication with a meter\nbefore failing a transaction.\nPrinted 31-Mar-99\n\n[Page 2]\nTimeout - The time that Adroit will wait for a valid response from a FED before failing a\ntransaction (Read or Write).\nNetwork/port Idle – time in seconds to wait between transactions, (values 1-15). This\ntime applies to all Reads and Writes out to the meter.\nNOTES: Settings are 1 start, 7 data, even parity and one stop bit. When using Optical\nunit, the initial baud-rate is always 300, on remote the rate can be changed, but should\nuse 2400.\nWiring\nCable for direct connection to power meter.\nPLC 25 pin\nPower\nmeter\nAddressable items in the Enermax power meter.\nDevice\nMin\nelse=0 if not\nRB 0\nRead profile\nelse=0 if not\nCR 0\nRead profile\nClear QOS data\nUNSUPPORTED\nReading Billing\nReading of Billing and status “BS” is achieved by toggling a digital scanned to “BT” to the\non state and then off (use a pulsed digital), this instructs the driver to update it’s billing\ndatabase on the next Adroit scan of any of the the Billing & Status “BS” tags. A\nExpression can thus be used to trigger the retrieval of data at specific times of the day.\nIf you do not scan “BT” (must be output enabled), polling will operate as normal. I.e. on\nevery scan, the driver will directly fetch fresh BS data.\nThe “BT” or Billing Trigger is more meaningfull, if your scan-time is short, example 4\nseconds (4000ms), since the driver will only poll Billing data on the next poll anyway. A\nPrinted 31-Mar-99\n\n[Page 6]\nLeading Varh – Total – Stack 1\nMeter Serial Number\nExcess Varh – Program – Stack 1\nMeter Software version and Date\nMD1 – Rate 1 – Stack 1\nMeter External VT Ratio\nMD2 – Rate 2 – Stack 1\nMeter External CT Ratio\nMD3 – Rate 3 – Stack 1\nNumber of Resets\nMD4 – Program – Stack 1\nNumber of Reprograms\nCumilitive MD1 – Rate 1 – Stack 1\nTime & Date of Last Reprogram\nCumilitive MD2 – Rate 2 – Stack 1\nNumber of Power Downs\nCumilitive MD3 – Rate 3 – Stack 1\nTime & Date of Last Power Down\nCumilitive MD4 – Pr ey appear in this table, up to and including #\n255 if it is present (driver revision #4).\nMessage protocol\nThis driver complies with a subset of the IEC 61107 (formerly 1107) specification and has\nonly been tested in communication with Strike Enermax power meters. It does not\nimplement any encryption/decryption features.\nCommunication follows a 3-step cycle.\nINITIATE REQUEST (OPTICAL):\nThe initiate step is common to all transactions, this is a log-on.\nInitiate request (local form)\nStart\ncharacter\nInitiate request (remote form)\nStart\ncharacter\nREAD BILLING DATA REQUEST:\nFollows on from initiate step.\nStart\ncharacter\nRead billing data response:\nStart\ncharcter\nData is in following format, one register per line\nRegister #\nStart\nlogoff is automatic.\nSET CLOCK:\nStart\n\n[Page 10]\n~RX: 075(00.0000*kVA) - OK [0.000]\n~RX: 076(00.0000*kVA) - OK [0.000]\n~RX: 077(00.0000*kVA) - OK [0.000]\n~RX: 078(00.0000*kVA) - OK [0.000]\n~RX: 079(00.0000*kVA) - OK [0.000]\n~RX: 080(00.0000*kVA) - OK [0.000]\n~RX: 081(00.0000*kVA) - OK [0.000]\n~RX: 082(00000.0*kvarh) - OK [0.000]\n~RX: 083(00000.0*kvarh) - OK [0.000]\n~RX: 084(00000.0*kvarh) - OK [0.000]\n~RX: 085(00000.0*kVAh) - OK [0.000]\n~RX: 086(00.0000*kVA) - OK [0.000]\n~RX: 087(00:00 00/00/00*) - OK [0.000]\n~RX: 088(00:00 00/00/00*) - OK [0.000]\n~RX: 089(00.0000*kVA) - OK [0.000]\n~RX: 090(Future Use*) - OK [0.000]\n~RX: 091(Future Use*) - OK [0.000]\n~RX: 092(Future Use*) - OK [0.000]\n~RX: 093(15:18 04/03/99*) - OK [920553480.000]\n~RX: 094(00000.0*kWh) - OK [0.000]\n~RX: 095(00000.0*kWh) - OK [0.000]\n~RX: 096(00000.0*kWh) - OK [0.000]\n~RX: 097(00000.0*kWh) - OK [0.000]\n~RX: 098(00000.0*kWh) - OK [0.000]\n~RX: 099(00000.0*kvarh) - OK [0.000]\n~RX: 100(00000.0*kvarh) - OK [0.000]\n~RX: 101(00000.0*kvarh) - OK [0.000]\n~RX: 102(00000.0*kvarh) - OK [0.000]\n~RX: 103(00000.0*kvarh) - OK [0.000]\n~RX: 104(00000.0*kvarh) - OK [0.000]\n~RX: 105(00.0000*kVA) - OK [0.000]\n~RX: 106(00.0000*kVA) - OK [0.00 is simply means that\nAdroit polled for a value, but the “BT 0” digital that was scanned has not yet gone high.\nThis digital needs to be pulsed as well.\nRegistry keys\nWhen using a Ethernet port-extender, it may be desirable to turn off the communications\nport restart logic in the driver. When enabled, the driver closes the hardware port, and\nre-opens it after a delay equal to the timeout setting. This causes problems in some port\nemulations. Change the setting\nDWORD ClosePortOnFailure = 1 to zero (0) to prevent the reset logic from running.\nRevision\nDate\nAdded datascope sample, and Troubleshooting section, corrected the\nPrinted 31-Mar-99"}, {"title": "Strike ENERMAX Plus", "href": "drivers_html/Strike_ENERMAX_Plus.html", "category": "Drivers", "rel": "drivers_html/Strike_ENERMAX_Plus.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-STKEMAXP.docx\nP a g e | 3\n1.\nOverview ................................................................................................................................................. 4\n2.\nWiring ..................................................................................................................................................... 5\n3.\nDevice Configuration .............................................................................................................................. 6\n3.1.\nDevice Configuration ............................................................................................................................ 6\n3.1.1.\nTCP/IP Settings .............................................................................................................................................. 7\n3.1.2.\nModem Settings .............................................................................................................................................. 7\n4.\nSupported Addresses .............................................................................................................................. 9\n5.\nProtocol Definition and Considerations ................................................................................................ 12\n6.\nGeneral Notes and Troubleshooting ..................................................................................................... 13\n6.1.\nContact Details ................................................................................................................................... 13\n6.2.\n7.\nAppendix A - Profile Modifiers .............................................................................................................. 14\n8.\nRevisions ............................................................................................................................................... 15\n8.1.\nDocument Revision............................................................................................................................. 15\n8.2.\nDLL Revision ...................................................................................................................................... 15\n\n[Page 5]\nATQMS-DRVR-DOC-STKEMAXP.docx\nP a g e | 5\n2.\nWiring\nStandard RS-232C cable (DTE-DTE) cross-over cable with or without handshaking.\nThe driver expects the communication link to be point-to-point due to the session-based protocol\nused.\nOR\nStandard Ethernet UTP Cable.\n\n[Page 6]\nATQMS-DRVR-DOC-STKEMAXP.docx\nP a g e | 6\n3.\nDevice Configuration\nComms Type – Select communications type:\nSelect ‘Serial’ for Serial communications.\nSelect ‘Ethernet’ for Ethernet communications.\nSerial ID – Serial identification number unique to the meter.\nRetry - The number of times that Adroit will try to gain communication with the meter before failing\na transaction.\nTimeout – The time that Adroit will wait for a valid response from the meter before failing a\ntransaction (Read or Write). Ensure proper timeout if using modem connection as it is much slower,\nwhere the maximum is 9600bps.\nModem – Opens the Modem Dialog if using Modem Connection.\nPort – The available serial ports on your machine.\n\n[Page 7]\nATQMS-DRVR-DOC-STKEMAXP.docx\nP a g e | 7\nBaud rate – (Default = 115200) Select a baud rate: 9600, 19200, 38400, 56000, 57600, 115200\nParity – (Default = Even)\nDataBits – (Default = 7)\nStopBits – (Default = 1)\nForce Sign-on – (Default = unchecked) If checked the driver will force a sign on and off for every\ntransaction used when having multiple serial devices on a bus network.\nWARNING: communications will be slower.\n3.1.1. TCP/IP Settings\nAddress – IP address of the meter.\nPort – (Default = 10001) The port configured for the meter.\n3.1.2. Modem Settings\nUse Modem – Enable/Disable the Use of Modem on RS232.\nDial Number – Number to dial that is situated at end device.\nModem Init String – String to Initialize Local Modem with before dialling.\nConnect Timeout – Time(ms) to wait for connection.\n\n[Page 10]\nATQMS-DRVR-DOC-STKEMAXP.docx\nP a g e | 10\n*2) The display reads numbers can be found in Emaxplus-CM-RDU-3rd-Party-0v01.xls\nPlease remember that Dx:y , x is the row and you usually want to scan D2:y not 1 , which will give you the\ndisplay name… but it can be scanned if you really want to… just use D1:y\n*3) 8 profile channels available as floating-point values, only Real/Analog agents will be supported for profile\ndata.\nWARNING\nChannels are dynamically ordered from the smallest period to the largest. If you add a channel or\nedit a channel in the meter, the SCADA MUST take this into account that channels positions could\nmove.\nExample: channel 1 period = 10 minute sample rate, channel 2 = 30 minute sample rate, now you\nadd channel 3 = 5 minute rate, then channel 3 will become channel 1 in memory, and the old 1\nand 2 will become 2 and 3 respectively. So, if channel 1 was VOLTS, and channel 3 was VARS, the\nnext profile read, channel 1 would have VARS instead of VOLTS. This is like swapping two digital\njumpers on a digital output card without telling the SCADA engineer to update the user interface\n– a wrong indication is presented.\nWARNING\nChannels cannot be skipped in the read. So, for example, if channel 2 were to be deleted from the\nmeter, the remaining channels would move down the list in this case channel 3 would move to\nchannel 2.\nProfile modifiers: Modifiers can be added to a channel to modify the value before it is sent to\nYou can multiply(divide) a value and/or subtract(add) a value. (See Profile Modifiers Appendix.)\n*4) These are administrative registers used in advanced function that may require more than one type of data\nto be present before execution can take place, for example profile retrieval of multiple days.\nAdmin area consists of 5 16bit registers only available to integer type agents such as Integer/Marshal.\nRegister 0 (Address A:0) is not persisted data, will be reset when the Agent Server restarts.\nRegister 1-4 (Address A:1-4) are persisted, so these will be preserved between Agent Server restarts, and\nthere is no need to save WGP file manually, the data is persisted to the device config in the registry.\nRegister 0 [bit packed 16 (unpersisted)]\n{ Bit 0 = Do time synchronisation (>20min will cause a fast set)\nBit 1 = Do profile read (will use Registers 2 and 3 for required parameters)\nBit 2 ... Bit 15 = not used yet.}\nRegister 1 [bit packed 16 (persisted)]\n{ Bit 0 = Enable “fetch yesterday” profile data (uses Register 4 as time in minutes from 00:00 to start)\nBit 1... Bit 15 = not used yet.}\nRegister 2 [unsigned short] = day offset from today for profile read (see bit 1 of register 0) (1 = yesterday)\n(0 = today) (>1 days further into the past)\n\n[Page 15]\nATQMS-DRVR-DOC-STKEMAXP.docx\nP a g e | 15\n(Aside from applying the TVF)\nSlot Type\nTo Do\nAllow user to choose if VT ratio to be applied\nxxxxxx.x\nCurrent\nAllow user to choose if CT ratio to be applied\nxxxx.xxx\nPower/Energy\nAllow user to choose if IMC to be applied\nUse demand category scaling\n8.\nRevisions\n8.1.\nDocument Revision\nRev.\nDate\nGrammar edits, formatting changes and\ncontent additions\nD. Jordaan\n3.0\n8.2.\nDLL Revision\nRev.\nDate\nEnabled serial support.\n3a\n10/09/2009\nadded documentation regarding P and A registers.\n3d\n06/10/2009\nadded documentation regarding P modifiers.\n02/07/2010\nadded modem support.\n18/01/2012\nExtra check on protocol to detect out of sequence messaging."}, {"title": "Toshiba ASCII", "href": "drivers_html/Toshiba_ASCII.html", "category": "Drivers", "rel": "drivers_html/Toshiba_ASCII.html", "kind": "Driver", "text": "[Page 1]\nToshiba : TOSHIBA\nToshiba ASCII protocol driver\nOverview\nThe TOSHIBA driver currently only supports the ascii-based protocol, the binary protocol\nis not supported in this driver. This driver supports the PROSEC T2 PLC, EX100 ,\nEX500. Communication is RS-485. The ADROIT TOSHIBA driver will act as the master\nin a master-slave transaction system.\nSee also: Toshiba binary driver and Toshiba Ethernet driver for T2.\nDevice Configuration\nPLC Details\nPLC Station ID - Up to a maximum of 32 PLCs may be addressed.\nLocal Details\nPort - The available serial ports on your machine.\nBaud rate - This is configurable. The TOSHIBA PROSEC T2 PLC supports the\nfollowing baud rates : 300, 600, 1200, 2400, 4800, 9600 or 19200 bps. Select the\nappropriate baud rate from the dialogue’s drop-down list.\nParity - This is configurable. Valid choices are None, Odd or Even.\nPrinted 28-May-97\n\n[Page 2]\nProtocol Driver Setup Manual\nData bits - This is configurable. Valid choices are 7 or 8 bits.\nStop bits - This is configurable. Valid choices are 1 or 2 bits.\nRetry - This is the number of times the ADROIT TOSHIBA driver will attempt a\nparticular scan job before failing.\nTimeout - This is the maximum time the ADROIT TOSHIBA driver will wait for a\nresponse to its request message from the PLC.\nOptimisation (Global affects all devices)\nPrioritize write – Check this check box to ensure the driver will optimize writes.\nWiring\nThe Computer Link Port on the PLC must be used for communications between ADROIT\nand the PLC. This port accepts a 4-wire RS-485 interface. The Computer Link Port is a\nstandard 15-pin female connector. The following table shows the pin assignment of the\nComputer Link Port :\nPin No.\nSignal name\nRequest to send\nPLC →\nHost\nClear to send\nPLC ←\nHost\nThe driver was tested with the PC labs RS 422/485 card.\nPrinted 28-May-97\n\n[Page 3]\nToshiba : TOSHIBA\nSupported Commands\nArea\nXW0.0 - XW0.15\nN/A\nExternal Input\nYW0.0 - YW0.15\nN/A\nExternal Output\nZW0.0 - ZW0.15\nN/A\nLink Relay\nRW0.0 - RW0.15\nN/A\nAuxiliary Relay\nD0.0 - D0.15\nD0 S2\nData Register\nC0.0 - C0.15\nN/A\nCounter Register\nT0.0 - T0.15\nN/A\nTimer Register\nNote: Strings are only supported for Data Registers by Adding “S” at the end of the\naddress with the amount of characters required!\nExample: D:100 S20\nMessage protocol\nThe checksum value is the ASCII code of the lower two digits of the sum of all the values\nof all the bytes in a message starting from the first byte until the “&” termination byte.\nTelegram examples shown below. All values shown are in ASCII-HEX unless specified\notherwise.\nRead request:\n… continued …\nChecksum\nDelimiter\n\n[Page 4]\nProtocol Driver Setup Manual\nAdvanced Registry key settings\nThe following settings are not configurable in the normal fashion and are accessible via\nthe registry.\nOpen the registry editor and go to …\nrivers\\TOSHIBA\n..then open each device, and open “Primary”. Add the appropriate key (DWORD)\nClose port on failure: If ethernet serial extenders hang, try changing the value\nClosePortOnFailure, If the key does not exist add it as type dword , 1 means\nclose port if failed , 0 means don’t close the port. Driver default is 1.\nDocument Revisions\nDate\nFixed document margins and minor formatting adjustments done. Some\nredundant statements removed.\n16-Apr-08\nAdded String support to Driver on Data Registers. – Rev 13\nPrinted 28-May-97"}, {"title": "Toshiba T2 Ethernet", "href": "drivers_html/Toshiba_T2_Ethernet.html", "category": "Drivers", "rel": "drivers_html/Toshiba_T2_Ethernet.html", "kind": "Driver", "text": "[Page 1]\nToshiba : TOSHIBA\nToshiba T2 Ethernet protocol driver\nOverview\nThe TOSHIBA Ethernet driver currently only supports the ascii-based protocol. This driver\nsupports the PROSEC T2 PLC. Communication is UDP/IP. The ADROIT TOSHIBA driver will\nact as the master in a master-slave transaction system.\nPLC Details\nIP Address - This must be any available class B address on the network ie(OCTET1 must be >\n127) setup in the PLC.\nPort - The first available UDP port setup in the PLC\nLocal Details\nRetry - This is the number of times the ADROIT TOSHIBA driver will attempt a particular\nscan job before failing.\nTimeout - This is the maximum time the ADROIT TOSHIBA driver will wait for a response to\nits request message from the PLC.\nLocal UDP Port – For indication only of the Local UDP port used for this device. NOTE: This\nis not a fixed parameter it can change at startup depending on available ports.\nWiring\nStandard Ethernet interconnection. (10BASE-T)\nPrinted 28-May-97\n\n[Page 2]\nProtocol Driver Setup Manual\nSupported Commands\nArea\nXW0.0 - XW0.15\nExternal Input Register\nYW\nYW0\nYW0.0 - YW0.15\nExternal Output Register\nZW\nZW0\nZW0.0 - ZW0.15\nLink Relay Register\nRW\nRW0\nRW0.0 - RW0.15\nAuxiliary Relay Register\nD\nD0\nD0.0 - D0.15\nData Register\nC\nC0.0 - C0.15\nCounter Register\nT\nT0.0 - T0.15\nTimer Register\nMessage protocol\nThe checksum value is the ASCII code of the lower two digits of the sum of all the values of all\nthe bytes in a message starting from the first byte until the “&” termination byte.\nTelegram examples shown below. All values shown are in ASCII-HEX unless specified\notherwise.\nRead request:\n\n[Page 3]\nToshiba : TOSHIBA\nWrite Acknowledgment:\nStart\nFirst release notes!\nPrinted 28-May-97"}, {"title": "Unitronics PCOM NET", "href": "drivers_html/Unitronics_PCOM_NET.html", "category": "Drivers", "rel": "drivers_html/Unitronics_PCOM_NET.html", "kind": "Driver", "text": "[Page 1]\nUNITRONICS PCOM_NET M90 : UNI_M90\nUNITRONICS PCOM_NET protocol driver\nOverview\nAdroit supports communication with the following Unitronics Devices:\nM90-19-B1A or UNRESTRICTED for the other modifiable models.\nThis driver has be tested with M-90 and a M-210.\n\n[Page 2]\nUNITRONICS PCOM_NET M90 : UNI_M90\nPLC Details\nPLC Model – Select ‘M-90’ for standard M-90\nSelect ‘Unrestricted’ if the device is extended unrestricted provides\nfor protocol maximums (not Device maximums).\nPLC Station ID – Network address if networked.\nLocal Details\nPort – The available serial ports on your machine.\nParity – default : even\nDataBits – default : 7\nStopBits – default : 1\nBaud rate – default : 9600, (9600,19200,38400,57600)\nRetry - The number of times that Adroit will try to gain communication with a PLC\nbefore failing a transaction.\nTimeout - The time that Adroit will wait for a valid response from a PLC before\nfailing a transaction (Read or Write).\nUse 3Wire (Disable signaling) – (Default is off i.e. signalling enabled)\nCheck this if you want to use 3 wire only.\nNote for M-2xx series users:\nThe M-2xx series must have a function block loaded via Unitronics programming\nsoftware !\nEg PCOM_NET , PCOM_NS\nwhere various settings are made available eg Addressing, Rs232 settings not\nnormally available from the faceplate!\nNB – if retries persist continually : try lowering DTR delay settings in the function\nblock!\nNB – Make sure if you have hardware handshaking enabled use the correct rs232c\ncable (not 3 wire)\n\n[Page 3]\nUNITRONICS PCOM_NET M90 : UNI_M90\nWiring\nCable connection for RS232C communication (Connection between PLC and\nComputer)\nSupported addresses\nM90 PLC data address types and maximum ranges supported by the Adroit M90\nProtocol driver.\nDevice\nWrite\nDI Area\nM-90 model can be extended , hence\n*1 -not larger than 255 (M90 Device limit), 2048(Protocol limit)\n*2 -not larger than 255 (M90 Device limit), 2048(Protocol limit)\n*3 -not larger than 255 (M90 Device limit), 65535(Protocol limit)\n*4 -not larger than 255 (M90 Device limit), 65535(Protocol limit)\n*5 -not larger than 255 (M90 Device limit), 65535(Protocol limit)\nSize specifier (eg W) for Integers and Reals are not used but the default (W) is\nspecified , this is to cater for possible future changes\nConnector of PC side\n(Female D9)\nConnector of PLC side\n(RJ-11)\nDtr 1\n0V Ref 2\nTxD 3\nRxD 4\n0V Ref 5\nDsr 6\n2 RxD\n\n[Page 4]\nUNITRONICS PCOM_NET M90 : UNI_M90\nMessage protocol\nProtocol overview\n00 00 00 00\nXX\n/r\nThe following transactions are supported:\n1.Read (RE) Digital Input\n2.Read (RA) Digital Output\n3.Write (SA) Digital Output\n4.Read (RW) Internal Integer\n5.Write (SW) Internal Integer\n6.Read (RB) Internal Bit\n7.Write (SB) Internal Bit\n8.Read (GF) System Integer\nBCC:\nThe Bcc is obtained by adding every byte except STX,ETX and Bcc and Ack,\ntruncated to a Byte , where each nibble is converted to its corresponding Ascii value.\nEg 40h+41h+43h = 124h =Truncated> 24h =Converted ( 3234h or ‘24’Ascii)\nRevision information\nDate\nRevision 0 – 1st release.\n01/09/2006\nRevision 5 – Added a 3wire disable signalling checkbox."}, {"title": "User Defined 01", "href": "drivers_html/User_Defined_01.html", "category": "Drivers", "rel": "drivers_html/User_Defined_01.html", "kind": "Driver", "text": "[Page 1]\nUser Defined Protocol Driver: UserDrv\nUser Defined Protocol: protocol driver\nOverview\nThe UserDrv protocol driver for Adroit is a generic paging and text device driver. Messages\nconfigured in String or Notifier Agents may be sent via an encoder or modem to paging\nThis driver is intended for easy use with many varied text protocols, while allowing advanced\nusers to configure custom protocols of their own. No windows drivers for a modem (is used)\nare needed, this driver provides it’s own interface and control over the modem via the serial\nport or IP address assigned to it.\nSections\nUser Defined Protocol: protocol driver.....................................................................................................1\nOverview................................................................................................................................................1\nDriver Installation and Setup.................................................................................................................1\nWiring....................................................................................................................................................7\nSupported Addresses..............................................................................................................................7\nAgent, SMS alarm and Scanning Configuration....................................................................................8\nData Acquisition Devices....................................................................................................................10\nCellular GSM Modems........................................................................................................................13\nCustom Protocols.................................................................................................................................15\nMessage protocols................................................................................................................................22\nDriver Installation and Setup\nInstallation of the UserDrv protocol driver is done in the standard way in Adroit Set-up. After\ninstallation of the driver, the user may then create and configure devices for the UserDrv\ndriver.\nDevices\nAt a minimum, you must create at least one device for each encoder/modem. Currently, the\nport settings for all devices on a port must be identical. I.e.: It is not permitted for example to\nuse Vodacom and AutoPage protocols together if they use different data bit settings.\nPrinted 14-Aug-03\n\n[Page 7]\nUser Defined Protocol Driver: UserDrv\nHow to upgrade from the old pager driver.\n1.\nTake a note of the driver settings for all devices configured on pager, and then delete\nall the devices in Driver Setup (not in the Agent Server configurator!).\n2.\nAdd the devices back, but this time using the ‘User Defined‘ driver, instead of pager.\nSelect your protocol from the list in the driver setup and click on “load protocol\ndefaults”.\n3.\nNow change any settings as necessary, click on “Modem” and edit the dial-up number\nif needed. “OK” the changes and a message will appear indicating that performance\ncounters were successfully installed (first time only).\n4.\nIf any errors occur in this procedure, log off and log on as administrator and try again.\n5.\nRun your agent server again as normal, if you are running as a service, we\nrecommend stopping the service via control panel and running the server as a window\nfrom the icon in your start menu until it is working correctly.\n6.\nVerify correct operation.\n7.\nYou can now delete the old pager.dll file, or rename it to have the .BAK extension.\nWiring\nFor standard modems, use the modem cable supplied with the modem, for other devices see\nmanufacturer documentation. The normal modem cable provides pin-to-pin matching, and is\noften also referred to as a null modem cable.\nSupported Addresses\nThe user driver does not have a strict addressing mechanism, addressing individual I/O is only\nrequired when the driver is used in a text protocol to acquire data.\nFor pager and SMS, use scan addresses as Notify : n , where n is a number from 1 to 99999.\nWhen acquiring Digital, String or Analogue values, scan addresses are\nDigital : n or\nString : n or\nAnalog : n\nWhen adding items to the scan point list, there is no difference between using a Notifier Agent\nand a String Agent.\nFor sending user strings to the script to use in building messages:\nUser: n, where 1<=n<=10;\nThese must be string slots that are used.\nTake care when using these values that they are scan inhibited as the driver will do an empty\nstring update at device startup to trigger an output initialize if enabled.\nPrinted 14-Aug-03\n\n[Page 9]\nUser Defined Protocol Driver: UserDrv\nTesting the driver operation\n1.\nOpen the driver datascope, to do so you can either run the driver monitor\nlauncher and select USERDRV from the list there to open a monitor, or use the\n“Diagnostics” button in the Adroit Setup program.\n2.\nIn the datascope program, select option 1 which is for datascope, the\ncommunications analyser screen will appear. If it does not, the driver could not\nopen the communications port or the driver could not be found, troubleshoot\naccordingly. If the window TITLE displays “HEX datascope …” then hit ‘A’ on the\nkeyboard to force it to toggle modes into ASCII.\n3.\nLeave this window running. Go back to the Configurator window, and edit the\nnotify agent. Click on the ”Advanced” button and type in “Hello world” in the format\nfield (if there is already text in the field, add a “dot” period” to the field each time to\ncause a change).\n4.\nClick on the Test button (subsequent test messages must differ), and then Alt-\nTab back to the Datascope (communications analyser) window. A message must\nappear indicating that the driver will attempt to start sending. If not go to\ntroubleshooting. As relevant, the modem will start to dial and connect to the\ngateway or terminal server, watch the display as it does this to determine where if\nanywhere it goes wrong.\n5.\nIf the SMS does get sent this part is working, else verify the modem operation in\nsome other way.\nTesting the Alarming setup\n1.\nEdit your alarm agent, and place a value of 100 into it, thereby sending it into high\nand high-high alarm, click “Update”, then change the value to zero again to\ngenerate low alarms.\n2.\nIf this does not result in an SMS being sent, create a new mimic, and display a\ntext value associated to MYNOTIFY.rawValue on it, the last alarm text should\nthus be displayed, if your “Hello world” is still in there, re-check the alarm\nconfiguration steps. The actual text shown should be the subscriber user/cell\ncode, a comma ‘,’ and the alarm text, which is usually preceded by the time.\nThe Notifier Agent can also support User entered messages. Simply type the message into\nthe value slot from an Operator Action, “Set value” and the message will be sent when clicking\non the OK button. Note, to re-send an old message, you must change the message content by\ne.g. adding a space at the end of it.\nMessage limitations\nLimitations may apply to the content of messages, the driver will NOT convert illegal\ncharacters in a message. Generally only use keyboard characters. The message length is\nlimited to 79 characters, including the device code and a comma added for internal purposes.\nProtocol / Type of\ndevice\nIllegal characters for the service\nAutoPage\n‘<’ , ‘>’ and ‘:’\nGSE / Golay\n<SPACE>, the space character\nPrinted 14-Aug-03\n\n[Page 14]\nUser Defined Protocol Driver: UserDrv\nIf not installed, install HyperTerminal, as follows:\nFrom control panel, select Add/remove programs.\nClick on the \"windows\" or \"components\" tab, and select HyperTerminal under\n\"communications\" to install it.\nSelect windows start/programs/communications/HyperTerminal, HyperTerminal will launch.\nType in a connection name (you can save this profile if you need to use it again) If this is the\nfirst time you run HyperTerminal, it may ask to install/configure a modem, ignore this step by\nproviding any needed information or skipping as needed. You do not want to be installing a\nmodem driver at this point.\nUse default settings at all these steps, only select the comm. port you are using. Baud rate is\nnot important, select 9600 if in doubt; no handshaking, 8 data bits, 1 stop and no parity. When\nyou see \"0\" in this explanation it is a zero, not uppercase \"o\", case is not important in these\ncommands, but uppercase is used for simplicity. If them instruction says to turn the modem\noff, do so for at least 5 seconds.\n1.\nClick on the \"Connect\" toolbar icon; then type \"ATZ\" (no quotes) followed by Carriage-\nreturn <ENTER>\nYou should see the text ATZ as you type it, and the next line should read OK.\nIf you see your typing ATZ appearing twice, click on the menu \"File/properties\" click\n\"ASCII setup\", and remove the check from the box \"echo typed characters locally\".\nOK the settings, and click the \"connect\" toolbar icon.\n2.\nIf the modem does not respond:\nDisconnect HyperTerminal and select 2400 baud, reconnect. Switch the modem off,\nthen on, and type AT<ENTER> in (the AT MUST be upper-case here) 3 times over.\nDoing so allows the modem to train to a new baud-rate, which it will loose if re-\ninitialized.\nType AT+IPR=9600;&W<ENTER>, then switch the modem off and on again, change\nthe HyperTerminal baud-rate back to 9600, it should respond properly on the first\ncommand now. If the modem still returns garbage, type AT+ICF=3,4<ENTER> to set\nup 8 data-bits 1 stop and no parity. Save this using the W command as above, and\ncycle power on the modem.\n3.\nType ATE1 and <ENTER>, the unit will respond with OK. Now we can build on this,\ntype AT&D2<ENTER> this turns the handshaking to the default we want.\n4.\nThen AT+CMEE=1<ENTER> this turns error reporting mode , (which the datascope\ndisplays as a number if an error is reported) , the unit will respond with OK.\n5.\nThen AT+CMGF=1<ENTER>, this puts the modem into Text mode. the unit will\nrespond with OK.\n6.\nThen type ATE0&W0<ENTER>, this will turn echo off, and save the modem settings\nto profile 0, also type ATE0&W1<ENTER> to save into profile 1 (this is because some\nmodems have profile 0 and 1, and others have 1 and 2). If using a Falcom modem,\nthe “W” must not be followed by a 0 or 1, the modem only has 1 profile.\n7.\nTurn the modem off and on.\n8.\nIn HyperTerminal, type AT+CMGF?<ENTER>, the unit will respond with AT+CMGF:\n1, this verifies that our settings have been saved, else go back to step 5.\n9.\nFinally to test that all is working.\n10. In HyperTerminal, type AT+CMGS=”0821234567”<ENTER> , use your own mobile\nnumber here, it must appear between double-quotes. The unit will then prompt with a\n“>” (greater-than) sign.\n11. Type in a test message, for Example, “This is a test message”, do not use extended\ncharacters or escape codes. (You may use capitals though.) Finnish off your message\nwith the <CTRL-Z> key combination. To do this, hold down the <CTRL> key, and tap\n‘Z’. This adds character x1A (26 dec), you do not need to hit <ENTER>. The unit\nshould respond with a “CMGS:” and “OK” or else an error code. If you get an error\ncode back, the message center has probably not been set up.\nPrinted 14-Aug-03\n\n[Page 26]\nUser Defined Protocol Driver: UserDrv\n1.\nFrom Setup, click on “Check…”, a dialog with all the script variables in it appear.\n2.\nDouble-click on each user variable labelled “TX1” etc to make sure that the driver can\nprocess it correctly. Fix any errors then close this dialog and open it again and re-check\nyour changes.\n3.\nClose the driver setup dialog. If you still have problems continue…\n4.\nOnce connected, the driver will wait for a while to allow the server to respond. Then it will\ncommence with the processing of the communication steps. If the driver sends a string\nthat is incorrect or not recognised by the remote device, that device will either not respond\nor will give an error response. Use the ASCII “DataScope” to determine if this is"}, {"title": "User Defined 02", "href": "drivers_html/User_Defined_02.html", "category": "Drivers", "rel": "drivers_html/User_Defined_02.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-USERDRV.docx\nP a
