 device will need to be created for each FED. • Agent Server (AS): The Agent Server (I/O Server), is the real-time database, which handles the real-time values and if configured, will handle all post-processing, logging and/or alarming the data. • SmartUI Server (SUIS): The SUIS is a middleware server which exposes data from a number of disparate sources, using the datasource, and also acts as a repository for the graphic forms or mimics. It also acts as the manager of access, and broker for the unified data model implemented across all data types that may end up in the • Datasource: Each source of data (i.e. Adroit Agent Server) requires a datasource plugin before it can be associated with the SmartUI Server. This provides the ability to expose its data as data elements. An example of a data element is Adroit.Analog.SAMPLEANALOGUE.value. The SmartUI Server connects to data using two different types of datasources: • The SmartUI Server allows multiple sources of data to be available to the configuration of a system in a unifed manner. It basically coverts all datatypes into universally usable elements (dataelements). ____________________________________________________________________________________________________________________________ ATQMS-MKTG-DOC-Adroit 10 Quick Start Guide P a g e | 4 Datasource Purpose Adroit Exposes the configured agents and their slots, of the connected Adroit Agent Server. Event Log Exposes the events within the Windows event logs of the connected specific computer. OLE DB Exposes the data within a specific OLE DB compliant database or data store. Server Scripts Stores scripts that can be run on the Server. Simulation Exposes a wide variety of different types of generated data WebServices Exposes a wide variety of data available in web services Note: For further information on the available datasource see the Adroit help. • Clients: The Adroit SUI comes with a number of types of clients which can securely connect to the SmartUI Server: _________________________________________________ ATQMS-DRVR-DOC-BECKHOFF.docx P a g e | 5 2. Wiring Not applicable. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-BECKHOFF.docx P a g e | 6 3. Device Configuration 3.1. Device Configuration 3.1.1. Port Selection Enable Secondary – Enables secondary configuration for dual redundant PLCs via the primary and secondary radio buttons. Do not enable if a secondary channel is not configured correctly. 3.1.2. UDT Settings TPY File. – The TPY File is a file from the Beckhoff System that contains all the UDT Data. The Driver will import this file and automatically create all the UDT’s as specified in this TPY file. Click on the browse button to select a file to open, and then press the “Get UDT Defs.” Button to create all the UDT’s. A window will open after the creation process that will show all the UDT’s created and allow for manual intervention, if required. UDT Prefix – Prefix for UDT’s to search for in the TPY File. Get UDT defs. – This button will be enabled as soon as the “Test Con.” Action has succeeded. This will open the TPY File specified and automatically create all UDT’s that can be found in the file with the specified Prefix. PLEASE NOTE From Adroit 7.0.10.0 onwards, you will have a Browse functionality on the scan dialog that will read all the symbols from the TPY file into the browser and allow you to select the symbol. This will then construct the scan address accordingly. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-BECKHOFF.docx P a g e | 7 3.1.3. PLC Details Routes – The Routes allow selection of Remote Beckhoff Units or just the remote. These routes will be read from the registry where Beckhoff saves its configured routes. If communication is to be on the local machine, just select “Local”. Also, “Custom” is available whereby the user can then manually specify the AMS Net ID in case of the driver failing to fetch the routes from the registry as in the case of TwinCAT3. AMS Net ID – The IP Address of the device you wish to communicate to. The default IP Address will be the hosting PC’s IP Address. The last two digits are fixed. Port No. – A drop down list of available supported ports. Packet size (bytes) – The maximum number of bytes to read in one job. The maximum available is 1990 bytes and a minimum of 80 bytes (default string length). Retries – The number of times that Adroit will try to gain communication with a PLC before failing a transaction. The driver uses a fixed timeout of 5000 milliseconds on transactions. 3.1.4. Test Connection Details Test Con. – A ‘test connection’ button is provided and will report the details of the type of PLC and its status. 4. Supported Addresses Device Min Range Max Range PLC Data Type Boolean Integer Real String Inputs I (read only) 0 65535.8 BOOL IX:0.0 65534 WORD IW:0 IW:0 Outputs Q 0 65535.8 BOOL QX:0.0 65534 WORD QW:0 QW:0 Internal M 0 65535.8 BOOL MX:0.0 65535 Byte MB:0 65534 WORD MW:0 MW:0 Int MW:0 S MW:0 S 65532 DWORD MD:0 MD:0 Dint MD:0 S MD:0 S Float (Real) MD:0 F 65534 String MW:0.80 C UDT’s See Below _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-BECKHOFF.docx P a g e | 8 5. Protocol Definition and Considerations 5.1. Scanning UDT’s To Scan any UDT, just follow the following structure: UDT:<ProgramName>.<MyUDT> <StructureName> Where: <ProgramName> = If the UDT Instance is in the Global Variable Scope of the Beckhoff Software, then this stays empty, but if it is any other place than Global Variables, then the scope must be specified, like MAIN as example. <MyUDT> = The Structure Instance as created in Beckhoff software. <StructureName> = UDT(Structure) Name as created in the Beckhoff software. Example(MAIN Program Scope): UDT:MAIN.myTest1 ST_DEMO Example(Global Variable Scope): UDT:.myTest1 ST_DEMO UDT’s can be setup for callbacks instead of polling. To do this, just change the scan rate to 0 when scanning. This is for the purpose of timestamping. To enable timestamping for a UDT, you must create 2 DWORD slots called “FILETIME_HIGH_DWORD” and “FILETIME_LOW_DWORD”, which must be packed with the FILETIME’s high and low 32-bit words. The driver also support ENUMS and UDT’s in UDT’s. PLEASE NOTE This driver does not support Arrays in UDT’s. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-BECKHOFF.docx P a g e | 9 5.2. Scanning VARIABLES by Name To Scan any Variable by its name, just follow the following structure: VAR: <ProgramName> .<VarName> <VarType> Where: <ProgramName> = If the Variable Instance is in the Global Variable Scope of the Beckhoff Software, then this stays empty, but if it is any other place than Global Variables, then the scope must be specified, like MAIN as example! <VarName> = The variable name as specified in Beckhoff. Software <VarType> = Variable Type, such as BOOL,BYTE,INT,DWORD etc.. Example(MAIN Program Scope): VAR:MAIN.myVar1 DWORD Example(Global Variable Scope): VAR:.myVar1 DWORD Adroit Variable Types MAPPED to Beckhoff Variable Types Adroit Variables Beckhoff Variables BOOL BOOL BYTE BYTE USINT SINT WORD WORD UINT DFLOAT REAL Not Supported TIME Not Supported LREAL DINT DINT LONG DWORD UDINT DWORD INT INT SHORT 5.3. Message Protocol Examples of read and write requests are shown below: _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-BECKHOFF.docx P a g e | 10 Example of writing to and reading from a string: Errors will be displayed as follows on the error log screen; errors are also event-logged: When writing to and reading from PLC Strings: Keep in mind, that when writing to and reading from a String in the PLC, a maximum of 80 characters is allowed (Adroit’s maximum string length), this includes a terminating NULL value at the end of the string, so in essence only 79 of the 80 characters are read/writable. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-BECKHOFF.docx P a g e | 11 6. General Notes and Troubleshooting 6.1. Contact Details Email: support@adroit.co.za and drivers@adroit.co.za Phone: +27 11 658-8100 Web: www.adroit.co.za 6.2. Adroit Technologies Knowledge Base For additional information, p"}, {"title": "cimbria", "href": "drivers_html/cimbria.html", "category": "Drivers", "rel": "drivers_html/cimbria.html", "kind": "Driver", "text": "Adroit Technologies Protocol Driver Name Cimbria Serial DLL CIMBRIA _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-CIMBRIA.docx P a g e | 2 COPYRIGHT Copyright © 2022 Advanced Worx 112 (Pty) Ltd. All rights reserved. Information in this document is subject to change without notice. The software described in this document is furnished under a license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of those agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or any means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal use without the written permission of Advanced Worx 112 (Pty) Ltd. Advanced Worx 112 (Pty) Ltd 20 Waterford Office Park 189 Witkoppen Road (c/o Waterford Drive) Fourways South Africa https://adroittech.co.za/ _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-CIMBRIA.docx P a g e | 3 Contents 1. Overview ....................................................................................................... .. 10 7.1. Contact Details .............................................................................................................................. 10 7.2. Adroit Technologies Knowledge Base .............................................................................................. 10 _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-CIMBRIA.docx P a g e | 4 1. Overview This document describes the setup of, and the communication protocol implemented in the Adroit protocol driver, with the following logic unit: Cimbria level sensor. The Cimbria devices can take up to 12 seconds to reply to a single line request, for this reason it is recommended that scans are only added when the device is stopped. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-CIMBRIA.docx P a g e | 5 2. Wiring Standard serial interconnection (RS-485). _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-CIMBRIA.docx P a g e | 6 3. Device Configuration 3.1. Device Configuration 3.1.1. Configuration Selection [not implemented] Enable Secondary – Enables secondary configuration for dual redundant Controllers. This setting is disabled for this driver. Primary/Secondary – Select the primary or secondary button depending on which connection you wish to configure. This feature is not available for this driver. 3.1.2. Port Setup Port – Select the serial port to use for communications. Parity – Select even or uneven parity in a single serial transmission message. DataBits – Select the number of data-bits per packet. StopBits – Select the number of stop-bits per packet. Baud Rate – The transmission rate of data (including start and stop bits). The default baud rate for a Cimbria unit is 9600. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-CIMBRIA.docx P a g e | 7 Retry – The number of times to retry a transaction before a comms-failure is reported. Timeout – The number of milliseconds to wait between communication-retries. 3.1.3. Device Details Cimbria Station Address – Supply the unit address of the Cimbria device to communicate with. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-CIMBRIA.docx P a g e | 8 4. Supported Addresses The Adroit Cimbria serial driver supports the following data address types: Description: Sensor average value request Address Format: <Instruction Code> <Line Number>:<Sensor Number> • Instruction Code: A • Line Number: 0 – 8 • Sensor Number: 1- 24 Adroit Data types Supported: Integer, Real Example Address: “A 0:1”, “A 8:24” Description: Sensor temperature value request Address Format: <Instruction Code> <Line Number>:<Sensor Number> • Instruction Code: T • Line Number: 0 – 8 • Sensor Number: 1- 24 Adroit Data types Supported: Integer, Real Example Address: “T 0:1”, “T 8:24” Description: Last measured sensor offset request Address Format: <Instruction Code> <Index> • Instruction Code: F • Data Request: 1 – 2 (1 = offset value, 2 = reference value) Adroit Data types Supported: Integer, Real Example Address: “F 1”, “F 2” Description: Port (A, B, C) state request Address Format: <Instruction Code> <Index> • Instruction Code: P • Data Request: 1 – 3 (1 = Port A, 2 = Port B, 3= Port C) Adroit Data types Supported: Integer, Real Example Address: “P 1”, “P 3” Description: Firmware version request Address Format: <Instruction Code> • Instruction Code: V Adroit Data types Supported: String Example Address: “V” Description: Current 12V reading request Address Format: <Instruction Code> • Instruction Code: W Adroit Data types Supported: Integer, Real Example Address: “W” _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-CIMBRIA.docx P a g e | 9 5. Protocol Definition and Considerations 5.1.1. Cimbria Protocol Instruction Structure Message Start Cimbria Station Address Command/ Instruction Command Parameters Message End ! AAA C P… * Message start: The exclamation mark character (0x21) indicates the start of a new instruction. Cimbria Station Address: This three digit number indicates the address of the Cimbria device, to which the message will to be sent. Command/Instruction: This single character instruction identifies the type of information that is requested by the user. This could be any one of the instructions described in the previous section (Supported Addresses). Command Parameters: These parameters are command specific and vary in length between commands. Message stop: The Asterix character (0x2A) indicates the end of the instruction. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-CIMBRIA.docx P a g e | 10 6. General Notes and Troubleshooting 6.1. Contact Details Email: support@adroit.co.za and drivers@adroit.co.za Phone: +27 11 658-8100 Web: www.adroit.co.za 6.2. Adroit Technologies Knowledge Base For additional information, please refer to our Knowledgebase website: Latest Drivers topics - Features, discussions, tips, tricks, questions, problems and feedback (adroittechnologiesautomation.com) 7. Revisions 7.1. Document Revision Rev. Date Author Comment Approval 1.0 14-Dec-2022 J. Duncan New Format D. Jordaan 1.1 18-Jan-2023 K. Robinson Changes to format, updated image resources. Added Appendix B DCOM Hardening. Removed Windows XP section D. Jordaan 2.0 3.0 7.2. DLL Revision Rev. Date Changes 24-Nov-2014 First Release notes! 26-June-2018 Extended address ranges of A and T line numbers to 0 - 8 4 18-Aug-2020 Ongoing driver maintenance. ______________________________________________________________________________________ less the card is already successfully installed and working in the host machine the following steps must be followed. Enable Plug-N-Play on your computer’s BIOS. Switch off your computer and unplug the power cable. Insert the card into a blank PCI (white) slot. Card OID /Node Address(SW1 1to SW1 7). The own ID of the card must be set to a unique address between 1 and 127. Remember that optimum performance (owing to the nature of the “Next Node searching algorithm employed for token passing) is achieved when there are no gaps between the node numbers. Mode Setting (SW1 8). Select between (N)ormal mode and (S)low mode. Mode N is 62500 baud and Mode S is 7800 baud. Typically Mode N is used, but for networks with high interference levels, or large distances between the terminators, Mode S will be more reliable. Turn on the computer, windows will automatically install the Jungo card drivers for you from the Conet Software CD, which must be inserted into your CD-Rom drive. Run the Omniflex CD setup program to install the COM component needed by the Adroit driver, a small test program will also be installed at this time. Receive LED (yellow) Token LED (green) Transmit LED (red) D9 connector SW1 1..8 _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-CONETPCI.docx P a g e | 7 Run the test application to verify that the card is working. This is the view from device manager, showing the Jungo driver installed correctly. PLEASE NOTE See table at end of this document for dip-switch positions. If installation fails or the card does not work, please obtain updated device drivers directly from Omniflex as Adroit Technologies does not keep this software. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-CONETPCI.docx P a g e | 8 3.2. Driver Installation and Setup The driver installation follows the normal installation procedure. This will entail running Adroit setup and selecting the “Drivers” tab, choosing the “Add Driver” button, selecting the Conet PCI driver, and entering in the setup details in the setup dialogue that appears. However, because third-party software is used to assist in the low-level communications, there are certain checks that can be made to ensure that the installation was successful. Perform the checks listed below if you have any problems. Security Problems you may have: Typically, when installing Adroit and configuring the driver for the first time, the configuring user will have Administrator Privileges allocated. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-CONETPCI.docx P a g e | 9 3.3. Device Configuration The driver setup dialog will allow you to configure your driver devices. Configure one device per Conet Network Node. A maximum of 127 devices may be used at one time. More than 32 devices on the Conet Network may significantly reduce the speed of data transmission and is not recommended. 3.3.1. Select FEP Card for this Device FEP Card (1 – 4) - This Radio Button Group requires the selection of a Card Number. This Card Number has nothing to do with settings on the proprietary card itself; the Card Number is a driver option, which will be allocated to a physical card to identify it. This means that a maximum of four Conet cards may be installed in a single machine. 3.3.2. FEP Card State TEST - Test button to verify that the device driver and card are functioning. 3.3.3. Outstation Settings Outstation - (1-127) The outstation number is the Own ID (OID) of the device on the Conet Network with which this device must communicate. Retries - Before failing a communications transaction, the device has the option of retrying. The value here will be the number of times the device will retry. Timeout (ms) - In version 6c of the driver onwards, the retries setting does now work, and the dialog appears differently. The new offline retry time however does not have any effect. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-CONETPCI.docx P a g e | 10 4. Supported Addresses The format of the address string for normal communications is as follows: DIT xxxx[.yy] Where: • DIT is a prefix or mnemonic for Data Interchange Table (i.e. the register table) • ‘xxxx’ is the byte offset into the DIT table. Optionally a bit offset ‘[.yy]’ may appear for Boolean scanning. Device Max Range Boolean Integer Real Digital DIT 99999.15 DIT 100.12 Analogue DIT 99999 DIT 123 DIT 123 PLEASE NOTE If after selecting a device, you do not see a default address appear in the Source Address field of the scanning dialog, the driver has not loaded. Look at the event viewer to establish the reason. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-CONETPCI.docx P a g e | 11 5. Protocol Definition and Considerations The Conet PCI message protocol is shown in the HEX Datascope diagnostic displays as follows: Read Request DID SID Count Res. CMD StartReg Range 00 02 00 01 00 03 00 64 00 00 01 Read Response DID SID Count Res. CMD StartReg Data 00 01 00 02 00 03 00 65 00 00 01 06 Write Request device Bytes Command StartReg Range Data 01 05 66 00 00 01 00 7F Write Response device bytes Command StartReg 07 00 xx Xx xx device = (OID) of the targeted device on the Conet network. Bytes = number of bytes in the telegram, excluding the first three. Command code: 64h = 100 etc. StartReg = offset into the DIT table from which data is to be read or to which data must be written. Range = number of consecutive bytes that must be read or written from/to the DIT table. Data = actual data returned by the device or written to the device. 5.1. PLC Software No additional software is required, install the windows device driver for the PCI card from the CD supplied with the card. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-CONETPCI.docx P a g e | 12 6. General N"}, {"title": "d_bacnet", "href": "drivers_html/d_bacnet.html", "category": "Drivers", "rel": "drivers_html/d_bacnet.html", "kind": "Driver", "text": "Adroit Technologies Protocol Driver Name BACnet Ethernet UDP/IP DLL D_BACNET _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_BACNET.docx P a g e | 2 COPYRIGHT Copyright © 2022 Advanced Worx 112 (Pty) Ltd. All rights reserved. Information in this document is subject to change without notice. The software described in this document is furnished under a license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of those agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or any means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal use without the written permission of Advanced Worx 112 (Pty) Ltd. Advanced Worx 112 (Pty) Ltd 20 Waterford Office Park 189 Witkoppen Road (c/o Waterford Drive) Fourways South Africa https://adroittech.co.za/ _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_BACNET.docx P a g e | 3 Contents 1. Overview ............................................................................................................................................... 4 2. Revisions ............................................................................................................................................. 20 2.1. Document Revision ...................................................................................................... __________________________________________________________________ ATQMS-DRVR-DOC-D_BACNET.docx P a g e | 4 1. Overview This driver makes use of the BACnet Stack library supplied by sourceforge.com. The driver supports these functions at the moment: ReadProperty ReadPropertyMultiple WriteProperty Not all devices support ReadPropertyMultiple. For reading we will always try to do a ReadPropertyMultiple and if it fails the driver will revert to a ReadProperty call instead. ReadProperty is much slower and has a limitation of only supporting 255 Items that can be scanned individually. The driver also supports Ethernet connection through a WhoIs function call. NOTE: Please ensure broadcasting is enabled on all routers and internal network between driver and BACnet devices to ensure successful communications. Also only UDP is used so ensure UDP is enabled through any firewalls. UDP port 47808 is used. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_BACNET.docx P a g e | 5 2. Wiring Not Applicable. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_BACNET.docx P a g e | 6 3. Device Configuration 3.1. Driver Details Enable Secondary – Allows enabling of redundant BACnet device connections such that in case of a failure a switchover will occur. (Default = OFF) Primary – Allows configuration setting of the Primary BACnet device. Secondary – Allows configuration setting of the Secondary BACnet device. 3.1.1. BACnet Device Details Enable shadow scanning from master to standby – If enabled will stop any communication to the BACnet device when the Agent server is in standby mode. By default we assume parallel scanning (default = OFF) Enable standby reads – Allows reading from BACnet device when agent server is in standby mode. (Default = ON) Enable standby writes – Allows writing to BACnet device when agent server is in standby mode. (Default = OFF) Timeout – Time in milliseconds to wait for a response from the BACnet device. (Default = 1000 ms) Retries – The maximum number of retries to attempt communication to the BACnet device before ensuring a complete failure. (Default = 3) _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_BACNET.docx P a g e | 7 Station ID – The BACnet device Station ID. This is only required and comes into working when the actual IP Address of the unit is unknown or will change dynamically. IP Address – The static IP Address of the BACnet device. If this is specified the Station ID is ignored as connection happens purely based on IP and UDP Port then. APDU – The maximum size in bytes that can be transferred over Ethernet. 1495 bytes is the maximum allowed on a single network packet and then some devices may implement segmentation of packets. As not all devices support segmentation, the driver in itself will segment the packets before sending it. Poll Interval – The time in milliseconds at which all the items will be requested from the device. PLEASE NOTE NB – If using the Station ID for WhoIs command the BACnet stack makes use of the very first NIC on your PC to send broadcast messages. In some cases, this specific NIC chosen is not the same one that the BACnet devices is running on and hence no communications. To overcome this scenario, a global registry key called “IPToUse” is created in the Drivers registry area with the default used NIC’s IP address in it. Here you can change the IP Address to the current NIC you want to use to access your BACnet devices with. See image below. The registry key for 32 Bit O/S: ‘HKEY_LOCAL_MACHINE\\SOFTWARE\\Adroit Technologies\\Adroit\\ProtocolDrivers\\d_bacnet\\IPToUse’ The registry key for 64 Bit O/S: ‘HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Adroit Technologies\\Adroit\\ProtocolDrivers\\d_bacnet\\IPToUse’ ____________________ _______ D_COMLI_SER.docx P a g e | 2 Contents 1. Communications link Serial protocol Driver ........................................................................................... 3 1.1. Overview ............................................................................................................................................. 3 1.2. Test Hardware ..................................................................................................................................... 3 1.3. Wiring ................................................................................................................................................. 3 1.4. Device Configuration ............................................................................................................................ 5 1.5. Supported Addresses ........................................................................................................................... 8 1.6. Timesync considerations ....................................................................................................................... 9 1.7. Comli – Protocol function supported ...................................................................................................... 9 2. Configuring Mitsubishi FX5 as a Comli slave ....................................................................................... 10 2.1. Comli function block setup .................................................................................................................. 10 2.2. PLC program...................................................................................................................................... 10 2.3. PLC Wiring ......................................................................................................................................... 11 2.4. Resulting output ................................................................................................................................ 12 2.5. FX5 / Comli I/O mapping .................................................................................................................... 12 ______________________________________________________________________________________________________________________________ D_COMLI_SER.docx P a g e | 3 1. Communications link Serial protocol Driver 1.1. Overview This driver supports the ABB Communications link driver. The 2nd Generation driver allows for the following features: • Improved performance due to optimizations on mixed I/O to the same protocol area being transacted only once removing redundant transactions. • Serial drivers by design don’t benefit from multiple channels thus only one channel per device is enforced. Up to 247 Multi-dropped devices are supported per port. • Demand scanning support, where read only I/O that is not on a mimic / graphic form and not logged or alarmed will be removed from the scanning system, the applicable tasks will dynamically reduce is size and merge into fewer scan tasks. For improved network performance and reliability, it is recommended to use of industrial USB serial ports or true serial cards into the machines where applicable. RS232 and RS485 and RS422 is supported Windows traditionally expects com ports to always be available, loosing contact with Ethernet serial extenders can cause lockups… please contact Adroit support if you suspect this. 1.2. Test Hardware This driver has been tested on the following hardware: FX5U -32MT/DSS Plc using USER_FB_Comli_FX5U function block dated 2019/04/24 14:25:42 1.3. Wiring Control of DSR/DTR CTS/RTS signalling is available as needed. RS-232-c / RS-422 / 485, 4 and 2 wire supported. Reflection detection is configurable, (future …) DB9 , DTE to DTE cable diagram RS-232C - 3 wire (With loopbacks in case the system expects signalling) PLC 9 pin PC 9 pin 2 RX 2 RX 3 TX 3 TX 5 GND 5 GND Note: Connect shield to one side , PLC side only _______________________________________ e #define DEBUG_MASK_COMSRESOURCE_INFO 0x00000001 #define DEBUG_MASK_COMSRESOURCE_CRITICAL 0x00000002 #define DEBUG_MASK_PROTOCOL_ITEM_VALUES 0x00000004 #define DEBUG_MASK_PROTOCOL_ITEM_BAD_VALUES 0x00000008 #define DEBUG_MASK_NASA_POOLS 0x00000010 #define DEBUG_MASK_TIMING 0x00000020 #define DEBUG_MASK_PROTOCOL_RESPONSES 0x00000040 #define DEBUG_MASK_PROTOCOL_REQUESTS 0x00000080 #define DEBUG_MASK_PROTOCOL_READ_DESC 0x00000100 #define DEBUG_MASK_PROTOCOL_WRITE_DESC 0x00000200 Stale threshold – ( 5 default) – Every nth occurrence of a unchanged item value will be sent to the master, if the value is different the value will be send regardless of this count. This count reduces unnecessary event withing the agent server. Set to to report every poll value regardless of change , 0 is not a valid option. Max PDU length – (32 default) - The overall maximum transaction length , 1 is the lowest value up to 32 16bit-registers or 32 x 16 discreet bits digitals per transaction. Serial Com Port – Only insert the number for the port, E.g. “4” for com4 Baud rate – Combo ( 9600 default ) – select the required baud rate from the selection provided. Databits – Combo ( 8 default ) – select the required databit count from the selection provided. Parity – Combo (ODD default) – select the required Parity mode from the selection provided. Stopbits – Combo ( 1 default) ) – select the required stopbit count from the selection provided. Transaction timeout – (3000 mSec Default ) – insert the required timeout for the system in milliseconds. 485 Reflections (false by default) – check if reflection detection and compensation is required on the port (future …) ______________________________________________________________________________________________________________________________ D_COMLI_SER.docx P a g e | 7 Purging The driver will purge TX and RX buffers (data on the port) by default when required. However, some systems such as Ethernet to serial port servers can become overloaded or even lockup if left receiving bytes in its internal buffer without a driver reading anything for a long period, for example when a cluster partner is in standby use the setting below to compensate. Purge port in standby (false by default) – check if purging of the buffers are to be performed in the background while the cluster partner is in standby. Purge mode – (SOFT default) Soft cause a simple flushing via reading any available bytes, HARD sends a system call to tell the device itself to flush, some systems have become unresponsive in hard mode. Error handling – Multi-dropped system variables Retries – Enable this button to have the driver keep the PLC connection alive. Please see the PLC program and heartbeat sections below. This option is only useful with the watchdog program running in the PLC. Backoff count – (5 default) – require 5 full consecutive failures including retries. e.g. if 3 retries is configured and the backoff count is 5, the system will go into a backoff delay period in which this device will not be polled or written to for the Backoff period, in this example after the ((1+3)*5) consecutive failures. Backoff period – Specify the millisecond interval the a device will stay silent on the channel, this is very useful in multi-dropped systems as failing devices do not severely affect online devices. Disconnect after every transaction – (false default) -tell the channel to close the port after every transaction, can be useful on gateways if required. Disconnect after every error – –(false default) – tell the channel to close and reopen the port on every error during retries else it will only occur after the final retry Latency Inter-PLC latency – The period that the system will wait before transmitting any read request or write request in multi-dropped system when a new device is contacted. Transmission latency – The period that the system will wait before transmitting any read request or write request for the same plc device. Inter message delay. Tx to .................... 12 7.2. DLL Revision ...................................................................................................................................... 12 _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_FAG.docx P a g e | 4 1. Overview This driver allows communications to the FAG SmartCheck using its WebService. The driver supports only reading the alarms status and values of the following signals: Velocity (iso10816_2hz_1khz_velocity) Peak to Peak Acceleration (peak_2_peak_acceleration_high_vibration_values) RMS Acceleration (rms_broadband_acceleration_overall_monitor) RMS Demodulation (rms_broadband_demodulation_overall_monitor) Temperature (temperature) PLEASE NOTE The FAG SmartCheck cannot accept communications quicker than 1 poll every 15 seconds and will be defaulted to 15 seconds. Nothing lower will be accepted and will be replaced with 15 seconds. For this reason, the actual time specified for each scan point is ignored. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_FAG.docx P a g e | 5 2. Wiring Ethernet _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_FAG.docx P a g e | 6 3. Device Configuration 3.1. Device Configuration 3.1.1. Driver Details Enable Secondary – Allows enabling of redundant device connections such that in case of a failure a switchover will occur. (Default = OFF) Primary – Allows configuration setting of the Primary device. Secondary – Allows configuration setting of the Secondary device. 3.1.2. Primary Connection Parameters Enable shadow scanning from master to standby – If enabled will stop any communication to the device when the Agent server is in standby mode. By default we assume parallel scanning (default = OFF) _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_FAG.docx P a g e | 7 Enable standby reads – Allows reading from the device when agent server is in standby mode. (Default = ON) Enable standby writes – Allows writing to the device when agent server is in standby mode. (Default = OFF) Timeout – Time in milliseconds to wait for a response from the device. (Default = 1000 ms) Retries – The maximum number of retries to attempt communication to the device before ensuring a complete failure. (Default = 3) SmartCheck IP – The FAG SmartCheck device Station IP. User Name – The FAG SmartCheck device username to access the WebService. (Default = admin) Password – The FAG SmartCheck device password to access the WebService. (Default = admin123) Poll Period (ms) – Time in milliseconds to Poll for a response from the device. (Default = 15000 ms - This is also the minimum possible for the FAG SmartCheck) _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_FAG.docx P a g e | 8 4. Supported Addresses Scan Addresses takes the form of V:[Measurment Job Name].[Measurement Signal Name] (The Value) or S:[Measurment Job Name].[Measurement Signal Name] (The Alarm Status) exactly as it is shown in the FAG SmartCheck configuration. For example: Out of the BOX, default configuration measurement job for a FAG SmartCheck is as follows with its 5 Measurement Characteristics and the corresponding scan address for it as specified below: The Unit Status:-> S:UNIT_STATUS The Unit Firmware Version:-> V:UNIT_STATUS The Peak-Peak Acceleration Status\\Value:-> S\\V:DEFAULT_CONFIGURATION_BASE_MEASUREMENT_JOB.default_configuration_peak_2_peak_ acceleration_high_vibration_values The RMS Broadband Acceleration Status\\Value :-> S\\V:DEFAULT_CONFIGURATION_BASE_MEASUREMENT_JOB.default_configuration_rms_broadband _acceleration_overall_monitor The RMS Broadband Demodulation Status\\Value :-> S\\V:DEFAULT_CONFIGURATION_BASE_MEASUREMENT_JOB.default_configuration_rms_broadband _demodulation_overall_monitor The Temperature Status\\Value :-> S\\V:DEFAULT_CONFIGURATION_BASE_MEASUREMENT_JOB.default_configuration_temperature The Velocity Status\\Value :-> S\\V:DEFAULT_CONFIGURATION_BASE_MEASUREMENT_JOB.default_configuration_iso10816_2hz_1 khz_velocity _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_FAG.docx P a g e | 9 If you want to address your own created Measurement Job as in the following image, where it is called “Adroit_Demo” the addressing will be: The Unit Status:-> S:unit_status The Temperature Status\\Value :-> S\\V:Adroit_Demo.Temperature The Peak-Peak Acceleration Status\\Value:-> S\\V:Adroit_Demo.Peak-peak - Acceleration (High vibration values The RMS Broadband Acceleration Status\\Value :-> V\\S:Adroit_Demo.RMS broad band - Acceleration (Overall status) The RMS Broadband Demodulation Status\\Value :-> V\\S:Adroit_Demo.RMS broad band - Demodulation (Overall status) The Velocity Status\\Value :-> V\\S:Adroit_Demo.ISO10816-1 (2Hz - 1kHz) - Velocity The STATUS addresses in the above table returns INTEGER values as shown below: 0 - No characteristic value has yet been measured. 1 - No alarm exists. 2 - Pre-alarm exists. 3 - Main alarm exists. 4 - Error Occurred. 5 - Valid Value was returned in the Value Scan (V.0 – V.5) The VALUES will return a 32 bit floating point value. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_FAG.docx P a g e | 10 5. Protocol Definition and Considerations 5.1. Message Protocol _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_FAG.docx P a g e | 11 6. General Notes and Troubleshooting 6.1. Contact Details Email: support@adroit.co.za and drivers@adroit.co.za Phone: ewer scan tasks. For improved network performance and reliability, it is recommended that you install 2 network adapters into your PC. Use the first adapter for Adroit to Adroit and all other Windows connectivity. The first adapter may have all the default installation bindings. Use the second adapter for Adroit to PLC connectivity and bind only to the TCP/IP protocol for PLC communications. 1.1. Upgrading from classical MITQJE71 Driver The scanning addresses are identical. If using the MITQJE71 driver, remove all of the old Device Agents, and create them again with the same names using the Q driver. Take care to note settings like the IP, port address and watchdog addresses. On the A-Series driver the Decimal or Hex notation used is important and does change over in this Q/QnA driver. Names of I/O types stay the same so far possible, this means that scanned I/O types existing in the A-Series driver that have different names (prefixes) in the Q Driver are promoted automatically to their new names. After saving, the WGP file cannot be loaded on the old driver again without the possibility of losing some scan-points. _______________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MIT_ETH.docx P a g e | 5 2. Wiring As per Ethernet Standards. _______________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MIT_ETH.docx P a g e | 6 3. Device Configuration 3.1. Device Configuration _______________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MIT_ETH.docx P a g e | 7 Enable secondary – Turn this option to have the driver maintain 2 channels of communication, the radio buttons Primary and Secondary can then be used to toggle between configurations. Enable shadow scanning from master to standby – NASA specific function – per Device Agent level shadow scanning. If enabled, writes will be sent to the master to be executed on its corresponding device and reads from master will be replicated to the standby. If disabled writes Parallel scanning is enabled. Enable standby reads – If disabled, the standby will be considered cold, no reading will take place on the standby connection, and neither will any replication from the master occur. Enable standby writes -– If disabled, no writing will take place on the standby connection, and neither will any request be forwarded to the master. 3.1.1. Error Handling Retries - (Default = 3) Number of attempts per transaction. Disconnect after every transaction – (Default = False) -Tell the channel to close the port after every transaction. This can be useful on gateways if required. Disconnect after every error – (Default = False) Tell the channel to close and reopen the port on every error during retries else it will only occur after the final retry. 3.1.2. Latency Inter-PLC latency – The period that the system will wait before transmitting any read request or write request in multi-droppe"}, {"title": "d_mqtt_cl", "href": "drivers_html/d_mqtt_cl.html", "category": "Drivers", "rel": "drivers_html/d_mqtt_cl.html", "kind": "Driver", "text": "Adroit Technologies Protocol Driver Name MQTT Client Protocol Driver DLL D_MQTT_CL _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 2 COPYRIGHT Copyright © 2022 Advanced Worx 112 (Pty) Ltd. All rights reserved. Information in this document is subject to change without notice. The software described in this document is furnished under a license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of those agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or any means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal use without the written permission of Advanced Worx 112 (Pty) Ltd. Advanced Worx 112 (Pty) Ltd 20 Waterford Office Park 189 Witkoppen Road (c/o Waterford Drive) Fourways South Africa https://adroittech.co.za/ _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 3 Contents 1. Overview ............................................................................................................................................... 4 1.1. Supported Hardware ..........................................................................................................................4 2. Wiring ................................................................................................................................................... 5 3. Device Configuration ............................................................................................................................ 6 3.1. Device Configuration ..........................................................................................................................6 3.1.1. Driver Details .............................................................................................................................................. 6 3.1.2. Device Details .............................................................................................................................................. 7 4. Supported Addresses ............................................................................................................................ 9 4.1. Example ............................................................................................................................................9 5. Protocol Definition and Considerations .............................................................................................. 11 5.1. Additional MQTT Information ............................................................................................................ 12 6. General Notes and Troubleshooting ................................................................................................... 13 6.1. Contact Details ................................................................................................................................. 13 6.2. Adroit Technologies Knowledge Base ................................................................................................. 13 7. Revisions ............................................................................................................................................. 14 7.1. Document Revision........................................................................................................................... 14 7.2. DLL Revision .................................................................................................................................... 14 _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 4 1. Overview Message Queue Telemetry Transport (MQTT) is a lightweight, report by exception, ISO-standard pub-sub messaging protocol specifically designed for the Internet of Things. The MQTT network consists of publishers, subscribers and a broker. The publishers will publish or send information to the broker, the broker will then relay those messages to the subscribers. The broker is the “middleman” in the network and could be situated in the cloud. A publisher/subscriber are the clients on the network and are linked together by topics. Each Adroit agent can be a publisher and/or subscriber, and acts as a client on the network. If Adroit is a publisher, then it will write values out to other subscribers (when the tag is scanned using Output enabled). When Adroit is a subscriber, then it waits for data on a specific topic from any publisher to that topic. There are three parts of an MQTT transmission: Message: This is the data that is passed through the broker to all clients subscribed to a specific topic on the MQTT network. Topic: Some brokers support topic strings with a maximum of 128 levels and a maximum length of 250 bytes, so an MQTT client connection that exceeds those limits will be closed. QoS: Quality of Service, ensures delivery to connected clients: a. At most once - The published message is sent once, and if it does not arrive it is lost. b. At least once - Guarantees that the published message arrives, but there may be duplicates. c. Exactly once - Guarantees that the publish message arrives and that there are no duplicates. 1.1. Supported Hardware This driver has been tested on the following hardware: None applicable. The driver has been tested is known to work with the following brokers: • Mosquitto • HiveMQ _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 5 2. Wiring Not applicable. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 6 3. Device Configuration 3.1. Device Configuration Enable secondary – Turn this option to have the driver maintain 2 channels of communication, the radio buttons Primary and Secondary can then be used to toggle between configurations. 3.1.1. Driver Details Enable Secondary – (Default = OFF) Allows enabling of redundant MQTT Broker connections such that in case of a failure a switchover will occur. Primary – Allows configuration setting of the Primary broker connection. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 7 Secondary – Allows configuration setting of the Secondary broker connection. 3.1.2. Device Details Enable shadow scanning from master to standby – (Default = OFF) If enabled will stop any communication to the MQTT broker when the Agent server is in standby mode. By default, we assume parallel scanning. Enable standby reads – (Default = ON) Allows reading from the MQTT broker when agent server is in standby mode. Enable standby writes – (Default = OFF) Allows writing to the MQTT broker when agent server is in standby mode. Broker Host IP – The static IP Address or HOST name of the MQTT broker. Domain names are resolved to IP addresses. To connect over Websockets specify a hostname beginning with ws:// or wss://. For example: ws://test.mosquitto.org or test.mosquitto.org Port – A valid port number is required for the connection to take place. Client Name – The client identifier is a (1- 23 UTF-8 encoded) unique name to identify each MQTT client to the MQTT broker. It should be unique per client for a given broker, and each Adroit server device needs its own unique client ID. Click the button on the right-hand side to generate a random string for this field if required. Username – A username could be required by the MQTT broker. This allows authentication and authorization of clients to a broker. This must be a UTF-8 encoded string. Password – A password could be required by the MQTT broker. This allows authentication and authorization of clients to a broker. QoS – (Default = 2) Quality of Service level of each client. The level (0, 1 or 2) determines the guarantee of a message being delivered. Clean Session – (Default = True) This will tell the MQTT broker to establish a persistent session or not. If True, the broker will discard any data previously associated with the current client ID once successfully connected. Otherwise, when disconnected the broker and client will store the session, all subscriptions for the client and all missed messages, when QoS 1 or 2. Retain Flag – (Default = False) When publishing a non-empty message with the Retain flag set and a non-zero QoS level, will cause the server to store it (replacing any previously retained message in the process). When the message is stored, any new clients that subscribe to that topic will receive the message. Auto Reconnect – (Default = False) The MQTT driver will automatically reconnect to the MQTT broker if connection is lost. KeepAliveTime – The KeepAliveTime is a time interval that the client will continuously send control packets/PING requests to the MQTT broker to show that the client is still alive. If the broker does not receive a control packet/PING request within 1.5 times the KeepAliveTime, the broker MUST disconnect the network connection to the client as if the network had failed. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 8 Timeout – (Default = 60) If the Timeout is set to 0, all operations return immediately, potentially failing with an error if not completed immediately. If set to a positive value, then the driver will wait for the operation to complete before returning control. Retries – Number of retries before trying to switch between primary/secondary. Each Retry is 1 second. Will Topic – The topic to publish will payload. Can have a hierarchal structure with forward slashes as delimiters. Will Message – The message to publish when the Agent Server disconnects ungracefully. Will QoS Level – (Default = 0) Publish payload with QoS set. Will Retain Flag – (Default = False) This flag determines if the will message will be saved by the broker for the specific topic. New clients that subscribe to that topic will receive the last retained message on that topic after subscribing. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 9 4. Supported Addresses The scan address in Adroit is the topic in the MQTT protocol with a format prefix. A MQTT topic is a simple string with a hierarchical structure, with forward slashes as delimiters. For example: Prefix:City/house/bedroom/lamp/on PLEASE NOTE Currently the Adroit MQTT driver does not support wildcards, so please avoid using “+” and “#” characters in the scan addresses. Prefixes : Data type Prefix Example String S S:MYSTRING Long L L:MYSIGNED32 Double D D:MYUNSIGNED32 Integer I I:MYSIGNED32 Word W W:MYSIGNED32 Long F F:MYSIGNED32 INFORMATION Prefixes attempt to force the driver to pre-convert the I/O to various types and must be included. 4.1. Example Making use of the online MQTT Broker supplied by Mosquito you can test the MQTT functionality. Settings is as follows: HOST: test.mosquitto.org PORT: 1883 The scan address can be anything, as it relates to the Topic name. On this broker, scanning to any topic will register the topic and allow values to be transferred through the channel. Scanning a string agent to the broker will now have the following result in the scanniong dialog. _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_MQTT_CL.docx P a g e | 10 Other supported ports for various Mosquitto.org test co"}, {"title": "D_OPC_UA", "href": "drivers_html/D_OPC_UA.html", "category": "Drivers", "rel": "drivers_html/D_OPC_UA.html", "kind": "Driver", "text": "Adroit Technologies Protocol Driver Name OPC UA Client DLL D_OPC_UA _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_OPC_UA.docx P a g e | 2 COPYRIGHT Copyright © 2022 Advanced Worx 112 (Pty) Ltd. All rights reserved. Information in this document is subject to change without notice. The software described in this document is furnished under a license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of those agreements. No part of this publication may be reproduced, stored in a retrieval system, or transmitted in any form or any means electronic or mechanical, including photocopying and recording for any purpose other than the purchaser’s personal use without the written permission of Advanced Worx 112 (Pty) Ltd. Advanced Worx 112 (Pty) Ltd 20 Waterford Office Park 189 Witkoppen Road (c/o Waterford Drive) Fourways South Africa https://adroittech.co.za/ _____________________________________________________________________________________________________________________ ATQMS-DRVR-DOC-D_OPC_UA.docx P a g e | 3 Contents 1. Overview ............................................................................................................................................. 4 1.1. Connectivity .................................................................................................................................... 4 1.2. Driver Installation and Setup ............................................................................................................ 4 1.3. OPC UA Instance Certificates ........................................................................................................... 4 1.4. OPC UA Server Certificates .............................................................................................................. 5 2. Wiring ................................................................................................................................................. 6 3. Device Configuration .......................................................................................................................... 7 3.1. Device Configuration ....................................................................................................................... 7 3.1.1. OPC UA Server ......................................................................................................................................... 7 3.1.2. General ...........................................................
