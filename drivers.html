as only been tested in communication with Strike Enermax power meters. It does not implement any encryption/decryption features. Communication follows a 3-step cycle. INITIATE REQUEST (OPTICAL): The initiate step is common to all transactions, this is a log-on. Initiate request (local form) Start character Request code End Completion charcters / ? ! <CR><LF> Initiate request (remote form) Start character Request code Address End Completion charcters / ? 12345678 ! <CR><LF> Initiate response: Start Suggest rate Serial # (if remote) End Completion characters /STR 5 02 ! <CR><LF> READ BILLING DATA REQUEST: Follows on from initiate step. Start character Request code New Baud Rate Fn. Completion charcters x06 0 3 0 <CR><LF> Read billing data response: Start charcter Data End Completion characters ETX CRC x01 ?? ! <CR><LF> 03 XX XX Data is in following format, one register per line Register # Start Data End Completion characters 000 ‘(‘ Text value ‘)’ <CR><LF> logoff is automatic. SET CLOCK: Start character Request code New Baud Rate Fn. Completion charcters x06 0 3 1 <CR><LF> Password prompt: Start charcter Function STX STX Completion characters ETX CRC x01 P0 x02 x02 <CR><L"}, {"title": "Toshiba (RTU and ASCII)", "href": "drivers_html/Toshiba_RTU_and_ASCII.html", "category": "Drivers", "rel": "drivers_html/Toshiba_RTU_and_ASCII.html", "kind": "Driver", "text": "Toshiba : TOSHIBA Toshiba ASCII protocol driver Overview The TOSHIBA driver currently only supports the ascii-based protocol, the binary protocol is not supported in this driver. This driver supports the PROSEC T2 PLC, EX100 , EX500. Communication is RS-485. The ADROIT TOSHIBA driver will act as the master in a master-slave transaction system. See also: Toshiba binary driver and Toshiba Ethernet driver for T2. Device Configuration PLC Details PLC Station ID - Up to a maximum of 32 PLCs may be addressed. Local Details Port - The available serial ports on your machine. Baud rate - This is configurable. The TOSHIBA PROSEC T2 PLC supports the following baud rates : 300, 600, 1200, 2400, 4800, 9600 or 19200 bps. Select the appropriate baud rate from the dialogue’s drop-down list. Parity - This is configurable. Valid choices are None, Odd or Even. Printed 28-May-97 1 Protocol Driver Setup Manual Data bits - This is configurable. Valid choices are 7 or 8 bits. Stop bits - This is configurable. Valid choices are 1 or 2 bits. Retry - This is the number of times the ADROIT TOSHIBA driver will attempt a particular scan job before failing. Timeout - This is the maximum time the ADROIT TOSHIBA driver will wait for a response to its request message from the PLC. Optimisation (Global affects all devices) Prioritize write – Check this check box to ensure the driver will optimize writes. Wiring The Computer Link Port on the PLC must be used for communications between ADROIT and the PLC. This port accepts a 4-wire RS-485 interface. The Computer Link Port is a standard 15-pin female connector. The following table shows the pin assignment of the Computer Link Port : Pin No. Signal name Description Signal direction 1 FG Protective ground PLC ↔ Host 7 SG Signal ground PLC ↔ Host 8 SG “ PLC ↔ Host 15 SG “ PLC ↔ Host 3 TXA Transmitted data PLC → Host 11 TXB “ PLC → Host 2 RXA Received data PLC ← Host 10 RXB “ PLC ← Host 5 RTSA Request to send PLC → Host 13 RTSB “ PLC → Host 4 CTSA Clear to send PLC ← Host 12 CTSB “ PLC ← Host The driver was tested with the PC labs RS 422/485 card. Printed 28-May-97 2 Toshiba : TOSHIBA Supported Commands Area (Register/Device) Format (Integer/Real) Format (Boolean) Format (Strings) Description XW XW0 XW0.0 - XW0.15 N/A External Input Register YW YW0 YW0.0 - YW0.15 N/A External Output Register ZW ZW0 ZW0.0 - ZW0.15 N/A Link Relay Register RW RW0 RW0.0 - RW0.15 N/A Auxiliary Relay Register D D0 D0.0 - D0.15 D0 S2 Data Register C C0 C0.0 - C0.15 N/A Counter Register T T0 T0.0 - T0.15 N/A Timer Register Note: Strings are only supported for Data Registers by Adding “S” Registers. – Rev 13 Printed 28-May-97 4"}, {"title": "Toshiba T2 Ethernet", "href": "drivers_html/Toshiba_T2_Ethernet.html", "category": "Drivers", "rel": "drivers_html/Toshiba_T2_Ethernet.html", "kind": "Driver", "text": "Toshiba : TOSHIBA Toshiba T2 Ethernet protocol driver Overview The TOSHIBA Ethernet driver currently only supports the ascii-based protocol. This driver supports the PROSEC T2 PLC. Communication is UDP/IP. The ADROIT TOSHIBA driver will act as the master in a master-slave transaction system. PLC Details IP Address - This must be any available class B address on the network ie(OCTET1 must be > 127) setup in the PLC. Port - The first available UDP port setup in the PLC Local Details Retry - This is the number of times the ADROIT TOSHIBA driver will attempt a particular scan job before failing. Timeout - This is the maximum time the ADROIT TOSHIBA driver will wait for a response to its request message from the PLC. Local UDP Port – For indication only of the Local UDP port used for this device. NOTE: This is not a fixed parameter it can change at startup depending on available ports. Wiring Standard Ethernet interconnection. (10BASE-T) Printed 28-May-97 1 Protocol Driver Setup Manual Supported Commands Area (Register/ Device) Format (Integer /Real) Format (Boolean) Description XW XW0 XW0.0 - XW0.15 External Input Register YW YW0 YW0.0 - YW0.15 External Output Register ZW ZW0 ZW0.0 - ZW0.15 Link Relay Register RW RW0 RW0.0 - RW0.15 Auxiliary Relay Register D D0 D0.0 - D0.15 Data Register C C0 C0.0 - C0.15 Counter Register T T0 T0.0 - T0.15 Timer Register Message protocol The checksum value is the ASCII code of the lower two digits of the sum of all the values of all the bytes in a message starting from the first byte until the “&” termination byte. Telegram examples shown below. All values shown are in ASCII-HEX unless specified otherwise. Read request: Start Code Format ID Code Addr 2 bytes Command 2 bytes Start Register / Device variable bytes Checksum Delimiter CheckSum 2 bytes End Code Carriage Return ( A 01 DR XW0 & <<>> ) CR Read response: Start Code Format ID Code Addr 2 bytes Command 2 bytes Data variable bytes Checksum Delimiter CheckSum 2 bytes End Code Carriage Return ( A 01 DR <<>> & <<>> ) CR Write request: Start Code Format ID Code Addr 2 bytes Command 2 bytes Start Register / Device variable bytes Data Delimiter Number of data bytes Data variable bytes Checksum Delimite r CheckSum 2 bytes End Code Carriage Return ( A 01 DW XW0 , 1 <<>> & <<>> ) CR Printed 28-May-97 2 Toshiba : TOSHIBA Write Acknowledgment: Start Code Format ID Code Addr 2 bytes Command 2 bytes Status 4 bytes Checksum Delimiter CheckSum 2 bytes End Code Carriage Return ( A 01 ST 0002 & <<>> ) CR Revision information Date: Changes: 19-Sep- 2000 First release notes! Printed 28-May-97 3"}, {"title": "Unitronics PCOM M-90/M-2XX Series", "href": "drivers_html/Unitronics_PCOM_M-90_M-2XX_Series.html", "category": "Drivers", "rel": "drivers_html/Unitronics_PCOM_M-90_M-2XX_Series.html", "kind": "Driver", "text": "UNITRONICS PCOM_NET M90 : UNI_M90 UNITRONICS PCOM_NET protocol driver Overview Adroit supports communication with the following Unitronics Devices: M90-19-B1A or UNRESTRICTED for the other modifiable models. This driver has be tested with M-90 and a M-210. UNITRONICS PCOM_NET M90 : UNI_M90 PLC Details PLC Model – Select ‘M-90’ for standard M-90 Select ‘Unrestricted’ if the device is extended unrestricted provides for protocol maximums (not Device maximums). PLC Station ID – Network address if networked. Local Details Port – The available serial ports on your machine. Parity – default : even DataBits – default : 7 StopBits – default : 1 Baud rate – default : 9600, (9600,19200,38400,57600) Retry - The number of times that Adroit will try to gain communication with a PLC before failing a transaction. Timeout - The time that Adroit will wait for a valid response from a PLC before failing a transaction (Read or Write). Use 3Wire (Disable signaling) – (Default is off i.e. signalling enabled) Check this if you want to use 3 wire only. Note for M-2xx series users: The M-2xx series must have a function block loaded via Unitronics programming software ! Eg PCOM_NET , PCOM_NS where various settings are made available eg Addressing, Rs232 settings not normally available from the faceplate! NB – if retries persist continually : try lowering DTR delay settings in the function block! NB – Make sure if you have hardware handshaking enabled use the correct rs232c cable (not 3 wire) UNITRONICS PCOM_NET M90 : UNI_M90 Wiring Cable connection for RS232C communication (Connection between PLC and Computer) 1 Supported addresses M90 PLC data address types and maximum ranges supported by the Adroit M90 Protocol driver. Device Min Range Max Range PLC Data Type BOOLEAN INTEGER REAL Read Write DI Area 0 *1 Bit DI:0 - - Y N DO Area 0 *2 Bit DO:0 - - Y Y MI Area 0 *3 Unsigned 32bit Signed 32bit - - MI:0 W MI:0 I MI:0 W MI:0 I Y Y Y Y MB Area 0 *4 Bit MB:0 - - Y Y SI Area 0 *5 Unsigned 32bit Signed 32bit - SI:0 W SI:0 I SI:0 W SI:0 I Y Y N N M-90 model can be extended , hence *1 -not larger than 255 (M90 Device limit), 2048(Protocol limit) *2 -not larger than 255 (M90 Device limit), 2048(Protocol limit) *3 -not larger than 255 (M90 Device limit), 65535(Protocol limit) *4 -not larger than 255 (M90 Device limit), 65535(Protocol limit) *5 -not larger than 255 (M90 Device limit), 65535(Protocol limit) Size specifier (eg W) for Integers and Reals are not used but the default (W) is specified , this is to cater for possible future changes Connector of PC side (Female D9) Connector of PLC side (RJ-11) Dtr 1 0V Ref 2 TxD 3 RxD 4 0V Ref 5 Dsr 6 2 RxD 3 TxD 4 Dtr 5 SGrnd 6 DSR UNITRONICS PCOM_NET M90 : UNI_M90 Message protocol Protocol overview Read request: STX Station Function Start Addr Length Bcc ETX / 01 DI 00,0 04 XX /r Read response: STX ACK Station Function Start Addr Length Data bytes Bcc EOT / A O1 DI 00,0 04 00 00 00 00 XX /r Write request: STX Station Function Start Addr Length Data Bcc ETX / 01 DO 00,0 01 01 XX /r Write response: STX ACK Station Function Start Addr Length Bcc ETX / A O1 DI 00,0 01 XX /r The following transactions are supported: 1.Read (RE) Digital Input 2.Read (RA) Digital Output 3.Write (SA) Digital Output 4.Read (RW) Internal Integer 5.Write (SW) Internal Integer 6.Read (RB) Internal Bit 7.Write (SB) Internal Bit 8.Read (GF) System Integer BCC: The Bcc is obtained by adding every byte except STX,ETX and Bcc and Ack, truncated to a Byte , where each nibble is converted to its corresponding Ascii value. Eg 40h+41h+43h = 124h =Truncated> 24h =Converted ( 3234h or ‘24’Ascii) Revision information Date Changes 29/05/2000 Revision 0 – 1st release. 01/09/2006 Revision 5 – Added a 3wire disable signalling checkbox."}, {"title": "Untitled Document", "href": "drivers_html/Untitled_Document.html", "category": "Drivers", "rel": "drivers_html/Untitled_Document.html", "kind": "Driver", "text": "COMLI System Description COMLI System Description Copyright © 1998 ABB Satt AB. The contents of this document can be changed by ABB Satt AB without prior notice and do not constitute any binding undertakings from ABB Satt AB. ABB Satt AB is not responsible under any circumstances for direct, indirect, unexpected damage or consequent damage that is caused by this document. All rights reserved. Release: Document version: Document number: Printed in Sweden 9903 493-0192-11 3-2 Foreword Since the first edition of the COMLI system description was published, significant changes have taken place both on ABB Automation’s control systems and the COMLI protocol. New systems have been launched and old systems have become obsolete. This has produced new demands on COMLI resulting in new messages emerging and old messages disap- pearing. In this new version, the chapters related to individual control systems have been omitted to facilitate future updating. Instead, the reader is referred to the COMLI description for the relevant system. Major sec- tions of the description have also been restructured. We hope that these changes will provide a description that is easier to use and which is updated with all the message types currently in use. ABB Automation reserves the right to make changes to the documenta- tion without prior notice. If readers discover any errors, unclear information or have other sugges- tions related to the contents, ABB Automation will be grateful to receive their comments. Contents 1 COMLI .....................................................................................1 1.1 Introduction .................................................................................1 1.2 COMLI - principle of operation .................................................2 1.3 Communication interfaces ..........................................................7 1.4 COMLI message format .............................................................9 1.5 Capacity ....................................................................................14 1.6 Procedure for linking control systems with COMLI ................15 2 Message types .........................................................................17 2.1 General ......................................................................................17 2.2 List of COMLI messages ..........................................................18 2.3 Status of I/O-bits .......................................................................19 2.4 Register .....................................................................................24 2.5 Controller data ..........................................................................30 2.6 Limiter modules ........................................................................41 2.7 Analogue input signals .............................................................45 2.8 Alarm text .................................................................................48 2.9 Measuring ranges and units ......................................................59 2.10 Date and time ............................................................................62 2.11 Floating point register ...............................................................65 2.12 Trend curve data .......................................................................67 2.13 Timers .......................................................................................74 2.14 Data and program areas ............................................................76 2.15 Time marked events ..................................................................84 2.16 Mixed data types .......................................................................89 2.17 Terminal mode ..........................................................................91 2.18 Acknowledge ............................................................................92 3 Supplement .............................................................................93 3.1 Calculation of checksum BCC ..................................................93 3.2 STAMP function .......................................................................93 3.3 Flow chart - communication between Master and Slave ..........94 3.4 Old message types ....................................................................95 3.5 ASCII table .............................................................................108 COMLI 1 1 COMLI 1.1 Introduction COMLI (COMmunication LInk) is a ABB Automation data transmission sys- tem for communication between control systems and between control systems and computers. COMLI is a conventional communication link using serial, asynchronous data transmission in half duplex mode, i.e. one direction at a time, and according to the master/slave principle. This document provides detailed information on COMLI for personnel requir- ing a thorough understanding of the system in order to implement COMLI in a particular application or locate faults on a system. The description assumes a knowledge of ABB Automation’s control systems and the terminology used in the control system descriptions. COMLI is the most common data communication system used with the ABB Automation family of control systems. Latest generation installations provid- ing operator presentation as well as PLC facilities may use new data transmis- sion systems such as MMS. When COMLI is also used in these new systems, implementation is slightly different to when COMLI is used for data commu- nication between SattCon systems only. Throughout this description it is assumed that only SattCon systems are used. Definitions Master and Slave The terms master and slave are used frequently throughout this handbook. Master in a communications context means the controlling station which always initiates the message transmission sequence. Slave means a reply sta- tion which cannot start a communication sequence but simply responds to calls from the Master station. Hexadecimal notation and ASCII format When communication via COMLI is used 2-digit hexadecimal notation is used to described a byte. This is indicated by the suffix H after the hexadecimal characters. The data in the last byte of the message is coded in hexadecimal format, other bytes are coded in ASCII-hexadecimal format. I/O-bit ABB Automation’s control systems include a memory area called I/O RAM containing the I/O rack’s digital input and output signal statuses. In addition to I/O RAM, storage for memory cells, timer indications, limiter modules etc. is also included. An advantage with I/O RAM is that unused channels on the input and output cards can be used as working memory cells for temporary storage of intermediate results. Throughout the remainder of this description the term I/O bit refers to a location in this I/O RAM. 2 COMLI Letter codes The following letters are used to identify the various types of address: P = an address of 16 contiguous I/O-bits in I/O-RAM. AI = analogue input signal address. A = analogue output signal address. R = 16-bit register address. 1.2 COMLI - principle of operation ABB Automation’s systems communicate with each other and with other com- puters using COMLI (COMmunication LInk). COMLI is one of ABB Auto- mation’s communication networks using serial, asynchronous data transmission in half duplex mode (one direction at a time) and in accordance with the Master/Slave principle (the Slave does not reply if there is an error in the message received). Master and Slave can be linked together in different ways to achieve the desired function, i.e. Point-to-Point, Multipoint (Multidrop) or radial configu- ration (see the section on Network configuration). Up to 32 Slave systems can be connected to a Master system in a multipoint configuration. Master and Slave are linked via the serial channels on the different systems which are to communicate with each other. Master and Slave need not use the same physi- cal channel numbers in both the systems. They must however have the same character format, transmission speed etc. Communication is controlled by the PLC programs in the different control sys- tems. By activating a predetermined memory cell, the PLC program in the control system acting as Master transmits a message. When the Slave receives the message, it responds either by sending the requested information or by acknowledging the information received. The memory cell is reset when the Master receives the information or an acknowledgement from the Slave. The information in ABB Automation's control systems is stored in the differ- ent memory modules. About 50 different message types are defined for the various types of information to be transferred. When the master starts a communication sequence, a communication area determines the type of data to be transferred. The data is transmitted and received via a serial channel defined using a channel definition area. Network configurations There are two network configurations for a COMLI serial communication net- work: • Multipoint communication • Point to point communication COMLI 3 Multipoint communication Several Slave systems are connected to a master in multipoint communication. Communication takes place between Master and one Slave at a time. Direct communication between Slave systems is not possible. A particular message from the Master is applied to all Slaves but only the slave whose unique iden- tity corresponds to the identity contained in the message accepts the data. The number of Slaves which can be connected to each Master is limited by the communication interface. The RS485 interface must be used in multipoint communication. The Master transmit line is connected to all Slave receive lines and all Slave transmit lines are commoned and connected to the Master receive line. RS485 permits 32 Slave systems to be connected to a Master. The COMLI communications software can handle a maximum of 247 Slaves. Example of multipoint communication Point to point - communication In point to point communication, only one Slave system is connected to the Master via one communication interface. Several Slaves can be connected to the Master but this must take place via different communication interfaces. This form of point to point configuration is called a radial (star) network and can provide a higher capacity than multipoint communication. The electrical interface can be either RS232/V24 or RS485. A current loop can also be used in certain special cases. This is stated in the relevant system description. Example of point-to-point communication Master The Master always initiates the message transmission sequence, whether transmitting data to a slave or requesting data from a slave. The main functions of the Master are: • To transmit data to the Slaves and receive the data transmitted by the Slaves. • To process the messages received from the Slave. • To repeat a message transmission if errors occur. MASTER SLAVE 1 SLAVE 2 SLAVE 3 SLAVE 247 Channel n SLAVE 1 SLAVE 2 MASTER Channel n Channel m 4 COMLI The processing of messages consists of checking that they are valid, determin- ing the message type and taking the action appropriate to that message type (e.g. entering the status of an I/O bit when a message requesting the status of an I/O bit is transmitted and a valid reply is received). Since the Slave never replies with an “error message”, the Master always knows how many characters it should receive in a message. If the Master requests a certain quantity of data, the Slave replies with the stated number of bytes or not at all. Up to 10 retransmissions can be attempted if any errors are detected (the actual number permitted is system dependent). This is followed by automatic error message printouts in earlier SattCon systems. In other systems, alarm supervi- sion must be connected to a memory cell in the I/O RAM for an error message to be printed out. Master transmit/re"}, {"title": "User-defined Exception-based", "href": "drivers_html/User-defined_Exception-based.html", "category": "Drivers", "rel": "drivers_html/User-defined_Exception-based.html", "kind": "Driver", "text": "User Defined Protocol Driver: UserDrv User Defined Protocol: protocol driver Overview The UserDrv protocol driver for Adroit is a generic paging and text device driver. Messages configured in String or Notifier Agents may be sent via an encoder or modem to paging devices. Alarms that occur in Adroit can thus be routed to automatically page a person. This driver is intended for easy use with many varied text protocols, while allowing advanced users to configure custom protocols of their own. No windows drivers for a modem (is used) are needed, this driver provides it’s own interface and control over the modem via the serial port or IP address assigned to it. Sections User Defined Protocol: protocol driver.....................................................................................................1 Overview................................................................................................................................................1 Driver Installation and Setup.................................................................................................................1 Wiring....................................................................................................................................................7 Supported Addresses..............................................................................................................................7 Agent, SMS alarm and Scanning Configuration....................................................................................8 Data Acquisition Devices....................................................................................................................10 Cellular GSM Modems........................................................................................................................13 Custom Protocols.................................................................................................................................15 Message protocols................................................................................................................................22 Modem reference.................................................................................................................................24 Troubleshooting...................................................................................................................................25 Abbreviations.......................................................................................................................................28 Revision information............................................................................................................................28 Driver Installation and Setup Installation of the UserDrv protocol driver is done in the standard way in Adroit Set-up. After installation of the driver, the user may then create and configure devices for the UserDrv driver. Devices At a minimum, you must create at least one device for each encoder/modem. Currently, the port settings for all devices on a port must be identical. I.e.: It is not permitted for example to use Vodacom and AutoPage protocols together if they use different data bit settings. Printed 14-Aug-03 1 User Defined Protocol Driver: UserDrv Device configuration dialog Fig. 1 UserDrv Details settings Communication mediu m Used to select whether TCP/IP or serial will be used as the communications medium. Printed 14-Aug-03 2 User Defined Protocol Driver: UserDrv Port The communication port to which the modem/device is attached. A coloured icon helps indicate if the port is used or not, (red icon replaces the asterisk that used to appear). Parity The type of parity, odd, even or none. Baud The baud-rate, in the case of a modem, select the highest usable speed. Data bits The number of data bits will depend on the service used. Stop Bits The number of stop bits to use will depend on the service used. Timeout The time to wait for a response from the locally connected device. Use DNS Looku p Checking this box will use the DNS Server IP and hostname to do a lookup of the Device IP Address. This allows devices to be referenced which may have dynamic IP Addresses. DNS Server IP The IP address of the server to use for DNS lookup. Hostname The hostname of the device for which the IP address is to be requested from the DNS server. Lookup Test Clicking this button does a DNS lookup and brings up a dialog box showing the IP address retrieved. Device IP Addre ss The IP address that will be used to communicate with the device. If the “Use DNS Lookup” box is checked this IP address will be the result of a DNS lookup based on the DNS Server IP and Hostname Ping Test Clicking this button will do a ping test and display the result in a dialog box Port This is the port number that adroit will use when communicating with the device Protocol selecti on Select a pre-defined protocol or “User defined” if you want to use a definition file. When selecting a predefined protocol, the next field is ignored. Transmission strings file The file to use if selecting a definition file, selection is disabled and ignored if “User defined” is not selected. Retries Number of attempts to communicate. Transaction timeout (s) Total number of seconds before a transaction will be deemed as impossible. This setting is a safety stop in case the driver gets stuck or the remote device keeps giving the same bad response. (This figure is added to the time used to dial up if using a modem) Setting screen notes: • If using AutoPage, select 7 data, no parity with one stop bit. • If using Vodacom, MTN or Zetron , select 8 data, no parity, one stop bit. • The Communications Script is called a Protocol Format File or .PFF file. Printed 14-Aug-03 3 User Defined Protocol Driver: UserDrv • Clicking “Load protocol defaults” will apply certain relevant configuration settings from the script to this device’s settings. • The “Notepad” button will allow you to edit a script if it is a custom script, or if it has been exported. • The “check” button opens a dialog showing the parsed script. If there are any errors, they will be shown. REMEMBER, when using a built-in protocol, the PFF file if present is ignored at runtime. Advanced configuration Dialog Enable Debug log text file Enables logging of debugging data to a specified text file. Log transmission failures Enables logging of transmission failures to the text file. Log successfull transmissions Enables/Disables logging of successful transmissions to the text file Disable device on startup for This will inhibit the sending of write messages for a user configurable period after the device is started. This is defaulted to zero. Use with extreme caution as this can very well cause alarm notifications to not be sent. Printed 14-Aug-03 4 User Defined Protocol Driver: UserDrv Modem configuration dialog Fig. 2 The Modem button (See Fig. 1) will bring up the Modem Settings dialogue (Fig. 2 above). Printed 14-Aug-03 5 User Defined Protocol Driver: UserDrv Use modem - Will enable modem dialling and carrier detection features here. If you do not use a modem, clear this tick-mark. Ignore Dial tone - Must to be ticked if a dial tone is not always present or very clear. If line detection problems persist, try putting extra commas in before the number to dial. Turn this box on if going via a PABX were you need to put a “0,” in front of the number. Numbers to dial - The telephone number, which must be dialled to create a connection. (More detail below) Tone / Pulse – Tone dialling may not be available in your area, if in doubt use pulse dialling which is a bit slower. Connect timeout – The total amount of time from the commencement of dialling, until the modems finish connecting. (Carrier detected), recommended value 45000 is 45 seconds. Inactivity timeout – The amount of time the driver will “keep” an idle connection open for in order to allow sending of additional messages without having to redial (must be supported by the protocol however). Recommended value of 30000 is 30 seconds. Use 0 if you want the modem to hang up immediately after a transaction completes. Modem control String – The default modem control string is ATE0&D2&C1. If no string is specified, the driver will use the default string. Modem setting screen notes: • For an Auto-Page dial-up you need to disable compression and error correction features; on newer modems, use the following string. ATE0&D2S15=255&C1&W0. This will turn off ARQ, MNP features on the US robotics modems. • The Phone number entry may need a “0,” before the number to allow for dialling out via switchboard, in which case you must turn on the “ignore DT” setting. Try using additional commas after the “0” or even before the “0” to compensate for the local PABX delays. In the case of cell phones, the number entered must be a service providers SMS (Short Message Service) number. • The driver will re-organise the phone-list at run-time so that the last working number is always on top. This works well if 3 or more numbers are provided, the driver will try a number and then demotes it to the bottom of the list if the number fails to result in a successful transmission. The Agent Server must be running in an account with Administrator rights for the number-list to be auto re-organised in this way. • SMS Dial-up number for MTN : The SMS number is 0839009000, only specify the cell number in the user code, omit the 083 prefix. • If using the new MTN 0839009002 number to send to 073 numbers; specify the numbers 0831234567 and 0731234567 in the notify agent as 831234567 and 731234567 respectively. • SMS Dial-up number for VODACOM : The SMS number is 0822442244, only specify the cell number in the user code, omit the 082 prefix. • AUTOPAGE : The number depends on area you are in. Printed 14-Aug-03 6 User Defined Protocol Driver: UserDrv How to upgrade from the old pager driver. 1. Take a note of the driver settings for all devices configured on pager, and then delete all the devices in Driver Setup (not in the Agent Server configurator!). 2. Add the devices back, but this time using the ‘User Defined‘ driver, instead of pager. Select your protocol from the list in the driver setup and click on “load protocol defaults”. 3. Now change any settings as necessary, click on “Modem” and edit the dial-up number if needed. “OK” the changes and a message will appear indicating that performance counters were successfully installed (first time only). 4. If any errors occur in this procedure, log off and log on as administrator and try again. 5. Run your agent server again as normal, if you are running as a service, we recommend stopping the service via control panel and running the server as a window from the icon in your start menu until it is working correctly. 6. Verify correct operation. 7. You can now delete the old pager.dll file, or rename it to have the .BAK extension. Wiring For standard modems, use the modem cable supplied with the modem, for other devices see manufacturer documentation. The normal modem cable provides pin-to-pin matching, and is often also referred to as a null modem cable. Supported Addresses The user driver does not have a strict addressing mechanism, addressing individual I/O is only required when the driver is used in a text protocol to acquire data. For pager and SMS, use scan addresses as Notify : n , where n is a number from 1 to 99999. When acquiring Digital, String or Analogue values, scan addresses are Digital : n or String : n or Analog : n When adding items to the scan point list, there is no difference between using a Notifier Agent and a String Agent. For sending user strings to the script to use in building messages: User: n, where 1<=n<=10; These must be string slots that are used. Take care when using these values that they are scan inhibited as the driver will do an empty string update at device startup to trigger an output initialize if enabled. Printed 14-A"}, {"title": "What is new in the Adroit 10 Release", "href": "drivers_html/What_is_new_in_the_Adroit_10_Release.html", "category": "Drivers", "rel": "drivers_html/What_is_new_in_the_Adroit_10_Release.html", "kind": "Driver", "text": "________________________________________________________________________________________________________________________ ATQMS-MKTG-DOC-What is new in the Adroit 10 Release P a g e | 1 COPYRIGHT Copyright © 2020 Advanced Worx 112 (Pty) Ltd. All rights reserved. Information in this document is subject to change without notice. The software described in this document is furnished under a license agreement or nondisclosure agreement. The software may be used or copied only in accordance with the terms of those agreements. No part of this publication ma T: HASPs are NOT backwardly compatible with previous product versions due to a change in the internal licensing structure of the HASPs. The Adtech Licensing Utility allows you to get, view and/or update your Adroit product license. • The product license is now a .XML document to make it easier to read and is displayed in the License tab. IMPORTANT: The former Remote Nodes licenses that applied to all types of clients have been DISCONTINUED. These have now been replaced by the following client specific node licenses, each of which have different costs: • Clients: typically Operators and/or Designers and • Web Clients: typically Performance Anywhere clients. • Remote Desktop (RDP) clients can now get a free node connection to obtain engineering access to the Agent Server, by adding and configuring the RDAdminName WG.INI registry string value. Note: By default, this registry entry does not exist and therefore all Remote Desktop (RDP) clients are subject to node licensing. This registry value must be created and set to the required Windows username to establish free connections for this user. The OEM (separately-licensed) components are no longer specified by their associated OEM codes but now included as separate textual entries in the product license, so that users can easily see exactly which components they are currently licensed for. Tip: Only the OEM components that you are licensed for will appear. • All product licenses have a GLOBAL expiry and can also support product-specific expiries, which can be used for product trials. • .V2C (Vendor to Customer) and .C2V (Customer to Vendor) files are now used to create and update product licenses instead of using .RUS files. A new licensing methodology has been added to support new product variants (Ignite and OPC/Edge Gateway) where rather than using traditional scan point licensing the system will count the number of user defined agents. Note: Full and Lite / HMI products continue to use the traditional scan point methodology 1.1.1. Important differences between a HASP and a Soft License: • A HASP license is bound to a USB HASP, which has a specific serial number - this is therefore portable and not restricted to a specific computer but has associated security risks and needs to be insured at your own risk. • A Soft license is bound to a specific computer and therefore cannot be transferred ____________________________________________________________________________________________________________________________ ATQMS-MKTG-DOC-What is new in the Adroit 10 Release P a g e | 4 1.2. Install Adroit 10 is designed to run on Windows 10 and Windows Server 2008 R2 onwards, it no longer supports the Windows Vista nor Windows Server 2008 operating systems. Adroit 10 requires Microsoft .NET Framework 4.6.2. If this is not installed then the installation uses an offline installation that it provides to install this for you (so no further downloading is required). IMPORTANT: The install can no longer be installed if the name of the user running it is called \"Administrator\", since this COULD be the built-in Windows Administrator account, which is DISALLOWED because UAC is automatically disabled whenever this built-in Administrator account is used, which causes a myriad of problems to occur. When installing the Agent Server, the Component Configuration Settings dialog does not provide the option of not installing the Agent Server and SmartUI Server "}];
const SELF = "drivers";
const ADD_FROM = true;

function uniq(arr) {
  return [...new Set(arr)];
}

function normalise(s) {
  return (s || "").toLowerCase();
}

function getQ() {
  return document.getElementById("q").value || "";
}

function addParamsToHref(href, q, from) {
  try {
    let parts = href.split("#");
    let base = parts[0];
    let frag = parts.length > 1 ? "#" + parts.slice(1).join("#") : "";

    let joiner = base.includes("?") ? "&" : "?";
    let qp = new URLSearchParams();
    if (q) qp.set("q", q);
    if (ADD_FROM && from) qp.set("from", from);

    return base + joiner + qp.toString() + frag;
  } catch (e) {
    return href;
  }
}

function render() {
  const qRaw = getQ();
  const q = normalise(qRaw);
  const cat = document.getElementById("cat").value;
  const mode = document.getElementById("mode").value;

  let filtered = ITEMS.filter(it => {
    if (cat && it.category !== cat) return false;
    if (!q) return true;
    const hay = normalise(it.title + " " + it.rel + " " + it.category + " " + (it.text || ""));
    return hay.includes(q);
  });

  filtered.sort((a,b) => a.title.localeCompare(b.title));

  document.getElementById("counts").textContent =
    `${filtered.length} item(s) shown (of ${ITEMS.length}).`;

  const host = document.getElementById("results");
  host.innerHTML = "";

  const makeItemHtml = (it) => {
    const kind = it.kind ? ` <span class="small">[${it.kind}]</span>` : "";
    const href = addParamsToHref(it.href, qRaw.trim(), SELF);
    return `<a href="${href}">${it.title}</a><span class="small">[${it.category}]</span>${kind}`;
  };

  if (mode === "alpha") {
    const ul = document.createElement("ul");
    filtered.forEach(it => {
      const li = document.createElement("li");
      li.innerHTML = makeItemHtml(it);
      ul.appendChild(li);
    });
    host.appendChild(ul);
    return;
  }

  const byCat = new Map();
  filtered.forEach(it => {
    if (!byCat.has(it.category)) byCat.set(it.category, []);
    byCat.get(it.category).push(it);
  });

  const cats = Array.from(byCat.keys()).sort((a,b)=>a.localeCompare(b));
  cats.forEach(c => {
    const div = document.createElement("div");
    div.className = "group";
    div.innerHTML = `<h2>${c}</h2>`;
    const ul = document.createElement("ul");
    byCat.get(c).forEach(it => {
      const li = document.createElement("li");
      const href = addParamsToHref(it.href, qRaw.trim(), SELF);
      const kind = it.kind ? ` <span class="small">[${it.kind}]</span>` : "";
      li.innerHTML = `<a href="${href}">${it.title}</a>${kind}`;
      ul.appendChild(li);
    });
    div.appendChild(ul);
    host.appendChild(div);
  });
}

function initCats() {
  const select = document.getElementById("cat");
  const cats = uniq(ITEMS.map(x => x.category)).sort((a,b)=>a.localeCompare(b));
  cats.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    select.appendChild(opt);
  });
}

["q","cat","mode"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});

document.getElementById("clear").addEventListener("click", () => {
  document.getElementById("q").value = "";
  document.getElementById("cat").value = "";
  document.getElementById("mode").value = "alpha";
  render();
});

initCats();
render();
</script>
