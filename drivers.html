ge the byte order of word 16-bit register results.\nSwap LONG word ordering – Toggle to change the word order of long 32-bit register\nresults.\nSwap floating-point value ordering – Toggle to change the word order of floating 32-bit\nregister results. Must be selected for communication to all genuine Modicon equipment.\n2.5.3. General\nUse sequence numbering in the M-BUS header – (Default = checked) Increases data\nintegrity if using a slow and noisy media or getting timeouts. This option may be incompatible\nwith simple Modbus slaves which do not copy the frame reference bytes in the open-MBUS\nheader.\nOptimise scanning of Coils and relays to only scan the exact number of elements –\nTurn on this option to prevent the driver from reading multiples of 8 bits (at least 1 byte ) and\ninstead read only the required number of bits.\nUse function6 (Write Single Holding Register) – (Default = unchecked) This will use\nfunction 06 to write single registers instead of writing one register using multiple register write\nfunction. Some PLCs only support function 06.\nDetailed debugging information – (Default = unchecked) This causes the driver to add\nmore debugging information to the datascope, such as data values and more specific\ninformation relating to each protocol message.\nEnable Unsolicited support - (Default = checked) If checked, it will enable the driver to\n‘listen’ for incoming (holding register writes) unsolicited data on local Port 502. However, the\ndriver will ignore non-scanned data points.\nUse IEC Standard Addressing - (Default = checked) If checked, it will enable the driver to\nuse IEC addressing when validating, for example %MW0 instead of 400001. %MW0 = 400001.\n\n[Page 10]\nATQMS-DRVR-DOC-MOD_ETH.docx\nP a g e | 10\nAddress 255 Padding required - (Default = checked) If checked, it will force the driver to\nuse a 16-bit address word prefixed with a 0xFF pad byte when the address is larger than 254\n(decimal).\nSee Address padding below for examples.\nUse Modbus serial encapsulation in TCP/IP - (Default = unchecked) If checked, it will\nremove the TCP header and add a CRC to match the serial Modbus protocol. This data is\nencapsulated into the data portion of the IP packet and sent to a dumb TCP to serial\nconvertor/gateway where the data portion is simple retransmitted on its secondary serial bus.\nPLEASE NOTE\nSome gateways are intelligent and do not need the driver to prepare the Modbus packet. You\nmay need to investigate the device specifications to see if it prepares this for you, or you may\nneed to experiment with this setting enabled and disabled.\n2.5.4. Custom PLC type: PDU lengths\nPLEASE NOTE\nThis is an advanced feature. Changing these settings without special consideration can break the\ncommunication altogether.\nUsed in conjunction with the “CUSTOM” plc type, set the appropriate limits here, if the device\ntype is anything other than custom, the custom values will be ignored. Length count is in bits\nfor Outputs(coils) and inputs, and 16bit registers for the others.\nOutputs 000000, Inputs 100000, It is best to have length in multiples of 8, i.e. 16 will\nresult in 2 data bytes returned in the data portion of the PDU. Some bit-devices don’t respond\ncorrectly if not using a multiple (a minimum of 1 and maximum of 1984).\nAnalogue 300000, Holding 400000, Extended holding 600000 16-bit register types;\nany number ca"}, {"title": "Modbus RTU Ethernet TCP-IP Multi Channel", "href": "drivers_html/Modbus_RTU_Ethernet_TCP-IP_Multi_Channel.html", "category": "Drivers", "rel": "drivers_html/Modbus_RTU_Ethernet_TCP-IP_Multi_Channel.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-MOD_EMC_new.docx\nP a g e |\n1.\nOverview ................................................................................................................................................. 4\n2.\nRevisions .................................................................................................................... 9\n6.1.4.\nInput Registers 300001- 365535 (%IW0-%IW65535) ...................................................................................... 19\n6.1.5.\nHolding Registers 400001- 465535 (%MW0-%MW65535) ................................................................................ 20\n6.1.6.\nExtended Registers 600001- 498303(NB 600000 is valid) (%ME0-%ME98303) ................................................... 21\n7.\nGeneral Notes and Troubleshooting ..................................................................................................... 22\n7.1.\nContact Details ................................................................................................................................... 22\n7.2.\n7.3.\nPLC Exception Codes .......................................................................................................................... 22\n7.4.\nDiagnostic Traces ............................................................................................................................... 23\n7.5.\nDatascope Considerations ................................................................................................................... 24\n\n[Page 4]\nATQMS-DRVR-DOC-MOD_EMC_new.docx\nP a g e |\n1.\nOverview\nAdroit supports communication with the following PLCs: Modicon 84, 884, 184, 384, 484, 584,984,\nQuantum, Premium, M340, Ethernet/serial gateways and many other third-party devices over TCP/IP\nusing MOD_EMC and its sister driver MOD_ETH (Modbus Ethernet).\nMOD_EMC implements various optimizations over MOD_ETH to ensure very high-speed\ncommunications and includes the ability to configure multiple channels on one device configuration,\nscan tasks will then be load balanced over these channels.\nMOD_ETH and MOD_EMC are interchangeable due to identical registry and addressing structures,\nand they can be run simultaneously.\nLogical devices are still possible but redundant unless special requirements such as requiring\npermanent separation of the devices scan list to say stop parts of the list.\n\n[Page 8]\nATQMS-DRVR-DOC-MOD_EMC_new.docx\nP a g e |\nFor Multiple logical mappings to one PLC (as multiple Adroit devices), use the same IP and Port\nnumber. The driver will only open multiple sockets (parallel connections) to this physical device if\nthe “Create multiple connections...” checkbox is selected in the Advanced Settings Dialog.\n4.1.3. Dynamic IP via DNS Lookup (Disabled until required)\nWhen Dynamic IP via DNS is enabled, the driver will launch a thread that will attempt to lookup an\nIP address when retries are exhausted and found to be failing. This lookup process will continue\nindefinitely until the Agent Server is stopped. It will not block a connection or the Agent Server\nread/writes which will continue on existing connection parameters until changed by a successful\nlookup, which will then save those new parameters.\nThis mode can be used on connections that are on the internet and have a dynamic IP such as when\nusing ADSL that change IP address once a day. The device will need to be registered on a DNS\nserver such as DYNDNS.ORG\nEnable – (Default = unchecked) This will enable the DNS Lookup mechanism.\nDNS Server IP – IP address of the DNS server that will handle lookup requests.\nHost Name – The name of the machine/PLC registered on the DNS server. This name is used to\nrequest the associated IP address. The IP address returned will be stored in the IP Address field\ndynamically in the PLC Details.\n4.1.4. Local Details\nRetry - The number of attempts that the Master will attempt to communicate with the PLC before\nfailing a transaction.\nTimeout - The time that the Master will wait for a valid response from a PLC before failing an\nindividual transaction (Read or Write).\n4.1.5. Test Device Config for Connectivity\nThis section is available to help users determine whether the settings they have entered are valid\nand Adroit can communicate with your device. The Agent Server is not required to be running.\nTest Address – An address in your device which will be polled when the “Read Address” button is\nclicked. The address entered must be valid and will match the IEC or Standard Modbus addressing\nscheme selected in the advanced dialog.\nIO Type – Defines the base address type to be read, i.e., Boolean, Integer, Real or String80.\nRead Address – Click this button to poll the PLC with the current settings in the dialog.\nReply – The successful or failed result will be updated to this static text control.\nPing Test – Click to verify that the TCP/IP address entered into the boxes can be accessed using a\nping, an appropriate message box will appear as to the result.\n\n[Page 11]\nATQMS-DRVR-DOC-MOD_EMC_new.docx\nP a g e |\nBackoff count (mSec) … (Default=2) After the backoff-count is consecutively exceeded the\ndriver will enter a backoff mode, rejecting any further reads or writes on all channels until the period\nis exceeded, then one is allowed through to test for resumption , if it still fails then the driver will\nre-enter the backoff period again.\nPLEASE NOTE\nPlease note setting backoff count to too high a value will negate the usefulness , recommended <\n10 , remember timeouts and retries are also taken into account\n4.2.2. Byte Ordering\nReverse Modbus coil MSB/LSB ordering when scanning them into integers – If Integer or\nReal Agents are scanned to coil(0xxxxx) or input(1xxxxx) region and the result appears jumbled,\nuse this setting to reverse the ordering and swap the endian order.\nForce 16bit boundary justification. - If (checked - default) the driver will force Integer or Real\nAgents scanned to coil(0xxxxx) or input(1xxxxx) region to be mapped into 16 bit word boundaries.\nReverse MSByte/LSByte ordering when scanning Holding register bits into Booleans. -\nbefore unpacking to Boolean Agents the word data returned from a holding register is first byte\nswapped.\nSwap byte ordering on Strings Agents – Toggle to change the byte order of each word that the\nstring occupies, for example “EHLL1O”   “HELLO1” .\nSwap word’s byte order– Toggle to change the byte order of word 16 bit register results.\nSwap LONG word ordering – Toggle to change the word order of long 32 bit register results.\nSwap floating-point value ordering – Toggle to change the word order of floating 32 bit register\nresults. Must be selected for communication to all genuine Modicon equipment.\n4.2.3. General\nUse sequence numbering in the M-BUS header – (Default = checked) increases data integrity\nif using a slow and noisy media or getting timeouts. This option may be incompatible with simple\nModbus slaves which do not copy the frame reference bytes in the open-MBUS header.\nOptimize scanning of Coils and relays to only scan the exact number of elements – turn\non this option to prevent the driver from reading multiples of 8 bits (at least 1 byte), and instead\nread only the required number of bits.\nUse function6 (Write Single Holding Register) – (Default = unchecked) This will use function\n06 to write single registers, instead of writing one register using multiple register write function,\nsome PLCs only support function 06.\nInsert spaces for non-printable characters in strings – (Default = checked) This will change\nany character that is less than a space “ ” 0x20 and greater than “~” 0x7e. These are referred to as\n\n[Page 12]\nATQMS-DRVR-DOC-MOD_EMC_new.docx\nP a g e |\nnon-printable and can cause load and save problems in the wgp file. (Opt-out if previous functionality\nis needed).\nDetailed debugging information – (Default = unchecked) This causes the driver to add more\ndebugging information to the datascope, such as data values and more specific information relating\nto each protocol message.\nUse IEC Standard Addressing - (Default "}, {"title": "Modbus RTU-ASCII Serial", "href": "drivers_html/Modbus_RTU-ASCII_Serial.html", "category": "Drivers", "rel": "drivers_html/Modbus_RTU-ASCII_Serial.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-MODBUSI.docx\nP a g e | 3\n1.\nOverview ............................................................................................................................................... 4\n1.1.\nModbus Emulators ..............................................................................................................................4\n2.\nWiring ................................................................................................................................................... 5\n2.1.\nWiring ...............................................................................................................................................5\nDevice Configuration ............................................................................................................................ 6\n3.1.\nDevice Configuration ..........................................................................................................................6\n3.1.1.\nPLC Details .................................................................................................................................................. 6\n3.1.2.\nLocal Details ................................................................................................................................................ 6\n3.1.3.\nHandshaking ............................................................................................................................................... 7\n3.1.4.\nNetwork Latency/Delays ............................................................................................................................... 7\n3.2.\nModem Support .................................................................................................................................8\n3.2.1.\nUse Dialup Modem ....................................................................................................................................... 9\n3.2.2.\nPOLAR 3G Modem Support ......................................................................................................................... 10\n3.3.\nAdvanced Settings ............................................................................................................................ 11\n3.3.1.\nBackoff ..................................................................................................................................................... 11\n3.3.2.\nByte Ordering ............................................................................................................................................ 11\n3.3.3.\nGeneral ..................................................................................................................................................... 12\n3.3.4.\nPDU lengths (see section: Protocol unit sizes) .............................................................................................. 12\n3.3.5.\nProtocol Unit Sizes ..................................................................................................................................... 13\n4.\nSupported Addresses .......................................................................................................................... 14\n4.1.\nUsing Normal Modbus Type Addressing. ............................................................................................ 14\n4.2.\nUsing IEC Addressing : ..................................................................................................................... 16\n5.\nProtocol Definition and Considerations .............................................................................................. 17\n5.1.\nDiagnostic Sub-Functions .................................................................................................................. 17\n5.1.1.\nFunction 08 Supported Addresses ................................................................................................................ 17\n5.1.2.\nStartup Function ........................................................................................................................................ 17\n5.1.3.\nComms Recovery ....................................................................................................................................... 17\n5.1.4.\nTag Configuration ...................................................................................................................................... 18\n5.1.5.\nFunction Reference .................................................................................................................................... 18\n5.1.6.\nFunction 08 Registry Entries ....................................................................................................................... 20\n5.2.\nBroadcast Support ............................................................................................................................ 20\n5.3.\nTelemechanique and other support ................................................................................................... 21\n5.3.1.\nGE Multilin Features ................................................................................................................................... 21\n5.3.2.\nSuperCon Power Meters ............................................................................................................................. 21\n5.3.3.\nMOSCAD ................................................................................................................................................... 21\n5.3.4.\nABB Controllers.......................................................................................................................................... 21\n5.4.\nAdvanced Registry Key Settings ........................................................................................................ 22\n5.5.\nMessage Protocol ............................................................................................................................. 23\n5.5.1.\nCoils 000001- 065535 (%Q0-%Q65535) ...................................................................................................... 23\n5.5.2.\nInputs 100001- 165535 (%I0-%I65535) ...................................................................................................... 23\n5.5.3.\nInput Registers 300001- 365535 (%IW0-%IW65535) ................................................................................... 23\n5.5.4.\nHolding Registers 400001- 465535 (%MW0-%MW65535) ............................................................................. 24\n5.5.5.\nDiagnostic 0x08 functions ........................................................................................................................... 24\n5.5.6.\nExtended Registers 600000- 698303 (NB 600000 is valid) (%ME0-%ME98303) ............................................... 25\n6.\nGeneral Notes and Troubleshooting ................................................................................................... 26\n6.1.\nContact Details ................................................................................................................................. 26\n6.2.\n6.3.\nPLC Exception Codes ........................................................................................................................ 26\n6.4.\nTrouble Shooting .............................................................................................................................. 26\n7.\nRevisions ............................................................................................................................................. 27\n7.1.\nDocument Revision........................................................................................................................... 27\n7.2.\nDLL Revision .................................................................................................................................... 27\n\n[Page 12]\nATQMS-DRVR-DOC-MODBUSI.docx\nP a g e | 12\nSwap long value ordering – Allows the ordering of all long (suffix L) holding-register I/O to be\nword-swapped. Checked means it is not swopping.\nSwap byte ordering of strings – Turn off to swap each byte of the string, e.g. “EHLL1O”\nbecomes “HELLO1”.\nSwap word byte order – Turn on to swap each byte of the word.\n3.3.3.\nGeneral\nRS485 wiring with reflections – (Advanced option) When using RS-485 the driver will receive\nand cater for message reflection which occurs because the RX circuit is enabled during the\ntransmission of telegrams. (Used with RTS enabled and DTR enabled.) When using an external RS-\n232 to 485 converter this option may not be necessary.\nClose serial port on fail – (Default = enabled) This setting, when enabled, will do a hard shut\ndown and reinitialization of the communications Port. Some Ethernet to serial convertors hang\nunder noisy conditions, so we compensate for this by only purging and not closing the port.\nOptimize scanning of Coils and relays – turn on this option to prevent the driver from doing\nread-ahead optimization, and instead read only the required number of bits. By default, the driver\nwill read all bits packed into a byte, hence the last coil or relay read is always at the end of an 8-\nbit multiple. This option prevents incorrect packing by some non-genuine RTUs.\nDetailed debugging – (Default = Disabled) This setting will add additional information to the\ndatascope.\nUse Preset single register (06) func. – (Advanced option) (Default = disabled) Allow the driver\nto use function code 06Hex when writing to any single holding register types. If disabled, the driver\nuses function 10Hex which is more generic.\nInteger “I” format is Signed_ magnitude – (Default = disabled) Integers will be expressed as\nsigned magnitude if checked. Use, for example, 400001 I 0xFFFF will result in 0x8001 if checked\nelse 0xFFFF if not.\nPurge Timeout – (0 to disable) Will instruct the communication resource to idle for the specified\nperiod in milliseconds to wait for incoming noise/corrupted messages to clear from the port, this\nhappens when the timeout is too short, and data is still being received.\n3.3.4.\nPDU lengths (see section: Protocol unit sizes)\nOutputs 000000 , Inputs 100000, Analogue 300000, Holding 400000 , Extended\n600000 – Must be used in conjunction with the “CUSTOM”PLC type, set the appropriate\nlengths here. Length count is in items i.e., 000000, 100000 = 8 items per byte, 300000, 400000\n= 2 bytes per item.\nBit types (Inputs 000000 , Outputs 100000) work optimally in multiples of 8 bits (to a\nbyte), i.e. 16 will result in 2 data bytes returned in the data portion of the PDU. Some devices do\nnot respond correctly if multiples are not 8.\n\n[Page 17]\nATQMS-DRVR-DOC-MODBUSI.docx\nP a g e | 17\n5. Protocol Definition and Considerations\n5.1.\nDiagnostic Sub-Functions\nThe function 08 sub-functions are supported as an extension to the driver’s capabilities, and as\nsuch do not operate as standard scan-points, although they are licensed as such. Data returned\nfrom a function cannot be read into a tag at this point.\nThe diagnostic functions are advanced functions, and require special tag configuration for proper\noperation. To enable the function 08 support, set the registry value “enableFn08” to a non-zero\nvalue, this is the default. These functions are only supported in RTU mode, and not yet for ASCII\noperation.\n5.1.1.\nFunction 08 Supported Addresses\nTag access\nMin\nWrite (rising edge trigger)\n11 DT\nValues\nRead (result of diagnostic request)\n11 DD\nThe driver provides 22 digitals, which can be written to, a value of 1 (one) triggers the\ncorresponding sub-function from 0 through 21. A value of zero is ignored, the driver only detects\nthe rising edge, digitals should thus be configured as pulsed. The driver performs the sub-function\nwhen triggered and stores the communications result in a further list of 22 Integer slots. These\ncan be read using multistates or integers. Where applicable, they may also be written to, this will\nin certain cases affect the wa"}, {"title": "MQTT Client", "href": "drivers_html/MQTT_Client.html", "category": "Drivers", "rel": "drivers_html/MQTT_Client.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-D_MQTT_CL.docx\nP a g e | 3\n1.\nOverview ............................................................................................................................................... 4\n1.1.\nSupported Hardware ..........................................................................................................................4\n2.\nWiring ................................................................................................................................................... 5\n3.\nDevice Configuration ............................................................................................................................ 6\n3.1.\nDevice Configuration ..........................................................................................................................6\n3.1.1.\nDriver Details .............................................................................................................................................. 6\n3.1.2.\nDevice Details .............................................................................................................................................. 7\n4.\nSupported Addresses ............................................................................................................................ 9\n4.1.\nExample ............................................................................................................................................9\nProtocol Definition and Considerations .............................................................................................. 11\n5.1.\nAdditional MQTT Information ............................................................................................................ 12\n6.\nGeneral Notes and Troubleshooting ................................................................................................... 13\n6.1.\nContact Details ................................................................................................................................. 13\n6.2.\n7.\nRevisions ............................................................................................................................................. 14\n7.1.\nDocument Revision........................................................................................................................... 14\n7.2.\nDLL Revision .................................................................................................................................... 14\n\n[Page 4]\nATQMS-DRVR-DOC-D_MQTT_CL.docx\nP a g e | 4\n1.\nOverview\nMessage Queue Telemetry Transport (MQTT) is a lightweight, report by exception, ISO-standard\npub-sub messaging protocol specifically designed for the Internet of Things. The MQTT network\nconsists of publishers, subscribers and a broker. The publishers will publish or send information to\nthe broker, the broker will then relay those messages to the subscribers. The broker is the\n“middleman” in the network and could be situated in the cloud. A publisher/subscriber are the clients\non the network and are linked together by topics.\nEach Adroit agent can be a publisher and/or subscriber, and acts as a client on the network. If Adroit\nis a publisher, then it will write values out to other subscribers (when the tag is scanned using\nOutput enabled). When Adroit is a subscriber, then it waits for data on a specific topic from any\npublisher to that topic.\nThere are three parts of an MQTT transmission:\nMessage: This is the data that is passed through the broker to all clients subscribed to a\nspecific topic on the MQTT network.\nTopic: Some brokers support topic strings with a maximum of 128 levels and a maximum\nlength of 250 bytes, so an MQTT client connection that exceeds those limits will be closed.\nQoS: Quality of Service, ensures delivery to connected clients:\na.\nAt most once - The published message is sent once, and if it does not arrive it is lost.\nb.\nAt least once - Guarantees that the published message arrives, but there may be duplicates.\nc.\nExactly once - Guarantees that the publish message arrives and that there are no duplicates.\n1.1. Supported Hardware\nThis driver has been tested on the following hardware:\nNone applicable.\nThe driver has been tested is known to work with the following brokers:\nMosquitto\nHiveMQ\n\n[Page 6]\nATQMS-DRVR-DOC-D_MQTT_CL.docx\nP a g e | 6\n3.\nDevice Configuration\n3.1. Device Configuration\nEnable secondary – Turn this option to have the driver maintain 2 channels of communication,\nthe radio buttons Primary and Secondary can then be used to toggle between configurations.\n3.1.1. Driver Details\nEnable Secondary – (Default = OFF) Allows enabling of redundant MQTT Broker connections such\nthat in case of a failure a switchover will occur.\nPrimary – Allows configuration setting of the Primary broker connection.\n\n[Page 7]\nATQMS-DRVR-DOC-D_MQTT_CL.docx\nP a g e | 7\nSecondary – Allows configuration setting of the Secondary broker connection.\n3.1.2. Device Details\nEnable shadow scanning from master to standby – (Default = OFF) If enabled will stop any\ncommunication to the MQTT broker when the Agent server is in standby mode. By default, we\nassume parallel scanning.\nEnable standby reads – (Default = ON) Allows reading from the MQTT broker when agent server\nis in standby mode.\nEnable standby writes – (Default = OFF) Allows writing to the MQTT broker when agent server\nis in standby mode.\nBroker Host IP – The static IP Address or HOST name of the MQTT broker. Domain names are\nresolved to IP addresses. To connect over Websockets specify a hostname beginning with ws:// or\nwss://.\nFor example: ws://test.mosquitto.org or test.mosquitto.org\nPort – A valid port number is required for the connection to take place.\nClient Name – The client identifier is a (1- 23 UTF-8 encoded) unique name to identify each MQTT\nclient to the MQTT broker. It should be unique per client for a given broker, and each Adroit server\ndevice needs its own unique client ID. Click the button on the right-hand side to generate a random\nstring for this field if required.\nUsername – A username could be required by the MQTT broker. This allows authentication and\nauthorization of clients to a broker. This must be a UTF-8 encoded string.\nPassword – A password could be required by the MQTT broker. This allows authentication and\nauthorization of clients to a broker.\nQoS – (Default = 2) Quality of Service level of each client. The level (0, 1 or 2) determines the\nguarantee of a message being delivered.\nClean Session – (Default = True) This will tell the MQTT broker to establish a persistent session or\nnot. If True, the broker will discard any data previously associated with the current client ID once\nsuccessfully connected. Otherwise, when disconnected the broker and client will store the session,\nall subscriptions for the client and all missed messages, when QoS 1 or 2.\nRetain Flag – (Default = False) When publishing a non-empty message with the Retain flag set\nand a non-zero QoS level, will cause the server to store it (replacing any previously retained message\nin the process). When the message is stored, any new clients that subscribe to that topic will receive\nthe message.\nAuto Reconnect – (Default = False) The MQTT driver will automatically reconnect to the MQTT\nbroker if connection is lost.\nKeepAliveTime – The KeepAliveTime is a time interval that the client will continuously send control\npackets/PING requests to the MQTT broker to show that the client is still alive. If the broker does\nnot receive a control packet/PING request within 1.5 times the KeepAliveTime, the broker MUST\ndisconnect the network connection to the client as if the network had failed.\n\n[Page 9]\nATQMS-DRVR-DOC-D_MQTT_CL.docx\nP a g e | 9\n4.\nSupported Addresses\nThe scan address in Adroit is the topic in the MQTT protocol with a format prefix. A MQTT topic is a\nsimple string with a hierarchical structure, with forward slashes as delimiters.\nFor example:\nPrefix:City/house/bedroom/lamp/on\nPLEASE NOTE\nCurrently the Adroit MQTT driver does not support wildcards, so please avoid using “+” and “#”\ncharacters in the scan addresses.\nPrefixes :\nData type\nPrefix\nINFORMATION\nPrefixes attempt to force the driver to pre-convert the I/O to various types and must be\nincluded.\n4.1. Example\nMaking use of the online MQTT Broker supplied by Mosquito you can test the MQTT functionality.\nSettings is as follows:\nHOST: test.mosquitto.org\nPORT: 1883\nThe scan address can be anything, as it relates to the Topic name. On this broker, scanning to any\ntopic will register the topic and allow values to be transferred through the channel.\nScanning a string agent to the broker will now have the following result in the scanniong dialog.\n\n[Page 12]\nATQMS-DRVR-DOC-D_MQTT_CL.docx\nP a g e | 12\n5.1. Additional MQTT Information\nRetained message: A retained flag tells the MQTT broker to store the last message of each topic,\nin case a new client subscribes to the broker and automatically deliver the message to that new\nclient. Retained flag off means if a client is offline during a publish, it will never get that message.\nPersistent Sessions: This makes MQTT designed for intermittent connectivity. Sessions may last\nweeks, months or years and it does this using a keep alive message and a timeout. QoS 1 & 2\nmessages are queued for clients which may be offline but have not timed out.\nLast Will & Testament messages: If enabled, a device will register a message to the broker so\nthat if a session is lost, send this message to a specific topic. This can be used to see which devices\nare online/offline at any given time.\nQuality of Service levels explained:\nQoS 0: At most once, “Fire and forget”. Sends a message and does not wait for a reply. Sender\nnever retries to send the message and receiver might not get message.\nQoS 1: At least once, “guaranteed delivery”, continuously sends a message until there is a reply\nfrom the broker. But there is a chance of a duplicate message on receiver side while waiting for\nconfirmation.\nQoS 2: Exactly once, “2 phase commit guaranteed delivery”. This is used when packet losses or\nduplication of messages is unacceptable. Comes at additional network traffic, most data heavy\nservice so not ideal for GSM or GPRS.\nMQTT Ports:\n1. TCP: 1883\n2. TCP + SSL: 8883\n3. Websocket: 9001\n4. Websocket + SSL: 9883\nMQTT Advantages:\nVery lightweight protocol, devices do not need a lot of resources such as RAM. High power\nefficiency.\nThe protocol supports for messages up to 256 MB is size.\nPublishers and Subscribers can communicate to each other without knowing ports, IP addresses\netc.\nDevices don’t have to be actively connected at the same time. Therefore suitable for unstable\nnetworks.\nSending and receiving messages happens at each devices own speed, synchronization works\nseamlessly."}, {"title": "MyCity Email IMAP", "href": "drivers_html/MyCity_Email_IMAP.html", "category": "Drivers", "rel": "drivers_html/MyCity_Email_IMAP.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-MYCITY.docx\nP a g e | 3\n1.\nOverview ............................................................................................................................................. 4\n1.1.\nTest Software ................................................................................................................................. 4\n2.\nWiring ................................................................................................................................................. 5\n3.\nDevice Configuration .......................................................................................................................... 6\n3.1.\nDevice Configuration ....................................................................................................................... 6\n3.1.1.\nPort Selection ........................................................................................................................................... 6\n3.1.2.\nCommon Mail Settings ............................................................................................................................... 6\n3.1.3.\nLocal Device Settings ................................................................................................................................ 7\n4.\nSupported Addresses .......................................................................................................................... 8\n5.\nProtocol Definition and Considerations ............................................................................................ 10\n5.1.\nDatascope Considerations .............................................................................................................. 10\n5.2.\nOther Considerations ..................................................................................................................... 14\n5.3.\nDatalogging Considerations ............................................................................................................ 14\n6.\nGeneral Notes and Troubleshooting ................................................................................................. 16\n6.1.\nContact Details .............................................................................................................................. 16\n6.2.\n6.3.\nTroubleshooting ............................................................................................................................ 16\n6.3.1.\nCannot install the driver (Adroit 10.0.5.2 and earlier) .................................................................................. 16\n6.3.2.\nAccess denied error.................................................................................................................................. 16\n6.3.3.\nI cannot connect with my Gmail account .................................................................................................... 17\n7.\nAppendix A ........................................................................................................................................ 18\n7.1.\nGmail Setup for Email Drivers using IMAP [New Google Security Policy] ........................................... 18\n8.\nRevisions ........................................................................................................................................... 23\n8.1.\nDocument Revision........................................................................................................................ 23\n8.2.\nDLL Revision ................................................................................................................................. 23\n\n[Page 4]\nATQMS-DRVR-DOC-MYCITY.docx\nP a g e | 4\n1. Overview\nThis driver supports IMAP for accessing and reading in MyCity RTU protocol packets and updating\nReal and Analog Agents.\n1.1.\nTest Software\nThis driver has been tested using the following email services:\nGmail\nOutlook\n\n[Page 6]\nATQMS-DRVR-DOC-MYCITY.docx\nP a g e | 6\n3. Device Configuration\n3.1.\nDevice Configuration\n3.1.1. Port Selection\nEnable Secondary – Enables secondary configuration for dual redundant Controllers. This setting\nis disabled for this driver.\nPrimary / Secondary – Select the primary or secondary button depending on which connection\nyou wish to configure.\n3.1.2. Common Mail Settings\n(The parameters identified by the * define a resource common to all devices that share those\nparameters. Any change to these parameters in this group will cause a change for all Adroit devices\nusing this mailbox. Note: this will include other drivers such as the Adroit SMTP Email client driver.)\nResource - An internal ID representing a mailbox configuration in Adroit that cannot be edited.\nWhen adding a new device, the last added resource will be used to pre-populate the mailbox settings\n(this is used to make the adding of multiple devices easier). To choose another resource, simply\nselect it and click OK. To change anything the driver will ask if a new resource is to be created or\nthe existing resource be changed for all devices using it.\n*Mailbox Type - IMAP is automatically selected (POP is no longer supported).\n*Mail Server - The name of the mail server.\n\n[Page 8]\nATQMS-DRVR-DOC-MYCITY.docx\nP a g e | 8\n4. Supported Addresses\nA CSV row constitutes a record. The example email body consists of two records.\n2022-05-01\n01:15:00,3614.53979,24.00000,1.50000,131.00000,250.00000,0.00000,1.00000,\nThe format follows the following structure:\nDate[YY-MM-DD] Time[HH:MM:SS],Param1,Param2,…Param48\nThe maximum number of parameters/Param<x> fields is 48.\nYou can test this driver with the above example. The checksum field, although necessary to still have\nin the email body, does not have to be correct but make sure it still has an integer type, otherwise\nit will fail to validate and cause errors. If you use the above example and it is not working, make\nsure to only have a Carriage Return (CR) character followed by a Line Feed (LF) character between\nCSV rows. There should be no white character spaces (spaces, tab spaces, etc.) Then when copying\nto an email, ensure that you send the email using plaintext only. For example, with Gmail:\nThe address can only be used for Adroit Real Agents only. To scan an Adroit agent to a parameter,\nuse the scan address Chan<x> as follows:\nEmail Data Parameter\nParam1\nChan0\n\n[Page 16]\nATQMS-DRVR-DOC-MYCITY.docx\nP a g e | 16\n6. General Notes and Troubleshooting\n6.1.\nContact Details\nPhone: +27 11 658-8100\n6.2.\nFor additional information, please refer to our Knowledgebase website:\nLatest Drivers topics - Features, discussions, tips, tricks, questions, problems and feedback\n(adroittechnologiesautomation.com)\n6.3.\nTroubleshooting\nWe recommend if you have any queries or issues, please visit our Knowledge Base for more\ninformation and additional troubleshooting. If you still cannot find a resolution for your problem,\n6.3.1. Cannot install the driver (Adroit 10.0.5.2 and earlier)\nAs of Adroit 10.0.5.2 Update 1, the MyCity Email driver does not have a .inf which is used to add the\ninstallation of the driver. To install the driver, please go to the following Adroit directory and move\nthe mycity.dll from the Drivers folder into the main directory. So, move the mycity.dll from:\nMove into the directory:\n6.3.2. Access denied error\nError code according to the device datascope:\n[10013] Access denied\n[10013] Access deniedCannot do email work!\nIf you are experiencing this error, please check that the following are correct:\nLogin Name and Password\nMail Server and Mail Port\nIf this is still not causing the issue, please make sure that your firewall is not currently blocking the\nport that was provided in the device configuration.\n\n[Page 18]\nATQMS-DRVR-DOC-MYCITY.docx\nP a g e | 18\n7. Appendix A\n7.1.\nGmail Setup for Email Drivers using IMAP [New Google\nSecurity Policy]\nThis knowledge base article details the steps required in configuring the Gmail IMAP server with the\nmentioned Adroit email drivers, in line with Gmail’s new security policies implemented as of 30 May\n2022. For further information, refer to the following Google Account Help article:\nhttps://support.google.com/accounts/answer/6010255?hl=en\nThe opening article states the following:\nTo help keep your account secure, from May 30, 2022, Google no longer supports the use of\nthird-party apps or devices which ask you to sign in to your Google Account using only your\nusername and password.\nImportant: This deadline does not apply to Google Workspace or Google Cloud Identity customers.\nThe enforcement date for these customers will be announced on the Workspace blog at a later\ndate.\nFor more information, continue to read.\nPreviously, Adroit email driver’s required full access to your Gmail account, and subsequently your\nGoogle account, to allow access into your inbox using the Gmail IMAP server. This required adjusting\na security setting on your Google account to allow 3rd party applications to access your account.\nIf you have noticed that Adroit has not been able to successfully connect to the Gmail IMAP server,\ntypically stating an authentication error, the problem could be related to this issue.\nExample of MYCITY Email Client Protocol Driver device authentication error [x0000 NO\n[AUTHENTICATIONFAILED] Invalid Credentials (Failure) Cannot do email work!]\nTo access the setting in question, follow the steps provided:\nAccessing from Gmail directly:\na.\nLog in to your Gmail account."}, {"title": "New Adroit Scanning Architecture (NASA) ver 1", "href": "drivers_html/New_Adroit_Scanning_Architecture_NASA_ver_1.html", "category": "Drivers", "rel": "drivers_html/New_Adroit_Scanning_Architecture_NASA_ver_1.html", "kind": "Driver", "text": "[Page 2]\nLast printed 11/15/2017 8:19 AM\nPART 1\nAudience\nThe intended audience is communications specialists knowledgeable in protocols, and in the\nhardware technologies that make data communications possible. I also assume that some terms\nrelated to the operation of Adroit such as proxies and subscriptions make sense at a simple level\nat least. A working knowledge of scanning is also assumed.\nThe problem\nCurrently we identify 2 short-comings in the Adroit scanning philosophy, these are largely offset\nby simplicity of configuration, and some automated reasoning in our drivers. However for the\nmore advanced customer who wants total control, and the best possible performance we identify\nthe following.\nDouble-polling of data when packing in the Front-end has overlaps\nContinued polling of data that is not needed in the client at times.\nWe will now lay out the reasons for the problems, and then move onto a proposal in the next\nsection. Understanding these problems is imperative to the design of a solution.\nDouble-polling:\nThis occurs because the driver always maps I/O addresses that are near to\neach other into one large task. This happens automatically in the driver\nbased on an optimization algorithm which tries to fetch the largest legal\nblocks (PDU length) of data since this is the optimal method. This causes\na hitch because of a presentation problem. For instance data in an Analog\ntag in Adroit has 8-byte IEEE float presentation, data in a counter would\nhave 4-byte long. If I/O addresses for these 2 types is interspersed, the\ndriver has to create 2 tasks in order to return the data to Adroit, one for\nthe IEEE presentation, and another for the 4-byte long. Nothing however\nstops the driver from creating one physical task for both, and converting\nfor both presentations (this may include Booleans and Strings) in memory,\nsaving communications bandwidth.\nContinuous polling:\nThe scanning sub-system continues to poll for data even if it is not\nrequired. The only current work-around is to create a separate device\nagent for each plant segment, and scan those tags from it. Then, when\nthe data is not required, stop the device agent. This situation is quite\ncomplex, and as a system grows with time, the benefits of this type of\nconfiguration are typically eroded by people placing more un-necessary\ntags on mimics, which causes these scan tasks to run again when only 1\nitem is needed.\nLimited data types:\nCurrently the Adroit scanning subsystem is limited to scanning Boolean,\nInteger, Real and String[80] data types only. The new architecture will\nbreak this limitation allowing for datetime and longer strings data types to\n\n[Page 3]\nLast printed 11/15/2017 8:19 AM\nbe communicated as well. User Defined Types, discussed later, will also\nbe supported in that the scanning subsystem.\nNew architecture\nNASA requires changes in two areas of Adroit’s scanning subsystem:\nNew device agent\nA new Device class (called Device_NASA) inherits from the current Device class in the device agent\nto handle the new architecture.\nThe Device_NASA class does NOT require the use of scan agents. The responsibility for scheduling\nscan tasks are now demoted to the protocol driver as explained later.\nThe\nDevice_NASA\nCAdroitProtocolDriverCallbacks class which will allow NASA drivers to call back into the device\nagent.\nOn creation of a device agent, the decision to use the legacy device class or the new class takes\nplace in the Device agent’s construct() API call whereby the driver DLL would be tested for the\nexistence of a new export function called CreateAdroitProtocolDriver, otherwise falling back to\nthe legacy ProtDrvCreate. If CreateAdroitProtocolDriver exists, it implies that the protocol driver\nis compliant to the new scanning architecture and will be controlled by an instance of\nDevice_NASA.\nIn order to cater for on demand polling, a scan flag bit mask will be introduced for each scanned\nitem that will denote the type of scanning required for each scanned tag. These are:\nBit 0 = enable reads\nBit 1 = enable writes\nBit 2 = output initialize\nBit 3 = demand scan\nIt is envisaged that write-only tags will never be marked bad.\nThe scanned Adroit tag type is NOT passed to the driver. The driver shall return all values as\nCOleVariant’s and the Device_NASA class shall be responsible for converting these returned\nThe driver issues callback to the Device_NASA class in much the way OPC callbacks work viz an\narray of tag handles, an array of timestamps, an array of variant values and an array of qualities.\nNew protocol drivers\nUnlike the legacy architecture, where flat C DLL export functions are used to interface to the\nprotocol driver, NASA drivers will derive from an abstract class called CNASADevice which will\ncontain the necessary functions for interfacing. The interface specification is included in the file\nnasadevice.h with further definitions defined in nasaclasses.h.\n\n[Page 4]\nLast printed 11/15/2017 8:19 AM\nCluster operations\nCluster scanning operations, such parallel scanning will now be controlled at the protocol driver\nlevel on a device by device basis. The Device_NASA class will inform the driver of the current\nagent server cluster status via a SetClusterStatus() method call and this method will return\nwhether the driver is configured for shadowing or not, thus instructing the device agent to\nperform shadowed putslots if required.\nThe legacy global cluster shadowed scanning configuration will only apply to legacy architecture\nprotocol drivers.\nQuality values\nQuality values will honour the defined OPC quality values. These are currently defined as:\n// --- QUALITY MASK VALUES\n#define OPC_QUALITY_MASK 0xC0\n#define OPC_STATUS_MASK 0xFC\n#define OPC_LIMIT_MASK 0x03\n// --- QUALITY BIT VALUES\n#define OPC_QUALITY_BAD 0x00 //x\n#define OPC_QUALITY_UNCERTAIN 0x40\n#define OPC_QUALITY_GOOD 0xC0\n// --- STATUS BIT VALUES\n#define OPC_QUALITY_CONFIG_ERROR 0x04\n#define OPC_QUALITY_NOT_CONNECTED 0x08\n#define OPC_QUALITY_DEVICE_FAILURE 0x0c //x\n#define OPC_QUALITY_SENSOR_FAILURE 0x10 //x\n#define OPC_QUALITY_LAST_KNOWN 0x14\n#define OPC_QUALITY_COMM_FAILURE 0x18\n#define OPC_QUALITY_OUT_OF_SERVICE 0x1C //x\n#define OPC_QUALITY_LAST_USABLE 0x44 //x\n#define OPC_QUALITY_SENSOR_CAL 0x50 //x\n#define OPC_QUALITY_EGU_EXCEEDED 0x54 //x\n#define OPC_QUALITY_SUB_NORMAL 0x58 //x\n#define OPC_QUALITY_LOCAL_OVERRIDE 0xD8 //x\n#define OPC_LIMIT_OK 0x00 //x\n// --- LIMIT BIT VALUES\n#define OPC_LIMIT_LOW 0x01 //x\n#define OPC_LIMIT_HIGH 0x02 //x\n#define OPC_LIMIT_CONST 0x03 //x\nMany of the above will be unusable from within Adroit in that that they cannot be determined.\nSuch values are marked with the trailing “//x”. Typically, tag qualities would be used as follows:\nOPC_QUALITY_CONFIG_ERROR\nUnknown scan address. The quality for such a tag is never changed.\nOPC_QUALITY_UNCERTAIN\nThe protocol does not allow for reading this address i.e. write only address\nOPC_QUALITY_NOTCONNECTED\nDevice is started but the group has not yet been enabled\n\n[Page 6]\nLast printed 11/15/2017 8:19 AM\nPART 2\nnasaclasses.h file\nThe nasaclasses.h file contains the following classes:\nCAdroitProtocolDriverCallbacks Base class for Device_NASA class allowing for CNASADevice\ninstances to call back into the device agent\nCScanItem\nDefines the scan configuration for an FED address to be scanned\nCAdroitOleDateTime\nHelper class to the COleDateTime to provide millisecond\nsupport\nCNASAPropertyItem\nDefines a single configuration property for CNASADevice’s\nCNASAPropertyItems\nA collection of CNasaPropertyItems\nnasadevice.h file\nThe nasadevice.h file contains the following classes:\nCNASADevice\nBase class for all NASA drivers. The new device class will will\ncontain an instance of this class as instantiated by the driver\nitself\nCAdroitProtocolDriverCallbacks Defines the callback that must be implemented by Adroit’s\nDeicve agent to allow NASA drivers to process new values from\nthe FED.\nTypical NASA driver\nA typical NASA driver derives from CNASADevice as follows:\nclass ADROITDRIVER_EXT_CLASS COPCUADevice : public CNASADevice\npublic:\n// --- runtime methods ----------------------------\nCOPCUADevice(LPCTSTR szDeviceName,\nCAdroitProtocolDriverCallbacks* hAdroitDevice);\nvirtual CScanItem* AddScanAddress(LPCTSTR szAddress,\nDWORD dwRate,\nDWORD dwScanFlag,\nBOOL Browse(COPCUADevice* pd,\nCString& csError,\nHWND hwnd);\nvirtual void DynamicConfig(void);\nvirtual void EnableItem(void* pClientHandle,\n\n[Page 7]\nLast printed 11/15/2017 8:19 AM\nBOOL bEnable = TRUE);\nvoid OutputScopeMsg(CString cs_text,\nWORD colour);\nvirtual void RemoveItem(void* pClientHandle);\nvirtual void ResetConnection();\nvirtual void Setup();\nvirtual void Start(BOOL bStart = TRUE);\nvirtual void WriteItem(void* pClientHandle,\nCOleVariant& ovValue);\n// --- configuration methods ----------------------------\nvirtual void SetPropertyItem(LPCTSTR szName,\nLPCTSTR szValue);\nvirtual CString OnSetPropertyButton(DWORD dwData);\nvirtual void Unload();\nvoid Run();\nBOOL m_bThreadRunning;\nBOOL m_bDeviceStarted;\nlong m_UseCount; // for use by CDeviceArray()\nWORD m_Status; // status (DEVICE_OK or DEVICE_BAD)\nlong m_Retries;\nBYTE m_TimeStampMethod;\nDriverEngineStatus m_EngineState;\nCOPCUAConnection* m_pOPCUAConnection;\nprivate:\nHANDLE m_hDevice;\nHANDLE m_MonFileHandle; // monitor memory-mapped file structure\nBOOL CreateMonitor();\n// protocol dependant members\nPSECURITY_DESCRIPTOR m_pSD;\n// ... and security descriptor\nCString BrowseComputers();\nCString BrowseOPCServers();\nBOOL BrowseOPCServers(CString& csServerName,\nCString& csServerUrl,\nEnumUserTokenType& ut,\nEnumMessageSecurityMode& sm, CString& csSecPolicy);\nBOOL Connect(CString& csError);\nDevice_NASA class\nThe new Device_NASA class is as follows:\nclass Device_NASA : public Device, public CAdroitProtocolDriverCallbacks\n// --- Interface ----------------------------------------------------------\npublic:\n// --- Interface Operations of Device_NASA class ---\n// constructor - creates Device_NASA instances\nDevice_NASA (\n\n[Page 12]\nLast printed 11/15/2017 8:19 AM\nMake sure you test this change by running the protocol driver monitor (pdrvmon.exe) under\noption 2.\nTo allow perfomance monitor to operate correctly, run an administrative cmd console window ,\nnavigate to your driver source path and run the following:\n“..\\incs.bat”\nCheck that counternames.inc and offsets.inc have been rebuilt.\nYou should be good to go, rebuild the driver dll, copy to agent path, restart the agent server attach\na device , see if the driver and its device instance is visible in the perfmon list.\nTroubleshooting Performance Counters\nTo test if performance counters are active, goto permon.cpp line ~456 and change the\nperfversion, this tells the setup procedure to reinstall performance counters, this is especially\nimportant if performance counters are ADDED even if it is just a name change when including the\nuse of a new “USERx” count.\nPerfmon.cpp:\nCHAR perfversion[] = \"1.00\";\nAfter compile rerun setup.\nAny name change you must rerun incs.bat, and you cannot transfer incs between projects.\nAnother check is via regedit:\nHKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Services\\D_SAMPLE_NASA"}, {"title": "Omron Ethernet FINS Ethernet UDP-IP", "href": "drivers_html/Omron_Ethernet_FINS_Ethernet_UDP-IP.html", "category": "Drivers", "rel": "drivers_html/Omron_Ethernet_FINS_Ethernet_UDP-IP.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-OMR_ETH.docx\nP a g e | 3\n1.\nOverview ................................................................................................................................................. 4\n2.\nWiring ..................................................................................................................................................... 5\n3.\nDevice Configuration .............................................................................................................................. 6\n3.1.\nDevice Configuration ............................................................................................................................ 6\n3.1.1.\nConfig Selection .............................................................................................................................................. 6\n3.1.2.\nPLC Details ..................................................................................................................................................... 6\n3.1.3.\nCPU Unit Data / Status (currently unavailable) ................................................................................................... 7\n3.1.4.\nLocal Details ................................................................................................................................................... 7\n3.2.\nRegistry Settings (BYTE, WORD and DWORD Swopping) ........................................................................ 8\n4.\nSupported Addresses .............................................................................................................................. 9\n5.\nProtocol Definition and Considerations .................................................................................................. 9\n5.1.\nAdvanced Options ................................................................................................................................ 9\n5.1.1.\nScanning fast as possible is supported in this driver ........................................................................................... 9\n5.2.\nMessage Protocol ............................................................................................................................... 10\n5.2.1.\nFINS Header Structure (Prefix structure for ALL messages)............................................................................... 10\n5.2.2.\nFINS Memory Area Read Function .................................................................................................................. 11\n5.2.3.\nFINS Memory Area Write Function .................................................................................................................. 12\n5.2.4.\nI/O Memory Area Codes ................................................................................................................................ 12\n6.\nGeneral Notes and Troubleshooting ..................................................................................................... 13\n6.1.\nContact Details ................................................................................................................................... 13\n6.2.\n6.3.\nTroubleshooting ................................................................................................................................. 13\n6.3.1.\nProblem 1 .................................................................................................................................................... 13\n6.3.2.\nProblem 2 .................................................................................................................................................... 15\n7.\nRevisions ............................................................................................................................................... 15\n7.1.\nDocument Revision............................................................................................................................. 15\n7.2.\nDLL Revision ...................................................................................................................................... 15\n\n[Page 7]\nATQMS-DRVR-DOC-OMR_ETH.docx\nP a g e | 7\nThe following PLC types can be chosen:\nPLC Type\nMax number of read\nelements (p/s)\nMax number of write\nelements (p/s)\nOMRON CS/CJ Series\n999 words\n996 words\nOMRON CV Series*\n999 words\n996 words\n* Currently not available\nPLC IP Address – The IP Address of the PLC as configured at the back of the OMRON Ethernet\nunit.\nPLC Port – The protocol currently used in the OMRON Ethernet driver is UDP, which always operates\non port 9600. This is set by default.\nDestination Network No. – Change the FINS network number to correspond to the network the\nPLC is assigned to.\n3.1.3.\nCPU Unit Data / Status (currently unavailable)\nBy pressing the RETRIEVE button, the settings as provided in the previous section (PLC Details) are\ntested on the actual network. Two packets are sent out, of which the first checks the current CPU\nmode and the second checks the CPU Unit model and version.\nThe four possible responses are:\nStatus\nModel\nCPU is functioning correctly and in RUN mode.\nSTOP/Program mode!\nFor ex.\nCPU is currently in STOP / Program mode\nMONITOR mode!\nFor ex.\nCPU is in monitor mode (a type of RUN mode)\nNot connected!\nUnknown\nCPU connection couldn’t be made\n3.1.4.\nLocal Details\nSource Network No. – Change the FINS network number to correspond to the network the\nADROIT PC is assigned to. 0 if only one segment, but if multiple segments change it to the last\nsegment PLCs’ network number.\nRetry – The number of times the driver must retry a connection, or a Transmit/Receive transaction\nbefore returning an indication of failure.\nTimeout – The time in milliseconds to wait between each communication retry.\nEnable control retries – By checking this box, an interrupted WRITE operation will be retried.\nOtherwise, only READ operations will be retries.\n\n[Page 9]\nATQMS-DRVR-DOC-OMR_ETH.docx\nP a g e | 9\n4. Supported Addresses\nOMRON CS/CJ PLC data address types supported by the OMRON Ethernet Adroit Protocol driver\nArea\nCode\nCIO\nWord\nCIO0001\nCIO0001\nWork\narea\nWR\nWord\nWR\nDWord\nW001 D\nW001 D\nHolding\nbit area\nH\nWord\nH511\nH511\nAuxiliar\ny bit\nAR\n447 (Read-only)\nA447\nA447\nAR\n448.00\n959 (Read/Write)\nWord\nA959\nA959\nTimer\narea\nTIM\nWord\nT1234\nT1234\nCounter\narea\nCNT\nWord\nC4095\nC4095\nDM Area\nDM\nDM\nWord\nD11224\nD11224\nEM\nWord\nE11224\nE11224\nNote 1: Only certain addresses of the Auxiliary Bit area are writeable as well. Note which areas\nare read-only.\nAdding any of the following postfix characters onto the address will format the data accordingly:\n5. Protocol Definition and Considerations\n5.1.\nAdvanced Options\nScanning fast as possible is supported in this\ndriver\nAny Agent Server with at least rev34 of t_scan.dll, will provide the following registry key:\nSet this to true, AND scan any required addresses at 1msec, the system will then attempt to scan\nthe scan tasks that contain those addresses as fast as possible. Warning: Keep an eye cpu load so\nas not to cause the system to become unstable.\nB\n16-bit BCD\n\n[Page 10]\nATQMS-DRVR-DOC-OMR_ETH.docx\nP a g e | 10\n5.2.\nMessage Protocol\nFINS Header Structure (Prefix structure for ALL\nmessages)\nNote: There is no CRC field present in the FINS data frame, although the response codes as indicated\nin this section provide minimal assurance that the correct data was received.\nFINS packet header: (Note that the numbers are in hex unless otherwise noted)\nICF\nRSV\nor C0 hex)\nICF:\n* The bits for the ICF are laid out as follows:\nBit 7: (1)\nBit 6: (0)\nBit 5: (0)\nBit 4: (0)\nBit 3: (0)\nBit 2: (0)\nBit 1: (0)\nBit 0: (1)\nBit 0: Response (0=Required, 1=Not required) ,\nBit 1: Always 0\nBit 2: Always 0\nBit 3: Always 0\nBit 4: Always 0\nBit 5: Always 0\nBit 6: Data classification (0=Command, 1=Response),\nBit 7: Bridges (0=Not used, 1=used).\nA typical ICF for a command frame would be 0x80, and for a response frame 0xC0.\nRSV:\nReserved byte. Always 0.\nGCT:\nGateway count. Number of bridges passed through. Currently, the Adroit OMRON Ethernet protocol\ndriver doesn’t support bridging, thus this byte will be 0x00.\nDA1:\nDestination node address. This corresponds to the last byte of the destination IP Address, which, in\nthis example is 55 (HEX 0x37)\nDA2:\nDestination unit address. Corresponds to the unit number as set on the destination unit.\nSNA:\nSource network address. 0x00 indicates that it is the local network.\nSA1:\nSource node address.\nSA2:\nSource unit address.\nSID:\n\n[Page 13]\nATQMS-DRVR-DOC-OMR_ETH.docx\nP a g e | 13\n6. General Notes and Troubleshooting\n6.1.\nContact Details\nPhone: +27 11 658-8100\n6.2.\nFor additional information, please refer to our Knowledgebase website:\nLatest Drivers topics - Features, discussions, tips, tricks, questions, problems and feedback\n(adroittechnologiesautomation.com)\n6.3.\nTroubleshooting\nProblem\nWhen connected to the PLC and there is communication with device, but my Adroit Tag is still scan\nbad even though I can see in the datascope that I am receiving some sort of data?\nSolution\nThe first place to look at is in the datascope on ASCII mode. Bytes 13 and 14 of the response\nmessage will indicate the END CODES. If the 2 bytes are not 00 00 then the tag is “scan bad” as\nthere is some kind of error as indicated on image below.\nAbove Image Represents ASCII datascope with end codes returned an error.\nAbove Image Represents ASCII datascope with no errors.\n\n[Page 15]\nATQMS-DRVR-DOC-OMR_ETH.docx\nP a g e | 15\n6.3.2.\nProblem 2\nProblem\nWe can write out to a 16-bit BCD but not read anything back. It just shows 0.\nSolution\nWe could not reproduce it on our PLC in the office, and then eventually found that when you go to\nCX Programmer V5.00, connect online and click on “PLC – Clear all memory areas” menu does\nresolve the issue.\n7. Revisions\n7.1.\nDocument Revision\nRev.\nDate\nGrammar and spelling edits, alignment\nand general editing.\nD. Jordaan\n2.0\n3.0\n7.2.\nDLL Revision\nRev.\nDate\n06-Jan-2005\nFirst release notes! Beta Release Available\n07-Sep-2006\nAdded suffix explanation and troubleshooting to document\n19-Sep-2012\nAdded Extended Memory Support as of Revision 19\n10-Oct-2012\nAdded Registry settings not available from the dialog and added the suffix R\ninto document!\n22-Nov-2013\nImproved timing and speed capability of this driver.\n06-Aug-2018\nString support documented; I/O ranges fixed.\n03-Oct-2022\nDatascope cleaned up. Fixed confusing addressing where chars like “F” were\nallowed but “I” functionality implemented."}, {"title": "Omron Sysmac C200H", "href": "drivers_html/Omron_Sysmac_C200H.html", "category": "Drivers", "rel": "drivers_html/Omron_Sysmac_C200H.html", "kind": "Driver", "text": "[Page 1]\nOmron : Sysmac C200H\nOMRON SYSMAC C200H protocol driver\nOverview\nThe Adroit Omron protocol driver provides serial connectivity using RS-232 or\nRS-422 to omron host link modules The C200 and C1000 ,CS1 series amongst\nothers, as well as KEYENCE PLC and Process-Plus modules are supported in\nthis driver.\nDevice configuration\nNote: The most commonly used\nsettings are for multi-link\nsystem operation with station\nzero even when on RS232. A\nbaud rate of 19200 is suggested\nif the default of 9600 does not\nwork. Re-start your agent\nserver after changing any of\nthese settings for them to take\neffect.\nPLC Details\nSelect to enable multiple link protocol on a RS-422 line. If\nthis option is selected, the Link Unit number must be\nentered in the ‘PLC Station ID’ field.\nSingle-link System\nSelect to disable multiple link (for point to point\ncommunication).\nPLC Station ID\nHost Link unit number for multi-link (multidrop)\nconnections\nPLC Type\nApplicable SYSMAC PLC types. The PLC type selected will\napply to the primary and secondary port if available. This\nselection currently has no affect on communications.\nLocal Details\nPort\nThe available serial ports on the machine.\nBaud\nRate\nThe speed of data transmission. Any of the following Baud Rates may be\nspecified 300, 600, 1200, 2400, 4800, 9600, 19200 or 38400.\n\n[Page 2]\nFormat\nThe transmission format used for the port.\nRetry\nThe number of times that Adroit will try to gain communication with a\nPLC before failing a transaction.\nTime-out\nThe time that Adroit will wait for a valid response from a PLC before\nfailing a transaction (Read or Write).\nAdvanced dialog\nThe settings visible in the advanced dialog should only be modified to optimise\nconfiguration.\nMaximum frames\nThe number of frames that Adroit will grow transactions to.\nA larger number reduces the number of poll records used, but\nwill reduce performance if the scan points are widely\nscattered.\nForce PLC into\nmonitor mode\nAllow the Driver to put the PLC into monitor mode on\nstartup as well as whenever the PLC mode is changed to run.\nIf at any stage the driver attempts to write to PLC memory\nand fails because the PLC is in run mode this option will\nallow the driver to set the PLC mode while running. The\ndriver will fail to write values to PLC memory if it is in run\nmode.\nThe settings in the advanced dialog will be applied to primary and secondary\nconfigurations.\nWiring\nRS232C to C200HS CPU communications port or C200H-LK201 Host link\nCPU Comm port\n9 pin Male\nPC 9 pin\nFemale\n4 + 5 Bridged\n4 + 6 Bridged\n8 + 9 Bridged\nRS-422 to C200H-LK202 Host link\nRS-422 port\n9 pin Male\nRS-422\nRDB(+)\nNote: Connect the screen to one side only to prevent earth loops.\n\n[Page 3]\nOmron : Sysmac C200H\nThe protocol driver was tested using a RS-422 converter and wired as follows:\nPC RS-232\nport 25 pin\nFemale\nRS-422\n25 pin Male\nRS-422\nHost Link\nRS-422 Wiring Diagram\nHost Link\nComputer\nA B\nA B\nThe RS-422 line should be terminated at either end, the total resistance must be\n100Ω minimum. The maximum cabling length recommended is 500m. For\nfurther details refer to your Host link and RS-422 adapter manuals.\nTerminating resistance’s may not be necessary for cables shorter than 20m.\nPC COM Ports – Hardware Setup\nIf communications appears inconsistent or unreliable, the serial port settings\nmay need some adjusting. Reducing the serial port RX FIFO buffer to 1 (or\nminimum) may help. If the computer does not have a buffered UART, this\nsetting may not help, in sucha case, set the PLC for a lower baud rate.\n\n[Page 8]\nLR AREA READ:\nSend Telegram:\nHeader\nBeginning word (x10)\nNumber of words (x10)\nR\nL\nData from beginning\nword (x16)\nData from second word\n(x16)\nR\nLR AREA WRITE:\nSend Telegram:\nHeader\nData for beginning\nword (x16)\nData for beginning word (x16)\nW\nL\nResponse code (x16)\nW\nL\nBeginning word (x10)\nNumber of words (x10)\nR\nC\nData from beginning\nword (x16)\nData from second word\n(x16)\nR\nData for beginning word\n(x16)\nData for beginning word\n(x16)\nW\nDM AREA READ:\nSend Telegram:\nHeader\nNumber of words\n(x10)\nR\nData from beginning\nword (x16)\nData from second word (x16)\nR\nD\n\n[Page 9]\nOmron : Sysmac C200H\nDM AREA WRITE:\nSend Telegram:\nHeader\nData for beginning\nword (x16)\nData for beginning word\n(x16)\nW\nEM AREA READ:\nSend Telegram:\nHeader\nNumber of words\n(x10)\nR\nData from beginning\nword (x16)\nData from second word (x16)\nR\nE\nEM AREA WRITE:\nSend Telegram:\nHeader\nData for beginning\nword (x16)\nData for beginning word\n(x16)\nW\nUsed to set the PLC back to monitor mode if configured to do so. (see advanced…\nconfiguration dialog box)\nSend Telegram:\nHeader\nThis driver supports the standard performance monitor counters described in\nthe user manual.\nTroubleshooting\nIf at first there is no communication, try setting the system to “multi-link” mode\nwith station address 0 (zero).\n\n[Page 10]\nSimplified cable diagram with fewer conductors (only use this diagram if you\nhave to)\nCPU Comm port\n9 pin Male\nPC 25 pin\nFemale\nPC 9 pin\nMale\nRevisions\nAdded note about multiple and single link operation.\n9-Jun-99\n# /link unit # clarified.\n10-Jul-01\nKeyence PLCS KV-300 uses same protocol\n20-Jan-03\nAdded new I/O Area sizes, and new IEEE754 float type.\n22-Aug-03\nRevisions by NHP included, thanks\n30-Aug-05\nAdded BCD32 support.\n22-Jul-09\nAdded Extended Memory Area Capabilities"}, {"title": "OPC Client", "href": "drivers_html/OPC_Client.html", "category": "Drivers", "rel": "drivers_html/OPC_Client.html", "kind": "Driver", "text": "[Page 3]\nATQMS-DRVR-DOC-OPC_CL.docx\nP a g e | 3\n1.\nOverview ............................................................................................................................................. 4\n1.1.\nSupported Hardware ....................................................................................................................... 4\n2.\nDevice Configuration .......................................................................................................................... 6\n2.1.\nDriver Installation and Setup ............................................................................................................ 6\n2.2.\nDevice Configuration ....................................................................................................................... 6\n2.2.1.\nDevice Configuration ................................................................................................................................. 6\n2.3.\nAdvanced Settings Dialog ................................................................................................................ 6\n3.\nProtocol Definition and Considerations .............................................................................................. 9\n3.1.\nScanning Configuration .................................................................................................................... 9\n3.2.\nResetting and Switching Connections ............................................................................................... 9\n3.3.\nMessage Protocol ............................................................................................................................ 9\n3.4.\nSecurity ........................................................................................................................................ 10\n3.4.1.\nDCOM Configuration................................................................................................................................. 10\n3.4.2.\nWindows 10 Interface .............................................................................................................................. 10\n4.\nGeneral Notes and Troubleshooting ................................................................................................. 13\n4.1.\nContact Details .............................................................................................................................. 13\n4.2.\n4.3.\nTroubleshooting ............................................................................................................................ 13\n5.\nAppendix A - OPC Server Notes ........................................................................................................ 15\n5.1.\nSpecific OPC Servers ..................................................................................................................... 15\n6.\nAppendix B - DCOM Hardening ......................................................................................................... 17\n6.1.\nBackground .................................................................................................................................. 17\n6.2.\nDCOM Hardening .......................................................................................................................... 17\n7.\nAppendix C – Terminology ................................................................................................................ 19\n8.\nRevisions ........................................................................................................................................... 20\n8.1.\nDocument Revision........................................................................................................................ 20\n8.2.\nDLL Revision ................................................................................................................................. 20\n\n[Page 4]\nATQMS-DRVR-DOC-OPC_CL.docx\nP a g e | 4\n1.\nOverview\nOPC (OLE for Process Control) is a standard specification that makes it possible for\nautomation/control software applications and field systems/devices to interoperate and\ncommunicate data between each other.\nTo learn more about what OPC is, visit the OPC foundation website http://www.opcfoundation.org/\nThe OPC Client driver for Adroit communicates to OPC servers that expose at least the OPC DA\nCustom Interface Version 1.0A. The driver is compatible with OPC DA Version 2.0. As of revision\n56 of the driver, it is not version 3.0 compatible.\nPLEASE NOTE\nIt is very important that Adroit users updating to revision 56 of the OPC client driver re-check\nall their OPC client device settings as things have changed since.\nRead especially the setting “Override default DCOM security (for callbacks)” below. By default,\nolder versions of this driver had this setting hardcoded as enabled.\nAlso make a note of newly introduced settings (such as “auto recovery”) and make sure you\nunderstand what is being provided for in this new version. “Auto recovery” was not a feature\navailable in older versions of the driver.\n1.1.\nSupported Hardware\nThis is equipment & vendor specific, installation instructions for specific OPC Servers is beyond the\nintended scope of this document, however notes on specific differences have been included. OPC\nServers supporting version 2.0 of the OPC interface allow remote connections to servers as well as\nlocal OPC server connections.\nPlease see the section on “Specific OPC Servers”, which covers differences experienced between\ncommonly encountered OPC Servers.\n\n[Page 6]\nATQMS-DRVR-DOC-OPC_CL.docx\nP a g e | 6\n2.\nDevice Configuration\n2.1.\nDriver Installation and Setup\nThe driver is installed in Adroit by default. If not, you will need to install it via the “Drivers” tab and\nclick on “Add” in Adroit setup. The opc_cl.dll and the opc_cl.doc are then copied into the agent\ndirectory.\n2.2.\nDevice Configuration\n2.2.1. Device Configuration\nThe configuration of an OPC client device has only three basic items of configuration for a connection.\nThese are:\nRemote or local\nIf remote, name of remote host (or PC)\nThe name of the OPC Server to connect to\nAs with most Adroit protocol drivers, you can also specify a secondary (or backup) connection.\nEnable\nSecondary\nEnables secondary configuration for dual redundant OPC Server Connecti
