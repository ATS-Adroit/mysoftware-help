const CHAT_HELP = "https://www.chatbase.co/bpKc860rs1HM9DVnPTzxo/help";
const ITEMS = [{"title": "ATQMS-MKTG-DOC-ADR-Best-Practises", "href": "best_practice_html/ATQMS-MKTG-DOC-ADR-Best-Practises.html", "category": "Best Practices", "rel": "best_practice_html/ATQMS-MKTG-DOC-ADR-Best-Practises.html", "kind": "Best Practice", "text": "[Page 5]\nATQMS-MKTG-DOC-ADR_Best Practises.docx\nP a g e | 4\n1. Introduction\nThis document serves as a basis against which any Adroit SCADA project can be specified and designed.\nWhilst it covers all the necessary standards for implementation it is intended to stimulate forethought\nand discussion with respect to the project requirements in order to ensure a successful project.\nIt is important to have an understanding of the following before proceeding:\nSystem Architecture\nRecommended Hardware & Software\nNetwork Requirements\nLicensing\nFor information on the above topics, please download the relevant documentation available here.\n2. Pre-Configuration\nBefore work can begin on the SCADA project, the engineer will need to understand the user\nrequirements.\n2.1. Documentation\nIn an Adroit SCADA project, documentation is essential in ensuring system maintainability and safety.\nGiven the complexity and critical nature of SCADA systems accurate documentation provides a clear\nunderstanding of system architecture, configurations, communication protocols, and operational\nprocedures. It supports efficient troubleshooting, facilitates future upgrades, and ensures compliance\nwith industry standards and regulatory requirements. Ultimately, comprehensive documentation is key\nto minimizing downtime, enhancing security, and enabling seamless collaboration among engineering,\noperations, and maintenance teams. It is recommended that the following documents are essential to\na successful completion of the solution.\n2.1.1. User Requirements Specification (URS)\nA URS is a description of the SCADA system to be developed and is created by the end user. It lays out\nfunctional and non-functional requirements and may include a set of use cases that describe user\ninteractions that the software must provide.\n2.1.2. Functional Design Specification (FDS)\nAn FDS is a formal document used to describe in detail the SCADA's intended capabilities, appearance,\nand interactions with users. The functional specification is a kind of guideline and continuing reference\npoint for the SCADA engineer as he develops the operations and activities that the system must be able\nto perform and define how to meet the User Requirement (see User Requirements Specification).\n2.1.3. SCADA Input Output Schedule (I/O Schedule)\nAn I/O schedule is a spreadsheet that lists all PLC and internal addresses that are required in the\nSCADA. The I/O Schedule, typically presented as a spreadsheet, should contain the following columns:\nPLC memory address\nPLC data type\nAgent type\nAgent name\nDevice minimum and maximum values\nEngineering minimum and maximum values\nAlarm set points\nIs data logging required?\nAlarm Type\n\n[Page 7]\nATQMS-MKTG-DOC-ADR_Best Practises.docx\nP a g e | 6\n2.2.5. Regional Settings\nAll Agent Servers and Operator stations are required to have the same regional settings.\nBelow is an example of regional settings that need to be considered. If a property is not listed, then\nthe default value to be used.\nLanguage\nName\nEnglish (South Africa)\nHeadings\nGrey\nStatic and Dynamic Labels\nWhite\nSetpoints\nNumbers\nName\nNo. of digits after decimal\nList separator\n, (comma)\nTime\nName\nDate\nName\ndddd, dd MMMM yyyy\nFirst day of week\nMonday\n2.2.6. Microsoft .NET Framework\nAdroit requires the latest Microsoft .NET framework.\n2.2.7. Web Service (Optional)\nIf any of the Adroit Smart UI web services are to be used then the IIS (Internet Information Services)\nWeb Service component must be installed on the server.\n2.2.8. Time Synchronisation Settings\nTime synchronisation is critical for all Operational Technology (OT) assets in a SCADA system because\nit ensures that data across all devices, such as Agent Servers, Operators (workstations), and field\ndevices, are accurately time-stamped and aligned. Without synchronised time, discrepancies in data\nlogs, alarms, and trend histories can occur, leading to misinterpretation of events, troubleshooting\ndifficulties, and unreliable reports.\nFor example, if an operator's workstation clock is ahead of the Agent Server's, data may appear \"in the\nfuture\" and become greyed out, compromising real-time visibility and historical analysis. Therefore,\nsynchronised time is essential for system integrity, event correlation, and effective decision-making.\n\n[Page 8]\nATQMS-MKTG-DOC-ADR_Best Practises.docx\nP a g e | 7\n2.3. Security\nApplication of security is a very important aspect of a modern SCADA/HMI. Adroit security is fully\nintegrated into the Windows security model and a thorough working knowledge of Microsoft security is\nimportant.\nThe security model should be used to manage access to the system configuration, define who can do\nwhat on the system.\nUser security in Adroit makes use of either a Windows Domain controller or the Windows local security.\n2.3.1. Security Groups and Rights\nAll groups will be added to the local security model on the severs and the domain user will be added to\nthe required groups on the local servers. An associated profile will be configured for each group. The\nprofile configuration can be found in the Profiles chapter.\nNOTE : User cannot belong to multiple allowed groups used with in the Smart UI.\nBelow are the common levels of security groups that can be implemented.\n2.3.2. Software Administrator\nHighest access level, typically system architects and engineering administrators. All administrators are\nnot groups but users. All these users should be added to the local Administrators Group on the Agent\nServer machines. This Group generally has complete and full access to the Adroit SCADA.\n2.3.3. Supervisor\nApplies to technician/maintenance level personnel.\n2.3.4. Process Controller\nApplies to the operators of the process. Effecting control and monitoring the system from the Operator\nworkstation's.\n2.3.5. Viewer\nThese users are limited to monitoring the process, but not allowed to functionally operate a process\nor perform actions such as Stop/Start or change the process parameters at all.\nSecurity Matrix Example\nThe following are a list of functions and actions on the enterprise solution and which groups have access\nto said functions and actions.\nFunctions/Actions\nSoftware\nNavigation level 1 (Overview)\nNavigation level 2 (Area)\nX\nNavigation level 3 (Device Details)\nX\nNavigation level 4 (SP and control)\nX\nX\n\n[Page 15]\nATQMS-MKTG-DOC-ADR_Best Practises.docx\nP a g e | 14\n4.1.1. Agent Server Configuration\nNaming of the items below will be derived using the defined Naming Convention.\nAgent Server type\nProject name\nCluster name\n4.1.2. Advanced Agent Server Configuration\nThe Global OLE DB connection string will be set to a SQL Server instance database. This connection\nstring can be used by all Agents that require a SQL connection like the DBLog Agents, OEE Agent, Shift\nAgent and the Alarm Management Agent.\n4.1.3. Driver Configuration\nA mix of different protocols can be used to communicate to the PLC/FED hardware. When creating an\ninstance of the protocol, called a device, the engineer should use the defined Naming Convention.\nThe Agent Server (AS) contains the 3 main functions of a SCADA IO Server:\nScanning\nData Logging\n5.1. Adding an instance of an Agent\nEach Agent type instance will need a unique name. Naming of the Agents will be derived using the\ndefined Naming Convention.\nAll names and abbreviation will also be documented in the IO Schedule document.\n5.2. Scanning Strategy\nThis is a critical aspect of setting up any Adroit system. It is important to plan the PLC addressing and\nAreas to be used up front so that the communications driver fetches \"blocks\" of data rather than\ncommunicating to many different and separated address within a PLC.\nNOTE: This is more critical for large, complex sites. However, it is an important aspect of any project configuration.\nOther considerations:\nPut all reporting data into addresses of the same type and are contiguous.\nPut all data for fast scanning, slow scanning in contiguous areas\n5.2.1. Scanning sub-system\nFigure 2 - Scanning subsystem - Solicited/Polled Driver Architecture\n\n[Page 16]\nATQMS-MKTG-DOC-ADR_Best Practises.docx\nP a g e | 15\n5.2.2. Factors Affecting Scanning Performance\nBandwidth and other medium-specific issues.\nThe number of devices per communications channel.\nTotal number of transactions required to refresh each device on the network - contiguous data\npacking.\nThe frequency of transactions (Scan Rate).\n5.2.3. Calculating the Scan Period\nIt is very easy to oversubscribe (scan) to data, there are limitations to any communications medium,\nthe document will assume serial-based communications, as it's the one most easily overestimated.\nA few assumptions will have to be made:\nThe total number of Outstations/PLC's/FED's on the network.\nThe total number of I/O scan tasks per outstation (approx.) and their size in characters (approx.)\nApproximate/Average turnaround time for a transaction. (see diagram)\nNetwork characteristics such as baud rates/bandwidth etc.\nAssume for the ideal case, i.e. No errors, retries, pre-transmission delays, latency delays etc.\nFigure 3 - Scanning transaction time\nExample - Serial Communication Calculation\n9600 baud rate, 60 outstations, 2 (100 chars) Transactions per outstation per refresh, and a total\nturnaround of 300 milliseconds per transaction. The 100 chars referred to above includes the request and\nresponse and any acknowledgements.\n9600 allows 1 bit every 0.0001 seconds, assuming 1 start bit and 2 stop bits, 11 bits per character, means\n~872 characters per second on the channel if the channel runs at maximum. 60 (outstations) x 2\n(transactions) x 100 (chars) = 12000 chars to refresh the entire network. 12000 (chars in total) / 872\n(channel config max) = 13.72 Seconds to refresh the entire network at maximum channel capacity.\n100 characters per transaction roughly use 114 milliseconds network time but there will be a turnaround\ntime conservatively assumed above as 300 milliseconds thus: 300 * 120 (total network transactions) =\n36 seconds to refresh the entire network.\nNow this means if every transaction is an equal priority and assuming no errors, delays, or pre-transmission\ndelays etc. no scan rate should exceed 36 seconds.\nImplement the following solutions, to shorten the scan rate:\nAdd additional 3 channels, the network update time will now be 9 Seconds.\nPrioritise scan tasks, use a slower scan rate for data that updates slower in the field, e.g.\nreservoir levels (e.g. Integrity polls), high priority data faster (e.g. Digital status indications).\nUse an exception based protocol where the fastest way to get a change of state data is via\nUnsolicited transactions. Then the other data is divided up into priorities just like option 2\nabove.\nEvery effort is to be made when drawing up the I/O schedule of the PLC/SCADA and to define logical and\ncontiguous data areas to be scanned from Devices. This makes for efficient, reliable and fast scanning.\nTake note of the driver documentation that will assist in creating an optimum scanning (and hence\n\n[Page 18]\nATQMS-MKTG-DOC-ADR_Best Practises.docx\nP a g e | 17\n5.4. Alarming Strategy\nAn effective SCADA alarming strategy is essential for ensuring safe, efficient, and reliable operation of\nindustrial systems. Alarms serve as critical indicators that notify operators of abnormal conditions or\npotential issues within the process. A well-designed strategy helps prioritize alarms based on severity,\noperational impact, enabling timely and appropriate responses. It also reduces alarm fatigue by\nminimizing nuisance or irrelevant alarms, ensuring that only meaningful and actionable alerts reach the\noperator. The strategy should include clear guidelines for alarm configuration, categorization, and\nresponse procedures, as well as ongoing evaluation and optimization. By implementing a structured\nand thoughtful alarming strategy, organizations can improve situational awareness, reduce downtime,\nand enhance overall process safety and performance.\nA 5-tier priority alarming strategy can be used as a startin"}, {"title": "ATQMS-MKTG-DOC-MAPS-Best-Practises", "href": "best_practice_html/ATQMS-MKTG-DOC-MAPS-Best-Practises.html", "category": "Best Practices", "rel": "best_practice_html/ATQMS-MKTG-DOC-MAPS-Best-Practises.html", "kind": "Best Practice", "text": "[Page 4]\nATQMS-MKTG-DOC-MAPS4 - Best Practises.docx\nP a g e | 3\n1. Introduction\nThis document servers as a basis against which any SCADA project can be specified and designed.\nWhilst it covers all the necessary standards for implementation it is intended to stimulate forethought\nand discussion with respect to the customer requirements and the process environment and how these\nwill impact on the architecture, configuration, deployment of a MAPS SCADA project.\n2. Pre-configuration\nBefore work can begin on the SCADA project, the engineer will need to understand the user's\nrequirements.\nTo start with, the engineer will need the following:\n2.1.\nDocumentation\n2.1.1. Input output schedule (I/O Schedule)\nAn I/O schedule is a spreadsheet that lists all PLC inputs and outputs that are required in the SCADA.\nThe I/O Schedule should contain the following columns:\nPLC memory address\nPLC data type\nAgent name\nAgent description\nDevice minimum and maximum values\nEngineering minimum and maximum values\nAlarm set points\nIs data logging required\nAlarm Type\n2.1.2. User Requirements Specification (URS)\nA URS is a description of the SCADA system to be developed and is created with the end user. It lays\nout functional and non-functional requirements and may include a set of use cases that describe user\ninteractions that the software must provide.\n2.1.3. Functional Design Specification (FDS)\nAn FDS is a formal document used to describe in detail the SCADA's intended capabilities, appearance,\nand interactions with users. The functional specification is a kind of guideline and continuing reference\npoint for the SCADA engineer as he develops the operations and activities that the system must be able\nto perform and define how to meet the User Requirement (see User Requirements Specification).\n\n[Page 6]\nATQMS-MKTG-DOC-MAPS4 - Best Practises.docx\nP a g e | 5\n2.3.\nStandalone System\nFigure 2 - Standalone System Architecture\n2.3.1. Recommended Hardware & Software\nPlease refer to the Hardware & Software Specification document available from our website. Vehicle\nhttps://www.mapsscada.com/downloadsacc/\n2.4.\nNetwork requirements\nMAPS SCADA's minimum requirement for a local area network (LAN), is as follows:\nA minimum of 100 MB ethernet backbone. We recommend a 1gb ethernet connection.\nAll connected devices (including PC network cards and switch ports) to be configured for full\nduplex operation.\nAll connected PC's that have MAPS SCADA (or MAPS SCADA components) installed to be able to\nsee remote MAPS SCADA PC shares.\nProper separation of PLC and control networks. While this is not a requirement for MAPS\nSCADA, this has historically been an important issue on PLC networks whose ethernet cards can\nonly handle 10MB. If such a 10 MB PLC network is flooded with control (or office) network\ntraffic, PLC communications will be compromised. This requires an important understanding\n(and measurement of) PLC network traffic to ascertain whether \"cross-talk\" might be an issue.\nIf a domain name server (DNS), is not available. Then the file\nC:\\Windows\\System32\\drivers\\etc\\hosts will need to be edited on all client and server machines\nto include all the IP addresses and PC/server names. The knowledge base article.\n\n[Page 7]\nATQMS-MKTG-DOC-MAPS4 - Best Practises.docx\nP a g e | 6\nComplete these \"basic\" network tests:\nPing tests of 65500 byte packets should occur without any failures using the ping command as\nfollows: \"ping PC/Server Name -t -l 65500\" The PC/Server name must resolve on the network.\nBrowsing between remote UI and server's file shares via Windows Explorer's Network Folder\nshould not fail or prompted for user authentication.\nThe copying of a large file to and from remote PC's should register a full 100 MB usage on the\nTask Manager's network graph.\nDisconnect the PC from control network and ensure that remote PC shares cannot be accessed\nvia the PLC network connection.\nImportant potential points of failure:\nNetwork card duplex and speed configuration should be checked. \"Auto\" settings are not\nsuitable as Windows may choose to select half duplex modes. It is preferable to enforce full\nduplex selection. Disable any power management in the properties of the network card.\nNetwork switch ports not configured (or running) for full duplex (historically, this has been a\nprevalent issue across many larger installations when receiving and transmitting data).\nPoorly maintained network infrastructure like incorrectly crimped RJ45's or damaged flyleads.\nUse of incorrect Ethernet cable specification for the type of network.\nIncorrectly set share permissions for access by remote PC's.\nIncorrect separation of control and PLC networks. It helps to remove the \"Client for Microsoft\nNetworks\" bindings on PLC adaptor cards.\n2.5.\nNetwork Configuration\nThere are several different ways to configure the communication/network infrastructure for the MAPS\nSCADA product. Four of the main default network layouts are:\nConnecting directly\nThis network architecture is one of the most widely used, and there are no firewalls to configure.\nPlacing a firewall before the SmartUI Server\nThe firewall needs to allow port 9000 communication from the Client to the SmartUI Server\nMAPS Server\nMAPS Server\n\n[Page 9]\nATQMS-MKTG-DOC-MAPS4 - Best Practises.docx\nP a g e | 8\n2.6.\nLicensing\nTypically, the Agent Server is licensed via a HASP software protection key, which is inserted into a USB\nport of the computer on which the Agent Server is running. This HASP is then programmed in\naccordance with your specific license agreement.\nIn situations where it is not possible to use a physical HASP, it is also possible to license MAPS SCADA\nvia a software license. Software licensing is done against the server's hardware so any changes to the\nphysical hardware will invalidate the soft license.\n2.6.1. Version\nHASP's are licensed against versions of MAPS SCADA.\n2.6.2. Scan points\nWhen a PLC address is scanned a Scan point is consumed. For every DBAccess; script; and SNMP agent\na scan points is also consumed.\n2.6.3. Remote Operator/UI\nA remote node licence is required for every client connection.\n2.6.4. OEM\nAdditional components are licensed against the OEM code of the HASP. e.g. Alarm management; Max\nDemand; Siemens Ethernet driver; DNP 3.0 driver.\n2.6.5. Generating licensing\nThe Adtech Licensing Utility allows you to get, view and/or update your MAPS SCADA product license.\nUse the Adtech Licensing Utility to generate a licensing request by launching the application via the\nMAPS SCADA Utility launcher application. By clicking on the icon:\nThen selecting the Adtech Licensing Utility.\nFigure 3 - Adtech Licensing Utility\nSelect ether the HASP or Soft-License update to generate the c2v file. Once the file has been generated\nit can be emailed to MAPS SCADA with the licensing requirements.\n\n[Page 14]\nATQMS-MKTG-DOC-MAPS4 - Best Practises.docx\nP a g e | 13\n4.4.\nScanning\n4.4.1. Scanning sub-system\nFigure 7 - Scanning subsystem - Solicited/Polled Driver Architecture\n4.4.2. Factors affecting scanning performance\nBandwidth and other medium-specific issues.\nThe number of devices per communications channel.\nTotal number of transactions required to refresh each device on the network - contiguous data\npacking\nThe frequency of transactions (Scan Rate).\n4.4.3. Calculating the scan period.\nIt is very easy to oversubscribe (scan) to data, there are limitations to any communications medium -\nthe document will assume serial-based communications, as it is the one most easily overestimated.\nA few assumptions will have to be made:\nThe total number of Outstations on the network.\nThe total number of I/O scan tasks per outstation (approx.) and their size in characters\n(approx.).\nApproximate/Average Turnaround Time for a transaction. (See diagram)\nNetwork characteristics such as baud rates/bandwidth etc.\nAssume for the ideal case, I.e. No errors, retries, pre-transmission delays, latency delays etc.\nFigure 8 - Scanning transaction time\n\n[Page 15]\nATQMS-MKTG-DOC-MAPS4 - Best Practises.docx\nP a g e | 14\nExample - Serial communication calculation\n9600 baud rate, 60 outstations, 2 (100 chars) Transactions per outstation per refresh, and a total\nturnaround of 300 milliseconds per transaction. The 100 chars above includes the request and response\nand any acknowledgements.\n9600 allows 1 bit every 0.0001 seconds, assuming 1 start bit and 2 stop bits, 11 bits per character,\nmeans ~872 characters per second on the channel if the channel runs at maximum. 60 (outstations) x\n2 (transactions) x 100 (chars) = 12000 chars to refresh the entire network. 12000 (chars in total) / 872\n(channel config max) = 13.72 Seconds to refresh the entire network at maximum channel capacity.\n100 characters per transaction roughly use 114 milliseconds network time but there will be a turnaround\ntime conservatively assumed above as 300 milliseconds thus: 300 * 120 (total network transactions) =\n36 seconds to refresh the entire network.\nNow this means if every transaction is an equal priority and assuming no errors, delays, or pretransmission delays etc. no scan rate should exceed 36 seconds.\nImplement the following solutions, to shorten the scan rate:\nAdd additional 3 channels, the network update time will now be 9 Seconds.\nPrioritise scan tasks, use a slower scan rate for data that updates slower in the field, e.g.\nreservoir levels (e.g. Integrity polls), high priority data faster (e.g. Digital status indications).\nUse an exception based protocol where the fastest way to get a change of state data is via\nUnsolicited transactions. Then the other data is divided up into priorities just like option 2\nabove.\nEvery effort is to be made when drawing up the I/O schedule of the PLC/SCADA and to define logical\nand contiguous data areas to be scanned from Devices. This makes for efficient, reliable and fast\nscanning.\nTake note of the driver documentation that will assist in creating an optimum scanning (and hence\nperformance) of the MAPS SCADA scanning system."}];

}

function getUI(it) {
  if (it.ui) return normalise(it.ui);
  const c = normalise(it.category || "");
  if (c.startsWith("classic ui - ")) return "classic ui";
  if (c.startsWith("smart ui - ")) return "smart ui";
  return "";
}

function getQ() {
  return document.getElementById("q").value || "";
}

function getInitialCategory() {
  try {
    return new URLSearchParams(window.location.search).get("cat") || "";
  } catch (e) {
    return "";
  }
}

function addParamsToHref(href, q) {
  try {
    let parts = href.split("#");
    let base = parts[0];
    let frag = parts.length > 1 ? "#" + parts.slice(1).join("#") : "";

    let qp = new URLSearchParams();
    if (q) qp.set("q", q);
    let qs = qp.toString();
    if (!qs) return base + frag;
    let joiner = base.includes("?") ? "&" : "?";
    return base + joiner + qs + frag;
  } catch (e) {
    return href;
  }
}

function freshChatHref() {
  try {
    const u = new URL(CHAT_HELP, window.location.href);
    u.searchParams.set("_t", String(Date.now()));
    return u.toString();
  } catch (e) {
    const sep = CHAT_HELP.includes("?") ? "&" : "?";
    return CHAT_HELP + sep + "_t=" + Date.now();
  }
}

function syncQuickFilterButtons() {
  const active = document.getElementById("cat").value;
  const productBtn = document.getElementById("filter-product-manuals");
  const supportBtn = document.getElementById("filter-supporting-docs");
  if (productBtn) productBtn.classList.toggle("active", active === "Product Manuals");
  if (supportBtn) supportBtn.classList.toggle("active", active === "Supporting Docs");
}

const chatLink = document.querySelector('[data-chat-help="1"]');
if (chatLink) {
  chatLink.href = freshChatHref();
  chatLink.addEventListener("click", () => {
    chatLink.href = freshChatHref();
  });
}

function render() {
  const qRaw = getQ();
  const q = normalise(qRaw);
  const ui = normalise(document.getElementById("ui").value);
  const cat = document.getElementById("cat").value;
  const mode = document.getElementById("mode").value;

  let filtered = ITEMS.filter(it => {
    if (ui && getUI(it) !== ui) return false;
    if (cat && it.category !== cat) return false;
    if (!q) return true;
    const hay = normalise(it.title + " " + it.rel + " " + it.category + " " + (it.text || ""));
    return hay.includes(q);
  });

  filtered.sort((a,b) => a.title.localeCompare(b.title));

  document.getElementById("counts").textContent =
    `${filtered.length} item(s) shown (of ${ITEMS.length}).`;
  syncQuickFilterButtons();

  const host = document.getElementById("results");
  host.innerHTML = "";

  const makeItemHtml = (it) => {
    const kind = it.kind ? ` <span class="small">[${it.kind}]</span>` : "";
    const href = addParamsToHref(it.href, qRaw.trim());
    return `<a href="${href}">${it.title}</a><span class="small">[${it.category}]</span>${kind}`;
  };

  if (mode === "alpha") {
    const ul = document.createElement("ul");
    filtered.forEach(it => {
      const li = document.createElement("li");
      li.innerHTML = makeItemHtml(it);
      ul.appendChild(li);
    });
    host.appendChild(ul);
    return;
  }

  if (mode === "ui") {
    const byUI = new Map();
    filtered.forEach(it => {
      const ui = getUI(it) || "other ui";
      if (!byUI.has(ui)) byUI.set(ui, []);
      byUI.get(ui).push(it);
    });

    const uis = Array.from(byUI.keys()).sort((a,b)=>a.localeCompare(b));
    uis.forEach(u => {
      const div = document.createElement("div");
      div.className = "group";
      const label = u === "other ui" ? "Other UI" : (u === "classic ui" ? "Classic UI" : "Smart UI");
      div.innerHTML = `<h2>${label}</h2>`;
      const ul = document.createElement("ul");
      byUI.get(u).forEach(it => {
        const li = document.createElement("li");
        const href = addParamsToHref(it.href, qRaw.trim());
        const kind = it.kind ? ` <span class="small">[${it.kind}]</span>` : "";
        li.innerHTML = `<a href="${href}">${it.title}</a>${kind}`;
        ul.appendChild(li);
      });
      div.appendChild(ul);
      host.appendChild(div);
    });
    return;
  }

  const byCat = new Map();
  filtered.forEach(it => {
    if (!byCat.has(it.category)) byCat.set(it.category, []);
    byCat.get(it.category).push(it);
  });

  const cats = Array.from(byCat.keys()).sort((a,b)=>a.localeCompare(b));
  cats.forEach(c => {
    const div = document.createElement("div");
    div.className = "group";
    div.innerHTML = `<h2>${c}</h2>`;
    const ul = document.createElement("ul");
    byCat.get(c).forEach(it => {
      const li = document.createElement("li");
      const href = addParamsToHref(it.href, qRaw.trim());
      const kind = it.kind ? ` <span class="small">[${it.kind}]</span>` : "";
      li.innerHTML = `<a href="${href}">${it.title}</a>${kind}`;
      ul.appendChild(li);
    });
    div.appendChild(ul);
    host.appendChild(div);
  });
}

function initCats() {
  const select = document.getElementById("cat");
  const cats = uniq(ITEMS.map(x => x.category)).sort((a,b)=>a.localeCompare(b));
  cats.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    select.appendChild(opt);
  });

  const initialCat = getInitialCategory();
  if (initialCat && cats.includes(initialCat)) {
    select.value = initialCat;
  }
}

["q","ui","cat","mode"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});

document.getElementById("clear").addEventListener("click", () => {
  document.getElementById("q").value = "";
  document.getElementById("ui").value = "";
  document.getElementById("cat").value = "";
  document.getElementById("mode").value = "alpha";
  render();
});

function bindQuickFilterButton(id, category) {
  const btn = document.getElementById(id);
  if (!btn) return;
  const hasCategory = ITEMS.some(it => it.category === category);
  if (!hasCategory) {
    btn.disabled = true;
    btn.title = `No ${category} items on this page`;
    return;
  }
  btn.addEventListener("click", () => {
    const select = document.getElementById("cat");
    select.value = (select.value === category) ? "" : category;
    render();
  });
}

bindQuickFilterButton("filter-product-manuals", "Product Manuals");
bindQuickFilterButton("filter-supporting-docs", "Supporting Docs");

initCats();
render();
</script>
<script>
(function() {
  var storageKey = "help_theme";
  function preferredTheme() {
    try {
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    } catch (e) {
      return "light";
    }
  }
  function applyTheme(t) {
    if (t === "dark" || t === "light") {
      document.documentElement.setAttribute("data-theme", t);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }
  function getSaved() {
    try { return localStorage.getItem(storageKey) || ""; } catch (e) { return ""; }
  }
  function setSaved(t) {
    try { localStorage.setItem(storageKey, t); } catch (e) {}
  }
  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") || preferredTheme();
  }
  function updateLabels() {
    var cur = currentTheme();
    var label = (cur === "dark") ? "Light mode" : "Dark mode";
    document.querySelectorAll(".theme-toggle").forEach(function(btn) {
      btn.textContent = label;
    });
  }
  function toggleTheme() {
    var cur = currentTheme();
    var next = (cur === "dark") ? "light" : "dark";
    applyTheme(next);
    setSaved(next);
    updateLabels();
  }
  function bind() {
    document.querySelectorAll(".theme-toggle").forEach(function(btn) {
      btn.addEventListener("click", function() {
        toggleTheme();
      });
    });
    updateLabels();
  }
  var saved = getSaved();
  applyTheme(saved || preferredTheme());
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bind);
  } else {
    bind();
  }
})();
</script>

</div>
