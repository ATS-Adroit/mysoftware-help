vers as a basis against which any SCADA project can be specified and designed. Whilst it covers all the necessary standards for implementation it is intended to stimulate forethought and discussion with respect to the customer requirements and the process environment and how these will impact on the architecture, configuration, deployment of a MAPS SCADA project. 2. Pre-configuration Before work can begin on the SCADA project, the engineer will need to understand the user’s requirements. To start with, the engineer will need the following: 2.1. Documentation 2.1.1. Input output schedule (I/O Schedule) An I/O schedule is a spreadsheet that lists all PLC inputs and outputs that are required in the SCADA. The I/O Schedule should contain the following columns: • PLC memory address • PLC data type • Agent name • Agent description • Agent type • Device minimum and maximum values • Engineering minimum and maximum values • Alarm set points • Is data logging required • Alarm Type 2.1.2. User Requirements Specification (URS) A URS is a description of the SCADA system to be developed and is created with the end user. It lays out functional and non-functional requirements and may include a set of use cases that describe user interactions that the software must provide. 2.1.3. Functional Design Specification (FDS) An FDS is a formal document used to describe in detail the SCADA’s intended capabilities, appearance, and interactions with users. The functional specification is a kind of guideline and continuing reference point for the SCADA engineer as he develops the operations and activities that the system must be able to perform and define how to meet the User Requirement (see User Requirements Specification). __________________________________________________________________________________________________________ ATQMS-MKTG-DOC-MAPS4 - Best Practises.docx P a g e | 4 2.2. System Architecture 2.2.1. Distributed System Figure 1 – Distributed System Architecture 2.2.2. Recommend const SELF = "best_practices";
const ADD_FROM = true;

function uniq(arr) {
  return [...new Set(arr)];
}

function normalise(s) {
  return (s || "").toLowerCase();
}

function getQ() {
  return document.getElementById("q").value || "";
}

function addParamsToHref(href, q, from) {
  try {
    let parts = href.split("#");
    let base = parts[0];
    let frag = parts.length > 1 ? "#" + parts.slice(1).join("#") : "";

    let joiner = base.includes("?") ? "&" : "?";
    let qp = new URLSearchParams();
    if (q) qp.set("q", q);
    if (ADD_FROM && from) qp.set("from", from);

    return base + joiner + qp.toString() + frag;
  } catch (e) {
    return href;
  }
}

function freshChatHref() {
  try {
    const u = new URL(CHAT_HELP, window.location.href);
    u.searchParams.set("_t", String(Date.now()));
    return u.toString();
  } catch (e) {
    const sep = CHAT_HELP.includes("?") ? "&" : "?";
    return CHAT_HELP + sep + "_t=" + Date.now();
  }
}

const chatLink = document.querySelector('[data-chat-help="1"]');
if (chatLink) {
  chatLink.href = freshChatHref();
  chatLink.addEventListener("click", () => {
    chatLink.href = freshChatHref();
  });
}

function render() {
  const qRaw = getQ();
  const q = normalise(qRaw);
  const cat = document.getElementById("cat").value;
  const mode = document.getElementById("mode").value;

  let filtered = ITEMS.filter(it => {
    if (cat && it.category !== cat) return false;
    if (!q) return true;
    const hay = normalise(it.title + " " + it.rel + " " + it.category + " " + (it.text || ""));
    return hay.includes(q);
  });

  filtered.sort((a,b) => a.title.localeCompare(b.title));

  document.getElementById("counts").textContent =
    `${filtered.length} item(s) shown (of ${ITEMS.length}).`;

  const host = document.getElementById("results");
  host.innerHTML = "";

  const makeItemHtml = (it) => {
    const kind = it.kind ? ` <span class="small">[${it.kind}]</span>` : "";
    const href = addParamsToHref(it.href, qRaw.trim(), SELF);
    return `<a href="${href}">${it.title}</a><span class="small">[${it.category}]</span>${kind}`;
  };

  if (mode === "alpha") {
    const ul = document.createElement("ul");
    filtered.forEach(it => {
      const li = document.createElement("li");
      li.innerHTML = makeItemHtml(it);
      ul.appendChild(li);
    });
    host.appendChild(ul);
    return;
  }

  const byCat = new Map();
  filtered.forEach(it => {
    if (!byCat.has(it.category)) byCat.set(it.category, []);
    byCat.get(it.category).push(it);
  });

  const cats = Array.from(byCat.keys()).sort((a,b)=>a.localeCompare(b));
  cats.forEach(c => {
    const div = document.createElement("div");
    div.className = "group";
    div.innerHTML = `<h2>${c}</h2>`;
    const ul = document.createElement("ul");
    byCat.get(c).forEach(it => {
      const li = document.createElement("li");
      const href = addParamsToHref(it.href, qRaw.trim(), SELF);
      const kind = it.kind ? ` <span class="small">[${it.kind}]</span>` : "";
      li.innerHTML = `<a href="${href}">${it.title}</a>${kind}`;
      ul.appendChild(li);
    });
    div.appendChild(ul);
    host.appendChild(div);
  });
}

function initCats() {
  const select = document.getElementById("cat");
  const cats = uniq(ITEMS.map(x => x.category)).sort((a,b)=>a.localeCompare(b));
  cats.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    select.appendChild(opt);
  });
}

["q","cat","mode"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});

document.getElementById("clear").addEventListener("click", () => {
  document.getElementById("q").value = "";
  document.getElementById("cat").value = "";
  document.getElementById("mode").value = "alpha";
  render();
});

initCats();
render();
</script>
